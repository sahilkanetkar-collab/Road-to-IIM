var QUESTIONS=[{"id":"Q01","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"The professor's lectures were notoriously ____; students had to sit through an hour of digressions to find a single useful point.","options":["terse","discursive","pithy","compendious"],"answer":"discursive","answerIndex":1,"difficulty":"easy","explanation":"Answer: discursive = wandering from topic to topic. An hour of digressions is exactly that. Terse and pithy both mean brief and to the point — the opposite. The trap is 'compendious': it sounds like 'long and bulky', but it actually means concise yet complete, so it would praise the lectures.","verified":"ok","status":"approved"},{"id":"Q02","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"The committee's report merely ____ the real problem: it praised the staff and said nothing about the shortage of funds.","options":["fell through","got to the bottom of","cut corners on","papered over"],"answer":"papered over","answerIndex":3,"difficulty":"easy","explanation":"Answer: papered over = hid a problem on the surface without solving it. Praising the staff while ignoring the funding shortage is a cover-up. 'Got to the bottom of' = found the real cause — the opposite. 'Fell through' = failed to happen (a plan falls through); it cannot take an object. The trap is 'cut corners on' = did something cheaply or carelessly to save effort; the report is careless, but the point is that it concealed the problem.","verified":"ok","status":"approved"},{"id":"Q03","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"It is high time the government ____ this outdated law.","options":["repealed","repeals","should repeal","has repealed"],"answer":"repealed","answerIndex":0,"difficulty":"easy","explanation":"Answer: repealed. 'It is high time' is followed by the past tense, even though the meaning is present or future: the past form signals that the action is overdue. The trap is 'should repeal', an over-correction that sounds formal and polite. 'Repeals' and 'has repealed' follow ordinary present-tense logic and ignore the fixed pattern.","verified":"ok","status":"approved"},{"id":"Q04","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'APPRISE' correctly?","options":["The jeweller apprised the necklace at two lakh rupees.","The manager will apprise your work in the annual review.","Kindly apprise me of any change in the schedule.","Experts were called to apprise the damaged painting."],"answer":"Kindly apprise me of any change in the schedule.","answerIndex":2,"difficulty":"easy","explanation":"Answer: C. Apprise = to inform someone (apprise me of any change). A, B and D all need 'appraise' = to judge the value or quality of something (appraise a necklace, a performance, a painting). The trap is the one-letter difference. Tip: you appraise a thing; you apprise a person of a fact.","verified":"ok","status":"approved"},{"id":"Q05","section":"VA","format":"Pronouns","kind":"mcq","td":35,"stem":"The principal and ____ will judge the inter-school debate.","options":["myself","I","me","mine"],"answer":"I","answerIndex":1,"difficulty":"easy","explanation":"Answer: I. The pronoun is part of the subject of 'will judge', so it takes the subject form. Test it by removing 'The principal and': 'I will judge.' The trap is 'myself', an over-correction that sounds polite and formal; a reflexive pronoun needs a matching 'I' earlier in the sentence. 'Me' is the object form. 'Mine' is possessive.","verified":"ok","status":"approved"},{"id":"Q06","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"A remedy for all diseases or problems","options":["panacea","placebo","antidote","palliative"],"answer":"panacea","answerIndex":0,"difficulty":"easy","explanation":"Answer: panacea (pan = all). Placebo = a fake medicine that works only because the patient believes in it. Antidote = a remedy against one specific poison — the trap, because it is a cure, but not a cure for everything. Palliative = something that eases symptoms without curing the cause.","verified":"ok","status":"approved"},{"id":"Q07","section":"VA","format":"Modifiers","kind":"mcq","td":35,"stem":"Which sentence is correctly worded?","options":["I saw a dead snake driving to Lonavala.","Driving to Lonavala, a dead snake lay on the road.","A dead snake was seen by me while driving to Lonavala.","Driving to Lonavala, I saw a dead snake on the road."],"answer":"Driving to Lonavala, I saw a dead snake on the road.","answerIndex":3,"difficulty":"easy","explanation":"Answer: D. 'Driving to Lonavala' must sit next to the person driving — 'I'. A is the trap: it sounds natural in speech, but the phrase sits right after 'snake', so the snake is driving. B makes the snake the driver outright. C puts 'by me' in the sentence but still attaches 'driving' to the snake.","verified":"ok","status":"approved"},{"id":"Q08","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Far from being ____, the new tax rules have confused even seasoned chartered accountants.","options":["labyrinthine","convoluted","perspicuous","abstruse"],"answer":"perspicuous","answerIndex":2,"difficulty":"easy","explanation":"Answer: perspicuous = clearly expressed, easy to understand. 'Far from being' flips the meaning: the rules confused experts, so they were NOT clear. Labyrinthine (maze-like), convoluted (twisted, complicated) and abstruse (hard to understand) all describe what the rules actually are — the trap for students who match the blank to 'confused' and miss the 'far from'.","verified":"ok","status":"approved"},{"id":"Q09","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"The much-hyped product launch turned out to be ____: barely fifty people turned up.","options":["a damp squib","a wet squib","a red-letter day","a cakewalk"],"answer":"a damp squib","answerIndex":0,"difficulty":"easy","explanation":"Answer: a damp squib = an event that fails to live up to expectations (a squib is a small firework; a damp one fizzles). 'A wet squib' is the trap — a corrupted form with a synonym swapped in. 'A red-letter day' = a memorable, happy day — the opposite. 'A cakewalk' = something very easy, which says nothing about disappointment.","verified":"ok","status":"approved"},{"id":"Q10","section":"VA","format":"Prepositions","kind":"mcq","td":35,"stem":"The selection panel ____ five former Test players.","options":["comprises of","comprises","is comprised by","consists"],"answer":"comprises","answerIndex":1,"difficulty":"easy","explanation":"Answer: comprises. 'Comprise' means 'consist of', so it takes no preposition: the panel comprises five players. The trap is 'comprises of', a very common error made by mixing 'comprises' with 'consists of'. 'Consists' without 'of' is the reverse mistake. 'Is comprised by' uses the wrong preposition.","verified":"ok","status":"approved"},{"id":"Q11","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The root 'loqu' means 'speak'. Which word means 'the habit of talking in one's sleep'?","options":["circumlocution","colloquy","ventriloquism","somniloquy"],"answer":"somniloquy","answerIndex":3,"difficulty":"easy","explanation":"Answer: somniloquy (somnus = sleep + loqu = speak). Circumlocution = talking around a point in too many words. Colloquy = a formal conversation. The trap is ventriloquism = speaking so that the voice seems to come from somewhere else; students link the 'strange speaking' idea to sleep talk.","verified":"ok","status":"approved"},{"id":"Q12","section":"VA","format":"Parallelism","kind":"mcq","td":35,"stem":"The judge asked the witness whether she had seen the accused, when she had seen him and ____.","options":["what was he wearing","his clothes","what he had been wearing","what had he been wearing then"],"answer":"what he had been wearing","answerIndex":2,"difficulty":"easy","explanation":"Answer: what he had been wearing. The first two items are reported questions in normal word order (whether she had seen, when she had seen), so the third must match: subject before verb. The trap is 'what had he been wearing then', which flips the word order as in a direct question; reported questions do not invert. 'What was he wearing' makes the same mistake and also breaks the tense. 'His clothes' is a noun, not a clause.","verified":"ok","status":"approved"},{"id":"Q13","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Her ____ manner in the interview — she answered every question with a shrug — cost her the job.","options":["nonchalant","diffident","obsequious","punctilious"],"answer":"nonchalant","answerIndex":0,"difficulty":"easy","explanation":"Answer: nonchalant = casually unconcerned. Shrugging at every question shows she did not care. The trap is 'diffident' = shy, lacking confidence: a shrug can look shy, but doing it to every question signals indifference. Obsequious = too eager to please, the opposite of shrugging. Punctilious = very careful about correct behaviour.","verified":"ok","status":"approved"},{"id":"Q14","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'MILITATE' correctly?","options":["The new drug militates the pain within an hour.","Rising costs militate against any quick expansion.","Planting more trees can militate the effects of floods.","His apology did little to militate his offence."],"answer":"Rising costs militate against any quick expansion.","answerIndex":1,"difficulty":"easy","explanation":"Answer: B. Militate (against) = to be a powerful factor preventing something. A, C and D all need 'mitigate' = to make less severe (mitigate pain, effects, an offence). The trap is the near-identical spelling. Tip: militate is almost always followed by 'against'; mitigate takes a direct object.","verified":"ok","status":"approved"},{"id":"Q15","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"The bracketed part may contain an error. Choose the best replacement.\nThe scenery of Munnar is [more beautiful than Shimla].","options":["more beautiful than Shimla","more beautiful than those of Shimla","more beautiful than that of Shimla","most beautiful than that of Shimla"],"answer":"more beautiful than that of Shimla","answerIndex":2,"difficulty":"easy","explanation":"Answer: more beautiful than that of Shimla. The sentence compares the scenery of Munnar with the scenery of Shimla, not with Shimla itself, so 'that of' (= the scenery of) is needed. The trap is 'those of Shimla': it fixes the comparison but 'scenery' is singular, so 'those' is wrong. 'Most … than' mixes the superlative with a comparison. The original compares scenery with a town.","verified":"ok","status":"approved"},{"id":"Q16","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Though worth several crores, the old trader was famously ____: he reused envelopes and haggled over every rupee.","options":["parsimonious","profligate","prodigal","philanthropic"],"answer":"parsimonious","answerIndex":0,"difficulty":"medium","explanation":"Answer: parsimonious = extremely unwilling to spend money. Reusing envelopes and haggling fits. Profligate = recklessly wasteful. The trap is 'prodigal': students remember the 'prodigal son' as the bad son and assume a negative fit, but prodigal means wastefully extravagant — the opposite. Philanthropic = generous with money for good causes.","verified":"ok","status":"approved"},{"id":"Q17","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Rahul is a dependable batter and a sharp captain, but his weak fielding remains his ____.","options":["sword of Damocles","Midas touch","Achilles' heel","Trojan horse"],"answer":"Achilles' heel","answerIndex":2,"difficulty":"medium","explanation":"Answer: Achilles' heel = a weak spot in someone otherwise strong. The trap is 'sword of Damocles' = a danger that hangs over someone constantly; students link 'danger' with 'weakness'. 'Midas touch' = the ability to make everything succeed. 'Trojan horse' = something that looks harmless but hides a threat inside.","verified":"ok","status":"approved"},{"id":"Q18","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"One of the students who ____ selected for the exchange programme ____ from my town.","options":["was; are","was; is","were; are","were; is"],"answer":"were; is","answerIndex":3,"difficulty":"medium","explanation":"Answer: were; is. Two decisions. 'Who' refers to 'the students' (several were selected), so 'were'. The main subject is 'One', so 'is'. The trap is 'was; is': students let 'One' control both verbs. 'Were; are' gets the first right and lets 'students' wrongly control the main verb. 'Was; are' reverses both.","verified":"ok","status":"approved"},{"id":"Q19","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'RESTIVE' correctly?","options":["After a restive weekend in the hills, she felt refreshed.","The crowd grew restive as the delay dragged on.","The spa is known for its quiet, restive massages.","Nothing beats a long, restive sleep after exams."],"answer":"The crowd grew restive as the delay dragged on.","answerIndex":1,"difficulty":"medium","explanation":"Answer: B. Restive = restless and impatient, hard to control — a crowd made to wait grows restive. A, C and D all use it to mean 'restful'. The trap: restive looks like 'rest' + '-ive', so students assume it means relaxing; it means almost the opposite.","verified":"ok","status":"approved"},{"id":"Q20","section":"VA","format":"Pronouns","kind":"mcq","td":35,"stem":"The prize will go to ____ submits the best essay.","options":["whoever","whomever","whom","who ever"],"answer":"whoever","answerIndex":0,"difficulty":"medium","explanation":"Answer: whoever. The pronoun is the subject of 'submits', and its role inside its own clause decides the form. The trap is 'whomever': students see the preposition 'to' and pick the object form, but the whole clause 'whoever submits the best essay' is what follows 'to'. 'Whom' is an object and cannot be the subject of 'submits'. 'Who ever' as two words is used only for surprised questions ('Who ever told you that?').","verified":"ok","status":"approved"},{"id":"Q21","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"A person who endures pain or hardship calmly, without showing emotion or complaining","options":["hedonist","cynic","stoic","ascetic"],"answer":"stoic","answerIndex":2,"difficulty":"medium","explanation":"Answer: stoic. Hedonist = one who lives for pleasure — the opposite. Cynic = one who believes people act only from selfish motives. The trap is 'ascetic' = one who gives up comforts and pleasures by choice, usually for religious reasons; both words involve hardship, but the ascetic chooses self-denial, while the stoic bears whatever comes without complaint.","verified":"ok","status":"approved"},{"id":"Q22","section":"VA","format":"Modifiers","kind":"mcq","td":35,"stem":"Which sentence is free of a modifier error?","options":["To qualify for the scholarship, a 90% score is needed.","To qualify for the scholarship, you need a 90% score.","To qualify for the scholarship, 90% must be scored by you.","To qualify for the scholarship, the cut-off is a 90% score."],"answer":"To qualify for the scholarship, you need a 90% score.","answerIndex":1,"difficulty":"medium","explanation":"Answer: B. An opening 'To + verb' phrase must be followed by the person who does the action — 'you' qualify. A is the trap: it sounds completely natural, but the subject after the comma is 'a 90% score', which cannot qualify for anything. C mentions 'you' but buries it at the end; the subject is still '90%'. In D the cut-off qualifies.","verified":"ok","status":"approved"},{"id":"Q23","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"The CEO's apology was so ____ — worded with lawyerly care to admit nothing — that it angered customers more than the original fault.","options":["contrite","abject","self-effacing","disingenuous"],"answer":"disingenuous","answerIndex":3,"difficulty":"medium","explanation":"Answer: disingenuous = not sincere; pretending to be honest or open. An apology designed to admit nothing is insincere. The trap is 'contrite' = truly sorry — what an apology is supposed to be, but the dash says otherwise. Abject = total and humbling (an abject apology concedes everything). Self-effacing = modest, keeping oneself in the background.","verified":"ok","status":"approved"},{"id":"Q24","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"To save his own job, the manager ____, blaming her for the delayed shipment.","options":["threw her under the bus","threw her under the train","gave her the cold shoulder","showed her the ropes"],"answer":"threw her under the bus","answerIndex":0,"difficulty":"medium","explanation":"Answer: threw her under the bus = sacrificed someone else to protect oneself. 'Threw her under the train' is the trap — the corrupted form. 'Gave her the cold shoulder' = deliberately ignored her, which is unkind but involves no blame. 'Showed her the ropes' = taught her how a job is done.","verified":"ok","status":"approved"},{"id":"Q25","section":"VA","format":"Prepositions","kind":"mcq","td":35,"stem":"His silence was tantamount ____ an admission of guilt, and the court found him deficient ____ remorse.","options":["of; in","to; of","to; in","with; in"],"answer":"to; in","answerIndex":2,"difficulty":"medium","explanation":"Answer: to; in. The fixed patterns are 'tantamount to' (= equivalent to) and 'deficient in'. The trap is 'to; of': students get the first right and then use 'of' by analogy with 'lacking of' or 'devoid of'. 'Of; in' and 'with; in' get only the second right.","verified":"ok","status":"approved"},{"id":"Q26","section":"VA","format":"Word Choice","kind":"mcq","td":25,"stem":"The new forensic report ____ the accused, and he was released from jail the same evening.","options":["implicated","exculpated","expurgated","excommunicated"],"answer":"exculpated","answerIndex":1,"difficulty":"medium","explanation":"Answer: exculpated = cleared of blame. Being released the same evening shows the report proved him innocent. The trap is 'implicated' = showed to be involved in a crime — the opposite, but it is the word students most link with forensic reports. Expurgated = removed objectionable parts from a text. Excommunicated = expelled from a religious community.","verified":"ok","status":"approved"},{"id":"Q27","section":"VA","format":"Parallelism","kind":"mcq","td":35,"stem":"Her research is admired both for its depth and ____.","options":["for being so original","because it is original","its being original","for its originality"],"answer":"for its originality","answerIndex":3,"difficulty":"medium","explanation":"Answer: for its originality. 'Both for its depth' sets the pattern 'for + its + noun', so the second half must be 'for its originality'. The trap is 'for being so original': it keeps 'for' but switches from a noun to a gerund phrase. 'Because it is original' switches to a clause. 'Its being original' drops 'for' and uses a gerund.","verified":"ok","status":"approved"},{"id":"Q28","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Critics dismissed the film's plot as ____, pointing out that the same twist had appeared in a dozen earlier thrillers.","options":["seminal","innovative","derivative","iconoclastic"],"answer":"derivative","answerIndex":2,"difficulty":"medium","explanation":"Answer: derivative = copied from earlier work, unoriginal. A twist seen a dozen times before is derivative. The trap is 'seminal' = highly original and influential on later work; students who half-know it confuse it with 'common'. Innovative = new and creative. Iconoclastic = attacking established beliefs or traditions.","verified":"ok","status":"approved"},{"id":"Q29","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'INGENUOUS' correctly?","options":["Her ingenuous reply showed she had no idea of the trick.","The ingenuous design of the new bridge won a national award.","An ingenuous mechanic fixed the pump using only a hairpin.","The thieves' ingenuous plan fooled even seasoned detectives."],"answer":"Her ingenuous reply showed she had no idea of the trick.","answerIndex":0,"difficulty":"medium","explanation":"Answer: A. Ingenuous = innocent, frank and trusting. A reply that shows she had no idea of the trick fits. B, C and D all need 'ingenious' = clever and inventive (a clever design, a clever fix, a clever plan). The trap is the near-identical spelling. Tip: ingenUous is Unsuspecting; ingenIous is Inventive.","verified":"ok","status":"approved"},{"id":"Q30","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"The bracketed part may contain an error. Choose the best replacement.\n[Not only he apologised but also] offered to pay for the damage.","options":["Not only he apologised but also","Not only did he apologise but he also","Not only did he apologise but also","Not only had he apologised but also he"],"answer":"Not only did he apologise but he also","answerIndex":1,"difficulty":"medium","explanation":"Answer: Not only did he apologise but he also. Two decisions. When a sentence opens with 'Not only', the first half inverts (did he apologise). Because that half is a full clause, the second half needs its own subject: 'but he also offered'. The trap is 'Not only did he apologise but also': it fixes the inversion and stops there, leaving 'offered' with no subject. The original has no inversion. D shifts the tense and puts 'he' in the wrong place.","verified":"ok","status":"approved"},{"id":"Q31","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Once ____ for his candour, the senator grew so ____ in later years that reporters said he could speak for an hour and commit to nothing.","options":["pilloried; temporising","feted; garrulous","feted; temporising","pilloried; garrulous"],"answer":"feted; temporising","answerIndex":2,"difficulty":"hard","explanation":"Answer: feted; temporising. 'Once … for his candour' needs a word of praise: feted = celebrated. Pilloried = publicly attacked, the opposite. The second blank must explain 'commit to nothing': temporising = avoiding a decision in order to gain time. The trap is 'garrulous' = extremely talkative: it matches 'speak for an hour' but not 'commit to nothing', and the contrast with candour is about evasion, not talkativeness.","verified":"ok","status":"approved"},{"id":"Q32","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"The MLA who pushed hardest for the strict anti-defection rule was later disqualified under that very rule — truly ____.","options":["hoist with his own petard","a classic case of sour grapes","caught between Scylla and Charybdis","hoist with his own banner"],"answer":"hoist with his own petard","answerIndex":0,"difficulty":"hard","explanation":"Answer: hoist with his own petard = harmed by the very plan or weapon one created for others (from Hamlet; a petard was a small bomb). 'Hoist with his own banner' is the trap — the corrupted form. 'Sour grapes' = pretending not to want something one cannot have. 'Caught between Scylla and Charybdis' = stuck between two equally dangerous choices.","verified":"ok","status":"approved"},{"id":"Q33","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"The committee ____ divided in their opinions, but the majority of the members ____ already voted against the plan.","options":["is; has","are; have","is; have","remain; has"],"answer":"are; have","answerIndex":1,"difficulty":"hard","explanation":"Answer: are; have. A collective noun takes a plural verb when its members act as separate individuals — 'divided in their opinions' shows that. 'The majority of the members' refers to people, so it is plural too. The trap is 'is; have': students learn 'committee is singular' as a fixed rule and apply it even when the members disagree. 'Is; has' treats both as singular. 'Remain; has' gets only the first right.","verified":"ok","status":"approved"},{"id":"Q34","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'OFFICIOUS' correctly?","options":["The officious results of the poll will be out tomorrow.","Please route all such letters through officious channels.","The prime minister is in Tokyo on an officious visit.","The officious usher kept ordering us where to sit."],"answer":"The officious usher kept ordering us where to sit.","answerIndex":3,"difficulty":"hard","explanation":"Answer: D. Officious = too eager to give orders or interfere, especially in a small official role. A, B and C all use it to mean 'official'. The trap: officious looks like a formal version of 'official', and all three wrong sentences are about government or formal matters. In fact it is an insult.","verified":"ok","status":"approved"},{"id":"Q35","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"The teacher told us that light ____ faster than sound and that the experiment ____ the day before.","options":["travelled; had been done","travels; was done","travels; had been done","travelled; was done"],"answer":"travels; had been done","answerIndex":2,"difficulty":"hard","explanation":"Answer: travels; had been done. Two decisions. A universal truth stays in the present even in reported speech, so 'travels'. The experiment happened before the teacher spoke, and 'the day before' marks that earlier point, so it takes the past perfect. The trap is 'travelled; had been done': students back-shift every verb after 'told us that' by habit. 'Travels; was done' keeps the truth right but misses the earlier-past sequence.","verified":"ok","status":"approved"},{"id":"Q36","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Excessive pride or self-confidence that invites one's downfall","options":["hubris","nemesis","bathos","pathos"],"answer":"hubris","answerIndex":0,"difficulty":"hard","explanation":"Answer: hubris. The trap is 'nemesis' = the downfall itself, or the person or force that brings it; it belongs to the same Greek story as hubris, but it names the punishment, not the pride. Bathos = a sudden, unintentionally comic drop from the serious to the trivial. Pathos = the quality in writing or events that evokes pity.","verified":"ok","status":"approved"},{"id":"Q37","section":"VA","format":"Pronouns","kind":"mcq","td":35,"stem":"Which sentence is free of an unclear pronoun?","options":["When Rohit met Arjun, he told him that he had been selected.","Rohit told Arjun that he had been selected for the team.","The coach told the captain that his place was in danger.","Rohit told Arjun, 'You have been selected for the team.'"],"answer":"Rohit told Arjun, 'You have been selected for the team.'","answerIndex":3,"difficulty":"hard","explanation":"Answer: D. The direct quotation makes clear who was selected: Arjun. In A, B and C, 'he' or 'his' could refer to either person — was Rohit selected, or Arjun? Whose place is in danger, the coach's or the captain's? The trap is B: it reads smoothly and most readers assume one meaning, but the sentence itself does not decide it.","verified":"ok","status":"approved"},{"id":"Q38","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Far from being a ____, the biography lays bare its subject's vanity, his cruelty and his greed.","options":["philippic","hagiography","exposé","condemnation"],"answer":"hagiography","answerIndex":1,"difficulty":"hard","explanation":"Answer: hagiography = a biography that treats its subject as a saint. 'Far from being' needs a word for the opposite of what the book does, and laying bare vanity and cruelty is the opposite of flattery. The trap is 'exposé' = a report that reveals scandal — that is exactly what the book IS, so it cannot fill 'far from being'. Philippic = a bitter verbal attack, and condemnation = strong disapproval: both also describe what the book does.","verified":"ok","status":"approved"},{"id":"Q39","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"The new syllabus is ____: the literature section is excellent, but the grammar portion is riddled with errors.","options":["the curate's pudding","a storm in a teacup","a curate's egg","the proof of the pudding"],"answer":"a curate's egg","answerIndex":2,"difficulty":"hard","explanation":"Answer: a curate's egg = something that is partly good and partly bad. 'The curate's pudding' is the trap — a corrupted form. 'A storm in a teacup' = a lot of fuss about something trivial. 'The proof of the pudding' (is in the eating) = something can be judged only by its results.","verified":"ok","status":"approved"},{"id":"Q40","section":"VA","format":"Modifiers","kind":"mcq","td":35,"stem":"Which sentence clearly says that the announcement was made on Monday?","options":["On Monday, the manager announced that the office would close.","The manager announced that the office would close down on Monday.","The manager announced that on Monday the office would close.","The manager announced the office would close on Monday."],"answer":"On Monday, the manager announced that the office would close.","answerIndex":0,"difficulty":"hard","explanation":"Answer: A. Placing 'On Monday' at the front ties it to 'announced'. In B and D, 'on Monday' sits next to 'close', so the natural reading is that the office will close on Monday — the announcement could have been made any day. The trap is C: it moves 'on Monday' earlier and looks like a fix, but it now sits inside the 'that' clause, so it clearly belongs to 'would close'.","verified":"ok","status":"approved"},{"id":"Q41","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The root 'greg' means 'flock, herd'. Which word means 'outstandingly bad; shocking'?","options":["gregarious","egregious","congregation","segregate"],"answer":"egregious","answerIndex":1,"difficulty":"hard","explanation":"Answer: egregious (e- = out of + greg = flock: originally 'standing out from the flock'; it now means shockingly bad, as in an egregious error). The trap is 'gregarious' = fond of company, sociable; it is the best-known 'greg' word, so students pick it automatically. Congregation = a gathering of people, especially for worship. Segregate = to separate from the group.","verified":"ok","status":"approved"},{"id":"Q42","section":"VA","format":"Parallelism","kind":"mcq","td":35,"stem":"Choose the sentence in which the paired words are correctly placed.","options":["She either will be joining IIM Ahmedabad or IIM Bangalore.","Either she will join IIM Ahmedabad or IIM Bangalore.","She will join either IIM Ahmedabad or IIM Bangalore.","She will either join IIM Ahmedabad or IIM Bangalore."],"answer":"She will join either IIM Ahmedabad or IIM Bangalore.","answerIndex":2,"difficulty":"hard","explanation":"Answer: C. 'Either' and 'or' must be followed by the same kind of element. In C both are followed by a noun (IIM Ahmedabad / IIM Bangalore). D is the trap: it sounds natural, but 'either' is followed by a verb (join) and 'or' by a noun. B puts a full clause after 'either' and only a noun after 'or'. A has the same verb/noun mismatch as D.","verified":"ok","status":"approved"},{"id":"Q43","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Investors were rattled by the CEO's ____ decisions: one week he ordered a hiring freeze, the next a hiring spree.","options":["sagacious","sedulous","Machiavellian","capricious"],"answer":"capricious","answerIndex":3,"difficulty":"hard","explanation":"Answer: capricious = changing suddenly and without reason. A freeze one week and a spree the next is capricious. Sagacious = wise and far-sighted — the opposite. Sedulous = hardworking and persistent. The trap is 'Machiavellian' = cunning and scheming: students see the CEO as manipulative, but nothing suggests a hidden plan, only random reversals.","verified":"ok","status":"approved"},{"id":"Q44","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'INFLAMMABLE' correctly?","options":["Petrol is inflammable; keep it far from the stove.","This jacket is inflammable, so it is safe near a campfire.","Asbestos was once prized because it is inflammable.","By law, children's nightwear must be inflammable."],"answer":"Petrol is inflammable; keep it far from the stove.","answerIndex":0,"difficulty":"hard","explanation":"Answer: A. Inflammable means easily set on fire — exactly the same as 'flammable'. The 'in-' here means 'into' (into flame), not 'not'. B, C and D all use it to mean 'fireproof', which is the dangerous opposite. The trap is the prefix: in- usually means 'not' (inactive, invisible), so students read inflammable as 'non-flammable'.","verified":"ok","status":"approved"},{"id":"Q45","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"The bracketed part may contain an error. Choose the best replacement.\n[Being a rainy day,] the match was called off.","options":["Being a rainy day,","It being a rainy day,","Since being a rainy day,","Having been a rainy day,"],"answer":"It being a rainy day,","answerIndex":1,"difficulty":"hard","explanation":"Answer: It being a rainy day. An opening '-ing' phrase attaches to the subject of the main clause, here 'the match', so 'Being a rainy day' says the match was a rainy day. Adding 'it' gives the phrase its own subject (an absolute phrase), so it no longer needs to attach to 'the match'. The trap is 'Having been a rainy day': it changes the tense but keeps the same dangling problem. 'Since being' still has no subject of its own.","verified":"ok","status":"approved"}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
/* ==================== ADAPTIVE ROUTER (v2.9) ====================
   QUESTIONS starts as the whole pool; it becomes the SERVED list,
   filled one slot at a time. Right answer: one band up. Wrong, blank
   or timed out: one band down. First unused question of the band;
   if that band is empty, the nearest band with stock. */
var AD=CFG.adaptive,POOL=QUESTIONS,AD_B=["easy","medium","hard"],adSeq=[],adBands=[],adTargets=[]; /* adBands = served question's band; adTargets = band the student had earned (routing state) */
QUESTIONS=new Array(AD.serve);NQ=AD.serve;
function adBandOf(q){var d=diffOf(q);var b=d?AD_B.indexOf(d):1;return b<0?1:b}
function adFirstLeft(b){for(var i=0;i<POOL.length;i++){if(adBandOf(POOL[i])===b&&adSeq.indexOf(i)===-1)return i}return -1}
function adPick(t,dir){
 var p=adFirstLeft(t);if(p!==-1)return {p:p,b:t};
 var alt=t===0?[1,2]:(t===2?[1,0]:(dir>0?[2,0]:[0,2])); /* empty band: nearest first; medium empty follows the move */
 for(var k=0;k<alt.length;k++){p=adFirstLeft(alt[k]);if(p!==-1)return {p:p,b:alt[k]}}
 return null;
}
function adServe(k,t,dir){var r=adPick(t,dir);if(!r)return false;adSeq[k]=r.p;adBands[k]=r.b;adTargets[k]=t;QUESTIONS[k]=POOL[r.p];return true}
function adRoute(k){
 if(k+1>=NQ||QUESTIONS[k+1])return; /* already served (resume): never re-roll */
 var a=answers[k],ok=!(a===null||a===""||a===undefined)&&isCorrect(QUESTIONS[k],a);
 var dir=ok?1:-1;
 adServe(k+1,Math.max(0,Math.min(2,adTargets[k]+dir)),dir); /* route from the earned band, not a fallback */
}
function adFillRest(){for(var k=0;k<NQ-1;k++){if(!QUESTIONS[k+1])adRoute(k)}}
function adIdList(){return adSeq.map(function(p){return String(POOL[p].id)})}
function adRestore(s){
 if(!Array.isArray(s.adIds)||!s.adIds.length||s.adIds.length>NQ)return false;
 var seq=[];
 for(var k=0;k<s.adIds.length;k++){
  var p=-1;for(var i=0;i<POOL.length;i++){if(String(POOL[i].id)===String(s.adIds[k])){p=i;break}}
  if(p===-1||seq.indexOf(p)!==-1)return false;seq.push(p);
 }
 adSeq=seq;adBands=seq.map(function(p){return adBandOf(POOL[p])});
 adTargets=(Array.isArray(s.adTargets)&&s.adTargets.length===seq.length)?s.adTargets.map(function(t){return Math.max(0,Math.min(2,t|0))}):adBands.slice();
 QUESTIONS=new Array(NQ);for(var j=0;j<seq.length;j++)QUESTIONS[j]=POOL[seq[j]];
 if(typeof s.currentQ!=="number"||s.currentQ>seq.length-1)s.currentQ=seq.length-1;
 return true;
}
function adPayload(P){
 var wq=[],sa={},qt={};
 QUESTIONS.forEach(function(q,i){
  var id=String(q.id),a=answers[i];
  sa[id]=(a===undefined?null:a);qt[id]=questionTimes[i]||0;
  if(!(a===null||a===""||a===undefined)&&!isCorrect(q,a))wq.push(id);
 });
 P.wrongQuestions=JSON.stringify(wq);P.studentAnswers=JSON.stringify(sa);P.questionTimes=JSON.stringify(qt);
}
function adTop(){var t=0;for(var k=0;k<adTargets.length;k++)if(adTargets[k]>t)t=adTargets[k];return t}
function adClimbHTML(A){
 var L=["E","M","H"],H='<div class="rung"><div class="rungTop"><span>You climbed to: <b class="gold" style="font-family:Fraunces,serif;font-size:15px">'+capW(AD_B[adTop()])+'</b></span><b class="dim">'+plural(adBands.length,"question","questions")+' served</b></div>';
 H+='<div class="adStrip">';
 for(var k=0;k<adBands.length;k++){
  var o=A.out[k]||"s";
  H+='<i class="b'+adBands[k]+' '+o+'" data-q="'+k+'" title="Q'+(k+1)+' &middot; '+capW(AD_B[adBands[k]])+' &middot; '+outWord(o)+'">'+L[adBands[k]]+'</i>';
 }
 H+='</div><div class="adAxis"><span>Q1</span><span>Q'+adBands.length+'</span></div>';
 H+='<div class="rungSub" style="margin-top:6px">Each block is one question, in the order you got them. Higher means harder. A right answer took you up a level; a wrong or blank one took you down.</div></div>';
 return H;
}
function adPdfLine(){
 var L=["E","M","H"];
 return "You climbed to: "+capW(AD_B[adTop()])+". Level of each question in order: "+adBands.map(function(b){return L[b]}).join(" ");
}
function adLoginNote(){
 var m=document.getElementById("lgMeta");
 if(m)m.innerHTML+="<br>adaptive &middot; a right answer makes the next question harder, a wrong or blank one makes it easier";
}
adServe(0,AD_B.indexOf(String(AD.start||"medium"))===-1?1:AD_B.indexOf(String(AD.start||"medium")),0);

var PIN_REGEX=/^(STU|IMS)\d{10}$/;
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var marked=new Array(NQ).fill(false);
var deadline=0,tickCount=0; /* v2.5 wall-clock timer */
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;
var qShownQ=-1,visits=[]; /* v2.7: on-device visit log for the results analysis (never sent) */
var RAPID=!!CFG.rapid; /* v2.4 rapid mode */
var qSecondsLeft=0,qStartTs=0,qInterval=null,pendingResumeStartTs=null;
function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,visits:visits,adIds:adIdList(),adBands:adBands,adTargets:adTargets,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 if(!adRestore(s)){snClearSession();alert("Could not restore the earlier attempt. Starting fresh.");return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(Array.isArray(s.visits))visits=s.visits.filter(function(v){return v&&typeof v.q==="number"&&v.q>=0&&v.q<NQ});
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
  var mb=document.getElementById("mrkBtn");if(mb)mb.style.display="none";
 }
 renderQuestion();
 snSaveSession();
}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){
  var d=Math.round((Date.now()-qShownTs)/1000);
  questionTimes[currentQ]+=d;
  if(d>=1&&qShownQ===currentQ){ /* v2.7: one visit = from showing a question to leaving it */
   var e=elapsedNow();
   visits.push({q:currentQ,s:Math.max(0,e-d),d:d,a:answers[currentQ]});
   if(visits.length>800)visits.shift();
  }
 }
 qShownTs=Date.now();
}
function elapsedNow(){ /* seconds into the test on the test clock (sections ended early are not counted) */
 if(RAPID)return 0;
 var left=deadline?(deadline-Date.now())/1000:secondsLeft;
 var base=SEC?elapsedPrior+SEC[secIdx].minutes*60:CFG.minutes*60;
 return Math.max(0,Math.round(base-left));
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulText(el,t){el.textContent="";String(t==null?"":t).split(/(\[\[[\s\S]*?\]\])/).forEach(function(p){if(!p)return;var m=p.match(/^\[\[([\s\S]*)\]\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 /* v2.7 fix: picking an option re-renders the same question; that must not restart its stopwatch */
 if(!qShownTs||qShownQ!==currentQ){qShownTs=Date.now();qShownQ=currentQ}
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section;
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulText(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");

   box.appendChild(d);

function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 adRoute(currentQ); /* v2.9: serve the next slot from the band this answer earned */
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);

  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 if(q.format==="Parajumble")return String(a).trim()===String(q.answer); /* stem rule: 3412 valid; 3412. and 3 4 1 2 invalid */
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   k=CFG.bankPrefix+"-"+q.id; /* v2.9: positions differ per attempt */
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();
 adFillRest(); /* v2.9: early submit — unreached slots are served as unanswered */

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };
 adPayload(payload); /* v2.9: same 16 fields; IDs instead of positions */

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors,totalSecs);
}

/* ==================== POST-TEST ANALYSIS (v2.8) ====================

var TRAPS={
 "rc-detail-as-main":["Detail as main idea","A true detail offered as the main point.","Ask whether the writer would use it as the title. A detail can be true and still be too small to be the point."],

 "rc-false-link":["False link","It joins two things from the passage with a reason the writer never gives.","Find the line that links the two ideas. If the passage never connects them, neither should you."],
 "rc-half-right":["Half right","One half matches the passage; the other half doesn't.","Read every option to its last word. One wrong half sinks the whole option."],
 "rc-literal":["Too literal","A figurative line read at face value.","For an image or metaphor, ask what it does in the argument, not what it describes."],
 "rc-out-of-scope":["Out of scope","It brings in something the passage never discusses.","If you cannot point to the line that supports it, rule it out."],

 "rc-scope-shift":["Scope shift","Right topic, but wider or narrower than the text's claim.","Match the scope words: most vs all, some vs every, one city vs every city."],
 "va-scope-shift":["Scope shift","Right topic, but wider or narrower than the paragraph's claim.","Match the scope words: most vs all, some vs every, one case vs every case."],
 "rc-tone":["Tone miss","Right direction, wrong strength or flavour of attitude.","Fix the direction first (for or against), then the strength (mild or harsh)."],
 "rc-true-not-answer":["True, but not the answer","Supported by the passage, but it doesn't answer this question.","Reread the question before confirming. True is not enough; it has to answer what was asked."],
 "rc-word-match":["Word match","It borrows the passage's words, not its meaning.","Familiar words are bait. Put the line in your own words, then match the meaning."],
 "rc-wrong-voice":["Wrong voice","A view the passage reports or argues against, not the writer's own.","Ask whose view it is: the writer's, or someone the writer quotes or rejects?"],
 "va-category-error":["Wrong kind of word","The word doesn't fit the kind of idea the blank needs.","Decide what the blank must do (describe, judge, act) before you read the options."],
 "va-collocation-break":["Doesn't go together","The word doesn't sit naturally with its neighbours.","Say the phrase in full. English pairs certain words by habit; trust the natural pairing."],
 "va-confusable-sibling":["Look-alike word","Looks or sounds like the right word but means something else.","Slow down on look-alikes and pin each word's exact meaning before choosing."],
 "va-corrupted-expression":["Twisted idiom","A familiar expression with one word changed.","Idioms are fixed. If one word differs from the original, the whole option is wrong."],

 "pj-antecedent":["Missed reference","A 'this', 'they' or 'such' points to something not yet introduced.","Every pointer word needs its noun earlier. Place that sentence before it."],

};
var LAST_A=null;
function trapInfo(tag){
 var t=TRAPS[tag];
 if(t)return {name:t[0],what:t[1],fix:t[2]};
 var n=String(tag).replace(/^[a-z]+-/,"").replace(/-/g," ");
 return {name:n.charAt(0).toUpperCase()+n.slice(1),what:"",fix:""};

function diffOf(q){

 if(!d)return null;
 if(d.indexOf("hard")!==-1)return "hard";
 if(d.charAt(0)==="e")return "easy";
 if(d.charAt(0)==="m")return "medium";
 return null;
}
function penOf(q){return isMCQ(q)?CFG.w:titaWFor(q)}
function trapOf(q,a){
 if(a===null||a===""||a===undefined||isCorrect(q,a))return null;
 if(isMCQ(q)){
  var t=Array.isArray(q.optionTags)?q.optionTags[a]:null;
  return (typeof t==="string"&&t.trim())?t.trim():null;
 }
 if(q.titaTraps&&typeof q.titaTraps==="object"){
  var na=String(a).replace(/[\s,]/g,"");
  for(var k in q.titaTraps){
   if(Object.prototype.hasOwnProperty.call(q.titaTraps,k)&&String(k).replace(/[\s,]/g,"")===na)return q.titaTraps[k];
  }
 }

}
function secOfQ(i){if(!SEC)return null;for(var s=0;s<SEC.length;s++){if(i>=SEC[s].start&&i<=SEC[s].end)return s}return null}
function paceOf(i){
 if(RAPID)return QUESTIONS[i].td||30;
 var s=secOfQ(i);
 if(s!==null)return SEC[s].minutes*60/(SEC[s].end-SEC[s].start+1);
 return CFG.minutes*60/NQ;
}
function availSecs(){
 if(RAPID)return QUESTIONS.reduce(function(a,q){return a+(q.td||30)},0);
 if(SEC)return SEC.reduce(function(a,p){return a+p.minutes*60},0);
 return CFG.minutes*60;
}
function fmtMS(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function sgn(n){return n>0?"+"+n:(n<0?"−"+(-n):"0")}
function sgnA(n){return n>0?"+"+n:(n<0?"-"+(-n):"0")}
function blank(x){return x===null||x===""||x===undefined}
function sameAns(q,x,y){if(blank(x)||blank(y))return blank(x)&&blank(y);return isMCQ(q)?x===y:titaNorm(x)===titaNorm(y)}
function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function outWord(o){return o==="c"?"right":(o==="w"?"wrong":"blank")}

function computeAnalysis(score,totalSecs){
 var A={score:score,max:MAX_MARKS,used:totalSecs||0,avail:availSecs(),c:0,w:0,s:0,neg:0,tC:0,tW:0,tS:0,out:[],
  hasDiff:false,hasTags:false,emW:0,emS:0,emSq:[],traps:[],trapped:0,trapMarks:0,timedOut:0,bankN:0,
  sinks:[],secs:[],journey:null,acc:null,verdict:null,
  diff:{easy:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},medium:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},hard:{n:0,o:0,c:0,w:0,s:0,net:0,t:0}}};
 var trapMap={};
 QUESTIONS.forEach(function(q,i){
  var a=answers[i],sk=blank(a),ok=!sk&&isCorrect(q,a),t=questionTimes[i]||0;
  var o=sk?"s":(ok?"c":"w");
  A.out.push(o);
  if(o==="c"){A.c++;A.tC+=t}
  else if(o==="w"){A.w++;A.tW+=t;A.neg+=-penOf(q);if(isMCQ(q))A.bankN++}
  else{A.s++;A.tS+=t}
  if(RAPID&&sk&&t>=(q.td||30))A.timedOut++;
  var d=diffOf(q);
  if(d){
   A.hasDiff=true;
   var b=A.diff[d];b.n++;b.t+=t;if(t>0)b.o++;
   if(o==="c"){b.c++;b.net+=CFG.c}else if(o==="w"){b.w++;b.net+=penOf(q)}else b.s++;
   if(d!=="hard"){if(o==="w")A.emW++;else if(o==="s"){A.emS++;if(!(RAPID&&t>=(q.td||30)))A.emSq.push(i)}} /* rapid: a question whose clock ran out counts under the clock, not as a skip */
  }
  if(Array.isArray(q.optionTags)||(q.titaTraps&&typeof q.titaTraps==="object"))A.hasTags=true;
  var tg=trapOf(q,a);
  if(tg){
   var inf=trapInfo(tg),sw=CFG.c-penOf(q);
   if(!trapMap[inf.name]){trapMap[inf.name]={name:inf.name,what:inf.what,fix:inf.fix,qs:[],marks:0};A.traps.push(trapMap[inf.name])}
   trapMap[inf.name].qs.push(i);trapMap[inf.name].marks+=sw;A.trapped++;A.trapMarks+=sw;
  }
  if(!RAPID&&t>=Math.max(90,2*paceOf(i)))A.sinks.push({i:i,t:t});
 });
 A.traps.sort(function(x,y){return (y.qs.length-x.qs.length)||(y.marks-x.marks)});
 A.sinks.sort(function(x,y){return y.t-x.t});A.sinks=A.sinks.slice(0,3);
 A.acc=(A.c+A.w)?Math.round(100*A.c/(A.c+A.w)):null;
 var order=[],bySec={};
 QUESTIONS.forEach(function(q,i){
  var k=q.section||"-";
  if(!bySec[k]){bySec[k]={sec:k,n:0,c:0,w:0,s:0,score:0,t:0};order.push(k)}
  var b=bySec[k],o=A.out[i];b.n++;b.t+=questionTimes[i]||0;
  if(o==="c"){b.c++;b.score+=CFG.c}else if(o==="w"){b.w++;b.score+=penOf(q)}else b.s++;
 });
 if(order.length>1)A.secs=order.map(function(k){return bySec[k]});
 if(!RAPID&&visits.length)A.journey=computeJourney();
 A.verdict=buildVerdict(A);

}

function computeJourney(){
 var J={never:[],neverEM:0,changed:0,toRight:0,toWrong:0,gain:0,loss:0},byQ={};
 visits.forEach(function(v){(byQ[v.q]=byQ[v.q]||[]).push(v)});
 QUESTIONS.forEach(function(q,i){
  var vs=byQ[i],a=answers[i],d=diffOf(q);
  if(!vs||!vs.length){
   if(blank(a)&&!(questionTimes[i]>0)){J.never.push(i);if(d==="easy"||d==="medium")J.neverEM++}
   return;
  }
  var fn=null;
  for(var k=0;k<vs.length;k++){if(!blank(vs[k].a)){fn=vs[k].a;break}}
  if(fn!==null&&!blank(a)&&!sameAns(q,fn,a)){
   J.changed++;
   var was=isCorrect(q,fn),now=isCorrect(q,a),sw=CFG.c-penOf(q);
   if(!was&&now){J.toRight++;J.gain+=sw}
   else if(was&&!now){J.toWrong++;J.loss+=sw}
  }
 });
 return J;
}

/* The verdict: the biggest single leak, ranked by marks, in plain words. */
function buildVerdict(A){
 var C=[],J=A.journey,hb=A.diff.hard,never=J?J.never:[],top=A.traps[0],spare=Math.max(0,A.avail-A.used);
 if(A.trapped>=2&&top)C.push({k:"trap",m:A.trapMarks});
 var bl=A.emSq.filter(function(i){return never.indexOf(i)===-1}).length;
 if(bl)C.push({k:"blank",m:bl*CFG.c,n:bl});
 if(never.length>=3)C.push({k:"never",m:Math.max(1,J.neverEM)*CFG.c,n:never.length});
 if(A.hasDiff&&hb.c+hb.w>=2&&hb.net<0)C.push({k:"hard",m:-hb.net});
 if(J&&J.loss>J.gain)C.push({k:"second",m:J.loss-J.gain});
 if(RAPID&&A.timedOut>=3)C.push({k:"clock",m:A.timedOut*CFG.c/2});
 C.sort(function(x,y){return y.m-x.m});
 function line(c){
  var n=c.n,m=c.m;
  if(c.k==="trap")return {h:(A.trapped===A.w?"All "+A.w+" of your wrong answers":A.trapped+" of your "+plural(A.w,"wrong answer","wrong answers"))+" fell for a set trap.",s:"Together they cost "+plural(A.trapMarks,"mark","marks")+". The one to fix first: “"+top.name+"”, "+plural(top.qs.length,"time","times")+"."};
  if(c.k==="blank")return {h:"You left "+plural(n,"Easy or Medium question","Easy or Medium questions")+" blank.",s:"That is up to "+m+" marks that needed no new concept."};
  if(c.k==="never")return {h:"You never opened "+plural(n,"question","questions")+(J.neverEM?", "+J.neverEM+" of them Easy or Medium":"")+".",s:spare>=60?"You still had "+fmtMS(spare)+" on the clock when you finished.":"The clock ran out before you reached them."};
  if(c.k==="hard")return {h:"Hard questions cost you "+plural(m,"mark","marks")+" net.",s:hb.c+" right, "+hb.w+" wrong: leaving them blank would have scored higher."};
  if(c.k==="second")return {h:"Changing answers cost you "+plural(m,"mark","marks")+".",s:plural(J.toWrong,"right answer","right answers")+" changed to wrong; "+J.toRight+" wrong changed to right."};
  return {h:"The clock ran out on "+plural(A.timedOut,"question","questions")+".",s:"Each of those scored zero without an attempt."};
 }
 var V={h:"",s:"",also:"",acts:[]};
 if(C.length&&C[0].m>=CFG.c){
  var L=line(C[0]);V.h=L.h;V.s=L.s;
  if(C[1]&&C[1].m>=CFG.c)V.also=line(C[1]).h;
 }else if(A.acc!==null&&A.acc>=80&&!A.emS){
  V.h="A clean attempt: "+A.acc+"% accuracy and nothing easy left blank.";
  V.s="Next step: take on more of the Hard questions.";
 }else{
  V.h="You scored "+A.score+" of "+A.max+(A.acc!==null?" at "+A.acc+"% accuracy":"")+".";
  V.s="No single leak stands out. Go through the review below, question by question.";
 }
 var seen={};
 function act(t,href){if(seen[t])return;seen[t]=1;V.acts.push({t:t,href:href||null})}
 C.forEach(function(c){
  if(c.m<CFG.c)return;
  if(c.k==="trap"&&top.fix)act("Beat “"+top.name+"”: "+top.fix);
  else if(c.k==="never"&&spare>=60)act("Use the whole clock: before you end a section or submit, open every question you have not seen.");
  else if(c.k==="blank"&&RAPID)act("Decide in time: if you can rule out one option, answer and move on.");
  else if(c.k==="blank"||c.k==="never")act("First pass: answer every Easy and Medium question before you give time to a Hard one.");
  else if(c.k==="hard")act("Attempt a Hard question only after you have ruled out two options.");
  else if(c.k==="second")act("Keep your first answer unless you can name what is wrong with it.");
  else if(c.k==="clock")act("Decide in time: if you can rule out one option, answer and move on.");
 });
 V.acts=V.acts.slice(0,2);
 if(A.bankN)act((A.bankN===A.w?"Your "+plural(A.bankN,"wrong answer is","wrong answers are"):A.bankN+" of your wrong answers are")+" now in your Mistake Bank. They come back for revision tomorrow.","mistake_bank.html");
 return V;
}

 ["easy","medium","hard"].forEach(function(k){

function cardClock(A){
 var unused=Math.max(0,A.avail-A.used),tot=Math.max(1,A.tC+A.tW+A.tS+unused);
 function seg(cls,v){return v>0?"<i class=\""+cls+"\" style=\"width:"+(100*v/tot).toFixed(2)+"%\"></i>":""}

function cardSecond(A){

function paletteHTML(A){
 var J=A.journey,never={},trapQ={};
 if(J)J.never.forEach(function(i){never[i]=1});

 function tile(i){
  var o=A.out[i],t=questionTimes[i]||0,full=RAPID?(QUESTIONS[i].td||30):2*paceOf(i);

  return "<div class=\""+cls+"\" data-q=\""+i+"\" title=\""+tip+"\"><span class=\"pn\">"+(i+1)+"</span><span class=\"ptm\">"+(never[i]?"&ndash;":fmtMS(t))+"</span>"+(trapQ[i]?"<span class=\"tdot\"></span>":"")+"<i style=\"width:"+Math.min(100,100*t/full).toFixed(1)+"%\"></i></div>";
 }

  res.appendChild(document.createTextNode(q.explanation||""));

  q.options.forEach(function(opt,k){

 return L;
}

function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Accuracy: "+document.getElementById("stAcc").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 try{ /* v2.7 analysis */
  if(LAST_A){
   doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
   doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
   newPageIfNeeded(20);doc.text("Analysis",margin,y);y+=14;
   analysisLines(LAST_A).forEach(function(sec){
    newPageIfNeeded(30);
    doc.setTextColor(150,115,40);writeWrapped(sec[0],margin,pageW-2*margin,10,"bold");y+=1;
    doc.setTextColor(30,30,30);
    sec[1].forEach(function(ln){writeWrapped(ln,margin+10,pageW-2*margin-10,9.5,"normal")});
    y+=5;
   });
   doc.setTextColor(0,0,0);
  }
 }catch(e){}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  writeWrapped("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+(diffOf(q)?" \u00b7 "+q.difficulty:"")+" \u00b7 time "+fmtMS(questionTimes[i])+"   ["+statusLabel+"]",margin,pageW-2*margin,10,"bold");y+=1;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(String(q.stem).replace(/\[\[|\]\]/g,'"'),margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table!=null&&q.table!==""){
   var trows=Array.isArray(q.table)?q.table:(q.table&&Array.isArray(q.table.rows)?(Array.isArray(q.table.headers)?[q.table.headers].concat(q.table.rows):q.table.rows):null);
   doc.setTextColor(40,40,40);
   if(trows){trows.forEach(function(r){writeWrapped(Array.isArray(r)?r.map(String).join("  |  "):String(r),margin+12,pageW-2*margin-12,8.5,"normal")})}
   else{
    var ttxt=String(q.table);
    if(ttxt.trim().charAt(0)==="<")ttxt=ttxt.replace(new RegExp("</tr>","gi"),"\n").replace(new RegExp("</t[dh]>","gi"),"  |  ").replace(new RegExp("<[^>]+>","g")," ").replace(new RegExp("&amp;","g"),"&").replace(new RegExp("&nbsp;","g")," ");
    ttxt.split("\n").forEach(function(ln){ln=ln.replace(new RegExp("[ ]+","g")," ").trim();if(ln)writeWrapped(ln,margin+12,pageW-2*margin-12,8.5,"normal")});
   }
   doc.setTextColor(0,0,0);y+=2;
  }
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure \u2014 shown in the on-screen review]",margin+12,pageW-2*margin-12,8.5,"italic");doc.setTextColor(0,0,0)}
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="   [correct]";
    else if(idx===a){marker="   [your choice]";var ptg=trapOf(q,a);if(ptg)marker+="  trap: "+trapInfo(ptg).name}
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   var pttg=trapOf(q,a);
   writeWrapped("Your answer: "+(skippedQ?"-":a)+(pttg?"   trap: "+trapInfo(pttg).name:""),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

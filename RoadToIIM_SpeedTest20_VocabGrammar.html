.ok{color:var(--green)}.no{color:var(--red)}.dim{color:var(--mut)}.gold{color:var(--gold)}

.vH{font-family:Fraunces,serif;font-size:22px;line-height:1.35}

.dnH{font-family:"DM Mono";font-size:10px;color:var(--mut);letter-spacing:.1em;margin-bottom:6px}
.doNext ol{margin:0;padding-left:20px}

.doNext a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(212,169,78,.6)}

.trap .qs{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}

.rungTop{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.rungTop b{font-family:"DM Mono";font-weight:400;font-size:13px}
.mini,.cbar{display:flex;overflow:hidden;background:var(--panel2)}
.mini{height:8px;border-radius:4px;margin:7px 0 5px}
.cbar{height:16px;border-radius:5px;margin-bottom:10px}
.mini i,.cbar i{display:block;height:100%}

.rungSub{font-size:11.5px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px solid rgba(232,228,216,.06)}
.kv span{color:var(--mut)}
.kv b{font-family:"DM Mono";font-weight:400;font-size:13px;text-align:right}
.kv b span.ok{color:var(--green)}.kv b span.no{color:var(--red)}.kv b span.dim{color:var(--mut)}
.lgd{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
table.anaT{width:100%;border-collapse:collapse;font-size:12.5px}
table.anaT th{font-family:"DM Mono";font-size:10px;color:var(--mut);font-weight:400;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
table.anaT td{font-family:"DM Mono";text-align:right;padding:6px;border-bottom:1px solid rgba(232,228,216,.06)}
table.anaT td:first-child,table.anaT th:first-child{text-align:left;font-family:"DM Sans"}
.palSec{font-family:"DM Mono";font-size:10.5px;color:var(--mut);letter-spacing:.06em;margin:12px 0 6px}
.palSec:first-of-type{margin-top:0}
.pal2{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.pt{position:relative;height:50px;border-radius:7px;border:1px solid rgba(232,228,216,.16);background:var(--panel2);cursor:pointer;overflow:hidden;font-family:"DM Mono";padding:6px 7px}
.pt .pn{display:block;font-size:13px;color:var(--text)}
.pt .ptm{display:block;font-size:10px;color:var(--mut);margin-top:3px}
.pt i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);opacity:.85}
.pt.c{background:rgba(78,160,130,.15);border-color:rgba(78,160,130,.55)}
.pt.w{background:rgba(192,85,85,.24);border-color:rgba(192,85,85,.75)}

.palLeg{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.9}
.palLeg .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 5px 0 12px;vertical-align:-1px}

.trapNote{margin-left:auto;font-family:"DM Mono";font-size:10.5px;color:var(--red);white-space:nowrap;padding-left:8px}

</style>

var QUESTIONS=[{"id":"Q01","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"The new headmaster's room was ______: a table, two chairs and a single calendar on the wall.","options":["ornate","austere","auspicious","arid"],"answer":"austere","answerIndex":1,"difficulty":"easy","explanation":"Austere = severely simple, without ornament or comfort, which the inventory of three objects illustrates. Trap: 'arid' is the near-miss - it means dry or barren and is used figuratively of writing that lacks interest, not of a deliberately bare room. 'Ornate' = heavily decorated, the polarity flip. 'Auspicious' = promising success, the sound-alike with no bearing on furnishing.","verified":"ok","status":"approved","optionTags":["vocab-opposite",null,"vocab-sound-alike","vocab-shade"]},{"id":"Q02","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Coaching turned out to be more ______ than the job he had left, though the hours were far longer.","options":["lucid","ludicrous","laudable","lucrative"],"answer":"lucrative","answerIndex":3,"difficulty":"easy","explanation":"Lucrative = producing a good deal of money, which is the only sense that answers a comparison with a salaried job. Trap: 'laudable' is the one students pick when they read the sentence as praise - it means deserving commendation, which says nothing about earnings. 'Lucid' = clear and easy to follow; 'ludicrous' = absurd. Both are sound-alikes from the same L-cluster.","verified":"ok","status":"approved","optionTags":["vocab-sound-alike","vocab-sound-alike","vocab-shade",null]},{"id":"Q03","section":"VA","format":"SVA","kind":"mcq","td":25,"stem":"Mathematics, along with statistics and basic coding, ______ now part of the first-year syllabus in most of these colleges.","options":["are","is","have been","were"],"answer":"is","answerIndex":1,"difficulty":"easy","explanation":"'Along with' introduces a parenthetical addition and never changes the number of the subject, and 'mathematics' as a field of study is singular - so 'is'. Trap: 'are' is what students write after counting the three subjects listed between the commas. 'Have been' is plural and shifts to the perfect against 'now'; 'were' adds a tense error to the same plural mistake.","verified":"ok","status":"approved","optionTags":["gram-proximity",null,"gram-tense-marker","gram-tense-marker"]},{"id":"Q04","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'complacent' correctly?","options":["The manager was complacent in the fraud and signed the papers himself.","He was complacent and agreed to every change that the committee proposed.","She gave a complacent nod and asked the waiter to bring another chair.","Two easy wins made the team complacent, and they stopped practising their fielding."],"answer":"Two easy wins made the team complacent, and they stopped practising their fielding.","answerIndex":3,"difficulty":"easy","explanation":"Complacent = smugly satisfied with oneself and therefore careless about dangers, which the abandoned fielding practice shows. Trap: option (b) is the sibling error - someone eager to oblige is 'complaisant', a word so close in spelling that the two are constantly swapped. Option (c) makes the same substitution; option (a) needs 'complicit', which means being a party to a wrong.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling","va-confusable-sibling","va-confusable-sibling",null]},{"id":"Q05","section":"VA","format":"Pronouns","kind":"mcq","td":25,"stem":"The teacher ______ the students had complained about has been asked to explain ______ conduct.","options":["who; his","who; their","whom; his","whom; their"],"answer":"whom; his","answerIndex":2,"difficulty":"easy","explanation":"Two decisions. The relative pronoun is the object of 'complained about', so 'whom'; and the conduct to be explained is the teacher's, a singular antecedent, so 'his'. Trap: 'who; his' is the half-fix - students get the possessive right and default to 'who' because it sits next to a plural noun and sounds natural in speech. 'Whom; their' wrongly attaches the conduct to the students.","verified":"ok","status":"approved","optionTags":["gram-half-fix","gram-pronoun",null,"gram-pronoun"]},{"id":"Q06","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"His father advised him to let sleeping dogs lie and not reopen the property dispute. The idiom means:","options":["to avoid stirring up an old trouble","to wait for an opponent to make a mistake","to ignore a problem that is still growing","to settle a quarrel while tempers are cool"],"answer":"to avoid stirring up an old trouble","answerIndex":0,"difficulty":"easy","explanation":"To let sleeping dogs lie = to leave a dormant quarrel undisturbed, which 'not reopen' spells out. Trap: option (c) is the same-frame variant and the commonest wrong choice - it keeps the idea of leaving something alone but makes the trouble active and worsening, whereas the idiom requires it to be asleep. Option (b) describes patient opportunism; option (d) recommends the very intervention the idiom warns against.","verified":"ok","status":"approved","optionTags":[null,"idiom-near-sense","idiom-near-sense","vocab-opposite"]},{"id":"Q07","section":"VA","format":"Tenses","kind":"mcq","td":25,"stem":"The institute ______ three campuses since it ______ its first batch in 2011.","options":["opened; admitted","has opened; has admitted","had opened; admitted","has opened; admitted"],"answer":"has opened; admitted","answerIndex":3,"difficulty":"easy","explanation":"'Since' plus a stated starting point takes the present perfect in the main clause and the simple past in the 'since' clause - the opening is a run continuing to now, the 2011 admission is a finished event. Trap: 'has opened; has admitted' is the half-fix students reach for by making both verbs match; a date as specific as 2011 blocks the present perfect. 'Opened; admitted' loses the continuing span, and 'had opened' needs a later past reference point that the sentence does not supply.","verified":"ok","status":"approved","optionTags":["gram-tense-marker","gram-half-fix","gram-tense-marker",null]},{"id":"Q08","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the word that can be substituted for 'a speech in which a character speaks his thoughts aloud while alone'.","options":["monologue","soliloquy","dialogue","prologue"],"answer":"soliloquy","answerIndex":1,"difficulty":"easy","explanation":"Soliloquy = speech to oneself, with no listener; the aloneness is the defining condition. Trap: 'monologue' is the near-field word that catches most students - it is also one person speaking at length, but it is addressed to others who are present. A 'dialogue' needs two speakers; a 'prologue' is an introductory section, whoever delivers it.","verified":"ok","status":"approved","optionTags":["ows-near-field",null,"ows-near-field","ows-near-field"]},{"id":"Q09","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"The fee-collection software became ______ within four years; no one at the vendor's office could even install it any more.","options":["obsolete","obscure","obstructive","absolute"],"answer":"obsolete","answerIndex":0,"difficulty":"easy","explanation":"Obsolete = out of date and no longer in use, which the inability even to install it confirms. Trap: 'obscure' is the near-miss - it means little known or hard to understand, and software can be obscure while working perfectly. 'Obstructive' = deliberately causing difficulty, which attributes intent to a program. 'Absolute' is the sound-alike with an unrelated sense.","verified":"ok","status":"approved","optionTags":[null,"vocab-shade","va-category-error","vocab-sound-alike"]},{"id":"Q10","section":"VA","format":"Modifiers","kind":"mcq","td":25,"stem":"Choose the option that corrects the sentence: 'After waiting in the corridor for an hour, the file was finally handed over to the parents.'","options":["After waiting in the corridor for an hour, the parents were finally handed the file.","After waiting in the corridor for an hour, the file was finally handed over to the parents by the clerk.","The file, after waiting in the corridor for an hour, was finally handed over to the parents.","After having waited in the corridor for an hour, the file was finally handed over to the parents."],"answer":"After waiting in the corridor for an hour, the parents were finally handed the file.","answerIndex":0,"difficulty":"easy","explanation":"The ones who waited are the parents, so they must be the subject the opening phrase modifies. Trap: option (b) is the half-fix - naming the clerk feels like supplying the missing agent, but the subject is still 'the file', which is what the phrase goes on modifying. Option (d) changes only the participle's form; option (c) moves the dangler inside the sentence and makes the file's waiting explicit.","verified":"ok","status":"approved","optionTags":[null,"gram-half-fix","gram-modifier-subject","gram-modifier-subject"]},{"id":"Q11","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Booking two days before the exam, he had to pay through the nose for a hotel room. The idiom means:","options":["pay in instalments over a long period","pay a bribe to get a service done quickly","pay reluctantly and after much delay","pay far more than a thing is worth"],"answer":"pay far more than a thing is worth","answerIndex":3,"difficulty":"easy","explanation":"To pay through the nose = to be charged an excessive price, which late booking explains. Trap: option (b) is the same-frame variant that tempts in an Indian context - a bribe is also money paid unwillingly, but the idiom concerns an inflated legitimate price, not an illicit payment. Option (c) shifts the complaint from the amount to the attitude; option (a) is about the manner of payment.","verified":"ok","status":"approved","optionTags":["idiom-near-sense","idiom-near-sense","idiom-near-sense",null]},{"id":"Q12","section":"VA","format":"Prepositions","kind":"mcq","td":25,"stem":"The school has agreed to comply ______ the new order and to accede ______ the parents' request for a refund.","options":["to; to","with; for","with; to","to; with"],"answer":"with; to","answerIndex":2,"difficulty":"easy","explanation":"One complies 'with' a rule and accedes 'to' a request. Trap: 'to; to' is the designed error - 'comply to' is a very common slip, and the repeated preposition makes the pair look consistent. 'With; for' gets the first right and then borrows the 'for' of 'ask for'; 'to; with' inverts the correct pair exactly.","verified":"ok","status":"approved","optionTags":["sc-collocation","sc-collocation",null,"sc-collocation"]},{"id":"Q13","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which sentence uses the word 'imminent' correctly?","options":["An imminent historian was invited to deliver the convocation address this year.","He is imminent in the field of tax law and often appears on television panels.","The clouds and the still air suggested that a storm was imminent.","She has the imminent qualities of a good teacher: patience and clarity."],"answer":"The clouds and the still air suggested that a storm was imminent.","answerIndex":2,"difficulty":"easy","explanation":"Imminent = about to happen very soon, so it takes events, not people or qualities. Trap: option (a) is the sibling error - a distinguished person is 'eminent', and the two words differ by one letter. Option (b) repeats that substitution in a different frame; option (d) needs 'inherent', qualities that belong to something by nature.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling","va-confusable-sibling",null,"va-confusable-sibling"]},{"id":"Q14","section":"VA","format":"Roots","kind":"mcq","td":25,"stem":"The root 'chron-', as in 'chronic', 'anachronism' and 'chronology', carries the sense of:","options":["order or sequence","a long duration","time","a record or account"],"answer":"time","answerIndex":2,"difficulty":"easy","explanation":"'Chron-' means time; each word adds something to it - lasting in time, out of its time, the arrangement of times. Trap: 'order or sequence' is drawn from 'chronology' alone and mistakes that whole word's meaning for the root's, which is the single commonest error on root items. 'A long duration' does the same with 'chronic'; 'a record or account' does it with 'chronicle'.","verified":"ok","status":"approved","optionTags":["root-whole-word","root-whole-word",null,"root-whole-word"]},{"id":"Q15","section":"VA","format":"Sentence Correction","kind":"mcq","td":25,"stem":"In the sentence below, the part in brackets is incorrect. Choose the alternative that renders the sentence correct. 'He is one of those teachers [who never raises his voice, even when the class is noisy].'","options":["who never raises his voice, even when the class is noisy","who never raise their voices, even when the class is noisy","who never raise his voice, even when the class is noisy","which never raise their voices, even when the class is noisy"],"answer":"who never raise their voices, even when the class is noisy","answerIndex":1,"difficulty":"easy","explanation":"In 'one of those teachers who', the relative pronoun refers to 'teachers', not to 'one', so the verb and the possessive must both be plural. Trap: option (c) is the half-fix - students correct the verb and leave 'his', which then clashes with it. Option (d) fixes both and introduces 'which' for people; option (a) is the original span.","verified":"ok","status":"approved","optionTags":["gram-sounds-right",null,"gram-half-fix","gram-new-error"]},{"id":"Q16","section":"VA","format":"Fill in the Blank","kind":"mcq","td":30,"stem":"Within two years the QR code had become ______: it was on tea stalls, temple donation boxes and autorickshaw dashboards.","options":["ambiguous","innocuous","unanimous","ubiquitous"],"answer":"ubiquitous","answerIndex":3,"difficulty":"medium","explanation":"Ubiquitous = found everywhere, which the three unrelated locations demonstrate. Trap: 'ambiguous' is the sound-alike students pick when they are matching the shape of a long adjective rather than its sense - it means open to more than one reading. 'Unanimous' = in complete agreement, and applies to people, not objects. 'Innocuous' = harmless, true of a QR code but irrelevant to the list.","verified":"ok","status":"approved","optionTags":["vocab-sound-alike","vocab-context-blind","va-category-error",null]},{"id":"Q17","section":"VA","format":"Fill in the Blank","kind":"mcq","td":30,"stem":"What began as a polite exchange turned ______ the moment the refund was refused; two parents had to be escorted out.","options":["turbulent","tractable","truculent","truncated"],"answer":"truculent","answerIndex":2,"difficulty":"medium","explanation":"Truculent = aggressively defiant, eager to quarrel, which being escorted out confirms. Trap: 'turbulent' is the near-miss that catches most candidates - it describes a disordered situation rather than a person's belligerence, and 'turned turbulent' reads idiomatically enough to pass. 'Tractable' = easily managed, the polarity flip. 'Truncated' = cut short, which the exchange was, but the blank describes its temper.","verified":"ok","status":"approved","optionTags":["vocab-shade","vocab-opposite",null,"vocab-context-blind"]},{"id":"Q18","section":"VA","format":"SVA","kind":"mcq","td":30,"stem":"There ______ among the shortlisted names two candidates whose documents ______ still to be verified.","options":["is; are","are; are","are; is","is; is"],"answer":"are; are","answerIndex":1,"difficulty":"medium","explanation":"In an existential 'there' sentence the verb agrees with the real subject, which here is 'two candidates', so 'are'; and 'documents' is plural, so 'are' again. Trap: 'is; are' is the designed error - the singular-looking phrase 'among the shortlisted names' sits between 'there' and the subject, and candidates agree with whatever is nearest. 'Are; is' gets the inversion right and then lets 'whose' feel singular; 'is; is' commits both faults.","verified":"ok","status":"approved","optionTags":["gram-proximity",null,"gram-half-fix","gram-proximity"]},{"id":"Q19","section":"VA","format":"Word Usage","kind":"mcq","td":30,"stem":"Which sentence uses the word 'ingenuous' correctly?","options":["His ingenuous solution used two pulleys and a short length of rope.","The ingenuous design of the folding desk won a prize at the district fair.","Her ingenuous reply showed she had not understood that she was being teased.","She was too ingenuous to accept the first offer and negotiated for a week."],"answer":"Her ingenuous reply showed she had not understood that she was being teased.","answerIndex":2,"difficulty":"medium","explanation":"Ingenuous = innocently frank, unsuspecting; missing the teasing is exactly that innocence. Trap: options (a) and (b) are the sibling confusion the item exists to catch - a clever contrivance is 'ingenious', and only one letter separates the pair. Option (d) reverses the word: an ingenuous person is the one who would accept the first offer, not hold out for a week.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling","va-confusable-sibling",null,"vocab-opposite"]},{"id":"Q20","section":"VA","format":"Pronouns","kind":"mcq","td":30,"stem":"Choose the grammatically correct sentence.","options":["The warden asked the two of we boys to explain who we had met at the gate.","The warden asked the two of us boys to explain whom we had met at the gate.","The warden asked the two of us boys to explain who we had met at the gate.","The warden asked the two of we boys to explain whom we had met at the gate."],"answer":"The warden asked the two of us boys to explain whom we had met at the gate.","answerIndex":1,"difficulty":"medium","explanation":"Two faults to clear: 'of' is a preposition and takes 'us', and the relative pronoun is the object of 'had met', so 'whom'. Trap: option (c) is the half-fix nearly everyone stops at - 'us boys' is the error students are trained to hear, and 'who we had met' then sounds unremarkable. Option (d) half-fixes the other way; option (a) carries both faults.","verified":"ok","status":"approved","optionTags":["gram-pronoun",null,"gram-half-fix","gram-half-fix"]},{"id":"Q21","section":"VA","format":"Idioms","kind":"mcq","td":30,"stem":"By publishing its fee structure online, the smaller institute threw down the gauntlet. The idiom means:","options":["surrendered a long-standing advantage","accepted a challenge already made","issued an open challenge to rivals","made a secret of a trade practice"],"answer":"issued an open challenge to rivals","answerIndex":2,"difficulty":"medium","explanation":"To throw down the gauntlet = to issue a challenge; to take up the gauntlet is to accept one. Trap: option (b) is the designed error, because the two halves of the same medieval image are routinely confused and 'gauntlet' alone tells you only that a challenge is involved, not which side made it. Option (a) inverts the aggression; option (d) contradicts 'publishing ... online'.","verified":"ok","status":"approved","optionTags":["vocab-opposite","idiom-near-sense",null,"vocab-opposite"]},{"id":"Q22","section":"VA","format":"Tenses","kind":"mcq","td":30,"stem":"No sooner ______ the results been uploaded than the server ______ under the load.","options":["had; collapsed","has; collapsed","had; had collapsed","did; collapse"],"answer":"had; collapsed","answerIndex":0,"difficulty":"medium","explanation":"'No sooner' at the head of a clause forces inversion with the past perfect, and the second event, being later, takes the simple past: 'No sooner had ... than ... collapsed'. Trap: 'had; had collapsed' puts both clauses in the past perfect, which destroys the sequence the idiom exists to express - this is the most frequent error on the pattern. 'Has' mismatches the finished event; 'did ... collapse' cannot govern the participle 'been uploaded'.","verified":"ok","status":"approved","optionTags":[null,"gram-tense-marker","gram-double-marker","gram-idiom"]},{"id":"Q23","section":"VA","format":"One Word Substitution","kind":"mcq","td":30,"stem":"Choose the word that can be substituted for 'one who falsely claims to have special knowledge or skill'.","options":["sceptic","pedant","dilettante","charlatan"],"answer":"charlatan","answerIndex":3,"difficulty":"medium","explanation":"Charlatan = a pretender to expertise he does not have; the falsity of the claim is the whole point. Trap: 'dilettante' is the near-field word good candidates choose - but a dilettante dabbles superficially and may be perfectly open about it, making no false claim at all. A 'pedant' parades real if trivial learning; a 'sceptic' doubts the claims of others.","verified":"ok","status":"approved","optionTags":["ows-near-field","ows-near-field","ows-near-field",null]},{"id":"Q24","section":"VA","format":"Fill in the Blank","kind":"mcq","td":30,"stem":"The damage was ______: by the time the cracks showed on the surface, the beams had been weakening for a decade.","options":["invidious","insidious","insipid","incisive"],"answer":"insidious","answerIndex":1,"difficulty":"medium","explanation":"Insidious = proceeding gradually and unnoticed before doing harm, which the decade of hidden weakening describes. Trap: 'invidious' is the confusable sibling and the designed error - it means likely to arouse resentment, as an invidious comparison does, and the two words differ by two letters. 'Insipid' = flavourless or dull; 'incisive' = sharply analytical.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling",null,"vocab-sound-alike","vocab-sound-alike"]},{"id":"Q25","section":"VA","format":"Modifiers","kind":"mcq","td":30,"stem":"Choose the option that corrects the sentence: 'Covered in red ink, the student could hardly bear to look at the answer script.'","options":["Covered in red ink, the answer script was one the student could hardly bear to look at.","Covered in red ink, the student could hardly bear to look at his own answer script.","The student, covered in red ink, could hardly bear to look at the answer script.","Being covered in red ink, the student could hardly bear to look at the answer script."],"answer":"Covered in red ink, the answer script was one the student could hardly bear to look at.","answerIndex":0,"difficulty":"medium","explanation":"What is covered in red ink is the script, so the script must be the subject the opening phrase modifies. Trap: option (b) is the half-fix - adding 'his own' makes the ownership clear and feels like a repair, but the subject is still the student, who remains the one covered in ink. Option (d) alters only the participle's form; option (c) moves the phrase and states the absurdity outright.","verified":"ok","status":"approved","optionTags":[null,"gram-half-fix","gram-modifier-subject","gram-modifier-subject"]},{"id":"Q26","section":"VA","format":"Idioms","kind":"mcq","td":30,"stem":"The committee dismissed the complaint, saying the writer clearly had an axe to grind. The idiom means:","options":["a difficult task left half finished","a long-standing rivalry with a colleague","a sharp manner of putting an argument","a private grievance behind the stated case"],"answer":"a private grievance behind the stated case","answerIndex":3,"difficulty":"medium","explanation":"To have an axe to grind = to have a personal interest or grudge driving what one says, which is why the committee treats the complaint as unreliable. Trap: option (b) is the near-miss that catches many - a rivalry may well be the source of the grudge, but the idiom names the hidden motive, not a relationship, and a grievance can exist with no rival at all. Options (a) and (c) literalise the axe as a task and as sharpness.","verified":"ok","status":"approved","optionTags":["idiom-literal","idiom-near-sense","idiom-literal",null]},{"id":"Q27","section":"VA","format":"Parallelism","kind":"mcq","td":30,"stem":"Choose the option that completes the sentence correctly: 'The coach insisted that the boys arrive early, that they eat before practice and ______.'","options":["that they sleep eight hours","to sleep for eight hours","sleeping for eight hours","that they should be sleeping eight hours"],"answer":"that they sleep eight hours","answerIndex":0,"difficulty":"medium","explanation":"'Insisted that' governs the subjunctive, which is why the first two items read 'arrive' and 'eat' rather than 'arrives' and 'eats'; the third must match in both form and mood. Trap: option (d) keeps the 'that' clause, so it looks parallel, and replaces the subjunctive with 'should be sleeping' - the option strong candidates choose. Options (b) and (c) switch to an infinitive and a participle.","verified":"ok","status":"approved","optionTags":[null,"gram-parallelism","gram-parallelism","gram-mood"]},{"id":"Q28","section":"VA","format":"Word Usage","kind":"mcq","td":30,"stem":"Which sentence uses the word 'peruse' correctly?","options":["He perused the contract line by line before signing it.","She perused the headlines quickly while the tea was brewing.","They perused the corridor twice looking for the examination hall.","The officer perused the suspect for two blocks before losing him in the crowd."],"answer":"He perused the contract line by line before signing it.","answerIndex":0,"difficulty":"medium","explanation":"Peruse = to read closely and thoroughly; 'line by line' is the phrase that fits it. Trap: option (b) is the misuse that has become almost standard - 'peruse' is widely taken to mean skim or glance through, which is the opposite of its sense, and students pick it because it sounds like the more natural English. Option (d) needs 'pursued', the sibling; option (c) needs 'traversed' or simply 'walked'.","verified":"ok","status":"approved","optionTags":[null,"vocab-opposite","va-category-error","va-confusable-sibling"]},{"id":"Q29","section":"VA","format":"Word Choice","kind":"mcq","td":30,"stem":"Choose the word that correctly completes the sentence: 'The report divides the process into five ______ stages, each with its own sign-off.'","options":["discreet","discretionary","discursive","discrete"],"answer":"discrete","answerIndex":3,"difficulty":"medium","explanation":"Discrete = separate and distinct, which five separately signed-off stages are. Trap: 'discreet' is the designed error - it means careful not to attract attention or reveal confidences, and it is the far commoner spelling, so the eye accepts it. 'Discretionary' = left to one's judgement; 'discursive' = rambling, moving from topic to topic.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling","vocab-sound-alike","vocab-sound-alike",null]},{"id":"Q30","section":"VA","format":"Sentence Correction","kind":"mcq","td":30,"stem":"In the sentence below, the part in brackets is incorrect. Choose the alternative that renders the sentence correct. 'The library committee, [along with the two student representatives, has decided to revise their lending rules], which have not changed since 2014.'","options":["along with the two student representatives, has decided to revise their lending rules","along with the two student representatives, have decided to revise their lending rules","along with the two student representatives, has decided to revise its lending rules","along with the two student representatives, have decided to revise its lending rules"],"answer":"along with the two student representatives, has decided to revise its lending rules","answerIndex":2,"difficulty":"medium","explanation":"The only fault is the pronoun: 'committee' is singular here, so the rules are 'its'. The verb 'has' is already right, because 'along with' does not add to the subject. Trap: option (b) is the designed error - students see the plural 'representatives', assume the subject is compound, and change the verb instead of the pronoun, which repairs nothing and breaks what was correct. Option (d) makes both changes; option (a) is the original.","verified":"ok","status":"approved","optionTags":["gram-pronoun","gram-proximity",null,"gram-new-error"]},{"id":"Q31","section":"VA","format":"Fill in the Blank","kind":"mcq","td":35,"stem":"Two ______ spectators were removed from the gallery before the hearing could resume.","options":["obsequious","obstreperous","obtuse","obdurate"],"answer":"obstreperous","answerIndex":1,"difficulty":"hard","explanation":"Obstreperous = noisily and unrulily resistant to control, which is what gets spectators removed so that proceedings can continue. Trap: 'obdurate' is the near-miss that catches good candidates - it means stubbornly unyielding, and a stubborn spectator might be ejected too, but obduracy can be entirely silent and the sentence needs the disruption that stopped the hearing. 'Obsequious' = fawningly servile, the polarity flip; 'obtuse' = slow to understand.","verified":"ok","status":"approved","optionTags":["vocab-opposite",null,"vocab-sound-alike","vocab-shade"]},{"id":"Q32","section":"VA","format":"Fill in the Blank","kind":"mcq","td":35,"stem":"The diary is valuable precisely because it records the ______ - what the family ate, what the fare cost, who called in the evening.","options":["quixotic","quotidian","querulous","quiescent"],"answer":"quotidian","answerIndex":1,"difficulty":"hard","explanation":"Quotidian = daily, everyday, commonplace; meals, fares and evening visitors are the ordinary texture of a day. Trap: 'quiescent' is the sound-alike students settle on because a quiet domestic record feels quiescent - but it means inactive or dormant, which describes a state, not the daily round. 'Quixotic' = idealistic to the point of impracticality; 'querulous' = habitually complaining.","verified":"ok","status":"approved","optionTags":["vocab-sound-alike",null,"vocab-sound-alike","vocab-sound-alike"]},{"id":"Q33","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"Not only the clerk but also the two peons ______ been questioned, and neither of their statements ______ the warden's account.","options":["have; matches","has; matches","have; match","has; match"],"answer":"have; matches","answerIndex":0,"difficulty":"hard","explanation":"Two rules pull in opposite directions in one sentence. 'Not only ... but also' agrees with the nearer subject, 'the two peons', so 'have'; but 'neither of' is singular, so 'matches'. Trap: 'have; match' is the commonest answer - once students have reasoned their way to a plural verb for the first blank, they carry the plural across to the second, where 'statements' sits invitingly next to the verb. 'Has; matches' applies the singular twice, and 'has; match' gets both exactly wrong.","verified":"ok","status":"approved","optionTags":[null,"gram-sounds-right","gram-carryover","gram-proximity"]},{"id":"Q34","section":"VA","format":"Word Usage","kind":"mcq","td":35,"stem":"Which sentence uses the word 'deprecate' correctly?","options":["The rupee deprecated against the dollar for the fourth week running.","Office equipment of this kind deprecates by about fifteen per cent a year.","He deprecated the value of the land before putting it up for sale.","The vice-chancellor deprecated the practice of holding classes on public holidays."],"answer":"The vice-chancellor deprecated the practice of holding classes on public holidays.","answerIndex":3,"difficulty":"hard","explanation":"Deprecate = to express strong disapproval of something, so it takes a practice or a proposal as its object. Trap: options (a) and (b) are the sibling confusion the item is built on - a fall in monetary value is 'depreciate', and the two verbs differ by two letters in the middle. Option (c) needs 'depreciated' in the sense of talking the value down.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling","va-confusable-sibling","va-confusable-sibling",null]},{"id":"Q35","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"Were the committee ______ the matter afresh, it ______ the same conclusion, the chairman said.","options":["to examine; will reach","examining; would reach","to examine; would reach","to have examined; would reach"],"answer":"to examine; would reach","answerIndex":2,"difficulty":"hard","explanation":"'Were ... to' is the inverted form of a present or future unreal condition, and its consequence clause takes 'would'. Trap: 'to have examined' is the error candidates make by analogy with the third conditional, where the perfect is right - but 'were ... to have examined' pushes the condition into the past while 'afresh' and 'would reach' keep it hypothetical and forward-looking. 'Examining' breaks the inverted construction; 'will reach' abandons the unreal mood altogether.","verified":"ok","status":"approved","optionTags":["gram-mood","gram-idiom",null,"gram-tense-marker"]},{"id":"Q36","section":"VA","format":"Idioms","kind":"mcq","td":35,"stem":"The question about the vendor's address turned out to be a red herring. The idiom means:","options":["a clue that proves far harder to follow than anyone expected","a distraction from the real issue","a warning sign that everyone chose to ignore","a false accusation made in public"],"answer":"a distraction from the real issue","answerIndex":1,"difficulty":"hard","explanation":"A red herring = something introduced, by design or accident, that leads attention away from what matters. Trap: option (a) is the same-frame variant and the favourite wrong answer - a red herring is indeed a false trail, so students slide from 'misleading' to 'merely difficult', but a hard clue still points at the truth. Option (c) confuses it with a red flag; option (d) imports an accusation the idiom never implies.","verified":"ok","status":"approved","optionTags":["idiom-near-sense",null,"vocab-wrong-idiom","idiom-near-sense"]},{"id":"Q37","section":"VA","format":"Modifiers","kind":"mcq","td":35,"stem":"Choose the option in which the placement of 'nearly' makes the sentence say that the amount actually collected fell just short of one lakh rupees.","options":["The alumni committee collected nearly one lakh rupees in three days.","The alumni committee nearly collected one lakh rupees in three days.","Nearly the alumni committee collected one lakh rupees in three days.","The alumni committee collected one lakh rupees in nearly three days."],"answer":"The alumni committee collected nearly one lakh rupees in three days.","answerIndex":0,"difficulty":"hard","explanation":"'Nearly' modifies whatever follows it, so to limit the sum it must sit immediately before 'one lakh rupees'. Trap: option (b) is the version people write and say without noticing - placed before the verb, 'nearly collected' says the collecting itself almost happened, which would mean the money was never raised at all. Option (d) limits the time taken; option (c) attaches it to the committee, which is not English.","verified":"ok","status":"approved","optionTags":[null,"gram-modifier-scope","gram-modifier-scope","gram-modifier-scope"]},{"id":"Q38","section":"VA","format":"One Word Substitution","kind":"mcq","td":35,"stem":"Choose the word that can be substituted for 'violently abusive language directed at someone'.","options":["polemic","rebuttal","innuendo","invective"],"answer":"invective","answerIndex":3,"difficulty":"hard","explanation":"Invective = abusive, denunciatory language; the violence of the abuse is its defining feature. Trap: 'polemic' is the near-field word strong candidates choose - it is also an attack, but a reasoned and usually written one, and a polemic can be perfectly courteous. A 'rebuttal' answers an argument with evidence; 'innuendo' is disparagement by indirect hint, the opposite of open abuse.","verified":"ok","status":"approved","optionTags":["ows-near-field","ows-near-field","ows-near-field",null]},{"id":"Q39","section":"VA","format":"Fill in the Blank","kind":"mcq","td":35,"stem":"The new government moved to ______ the treaty altogether rather than renegotiate its terms.","options":["arrogate","abrogate","abdicate","aggregate"],"answer":"abrogate","answerIndex":1,"difficulty":"hard","explanation":"Abrogate = to repeal or annul formally, which is what 'altogether rather than renegotiate' demands. Trap: 'arrogate' is the confusable sibling and the designed error - it means to claim something for oneself without right, so it takes powers or privileges as its object, never a treaty one wishes to end. 'Abdicate' = to renounce a throne or a duty; 'aggregate' = to gather into a total.","verified":"ok","status":"approved","optionTags":["va-confusable-sibling",null,"vocab-sound-alike","vocab-sound-alike"]},{"id":"Q40","section":"VA","format":"Parallelism","kind":"mcq","td":35,"stem":"Choose the option that completes the sentence correctly: 'The study found that the scheme was neither as cheap as the ministry had claimed ______.'","options":["nor as quick as the contractors had promised","or as quick as the contractors had promised","nor the contractors had promised it would be quick","nor quick as the contractors had promised"],"answer":"nor as quick as the contractors had promised","answerIndex":0,"difficulty":"hard","explanation":"Two requirements at once: 'neither' must be answered by 'nor', and the second limb must repeat the full comparative frame 'as ... as' that the first limb used. Trap: option (d) is the error good candidates make - they get 'nor' right and drop the first 'as', leaving 'nor quick as', because the single 'as' still sounds like a comparison. Option (b) pairs 'neither' with 'or'; option (c) abandons the comparative structure for a clause.","verified":"ok","status":"approved","optionTags":[null,"gram-idiom","gram-parallelism","gram-half-fix"]},{"id":"Q41","section":"VA","format":"Idioms","kind":"mcq","td":35,"stem":"By announcing the scholarship a fortnight early, the college stole a march on its rivals. The idiom means:","options":["copied a rival's plan before it could be launched","claimed the credit for a rival's achievement","gained an advantage by acting first","forced a rival to abandon a plan"],"answer":"gained an advantage by acting first","answerIndex":2,"difficulty":"hard","explanation":"To steal a march on someone = to gain an advantage by moving before they do; the military image is of marching while the enemy sleeps. Trap: option (a) is the designed error, because 'stole' pulls students towards theft of a plan rather than theft of time, and a fortnight's notice does sound like pre-empting someone else's announcement. Option (b) belongs to a different idiom about credit; option (d) overstates the effect.","verified":"ok","status":"approved","optionTags":["idiom-literal","vocab-wrong-idiom",null,"idiom-near-sense"]},{"id":"Q42","section":"VA","format":"Prepositions","kind":"mcq","td":35,"stem":"She was prevailed ______ to withdraw the complaint and was later reconciled ______ her former partner.","options":["upon; with","on; to","upon; to","over; with"],"answer":"upon; with","answerIndex":0,"difficulty":"hard","explanation":"The fixed form is 'prevail upon someone to do something', and one is reconciled 'with' a person but reconciled 'to' a situation. Trap: 'upon; to' is the designed error - candidates get the first phrase right and then choose 'reconciled to', which is perfectly good English in its own place, forgetting that the object here is a person. 'On' is the weaker variant that examiners mark down in this construction; 'over' breaks the collocation entirely.","verified":"ok","status":"approved","optionTags":[null,"sc-collocation","sc-collocation","sc-collocation"]},{"id":"Q43","section":"VA","format":"Word Usage","kind":"mcq","td":35,"stem":"Which sentence uses the word 'refute' correctly?","options":["The minister refuted the allegation and called it baseless and motivated.","He refuted to answer any question about the missing audit papers.","The board refuted the proposal at its very first meeting last month.","The researcher refuted the claim by producing the original survey forms."],"answer":"The researcher refuted the claim by producing the original survey forms.","answerIndex":3,"difficulty":"hard","explanation":"Refute = to prove a statement false by argument or evidence; the original forms are the proof that makes the word accurate. Trap: option (a) is the misuse now standard in news writing - calling something baseless is merely denying it, and a denial is not a disproof, which is precisely the distinction the item tests. Option (b) needs 'refused', the sibling; option (c) needs 'rejected'.","verified":"ok","status":"approved","optionTags":["vocab-shade","va-confusable-sibling","vocab-shade",null]},{"id":"Q44","section":"VA","format":"Roots","kind":"mcq","td":35,"stem":"The root 'pug-', as in 'pugnacious', 'impugn' and 'repugnant', carries the sense of:","options":["a smell or odour","pushing away","pride","fight"],"answer":"fight","answerIndex":3,"difficulty":"hard","explanation":"'Pug-' means to fight: ready to fight, to attack a claim, fighting against one's feelings. Trap: 'a smell or odour' is the error the item is designed to catch - 'repugnant' in modern use so often describes something disgusting that students read the root off the feeling rather than the fighting. 'Pushing away' comes from confusing it with 'repel'; 'pride' comes from assuming a pugnacious person must be proud.","verified":"ok","status":"approved","optionTags":["root-whole-word","root-confused","root-whole-word",null]},{"id":"Q45","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"In the sentence below, the part in brackets is incorrect. Choose the alternative that renders the sentence correct. 'The minutes record that the chairman [insisted that the resolution was put to vote and that the dissenting note is annexed to the file].'","options":["insisted that the resolution was put to vote and that the dissenting note is annexed to the file","insisted that the resolution be put to vote and that the dissenting note is annexed to the file","insisted that the resolution be put to vote and that the dissenting note be annexed to the file","insisted that the resolution should be put to vote and that the dissenting note is annexed to the file"],"answer":"insisted that the resolution be put to vote and that the dissenting note be annexed to the file","answerIndex":2,"difficulty":"hard","explanation":"'Insisted that' expressing a demand governs the subjunctive, and the span contains two such clauses, so both verbs must take the bare 'be'. Trap: option (b) is the half-fix nearly all candidates settle on - they correct the first clause, where the error is loudest, and leave the second, which reads smoothly because 'is annexed' is ordinary indicative English. Option (d) substitutes 'should be' for the subjunctive in the first clause and still leaves the second; option (a) is the original.","verified":"ok","status":"approved","optionTags":["gram-mood","gram-half-fix",null,"gram-mood"]}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
/* ==================== ADAPTIVE ROUTER (v2.9) ====================
   QUESTIONS starts as the whole pool; it becomes the SERVED list,
   filled one slot at a time. Right answer: one band up. Wrong, blank
   or timed out: one band down. First unused question of the band;
   if that band is empty, the nearest band with stock. */
var AD=CFG.adaptive,POOL=QUESTIONS,AD_B=["easy","medium","hard"],adSeq=[],adBands=[],adTargets=[]; /* adBands = served question's band; adTargets = band the student had earned (routing state) */
QUESTIONS=new Array(AD.serve);NQ=AD.serve;
function adBandOf(q){var d=diffOf(q);var b=d?AD_B.indexOf(d):1;return b<0?1:b}
function adFirstLeft(b){for(var i=0;i<POOL.length;i++){if(adBandOf(POOL[i])===b&&adSeq.indexOf(i)===-1)return i}return -1}
function adPick(t,dir){
 var p=adFirstLeft(t);if(p!==-1)return {p:p,b:t};
 var alt=t===0?[1,2]:(t===2?[1,0]:(dir>0?[2,0]:[0,2])); /* empty band: nearest first; medium empty follows the move */
 for(var k=0;k<alt.length;k++){p=adFirstLeft(alt[k]);if(p!==-1)return {p:p,b:alt[k]}}
 return null;
}
function adServe(k,t,dir){var r=adPick(t,dir);if(!r)return false;adSeq[k]=r.p;adBands[k]=r.b;adTargets[k]=t;QUESTIONS[k]=POOL[r.p];return true}
function adRoute(k){
 if(k+1>=NQ||QUESTIONS[k+1])return; /* already served (resume): never re-roll */
 var a=answers[k],ok=!(a===null||a===""||a===undefined)&&isCorrect(QUESTIONS[k],a);
 var dir=ok?1:-1;
 adServe(k+1,Math.max(0,Math.min(2,adTargets[k]+dir)),dir); /* route from the earned band, not a fallback */
}
function adFillRest(){for(var k=0;k<NQ-1;k++){if(!QUESTIONS[k+1])adRoute(k)}}
function adIdList(){return adSeq.map(function(p){return String(POOL[p].id)})}
function adRestore(s){
 if(!Array.isArray(s.adIds)||!s.adIds.length||s.adIds.length>NQ)return false;
 var seq=[];
 for(var k=0;k<s.adIds.length;k++){
  var p=-1;for(var i=0;i<POOL.length;i++){if(String(POOL[i].id)===String(s.adIds[k])){p=i;break}}
  if(p===-1||seq.indexOf(p)!==-1)return false;seq.push(p);
 }
 adSeq=seq;adBands=seq.map(function(p){return adBandOf(POOL[p])});
 adTargets=(Array.isArray(s.adTargets)&&s.adTargets.length===seq.length)?s.adTargets.map(function(t){return Math.max(0,Math.min(2,t|0))}):adBands.slice();
 QUESTIONS=new Array(NQ);for(var j=0;j<seq.length;j++)QUESTIONS[j]=POOL[seq[j]];
 if(typeof s.currentQ!=="number"||s.currentQ>seq.length-1)s.currentQ=seq.length-1;
 return true;
}
function adPayload(P){
 var wq=[],sa={},qt={};
 QUESTIONS.forEach(function(q,i){
  var id=String(q.id),a=answers[i];
  sa[id]=(a===undefined?null:a);qt[id]=questionTimes[i]||0;
  if(!(a===null||a===""||a===undefined)&&!isCorrect(q,a))wq.push(id);
 });
 P.wrongQuestions=JSON.stringify(wq);P.studentAnswers=JSON.stringify(sa);P.questionTimes=JSON.stringify(qt);
}
function adTop(){var t=0;for(var k=0;k<adTargets.length;k++)if(adTargets[k]>t)t=adTargets[k];return t}
function adClimbHTML(A){
 var L=["E","M","H"],H='<div class="rung"><div class="rungTop"><span>You climbed to: <b class="gold" style="font-family:Fraunces,serif;font-size:15px">'+capW(AD_B[adTop()])+'</b></span><b class="dim">'+plural(adBands.length,"question","questions")+' served</b></div>';
 H+='<div class="adStrip">';
 for(var k=0;k<adBands.length;k++){
  var o=A.out[k]||"s";
  H+='<i class="b'+adBands[k]+' '+o+'" data-q="'+k+'" title="Q'+(k+1)+' &middot; '+capW(AD_B[adBands[k]])+' &middot; '+outWord(o)+'">'+L[adBands[k]]+'</i>';
 }
 H+='</div><div class="adAxis"><span>Q1</span><span>Q'+adBands.length+'</span></div>';
 H+='<div class="rungSub" style="margin-top:6px">Each block is one question, in the order you got them. Higher means harder. A right answer took you up a level; a wrong or blank one took you down.</div></div>';
 return H;
}
function adPdfLine(){
 var L=["E","M","H"];
 return "You climbed to: "+capW(AD_B[adTop()])+". Level of each question in order: "+adBands.map(function(b){return L[b]}).join(" ");
}
function adLoginNote(){
 var m=document.getElementById("lgMeta");
 if(m)m.innerHTML+="<br>adaptive &middot; a right answer makes the next question harder, a wrong or blank one makes it easier";
}
adServe(0,AD_B.indexOf(String(AD.start||"medium"))===-1?1:AD_B.indexOf(String(AD.start||"medium")),0);

var PIN_REGEX=/^(STU|IMS)\d{10}$/;
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var marked=new Array(NQ).fill(false);
var deadline=0,tickCount=0; /* v2.5 wall-clock timer */
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;
var qShownQ=-1,visits=[]; /* v2.7: on-device visit log for the results analysis (never sent) */
var RAPID=!!CFG.rapid; /* v2.4 rapid mode */
var qSecondsLeft=0,qStartTs=0,qInterval=null,pendingResumeStartTs=null;
function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,visits:visits,adIds:adIdList(),adBands:adBands,adTargets:adTargets,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 if(!adRestore(s)){snClearSession();alert("Could not restore the earlier attempt. Starting fresh.");return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(Array.isArray(s.visits))visits=s.visits.filter(function(v){return v&&typeof v.q==="number"&&v.q>=0&&v.q<NQ});
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();

  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";

 }

}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;

  })(i);
 }

 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){
  var d=Math.round((Date.now()-qShownTs)/1000);
  questionTimes[currentQ]+=d;
  if(d>=1&&qShownQ===currentQ){ /* v2.7: one visit = from showing a question to leaving it */
   var e=elapsedNow();
   visits.push({q:currentQ,s:Math.max(0,e-d),d:d,a:answers[currentQ]});
   if(visits.length>800)visits.shift();
  }
 }
 qShownTs=Date.now();
}
function elapsedNow(){ /* seconds into the test on the test clock (sections ended early are not counted) */
 if(RAPID)return 0;
 var left=deadline?(deadline-Date.now())/1000:secondsLeft;
 var base=SEC?elapsedPrior+SEC[secIdx].minutes*60:CFG.minutes*60;
 return Math.max(0,Math.round(base-left));
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulText(el,t){el.textContent="";String(t==null?"":t).split(/(\[\[[\s\S]*?\]\])/).forEach(function(p){if(!p)return;var m=p.match(/^\[\[([\s\S]*)\]\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 /* v2.7 fix: picking an option re-renders the same question; that must not restart its stopwatch */
 if(!qShownTs||qShownQ!==currentQ){qShownTs=Date.now();qShownQ=currentQ}
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section;
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulText(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 adRoute(currentQ); /* v2.9: serve the next slot from the band this answer earned */
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 if(q.format==="Parajumble")return String(a).trim()===String(q.answer); /* stem rule: 3412 valid; 3412. and 3 4 1 2 invalid */
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   k=CFG.bankPrefix+"-"+q.id; /* v2.9: positions differ per attempt */
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();
 adFillRest(); /* v2.9: early submit — unreached slots are served as unanswered */

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };
 adPayload(payload); /* v2.9: same 16 fields; IDs instead of positions */

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors,totalSecs);
}

/* ==================== RESULTS ==================== */

 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";

 document.getElementById("stScore").textContent=score;

 var secParts=[];

 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");
 /* v2.7: analysis + retry. Wrapped so a fault here can never blank the results screen. */

 var letters=["A","B","C","D"];

 QUESTIONS.forEach(function(q,i){

  head.innerHTML="Q"+(i+1)+" \u00b7 "+escH(q.section)+" \u00b7 "+escH(q.format)+(diffOf(q)?" \u00b7 "+escH(q.difficulty):"")+" \u00b7 time "+fmtMS(questionTimes[i])+status;
  wrap.appendChild(head);

   });

   var ttg=trapOf(q,a);if(ttg){var ttn=document.createElement("div");ttn.className="trapNote";ttn.textContent="trap: "+trapInfo(ttg).name;yr.appendChild(ttn)}

 });

/* ==================== POST-TEST ANALYSIS (v2.8) ====================
   Computed on this device from answers, questionTimes and the visit log.
   Nothing here is sent anywhere: the 16-field payload is unchanged.
   TRAPS: for each optionTags / titaTraps tag, the student-facing name,
   what the trap is, and the counter-move. Edit freely; an unknown tag
   falls back to a readable version of the tag itself. */
var TRAPS={
 /* --- added for Rapid Fire 19-21 --- */
 "idiom-literal":["Taken literally","The idiom's picture read at face value instead of its meaning.","An idiom means more than its words. Ask what people use the phrase to say, not what it describes."],
 "idiom-near-sense":["Near sense","The same picture, but the point is shifted - close enough to feel right.","Say the idiom's meaning in your own words first, then find the option that matches it exactly, not approximately."],
 "root-whole-word":["Whole word for the root","The meaning of one word containing the root, mistaken for the root's own sense.","Strip the prefix and suffix. What is left must carry the same sense through all three example words."],
 "root-confused":["Root confused","The root mixed up with a different one that looks similar.","Test your sense of the root against every word given. If it fits only one, it is the wrong sense."],
 "ows-near-field":["Near-field word","A word from the same area of meaning that fails one part of the definition.","Break the definition into its conditions and check the word against each one. A near word drops one of them."],
 "gram-proximity":["Agreement by proximity","The verb agrees with the nearest noun instead of the real subject.","Cover the phrase between the subject and the verb, then read them together."],
 "gram-double-marker":["Doubled marker","A tense or mood marker used twice over, as in 'had have known'.","In an inverted conditional, 'had' already carries the perfect. What follows is the bare participle."],
 "gram-carryover":["Rule carried across","A rule settled correctly for the first blank and then carried into the second, where it does not apply.","Treat each blank as its own question. Find its own subject before you fill it."],
 "gram-modifier-scope":["Modifier in the wrong place","The sentence is grammatical, but the limiting word restricts the wrong element.","'Only', 'just' and 'nearly' limit whatever follows them. Put the word immediately before what it is meant to limit, then read it back."],
 "gram-modifier-subject":["Dangler not fixed","The opening phrase still describes the wrong subject, or the phrase was only moved or reworded.","An opening participle describes the subject that follows it. Change the subject, not the phrase."],
 "rc-detail-as-main":["Detail as main idea","A true detail offered as the main point.","Ask whether the writer would use it as the title. A detail can be true and still be too small to be the point."],
 "rc-extreme":["Overstated","It says more, or says it more strongly, than the passage does.","Circle strong words (always, only, entirely, never) and pick the option exactly as strong as the text."],
 "rc-false-link":["False link","It joins two things from the passage with a reason the writer never gives.","Find the line that links the two ideas. If the passage never connects them, neither should you."],
 "rc-half-right":["Half right","One half matches the passage; the other half doesn't.","Read every option to its last word. One wrong half sinks the whole option."],
 "rc-literal":["Too literal","A figurative line read at face value.","For an image or metaphor, ask what it does in the argument, not what it describes."],
 "rc-out-of-scope":["Out of scope","It brings in something the passage never discusses.","If you cannot point to the line that supports it, rule it out."],
 "rc-reversal":["Reversal","It flips the passage: the order, the direction or the cause.","Trace before/after and cause/effect back in the text before you commit."],
 "rc-scope-shift":["Scope shift","Right topic, but wider or narrower than the text's claim.","Match the scope words: most vs all, some vs every, one city vs every city."],
 "va-scope-shift":["Scope shift","Right topic, but wider or narrower than the paragraph's claim.","Match the scope words: most vs all, some vs every, one case vs every case."],
 "rc-tone":["Tone miss","Right direction, wrong strength or flavour of attitude.","Fix the direction first (for or against), then the strength (mild or harsh)."],
 "rc-true-not-answer":["True, but not the answer","Supported by the passage, but it doesn't answer this question.","Reread the question before confirming. True is not enough; it has to answer what was asked."],
 "rc-word-match":["Word match","It borrows the passage's words, not its meaning.","Familiar words are bait. Put the line in your own words, then match the meaning."],
 "rc-wrong-voice":["Wrong voice","A view the passage reports or argues against, not the writer's own.","Ask whose view it is: the writer's, or someone the writer quotes or rejects?"],

var QUESTIONS=[{"id":"UGAT_VA_001","section":"VA","format":"Odd Statement Out","kind":"mcq","passage":"Statement 1: Tree rings laid down one to a year let a dendrochronologist count back from a beam of known felling date to the season the timber began growing.\nStatement 2: Lake varves, the paired light and dark bands that settle out as meltwater slows each summer and winter, can be tallied downward through a core to give an age in years.\nStatement 3: Ice cores from high plateaux preserve a visible couplet for every year of snowfall, and the couplets can be counted much as rings are.\nStatement 4: The decay of an unstable isotope proceeds at a rate indifferent to the seasons, so a measured ratio yields an age without any annual layer being counted at all.\nStatement 5: Massive corals accrete one dense band and one porous band in each yearly cycle of growth, a rhythm that X-radiography makes legible along a sawn slab.","stem":"Which statement does not follow the common thread?","options":["Statement 2","Statement 5","Statement 1","Statement 4"],"answer":"Statement 4","answerIndex":3,"tags":["odd-statement-out","dating-methods"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nThe thread is dating by counting layers that a material lays down once a year. Four of the statements describe a different material in which such layers can be counted.\nCorrect (d): Statement 4 dates by measuring the proportion of an isotope that has decayed, and says in so many words that it works 'without any annual layer being counted at all'. It belongs to the broad field of dating but not to the thread.\nLead distractor (b): Statement 5 is the one most often picked, because its vocabulary is unlike the other four — accretion, porosity, X-radiography — but a dense and a porous band 'in each yearly cycle' is an annual couplet, so it is on the thread.\n(a): Statement 2 counts paired seasonal bands through a core and is on the thread.\n(c): Statement 1 counts yearly rings and is on the thread.","optionTags":["va-on-thread","va-register-decoy","va-on-thread",null],"status":"approved","flags":[],"verified":"ok","verNote":"Thread checked statement by statement: 1, 2, 3 and 5 each name a layer or band formed once a year and counted; 4 names isotope decay and explicitly counts no layers. Statement 4 borrows the thread's keyword 'annual layer' and statement 5 carries the unlike surface vocabulary, so neither the keyword nor the register identifies the answer. No on-thread statement can be argued off-thread.","instr":"Five statements are given below, four of which follow a common thread. Identify the statement that does not follow the common thread."},{"id":"UGAT_VA_002","section":"VA","format":"Idioms","kind":"mcq","passage":null,"stem":"To raise a matter that is likely to create more difficulty than it resolves.","options":["Open a can of worms","Rock the boat","Let sleeping dogs lie","Stir the pot"],"answer":"Open a can of worms","answerIndex":0,"tags":["idiom","definition-form"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nThe description has two parts: a matter is raised, and raising it makes things worse rather than better.\nCorrect (a): to open a can of worms is to bring up a subject that turns out to contain many further problems, which is exactly the combination described.\nLead distractor (b): to rock the boat is to disturb an arrangement that is working, and it is the closest wrong answer because disturbance is part of the description. It fails on the other part: rocking the boat is about unsettling a situation, not about opening a question that proliferates.\n(c): to let sleeping dogs lie is to leave such a matter alone, which is the opposite of raising it.\n(d): to stir the pot is to provoke trouble on purpose. The description says the difficulty is a consequence of raising the matter, not the reason for raising it.","optionTags":[null,"va-neighbouring-sense","va-opposite-sense","va-intention-shift"],"status":"approved","flags":[],"verified":"ok","verNote":"Form (b) of the idiom item, alternating from Mock 9's substitution form. All four options are real idioms in current use; no corrupted forms, per UGAT spec 2.4. None is among the idioms the VA spec quotes from real papers, and none repeats Mock 9's idiom. Distractor families: neighbouring meaning (b), same domain opposite meaning (c), same domain different intention (d).","instr":"Choose the appropriate idiom that is closest to the description given below."},{"id":"UGAT_VA_003","section":"VA","format":"Word in Context","kind":"mcq","passage":null,"stem":"Statement: The editor [[tempered]] the report's conclusions with a reminder of how small the sample had been.","options":["The crowd's restless mood was tempered into something very like a frenzy by the closing speech.","Her enthusiasm for the plan was tempered by the figures the auditor produced.","The smith tempered the blade in oil before fitting the handle.","He tempered the delay to a fault in the signalling equipment."],"answer":"Her enthusiasm for the plan was tempered by the figures the auditor produced.","answerIndex":1,"tags":["word-in-context","similar-use"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nIn the statement, something confident is moderated by a counterweight that is set beside it: strong conclusions are softened by a fact about the sample.\nCorrect (b): enthusiasm moderated by the auditor's figures is the same structure and the same sense — a claim or a feeling reduced in force by evidence placed against it.\nLead distractor (c): this is a real and correct use of the word, in its metallurgical sense of toughening a blade by heat, which is what makes it tempting. It is not the sense the statement uses, where nothing is being hardened.\n(a): the polarity is wrong. To temper something is to reduce its intensity, so a mood cannot be tempered into a frenzy.\n(d): the collocation breaks. One attributes a delay to a fault; 'tempered the delay to' is not a construction the word takes.","optionTags":["va-polarity-flip",null,"va-other-real-sense","va-collocation-break"],"status":"approved","flags":[],"verified":"ok","verNote":"Form (b) of the word-in-context item, alternating from Mock 9's synonym form. Three misuses, each failing on one ground per UGAT spec 2.4: wrong polarity (a), a real but different sense (c), a broken collocation (d). All four sentences are of the same register and none uses the word absurdly.","instr":"Choose the option that best uses the underlined word in a context similar to how it is used in the statement."},{"id":"UGAT_VA_004","section":"VA","format":"Parts of Speech","kind":"mcq","passage":null,"stem":"Identify the pair of adjectives in the following statement: 'The curator's brisk, faintly weary account of the restoration left the trustees oddly reassured.'","options":["faintly and oddly","curator's and restoration","weary and oddly","brisk and weary"],"answer":"brisk and weary","answerIndex":3,"tags":["parts-of-speech","adjective-pair"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nBoth words in the pair have to be adjectives, and the sentence is built to offer several near misses.\nCorrect (d): 'brisk' and 'weary' both modify the noun 'account' and are therefore adjectives.\nLead distractor (c): this is the closest wrong answer, because 'weary' is indeed an adjective. 'Oddly' is not: it modifies 'reassured' and is an adverb, so the pair is mixed.\n(a): 'faintly' modifies the adjective 'weary' and 'oddly' modifies 'reassured'. Both are adverbs.\n(b): 'curator's' is a possessive noun and 'restoration' is a noun, so this is a noun pair.","optionTags":["va-adverb-pair","va-noun-pair","va-mixed-pair",null],"status":"approved","flags":[],"verified":"ok","verNote":"Pick-the-pair form, alternating from Mock 9's one-word-in-four-functions form. Distractor pairs are an adverb pair, a noun pair and a mixed pair, all drawn from the same ornate sentence, per UGAT spec 2.4. Each word parsed against the word it modifies.","instr":"Answer the question given below."},{"id":"UGAT_VA_005","section":"VA","format":"Correlative Pair","kind":"mcq","passage":null,"stem":"______ had the tender been awarded ______ the first objections were filed with the commission.","options":["Hardly … than","Scarcely … that","No sooner … than","No sooner … when"],"answer":"No sooner … than","answerIndex":2,"tags":["correlative-pair","inversion"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (c)\nThe sentence sets one event immediately before another and inverts the auxiliary, so it needs a correlative pair that takes inversion and whose second element matches the first.\nCorrect (c): 'No sooner' is a comparative and is completed by 'than'. The inversion 'No sooner had the tender been awarded than…' is the standard form.\nLead distractor (a): 'Hardly' does take inversion and is the closest wrong answer, which is why it is chosen so often. It is completed by 'when', not by 'than'; 'than' belongs only to the comparative 'sooner'.\n(b): 'Scarcely' is likewise completed by 'when'. 'That' is not a partner it takes.\n(d): the opener is right but the partner is wrong. 'No sooner' is comparative and cannot be completed by 'when'.","optionTags":["va-wrong-partner","va-wrong-partner",null,"va-comparative-mismatch"],"status":"approved","flags":[],"verified":"ok","verNote":"Correlative-pair form, alternating from Mock 9's tense-sequence item. Per UGAT spec 2.4 each distractor pairs a valid opener with the wrong partner: Hardly with than, Scarcely with that, No sooner with when. Only the key is a standard pair, and all four openers take the inversion the stem supplies, so the inversion itself decides nothing.","instr":"Complete the sentence using the most appropriate pair of words."},{"id":"UGAT_VA_006","section":"VA","format":"Parajumble","kind":"mcq","passage":"A. Palaeogenetics began with the assumption that ancient DNA could be recovered only from bone, and for many years the field's limits were set by how few bones the right caves happened to contain.\nB. Laboratories in the 2010s showed that the sediment on a cave floor holds the shed DNA of everything that lived there, and by the end of the decade a site with no skeletal remains at all could still yield a roster of its former occupants.\nC. Nowadays a single column of dirt, sampled centimetre by centimetre, can be read as a record of which species came and went, and in what order.\nD. In this respect the field has reversed its own founding constraint: the material it once discarded as overburden has become the material it most wants, and such columns are now logged before any bone is lifted.","stem":"Arrange the sentences in the most logical sequence.","options":["ABDC","ABCD","BACD","ACBD"],"answer":"ABCD","answerIndex":1,"tags":["parajumble","palaeogenetics"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nThe paragraph moves from the field's founding assumption, through the work that overturned it, to present practice, and closes by naming the reversal.\nCorrect (b): A opens, since it states the assumption the rest of the paragraph dismantles and needs no antecedent. B follows with the dated account of the work that overturned it. C's 'Nowadays' marks the turn to the present. D closes: 'In this respect' needs the whole arc behind it, and 'such columns' can only point back to the column of dirt introduced in C.\nLead distractor (a): ABDC keeps the opening pair and is the hardest to reject. It fails at one join only: D's 'such columns' has no antecedent if C has not yet appeared.\n(c): BACD opens on B. B can stand as an opener grammatically, but A's account of what the field assumed at its beginning cannot follow a sentence that has already reached the end of the 2010s.\n(d): ACBD puts the present before the work that produced it, leaving C's 'a single column of dirt' to arrive before sediment has been mentioned at all.","optionTags":["va-antecedent-broken",null,"va-chronology-broken","va-referent-stranded"],"status":"approved","flags":[],"verified":"ok","verNote":"Order forced by four devices per UGAT spec 2.4: a general opener (A), dated history (B, the 2010s), a 'Nowadays' turn (C) and an 'In this respect' closer whose 'such columns' needs C (D). Three options share the key's first sentence and three share its last. Each wrong sequence breaks exactly one link: (a) C-D, (c) A-B, (d) B-C. A and B are both grammatically plausible openers.","instr":"The following sentences are in jumbled order. Arrange them in the most logical sequence to form a meaningful paragraph."},{"id":"UGAT_VA_007","section":"VA","format":"RC","kind":"mcq","passage":"The trade journals of my apprenticeship were sure that repair was a doomed occupation, kept alive by sentiment and by customers too old to change, and that within a generation a watch would be a thing one replaced rather than opened. They were right about the economics. A movement that takes four hours to clean cannot compete with one that costs less than the labour.\n\nWhat they missed is that the economics were never the whole of it. A repairer's bench teaches a particular kind of attention: not the attention of the maker, who may choose his tolerances, but the attention of someone obliged to work inside another person's decisions, including the bad ones. You learn to read a mechanism as a record of arguments already settled — why this bridge was cut away here, why that jewel sits a fraction off centre — and to make your correction without insisting on your own taste.\n\nThis is a civic skill as much as a manual one. The habit of deferring to a structure you did not design, and improving it only where it has actually failed, is the habit a conservator needs, and a legislator, and anyone who inherits an institution.\n\nIt does not follow that every apprentice should be set to watches; most will never see a balance staff and will be none the poorer for it. But the trade journals were measuring the wrong thing when they counted turnover and called the result a future.","stem":"Identify the main theme of the passage.","options":["A repairer's bench trains a deference to structures one did not design that reaches well beyond the trade.","The trade journals judged the craft by its turnover and so measured the one thing that mattered least about it.","Attention of the kind the bench teaches cannot be acquired anywhere but at a workbench.","Repair work survives on sentiment rather than on economics, which the trade journals diagnosed a good many decades ago."],"answer":"A repairer's bench trains a deference to structures one did not design that reaches well beyond the trade.","answerIndex":0,"tags":["rc","main-theme","reflective-essay"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nThe writer reports the journals' verdict, grants their economics, and then argues that the bench teaches an attention which transfers to the conservator, the legislator and anyone who inherits an institution.\nCorrect (a): this states that argument and keeps its reach, which is what the third paragraph is for.\nLead distractor (b): the substance is close to the writer's own position, and the final sentence does say the journals counted turnover and called the result a future. It is a register too far: the passage concedes that they were right about the economics, so turnover was not the thing that mattered least, only the thing that was not decisive.\n(c): this states a general principle, as the key does, but the writer denies it twice — the habit is one a conservator and a legislator need, and most apprentices will never see a balance staff.\n(d): this gives the journals' diagnosis as the passage's conclusion, when the passage accepts it only as far as the economics and then sets it aside.","optionTags":[null,"rc-tone","rc-out-of-scope","rc-wrong-voice"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 1: key A, length rank 3, strength plain, lead family rc-tone. Key letter and rank honoured. The lead is a neighbouring, same-side register word per RC spec 7.4, close in substance and wrong in pitch. Option (d) is the rival thesis. No banned phrasing; one option carries an absolute and the key is plain.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_008","section":"VA","format":"RC","kind":"mcq","passage":"The trade journals of my apprenticeship were sure that repair was a doomed occupation, kept alive by sentiment and by customers too old to change, and that within a generation a watch would be a thing one replaced rather than opened. They were right about the economics. A movement that takes four hours to clean cannot compete with one that costs less than the labour.\n\nWhat they missed is that the economics were never the whole of it. A repairer's bench teaches a particular kind of attention: not the attention of the maker, who may choose his tolerances, but the attention of someone obliged to work inside another person's decisions, including the bad ones. You learn to read a mechanism as a record of arguments already settled — why this bridge was cut away here, why that jewel sits a fraction off centre — and to make your correction without insisting on your own taste.\n\nThis is a civic skill as much as a manual one. The habit of deferring to a structure you did not design, and improving it only where it has actually failed, is the habit a conservator needs, and a legislator, and anyone who inherits an institution.\n\nIt does not follow that every apprentice should be set to watches; most will never see a balance staff and will be none the poorer for it. But the trade journals were measuring the wrong thing when they counted turnover and called the result a future.","stem":"As used in the second paragraph, 'tolerances' most nearly means","options":["the stresses the metal will bear","his willingness to compromise","the margins of error allowed","his patience with long delay"],"answer":"the margins of error allowed","answerIndex":2,"tags":["rc","vocabulary-in-context","reflective-essay"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nThe word appears in a contrast between the maker, 'who may choose his tolerances', and the repairer, who must work inside decisions somebody else has already made.\nCorrect (c): in manufacture a tolerance is the margin of deviation a part is permitted, and choosing one's own margins is precisely the freedom the maker has and the repairer does not.\nLead distractor (a): this is the closest wrong answer, because it is technical in exactly the way the key is and belongs to the same workshop vocabulary. A tolerance is a margin the maker sets; what the metal will bear is a property of the metal, which no maker chooses.\n(b): a willingness to compromise is a real everyday shade of the word, but the contrast is about latitude in the work rather than about temperament.\n(d): patience with delay is the forbearing sense, which has nothing to do with what a maker sets when designing.","optionTags":["vocab-shade","vocab-shade",null,"vocab-context-blind"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 2: key C, strength firm, lead family vocab-shade. Key letter honoured. Vocabulary items use short-phrase options as the real UGAT paper does, so the 10-25 word option rule, the sentence form and the blueprint's length rank are not applied here; the deviation is recorded in meta.auditNote. All four options are noun phrases of the same register and the paragraph does not define the word. Two options are technical and two concern temperament, so the key is not the only option of its kind - a cue the blind gate found in the first draft.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_009","section":"VA","format":"RC","kind":"mcq","passage":"The trade journals of my apprenticeship were sure that repair was a doomed occupation, kept alive by sentiment and by customers too old to change, and that within a generation a watch would be a thing one replaced rather than opened. They were right about the economics. A movement that takes four hours to clean cannot compete with one that costs less than the labour.\n\nWhat they missed is that the economics were never the whole of it. A repairer's bench teaches a particular kind of attention: not the attention of the maker, who may choose his tolerances, but the attention of someone obliged to work inside another person's decisions, including the bad ones. You learn to read a mechanism as a record of arguments already settled — why this bridge was cut away here, why that jewel sits a fraction off centre — and to make your correction without insisting on your own taste.\n\nThis is a civic skill as much as a manual one. The habit of deferring to a structure you did not design, and improving it only where it has actually failed, is the habit a conservator needs, and a legislator, and anyone who inherits an institution.\n\nIt does not follow that every apprentice should be set to watches; most will never see a balance staff and will be none the poorer for it. But the trade journals were measuring the wrong thing when they counted turnover and called the result a future.","stem":"Which of the following would the author most likely contend?","options":["An inheritor does better to leave a working arrangement alone than to improve on it.","A mechanism's faults are best understood by the person who originally designed and built the thing.","Someone who inherits an institution should correct only what has actually failed, and should not remake it to suit his own preferences.","A repairer spends most of his time working out what quarrels the machine's earlier owners once had."],"answer":"Someone who inherits an institution should correct only what has actually failed, and should not remake it to suit his own preferences.","answerIndex":2,"tags":["rc","would-contend","reflective-essay"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nThe third paragraph names the habit the bench teaches: deferring to a structure you did not design, and improving it only where it has actually failed. The second paragraph adds the other half — making your correction without insisting on your own taste.\nCorrect (c): this joins the two halves and applies them to the inheritor of an institution, which is the transfer the passage itself makes.\nLead distractor (d): the passage does speak of reading a mechanism as a record of arguments already settled, and this option is a fair reading of those words taken alone. It takes the figure literally, as though the arguments were quarrels between owners rather than decisions embodied in the work.\n(a): leaving a working arrangement alone is not the claim, and it is qualified as carefully as the key is. The passage requires correction where something has actually failed, and there only.\n(b): the passage says the opposite of this, contrasting the maker's freedom with the repairer's obligation to understand decisions he did not make.","optionTags":["rc-scope-shift","rc-word-match",null,"rc-literal"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 3: key C, length rank 1, strength firm, lead family rc-literal. Key letter and rank honoured. The lead reads the figurative line literally and is a credible reading of the words alone. Key is firm, so the absolute-word balance rule does not bind; two options carry one absolute each.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_010","section":"VA","format":"RC","instr":"Read the following passage and answer the question.","kind":"mcq","stem":"According to the passage, on what point were the trade journals right?","options":["The number of hours a movement takes to clean.","The loyalty of the older customers who kept the trade alive.","The survival of repair as an occupation.","The economics of the trade."],"answerIndex":3,"tags":["rc","specific-detail","reflective-essay"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (d)\nThe first paragraph gives the journals' verdict that repair was a doomed occupation, and the writer answers it in four words: 'They were right about the economics.'\nCorrect (d): the economics is the single point the writer concedes, and the sentence that follows explains it - a movement that takes four hours to clean cannot compete with one that costs less than the labour.\nLead distractor (c): the journals did predict the occupation's end, and the passage grants part of their case, which makes this tempting. But the whole of the rest of the passage is written against that prediction, so it is the point on which they were wrong.\n(a): the four hours are the writer's illustration of the economics, not a claim the journals were right about.\n(b): the journals mention customers too old to change as part of their verdict; the writer never says they were right about it.","status":"approved","flags":[],"verified":"ok","verNote":"Gate 2 audit 2026-11-07","optionTags":["rc-true-not-answer","rc-word-match","rc-reversal",null],"passage":"The trade journals of my apprenticeship were sure that repair was a doomed occupation, kept alive by sentiment and by customers too old to change, and that within a generation a watch would be a thing one replaced rather than opened. They were right about the economics. A movement that takes four hours to clean cannot compete with one that costs less than the labour.\n\nWhat they missed is that the economics were never the whole of it. A repairer's bench teaches a particular kind of attention: not the attention of the maker, who may choose his tolerances, but the attention of someone obliged to work inside another person's decisions, including the bad ones. You learn to read a mechanism as a record of arguments already settled — why this bridge was cut away here, why that jewel sits a fraction off centre — and to make your correction without insisting on your own taste.\n\nThis is a civic skill as much as a manual one. The habit of deferring to a structure you did not design, and improving it only where it has actually failed, is the habit a conservator needs, and a legislator, and anyone who inherits an institution.\n\nIt does not follow that every apprentice should be set to watches; most will never see a balance staff and will be none the poorer for it. But the trade journals were measuring the wrong thing when they counted turnover and called the result a future.","answer":"The economics of the trade."},{"id":"UGAT_VA_011","section":"VA","format":"RC","kind":"mcq","passage":"Every platform that matches work to customers has had to invent a way of telling strangers apart, and the five-star average is the one that won. Its defenders make a reasonable case: a courier with no employer and no references arrives in a new city with a number that travels with her, and the number is hers rather than the company's. That is a real gain, and it is worth saying so before the objections.\n\nThe objections begin with arithmetic. A rating that opens at five and is bounded above has nowhere to go but down, so the score does not accumulate credit; it records erosion. A courier who is late once in two hundred deliveries sits a fraction below one who has been late not at all, and a platform that deactivates below 4.6 has turned that fraction into an employment decision.\n\nThe effect compounds. Because the threshold is near the ceiling, the worker's rational response is not to be better but to be safer: to decline the long trip, the difficult address, the order that may go wrong through nobody's fault. The platform then reads the declined orders as low reliability, which is itself a rated category.\n\nIt would be too much to claim that ratings alone produce this caution, since pay per trip has fallen over the same period and caution is what falling pay also buys. But the two work in the same direction, and only one of them is presented to the worker as a measure of her own quality.\n\nThe remedy most often proposed — publishing the algorithm — would change little, because the difficulty is not that the rule is hidden but that it is sharp. A score that fell more slowly, or a threshold set further from the ceiling, would do more for a courier than any amount of disclosure.","stem":"According to the passage, what follows from setting the deactivation threshold close to the top of the scale?","options":["Workers avoid difficult jobs, and the refusals are then counted against their reliability.","Workers who decline difficult jobs are given a lower rating, which is why the threshold sits so high.","A courier who is late once in two hundred deliveries loses her place on the platform altogether.","The platform's defenders point out that the number belongs to the courier and not the company."],"answer":"Workers avoid difficult jobs, and the refusals are then counted against their reliability.","answerIndex":0,"tags":["rc","detail-causal","op-ed"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nThe third paragraph runs a chain: because the threshold is near the ceiling, the rational response is to be safer rather than better, so the worker declines the difficult order, and the platform then reads the declined orders as low reliability.\nCorrect (a): this is that chain in the order the passage gives it, with the second step following from the first.\nLead distractor (b): every element here is in the passage, but the causal order is turned around. The high threshold produces the refusals; the refusals do not explain why the threshold was set high.\n(c): the passage says that one lateness in two hundred deliveries puts a courier a fraction below a colleague who has been late not at all. A fraction below is not below the threshold, and nothing says she loses her place.\n(d): this is true, and the passage says it in so many words, but it belongs to the defenders' case in the first paragraph and is not a consequence of where the threshold sits.","optionTags":[null,"rc-reversal","rc-extreme","rc-true-not-answer"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 1: key A, length rank 4, strength firm, lead family rc-reversal. Key letter and rank honoured. The lead uses the passage's own facts with cause and effect transposed. No option is eliminable by general knowledge; all four stay on the passage's topic.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_012","section":"VA","format":"RC","kind":"mcq","passage":"Every platform that matches work to customers has had to invent a way of telling strangers apart, and the five-star average is the one that won. Its defenders make a reasonable case: a courier with no employer and no references arrives in a new city with a number that travels with her, and the number is hers rather than the company's. That is a real gain, and it is worth saying so before the objections.\n\nThe objections begin with arithmetic. A rating that opens at five and is bounded above has nowhere to go but down, so the score does not accumulate credit; it records erosion. A courier who is late once in two hundred deliveries sits a fraction below one who has been late not at all, and a platform that deactivates below 4.6 has turned that fraction into an employment decision.\n\nThe effect compounds. Because the threshold is near the ceiling, the worker's rational response is not to be better but to be safer: to decline the long trip, the difficult address, the order that may go wrong through nobody's fault. The platform then reads the declined orders as low reliability, which is itself a rated category.\n\nIt would be too much to claim that ratings alone produce this caution, since pay per trip has fallen over the same period and caution is what falling pay also buys. But the two work in the same direction, and only one of them is presented to the worker as a measure of her own quality.\n\nThe remedy most often proposed — publishing the algorithm — would change little, because the difficulty is not that the rule is hidden but that it is sharp. A score that fell more slowly, or a threshold set further from the ceiling, would do more for a courier than any amount of disclosure.","stem":"Select the option that most accurately summarises the passage.","options":["Falling pay per trip, not the rating system, explains why couriers have grown cautious about difficult work.","A rating that only falls, with a cut-off near its ceiling, makes caution rational, and disclosure would not fix it.","Portable reputation lets a courier arrive in a new city with a number of her own.","A scale that opens at the top and is kept hidden from couriers would be fairer if the platforms published it."],"answer":"A rating that only falls, with a cut-off near its ceiling, makes caution rational, and disclosure would not fix it.","answerIndex":1,"tags":["rc","summary","op-ed"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nThe passage grants the portability argument, then builds its case on the shape of the scale — it only falls, and the cut-off sits near the top — and ends by rejecting disclosure in favour of changing the scale itself.\nCorrect (b): it carries the arithmetic, the behavioural consequence and the closing verdict on the proposed remedy, which is where the passage lands.\nLead distractor (c): this is true and is in the passage, stated as the defenders' reasonable case and expressly called a real gain. It is one concession inside the argument rather than the argument, so it cannot be the summary.\n(a): the passage raises falling pay only to concede that it works in the same direction, and then says that of the two only the rating is presented to the worker as a measure of her quality. It does not make pay the explanation.\n(d): the first half is the passage's own arithmetic, that the scale opens at the top. The second half is the complaint the passage sets aside: its point is that the difficulty is not that the rule is hidden but that it is sharp.","optionTags":["rc-scope-shift",null,"rc-true-not-answer","rc-half-right"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 2: key B, length rank 2, strength plain, lead family rc-true-not-answer. Key letter and rank honoured. The lead checks out against the text and fails only on the question asked, per RC spec 7.2. Option (d) is drawn from the rival story in meta.auditNote. One option carries an absolute and the key carries one; the balance is even.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_013","section":"VA","format":"RC","kind":"mcq","passage":"Every platform that matches work to customers has had to invent a way of telling strangers apart, and the five-star average is the one that won. Its defenders make a reasonable case: a courier with no employer and no references arrives in a new city with a number that travels with her, and the number is hers rather than the company's. That is a real gain, and it is worth saying so before the objections.\n\nThe objections begin with arithmetic. A rating that opens at five and is bounded above has nowhere to go but down, so the score does not accumulate credit; it records erosion. A courier who is late once in two hundred deliveries sits a fraction below one who has been late not at all, and a platform that deactivates below 4.6 has turned that fraction into an employment decision.\n\nThe effect compounds. Because the threshold is near the ceiling, the worker's rational response is not to be better but to be safer: to decline the long trip, the difficult address, the order that may go wrong through nobody's fault. The platform then reads the declined orders as low reliability, which is itself a rated category.\n\nIt would be too much to claim that ratings alone produce this caution, since pay per trip has fallen over the same period and caution is what falling pay also buys. But the two work in the same direction, and only one of them is presented to the worker as a measure of her own quality.\n\nThe remedy most often proposed — publishing the algorithm — would change little, because the difficulty is not that the rule is hidden but that it is sharp. A score that fell more slowly, or a threshold set further from the ceiling, would do more for a courier than any amount of disclosure.","stem":"As used in the third paragraph, 'compounds' most nearly means","options":["mixes several things together","makes an existing problem worse","builds upon itself and grows","encloses within a wall"],"answer":"builds upon itself and grows","answerIndex":2,"tags":["rc","vocabulary-in-context","op-ed"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (c)\nThe word stands alone as a two-word sentence, and what follows explains it: the threshold makes the worker cautious, the caution produces declined orders, and the declined orders are themselves rated as low reliability.\nCorrect (c): the effect feeds back into its own cause and accumulates, which is the sense of interest compounding.\nLead distractor (b): worsening an existing problem is a real and common shade of the verb — one compounds a difficulty — and the paragraph does describe things getting worse, which makes it the closest wrong answer. It fails because the paragraph does not describe one problem aggravated by something else; it describes a single effect returning on itself.\n(a): mixing several things together is the pharmacist's sense, and nothing here is being mixed.\n(d): the enclosure sense gives the noun its meaning in 'a walled compound' and has no application to an effect.","optionTags":["vocab-context-blind","vocab-shade",null,"vocab-shade"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 3: key C, strength firm, lead family vocab-shade. Key letter honoured. Short-phrase options as in item 008, with the same recorded deviation and the blueprint's length rank not applied. Target word changed from 'sharp' after the blind gate found that item 012's options glossed it; nothing in any other item of this set glosses 'compounds'. All four options are real senses of the verb and no three of them share a family against the key.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_014","section":"VA","format":"RC","kind":"mcq","passage":"Every platform that matches work to customers has had to invent a way of telling strangers apart, and the five-star average is the one that won. Its defenders make a reasonable case: a courier with no employer and no references arrives in a new city with a number that travels with her, and the number is hers rather than the company's. That is a real gain, and it is worth saying so before the objections.\n\nThe objections begin with arithmetic. A rating that opens at five and is bounded above has nowhere to go but down, so the score does not accumulate credit; it records erosion. A courier who is late once in two hundred deliveries sits a fraction below one who has been late not at all, and a platform that deactivates below 4.6 has turned that fraction into an employment decision.\n\nThe effect compounds. Because the threshold is near the ceiling, the worker's rational response is not to be better but to be safer: to decline the long trip, the difficult address, the order that may go wrong through nobody's fault. The platform then reads the declined orders as low reliability, which is itself a rated category.\n\nIt would be too much to claim that ratings alone produce this caution, since pay per trip has fallen over the same period and caution is what falling pay also buys. But the two work in the same direction, and only one of them is presented to the worker as a measure of her own quality.\n\nThe remedy most often proposed — publishing the algorithm — would change little, because the difficulty is not that the rule is hidden but that it is sharp. A score that fell more slowly, or a threshold set further from the ceiling, would do more for a courier than any amount of disclosure.","stem":"Select the real-life situation that best reflects the concern the passage raises about the shape of the rating scale.","options":["A delivery firm that publishes the full text of its performance policy on its public website.","An examination where most candidates begin at full marks and a single lost mark can bar them.","A reviewer quietly resented by most of the restaurants whose ratings she has on occasion felt obliged to lower.","A scheme in which candidates start at zero, gain marks for good work, and are barred below ten."],"answer":"An examination where most candidates begin at full marks and a single lost mark can bar them.","answerIndex":1,"tags":["rc","application","op-ed"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nThe concern is structural: the scale opens at the top, can only fall, and has a consequential cut-off placed near the ceiling, so a very small loss carries a very large penalty.\nCorrect (b): starting at full marks, with one lost mark enough to bar a candidate, reproduces all three features — the ceiling start, the downward-only movement and the threshold close to the top.\nLead distractor (c): resentment among those rated is a real feature of the world the passage describes, and this sits close to its tone. It reflects how people feel about being rated rather than the arithmetic of the scale, which is what the passage is actually complaining about.\n(a): publication is the remedy the passage dismisses, so a firm that publishes its policy illustrates the wrong half of the argument.\n(d): this names both of the features the key does — a starting point and a disqualifying threshold — but reverses each of them. Candidates begin at the bottom rather than the top, and the threshold sits far from the ceiling, which is the remedy the passage proposes rather than the concern it raises.","optionTags":["rc-out-of-scope",null,"rc-tone","rc-reversal"],"status":"approved","flags":[],"verified":"ok","verNote":"Blueprint row 4: key B, length rank 3, strength hedged, lead family rc-tone. Key letter and rank honoured. Key is hedged by 'most' and 'can', and option (c) carries equal hedging in 'most' and 'on occasion', so hedging does not identify the key. The application item is required across the two sets by UGAT spec 2.3.","instr":"Read the following passage and answer the question."},{"id":"UGAT_VA_015","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"The founder had built the press around a warehouse, insisting that a book not physically in stock was a book effectively out of print, and for thirty years nobody on the staff had thought to ______ him. When his successor began printing each title only on receipt of an order, the catalogue's long tail — which had earned almost nothing while it sat on pallets — began at last to ______, and the old rule, which no one had ever put to the test, quietly ______.","options":["gainsay / pay / lapsed","humour / pay / lapsed","gainsay / multiply / lapsed","gainsay / pay / ossified"],"answer":"gainsay / pay / lapsed","answerIndex":0,"tags":["multi-blank-fill","three-blanks","addendum-a"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nBlank 1 is settled by the closing clause. The old rule was one 'which no one had ever put to the test', so what nobody had thought to do for thirty years was contradict the man who laid it down.\nBlank 2 is settled by what the tail had been doing before the change: it 'had earned almost nothing while it sat on pallets', so what it began to do at last was earn.\nBlank 3 is settled by the successor's change and the clauses that follow it. The rule was not defended or revised; it simply fell out of use.\nLead distractor (b): humour fits the surface of a staff's dealings with a revered founder and is ruled out only by the clause at the very end, which says the rule went untested rather than unindulged.\n(c): multiply fails because the long tail already existed and its length never changed. What changed was that it began to earn, which is what 'earned almost nothing' sets up.\n(d): ossified fails on outcome. Something ossified hardens and persists, and the rule here was quietly abandoned once the successor stopped stocking books.","optionTags":[null,"va-look-ahead-missed","va-sense-shift","va-outcome-reversed"],"status":"approved","flags":[],"verified":"ok","verNote":"Three blanks, alternating from Mock 9's four. Addendum A6 checks run by code: no A2 signpost in the stem; no content word of the key echoed in the stem and no stem word sharing five opening letters with a key word; every clue quoted in the explanation occurs verbatim in the stem. The deciding blank differs across the three distractors - blank 1 for (b), blank 2 for (c), blank 3 for (d) - so all three positions carry weight and the near-miss does not always turn on the same one. Window packet delivered separately for the A7 gate; not solved here.","instr":"Complete the following sentence using the most appropriate words in all three blanks."}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\d{10}$/;
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var marked=new Array(NQ).fill(false);
var deadline=0,tickCount=0; /* v2.5 wall-clock timer */
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;
var qShownQ=-1,visits=[]; /* v2.7: on-device visit log for the results analysis (never sent) */
var RAPID=!!CFG.rapid; /* v2.4 rapid mode */
var qSecondsLeft=0,qStartTs=0,qInterval=null,pendingResumeStartTs=null;
function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,visits:visits,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(Array.isArray(s.visits))visits=s.visits.filter(function(v){return v&&typeof v.q==="number"&&v.q>=0&&v.q<NQ});
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
  var mb=document.getElementById("mrkBtn");if(mb)mb.style.display="none";
 }
 renderQuestion();
 snSaveSession();
}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){
  var d=Math.round((Date.now()-qShownTs)/1000);
  questionTimes[currentQ]+=d;
  if(d>=1&&qShownQ===currentQ){ /* v2.7: one visit = from showing a question to leaving it */
   var e=elapsedNow();
   visits.push({q:currentQ,s:Math.max(0,e-d),d:d,a:answers[currentQ]});
   if(visits.length>800)visits.shift();
  }
 }
 qShownTs=Date.now();
}
function elapsedNow(){ /* seconds into the test on the test clock (sections ended early are not counted) */
 if(RAPID)return 0;
 var left=deadline?(deadline-Date.now())/1000:secondsLeft;
 var base=SEC?elapsedPrior+SEC[secIdx].minutes*60:CFG.minutes*60;
 return Math.max(0,Math.round(base-left));
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulText(el,t){el.textContent="";String(t==null?"":t).split(/(\[\[[\s\S]*?\]\])/).forEach(function(p){if(!p)return;var m=p.match(/^\[\[([\s\S]*)\]\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 /* v2.7 fix: picking an option re-renders the same question; that must not restart its stopwatch */
 if(!qShownTs||qShownQ!==currentQ){qShownTs=Date.now();qShownQ=currentQ}
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section;
 var iB=document.getElementById("instrBox");
 if(q.instr){iB.style.display="block";iB.textContent=q.instr}else{iB.style.display="none"}
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulText(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 if(q.format==="Parajumble")return String(a).trim()===String(q.answer); /* stem rule: 3412 valid; 3412. and 3 4 1 2 invalid */
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors,totalSecs);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors,totalSecs){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 document.getElementById("stAcc").textContent=(correct+wrong)?Math.round(100*correct/(correct+wrong))+"%":"\u2014";
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");
 /* v2.7: analysis + retry. Wrapped so a fault here can never blank the results screen. */
 try{LAST_A=computeAnalysis(score,totalSecs);renderAnalysis(LAST_A)}catch(e){LAST_A=null;var ab=document.getElementById("anaBox");if(ab)ab.innerHTML=""}
 try{renderRetry()}catch(e){var rb=document.getElementById("retryBox");if(rb)rb.innerHTML=""}

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";wrap.id="rq"+i;
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+escH(q.section)+" \u00b7 "+escH(q.format)+(diffOf(q)?" \u00b7 "+escH(q.difficulty):"")+" \u00b7 time "+fmtMS(questionTimes[i])+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  if(q.instr){var iv=document.createElement("div");iv.className="rqStem";iv.style.fontStyle="italic";iv.style.opacity=".8";iv.style.fontSize="12.6px";iv.textContent=q.instr;wrap.appendChild(iv)}
  var stem=document.createElement("div");stem.className="rqStem";ulText(stem,q.stem);wrap.appendChild(stem);
  var exh=document.createElement("div");renderExhibit(q,exh);if(exh.childNodes.length)wrap.appendChild(exh);
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    if(idx===a&&idx!==q.answerIndex){var tg=trapOf(q,a);if(tg){var tn=document.createElement("div");tn.className="trapNote";tn.textContent="trap: "+trapInfo(tg).name;r.appendChild(tn)}}
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   var ttg=trapOf(q,a);if(ttg){var ttn=document.createElement("div");ttn.className="trapNote";ttn.textContent="trap: "+trapInfo(ttg).name;yr.appendChild(ttn)}
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== POST-TEST ANALYSIS (v2.8) ====================
   Computed on this device from answers, questionTimes and the visit log.

var TRAPS={
 /* --- added for the UGAT VA sectionals (Mock 9/10) --- */
 "va-on-thread":["On the thread","A statement that does follow the common thread, chosen on a question that asked for the one that does not.","Name the thread in one sentence before reading the options, then test each statement against that sentence."],

 "vocab-category":["Wrong word form","Right idea, wrong part of speech or form for the blank.","Decide what the blank needs grammatically (noun, adjective, verb) before you weigh meanings."],

 "gram-hypercorrection":["Over-correction","A formal-sounding form, often 'whom', used where the plain one is right.","Cover any inserted clause and test with he/him: if 'he' fits, the word is 'who'. Formal-sounding is not the same as correct."],
 "gram-pronoun":["Pronoun mismatch","The pronoun doesn't agree with the noun it refers to.","Find the noun the pronoun points back to and match it in number and gender."],

var LAST_A=null;
function trapInfo(tag){
 var t=TRAPS[tag];
 if(t)return {name:t[0],what:t[1],fix:t[2]};
 var n=String(tag).replace(/^[a-z]+-/,"").replace(/-/g," ");
 return {name:n.charAt(0).toUpperCase()+n.slice(1),what:"",fix:""};
}
function diffOf(q){
 var d=String(q.difficulty||"").trim().toLowerCase();
 if(!d)return null;
 if(d.indexOf("hard")!==-1)return "hard";
 if(d.charAt(0)==="e")return "easy";
 if(d.charAt(0)==="m")return "medium";
 return null;
}
function penOf(q){return isMCQ(q)?CFG.w:titaWFor(q)}
function trapOf(q,a){
 if(a===null||a===""||a===undefined||isCorrect(q,a))return null;
 if(isMCQ(q)){
  var t=Array.isArray(q.optionTags)?q.optionTags[a]:null;
  return (typeof t==="string"&&t.trim())?t.trim():null;
 }
 if(q.titaTraps&&typeof q.titaTraps==="object"){
  var na=String(a).replace(/[\s,]/g,"");
  for(var k in q.titaTraps){
   if(Object.prototype.hasOwnProperty.call(q.titaTraps,k)&&String(k).replace(/[\s,]/g,"")===na)return q.titaTraps[k];
  }
 }
 return null;
}
function secOfQ(i){if(!SEC)return null;for(var s=0;s<SEC.length;s++){if(i>=SEC[s].start&&i<=SEC[s].end)return s}return null}
function paceOf(i){
 if(RAPID)return QUESTIONS[i].td||30;
 var s=secOfQ(i);
 if(s!==null)return SEC[s].minutes*60/(SEC[s].end-SEC[s].start+1);
 return CFG.minutes*60/NQ;
}
function availSecs(){
 if(RAPID)return QUESTIONS.reduce(function(a,q){return a+(q.td||30)},0);
 if(SEC)return SEC.reduce(function(a,p){return a+p.minutes*60},0);
 return CFG.minutes*60;
}
function fmtMS(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function sgn(n){return n>0?"+"+n:(n<0?"−"+(-n):"0")}
function sgnA(n){return n>0?"+"+n:(n<0?"-"+(-n):"0")}
function blank(x){return x===null||x===""||x===undefined}
function sameAns(q,x,y){if(blank(x)||blank(y))return blank(x)&&blank(y);return isMCQ(q)?x===y:titaNorm(x)===titaNorm(y)}
function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function capW(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function outWord(o){return o==="c"?"right":(o==="w"?"wrong":"blank")}
function plural(n,one,many){return n+" "+(n===1?one:many)}

function computeAnalysis(score,totalSecs){
 var A={score:score,max:MAX_MARKS,used:totalSecs||0,avail:availSecs(),c:0,w:0,s:0,neg:0,tC:0,tW:0,tS:0,out:[],
  hasDiff:false,hasTags:false,emW:0,emS:0,emSq:[],traps:[],trapped:0,trapMarks:0,timedOut:0,bankN:0,
  sinks:[],secs:[],journey:null,acc:null,verdict:null,
  diff:{easy:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},medium:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},hard:{n:0,o:0,c:0,w:0,s:0,net:0,t:0}}};
 var trapMap={};
 QUESTIONS.forEach(function(q,i){
  var a=answers[i],sk=blank(a),ok=!sk&&isCorrect(q,a),t=questionTimes[i]||0;
  var o=sk?"s":(ok?"c":"w");
  A.out.push(o);
  if(o==="c"){A.c++;A.tC+=t}
  else if(o==="w"){A.w++;A.tW+=t;A.neg+=-penOf(q);if(isMCQ(q))A.bankN++}
  else{A.s++;A.tS+=t}
  if(RAPID&&sk&&t>=(q.td||30))A.timedOut++;
  var d=diffOf(q);
  if(d){
   A.hasDiff=true;
   var b=A.diff[d];b.n++;b.t+=t;if(t>0)b.o++;
   if(o==="c"){b.c++;b.net+=CFG.c}else if(o==="w"){b.w++;b.net+=penOf(q)}else b.s++;
   if(d!=="hard"){if(o==="w")A.emW++;else if(o==="s"){A.emS++;if(!(RAPID&&t>=(q.td||30)))A.emSq.push(i)}} /* rapid: a question whose clock ran out counts under the clock, not as a skip */
  }
  if(Array.isArray(q.optionTags)||(q.titaTraps&&typeof q.titaTraps==="object"))A.hasTags=true;
  var tg=trapOf(q,a);
  if(tg){
   var inf=trapInfo(tg),sw=CFG.c-penOf(q);
   if(!trapMap[inf.name]){trapMap[inf.name]={name:inf.name,what:inf.what,fix:inf.fix,qs:[],marks:0};A.traps.push(trapMap[inf.name])}
   trapMap[inf.name].qs.push(i);trapMap[inf.name].marks+=sw;A.trapped++;A.trapMarks+=sw;
  }
  if(!RAPID&&t>=Math.max(90,2*paceOf(i)))A.sinks.push({i:i,t:t});
 });
 A.traps.sort(function(x,y){return (y.qs.length-x.qs.length)||(y.marks-x.marks)});
 A.sinks.sort(function(x,y){return y.t-x.t});A.sinks=A.sinks.slice(0,3);
 A.acc=(A.c+A.w)?Math.round(100*A.c/(A.c+A.w)):null;
 var order=[],bySec={};
 QUESTIONS.forEach(function(q,i){
  var k=q.section||"-";
  if(!bySec[k]){bySec[k]={sec:k,n:0,c:0,w:0,s:0,score:0,t:0};order.push(k)}
  var b=bySec[k],o=A.out[i];b.n++;b.t+=questionTimes[i]||0;
  if(o==="c"){b.c++;b.score+=CFG.c}else if(o==="w"){b.w++;b.score+=penOf(q)}else b.s++;
 });
 if(order.length>1)A.secs=order.map(function(k){return bySec[k]});
 if(!RAPID&&visits.length)A.journey=computeJourney();
 A.verdict=buildVerdict(A);
 return A;
}

function computeJourney(){
 var J={never:[],neverEM:0,changed:0,toRight:0,toWrong:0,gain:0,loss:0},byQ={};
 visits.forEach(function(v){(byQ[v.q]=byQ[v.q]||[]).push(v)});
 QUESTIONS.forEach(function(q,i){
  var vs=byQ[i],a=answers[i],d=diffOf(q);
  if(!vs||!vs.length){
   if(blank(a)&&!(questionTimes[i]>0)){J.never.push(i);if(d==="easy"||d==="medium")J.neverEM++}
   return;
  }
  var fn=null;
  for(var k=0;k<vs.length;k++){if(!blank(vs[k].a)){fn=vs[k].a;break}}
  if(fn!==null&&!blank(a)&&!sameAns(q,fn,a)){
   J.changed++;
   var was=isCorrect(q,fn),now=isCorrect(q,a),sw=CFG.c-penOf(q);
   if(!was&&now){J.toRight++;J.gain+=sw}
   else if(was&&!now){J.toWrong++;J.loss+=sw}
  }
 });
 return J;
}

/* The verdict: the biggest single leak, ranked by marks, in plain words. */
function buildVerdict(A){
 var C=[],J=A.journey,hb=A.diff.hard,never=J?J.never:[],top=A.traps[0],spare=Math.max(0,A.avail-A.used);
 if(A.trapped>=2&&top)C.push({k:"trap",m:A.trapMarks});
 var bl=A.emSq.filter(function(i){return never.indexOf(i)===-1}).length;
 if(bl)C.push({k:"blank",m:bl*CFG.c,n:bl});
 if(never.length>=3)C.push({k:"never",m:Math.max(1,J.neverEM)*CFG.c,n:never.length});
 if(A.hasDiff&&hb.c+hb.w>=2&&hb.net<0)C.push({k:"hard",m:-hb.net});
 if(J&&J.loss>J.gain)C.push({k:"second",m:J.loss-J.gain});
 if(RAPID&&A.timedOut>=3)C.push({k:"clock",m:A.timedOut*CFG.c/2});
 C.sort(function(x,y){return y.m-x.m});
 function line(c){
  var n=c.n,m=c.m;
  if(c.k==="trap")return {h:(A.trapped===A.w?"All "+A.w+" of your wrong answers":A.trapped+" of your "+plural(A.w,"wrong answer","wrong answers"))+" fell for a set trap.",s:"Together they cost "+plural(A.trapMarks,"mark","marks")+". The one to fix first: “"+top.name+"”, "+plural(top.qs.length,"time","times")+"."};
  if(c.k==="blank")return {h:"You left "+plural(n,"Easy or Medium question","Easy or Medium questions")+" blank.",s:"That is up to "+m+" marks that needed no new concept."};
  if(c.k==="never")return {h:"You never opened "+plural(n,"question","questions")+(J.neverEM?", "+J.neverEM+" of them Easy or Medium":"")+".",s:spare>=60?"You still had "+fmtMS(spare)+" on the clock when you finished.":"The clock ran out before you reached them."};
  if(c.k==="hard")return {h:"Hard questions cost you "+plural(m,"mark","marks")+" net.",s:hb.c+" right, "+hb.w+" wrong: leaving them blank would have scored higher."};
  if(c.k==="second")return {h:"Changing answers cost you "+plural(m,"mark","marks")+".",s:plural(J.toWrong,"right answer","right answers")+" changed to wrong; "+J.toRight+" wrong changed to right."};
  return {h:"The clock ran out on "+plural(A.timedOut,"question","questions")+".",s:"Each of those scored zero without an attempt."};
 }
 var V={h:"",s:"",also:"",acts:[]};
 if(C.length&&C[0].m>=CFG.c){
  var L=line(C[0]);V.h=L.h;V.s=L.s;
  if(C[1]&&C[1].m>=CFG.c)V.also=line(C[1]).h;
 }else if(A.acc!==null&&A.acc>=80&&!A.emS){
  V.h="A clean attempt: "+A.acc+"% accuracy and nothing easy left blank.";
  V.s="Next step: take on more of the Hard questions.";
 }else{
  V.h="You scored "+A.score+" of "+A.max+(A.acc!==null?" at "+A.acc+"% accuracy":"")+".";
  V.s="No single leak stands out. Go through the review below, question by question.";
 }
 var seen={};
 function act(t,href){if(seen[t])return;seen[t]=1;V.acts.push({t:t,href:href||null})}
 C.forEach(function(c){
  if(c.m<CFG.c)return;
  if(c.k==="trap"&&top.fix)act("Beat “"+top.name+"”: "+top.fix);
  else if(c.k==="never"&&spare>=60)act("Use the whole clock: before you end a section or submit, open every question you have not seen.");
  else if(c.k==="blank"&&RAPID)act("Decide in time: if you can rule out one option, answer and move on.");
  else if(c.k==="blank"||c.k==="never")act("First pass: answer every Easy and Medium question before you give time to a Hard one.");
  else if(c.k==="hard")act("Attempt a Hard question only after you have ruled out two options.");
  else if(c.k==="second")act("Keep your first answer unless you can name what is wrong with it.");
  else if(c.k==="clock")act("Decide in time: if you can rule out one option, answer and move on.");
 });
 V.acts=V.acts.slice(0,2);
 if(A.bankN)act((A.bankN===A.w?"Your "+plural(A.bankN,"wrong answer is","wrong answers are"):A.bankN+" of your wrong answers are")+" now in your Mistake Bank. They come back for revision tomorrow.","mistake_bank.html");
 return V;
}

function paletteHTML(A){

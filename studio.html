// ── Rendering ─────────────────────────────────────────────────
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function render(){renderConsole();renderDesk();renderModal();queuePersist()}
function renderConsole(){
 let h="";
 // Envelope intake
 h+='<div><div class="lbl">ENVELOPE INTAKE \u00b7 FROM A PROJECT SESSION</div>';
 h+='<div style="font-size:11.5px;color:var(--mut);margin-bottom:8px;line-height:1.5">Paste the approved <b style="color:var(--gold2)">{meta + questions}</b> JSON delivered by the exam project. The Studio audits, assembles, and exports \u2014 content never originates here. Batches merge here too: paste them one at a time and hit \u2295 Append \u2014 no model needed.</div>';
 if(S.pasteOpen||!S.qs.length){
  h+='<textarea id="envbox" rows="7" placeholder=\'{"meta":{"exam":"UGAT_IIMB","testType":"full","sections":["QADI","LR","VA"],"testName":"UGAT Mock 002","timerMinutes":null},"questions":[...]}\'></textarea>';
  h+='<button class="btn gold" style="margin-top:8px;width:100%" onclick="loadEnvelope()">\u2295 Load &amp; audit'+(S.qs.length?" (replace desk)":"")+'</button>';
  if(S.qs.length)h+='<button class="btn blue" style="margin-top:8px;width:100%" onclick="loadEnvelope(true)">\u2295 Append to desk \u00b7 merge batches</button>';
 }else{
  h+='<button class="btn sm" onclick="S.pasteOpen=true;render()">\u2295 Paste a new envelope</button>';
 }
 h+='</div>';
 // Loaded test ribbon
 if(S.meta){
  const examKey=resolveExam(S.meta.exam),cfg=examKey?EXAM_CONFIG[examKey]:null;
  if(cfg){
   const d=deriveDelivery();
   h+='<div><div class="lbl">LOADED TEST</div><div class="ribbon">';
   h+='<span class="tag g">'+esc(cfg.name)+'</span><span class="tag b">'+esc(S.meta.testType||"?")+'</span>'+(cfg.provisional?'<span class="tag a">PROVISIONAL SPEC</span>':'');
   h+='<div class="full">'+esc(String(S.meta.testName||""))+'</div>';
   h+='<div class="full">'+(S.meta.sections||[]).map(s=>esc(s)+" "+((S.report&&S.report.counts[s])||0)+"/"+(cfg.sections[s]!=null?cfg.sections[s]:"?")).join(" \u00b7 ")+'</div>';
   if(d&&!d.blocked)h+='<div class="full" style="color:var(--gold2)">'+d.minutes+' min ('+esc(d.timerSrc)+') \u00b7 +'+d.mk.c+' / '+d.mk.w+(d.mk.titaW!==undefined?' \u00b7 TITA '+(d.mk.titaWSec?Object.entries(d.mk.titaWSec).map(([k,v])=>k+' '+v).join(', ')+', else '+d.mk.titaW:d.mk.titaW):'')+' \u00b7 max '+d.max+' \u00b7 '+esc(d.navNote)+'</div>';
   if(d&&d.blocked)h+='<div class="full" style="color:var(--red)">\u26a0 '+esc(d.blocked)+'</div>';
   h+='</div></div>';
  }
 }
 // Intake report
 if(S.report){
  h+='<div><div class="lbl">INTAKE AUDIT \u00b7 GATE 1</div>';
  if(!S.report.errs.length)h+='<div class="noticeline">\u2713 Clean \u2014 all questions verified:"ok", schema valid, counts consistent.</div>';
  S.report.errs.forEach(e=>{h+='<div class="errline" style="margin-top:5px;line-height:1.45">\u2717 '+esc(e)+'</div>'});
  S.report.warns.forEach(w=>{h+='<div style="font-family:\'DM Mono\';font-size:11px;color:var(--amber);margin-top:5px;line-height:1.45">\u26a0 '+esc(w)+'</div>'});
  h+='</div>';
 }
 // Exam-config reference
 h+='<div style="margin-top:auto;border-top:1px solid var(--line);padding-top:12px"><div class="lbl">EXAM CONFIG TABLE \u00b7 v2 \u00b7 18 AUG 2026</div>';
 Object.entries(EXAM_CONFIG).forEach(([k,c])=>{
  h+='<div style="font-size:11px;color:var(--mut);margin-bottom:4px;line-height:1.5"><b style="color:var(--gold2)">'+esc(c.name)+'</b> \u00b7 '+cfgTotalQ(c)+'Q \u00b7 '+c.duration+'min \u00b7 +'+c.marking.c+'/'+c.marking.w+(c.marking.titaW!==undefined?' (TITA '+(c.marking.titaWSec?Object.entries(c.marking.titaWSec).map(([k,v])=>k+' '+v).join(', ')+', else '+c.marking.titaW:c.marking.titaW)+')':'')+' \u00b7 '+(c.timing==="locked"?"LOCKED "+c.secMinutes+"min/sec":"single clock")+'</div>';
 });
 h+='</div>';
 if(S.notice)h+='<div class="noticeline">'+esc(S.notice)+'</div>';
 if(S.err)h+='<div class="errline" style="line-height:1.45">'+esc(S.err)+'</div>';
 document.getElementById("console").innerHTML=h;
}
function renderDesk(){
 const clean=S.report&&!S.report.errs.length&&S.qs.length>0;
 const d=S.meta?deriveDelivery():null;
 const exportable=clean&&d&&!d.blocked;
 let h='<div class="deskbar"><span class="title">Assembly desk</span>';
 h+='<span class="tag '+(S.qs.length?(clean?'gr':'g'):'m')+'">GATE 1 \u00b7 INTAKE AUDIT'+(S.qs.length?(clean?' \u2713':' \u2717'):'')+'</span>';
 h+='<span class="tag m">GATE 2 \u00b7 IN PROJECTS</span><span class="tag m">GATE 3 \u00b7 BROWSER ON EXPORT</span><span class="tag gr">AUTOSAVE ON</span>';
 h+='<div class="exp">';
 if(S.qs.length>0)h+='<button class="btn sm red" onclick="clearDesk()">Clear desk</button>';
 h+='<button class="btn sm" '+(exportable?'':'disabled')+' onclick="exportJSON()">\u2193 JSON pool</button><button class="btn sm green" '+(exportable?'':'disabled')+' onclick="exportHTML()">\u2193 Portal test</button></div></div>';
 if(!S.qs.length){h+='<div class="empty"><b>The desk is clear.</b>Generate and approve questions in the exam\u2019s Claude Project, then paste the delivered envelope on the left. The Studio audits it, derives official timing and marking from the config table, and exports the portal test.<br><br><span style="font-family:\'DM Mono\';font-size:10.5px">Hard rule: nothing exports with verified \u2260 \u201cok\u201d or a count mismatch.</span></div>';}
 S.qs.forEach((q,i)=>{
  const vOK=q.verified==="ok";
  h+='<div class="card'+(vOK?' appr':'')+'"><div class="qhead"><span class="tag g">Q'+(i+1)+'</span><span class="tag m">'+esc(q.section)+' \u00b7 '+esc(q.format)+'</span><span class="tag a">'+esc(q.difficulty||"")+'</span>'+(q.kind==="tita"?'<span class="tag b">TITA</span>':'')+(vOK?'<span class="tag gr">VERIFIED \u2713</span>':'<span class="tag" style="color:var(--red);background:rgba(192,85,85,.12);border-color:rgba(192,85,85,.4)">VERIFIED: '+esc(String(q.verified))+'</span>');
  h+='<div class="acts"><button class="btn sm blue" onclick="startEdit('+esc(JSON.stringify(String(q.id)))+')">\u270e Edit</button><button class="btn sm red" onclick="delQ('+esc(JSON.stringify(String(q.id)))+')">\u2715</button></div></div>';
  if(q.passage)h+='<details><summary>base passage / dataset</summary><div>'+esc(q.passage)+'</div></details>';
  if(S.editing===q.id){
   h+='<div style="display:flex;flex-direction:column;gap:8px"><textarea id="e_stem" rows="3">'+esc(q.stem)+'</textarea>';
   if(q.kind!=="tita")h+='<textarea id="e_opts" rows="4" placeholder="One option per line">'+esc((q.options||[]).join("\n"))+'</textarea>';
   h+='<div class="editgrid"><input type="text" id="e_ans" style="font-family:\'DM Mono\';border-color:rgba(212,169,78,.5)" value="'+esc(q.answer)+'" placeholder="Correct answer (exact option text / TITA value)"><select id="e_diff">'+["Easy","Medium","Hard"].map(dd=>'<option'+(dd===q.difficulty?' selected':'')+'>'+dd+'</option>').join('')+'</select></div>';
   h+='<textarea id="e_expl" rows="2" placeholder="Explanation">'+esc(q.explanation)+'</textarea>';
   h+='<div style="display:flex;gap:8px"><button class="btn sm gold" onclick="saveEdit('+esc(JSON.stringify(String(q.id)))+')">Save changes</button><button class="btn sm" onclick="S.editing=null;render()">Cancel</button></div></div>';
  } else {
   h+='<div class="stem">'+esc(q.stem)+'</div>';
   if(q.options&&q.options.length)h+='<ol class="opts">'+q.options.map((o,j)=>'<li class="'+(j===q.answerIndex?'key':'')+'">'+esc(o)+'</li>').join('')+'</ol>';
   h+='<div class="keyline">KEY: '+esc(q.answer)+'</div>';
   if(q.explanation)h+='<div class="expl">'+esc(q.explanation)+'</div>';
  }
  h+='</div>';
 });
 document.getElementById("desk").innerHTML=h;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Test Builder Studio · Road to IIM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap');
:root{--ink:#0B1220;--panel:#101A2D;--panel2:#152136;--line:rgba(212,169,78,.22);--gold:#D4A94E;--gold2:#E8C57A;--gold3:#B8893A;--goldsoft:rgba(212,169,78,.12);--text:#E8E4D8;--mut:#8B94A8;--green:rgba(78,160,130,1);--greensoft:rgba(78,160,130,.15);--red:#C05555;--amber:#C9924B;--blue:#6E9BC5;--glow:0 0 24px rgba(212,169,78,.18)}
*{box-sizing:border-box;margin:0}
html{scrollbar-color:rgba(212,169,78,.35) var(--ink)}
body{background:var(--ink);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(900px 420px at 12% -8%,rgba(212,169,78,.10),transparent 60%),
            radial-gradient(800px 480px at 92% 108%,rgba(110,155,197,.08),transparent 60%),
            radial-gradient(1200px 800px at 50% 50%,transparent 55%,rgba(0,0,0,.35) 100%)}
header{position:relative;z-index:1;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
 background:linear-gradient(180deg,rgba(21,33,54,.5),rgba(11,18,32,0))}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
 background:linear-gradient(90deg,transparent,rgba(212,169,78,.65) 18%,rgba(232,197,122,.9) 50%,rgba(212,169,78,.65) 82%,transparent);
 background-size:200% 100%;animation:shimmer 7s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
header h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(20px,3vw,27px);color:var(--gold);
 text-shadow:0 0 30px rgba(212,169,78,.35)}
header span{font-family:'DM Mono';font-size:11px;color:var(--mut);letter-spacing:.1em}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(290px,370px) 1fr;min-height:calc(100vh - 62px)}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.console{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;
 background:linear-gradient(165deg,rgba(21,33,54,.72),rgba(16,26,45,.55) 55%,rgba(11,18,32,.4));
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 box-shadow:inset 0 1px 0 rgba(232,228,216,.05),inset -1px 0 0 rgba(212,169,78,.08)}
.desk{padding:18px;overflow-y:auto}
.lbl{font-family:'DM Mono';font-size:10.5px;color:var(--mut);letter-spacing:.12em;margin-bottom:6px}
select,input[type=number],input[type=text]{background:var(--panel2);color:var(--text);border:1px solid rgba(232,228,216,.25);border-radius:7px;padding:8px 10px;font-family:'DM Sans';font-size:13.5px;width:100%;transition:border-color .18s,box-shadow .18s}
select:hover,input[type=number]:hover,input[type=text]:hover{border-color:rgba(212,169,78,.45)}
select:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,169,78,.12);outline:none}
textarea{background:var(--panel2);color:var(--text);border:1px solid rgba(212,169,78,.4);border-radius:7px;padding:10px;font-family:'DM Sans';font-size:13.5px;width:100%;line-height:1.5;transition:border-color .18s,box-shadow .18s}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,169,78,.12);outline:none}
input[type=range]{accent-color:var(--gold);width:100%}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tag{font-family:'DM Mono';font-size:10px;letter-spacing:.08em;border-radius:4px;padding:2px 7px;white-space:nowrap;display:inline-block;border:1px solid}
.tag.g{color:var(--gold2);background:var(--goldsoft);border-color:rgba(212,169,78,.4)}
.tag.gr{color:var(--green);background:var(--greensoft);border-color:rgba(78,160,130,.4)}
.tag.b{color:var(--blue);background:rgba(110,155,197,.1);border-color:rgba(110,155,197,.35)}
.tag.a{color:var(--amber);background:rgba(201,146,75,.12);border-color:rgba(201,146,75,.35)}
.tag.m{color:var(--mut);background:rgba(139,148,168,.1);border-color:rgba(139,148,168,.3)}
.btn{font-family:'DM Sans';font-weight:600;border-radius:7px;cursor:pointer;border:1px solid rgba(232,228,216,.25);background:rgba(21,33,54,.4);color:var(--text);font-size:13.5px;padding:9px 16px;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(212,169,78,.5)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.sm{font-size:12px;padding:4px 10px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--gold3));color:var(--ink);border-color:transparent;box-shadow:0 2px 10px rgba(212,169,78,.25)}
.btn.gold:hover:not(:disabled){box-shadow:0 4px 18px rgba(212,169,78,.4)}
.btn.green{background:var(--greensoft);color:var(--green);border-color:rgba(78,160,130,.4)}
.btn.green:hover:not(:disabled){box-shadow:0 2px 12px rgba(78,160,130,.25)}
.btn.red{background:rgba(192,85,85,.12);color:var(--red);border-color:rgba(192,85,85,.35)}
.btn.blue{background:rgba(110,155,197,.12);color:var(--blue);border-color:rgba(110,155,197,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ribbon{margin-top:10px;background:linear-gradient(150deg,rgba(212,169,78,.10),rgba(16,26,45,.9) 40%);border:1px solid rgba(212,169,78,.35);border-radius:9px;padding:11px 13px;display:flex;flex-wrap:wrap;gap:6px;box-shadow:var(--glow),inset 0 1px 0 rgba(232,197,122,.12)}
.ribbon .full{width:100%;font-family:'DM Mono';font-size:10.5px;color:var(--mut)}
.scopegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scopegrid button{font-size:13px;font-weight:600;padding:9px 8px;border-radius:7px;cursor:pointer;background:rgba(21,33,54,.35);color:var(--text);border:1px solid rgba(232,228,216,.2);transition:all .15s}
.scopegrid button:hover{border-color:rgba(212,169,78,.45)}
.scopegrid button.on{background:linear-gradient(135deg,rgba(212,169,78,.22),rgba(212,169,78,.1));color:var(--gold2);border-color:rgba(212,169,78,.6);box-shadow:inset 0 1px 0 rgba(232,197,122,.15)}
.fmtlist{display:flex;flex-direction:column;gap:4px;max-height:250px;overflow-y:auto;padding-right:4px}
.fmtrow{display:flex;align-items:center;gap:8px}
.fmtrow input{width:56px;flex-shrink:0}
.fmtrow span{font-size:12.5px}
.card{background:linear-gradient(160deg,rgba(21,33,54,.55),var(--panel) 60%);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px;transition:transform .18s,box-shadow .18s,border-color .18s;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{border-color:rgba(212,169,78,.4);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.card.appr{border-color:rgba(78,160,130,.5);box-shadow:0 0 16px rgba(78,160,130,.10),inset 0 1px 0 rgba(78,160,130,.12)}
.qhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qhead .acts{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.stem{font-size:15px;line-height:1.55;white-space:pre-wrap;margin-bottom:8px}
ol.opts{margin:0 0 8px 20px}ol.opts li{font-size:13.5px;margin-bottom:3px;color:var(--mut);list-style-type:upper-alpha}
ol.opts li.key{color:var(--green);font-weight:700}
.keyline{font-family:'DM Mono';font-size:12px;color:var(--green)}
.expl{font-size:12.5px;color:var(--mut);margin-top:4px}
.empty{border:1px dashed var(--line);border-radius:11px;padding:40px;text-align:center;color:var(--mut);background:radial-gradient(400px 160px at 50% 0%,rgba(212,169,78,.05),transparent)}
.empty b{display:block;font-family:Fraunces,serif;font-size:22px;color:var(--gold);margin-bottom:8px;font-weight:600}
.prog{font-family:'DM Mono';font-size:11.5px;color:var(--gold2)}
.errline{font-family:'DM Mono';font-size:11.5px;color:var(--red)}
.noticeline{font-family:'DM Mono';font-size:11.5px;color:var(--green)}
details summary{font-family:'DM Mono';font-size:11px;color:var(--blue);cursor:pointer}
details div{font-size:13px;color:var(--mut);white-space:pre-wrap;padding:8px 0;line-height:1.55}
.rfbox{background:linear-gradient(150deg,rgba(212,169,78,.08),var(--panel) 50%);border:1px solid rgba(212,169,78,.3);border-radius:9px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--glow)}
.deskbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.deskbar .title{font-family:Fraunces,serif;font-size:19px;font-weight:600}
.deskbar .exp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.editgrid{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.modalwrap{position:fixed;inset:0;z-index:50;background:rgba(5,9,17,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:linear-gradient(165deg,rgba(21,33,54,.97),rgba(16,26,45,.99));border:1px solid rgba(212,169,78,.4);border-radius:12px;padding:20px;max-width:640px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.6),var(--glow)}
.modal h3{font-family:Fraunces,serif;color:var(--gold);font-size:19px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.modal textarea{font-family:'DM Mono';font-size:11px;height:110px;resize:vertical}
.modal .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:rgba(212,169,78,.28);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(212,169,78,.45)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><h1>Test Builder Studio</h1><span>ROAD TO IIM × CAMP VERBAL · PROJECTS DRAFT · STUDIO SHIPS</span></header>
<div class="grid">
  <div class="console" id="console"></div>
  <div class="desk" id="desk"></div>
</div>
<div id="modalRoot"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  TEST BUILDER STUDIO v2.7 — ASSEMBLY & EXPORT ONLY
//  v2.7 (6 Oct 2026): export template — post-test analysis on the
//  results screen, all computed on the student's device (the 16-field
//  payload is unchanged):
//   · Where your marks went: score, accuracy, "within reach" (score +
//     every mark on Easy/Medium questions answered wrong or left blank),
//     marks lost to negative marking.
//   · Time: on right vs wrong vs blank answers, marks per minute,
//     slowest questions, a bar per question against even pace.
//   · By difficulty (net marks per level), by section, traps that
//     caught the student (from optionTags / titaTraps; names in TRAPS),
//     how they moved (first-look accuracy, came back and answered,
//     changed answers, never opened, late-opened Easy/Medium), and a
//     timeline of every visit. Retry-wrong-answers block (no clock).
//   · Review cards and the PDF show difficulty, time spent and the trap.
//   · FIX: picking an option re-rendered the question and restarted its
//     stopwatch, so questionTimes kept only the seconds after the last
//     tap. Every earlier non-rapid Studio export under-records MCQ time
//     (checked live: UGAT 004–006, Indore 01 full, VA Challenge 01–02,
//     Revisers). Rapid mode was not affected.
//   · PDF option markers are plain text ([correct] / [your choice]);
//     the old tick and cross glyphs did not print in the PDF font.
//  v2.6 (6 Oct 2026): export template —
//   · Test screen no longer shows the question type, difficulty or
//     TITA tag next to the question: the badge shows the section only.
//     Review page and PDF still show the type after submission;
//     topicErrors still come from q.format.
//   · [[...]] in a stem renders as an underline on the test screen
//     and review page (PDF prints it in quotes), so sentence-
//     correction items no longer show raw brackets.
//  v2.5 (24 Sep 2026): audit fixes —
//   · ⊕ Append: a testType "full" envelope now sets the merged
//     testName / timerMinutes / timerMode / sectionTimers / titaW
//     (before, Batch 1's values survived: a full Indore mock could
//     export as one 40-min clock named "Batch 1").
//   · Per-section TITA penalty (Indore: QA-SA 0, VA −1, decided
//     5 Sep 2026); meta.titaW overrides all TITA if set.
//   · meta.sectionTimers honoured per section on locked exams.
//   · Intake audit: optionTags / titaTraps checked; warning when
//     timerMinutes overrides a full locked mock's sectional lock.
//   · Export template: wall-clock timer (closing the tab no longer
//     pauses the clock; locked sections catch up on resume), Clear
//     response + Mark for review, Online batch group, usage ping.
//   · Desk edit keeps optionTags aligned when options are edited.
//  v2.4 (8 Sep 2026): RAPID MODE — meta.timerMode:"perQuestion"
//  + integer td (seconds) per question exports a Rapid Fire
//  delivery: per-question countdown bar, auto-advance at 0s,
//  forward-only (Prev hidden, palette display-only), no master
//  clock, timeTaken = sum of per-question elapsed. TITA hard-
//  blocked in rapid mode. Sectional/full exports unchanged.
//  v2.3 (3 Sep 2026): batch merging built into intake — paste
//  envelopes one by one with ⊕ Append; Studio unions sections,
//  concatenates questions, re-audits after every paste. The
//  separate model-run “merge batch” is retired.
//  v2.2 (3 Sep 2026): sectional-locked delivery BUILT INTO the
//  export template (per-section clocks, fixed order, auto-
//  advance, no return) — full Indore/IIMK mocks export directly;
//  TITA options:[] no longer mis-renders as MCQ (titaW now
//  applied); numeric-equivalence TITA marking ("02"=2, commas/
//  spaces stripped, trailing punctuation still rejected);
//  fig/table render on test screen, review, and PDF.
//  v2.1 (18 Aug 2026): confirm() → uiAsk overlay (Clear Desk +
//  replace-desk prompt were dead in sandbox); duplicate check now
//  keys on stem+passage+options (generic stems no longer flag).
//  Generation + Gate 2 live in per-exam Claude Projects.
//  This file: paste approved envelope JSON → intake audit →
//  desk review → gated export. Deterministic end to end.
// ══════════════════════════════════════════════════════════════

// ── Exam config table — SINGLE SOURCE OF TRUTH (18 Aug 2026) ──
// duration/marking/sections verified against official patterns.
// timing: "single" = one clock, free nav
//         "locked" = per-section clocks, fixed order, auto-
//                    advance, no return (built into template, v2.2)
const EXAM_CONFIG={
 UGAT_IIMB:{name:"UGAT IIM Bangalore",marking:{c:3,w:-1},duration:120,timing:"single",
  sections:{QADI:30,LR:15,VA:15},order:["QADI","LR","VA"],navNote:"free navigation"},
 IPMAT_INDORE:{name:"IPMAT Indore",marking:{c:4,w:-1,titaW:0,titaWSec:{"VA":-1}},duration:120,timing:"locked",secMinutes:40,
  sections:{"QA-SA":15,"QA-MCQ":30,"VA":45},order:["QA-SA","QA-MCQ","VA"],navNote:"sectional lock \u00b7 40 min \u00d7 3 \u00b7 fixed order"},
 JIPMAT:{name:"JIPMAT (NTA)",marking:{c:4,w:-1},duration:150,timing:"single",
  sections:{QA:33,LR:33,VA:34},order:["QA","LR","VA"],navNote:"free navigation"},
 IIMK_BMS:{name:"IIMK BMS AT",marking:{c:3,w:-1},duration:120,timing:"locked",secMinutes:60,
  sections:{VA:50,QA:50},order:["VA","QA"],navNote:"sectional lock \u00b7 60 + 60 min"},
 IPMAT_ROHTAK:{name:"IPMAT Rohtak",marking:{c:4,w:-1},duration:120,timing:"single",provisional:true,
  sections:{QA:40,VA:40,LR:40},order:["QA","VA","LR"],navNote:"free navigation"}
};
const EXAM_ALIASES={UGAT:"UGAT_IIMB",UGAT_IIM_BANGALORE:"UGAT_IIMB",IIMB_UG:"UGAT_IIMB",INDORE:"IPMAT_INDORE",IPMAT:"IPMAT_INDORE",IIMK:"IIMK_BMS",IIMK_BMS_AT:"IIMK_BMS",ROHTAK:"IPMAT_ROHTAK",JIPMAT_NTA:"JIPMAT"};
function resolveExam(code){const k=String(code||"").toUpperCase().replace(/[\s-]+/g,"_");return EXAM_CONFIG[k]?k:(EXAM_ALIASES[k]||null)}
function cfgTotalQ(cfg){return Object.values(cfg.sections).reduce((a,b)=>a+b,0)}

// ── State ─────────────────────────────────────────────────────
let S={meta:null,qs:[],report:null,editing:null,notice:"",err:"",modal:null,pasteOpen:true};

// ── Autosave / restore (artifact storage → localStorage fallback) ──
const STORE_KEY="tbs_state_v4";
function hasWS(){try{return !!(window.storage&&window.storage.set)}catch(e){return false}}
function snapshot(){return JSON.stringify({meta:S.meta,qs:S.qs,savedAt:Date.now()})}
async function persist(){
 const snap=snapshot();
 let ok=false;
 if(hasWS()){try{const r=await window.storage.set(STORE_KEY,snap);ok=!!r}catch(e){ok=false}}
 if(!ok){try{localStorage.setItem(STORE_KEY,snap)}catch(e){}}
}
let persistT=null;
function queuePersist(){clearTimeout(persistT);persistT=setTimeout(persist,500)}
async function restoreState(){
 let raw=null;
 if(hasWS()){try{const r=await window.storage.get(STORE_KEY);raw=r?r.value:null}catch(e){raw=null}}
 if(!raw){try{raw=localStorage.getItem(STORE_KEY)}catch(e){}}
 if(!raw)return;
 try{
  const s=JSON.parse(raw);
  if(!s||!s.meta||!Array.isArray(s.qs)||!s.qs.length)return;
  if(!resolveExam(s.meta.exam))return;
  S.meta=s.meta;S.qs=s.qs;S.pasteOpen=false;
  S.notice="Session restored \u00b7 "+s.qs.length+" question(s) recovered from autosave.";
  S.report=runAudit(S.meta,S.qs);
  render();
 }catch(e){}
}
async function clearSaved(){
 if(hasWS()){try{await window.storage.delete(STORE_KEY)}catch(e){}}
 try{localStorage.removeItem(STORE_KEY)}catch(e){}
}

// ── Tolerant JSON parsing (markdown fences etc.) ──────────────
function parseLoose(txt){
 const c=String(txt||"").replace(/```json|```/g,"").trim();
 const s=c.indexOf("{"),e=c.lastIndexOf("}");
 try{if(s!==-1&&e>s)return JSON.parse(c.slice(s,e+1))}catch(x){}
 try{return JSON.parse(c)}catch(x){}
 return null;
}

// ── INTAKE AUDIT (Gate 1 — deterministic, hard-blocking) ──────
// Root-cause rules from the 18 Aug 2026 Mock 001 audit:
//   verified!=="ok" shipped → now a wall (R1)
//   silent batch drop → count check vs config (R5)
//   dupes → duplicate id + exact-stem detection (R6, warn)
function runAudit(meta,qs){
 const errs=[],warns=[];
 const examKey=resolveExam(meta&&meta.exam);
 if(!examKey){errs.push("meta.exam \u2018"+((meta&&meta.exam)||"?")+"\u2019 is not in the exam-config table.");return {errs,warns,counts:{},examKey:null}}
 const cfg=EXAM_CONFIG[examKey];
 const tt=meta.testType;
 if(tt!=="full"&&tt!=="sectional")errs.push("meta.testType must be \u2018full\u2019 or \u2018sectional\u2019 (got \u2018"+tt+"\u2019).");
 if(!meta.testName||!String(meta.testName).trim())errs.push("meta.testName is missing.");
 const declared=Array.isArray(meta.sections)?meta.sections:[];
 if(!declared.length)errs.push("meta.sections is missing or empty.");
 declared.forEach(sec=>{if(!(sec in cfg.sections))errs.push("Declared section \u2018"+sec+"\u2019 is not a "+cfg.name+" section. Valid: "+cfg.order.join(", ")+".")});
 if(tt==="full"){
  const missing=cfg.order.filter(s=>declared.indexOf(s)===-1);
  if(missing.length)errs.push("testType \u2018full\u2019 but meta.sections omits: "+missing.join(", ")+".");
 }
 if(meta.timerMinutes!=null&&(typeof meta.timerMinutes!=="number"||meta.timerMinutes<=0))errs.push("meta.timerMinutes must be a positive number or null.");
 // v2.4 rapid mode — meta checks
 if(meta.timerMode!=null&&meta.timerMode!=="perQuestion")errs.push("meta.timerMode must be \u2018perQuestion\u2019 or absent (got \u2018"+meta.timerMode+"\u2019).");
 const rapid=meta.timerMode==="perQuestion";
 if(rapid&&meta.sectionTimers)errs.push("meta.sectionTimers and timerMode \u2018perQuestion\u2019 are mutually exclusive.");
 if(rapid&&meta.timerMinutes!=null)warns.push("meta.timerMinutes is ignored in rapid mode \u2014 per-question td values govern.");
 if(!rapid&&cfg.timing==="locked"&&tt==="full"&&meta.timerMinutes!=null)warns.push("meta.timerMinutes = "+meta.timerMinutes+" replaces the sectional lock with ONE clock for the whole mock. Set timerMinutes to null for the official "+cfg.secMinutes+"-min sections.");
 if(meta.titaW!=null&&(typeof meta.titaW!=="number"||meta.titaW>0))errs.push("meta.titaW must be 0 or a negative number (got \u2018"+meta.titaW+"\u2019).");
 if(meta.sectionTimers!=null){
  if(typeof meta.sectionTimers!=="object"||Array.isArray(meta.sectionTimers))errs.push("meta.sectionTimers must be an object like {\"QA-SA\":40}.");
  else Object.entries(meta.sectionTimers).forEach(([k,v])=>{if(declared.indexOf(k)===-1)warns.push("meta.sectionTimers names \u2018"+k+"\u2019, which is not in meta.sections.");if(typeof v!=="number"||v<=0)errs.push("meta.sectionTimers."+k+" must be a positive number.")});
  if(cfg.timing!=="locked")warns.push("meta.sectionTimers is ignored: "+cfg.name+" uses a single clock.");
 }

 // Per-question checks
 const counts={},ids={},stems={};
 const R1=[],R3=[],R4=[],badSec=[],badStatus=[];
 qs.forEach((q,i)=>{
  const tag=q.id?String(q.id):("index "+i);
  if(!q.id)errs.push("Question at index "+i+" has no id.");
  else{if(ids[q.id])errs.push("Duplicate id: "+q.id);ids[q.id]=1}
  if(q.verified!=="ok")R1.push(tag+" (verified: "+String(q.verified)+")");
  if(q.status!=="approved")badStatus.push(tag);
  if(!q.section||declared.indexOf(q.section)===-1)badSec.push(tag+" (section: "+String(q.section)+")");
  else counts[q.section]=(counts[q.section]||0)+1;
  if(!q.stem||!String(q.stem).trim())errs.push(tag+": empty stem.");
  else{const key=[String(q.stem).trim(),String(q.passage||"").trim(),(Array.isArray(q.options)?q.options.map(o=>String(o).trim()).join("\u241F"):"")].join("\u2400");if(stems[key])warns.push("Exact duplicate question: "+tag+" repeats "+stems[key]+" (identical stem, passage, and options).");else stems[key]=tag}
  if(!q.format||!String(q.format).trim())warns.push(tag+": empty format label \u2014 topicErrors tracking will fragment.");
  if(rapid){
   if(q.kind==="tita"||!(q.options&&q.options.length))errs.push(tag+": TITA is not supported in rapid mode (per-question clock is tap-and-advance only).");
   if(!Number.isInteger(q.td)||q.td<10||q.td>300)errs.push(tag+": rapid mode needs integer td between 10 and 300 seconds (got "+String(q.td)+").");
  }
  if(q.kind==="tita"){
   if(q.options&&q.options.length)errs.push(tag+": TITA question carries options.");
   if(!String(q.answer??"").trim())errs.push(tag+": TITA answer is empty.");
   if(q.titaTraps!=null){
    if(typeof q.titaTraps!=="object"||Array.isArray(q.titaTraps))errs.push(tag+": titaTraps must be an object like {\"2413\":\"pj-time-order\"}.");
    else if(Object.keys(q.titaTraps).some(k=>String(k).replace(/[\s,]/g,"")===String(q.answer??"").replace(/[\s,]/g,"")))errs.push(tag+": titaTraps lists the correct answer as a trap.");
   }
  }else{
   const opts=q.options;
   if(!Array.isArray(opts)||opts.length!==4)R4.push(tag+" (options: "+(Array.isArray(opts)?opts.length:"none")+")");
   else{
    if(!Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>3)R3.push(tag+" (answerIndex: "+String(q.answerIndex)+")");
    else if(String(opts[q.answerIndex]).trim()!==String(q.answer??"").trim())R3.push(tag+" (answer text \u2260 options[answerIndex])");
    if(q.optionTags!=null){
     const ot=q.optionTags;
     if(!Array.isArray(ot)||ot.length!==4)errs.push(tag+": optionTags must be an array of 4.");
     else ot.forEach((t,j)=>{
      if(j===q.answerIndex&&t!==null)errs.push(tag+": optionTags puts \u2018"+t+"\u2019 on the correct option; it must be null.");
      if(j!==q.answerIndex&&(typeof t!=="string"||!t.trim()))errs.push(tag+": optionTags leaves wrong option "+"ABCD"[j]+" untagged.");
     });
    }
   }
  }
 });
 if(R1.length)errs.push("HARD BLOCK \u2014 verified \u2260 \u201cok\u201d on "+R1.length+" question(s): "+R1.join(" \u00b7 "));
 if(badStatus.length)errs.push("Not approved (status \u2260 \u201capproved\u201d): "+badStatus.join(" \u00b7 "));
 if(badSec.length)errs.push("Section not in meta.sections: "+badSec.join(" \u00b7 "));
 if(R4.length)errs.push("MCQ without exactly 4 options: "+R4.join(" \u00b7 "));
 if(R3.length)errs.push("answer/answerIndex mismatch: "+R3.join(" \u00b7 "));

 // Count check — the batch-drop catcher
 declared.forEach(sec=>{
  const have=counts[sec]||0,want=cfg.sections[sec];
  if(tt==="full"){if(have!==want)errs.push("Count mismatch \u2014 "+sec+": "+have+" / spec "+want+".")}
  else{
   if(have===0)errs.push("Sectional export declares "+sec+" but contains 0 "+sec+" questions.");
   else if(have!==want)warns.push(sec+": "+have+" question(s) vs official section count "+want+" \u2014 fine for a drill, flagging for awareness.");
  }
 });
 if(rapid&&!errs.length){const bud=qs.reduce((a,q)=>a+(q.td||0),0);warns.push("Rapid budget: "+Math.floor(bud/60)+"m"+String(bud%60).padStart(2,"0")+"s across "+qs.length+" Q \u2014 per-question clocks, no master timer.")}
 return {errs,warns,counts,examKey};
}

// ── Delivery derivation (timer / marks / nav from config) ─────
function deriveDelivery(){
 if(!S.meta||!S.qs.length)return null;
 const examKey=resolveExam(S.meta.exam),cfg=EXAM_CONFIG[examKey];
 const isFull=S.meta.testType==="full";
 const mk=Object.assign({},cfg.marking);
 if(typeof S.meta.titaW==="number"){mk.titaW=S.meta.titaW;mk.titaWSec=null} // v2.5 envelope override applies to all TITA
 const st=(S.meta.sectionTimers&&typeof S.meta.sectionTimers==="object")?S.meta.sectionTimers:{};
 const secMin=sec=>(typeof st[sec]==="number"&&st[sec]>0)?st[sec]:cfg.secMinutes;
 if(S.meta.timerMode==="perQuestion"){ // v2.4 rapid — bypasses single/locked timing entirely
  const bud=S.qs.reduce((a,q)=>a+(q.td||0),0);
  return {examKey,cfg,isFull,minutes:Math.max(1,Math.ceil(bud/60)),navNote:"rapid \u00b7 per-question clock \u00b7 forward only",blocked:null,
   timerSrc:"per-question td (\u03a3 "+Math.floor(bud/60)+"m"+String(bud%60).padStart(2,"0")+"s)",mk,max:S.qs.length*mk.c,sectional:null,rapid:true,
   title:String(S.meta.testName||cfg.name+" \u00b7 Test")};
 }
 let minutes=null,navNote=cfg.navNote,blocked=null,timerSrc="official",sectional=null;
 if(S.meta.timerMinutes!=null){
  minutes=S.meta.timerMinutes;timerSrc="OVERRIDE (meta.timerMinutes)";
  if(cfg.timing==="locked")navNote="single clock (deliberate override of sectional lock)";
 }else if(cfg.timing==="single"){
  minutes=isFull?cfg.duration:Math.max(5,Math.round(S.qs.length*cfg.duration/cfgTotalQ(cfg)));
  if(!isFull)timerSrc="proportional ("+(cfg.duration/cfgTotalQ(cfg)).toFixed(1)+" min/Q)";
 }else{ // locked exam — sectional delivery (v2.2: built into template)
  const present=cfg.order.filter(sec=>S.qs.some(q=>q.section===sec));
  const custom=present.some(sec=>secMin(sec)!==cfg.secMinutes);
  if(present.length<=1){const m=secMin(present[0]);minutes=m;navNote="single section \u00b7 "+m+" min";timerSrc=custom?"meta.sectionTimers":"official per-section"}
  else{
   const mins={};present.forEach(sec=>{mins[sec]=secMin(sec)});
   sectional={secMinutes:cfg.secMinutes,order:present,mins:mins};
   minutes=present.reduce((a,sec)=>a+mins[sec],0);
   timerSrc=(custom?"meta.sectionTimers \u00b7 ":"official sectional \u00b7 ")+present.map(sec=>sec+" "+mins[sec]).join(" / ")+" min";
  }
 }
 const max=S.qs.length*mk.c;
 return {examKey,cfg,isFull,minutes,navNote,blocked,timerSrc,mk,max,sectional,
  title:String(S.meta.testName||cfg.name+" \u00b7 Test")};
}

// ── Load envelope ─────────────────────────────────────────────
function loadEnvelope(append){
 const box=document.getElementById("envbox");if(!box)return;
 S.err="";S.notice="";
 const env=parseLoose(box.value);
 if(!env||typeof env!=="object"||Array.isArray(env)){S.err="Could not parse \u2014 paste the full envelope object: {\"meta\":{...},\"questions\":[...]}.";render();return}
 if(!env.meta||!Array.isArray(env.questions)){S.err=Array.isArray(env.questions)===false&&!env.meta?"Envelope must contain both \u2018meta\u2019 and \u2018questions\u2019. A bare question array is no longer accepted \u2014 the project delivers the wrapped format (\u00a74 of its instructions).":"Envelope missing "+(!env.meta?"\u2018meta\u2019":"\u2018questions\u2019 array")+".";render();return}
 if(!env.questions.length){S.err="\u2018questions\u2019 is empty.";render();return}
 if(append&&S.qs.length&&S.meta){
  const curKey=resolveExam(S.meta.exam),newKey=resolveExam(env.meta.exam);
  if(!newKey||curKey!==newKey){S.err="Append blocked \u2014 this envelope is \u2018"+String(env.meta.exam)+"\u2019 but the desk holds "+curKey+". Clear the desk to switch exams.";render();return}
  const merged=Object.assign({},S.meta);
  merged.sections=(merged.sections||[]).slice();
  (env.meta.sections||[]).forEach(sec=>{if(merged.sections.indexOf(sec)===-1)merged.sections.push(sec)});
  if(env.meta.testType==="full"){
   merged.testType="full";
   // v2.5: the full envelope is authoritative for delivery settings (Batch 1's must not survive)
   ["testName","timerMinutes","timerMode","sectionTimers","titaW"].forEach(k=>{if(k in env.meta)merged[k]=env.meta[k];else delete merged[k]});
  }
  const qsNew=S.qs.concat(env.questions.map(q=>Object.assign({},q)));
  const report=runAudit(merged,qsNew);
  S.meta=merged;S.qs=qsNew;S.report=report;S.editing=null;S.pasteOpen=false;box.value="";
  if(report.errs.length)S.err="Merged \u00b7 "+qsNew.length+" question(s) on the desk \u00b7 "+report.errs.length+" audit issue(s) outstanding \u2014 normal until every batch is pasted; export stays locked until clean.";
  else S.notice="Merged clean \u00b7 "+qsNew.length+" question(s) on the desk.";
  render();return;
 }
 const proceed=()=>{
  const report=runAudit(env.meta,env.questions);
  S.meta=env.meta;S.qs=env.questions.map(q=>Object.assign({},q));S.report=report;S.editing=null;S.pasteOpen=false;
  if(report.errs.length)S.err="Intake audit: "+report.errs.length+" blocking issue(s) \u2014 fix in the project and re-paste, or edit on the desk. Export stays locked until clean.";
  else S.notice="Intake audit clean \u00b7 "+S.qs.length+" question(s) on the desk.";
  render();
 };
 if(S.qs.length){uiAsk("Replace the current desk ("+S.qs.length+" question(s)) with this envelope?",proceed);return}
 proceed();
}

// ── Desk actions (Gate 2 lives in the projects; desk = last-look) ──
function delQ(id){S.qs=S.qs.filter(x=>x.id!==id);S.report=S.meta?runAudit(S.meta,S.qs):null;render()}
function startEdit(id){S.editing=id;render()}
function saveEdit(id){
 const q=S.qs.find(x=>x.id===id);if(!q)return;
 q.stem=document.getElementById("e_stem").value;
 q.answer=document.getElementById("e_ans").value;
 q.difficulty=document.getElementById("e_diff").value;
 q.explanation=document.getElementById("e_expl").value;
 if(q.kind!=="tita"){
  const oldOpts=(q.options||[]).map(o=>String(o).trim()),oldTags=Array.isArray(q.optionTags)?q.optionTags.slice():null;
  const opts=document.getElementById("e_opts").value.split("\n").filter(x=>x.trim()).slice(0,4);q.options=opts;q.answerIndex=opts.findIndex(o=>o.trim()===q.answer.trim());
  if(oldTags){ // v2.5: carry each tag with its option text; an edited distractor keeps the tag of the option in its slot
   q.optionTags=opts.map((o,j)=>{if(j===q.answerIndex)return null;const k=oldOpts.indexOf(o.trim());const t=k>=0?oldTags[k]:oldTags[j];return t||null});
  }
 }
 S.editing=null;S.report=runAudit(S.meta,S.qs);render();
}
// ── In-app confirm (browser confirm() is blocked in sandboxed frames) ──
function uiAsk(msg,onYes){
 const old=document.getElementById("uiask");if(old)old.remove();
 const wrap=document.createElement("div");wrap.id="uiask";
 wrap.style.cssText="position:fixed;inset:0;background:rgba(4,8,18,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
 const card=document.createElement("div");
 card.style.cssText="background:var(--panel2,#111a2e);border:1px solid var(--gold,#d4af37);border-radius:10px;padding:22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5)";
 const p=document.createElement("div");p.textContent=msg;p.style.cssText="font-size:14px;line-height:1.6;margin-bottom:18px";
 const row=document.createElement("div");row.style.cssText="display:flex;gap:10px;justify-content:flex-end";
 const no=document.createElement("button");no.textContent="Cancel";no.className="btn";
 const yes=document.createElement("button");yes.textContent="Confirm";yes.className="btn gold";
 no.onclick=()=>wrap.remove();
 yes.onclick=()=>{wrap.remove();onYes()};
 wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};
 row.appendChild(no);row.appendChild(yes);card.appendChild(p);card.appendChild(row);wrap.appendChild(card);
 document.body.appendChild(wrap);yes.focus();
}
function clearDesk(){
 if(!S.qs.length)return;
 uiAsk("Clear the desk? All "+S.qs.length+" question(s) will be removed.",()=>{
  S.meta=null;S.qs=[];S.report=null;S.editing=null;S.notice="";S.err="";S.pasteOpen=true;clearSaved();render();
 });

// ── Exports (gated: audit must be clean, delivery must derive) ──
function download(name,content,type){try{const blob=new Blob([content],{type:type||"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){}}
function openExportModal(name,content,type){S.modal={name,content,type};render()}
function closeModal(){S.modal=null;render()}
function modalDownload(){if(S.modal)download(S.modal.name,S.modal.content,S.modal.type)}
function modalCopy(){
 if(!S.modal)return;
 const t=S.modal.content;
 const done=()=>{S.notice="Export copied to clipboard.";render()};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done()})}
 else{fallbackCopy(t);done()}
}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta)}
function exportGate(){
 if(!S.meta||!S.qs.length){S.err="Nothing on the desk.";render();return null}
 const report=runAudit(S.meta,S.qs);S.report=report;
 if(report.errs.length){S.err="Export blocked \u2014 "+report.errs.length+" audit issue(s). See the intake panel.";render();return null}
 const d=deriveDelivery();
 if(!d){S.err="Could not derive delivery config.";render();return null}
 if(d.blocked){S.err="Export blocked \u2014 "+d.blocked;render();return null}
 return d;
}
function exportJSON(){
 const d=exportGate();if(!d)return;
 const name=d.examKey.toLowerCase()+"_"+slug(d.title)+"_pool.json";
 const content=JSON.stringify({meta:S.meta,derived:{exam:d.cfg.name,minutes:d.minutes,marking:d.mk,maxMarks:d.max,navNote:d.navNote},exported:new Date().toISOString(),questions:S.qs},null,2);
 download(name,content,"application/json");openExportModal(name,content,"application/json");
}
function exportHTML(){
 const d=exportGate();if(!d)return;
 let qsOut=S.qs,secPlan=null;
 if(d.sectional){
  qsOut=[];secPlan=[];
  d.sectional.order.forEach(sec=>{
   const start=qsOut.length;
   S.qs.forEach(q=>{if(q.section===sec)qsOut.push(q)});
   secPlan.push({sec:sec,minutes:(d.sectional.mins&&d.sectional.mins[sec])||d.sectional.secMinutes,start:start,end:qsOut.length-1});
  });
 }
 const meta={title:d.title,exam:d.cfg.name,qcount:qsOut.length,minutes:d.minutes,c:d.mk.c,w:d.mk.w,titaW:d.mk.titaW,titaWSec:d.mk.titaWSec||null,max:d.max,navNote:d.navNote,sectional:secPlan,rapid:!!d.rapid};
 const name=d.examKey.toLowerCase()+"_"+slug(d.title)+".html";
 const content=buildTestHTML(meta,qsOut,name);
 download(name,content,"text/html");openExportModal(name,content,"text/html");
 S.notice="Exported \u00b7 "+S.qs.length+" Q \u00b7 "+d.minutes+" min ("+d.timerSrc+") \u00b7 max "+d.max+" \u00b7 "+d.navNote;
}

<script>
/* ============================================================
   ROAD TO IIM — Studio-built portal test
   Whitelist v5 · Safety Net · 16-field payload · PATH 2 tags
   ============================================================ */
var CFG=${cfg};
var QUESTIONS=${data};
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\\d{10}$/;
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var marked=new Array(NQ).fill(false);
var deadline=0,tickCount=0; /* v2.5 wall-clock timer */
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;
var qShownQ=-1,visits=[]; /* v2.7: on-device visit log for the results analysis (never sent) */
var RAPID=!!CFG.rapid; /* v2.4 rapid mode */
var qSecondsLeft=0,qStartTs=0,qInterval=null,pendingResumeStartTs=null;
function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,visits:visits,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(Array.isArray(s.visits))visits=s.visits.filter(function(v){return v&&typeof v.q==="number"&&v.q>=0&&v.q<NQ});
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
  var mb=document.getElementById("mrkBtn");if(mb)mb.style.display="none";
 }
 renderQuestion();
 snSaveSession();
}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \\u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \\u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \\u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){
  var d=Math.round((Date.now()-qShownTs)/1000);
  questionTimes[currentQ]+=d;
  if(d>=1&&qShownQ===currentQ){ /* v2.7: one visit = from showing a question to leaving it */
   var e=elapsedNow();
   visits.push({q:currentQ,s:Math.max(0,e-d),d:d,a:answers[currentQ]});
   if(visits.length>800)visits.shift();
  }
 }
 qShownTs=Date.now();
}
function elapsedNow(){ /* seconds into the test on the test clock (sections ended early are not counted) */
 if(RAPID)return 0;
 var left=deadline?(deadline-Date.now())/1000:secondsLeft;
 var base=SEC?elapsedPrior+SEC[secIdx].minutes*60:CFG.minutes*60;
 return Math.max(0,Math.round(base-left));
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulText(el,t){el.textContent="";String(t==null?"":t).split(/(\\[\\[[\\s\\S]*?\\]\\])/).forEach(function(p){if(!p)return;var m=p.match(/^\\[\\[([\\s\\S]*)\\]\\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 /* v2.7 fix: picking an option re-renders the same question; that must not restart its stopwatch */
 if(!qShownTs||qShownQ!==currentQ){qShownTs=Date.now();qShownQ=currentQ}
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \\u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section;
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulText(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\\n\\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors,totalSecs);
}

/* ==================== POST-TEST ANALYSIS (v2.7) ====================
   Computed on this device from answers, questionTimes and the visit log.
   Nothing here is sent anywhere: the 16-field payload is unchanged.
   TRAPS: student-facing names for optionTags / titaTraps. Edit freely;
   an unknown tag falls back to a readable version of the tag itself. */
var TRAPS={
 "rc-detail-as-main":["Detail as main idea","You picked a true detail when the question asked for the main point."],
 "rc-extreme":["Overstated","It says more, or says it more strongly, than the passage supports."],
 "rc-false-link":["False link","It joins two things from the passage with a reason or link the writer never makes."],
 "rc-half-right":["Half right","Part of it matches the passage; the rest doesn't."],
 "rc-literal":["Too literal","You read a figurative line at face value."],
 "rc-out-of-scope":["Out of scope","It brings in something the passage never discusses."],
 "rc-reversal":["Reversal","It flips what the passage says: the order, the direction or the cause."],
 "rc-scope-shift":["Scope shift","Right topic, but wider or narrower than what the text actually claims."],
 "va-scope-shift":["Scope shift","Right topic, but wider or narrower than what the text actually claims."],
 "rc-tone":["Tone miss","Right direction, wrong strength or flavour of attitude."],
 "rc-true-not-answer":["True, but not the answer","The passage supports it, but it doesn't answer the question asked."],
 "rc-word-match":["Word match","It borrows the passage's words or images, not its meaning."],
 "rc-wrong-voice":["Wrong voice","A view the passage reports or argues against, not the writer's own."],
 "va-category-error":["Wrong kind of word","The word doesn't fit the kind of idea the blank needs."],
 "va-collocation-break":["Doesn't go together","The word doesn't sit naturally with the words around it."],
 "va-confusable-sibling":["Look-alike word","It looks or sounds like the right word but means something else."],
 "va-corrupted-expression":["Twisted idiom","A familiar expression with one word changed."],
 "va-half-fix":["Half fix","It corrects one error but leaves another standing."],
 "va-new-error":["New error","It fixes the original error but brings in a fresh one."],
 "va-off-topic-insertion":["Off-topic sentence","Related subject, but it breaks the paragraph's line of thought."],
 "va-polarity-flip":["Wrong direction","The word pulls the opposite way from what the sentence's clues demand."],
 "va-real-expression-wrong-meaning":["Real idiom, wrong meaning","A genuine expression, but it means something else here."],
 "va-stance-contradiction":["Contradicts the paragraph","It goes against the position the paragraph takes."],
 "vocab-context-blind":["Dictionary meaning, wrong context","A real meaning of the word, but not the one used here."],
 "vocab-shade":["Wrong shade","Close in meaning, but the wrong nuance or strength."],
 "pj-connector":["Missed connector","Your order ignores a linking word that ties two sentences together."],
 "pj-antecedent":["Missed reference","A sentence points back (this, they, such) to something not yet introduced."],
 "pj-conclusion-early":["Conclusion too early","The summing-up sentence comes before the argument is complete."]
};
var LAST_A=null;
function trapInfo(tag){
 var t=TRAPS[tag];
 if(t)return {name:t[0],what:t[1]};
 var n=String(tag).replace(/^[a-z]+-/,"").replace(/-/g," ");
 return {name:n.charAt(0).toUpperCase()+n.slice(1),what:""};
}
function diffOf(q){
 var d=String(q.difficulty||"").trim().toLowerCase();
 if(!d)return null;
 if(d.indexOf("hard")!==-1)return "hard";
 if(d.charAt(0)==="e")return "easy";
 if(d.charAt(0)==="m")return "medium";
 return null;
}
function penOf(q){return isMCQ(q)?CFG.w:titaWFor(q)}
function trapOf(q,a){
 if(a===null||a===""||a===undefined||isCorrect(q,a))return null;
 if(isMCQ(q)){
  var t=Array.isArray(q.optionTags)?q.optionTags[a]:null;
  return (typeof t==="string"&&t.trim())?t.trim():null;
 }
 if(q.titaTraps&&typeof q.titaTraps==="object"){
  var na=String(a).replace(/[\\s,]/g,"");
  for(var k in q.titaTraps){
   if(Object.prototype.hasOwnProperty.call(q.titaTraps,k)&&String(k).replace(/[\\s,]/g,"")===na)return q.titaTraps[k];
  }
 }
 return null;
}
function secOfQ(i){if(!SEC)return null;for(var s=0;s<SEC.length;s++){if(i>=SEC[s].start&&i<=SEC[s].end)return s}return null}
function paceOf(i){
 if(RAPID)return QUESTIONS[i].td||30;
 var s=secOfQ(i);
 if(s!==null)return SEC[s].minutes*60/(SEC[s].end-SEC[s].start+1);
 return CFG.minutes*60/NQ;
}
function availSecs(){
 if(RAPID)return QUESTIONS.reduce(function(a,q){return a+(q.td||30)},0);
 if(SEC)return SEC.reduce(function(a,p){return a+p.minutes*60},0);
 return CFG.minutes*60;
}
function fmtMS(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function sgn(n){return n>0?"+"+n:(n<0?"−"+(-n):"0")}
function sgnA(n){return n>0?"+"+n:(n<0?"-"+(-n):"0")}
function blank(x){return x===null||x===""||x===undefined}
function sameAns(q,x,y){if(blank(x)||blank(y))return blank(x)&&blank(y);return isMCQ(q)?x===y:titaNorm(x)===titaNorm(y)}
function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function capW(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function outWord(o){return o==="c"?"right":(o==="w"?"wrong":"blank")}

function computeAnalysis(score,totalSecs){
 var A={score:score,max:MAX_MARKS,used:totalSecs||0,avail:availSecs(),c:0,w:0,s:0,neg:0,tC:0,tW:0,tS:0,out:[],
  hasDiff:false,hasTags:false,emW:0,emWGain:0,emS:0,emSGain:0,hardWrongN:0,hardWrongT:0,
  traps:[],trapped:0,timedOut:0,slow:[],secs:[],journey:null,reach:null,acc:null,mpm:null,
  diff:{easy:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},medium:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},hard:{n:0,o:0,c:0,w:0,s:0,net:0,t:0}}};
 var trapMap={};
 QUESTIONS.forEach(function(q,i){
  var a=answers[i],sk=blank(a),ok=!sk&&isCorrect(q,a),t=questionTimes[i]||0;
  var o=sk?"s":(ok?"c":"w");
  A.out.push(o);
  if(o==="c"){A.c++;A.tC+=t}
  else if(o==="w"){A.w++;A.tW+=t;A.neg+=-penOf(q)}
  else{A.s++;A.tS+=t}
  if(RAPID&&sk&&t>=(q.td||30))A.timedOut++;
  var d=diffOf(q);
  if(d){
   A.hasDiff=true;
   var b=A.diff[d];b.n++;b.t+=t;if(t>0)b.o++;
   if(o==="c"){b.c++;b.net+=CFG.c}else if(o==="w"){b.w++;b.net+=penOf(q)}else b.s++;
   if(d!=="hard"){
    if(o==="w"){A.emW++;A.emWGain+=CFG.c-penOf(q)}
    else if(o==="s"){A.emS++;A.emSGain+=CFG.c}
   }else if(o==="w"){A.hardWrongN++;A.hardWrongT+=t}
  }
  if(Array.isArray(q.optionTags)||(q.titaTraps&&typeof q.titaTraps==="object"))A.hasTags=true;
  var tg=trapOf(q,a);
  if(tg){
   var inf=trapInfo(tg);
   if(!trapMap[inf.name]){trapMap[inf.name]={name:inf.name,what:inf.what,qs:[]};A.traps.push(trapMap[inf.name])}
   trapMap[inf.name].qs.push(i);A.trapped++;
  }
 });
 A.traps.sort(function(x,y){return y.qs.length-x.qs.length});
 A.acc=(A.c+A.w)?Math.round(100*A.c/(A.c+A.w)):null;
 if(A.hasDiff)A.reach=score+A.emWGain+A.emSGain;
 if(A.used>=60)A.mpm=score/(A.used/60);
 A.slow=questionTimes.map(function(t,i){return {i:i,t:t||0}}).filter(function(x){return x.t>0}).sort(function(x,y){return y.t-x.t}).slice(0,3);
 var order=[],bySec={};
 QUESTIONS.forEach(function(q,i){
  var k=q.section||"-";
  if(!bySec[k]){bySec[k]={sec:k,n:0,c:0,w:0,s:0,score:0,t:0};order.push(k)}
  var b=bySec[k],o=A.out[i];b.n++;b.t+=questionTimes[i]||0;
  if(o==="c"){b.c++;b.score+=CFG.c}else if(o==="w"){b.w++;b.score+=penOf(q)}else b.s++;
 });
 if(order.length>1)A.secs=order.map(function(k){return bySec[k]});
 if(!RAPID&&visits.length)A.journey=computeJourney(A);
 return A;
}

function computeJourney(A){
 var J={firstN:0,firstOk:0,backN:0,backOk:0,toRight:0,toWrong:0,swapGain:0,swapLoss:0,never:[],neverEM:0,late:[],longest:null,T:0,secStart:{}};
 var byQ={};
 visits.forEach(function(v){
  (byQ[v.q]=byQ[v.q]||[]).push(v);
  if(!J.longest||v.d>J.longest.d)J.longest=v;
  J.T=Math.max(J.T,v.s+v.d);
 });
 if(SEC){SEC.forEach(function(p,k){var m=null;for(var i=p.start;i<=p.end;i++){(byQ[i]||[]).forEach(function(v){if(m===null||v.s<m)m=v.s})}J.secStart[k]=m})}
 QUESTIONS.forEach(function(q,i){
  var vs=byQ[i],d=diffOf(q),em=(d==="easy"||d==="medium");
  if(!vs||!vs.length){J.never.push(i);if(em)J.neverEM++;return}
  var a=answers[i],fa=vs[0].a;
  if(!blank(fa)){J.firstN++;if(isCorrect(q,fa))J.firstOk++}
  else if(!blank(a)){J.backN++;if(isCorrect(q,a))J.backOk++}
  var fn=null;
  for(var k=0;k<vs.length;k++){if(!blank(vs[k].a)){fn=vs[k].a;break}}
  if(fn!==null&&!blank(a)&&!sameAns(q,fn,a)){
   var was=isCorrect(q,fn),now=isCorrect(q,a);
   if(!was&&now){J.toRight++;J.swapGain+=CFG.c-penOf(q)}
   else if(was&&!now){J.toWrong++;J.swapLoss+=CFG.c-penOf(q)}
  }
  if(em){
   var s0=0,dur=CFG.minutes*60,si=secOfQ(i);
   if(si!==null){s0=J.secStart[si]||0;dur=SEC[si].minutes*60}
   if(vs[0].s-s0>=0.75*dur)J.late.push(i);
  }
 });
 J.T=Math.max(J.T,A.used,1);
 return J;
}

 visits.forEach(function(v){

 });

 var lastX=-100;

var RETRY={done:0,right:0,n:0};
function renderRetry(){
 var box=document.getElementById("retryBox");if(!box)return;
 box.innerHTML="";
 var idx=[];
 QUESTIONS.forEach(function(q,i){if(!blank(answers[i])&&!isCorrect(q,answers[i]))idx.push(i)});
 if(!idx.length)return;
 RETRY={done:0,right:0,n:idx.length};

}
function paintTally(){

function retryCard(i){

 var w=document.createElement("div");w.className="rq";
 var hd=document.createElement("div");hd.className="rqHead";hd.textContent="Q"+(i+1)+" · "+q.section+(diffOf(q)?" · "+q.difficulty:"");w.appendChild(hd);

  var pv=document.createElement("div");pv.className="rqStem";pv.style.marginTop="6px";pv.textContent=q.passage;det.appendChild(pv);w.appendChild(det);
 }

 var ex=document.createElement("div");renderExhibit(q,ex);if(ex.childNodes.length)w.appendChild(ex);
 var res=document.createElement("div");res.className="exp";res.style.display="none";
 function finish(ok,keyText){
  RETRY.done++;if(ok)RETRY.right++;paintTally();
  res.style.display="block";
  res.innerHTML="<b>"+(ok?"Right this time.":"Still not it.")+"</b> Key: "+escH(keyText)+"<br>";
  res.appendChild(document.createTextNode(q.explanation||""));
 }
 if(isMCQ(q)){
  q.options.forEach(function(opt,k){
   var b=document.createElement("button");b.className="opt";b.textContent=letters[k]+". "+opt;
   b.onclick=function(){
    var bs=w.querySelectorAll("button.opt");for(var j=0;j<bs.length;j++)bs[j].disabled=true;
    var ok=(k===q.answerIndex);b.classList.add(ok?"rOk":"rNo");if(!ok&&bs[q.answerIndex])bs[q.answerIndex].classList.add("rOk");

   };

  var inp=document.createElement("input");inp.className="tita";inp.placeholder="Type your answer";

   finish(ok,String(q.answer));
  };
  row.appendChild(inp);row.appendChild(cb);w.appendChild(row);
 }
 w.appendChild(res);
 return w;
}

 if(A.slow.length)t.push("Slowest: "+A.slow.map(function(x){return "Q"+(x.i+1)+" "+fmtMS(x.t)+" ("+outWord(A.out[x.i])+")"}).join(", "));

 if(A.journey){

  if(J.never.length)j.push("Never opened: "+J.never.length+(J.neverEM?" ("+J.neverEM+" Easy/Medium)":""));
  if(J.late.length)j.push("Easy/Medium first opened in the last quarter of the clock: "+J.late.map(function(i){return "Q"+(i+1)}).join(", "));

  if(j.length)L.push(["How you moved",j]);
 }
 if(A.secs.length)L.push(["By section",A.secs.map(function(b){var att=b.c+b.w;return b.sec+": score "+sgnA(b.score).replace("+","")+dot+b.c+" right"+dot+b.w+" wrong"+dot+b.s+" blank"+dot+"accuracy "+(att?Math.round(100*b.c/att)+"%":"-")+dot+"time "+fmtMS(b.t)})]);

 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \\u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \\u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \\u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \\u00b7   Accuracy: "+document.getElementById("stAcc").textContent+"   \\u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 try{ /* v2.7 analysis */
  if(LAST_A){
   doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
   doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
   newPageIfNeeded(20);doc.text("Analysis",margin,y);y+=14;
   analysisLines(LAST_A).forEach(function(sec){
    newPageIfNeeded(30);
    doc.setTextColor(150,115,40);writeWrapped(sec[0],margin,pageW-2*margin,10,"bold");y+=1;
    doc.setTextColor(30,30,30);
    sec[1].forEach(function(ln){writeWrapped(ln,margin+10,pageW-2*margin-10,9.5,"normal")});
    y+=5;
   });
   doc.setTextColor(0,0,0);
  }
 }catch(e){}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  writeWrapped("Q"+(i+1)+"  \\u00b7  "+q.section+" \\u00b7 "+q.format+(diffOf(q)?" \\u00b7 "+q.difficulty:"")+" \\u00b7 time "+fmtMS(questionTimes[i])+"   ["+statusLabel+"]",margin,pageW-2*margin,10,"bold");y+=1;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(String(q.stem).replace(/\\[\\[|\\]\\]/g,'"'),margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table!=null&&q.table!==""){
   var trows=Array.isArray(q.table)?q.table:(q.table&&Array.isArray(q.table.rows)?(Array.isArray(q.table.headers)?[q.table.headers].concat(q.table.rows):q.table.rows):null);
   doc.setTextColor(40,40,40);
   if(trows){trows.forEach(function(r){writeWrapped(Array.isArray(r)?r.map(String).join("  |  "):String(r),margin+12,pageW-2*margin-12,8.5,"normal")})}
   else{
    var ttxt=String(q.table);
    if(ttxt.trim().charAt(0)==="<")ttxt=ttxt.replace(new RegExp("</tr>","gi"),"\\n").replace(new RegExp("</t[dh]>","gi"),"  |  ").replace(new RegExp("<[^>]+>","g")," ").replace(new RegExp("&amp;","g"),"&").replace(new RegExp("&nbsp;","g")," ");
    ttxt.split("\\n").forEach(function(ln){ln=ln.replace(new RegExp("[ ]+","g")," ").trim();if(ln)writeWrapped(ln,margin+12,pageW-2*margin-12,8.5,"normal")});
   }
   doc.setTextColor(0,0,0);y+=2;
  }
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure \\u2014 shown in the on-screen review]",margin+12,pageW-2*margin-12,8.5,"italic");doc.setTextColor(0,0,0)}
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="   [correct]";
    else if(idx===a){marker="   [your choice]";var ptg=trapOf(q,a);if(ptg)marker+="  trap: "+trapInfo(ptg).name}
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   var pttg=trapOf(q,a);
   writeWrapped("Your answer: "+(skippedQ?"-":a)+(pttg?"   trap: "+trapInfo(pttg).name:""),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

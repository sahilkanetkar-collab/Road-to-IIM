<script>

var CFG={"testName":"Rapid Fire Test 14","examName":"IPMAT Indore","maxMarks":140,"minutes":15,"c":4,"w":-1,"titaW":0,"titaWSec":{"VA":-1},"hasTita":false,"navNote":"rapid · per-question clock · forward only","sectional":null,"fileName":"RoadToIIM_SpeedTest14_VocabGrammar.html","snKey":"riim_session_Rapid_Fire_Test_14","bankPrefix":"Rapid_Fire_Test_14","rapid":true};
var QUESTIONS=[{"id":"Q01","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: The speaker's remark on water conservation was particularly ______, coming a day after the city announced tanker rationing.","options":["apocryphal","aphoristic","apoplectic","apropos"],"answer":"apropos","answerIndex":3,"difficulty":"medium","explanation":"Apropos = fitting, relevant to the moment; the rationing news makes the remark timely. Trap: aphoristic (expressed as a pithy saying) — tempting because 'remark' suggests a quotable line, but the sentence stresses timing, not style. Apocryphal = of doubtful authenticity; apoplectic = furious. All three share the 'ap-' shape to catch students who half-know apropos.","verified":"ok","status":"approved"},{"id":"Q02","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: The film's opening weekend drew only a ______ response; audiences were neither hostile nor enthusiastic.","options":["fervent","tepid","turgid","torrid"],"answer":"tepid","answerIndex":1,"difficulty":"easy","explanation":"Tepid = lukewarm, lacking enthusiasm — exactly 'neither hostile nor enthusiastic'. Trap: torrid (very hot, passionate) — sounds like tepid and is a temperature word, but it is the opposite degree. Fervent = intensely enthusiastic (polarity flip); turgid = swollen or pompous in style.","verified":"ok","status":"approved"},{"id":"Q03","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: Even the patient nurses dreaded the ______ old man in Ward 4, who complained about the food, the fan and the visiting hours.","options":["cantankerous","capricious","convivial","conscientious"],"answer":"cantankerous","answerIndex":0,"difficulty":"medium","explanation":"Cantankerous = bad-tempered and argumentative; a man who complains about everything fits. Trap: capricious (given to sudden changes of mood) — students link 'difficult patient' with moodiness, but nothing here says he changes; he is consistently quarrelsome. Convivial = friendly and lively (polarity flip); conscientious = careful and dutiful.","verified":"ok","status":"approved"},{"id":"Q04","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: Opposition members staged a ______, speaking for eleven hours so that the bill could not reach a vote before the session ended.","options":["walkout","adjournment","boycott","filibuster"],"answer":"filibuster","answerIndex":3,"difficulty":"hard","explanation":"Filibuster = prolonged speech used to delay or block a legislative vote — 'speaking for eleven hours' is its definition. Trap: boycott or walkout — both are opposition protest tactics, but both involve refusing to participate, the opposite of talking at length. Adjournment = suspension of a session, which the speaker (not the opposition) decides.","verified":"ok","status":"approved"},{"id":"Q05","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: Carry a light shawl; Shimla evenings turn quite ______ even in May.","options":["balmy","sultry","humid","nippy"],"answer":"nippy","answerIndex":3,"difficulty":"easy","explanation":"Nippy = noticeably cold, chilly — the reason for the shawl. Trap: balmy (pleasantly warm) — a hill-station weather word students associate with Shimla, but warmth would not need a shawl. Sultry = hot and oppressive; humid = damp. Only nippy justifies extra clothing.","verified":"ok","status":"approved"},{"id":"Q06","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: Instead of praising the intern for the late report, the manager chose to ______ her sharply for missing the deadline.","options":["upbraid","uphold","exonerate","extol"],"answer":"upbraid","answerIndex":0,"difficulty":"medium","explanation":"Upbraid = scold or reproach severely; 'sharply' and 'missing the deadline' demand criticism. Trap: exonerate (clear of blame) — an over-correction for students who read 'instead of praising' as leniency. Extol = praise enthusiastically (the thing she did not do); uphold = support or confirm a decision.","verified":"ok","status":"approved"},{"id":"Q07","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: The official's ______ comment that the flood victims 'should have moved earlier' drew outrage across the state.","options":["callow","facetious","callous","compassionate"],"answer":"callous","answerIndex":2,"difficulty":"easy","explanation":"Callous = insensitive and cruel to others' suffering. Trap: callow (inexperienced, immature) — differs by two letters, and a young official might be callow, but the outrage is about cruelty, not inexperience. Facetious = inappropriately joking; compassionate = sympathetic (polarity flip).","verified":"ok","status":"approved"},{"id":"Q08","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: He took a ______ glance at his phone under the desk, hoping the invigilator would not notice.","options":["conspicuous","ostentatious","exhibitionistic","surreptitious"],"answer":"surreptitious","answerIndex":3,"difficulty":"hard","explanation":"Surreptitious = done secretly to avoid notice ('hoping the invigilator would not notice'). Trap: conspicuous — students remember it as 'something about being seen' and miss that it means clearly visible, the opposite. Ostentatious = showy to attract attention; exhibitionistic = seeking attention. All three flip the polarity. (Note the spelling: surreptitious, not 'surreptious'.)","verified":"ok","status":"approved"},{"id":"Q09","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: The Gangetic plain's ______ soil, renewed by silt every monsoon, supports three crops a year in some districts.","options":["fetid","fecund","fallow","sterile"],"answer":"fecund","answerIndex":1,"difficulty":"medium","explanation":"Fecund = highly fertile and productive — three crops a year. Trap: fallow (land left unsown to recover) — an agriculture word, so it feels on-topic, but fallow land grows nothing that season. Fetid = foul-smelling (sound-alike); sterile = unable to produce (polarity flip).","verified":"ok","status":"approved"},{"id":"Q10","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Choose the word that best fills the blank: Known for his ______ replies, the captain answered a ten-minute question with just 'We'll see.'","options":["lachrymose","loquacious","laconic","lucid"],"answer":"laconic","answerIndex":2,"difficulty":"hard","explanation":"Laconic = using very few words; a two-word answer to a long question. Trap: lucid (clear, easy to understand) — a two-word answer may be clear, but the sentence contrasts length, not clarity. Loquacious = very talkative (polarity flip); lachrymose = tearful (look-alike 'la-' word).","verified":"ok","status":"approved"},{"id":"Q11","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'sanguine' correctly?","options":["The surgeon ordered an urgent sanguine test for him before the knee operation.","Despite two bad quarters, the investors remained sanguine about next year.","She gave a sanguine sigh, sure that all hope was now lost.","The sanguine crowd booed and jeered the referee all evening."],"answer":"Despite two bad quarters, the investors remained sanguine about next year.","answerIndex":1,"difficulty":"hard","explanation":"Sanguine = cheerfully optimistic, especially in a difficult situation — the investors stay hopeful despite losses. Trap: the surgeon sentence — students who know the Latin root sanguis (blood) use it for a blood test, but in modern English sanguine does not mean 'relating to blood tests'. The sigh sentence flips the polarity (hopelessness); the crowd sentence treats it as hostile or bloodthirsty.","verified":"ok","status":"approved"},{"id":"Q12","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'perfunctory' correctly?","options":["Her perfunctory research took three years and filled four volumes.","The guard gave our passes a perfunctory glance and waved us in.","The perfunctory guest arrived a full hour before anyone else.","He was a perfunctory candidate, meeting every single requirement."],"answer":"The guard gave our passes a perfunctory glance and waved us in.","answerIndex":1,"difficulty":"medium","explanation":"Perfunctory = done as a routine duty, with minimal effort or care — a quick, careless glance. Trap: the 'candidate' sentence — students confuse perfunctory with 'perfect'. The research sentence flips the sense (thorough work); the guest sentence confuses it with 'punctual/prompt'.","verified":"ok","status":"approved"},{"id":"Q13","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'truculent' correctly?","options":["The truculent kitten curled up and purred softly in my lap.","The truculent river overflowed its banks and flooded the low-lying fields.","The truculent customer threatened to sue over a two-rupee overcharge.","Her truculent apology moved everyone in the room to tears."],"answer":"The truculent customer threatened to sue over a two-rupee overcharge.","answerIndex":2,"difficulty":"hard","explanation":"Truculent = eager to argue or fight; aggressively defiant — a customer threatening to sue. Trap: the river sentence — students hear 'turbulent' and apply it to rough water. The kitten and apology sentences flip the polarity (gentle, contrite).","verified":"ok","status":"approved"},{"id":"Q14","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'peripatetic' correctly?","options":["A peripatetic teacher, she worked in five village schools a week.","The peripatetic patient could not leave his bed for months.","His peripatetic analysis covered every angle of the issue.","The peripatetic edge of the old city still lacks proper roads and drains."],"answer":"A peripatetic teacher, she worked in five village schools a week.","answerIndex":0,"difficulty":"hard","explanation":"Peripatetic = travelling from place to place, especially for work — a teacher moving between five schools. Trap: the 'edge of the city' sentence — students confuse it with 'peripheral'. The patient sentence is a polarity flip (bedridden); the analysis sentence treats it as 'comprehensive'.","verified":"ok","status":"approved"},{"id":"Q15","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'recalcitrant' correctly?","options":["Recalcitrant after his illness, he returned to work fully fit.","The recalcitrant employee followed each rule without question.","The recalcitrant pupil ignored every instruction the teacher gave.","The minister recalcitrant his earlier remarks on live national television."],"answer":"The recalcitrant pupil ignored every instruction the teacher gave.","answerIndex":2,"difficulty":"medium","explanation":"Recalcitrant = stubbornly uncooperative, resisting authority. Trap: the minister sentence — students confuse it with 'recant' (withdraw a statement) and use an adjective as a verb. The illness sentence confuses it with 'recuperated'; the employee sentence is a polarity flip (obedient).","verified":"ok","status":"approved"},{"id":"Q16","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'ebullient' correctly?","options":["The ebullient mourners stood in silence beside the grave.","Ebullient with fatigue after the night shift, he slept through the alarm.","The ebullient tide slowly retreated, leaving the beach bare.","The ebullient host welcomed each guest with a hug and a joke."],"answer":"The ebullient host welcomed each guest with a hug and a joke.","answerIndex":3,"difficulty":"easy","explanation":"Ebullient = cheerful and full of energy. Trap: the tide sentence — students link it to 'ebb' (a receding tide). The mourners sentence is a polarity flip (sombre silence); the fatigue sentence treats it as 'overcome' or 'exhausted'.","verified":"ok","status":"approved"},{"id":"Q17","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'obdurate' correctly?","options":["The obdurate child obeyed each and every instruction the moment it came.","Obdurate to every appeal, the landlord would not lower the rent.","His obdurate apology softened the anger of everyone present.","The obdurate cloth tore apart at the slightest little tug."],"answer":"Obdurate to every appeal, the landlord would not lower the rent.","answerIndex":1,"difficulty":"hard","explanation":"Obdurate = stubbornly refusing to change one's opinion or course of action. Trap: the child sentence — students hear 'obey' in 'ob-' and read it as 'obedient', the opposite. The apology sentence treats it as sincere or softening; the cloth sentence flips the 'hard' sense to flimsy.","verified":"ok","status":"approved"},{"id":"Q18","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"Which of the following sentences uses the word 'diffident' correctly?","options":["Diffident by nature, he seldom spoke up in team meetings.","The twins are diffident: one is tall, and the other is short.","Supremely diffident, she volunteered to lead every project.","The diffident guard flatly refused to let anyone pass through."],"answer":"Diffident by nature, he seldom spoke up in team meetings.","answerIndex":0,"difficulty":"medium","explanation":"Diffident = shy, lacking self-confidence — hence rarely speaking up. Trap: the twins sentence — the look-alike 'different'. The 'supremely' sentence confuses it with 'confident' (polarity flip); the guard sentence confuses it with 'defiant'.","verified":"ok","status":"approved"},{"id":"Q19","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the one word for: A person who flatters powerful people to gain an advantage.","options":["charlatan","sycophant","demagogue","sympathiser"],"answer":"sycophant","answerIndex":1,"difficulty":"medium","explanation":"Sycophant = a self-seeking flatterer of the powerful. Trap: demagogue (a leader who wins support by appealing to popular prejudice) — also a manipulator, but he flatters the masses from above, not the powerful from below. Charlatan = a fraud claiming false skill; sympathiser = one who supports a cause (sound-alike).","verified":"ok","status":"approved"},{"id":"Q20","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the one word for: A person who dislikes and distrusts humankind in general.","options":["misogynist","anthropologist","misanthrope","philanthropist"],"answer":"misanthrope","answerIndex":2,"difficulty":"easy","explanation":"Misanthrope = hater of humankind (mis- 'hate' + anthropos 'human'). Trap: misogynist — shares mis- but hates women specifically, not all people. Philanthropist = one who loves and helps humankind (polarity flip); anthropologist = one who studies human societies.","verified":"ok","status":"approved"},{"id":"Q21","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the one word for: To make something deliberately unclear or difficult to understand.","options":["expurgate","elucidate","obfuscate","extrapolate"],"answer":"obfuscate","answerIndex":2,"difficulty":"hard","explanation":"Obfuscate = to deliberately obscure or confuse. Trap: expurgate (to remove objectionable parts of a text) — it also alters a text, so it feels close, but it censors rather than confuses. Elucidate = to make clear (polarity flip); extrapolate = to extend known data to reach a conclusion.","verified":"ok","status":"approved"},{"id":"Q22","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the one word for: A person who can speak several languages.","options":["linguist","polyglot","polymath","polygamist"],"answer":"polyglot","answerIndex":1,"difficulty":"easy","explanation":"Polyglot = one who speaks many languages (poly 'many' + glotta 'tongue'). Trap: linguist — a scientist who studies language structure, and need not speak many. Polymath = one with wide knowledge in many fields; polygamist = one with several spouses.","verified":"ok","status":"approved"},{"id":"Q23","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the one word for: Lasting for a very short time.","options":["ethereal","perennial","intermittent","ephemeral"],"answer":"ephemeral","answerIndex":3,"difficulty":"medium","explanation":"Ephemeral = short-lived, transitory. Trap: ethereal (extremely delicate, heavenly) — the look-alike students confuse with ephemeral. Perennial = lasting a long time or recurring (polarity flip); intermittent = occurring at irregular intervals — about frequency, not duration.","verified":"ok","status":"approved"},{"id":"Q24","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the correct meaning of the idiom in the sentence: The junior analyst stole his manager's thunder by presenting the findings first.","options":["silenced his manager in a debate","frightened his manager with an outburst","pre-empted his manager's big moment","copied his manager's report word for word"],"answer":"pre-empted his manager's big moment","answerIndex":2,"difficulty":"hard","explanation":"To steal someone's thunder = to take attention or credit from someone by doing what they planned to do, first. Trap: 'copied his manager's report word for word' — students read 'steal' as plagiarism, but the idiom is about pre-empting the moment, not copying. 'Frightened ... with an outburst' literalises 'thunder'; 'silenced ... in a debate' guesses at 'overpowering'.","verified":"ok","status":"approved"},{"id":"Q25","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the option that best completes the sentence: After winning the state title, the team began to ______ and lost its next three matches through sheer complacency.","options":["rest on its laurels","rest in its laurels","rise to the occasion","win its spurs"],"answer":"rest on its laurels","answerIndex":0,"difficulty":"medium","explanation":"To rest on one's laurels = to be satisfied with past success and stop trying — 'complacency' confirms it. Trap: 'rest in its laurels' — the corrupted preposition that sounds right to a student who half-knows the idiom. 'Rise to the occasion' (perform well under pressure) and 'win its spurs' (prove oneself) are real idioms with the opposite sense.","verified":"ok","status":"approved"},{"id":"Q26","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the correct meaning of the idiom in the sentence: The families of the trapped miners were on tenterhooks all night.","options":["in a state of anxious suspense","in a state of complete confusion","in a state of quiet acceptance","in a state of physical exhaustion"],"answer":"in a state of anxious suspense","answerIndex":0,"difficulty":"easy","explanation":"On tenterhooks = anxiously waiting for news or an outcome. Trap: 'physical exhaustion' — waiting all night is tiring, but the idiom names the anxiety, not the fatigue. 'Complete confusion' and 'quiet acceptance' vary the emotion; acceptance is the polarity flip.","verified":"ok","status":"approved"},{"id":"Q27","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the option that best completes the sentence: By cutting its fares by half, the new airline has ______ to its established rivals.","options":["thrown down the glove","thrown down the gauntlet","thrown in the towel","thrown caution to the wind"],"answer":"thrown down the gauntlet","answerIndex":1,"difficulty":"medium","explanation":"To throw down the gauntlet = to issue a challenge — the fare cut challenges rivals. Trap: 'thrown in the towel' (to give up) — a real 'thrown' idiom with the opposite meaning. 'Thrown down the glove' corrupts the fixed noun; 'thrown caution to the wind' (act recklessly) is a real idiom but does not take 'to its rivals'.","verified":"ok","status":"approved"},{"id":"Q28","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the correct meaning of the idiom in the sentence: The row over the office seating chart was a storm in a teacup.","options":["a big fuss about a trivial matter","a small issue that grew into a crisis","a sudden quarrel between close friends","a hidden danger in an ordinary place"],"answer":"a big fuss about a trivial matter","answerIndex":0,"difficulty":"hard","explanation":"A storm in a teacup = great anger or excitement over something unimportant. Trap: 'a small issue that grew into a crisis' — it keeps the small-to-big image but reverses the point: the idiom says the fuss was out of proportion, not that it became serious. The other two literalise 'storm' as a quarrel or hazard.","verified":"ok","status":"approved"},{"id":"Q29","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the option that best completes the sentence: Knowing the surgery could not be postponed, she decided to ______ and book the earliest date.","options":["bite the dust","bite the hand","bite the bullet","bite off the bullet"],"answer":"bite the bullet","answerIndex":2,"difficulty":"easy","explanation":"To bite the bullet = to face an unpleasant but unavoidable situation with courage. Trap: 'bite the dust' — a real 'bite' idiom meaning to fail or die. 'Bite the hand' is a truncation of 'bite the hand that feeds you' (ingratitude); 'bite off the bullet' corrupts the fixed form.","verified":"ok","status":"approved"},{"id":"Q30","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The Latin root 'cred' means 'to believe'. Which word built on it means 'too ready to believe things; easily deceived'?","options":["credible","creditable","credulous","incredulous"],"answer":"credulous","answerIndex":2,"difficulty":"medium","explanation":"Credulous = gullible, believing too easily. Trap: credible — same root, but it describes a claim that deserves belief, not a person who believes too readily. Creditable = deserving praise; incredulous = unwilling to believe (polarity flip).","verified":"ok","status":"approved"},{"id":"Q31","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The Latin roots 'magnus' (great) and 'animus' (spirit, mind) combine in a word meaning 'generous and forgiving, especially towards a rival'. Which is it?","options":["unanimous","magnificent","pusillanimous","magnanimous"],"answer":"magnanimous","answerIndex":3,"difficulty":"hard","explanation":"Magnanimous = great-spirited; generous to a rival or someone less powerful. Trap: magnificent — shares 'magn-' (great) but means splendid in appearance and has no 'animus'. Unanimous (one mind: all in agreement) shares 'animus' only; pusillanimous (small-spirited: cowardly) is the polarity flip.","verified":"ok","status":"approved"},{"id":"Q32","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The Greek root 'chronos' means 'time'. Which word refers to something placed in the wrong historical period?","options":["anachronism","chronicle","chronometer","synchronization"],"answer":"anachronism","answerIndex":0,"difficulty":"medium","explanation":"Anachronism = ana- (against) + chronos: something out of its proper time, like a mobile phone in a Mughal-era film. Trap: synchronization — also joins a prefix to chronos, but it means occurring at the same time, the opposite idea. Chronicle = a historical record in time order; chronometer = a precise timekeeping instrument.","verified":"ok","status":"approved"},{"id":"Q33","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The Latin root 'fid' means 'faith'. Which word means 'deliberately treacherous; breaking faith'?","options":["perfidious","infidel","fiduciary","confidential"],"answer":"perfidious","answerIndex":0,"difficulty":"hard","explanation":"Perfidious = per- (through, away) + fid: faithless, treacherous. Trap: infidel — also 'without faith', but it means a person who does not hold a particular religious belief, not one who betrays trust. Fiduciary = involving trust (as in managing another's money); confidential = meant to be kept secret.","verified":"ok","status":"approved"},{"id":"Q34","section":"VA","format":"Word Choice","kind":"mcq","td":25,"stem":"Pick the odd one out.","options":["garrulous","voluble","prolix","reticent"],"answer":"reticent","answerIndex":3,"difficulty":"medium","explanation":"Reticent = reserved, unwilling to say much — the odd one out. Garrulous = excessively talkative about trivial things; voluble = speaking fluently and at length; prolix = tediously wordy. Trap: prolix — less familiar, so students suspect it, but it belongs to the 'too many words' family.","verified":"ok","status":"approved"},{"id":"Q35","section":"VA","format":"Word Choice","kind":"mcq","td":25,"stem":"Pick the odd one out.","options":["frugal","prodigal","thrifty","parsimonious"],"answer":"prodigal","answerIndex":1,"difficulty":"easy","explanation":"Prodigal = wastefully extravagant — the odd one out. Frugal and thrifty = careful with money; parsimonious = excessively unwilling to spend. Trap: parsimonious — its negative tone makes students isolate it, but it still belongs to the 'spending little' family; the split is about spending, not tone.","verified":"ok","status":"approved"}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\d{10}$/;
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var marked=new Array(NQ).fill(false);
var deadline=0,tickCount=0; /* v2.5 wall-clock timer */
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;
var RAPID=!!CFG.rapid; /* v2.4 rapid mode */
var qSecondsLeft=0,qStartTs=0,qInterval=null,pendingResumeStartTs=null;
function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
  var mb=document.getElementById("mrkBtn");if(mb)mb.style.display="none";
 }
 renderQuestion();
 snSaveSession();
}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(isMCQ(q)?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 document.getElementById("qText").textContent=q.stem;
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+q.section+" \u00b7 "+q.format+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  var stem=document.createElement("div");stem.className="rqStem";stem.textContent=q.stem;wrap.appendChild(stem);
  var exh=document.createElement("div");renderExhibit(q,exh);if(exh.childNodes.length)wrap.appendChild(exh);
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== DOWNLOAD PDF ==================== */
function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  doc.text("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+"   ["+statusLabel+"]",margin,y);y+=12;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(q.stem,margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table!=null&&q.table!==""){
   var trows=Array.isArray(q.table)?q.table:(q.table&&Array.isArray(q.table.rows)?(Array.isArray(q.table.headers)?[q.table.headers].concat(q.table.rows):q.table.rows):null);
   doc.setTextColor(40,40,40);
   if(trows){trows.forEach(function(r){writeWrapped(Array.isArray(r)?r.map(String).join("  |  "):String(r),margin+12,pageW-2*margin-12,8.5,"normal")})}
   else{
    var ttxt=String(q.table);
    if(ttxt.trim().charAt(0)==="<")ttxt=ttxt.replace(new RegExp("</tr>","gi"),"\n").replace(new RegExp("</t[dh]>","gi"),"  |  ").replace(new RegExp("<[^>]+>","g")," ").replace(new RegExp("&amp;","g"),"&").replace(new RegExp("&nbsp;","g")," ");
    ttxt.split("\n").forEach(function(ln){ln=ln.replace(new RegExp("[ ]+","g")," ").trim();if(ln)writeWrapped(ln,margin+12,pageW-2*margin-12,8.5,"normal")});
   }
   doc.setTextColor(0,0,0);y+=2;
  }
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure \u2014 shown in the on-screen review]",margin+12,pageW-2*margin-12,8.5,"italic");doc.setTextColor(0,0,0)}
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="  \u2713 correct";
    else if(idx===a)marker="  \u2717 your choice";
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   writeWrapped("Your answer: "+(skippedQ?"-":a),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

/* ==================== PAGE LOAD ==================== */
document.getElementById("lgTitle").textContent=TEST_NAME;
var lgTime=CFG.rapid?("per-question clock \u00b7 forward only \u00b7 auto-advance at 0s \u00b7 ~"+CFG.minutes+" min total"):SEC?(SEC.map(function(p){return p.sec+" "+p.minutes+"m"}).join(" \u2192 ")+" \u00b7 sectional lock \u00b7 no return"):(CFG.minutes+" minutes \u00b7 "+(CFG.navNote||"free navigation"));
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 TITA wrong "+(CFG.titaWSec?QUESTIONS.filter(function(q){return !isMCQ(q)}).map(function(q){return q.section}).filter(function(v,i,a){return a.indexOf(v)===i}).map(function(sec){return sec+" "+titaWFor({section:sec})}).join(", "):CFG.titaW):"")+" \u00b7 Max "+MAX_MARKS+"<br>"+lgTime+" \u00b7 auto-submit at 00:00";
document.getElementById("loginBtn").addEventListener("click",startTest);
snFlushQueue();
snTryResume();
</script>

<script>

var CFG={"testName":"Rapid Fire Test 12","examName":"IPMAT Indore","maxMarks":140,"minutes":26,"c":4,"w":-1,"titaW":0,"hasTita":false,"navNote":"rapid · per-question clock · forward only","sectional":null,"fileName":"ipmat_indore_Rapid_Fire_Test_12.html","snKey":"riim_session_Rapid_Fire_Test_12","bankPrefix":"Rapid_Fire_Test_12","rapid":true};
var QUESTIONS=[{"id":"Q01","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Even as regional languages fade from school timetables, the department remains a ___ of multilingual scholarship, defending courses that others abandoned long ago.","options":["vestige","bastion","pastiche","bastille"],"answer":"bastion","answerIndex":1,"difficulty":"medium","explanation":"A bastion is a stronghold that defends something — 'defending courses' demands it. Trap: 'vestige' (a surviving trace) tempts because the languages are fading, but a vestige merely remains; it defends nothing. 'Pastiche' is an imitative mixture of styles; 'bastille' is a prison/fortress used for confinement, the sound-alike over-correction for students who half-remember 'bastion'.","verified":"ok","status":"approved"},{"id":"Q02","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The Latin apricari, meaning 'to bask in the sun', survives in which English word?","options":["apricate","apricot","appraise","capricious"],"answer":"apricate","answerIndex":0,"difficulty":"hard","explanation":"To apricate is to bask in sunshine, directly from apricari. Trap: 'apricot' looks like the obvious cousin but actually descends from Latin praecox, 'early-ripening' — the classic false-etymology pick. 'Appraise' (assess value) shares only sound; 'capricious' (whimsical) comes from capriccio, not apricari.","verified":"ok","status":"approved"},{"id":"Q03","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"One word for 'the quality of seeming true or real':","options":["verifiability","vindictiveness","verboseness","verisimilitude"],"answer":"verisimilitude","answerIndex":3,"difficulty":"hard","explanation":"Verisimilitude is the appearance of truth — fiction can have it without being true. Trap: 'verifiability' (capacity to be proved true) is the near-field over-correction; the definition says seeming true, not provably true. 'Vindictiveness' is a desire for revenge; 'verboseness' is wordiness — both ride the ver- sound only.","verified":"ok","status":"approved"},{"id":"Q04","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Decades on, survivors describe a ___ dread at the sound of sirens — felt in the gut before the mind can reason.","options":["vestigial","virtual","visceral","cerebral"],"answer":"visceral","answerIndex":2,"difficulty":"easy","explanation":"Visceral means felt in the body, instinctive — 'in the gut before the mind' defines it. Trap: 'cerebral' (intellectual) is the exact polarity flip of the clue. 'Vestigial' (a leftover remnant) tempts via 'decades on' but doesn't mean gut-level; 'virtual' is a sound-alike meaning simulated or near-total.","verified":"ok","status":"approved"},{"id":"Q05","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"In which sentence is the word FERVID used correctly?","options":["Her fervid supporters camped outside the counting centre overnight.","Rest and fluids brought her fervid temperature down by evening.","The lake lay fervid and still under the winter fog.","He offered a fervid shrug and wandered off, indifferent."],"answer":"Her fervid supporters camped outside the counting centre overnight.","answerIndex":0,"difficulty":"medium","explanation":"Fervid means burning with intense, often excessive passion — camping overnight shows it. Trap: option B treats fervid as 'feverish/having fever', the commonest confusion; the medical word is febrile. Option C attaches passionate heat to a cold, still scene; option D pairs fervid with indifference, a straight contradiction.","verified":"ok","status":"approved"},{"id":"Q06","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"For weeks Meera continued to ___ between the two colleges, changing her mind after every phone call.","options":["capitulate","vacillate","gesticulate","ventilate"],"answer":"vacillate","answerIndex":1,"difficulty":"easy","explanation":"To vacillate is to waver indecisively between choices — 'changing her mind after every call' is the definition in action. All three wrong options share the -ate frame: 'capitulate' is to surrender, 'gesticulate' is to wave the hands while speaking, 'ventilate' is to air (a room or a grievance). None takes 'between two options'.","verified":"ok","status":"approved"},{"id":"Q07","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"'Late again,' the coach said with such ___ that the apology died on Arjun's lips.","options":["alacrity","amity","asperity","austerity"],"answer":"asperity","answerIndex":2,"difficulty":"hard","explanation":"Asperity is harshness or sharpness of tone — exactly what kills an apology mid-sentence. Trap: 'austerity' (sternness of lifestyle, severity in economy) is the sibling students will pick; it describes conditions, not a tone of voice. 'Alacrity' is cheerful eagerness; 'amity' is friendliness — both polarity misfits in an angry rebuke.","verified":"ok","status":"approved"},{"id":"Q08","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"In which sentence is the word BYZANTINE used correctly?","options":["The museum's byzantine gallery displays coins from Mughal Delhi.","The new metro map is refreshingly byzantine — one straight line, end to end.","Her essay was byzantine in its honesty: plain, blunt and direct.","Applicants gave up, defeated by the ministry's byzantine clearance rules."],"answer":"Applicants gave up, defeated by the ministry's byzantine clearance rules.","answerIndex":3,"difficulty":"medium","explanation":"Lower-case byzantine means excessively complicated and devious, typically of procedures — defeated applicants prove it. Trap: option A uses it as merely 'ancient/eastern' (and Mughal Delhi is the wrong empire anyway). Option B calls a single straight line byzantine — a polarity flip; option C attaches it to plainness and directness, its opposite.","verified":"ok","status":"approved"},{"id":"Q09","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"'A forceful, bitter verbal attack against a person or an idea' — the word is:","options":["diatribe","discourse","dialogue","eulogy"],"answer":"diatribe","answerIndex":0,"difficulty":"easy","explanation":"A diatribe is a bitter, sustained verbal attack. Trap: 'discourse' is the neutral near-field pick — extended speech, but with no hostility. 'Dialogue' shares the dia- prefix but means a two-way conversation; 'eulogy' is the polarity flip, a speech of praise (usually for the dead).","verified":"ok","status":"approved"},{"id":"Q10","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"From the Latin fatigare, 'to tire': which word names a person who simply cannot be worn out?","options":["imperturbable","indefatigable","insufferable","fatalistic"],"answer":"indefatigable","answerIndex":1,"difficulty":"medium","explanation":"Indefatigable = in- (not) + de- + fatigare (tire): incapable of tiring. Trap: 'imperturbable' is the over-correction — a person who cannot be rattled, calm rather than tireless, and it lacks the fatigare root. 'Insufferable' (unbearable) only shares the in-...-able shell; 'fatalistic' comes from fatum (fate), not fatigare.","verified":"ok","status":"approved"},{"id":"Q11","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"The syllabus was ordinary, but she taught it with such ___ that even the back benches leaned in.","options":["penance","parlance","panacea","panache"],"answer":"panache","answerIndex":3,"difficulty":"easy","explanation":"Panache is flamboyant style and verve — what turns an ordinary syllabus into a performance. All three wrongs are sound-siblings: 'panacea' (a cure-all) is the one students most often swap in, but you teach with style, not with a remedy; 'penance' is self-punishment for sin; 'parlance' is a manner of speaking ('in legal parlance').","verified":"ok","status":"approved"},{"id":"Q12","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"In which sentence is the word FECUND used correctly?","options":["The fecund desert stretched lifeless to the horizon.","Neighbours complained about the fecund smell from the blocked drain.","Three harvests a year come off the delta's fecund soil.","Her fecund schedule left no free evening this month."],"answer":"Three harvests a year come off the delta's fecund soil.","answerIndex":2,"difficulty":"medium","explanation":"Fecund means fertile, richly productive — soil giving three harvests a year is the textbook use. Trap: option B needs the confusable sibling 'fetid' (foul-smelling), the error this item hunts. Option A attaches fertility to a lifeless desert — contradiction; option D is the over-correction, stretching 'productive' to mean merely 'busy/packed', which fecund never means.","verified":"ok","status":"approved"},{"id":"Q13","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"Investors have learnt to discount the founder's mercurial pronouncements: a policy praised on Monday is often mocked by Friday. — As used here, 'mercurial' most nearly means:","options":["unpredictably changeable","commercially shrewd","dangerously toxic","slow and deliberate"],"answer":"unpredictably changeable","answerIndex":0,"difficulty":"medium","explanation":"Monday's praise becoming Friday's mockery is volatility — mercurial means unpredictably changeable, after the quicksilver god Mercury. Trap: 'commercially shrewd' rides the investor context and Mercury's link to commerce; the sentence shows inconsistency, not shrewdness. 'Dangerously toxic' literalises the metal mercury; 'slow and deliberate' is the polarity flip.","verified":"ok","status":"approved"},{"id":"Q14","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"Asked about the merger, the chairman was characteristically laconic: 'We'll see.' — As used here, 'laconic' most nearly means:","options":["deliberately dishonest","tediously long-winded","using very few words","lacking all energy"],"answer":"using very few words","answerIndex":2,"difficulty":"easy","explanation":"A two-word answer to a merger question is brevity itself — laconic means using very few words, after the famously terse Laconians (Spartans). Trap: 'deliberately dishonest' over-reads the evasion; the word describes length, not truthfulness. 'Tediously long-winded' is the polarity flip; 'lacking all energy' confuses laconic with lackadaisical.","verified":"ok","status":"approved"},{"id":"Q15","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"Critics called the plan to clean the entire river in a single monsoon quixotic, however noble its intent. — As used here, 'quixotic' most nearly means:","options":["swift and decisive","idealistic but impractical","carefully phased","hazardous to health"],"answer":"idealistic but impractical","answerIndex":1,"difficulty":"hard","explanation":"'Noble intent' plus an impossible timetable is Don Quixote's signature: idealistic but impractical. Trap: 'swift and decisive' lures via the sound of 'quick' and the one-monsoon deadline — but critics are dismissing the plan, not praising its speed. 'Carefully phased' is the polarity flip; 'hazardous to health' imports a river-pollution idea the word doesn't carry.","verified":"ok","status":"approved"},{"id":"Q16","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"The witness turned truculent under cross-examination, snapping at even routine questions. — As used here, 'truculent' most nearly means:","options":["scrupulously truthful","visibly tearful","meekly cooperative","aggressively defiant"],"answer":"aggressively defiant","answerIndex":3,"difficulty":"hard","explanation":"Snapping at routine questions is hostility — truculent means aggressively defiant, quick to fight. Trap: 'scrupulously truthful' rides the tru- sound and the courtroom setting; the sentence describes temper, not honesty. 'Visibly tearful' is a courtroom-scene lure with no basis in the word; 'meekly cooperative' is the polarity flip.","verified":"ok","status":"approved"},{"id":"Q17","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"The app's fame proved ephemeral: downloads collapsed within a month of launch. — As used here, 'ephemeral' most nearly means:","options":["hugely widespread","very short-lived","fiercely contested","entirely permanent"],"answer":"very short-lived","answerIndex":1,"difficulty":"easy","explanation":"Fame that collapses within a month lasted no time at all — ephemeral means very short-lived (Greek ephemeros, 'lasting a day'). Trap: 'hugely widespread' borrows the idea of fame itself rather than its duration. 'Entirely permanent' is the polarity flip; 'fiercely contested' invents a rivalry the sentence never mentions.","verified":"ok","status":"approved"},{"id":"Q18","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"Neither the director nor the actors ___ aware of the change in the shooting schedule.","options":["was","is","were","has been"],"answer":"were","answerIndex":2,"difficulty":"easy","explanation":"With neither…nor, the verb agrees with the nearer subject — 'the actors', plural, so 'were'. Trap: 'was' is the pick of students who anchor to the first subject ('the director') or treat neither…nor as automatically singular; that rule holds only when both subjects are singular. 'Is' and 'has been' add a tense mismatch on top of singular agreement.","verified":"ok","status":"approved"},{"id":"Q19","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"The number of applicants to the institute ___ doubled since the new campus opened.","options":["has","have","were","are being"],"answer":"has","answerIndex":0,"difficulty":"medium","explanation":"'The number of + plural noun' is a singular subject — the number itself doubled — so 'has'. Trap: 'have' is the near-universal error, agreement pulled to the plural 'applicants'; the plural verb belongs to 'A number of applicants have…'. 'Were' and 'are being' fail agreement and break the since-clause, which requires a perfect tense.","verified":"ok","status":"approved"},{"id":"Q20","section":"VA","format":"Pronouns","kind":"mcq","td":35,"stem":"The merit scholarship will go to ___ scores highest in the entrance test.","options":["whom","whomever","whosoever's","whoever"],"answer":"whoever","answerIndex":3,"difficulty":"hard","explanation":"The pronoun is the subject of 'scores highest', so the subjective 'whoever' is needed; the whole clause, not the pronoun, is the object of 'to'. Trap: 'whomever' is the over-correction — students see the preposition 'to' and reach for the objective form. 'Whom' fails the same way and leaves the verb without a subject; 'whosoever's' is possessive and fits nothing here.","verified":"ok","status":"approved"},{"id":"Q21","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"By the time the results are declared next month, most coaching centres ___ their new batches.","options":["will enrol","will have enrolled","would have enrolled","have enrolled"],"answer":"will have enrolled","answerIndex":1,"difficulty":"medium","explanation":"'By the time + future event' marks an action completed before a future point — future perfect, 'will have enrolled'. Trap: 'will enrol' is the common pick; simple future puts the enrolment after or alongside the results instead of before them. 'Would have enrolled' is conditional, needing an unreal if-clause; 'have enrolled' strands present perfect in a future frame.","verified":"ok","status":"approved"},{"id":"Q22","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"She ___ in Ahmedabad for ten years when the institute finally shifted online.","options":["had been living","has been living","is living","lived"],"answer":"had been living","answerIndex":0,"difficulty":"medium","explanation":"A duration ('for ten years') running up to a past event ('shifted') takes the past perfect continuous: 'had been living'. Trap: 'has been living' is the frequent slip — present perfect cannot sit before a finished past 'when' clause. 'Is living' clashes outright with past time; 'lived' loses the ongoing-up-to-that-point sense the duration demands.","verified":"ok","status":"approved"},{"id":"Q23","section":"VA","format":"Modifiers","kind":"mcq","td":35,"stem":"Choose the sentence in which the modifier is correctly placed.","options":["Walking into the exam hall, the admit card was handed to Riya by the invigilator.","Walking into the exam hall, the invigilator handed Riya her admit card.","Walking into the exam hall, Riya was handed her admit card by the invigilator.","The invigilator handed Riya her admit card walking into the exam hall."],"answer":"Walking into the exam hall, Riya was handed her admit card by the invigilator.","answerIndex":2,"difficulty":"hard","explanation":"The opening participle must describe the subject that follows it — Riya is the one walking in, so option C is right even though it is passive. Trap: option B is the over-correction; it is fluent and grammatical but makes the invigilator the walker, changing the meaning. Option A hangs the participle on 'the admit card'; option D leaves 'walking' floating at the end with no clear owner.","verified":"ok","status":"approved"},{"id":"Q24","section":"VA","format":"Parallelism","kind":"mcq","td":35,"stem":"The workshop trains students to read closely, to reason clearly, and ___.","options":["writing persuasively","to write persuasively","that they write persuasively","persuasive writing skills"],"answer":"to write persuasively","answerIndex":1,"difficulty":"easy","explanation":"The list runs on infinitives — to read, to reason — so the third item must be 'to write persuasively'. Trap: 'writing persuasively' is the standard slip, a gerund breaking the infinitive chain. 'That they write persuasively' swaps in a clause, the over-correction of students hunting formality; 'persuasive writing skills' inserts a noun phrase where the series needs a verb form.","verified":"ok","status":"approved"},{"id":"Q25","section":"VA","format":"Prepositions","kind":"mcq","td":35,"stem":"Most students in the batch prefer solving previous papers ___ attempting untimed mocks.","options":["than","over","rather","to"],"answer":"to","answerIndex":3,"difficulty":"hard","explanation":"The fixed pattern is 'prefer X to Y' — 'to' is the only standard preposition here. Trap: 'over' is the over-correction from everyday speech ('prefer coffee over tea') and is the option most students will back; formal exam English keeps 'to'. 'Than' belongs with comparatives ('better than') or 'would rather…than'; 'rather' alone is an adverb and pairs with 'would', not 'prefer'.","verified":"ok","status":"approved"},{"id":"Q26","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"IF SHE WOULD HAVE KNOWN about the strike, she would not have left home. — Choose the best replacement for the capitalised part.","options":["Had she known","If she had have known","If she would know","Had she have known"],"answer":"Had she known","answerIndex":0,"difficulty":"medium","explanation":"A third conditional takes past perfect in the if-clause: 'If she had known', or inverted, 'Had she known' — 'would have' never enters the if-clause. Trap: 'If she had have known' is the over-correction, students stuffing an extra 'have' into the past perfect. 'If she would know' repeats the original error in the present; 'Had she have known' corrupts the inversion with the same intrusive 'have'.","verified":"ok","status":"approved"},{"id":"Q27","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"Kalidasa is widely REGARDED TO BE the finest poet of classical Sanskrit. — Choose the best replacement for the capitalised part.","options":["regarded like","regarded as","regarded for being","regarded to be"],"answer":"regarded as","answerIndex":1,"difficulty":"easy","explanation":"'Regard' takes 'as' — 'regarded as the finest poet' — never an infinitive. Trap: 'regarded to be' (the original, offered verbatim) feels right by analogy with 'considered to be' and 'believed to be'; 'regard' does not join that family. 'Regarded like' swaps in a comparison preposition; 'regarded for being' builds a non-idiomatic reason phrase.","verified":"ok","status":"approved"},{"id":"Q28","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"For much of the twentieth century, millets were dismissed in India as coarse grains — the food of subsistence farmers, steadily displaced from urban plates by rice and wheat. That displacement was not accidental. The public distribution system, built around the two staple cereals, guaranteed farmers an assured market for paddy and wheat while offering millet growers no comparable support. Acreage under millets fell accordingly, even in dry districts where the crops made the most agronomic sense. The case for reversing this neglect rests on water. A kilogram of paddy can demand several times the irrigation that a kilogram of jowar or bajra requires, and most millet varieties tolerate poor soils and erratic rainfall. Nutritionists add that millets carry more fibre, iron and calcium than polished rice. Policy has begun to catch up: several states now include millets in school meal programmes, and procurement at support prices, though patchy, is expanding. The obstacles that remain are prosaic: consumers accustomed to rice find millet rotis unfamiliar, processing units are scarce, and shelf life is short unless the grain is stored well. Advocates argue that steady institutional demand, not celebrity endorsement, will decide whether the revival endures.","stem":"According to the passage, acreage under millets fell mainly because","options":["millets were agronomically unsuited to the country's dry districts","urban consumers found millet rotis unfamiliar and rejected them outright","the distribution system supported rice and wheat, not millet growers","state governments had formally abolished support-price procurement of millets"],"answer":"the distribution system supported rice and wheat, not millet growers","answerIndex":2,"difficulty":"medium","explanation":"The passage links the fall directly: the PDS 'guaranteed farmers an assured market for paddy and wheat while offering millet growers no comparable support. Acreage under millets fell accordingly.' Trap: option B lifts a real detail (unfamiliar rotis) but the passage lists it among today's obstacles, not the historical cause. Option A contradicts 'the crops made the most agronomic sense' in dry districts; option D asserts an abolition the passage never mentions.","verified":"ok","status":"approved"},{"id":"Q29","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"For much of the twentieth century, millets were dismissed in India as coarse grains — the food of subsistence farmers, steadily displaced from urban plates by rice and wheat. That displacement was not accidental. The public distribution system, built around the two staple cereals, guaranteed farmers an assured market for paddy and wheat while offering millet growers no comparable support. Acreage under millets fell accordingly, even in dry districts where the crops made the most agronomic sense. The case for reversing this neglect rests on water. A kilogram of paddy can demand several times the irrigation that a kilogram of jowar or bajra requires, and most millet varieties tolerate poor soils and erratic rainfall. Nutritionists add that millets carry more fibre, iron and calcium than polished rice. Policy has begun to catch up: several states now include millets in school meal programmes, and procurement at support prices, though patchy, is expanding. The obstacles that remain are prosaic: consumers accustomed to rice find millet rotis unfamiliar, processing units are scarce, and shelf life is short unless the grain is stored well. Advocates argue that steady institutional demand, not celebrity endorsement, will decide whether the revival endures.","stem":"Which of the following does the passage state as a nutritional advantage of millets over polished rice?","options":["a far lower requirement of irrigation water","a substantially longer shelf life after storage","a higher protein content than wheat","higher fibre, iron and calcium content"],"answer":"higher fibre, iron and calcium content","answerIndex":3,"difficulty":"easy","explanation":"Stated verbatim in spirit: 'millets carry more fibre, iron and calcium than polished rice.' Trap: option A is true in the passage but is a water advantage, not a nutritional one — the question's category filter is the whole test. Option B reverses the text, which says shelf life is short unless stored well; option C invents a protein comparison the passage never makes.","verified":"ok","status":"approved"},{"id":"Q30","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"For much of the twentieth century, millets were dismissed in India as coarse grains — the food of subsistence farmers, steadily displaced from urban plates by rice and wheat. That displacement was not accidental. The public distribution system, built around the two staple cereals, guaranteed farmers an assured market for paddy and wheat while offering millet growers no comparable support. Acreage under millets fell accordingly, even in dry districts where the crops made the most agronomic sense. The case for reversing this neglect rests on water. A kilogram of paddy can demand several times the irrigation that a kilogram of jowar or bajra requires, and most millet varieties tolerate poor soils and erratic rainfall. Nutritionists add that millets carry more fibre, iron and calcium than polished rice. Policy has begun to catch up: several states now include millets in school meal programmes, and procurement at support prices, though patchy, is expanding. The obstacles that remain are prosaic: consumers accustomed to rice find millet rotis unfamiliar, processing units are scarce, and shelf life is short unless the grain is stored well. Advocates argue that steady institutional demand, not celebrity endorsement, will decide whether the revival endures.","stem":"The author cites the irrigation needs of paddy in order to","options":["ground the claim that the millet case rests chiefly on water","argue that paddy should now be dropped from public procurement","criticise farmers who continue to cultivate paddy in dry districts","show that school meal programmes have failed to expand"],"answer":"ground the claim that the millet case rests chiefly on water","answerIndex":0,"difficulty":"hard","explanation":"The function is stated, not implied: the sentence before the comparison announces 'The case for reversing this neglect rests on water', and the paddy figure immediately supports it. Trap: option B is the over-reach — the passage describes the PDS's bias without recommending paddy's removal. Option C invents a criticism of farmers; option D contradicts the text, which says school meal inclusion is part of policy catching up.","verified":"ok","status":"approved"},{"id":"Q31","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"For much of the twentieth century, millets were dismissed in India as coarse grains — the food of subsistence farmers, steadily displaced from urban plates by rice and wheat. That displacement was not accidental. The public distribution system, built around the two staple cereals, guaranteed farmers an assured market for paddy and wheat while offering millet growers no comparable support. Acreage under millets fell accordingly, even in dry districts where the crops made the most agronomic sense. The case for reversing this neglect rests on water. A kilogram of paddy can demand several times the irrigation that a kilogram of jowar or bajra requires, and most millet varieties tolerate poor soils and erratic rainfall. Nutritionists add that millets carry more fibre, iron and calcium than polished rice. Policy has begun to catch up: several states now include millets in school meal programmes, and procurement at support prices, though patchy, is expanding. The obstacles that remain are prosaic: consumers accustomed to rice find millet rotis unfamiliar, processing units are scarce, and shelf life is short unless the grain is stored well. Advocates argue that steady institutional demand, not celebrity endorsement, will decide whether the revival endures.","stem":"As used in the passage, 'prosaic' most nearly means","options":["poetic and elaborate","ordinary and unglamorous","impossible to overcome","specific to agriculture"],"answer":"ordinary and unglamorous","answerIndex":1,"difficulty":"medium","explanation":"The obstacles listed — unfamiliar taste, scarce processing, short shelf life — are humdrum practical problems, so 'prosaic' means ordinary and unglamorous. Trap: 'impossible to overcome' overstates; the passage treats them as mundane, and the final sentence expects the revival may still endure. 'Poetic and elaborate' is the polarity flip (prose vs poetry inverted); 'specific to agriculture' guesses from the topic, not the word.","verified":"ok","status":"approved"},{"id":"Q32","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"International shipping carries close to ninety per cent of world trade by volume, and it runs almost entirely on heavy fuel oil, one of the dirtiest fuels in commercial use. The industry's regulator, the International Maritime Organization, has set a target of net-zero emissions by around 2050, and the search for a replacement fuel has narrowed to a handful of candidates. Green ammonia has emerged as the front-runner for long-haul routes. Made by combining nitrogen drawn from the air with hydrogen split from water using renewable electricity, the fuel contains no carbon at all, so burning it releases no carbon dioxide. Yet ammonia brings problems of its own. It is toxic, and a leak in port could endanger crews and dockworkers. It is also less energy-dense than oil, which forces ships to surrender cargo space to larger fuel tanks. Engine makers have responded with dual-fuel designs that can fall back on conventional fuel, and classification societies are drafting safety codes for handling the chemical at sea. Ports in Singapore, Rotterdam and Gujarat have announced bunkering pilots. The transition will be costly, but for an industry whose emissions rival Germany's, the cost of doing nothing is larger.","stem":"The passage states that burning green ammonia releases no carbon dioxide because","options":["the fuel is produced using renewable electricity","dual-fuel engines burn the chemical more cleanly","the IMO's net-zero target legally mandates it","the fuel contains no carbon at all"],"answer":"the fuel contains no carbon at all","answerIndex":3,"difficulty":"medium","explanation":"The causal link is explicit: 'the fuel contains no carbon at all, so burning it releases no carbon dioxide.' Trap: option A is the strong lure — renewable electricity appears in the same sentence, but it explains how the fuel is made green, not why combustion is carbon-free. Option B misuses dual-fuel engines, which exist as a fallback; option C turns the IMO's target into a cause, which the passage never does.","verified":"ok","status":"approved"},{"id":"Q33","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"International shipping carries close to ninety per cent of world trade by volume, and it runs almost entirely on heavy fuel oil, one of the dirtiest fuels in commercial use. The industry's regulator, the International Maritime Organization, has set a target of net-zero emissions by around 2050, and the search for a replacement fuel has narrowed to a handful of candidates. Green ammonia has emerged as the front-runner for long-haul routes. Made by combining nitrogen drawn from the air with hydrogen split from water using renewable electricity, the fuel contains no carbon at all, so burning it releases no carbon dioxide. Yet ammonia brings problems of its own. It is toxic, and a leak in port could endanger crews and dockworkers. It is also less energy-dense than oil, which forces ships to surrender cargo space to larger fuel tanks. Engine makers have responded with dual-fuel designs that can fall back on conventional fuel, and classification societies are drafting safety codes for handling the chemical at sea. Ports in Singapore, Rotterdam and Gujarat have announced bunkering pilots. The transition will be costly, but for an industry whose emissions rival Germany's, the cost of doing nothing is larger.","stem":"According to the passage, ammonia's lower energy density forces ships to","options":["restrict themselves to shorter coastal routes only","carry additional crew for safety duties on board","surrender cargo space to larger fuel tanks","burn conventional fuel whenever they are in port"],"answer":"surrender cargo space to larger fuel tanks","answerIndex":2,"difficulty":"easy","explanation":"Directly stated: 'less energy-dense than oil, which forces ships to surrender cargo space to larger fuel tanks.' Trap: option D borrows the dual-fuel detail — the passage offers conventional fuel as a fallback capability, never a port rule, and ties it to engine design, not density. Option A sounds logical but is unstated (ammonia is in fact the long-haul front-runner); option B mixes in the toxicity concern, which the passage links to leaks, not crewing.","verified":"ok","status":"approved"},{"id":"Q34","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"International shipping carries close to ninety per cent of world trade by volume, and it runs almost entirely on heavy fuel oil, one of the dirtiest fuels in commercial use. The industry's regulator, the International Maritime Organization, has set a target of net-zero emissions by around 2050, and the search for a replacement fuel has narrowed to a handful of candidates. Green ammonia has emerged as the front-runner for long-haul routes. Made by combining nitrogen drawn from the air with hydrogen split from water using renewable electricity, the fuel contains no carbon at all, so burning it releases no carbon dioxide. Yet ammonia brings problems of its own. It is toxic, and a leak in port could endanger crews and dockworkers. It is also less energy-dense than oil, which forces ships to surrender cargo space to larger fuel tanks. Engine makers have responded with dual-fuel designs that can fall back on conventional fuel, and classification societies are drafting safety codes for handling the chemical at sea. Ports in Singapore, Rotterdam and Gujarat have announced bunkering pilots. The transition will be costly, but for an industry whose emissions rival Germany's, the cost of doing nothing is larger.","stem":"The author mentions dual-fuel engine designs in order to","options":["show how engine makers are answering ammonia's drawbacks","prove that ammonia can never fully replace conventional oil","illustrate how dangerous ammonia is to dockworkers in port","confirm that safety codes for the chemical are already final"],"answer":"show how engine makers are answering ammonia's drawbacks","answerIndex":0,"difficulty":"hard","explanation":"The function is written into the sentence: after listing ammonia's problems, the passage says 'Engine makers have responded with dual-fuel designs' — a stated response to the drawbacks. Trap: option B over-reads the fallback capability as a verdict that replacement is impossible; the passage never says so. Option C attaches the engines to toxicity, which belongs to the leak sentence; option D contradicts 'are drafting safety codes', still in progress.","verified":"ok","status":"approved"},{"id":"Q35","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"International shipping carries close to ninety per cent of world trade by volume, and it runs almost entirely on heavy fuel oil, one of the dirtiest fuels in commercial use. The industry's regulator, the International Maritime Organization, has set a target of net-zero emissions by around 2050, and the search for a replacement fuel has narrowed to a handful of candidates. Green ammonia has emerged as the front-runner for long-haul routes. Made by combining nitrogen drawn from the air with hydrogen split from water using renewable electricity, the fuel contains no carbon at all, so burning it releases no carbon dioxide. Yet ammonia brings problems of its own. It is toxic, and a leak in port could endanger crews and dockworkers. It is also less energy-dense than oil, which forces ships to surrender cargo space to larger fuel tanks. Engine makers have responded with dual-fuel designs that can fall back on conventional fuel, and classification societies are drafting safety codes for handling the chemical at sea. Ports in Singapore, Rotterdam and Gujarat have announced bunkering pilots. The transition will be costly, but for an industry whose emissions rival Germany's, the cost of doing nothing is larger.","stem":"As used in the passage, 'front-runner' most nearly means","options":["the fastest vessel in a shipping fleet","the first fuel ever tested at sea","the most controversial option available","the leading candidate"],"answer":"the leading candidate","answerIndex":3,"difficulty":"easy","explanation":"The previous sentence sets the frame — 'the search for a replacement fuel has narrowed to a handful of candidates' — so the front-runner is the leading candidate among them. Trap: 'the fastest vessel' literalises the racing metaphor in a shipping context, the pick this item hunts. 'The first fuel ever tested' confuses leading with earliest; 'the most controversial option' imports a dispute the passage doesn't attach to ammonia's status.","verified":"ok","status":"approved"}];

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

function snSaveSession(){

 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

 if(!allowed){showLoginError(BLOCK_MSG);return}

function enterTest(){
 started=true;

 if(SEC)showSecBanner();
 if(!RAPID){

function showSecBanner(){

}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(isMCQ(q)?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 document.getElementById("qText").textContent=q.stem;
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:CFG.titaW);
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

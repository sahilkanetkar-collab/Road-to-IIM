fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.", "stem": "The writer observed that when one of the ants fell under its load, the others...", "options": ["stopped to tend the fallen carrier before going on their way.", "summoned additional workers from the nest to share the burden.", "took up the load themselves and continued along the road.", "worked on without overseer or wages of any kind."], "answer": "took up the load themselves and continued along the road.", "answerIndex": 2, "tags": ["reversal/actor swap", "plausible-but-absent", "KEY", "true-but-not-the-answer"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (c)\nThe first paragraph closes with the incident the stem points to: a carrier stumbles, and the two ants behind her respond not with sympathy but by carrying the work forward.\nCorrect (c): The passage says the two that came behind \"did not stop to pity her\" and instead lifted the burden and moved on — the option paraphrases this as taking up the load and continuing.\nIncorrect (a): Reversal — the passage states the opposite: the ants did not stop to attend to the fallen carrier.\nIncorrect (b): Not mentioned anywhere in the passage — reinforcements from the nest are a reasonable guess about ants, but the writer never describes them.\nIncorrect (d): True, but it answers a different question — the absence of overseers and wages is described earlier in the paragraph, not as what happened when the ant fell.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: RC checklist pass; detail anchored to Para 1 incident"}, {"id": "IPMAT_VARC_053", "section": "VA", "format": "RC set 6Q", "kind": "mcq", "passage": "On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but selessly without overseers, wages, or complaint.", "work possesses its true dignity when it is carried on unwatched as readily as watched.", "men should give up wages and applause altogether and labour as the ants do.", "idleness, rightly used, is a necessary part of a working life."], "answer": "work possesses its true dignity when it is carried on unwatched as readily as watched.", "answerIndex": 1, "tags": ["specific-for-general", "KEY", "overstatement/absolute", "true-but-not-the-answer"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (b)\nThe passage moves from an observation of ants to a general claim about labour, stated in the final paragraph as the lesson the hill taught.\nCorrect (b): \"The dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut\" — the option paraphrases this positive thesis at mid-altitude: neither the narrow ant-fact nor a mere negation.\nIncorrect (a): The passage's example offered as its point — the ants are the illustration, not the thesis.\nIncorrect (c): An unwarranted strengthening the writer expressly rejects: \"I would not have men become ants.\"\nIncorrect (d): True — \"a man who cannot be idle cannot properly be said to work\" — but it is a supporting aside, not the point the whole passage is built to make.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: RC checklist pass; main-idea key at mid-altitude"}, {"id": "IPMAT_VARC_056", "section": "VA", "format": "RC set 6Q", "kind": "mcq", "passage": "On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No  a rebuke.", "answerIndex": 3, "tags": ["literal-for-figurative", "plausible-but-absent", "reversal/actor swap", "KEY"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (d)\nThe writer quotes the proverb only to reinterpret it: where tradition hears a reprimand for laziness, he hears something gentler and more instructive.\nCorrect (d): \"Commonly read as a scolding; I had rather read it as an invitation — to witness... labour with no vanity in it\" maps directly: 'invitation to witness' becomes 'a call to witness', 'scolding' becomes 'rebuke'. The hedged 'may be taken' fits the writer's tentative 'I had rather read it'.\nIncorrect (a): Reads the proverb literally — the writer is not recommending entomology to the lazy; the ant is a figure for a kind of labour.\nIncorrect (b): A reasonable claim about proverbs in the world, but the passage says nothing about their force with modern readers.\nIncorrect (c): Swaps the target of the scolding — the writer redirects the proverb's purpose, not its object; the ant is never blamed.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: RC checklist pass; allusion item carries the literal-for-figurative distractor"}, {"id": "IPMAT_VARC_057", "section": "VA", "format": "RC set 6Q", "kind": "mcq", "passage": "On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.", "stem": "The antonym for \"unstinted\" (Para 2) is", "options": ["Grudging", "Lavish", "Unremitting", "Thankless"], "answer": "Grudging", "answerIndex": 0, "tags": ["KEY", "near-synonym drift", "near-synonym drift", "near-synonym drift"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (a)\nIn Para 2 the ant \"gives an unstinted service to a commonwealth whose completion she will never see\" — unstinted here means given freely and without holding anything back.\nCorrect (a): Grudging — given reluctantly, with something withheld — is the direct opposite of service given without stint.\nIncorrect (b): Lavish is a synonym of the target, not its antonym — the classic trap in antonym items.\nIncorrect (c): Unremitting belongs to the same paragraph's field of ceaseless effort and describes the labour's duration, not its generosity; it is neither synonym nor antonym of unstinted.\nIncorrect (d): Thankless is an everyday-sense misreading of the context — the ant's service is indeed unrewarded, but thankless describes how work is received, not whether it is given freely.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: RC checklist pass; antonym item with synonym-of-target distractor per spec"}, {"id": "IPMAT_VARC_058", "section": "VA", "format": "RC set 6Q (transcript)", "kind": "mcq", "passage": "Host: My guest today is the economist Dr. Meera Krishnan, who believes we have been sorting companies into the wrong boxes. Dr. Krishnan, you say sectors are the wrong way to classify firms. What should replace them?\n\nDr. Krishnan: Tempo should. I divide firms into glaciers and monsoons. A glacier firm compounds its advantage slowly — a distribution network, a regulatory licence, a brand trusted across generations. Nothing about it is dramatic, but almost nothing about it is reversible either. A monsoon firm lives in bursts. It grows torrentially when conditions favour it and recedes just as quickly when they turn. Its advantage must be earned afresh in every cycle.\n\nHost: So a glacier is simply a big, old company?\n\nDr. Krishnan: That is the misreading I meet most often. Size and age are outcomes of being a glacier, not the test for it. A ten-year-old insurance firm is a glacier if its moat deepens with every policy it writes. A century-old fashion house is still a monsoon, because each season it must win its customers all over again.\n\nHost: How do you tell the two apart in actual data?\n\nDr. Krishnan: I use three yardsticks. First, revenue persistence: how much of this year's revenue is already locked in, by contract or by habit, for next year. Second, the decay rate of the core asset: a licence or a network loses value slowly, while a trend or a hit product loses value fast. Third, the cost of a one-year pause: a glacier that shuts f empos the firm actually operates in.", "answerIndex": 1, "tags": ["specific-for-general swap", "KEY", "reversal / actor swap", "plausible-in-world, absent-in-text"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (b)\nThe economist closes by turning the classification into a managerial rule: 'a manager's first duty is to know which weather the firm works in', with a warning for each side — glacier managers must not chase quarterly velocity, monsoon managers must not draft thirty-year plans.\nCorrect (b): 'know which weather the firm works in' is paraphrased as recognising which tempo — glacier or monsoon — the firm belongs to; the metaphor maps to the two categories.\nIncorrect (a): specific-for-general — a moat deepening with every policy describes the glacier insurer example, not a duty prescribed to all managers.\nIncorrect (c): reversal — thirty-year planning is precisely the mistake she warns monsoon managers against, offered here as if it were the duty.\nIncorrect (d): plausible in the world, absent in the text — a reasonable management maxim, but she prescribes matching the tempo, never balancing the two.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: RC checklist pass; speaker-attribution completion; all four options grammatically continue the stem."}, {"id": "IPMAT_VARC_064", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "The rewiring would be costly and disruptive, but Suresh knew he had to ___ and get it done before the monsoon.", "options": ["bite the dust", "bite the bullet", "bite the pellet", "bite the barrel"], "answer": "bite the bullet", "answerIndex": 1, "tags": ["real expression, wrong meaning", "KEY", "corrupted fixed expression", "corrupted fixed expression"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (b)\nCorrect (b): 'Bite the bullet' means to force yourself to face something unpleasant or expensive that cannot be put off — exactly Suresh's situation with the rewiring.\nIncorrect (a): a real idiom, but 'bite the dust' means to fail, die or break down; Suresh is not failing.\nIncorrect (c): 'bite the pellet' is a corrupted form — the fixed expression takes 'bullet', not a near-synonym.\nIncorrect (d): 'bite the barrel' is likewise a corrupted form; no such expression exists in standard English.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: idiom standardness checked; no second genuine expression completes the sentence."}, {"id": "IPMAT_VARC_065", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "With the client presentation advanced by a week, Ritu and her team had to ___ to finish the deck in time.", "options": ["burn the midnight lamp", "burn their bridges", "burn the evening oil", "burn the midnight oil"], "answer": "burn the midnight oil", "answerIndex": 3, "tags": ["corrupted fixed expression", "real expression, wrong meaning", "corrupted fixed expression", "KEY"], "fig": null, "table": null, "difficulty": "Easy", "explanation": "Answer: (d)\nCorrect (d): 'Burn the midnight oil' means to work late into the night — what a team must do when a deadline is suddenly advanced.\nIncorrect (a): 'burn the midnight lamp' is a corrupted form; the idiom takes 'oil', a relic of oil lamps, not 'lamp'.\nIncorrect (b): a real idiom, but 'burn one's bridges' means to destroy any possibility of going back on a decision — irrelevant here.\nIncorrect (c): 'burn the evening oil' is a corrupted form with one word swapped; no such expression exists.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: idiom standardness checked; no second genuine expression completes the sentence."}, {"id": "IPMAT_VARC_066", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "The product launch was meant to stay confidential, but Prakash ___ when he thanked the design team on a public forum.", "options": ["let the cat out of the bag", "let the rat out of the bag", "let sleeping dogs lie", "let the cat off the bag"], "answer": "let the cat out of the bag", "answerIndex": 0, "tags": ["KEY", "corrupted fixed expression", "real expression, wrong meaning", "corrupted fixed expression"], "fig": null, "table": null, "difficulty": "Easy", "explanation": "Answer: (a)\nCorrect (a): 'Let the cat out of the bag' means to reveal a secret carelessly or by mistake — which is what Prakash's public thank-you note did.\nIncorrect (b): 'let the rat out of the bag' is a corrupted form with the animal swapped; the fixed expression takes 'cat'.\nIncorrect (c): a real idiom, but 'let sleeping dogs lie' means to avoid stirring up an old problem — the opposite of revealing something new.\nIncorrect (d): 'let the cat off the bag' corrupts the preposition; the idiom is 'out of the bag'.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: idiom standardness checked; no second genuine expression completes the sentence."}, {"id": "IPMAT_VARC_067", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "Rohan's constant interruptions annoy everyone, but the team has decided to ___ for the sake of the project.", "options": ["put him aside", "put him down", "put in with him", "put up with him"], "answer": "put up with him", "answerIndex": 3, "tags": ["corrupted fixed expression", "real expression, wrong meaning", "corrupted fixed expression", "KEY"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (d)\nCorrect (d): 'Put up with' means to tolerate someone or something unpleasant without complaining — the team tolerates Rohan for the project's sake.\nIncorrect (a): 'put him aside' corrupts the phrasal verb; things, not people, are 'put aside', and it means to save or postpone, not to tolerate.\nIncorrect (b): a real phrasal verb, but 'put someone down' means to criticise or humiliate them — the opposite of quiet tolerance.\nIncorrect (c): 'put in with him' is a corrupted form; 'put in with' is not a standard expression for tolerating a person.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: phrasal-verb forms checked against standard usage; only the key fits the tolerance sense."}, {"id": "IPMAT_VARC_068", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "During cross-examination, the lawyer's patient questioning finally managed to ___ the full story from the hesitant witness.", "options": ["solicit", "explicit", "elicit", "illicit"], "answer": "elicit", "answerIndex": 2, "tags": ["confusable/homophone sibling", "confusable/homophone sibling", "KEY", "confusable/homophone sibling"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (c)\nCorrect (c): 'Elicit' means to draw out a response or information from someone, especially with effort — the standard collocation with questioning ('elicit an answer/the truth').\nIncorrect (a): 'solicit' is a real verb but means to ask for or request (business, votes, donations); one solicits opinions, one elicits the truth through questioning.\nIncorrect (b): 'explicit' is an adjective meaning clearly stated; it is a sound-alike sibling, not a verb.\nIncorrect (d): 'illicit' is an adjective meaning illegal or forbidden — the classic confusable of 'elicit', and cannot govern an object here.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: confusable set checked; only the key is grammatical and collocationally correct in the blank."}, {"id": "IPMAT_VARC_069", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "Freshly recruited trainees are expected to ___ quickly to the bank's demanding work culture.", "options": ["adopt", "adapt", "apt", "adept"], "answer": "adapt", "answerIndex": 1, "tags": ["confusable/homophone sibling", "KEY", "confusable/homophone sibling", "category/part-of-speech error"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (b)\nCorrect (b): 'Adapt' means to adjust oneself to new conditions and takes the preposition 'to' — 'adapt to a culture' is the fixed pattern.\nIncorrect (a): 'adopt' means to take up a practice, method or child as one's own; it takes a direct object ('adopt a policy'), never 'adopt to'.\nIncorrect (c): 'apt' is an adjective meaning suitable or quick to learn; it cannot serve as the verb the blank needs.\nIncorrect (d): 'adept' is an adjective meaning skilled, used with 'at' ('adept at coding'); it is a sound-alike sibling, not a verb.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: confusable set checked; only the key is a verb taking 'to' with the required sense."}, {"id": "IPMAT_VARC_070", "section": "VA", "format": "Complete the following sentences by choosing the most appropriate word/phrase from the options given below.", "kind": "mcq", "passage": null, "stem": "Even a decade after their partnership was dissolved, Keshav continued to ___ a grudge against his former associate.", "options": ["harness", "herald", "harbour", "hoard"], "answer": "harbour", "answerIndex": 2, "tags": ["collocation break", "collocation break", "KEY", "collocation break"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (c)\nCorrect (c): 'Harbour' means to keep a thought or feeling, especially a negative one, in one's mind over time; 'harbour a grudge' is the standard collocation (as in 'harbour doubts, harbour resentment').\nIncorrect (a): 'harness' means to control and use a force or resource ('harness solar energy'); it does not co-occur with 'grudge'.\nIncorrect (b): 'herald' means to announce or signal the approach of something; 'herald a grudge' is not standard usage.\nIncorrect (d): 'hoard' means to accumulate and store objects or money; feelings are harboured or nursed, not hoarded.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: collocation checked; 'nurse a grudge' deliberately excluded from options to avoid a second key."}, {"id": "IPMAT_VARC_071", "section": "VA", "format": "In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.", "kind": "mcq", "passage": null, "stem": "The Harappan seals discovered at Dholavira [[is regarded to be]] among the finest examples of Bronze Age craftsmanship.", "options": ["are regarded as", "is regarded as", "are regarded to be", "are regarded like"], "answer": "are regarded as", "answerIndex": 0, "tags": ["KEY", "half-fix", "half-fix", "new error"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (a)\nCorrect (a): The subject is the plural 'seals', so the verb must be 'are'; and the fixed pattern is 'regarded as', never 'regarded to be'. Option (a) repairs both errors.\nIncorrect (b): half-fix — corrects the idiom to 'regarded as' but keeps the singular 'is' with the plural subject 'seals'.\nIncorrect (c): half-fix — corrects the agreement but keeps the non-standard 'regarded to be'.\nIncorrect (d): new error — fixes the agreement but introduces 'regarded like', which is not idiomatic; 'regard' takes 'as'.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: key is the only zero-error replacement; each distractor re-read to confirm exactly one surviving or introduced fault."}, {"id": "IPMAT_VARC_072", "section": "VA", "format": "In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.", "kind": "mcq", "passage": null, "stem": "[[If she would win the state election, than]] her party will form the government with two smaller allies.", "options": ["If she would win the state election, then", "Should she win the state election, than", "Should she win the state election,", "Should she wins the state election,"], "answer": "Should she win the state election,", "answerIndex": 2, "tags": ["half-fix", "half-fix", "KEY", "new error"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (c)\nThe span has two errors — 'would win' cannot sit in the if-clause of a future condition, and 'than' (comparison) is confused with 'then'. Conditional inversion with the bare verb, 'Should she win …,', fixes both and needs no connector: 'Should she win the state election, her party will form the government.'\nIncorrect (a): half-fix — corrects 'than' to 'then' but keeps the faulty 'would win' inside the if-clause.\nIncorrect (b): half-fix — adopts the correct inversion but keeps the comparative 'than'.\nIncorrect (d): new error — the inverted 'Should' must take the bare form 'win'; 'wins' breaks the construction.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: key is the only zero-error replacement; near-verbatim original retained as option (a)."}, {"id": "IPMAT_VARC_073", "section": "VA", "format": "In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.", "kind": "mcq", "passage": null, "stem": "Yesterday, before leaving for Pune, Meera [[has the electrician repairing]] the faulty inverter.", "options": ["had the electrician repairing", "had the electrician who repaired", "had the electrician to repair", "had the electrician repair"], "answer": "had the electrician repair", "answerIndex": 3, "tags": ["half-fix", "meaning change", "new error", "KEY"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (d)\nCorrect (d): Two repairs are needed. 'Yesterday' demands the past tense 'had', and the causative 'have' (getting someone to do something) takes the bare infinitive: 'had the electrician repair the inverter.'\nIncorrect (a): half-fix — corrects the tense to 'had' but keeps the '-ing' form, which the causative does not take here.\nIncorrect (b): meaning change — grammatical, but 'the electrician who repaired' turns the causative into a relative clause and leaves the sentence without a main action for Meera.\nIncorrect (c): new error — fixes the tense but introduces 'to repair'; causative 'have' never takes the to-infinitive.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: key is the only zero-error replacement; causative bare-infinitive rule checked."}, {"id": "IPMAT_VARC_074", "section": "VA", "format": "In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.", "kind": "mcq", "passage": null, "stem": "This year the engineering college admitted [[less students then]] it did in the previous academic session.", "options": ["fewer students than", "less students than", "lesser students than", "fewer students then"], "answer": "fewer students than", "answerIndex": 0, "tags": ["KEY", "half-fix", "new error", "half-fix"], "fig": null, "table": null, "difficulty": "Easy", "explanation": "Answer: (a)\nCorrect (a): The span has two errors. 'Students' are countable, so the comparative must be 'fewer', not 'less'; and the comparison word is 'than', not the time word 'then'. Option (a) fixes both.\nIncorrect (b): half-fix — corrects 'then' to 'than' but keeps 'less' with a countable noun.\nIncorrect (c): new error — corrects 'then' but introduces 'lesser', which means lower in importance or degree ('the lesser evil') and is not used for counting.\nIncorrect (d): half-fix — corrects 'less' to 'fewer' but keeps the wrong word 'then'.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: key is the only zero-error replacement; near-verbatim original retained as option (b)."}, {"id": "IPMAT_VARC_075", "section": "VA", "format": "In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.", "kind": "mcq", "passage": null, "stem": "The dean insisted that Ravi [[apologizes with the librarian]] for the damaged manuscripts.", "options": ["apologizes to the librarian", "apologize to the librarian", "apologized to the librarian", "apologize with the librarian"], "answer": "apologize to the librarian", "answerIndex": 1, "tags": ["half-fix", "KEY", "new error", "half-fix"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (b)\nCorrect (b): After 'insisted that', the verb takes the subjunctive — the bare form 'apologize', with no -s; and one apologizes 'to' a person, not 'with'. Option (b) repairs both faults.\nIncorrect (a): half-fix — corrects the preposition to 'to' but keeps the indicative 'apologizes', which the subjunctive after 'insisted that' does not allow.\nIncorrect (c): new error — corrects the preposition but shifts to the past 'apologized'; the demand clause needs the bare subjunctive, not a tensed verb.\nIncorrect (d): half-fix — adopts the correct subjunctive form but keeps the wrong preposition 'with'.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: key is the only zero-error replacement; subjunctive-after-insist pattern matches the recurring Indore list."}, {"id": "IPMAT_VARC_076", "section": "VA", "format": "Paragraph completion (blank middle)", "kind": "mcq", "passage": "In 2023 the United Nations declared the International Year of Millets, a campaign India had lobbied for and quickly branded 'Shree Anna'. Millets need far less water than rice or wheat and tolerate poor soils, which makes them attractive as the monsoon grows erratic. ___ Procurement remains skewed towards rice and wheat, whose assured prices give farmers little reason to switch. Until that incentive structure changes, the grain's revival will remain largely ceremonial.", "stem": "From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.", "options": ["Meanwhile, India's dairy cooperatives have shown how farmer collectives can transform an entire sector.", "Millets are also rich in fibre and micronutrients, which has made them fashionable among urban consumers.", "Yet enthusiasm at summits has not translated into the mandis, where policy still works against the crop.", "In most states, government procurement has in fact shifted decisively towards millets."], "answer": "Yet enthusiasm at summits has not translated into the mandis, where policy still works against the crop.", "answerIndex": 2, "tags": ["off-topic insertion", "wrong focus", "KEY", "stance contradiction"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (c)\nThe paragraph moves from international celebration of millets to the ground reality that farmers have no price incentive to grow them. The blank must carry that turn.\nCorrect (c): 'Yet' supplies the contrast the argument needs, and 'policy still works against the crop' is exactly what the next sentence elaborates — procurement skewed towards rice and wheat. The closing sentence's 'that incentive structure' also refers back to it.\nIncorrect (a): off-topic — dairy cooperatives are never raised in the paragraph.\nIncorrect (b): right topic, wrong focus — nutrition is true of millets but the paragraph's pivot is policy and prices, not consumer appeal.\nIncorrect (d): contradicts the stance — the very next sentence says procurement remains skewed away from millets.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: connector-referent fit checked against both neighbours; single-fault audit per distractor"}, {"id": "IPMAT_VARC_077", "section": "VA", "format": "Paragraph completion (blank opening)", "kind": "mcq", "passage": "___ Nearly all intercontinental internet traffic travels not through satellites but through roughly 600 fibre-optic cables lying on the ocean floor. A single ship dragging its anchor can sever one, as happened repeatedly in the Baltic Sea and the Red Sea last year. Repairs require specialised vessels, of which fewer than sixty exist worldwide, and can take weeks. Governments that treat data as critical infrastructure have begun to ask why its physical backbone remains so exposed.", "stem": "From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.", "options": ["The internet feels ethereal, but it depends on hardware that is surprisingly easy to break.", "Decades of redundancy planning have made the world's data networks virtually impossible to disrupt.", "Cybersecurity breaches now cost the global economy trillions of dollars every year.", "Laying a new undersea cable is an engineering feat that can cost several hundred million dollars."], "answer": "The internet feels ethereal, but it depends on hardware that is surprisingly easy to break.", "answerIndex": 0, "tags": ["KEY", "stance contradiction", "off-topic insertion", "wrong focus"], "fig": null, "table": null, "difficulty": "Medium", "explanation": "Answer: (a)\nThe paragraph's arc is: physical cables carry the internet; they are easily damaged; repairs are slow; governments are worried about exposure. The opening sentence must introduce that fragility thesis with a full noun phrase.\nCorrect (a): it names the subject (the internet's physical hardware) and states the claim — 'surprisingly easy to break' — that every following sentence supports, from anchor damage to scarce repair ships.\nIncorrect (b): contradicts the stance — the whole paragraph demonstrates that the networks can be and are disrupted.\nIncorrect (c): off-topic — hacking and its costs are never mentioned; the paragraph is about physical damage.\nIncorrect (d): right topic, wrong focus — construction cost is true of cables but sets up nothing about vulnerability or repair delays.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: opener licenses every subsequent sentence; single-fault audit per distractor"}, {"id": "IPMAT_VARC_078", "section": "VA", "format": "Paragraph completion (blank closing)", "kind": "mcq", "passage": "Fewer than 150 Great Indian Bustards survive, most of them in Rajasthan's Thar desert, where overhead power lines from solar farms have become their leading killer. Conservationists have responded with a captive-breeding centre at Sudasari, which has hatched more than forty chicks in three years. Breeding, however, is the easier half of the task. Birds raised in enclosures must eventually be released into the same landscape of wires that decimated their parents. ___", "stem": "From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.", "options": ["The bustard was once a serious contender to be named India's national bird.", "Unless the lines are moved underground, the programme risks restocking a habitat that remains a trap.", "India's tiger reserves, by contrast, have doubled their populations through community-managed tourism.", "Fortunately, transmission wires pose little danger to large birds once they learn to avoid them."], "answer": "Unless the lines are moved underground, the programme risks restocking a habitat that remains a trap.", "answerIndex": 1, "tags": ["wrong focus", "KEY", "off-topic insertion", "stance contradiction"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (b)\nThe paragraph builds a tension: breeding succeeds, but released birds face the same lethal wires. The closing sentence must draw the conclusion that tension licenses.\nCorrect (b): 'the lines' and 'the programme' pick up the paragraph's two threads — power lines and captive breeding — and state the only conclusion the previous sentence permits: release into an unchanged habitat undoes the breeding gains.\nIncorrect (a): right topic, wrong focus — a true fact about the bustard, but it answers nothing about the release problem the paragraph has just posed.\nIncorrect (c): off-topic — tigers and tourism are never raised.\nIncorrect (d): contradicts the stance — the opening sentence establishes the wires as the species' leading killer.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: conclusion licensed by preceding sentence pair; single-fault audit per distractor"}, {"id": "IPMAT_VARC_079", "section": "VA", "format": "Paragraph completion (blank middle)", "kind": "mcq", "passage": "From January 2026 the European Union's carbon border levy began taxing imports of steel, cement and aluminium according to the emissions produced in making them. Indian steelmakers, whose coal-fired plants emit more per tonne than European mills, ship almost a fifth of their exports to the EU. ___ Smaller producers, who lack the capital for such upgrades, may simply abandon the European market. Either way, the levy is doing what a decade of climate summits could not: putting a price on Indian carbon.", "stem": "From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.", "options": ["Indian exporters, however, are exempt from the levy under a bilateral trade agreement.", "The EU has also tightened its data-privacy rules, which affect Indian IT firms.", "Steel remains one of the hardest industries in the world to decarbonise fully.", "The largest of them have therefore announced green-hydrogen and scrap-based projects to bring their footprints below the taxable threshold."], "answer": "The largest of them have therefore announced green-hydrogen and scrap-based projects to bring their footprints below the taxable threshold.", "answerIndex": 3, "tags": ["stance contradiction", "off-topic insertion", "wrong focus", "KEY"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (d)\nThe paragraph contrasts how large and small Indian steelmakers respond to the EU levy. The blank must supply the large-producer half of that contrast.\nCorrect (d): 'the largest of them' picks up 'Indian steelmakers' from the previous sentence, and the next sentence's 'such upgrades' refers directly to the green-hydrogen and scrap projects — without (d), that referent dangles.\nIncorrect (a): contradicts the stance — the closing sentence says the levy is pricing Indian carbon, which an exemption would make impossible.\nIncorrect (b): off-topic — data privacy and IT firms are never part of this paragraph.\nIncorrect (c): right topic, wrong focus — true about steel, but it neither continues the exporters' story nor gives 'such upgrades' anything to refer to.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: forward referent 'such upgrades' resolves only via key; single-fault audit per distractor"}, {"id": "IPMAT_VARC_080", "section": "VA", "format": "Cloze 3-blank", "kind": "mcq", "passage": null, "stem": "Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nMicroplastics are now so ___(i) in the food chain that they have been detected in human blood; researchers warn that these particles may ___(ii) cellular function and, over decades, ___(iii) chronic inflammatory conditions.", "options": ["pervasive; enhance; trigger", "ubiquitous; disrupt; precipitate", "sporadic; impair; aggravate", "ubiquitous; compromise; dissolve"], "answer": "ubiquitous; disrupt; precipitate", "answerIndex": 1, "tags": ["polarity flip", "KEY", "polarity flip", "collocation break"], "fig": null, "table": null, "difficulty": "Hard", "explanation": "Answer: (b)\nCorrect (b): 'ubiquitous' matches 'so ___ that they have been detected in human blood' (everywhere); 'disrupt cellular function' and 'precipitate chronic conditions' are standard scientific collocations, and both carry the negative sense the warning demands.\nIncorrect (a): 'pervasive' and 'trigger' fit, but 'enhance cellular function' is a positive effect where harm is meant — polarity flip.\nIncorrect (c): 'impair' and 'aggravate' fit, but 'sporadic' contradicts the everywhere-in-the-food-chain claim — polarity flip.\nIncorrect (d): 'ubiquitous' and 'compromise' fit, but 'dissolve chronic inflammatory conditions' does not collocate — conditions are caused or worsened, not dissolved — collocation break.", "archetype": null, "status": "approved", "flags": [], "verified": "ok", "verNote": "G1: one killer per set (positions ii, i, iii); plausible words in each distractor cross-checked as genuine near-synonyms of the key"}, {"id": "IPMAT_VARC_081", "section": "VA", "format": "Cloze 2-blank", "kind": "mcq", "passage": null, "stem": "Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nProlonged courses of antibiotics can ___(i) the gut's microbial diversity, and a growing body of research suggests, worryingly, that this loss may ___(ii) susceptibility to allergies in early childhood.", "options": ["enrich; heighten", "curtail; manufacture", "deplete; heighten", "diminish; blunt"], "answer": "de var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\d{10}$/;
function safeMarkup(h){if(!h)return "";return /<script|<iframe|javascript:|\son\w+\s*=/i.test(h)?"":h}
function stemHTML(s){if(!s)return "";var t=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return t.replace(/\[\[(.*?)\]\]/g,"<u>$1</u>")}
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
/* ==================== SECTIONAL TIMERS (Indore pattern) ==================== */
var SECTION_ORDER=["VA"];
var SECTION_LABEL={"QA-SA":"QA \u2014 Short Answer","QA-MCQ":"QA \u2014 MCQ","VA":"VARC"};
var SECTIONS=SECTION_ORDER.map(function(code){
 var idx=[];QUESTIONS.forEach(function(q,i){if(q.section===code)idx.push(i)});
 return {code:code,minutes:40,from:idx[0],to:idx[idx.length-1]};
});
var curSec=0;
var secLeft=SECTIONS.map(function(s){return s.minutes*60});
var elapsedTotal=0;
var tickInt=null,qShownTs=0;

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,curSec:curSec,secLeft:secLeft,elapsedTotal:elapsedTotal,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.curSec==="number")curSec=Math.max(0,Math.min(SECTIONS.length-1,s.curSec));
 if(s.secLeft&&s.secLeft.length===SECTIONS.length)secLeft=s.secLeft.map(function(v){return Math.max(0,v)});
 secLeft[curSec]=Math.max(10,secLeft[curSec]);
 if(typeof s.elapsedTotal==="number")elapsedTotal=s.elapsedTotal;
 currentQ=Math.max(SECTIONS[curSec].from,Math.min(SECTIONS[curSec].to,currentQ));
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 buildPalette();
 tickInt=setInterval(function(){
  secLeft[curSec]--;elapsedTotal++;
  var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secLeft[curSec]);
  if(elapsedTotal%10===0)snSaveSession();
  if(secLeft[curSec]<=0){
   if(curSec>=SECTIONS.length-1)submitTest();
   else advanceSection();
  }
 },1000);
 renderQuestion();
 snSaveSession();
}
function advanceSection(){
 markTime();
 secLeft[curSec]=0;
 curSec++;
 currentQ=SECTIONS[curSec].from;
 buildPalette();
 snSaveSession();
 renderQuestion();
}

/* ==================== PALETTE (current section only) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var s=SECTIONS[curSec];
 for(var i=s.from;i<=s.to;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 var s=SECTIONS[curSec];
 for(var i=s.from;i<=s.to;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var s=SECTIONS[curSec];
 document.getElementById("qCounter").textContent=SECTION_LABEL[s.code]+" ("+(curSec+1)+"/"+SECTIONS.length+") \u00b7 Q "+(currentQ-s.from+1)+" / "+(s.to-s.from+1);
 document.getElementById("timer").textContent=fmtClock(secLeft[curSec]);
 var sb=document.getElementById("submitBtn");if(sb)sb.style.display=(curSec===SECTIONS.length-1)?"":"none";
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(q.options&&q.options.length?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 var fB=document.getElementById("figBox");fB.innerHTML=safeMarkup(q.fig)+safeMarkup(q.table);
 document.getElementById("qText").innerHTML=stemHTML(q.stem);
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(q.options&&q.options.length){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();renderQuestion()};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();
}
function nav(d){markTime();var s=SECTIONS[curSec];currentQ=Math.max(s.from,Math.min(s.to,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){var s=SECTIONS[curSec];if(i<s.from||i>s.to)return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== SCORING HELPERS ==================== */
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(q.options&&q.options.length)return a===q.answerIndex;
 var norm=function(x){return String(x).toLowerCase().replace(/[,\s]/g,"")};
 var na=norm(a),nk=norm(q.answer);
 var NUM=/^-?\d+(\.\d+)?$/;
 if(NUM.test(na)&&NUM.test(nk))return Number(na)===Number(nk);
 return na===nk;
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!(q.options&&q.options.length))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=((q.options&&q.options.length)?CFG.w:CFG.titaW);
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=elapsedTotal;
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+q.section+" \u00b7 "+q.format+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  var stem=document.createElement("div");stem.className="rqStem";stem.innerHTML=stemHTML(q.stem);wrap.appendChild(stem);
  if(q.fig||q.table){var ft=document.createElement("div");ft.className="figWrap";ft.innerHTML=safeMarkup(q.fig)+safeMarkup(q.table);wrap.appendChild(ft)}
  if(q.options&&q.options.length){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== DOWNLOAD PDF ==================== */
function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  doc.text("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+"   ["+statusLabel+"]",margin,y);y+=12;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(q.stem,margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table){var tt=q.table.replace(/<\/tr>/g,"\n").replace(/<\/t[hd]>/g,"  |  ").replace(/<[^>]+>/g,"").replace(/\n+/g,"\n").trim();doc.setTextColor(60,60,60);writeWrapped(tt,margin+12,pageW-2*margin-12,8,"normal");doc.setTextColor(0,0,0);}
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure - see on-screen review]",margin+12,pageW-2*margin-12,8,"italic");doc.setTextColor(0,0,0);}
  if(q.options&&q.options.length){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="  \u2713 correct";
    else if(idx===a)marker="  \u2717 your choice";
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   writeWrapped("Your answer: "+(skippedQ?"-":a),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

/* ==================== PAGE LOAD ==================== */
document.getElementById("lgTitle").textContent=TEST_NAME;
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 TITA wrong "+CFG.titaW:"")+" \u00b7 Max "+MAX_MARKS+"<br>Single section \u00b7 40 min \u00b7 free navigation \u00b7 test auto-submits at 00:00";
/* ==================== AVAILABILITY WINDOW (IST) ==================== */
var WINDOW={opensAt:Date.UTC(2026,8,8,18,30,0),  /* Wed 9 Sep 2026, 00:00 IST */
            closesAt:Date.UTC(2026,8,11,18,30,0) /* Sat 12 Sep 2026, 00:00 IST */};
function windowState(){var n=Date.now();if(n<WINDOW.opensAt)return "before";if(n>=WINDOW.closesAt)return "after";return "open"}
function enforceWindow(){
 var st=windowState();
 var b=document.getElementById("winBanner"),btn=document.getElementById("loginBtn");
 if(st==="open"){if(b)b.style.display="none";if(btn){btn.disabled=false;btn.style.opacity="1";btn.textContent="Start Test"}return true}
 var msg=st==="before"
  ?"This challenge opens Wednesday 9 September, 12:00 AM IST and runs for three days."
  :"This challenge window has closed (it ran 9\u201311 September). Scores are no longer accepted.";
 if(b){b.style.display="block";b.textContent=msg}
 if(btn){btn.disabled=true;btn.style.opacity=".45";btn.textContent=st==="before"?"Opens Soon":"Window Closed"}
 return false;
}
document.getElementById("loginBtn").addEventListener("click",function(){if(enforceWindow())startTest()});
enforceWindow();
setInterval(enforceWindow,30000);
snFlushQueue();
snTryResume();

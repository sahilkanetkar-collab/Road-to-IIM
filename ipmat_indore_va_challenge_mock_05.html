var QUESTIONS=[{"id":"IPMAT_VA_001","section":"VA","format":"RC","kind":"mcq","passage":"When an accounting firm in Nagpur installed a drafting assistant last spring, its partners braced for one of two outcomes. Either the juniors would be made redundant, as the newspapers kept warning, or they would be freed for 'higher-value work', as the software's sellers promised. Neither happened. The juniors stayed, and their work did not get higher; it got thinner.\n\nFor decades a first-year associate's time went mostly on drudgery: reconciling ledgers, or checking the same indemnity clause in forty contracts. Nobody valued that work, least of all the people doing it. But it was how they learned. A junior who had reconciled a few hundred accounts could tell at a glance when a number looked wrong, even if she could not always say why. That instinct was what the firm was really paying for, and it was built out of tedium.\n\nThe new tools are good at precisely the tedium. In most of the firms I spoke to, routine drafts now arrive finished, and the junior's task is to approve them. One partner put it bluntly: 'We have turned our trainees into proofreaders of work they could not have done themselves.' Approving is quicker than composing, so the billable hours shrink; because the hours shrink, the firm needs fewer trainees the following year; and fewer trainees now means fewer seniors, a decade on, who can catch the machine when it is confidently wrong.\n\nTo be sure, some of this anxiety is old. Every generation of professionals has complained that the young have it easy, and the calculator did not abolish arithmetic. In a few firms, partners have begun withholding the tools from first-year staff, who must draft by hand before they are allowed to check the machine's version. That may look like nostalgia. It is closer to maintenance.\n\nThe argument about artificial intelligence and office work is still conducted as a ledger of jobs lost against jobs created, and that ledger may well balance. What it cannot record is whether the people in those jobs will know what they are doing. A profession can survive losing its clerks; it is less clear that it can survive losing the road by which clerks became partners.","stem":"According to the writer, the chief value of the routine work that first-year associates once did was that it","options":["filled the billable hours that kept trainees on the payroll each year.","taught juniors to explain exactly why a figure in a ledger was wrong.","may have been what clients were most willing to pay the firm for.","tended to build an instinct juniors could not fully articulate."],"answer":"tended to build an instinct juniors could not fully articulate.","answerIndex":3,"tags":["true but not the answer","reversal","word match","KEY"],"optionTags":["rc-true-not-answer","rc-reversal","rc-word-match",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nExplanation: Paragraph 2 calls the routine work drudgery that nobody valued, yet says it was how juniors learned. It built the instinct to see at a glance that a number was wrong, without always knowing why, and 'that instinct was what the firm was really paying for'.\nCorrect (d): 'Built out of tedium' and 'could not always say why' become 'tended to build an instinct juniors could not fully articulate'. The stem's operative words are 'chief value', and the writer names the instinct as what the firm was really paying for.\nLead distractor (a): It tempts because paragraph 3 links shrinking hours to fewer trainees, so the hours did keep trainees employed. But that is a consequence the passage traces, not the value the writer gives the work; the stem asks for its chief value.\nIncorrect (b): Reverses the passage: a junior could spot a wrong number 'even if she could not always say why'.\nIncorrect (c): Borrows 'paying for' but moves it from the firm to its clients; the passage says the firm was paying for the instinct, and says nothing about what clients wanted.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC detail; key = P2S5-6 (instinct built out of tedium); lead = P3S4 consequence (hours keep trainees)"},{"id":"IPMAT_VA_002","section":"VA","format":"RC","kind":"mcq","passage":"When an accounting firm in Nagpur installed a drafting assistant last spring, its partners braced for one of two outcomes. Either the juniors would be made redundant, as the newspapers kept warning, or they would be freed for 'higher-value work', as the software's sellers promised. Neither happened. The juniors stayed, and their work did not get higher; it got thinner.\n\nFor decades a first-year associate's time went mostly on drudgery: reconciling ledgers, or checking the same indemnity clause in forty contracts. Nobody valued that work, least of all the people doing it. But it was how they learned. A junior who had reconciled a few hundred accounts could tell at a glance when a number looked wrong, even if she could not always say why. That instinct was what the firm was really paying for, and it was built out of tedium.\n\nThe new tools are good at precisely the tedium. In most of the firms I spoke to, routine drafts now arrive finished, and the junior's task is to approve them. One partner put it bluntly: 'We have turned our trainees into proofreaders of work they could not have done themselves.' Approving is quicker than composing, so the billable hours shrink; because the hours shrink, the firm needs fewer trainees the following year; and fewer trainees now means fewer seniors, a decade on, who can catch the machine when it is confidently wrong.\n\nTo be sure, some of this anxiety is old. Every generation of professionals has complained that the young have it easy, and the calculator did not abolish arithmetic. In a few firms, partners have begun withholding the tools from first-year staff, who must draft by hand before they are allowed to check the machine's version. That may look like nostalgia. It is closer to maintenance.\n\nThe argument about artificial intelligence and office work is still conducted as a ledger of jobs lost against jobs created, and that ledger may well balance. What it cannot record is whether the people in those jobs will know what they are doing. A profession can survive losing its clerks; it is less clear that it can survive losing the road by which clerks became partners.","stem":"Which of the following best captures what the partner means by calling trainees 'proofreaders of work they could not have done themselves'?","options":["The juniors now approve drafts that they lack the skill to write.","The juniors now polish drafts that are better than any they could write.","The juniors now check drafts they had no time to write.","The juniors now check drafts that they are no longer permitted to write."],"answer":"The juniors now approve drafts that they lack the skill to write.","answerIndex":0,"tags":["KEY","literal reading","false link","word match"],"optionTags":[null,"rc-literal","rc-false-link","rc-word-match"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nExplanation: Paragraph 3 says the tools now produce routine drafts and 'the junior's task is to approve them'; paragraph 2 explains that doing such work was how juniors learned. The partner's remark joins the two: trainees now check work they never learned to do.\nCorrect (a): 'Proofreaders of work they could not have done themselves' = 'approve drafts that they lack the skill to write'. The sentence before it ('the junior's task is to approve them') shows that 'proofreading' here means signing off, not correcting.\nLead distractor (b): Reads 'proofreaders' literally, as people who polish a text. The passage never has the juniors improving anything: 'the junior's task is to approve them'.\nIncorrect (c): Reads 'could not have done' as a shortage of time; the passage makes it a shortage of skill, since drafting was how juniors learned and they no longer do it.\nIncorrect (d): Reads 'could not' as 'were not allowed to'. Nothing in the passage forbids juniors to draft; where a rule exists (paragraph 4), it is the reverse, making them draft by hand.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC quoted line; key = P3S2-3; lead = literal sense of 'proofreaders'"},{"id":"IPMAT_VA_003","section":"VA","format":"RC","kind":"mcq","passage":"When an accounting firm in Nagpur installed a drafting assistant last spring, its partners braced for one of two outcomes. Either the juniors would be made redundant, as the newspapers kept warning, or they would be freed for 'higher-value work', as the software's sellers promised. Neither happened. The juniors stayed, and their work did not get higher; it got thinner.\n\nFor decades a first-year associate's time went mostly on drudgery: reconciling ledgers, or checking the same indemnity clause in forty contracts. Nobody valued that work, least of all the people doing it. But it was how they learned. A junior who had reconciled a few hundred accounts could tell at a glance when a number looked wrong, even if she could not always say why. That instinct was what the firm was really paying for, and it was built out of tedium.\n\nThe new tools are good at precisely the tedium. In most of the firms I spoke to, routine drafts now arrive finished, and the junior's task is to approve them. One partner put it bluntly: 'We have turned our trainees into proofreaders of work they could not have done themselves.' Approving is quicker than composing, so the billable hours shrink; because the hours shrink, the firm needs fewer trainees the following year; and fewer trainees now means fewer seniors, a decade on, who can catch the machine when it is confidently wrong.\n\nTo be sure, some of this anxiety is old. Every generation of professionals has complained that the young have it easy, and the calculator did not abolish arithmetic. In a few firms, partners have begun withholding the tools from first-year staff, who must draft by hand before they are allowed to check the machine's version. That may look like nostalgia. It is closer to maintenance.\n\nThe argument about artificial intelligence and office work is still conducted as a ledger of jobs lost against jobs created, and that ledger may well balance. What it cannot record is whether the people in those jobs will know what they are doing. A profession can survive losing its clerks; it is less clear that it can survive losing the road by which clerks became partners.","stem":"According to the passage, the shrinking of billable hours matters because it","options":["will reduce fee income now and leave the firm unable to afford trainees later.","gives trainees more time to draft by hand before checking the machine.","frees the juniors for the higher-value work the software's sellers promised.","will mean smaller intakes now and too few seniors able to catch the machine's errors later."],"answer":"will mean smaller intakes now and too few seniors able to catch the machine's errors later.","answerIndex":3,"tags":["false link","word match","wrong voice","KEY"],"optionTags":["rc-false-link","rc-word-match","rc-wrong-voice",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nExplanation: Paragraph 3 sets out a chain: approving is quicker than composing, so billable hours shrink; fewer hours mean the firm needs fewer trainees the following year; and fewer trainees now mean fewer seniors, a decade on, who can catch the machine when it is wrong.\nCorrect (d): The key compresses both links: 'fewer trainees the following year' becomes 'smaller intakes now', and 'fewer seniors, a decade on, who can catch the machine when it is confidently wrong' becomes 'too few seniors able to catch the machine's errors later'.\nLead distractor (a): Its facts sit near the passage (hours shrink, fewer trainees) but the link is invented: the writer says the firm 'needs' fewer trainees, not that it cannot afford them, and says nothing about fees.\nIncorrect (b): Borrows 'draft by hand' and 'check the machine' from paragraph 4, where a few partners impose hand-drafting by choice; it is not a result of shrinking hours.\nIncorrect (c): This is the sellers' promise in paragraph 1, which the writer says did not come true: the juniors' work 'did not get higher; it got thinner'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC detail on the causal chain P3S4; lead invents a fees link"},{"id":"IPMAT_VA_004","section":"VA","format":"RC","kind":"mcq","passage":"When an accounting firm in Nagpur installed a drafting assistant last spring, its partners braced for one of two outcomes. Either the juniors would be made redundant, as the newspapers kept warning, or they would be freed for 'higher-value work', as the software's sellers promised. Neither happened. The juniors stayed, and their work did not get higher; it got thinner.\n\nFor decades a first-year associate's time went mostly on drudgery: reconciling ledgers, or checking the same indemnity clause in forty contracts. Nobody valued that work, least of all the people doing it. But it was how they learned. A junior who had reconciled a few hundred accounts could tell at a glance when a number looked wrong, even if she could not always say why. That instinct was what the firm was really paying for, and it was built out of tedium.\n\nThe new tools are good at precisely the tedium. In most of the firms I spoke to, routine drafts now arrive finished, and the junior's task is to approve them. One partner put it bluntly: 'We have turned our trainees into proofreaders of work they could not have done themselves.' Approving is quicker than composing, so the billable hours shrink; because the hours shrink, the firm needs fewer trainees the following year; and fewer trainees now means fewer seniors, a decade on, who can catch the machine when it is confidently wrong.\n\nTo be sure, some of this anxiety is old. Every generation of professionals has complained that the young have it easy, and the calculator did not abolish arithmetic. In a few firms, partners have begun withholding the tools from first-year staff, who must draft by hand before they are allowed to check the machine's version. That may look like nostalgia. It is closer to maintenance.\n\nThe argument about artificial intelligence and office work is still conducted as a ledger of jobs lost against jobs created, and that ledger may well balance. What it cannot record is whether the people in those jobs will know what they are doing. A profession can survive losing its clerks; it is less clear that it can survive losing the road by which clerks became partners.","stem":"The writer implies that the partners who make first-year staff draft by hand","options":["are clinging to habits the new tools have made pointless.","want to keep their trainees from losing their jobs to the tool.","are protecting the firm's future supply of capable seniors.","are doing what most firms will soon find themselves forced to do."],"answer":"are protecting the firm's future supply of capable seniors.","answerIndex":2,"tags":["reversal","false link","KEY","scope shift"],"optionTags":["rc-reversal","rc-false-link",null,"rc-scope-shift"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nExplanation: Paragraph 4 concedes that complaints about the young are old, then describes a few firms where partners keep the tools from first-year staff. 'That may look like nostalgia. It is closer to maintenance.' Read with the last paragraph, what is being maintained is the route by which clerks become partners.\nCorrect (c): Drafting by hand rebuilds the learning described in paragraph 2, so the firm will still have seniors who can catch the machine. 'Protecting the firm's future supply of capable seniors' is what 'maintenance' implies here.\nLead distractor (a): This is the 'nostalgia' reading, which the writer raises only to reject: 'It is closer to maintenance.'\nIncorrect (b): Supplies a motive the passage never gives. The juniors in paragraph 1 kept their jobs; what the hand-drafting protects is their learning.\nIncorrect (d): Stretches 'In a few firms' into a forecast about most firms; the writer makes no prediction.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC inference from P4S5 'closer to maintenance' + P5S3; lead = nostalgia reading the writer rejects"},{"id":"IPMAT_VA_005","section":"VA","format":"RC","kind":"mcq","passage":"When an accounting firm in Nagpur installed a drafting assistant last spring, its partners braced for one of two outcomes. Either the juniors would be made redundant, as the newspapers kept warning, or they would be freed for 'higher-value work', as the software's sellers promised. Neither happened. The juniors stayed, and their work did not get higher; it got thinner.\n\nFor decades a first-year associate's time went mostly on drudgery: reconciling ledgers, or checking the same indemnity clause in forty contracts. Nobody valued that work, least of all the people doing it. But it was how they learned. A junior who had reconciled a few hundred accounts could tell at a glance when a number looked wrong, even if she could not always say why. That instinct was what the firm was really paying for, and it was built out of tedium.\n\nThe new tools are good at precisely the tedium. In most of the firms I spoke to, routine drafts now arrive finished, and the junior's task is to approve them. One partner put it bluntly: 'We have turned our trainees into proofreaders of work they could not have done themselves.' Approving is quicker than composing, so the billable hours shrink; because the hours shrink, the firm needs fewer trainees the following year; and fewer trainees now means fewer seniors, a decade on, who can catch the machine when it is confidently wrong.\n\nTo be sure, some of this anxiety is old. Every generation of professionals has complained that the young have it easy, and the calculator did not abolish arithmetic. In a few firms, partners have begun withholding the tools from first-year staff, who must draft by hand before they are allowed to check the machine's version. That may look like nostalgia. It is closer to maintenance.\n\nThe argument about artificial intelligence and office work is still conducted as a ledger of jobs lost against jobs created, and that ledger may well balance. What it cannot record is whether the people in those jobs will know what they are doing. A profession can survive losing its clerks; it is less clear that it can survive losing the road by which clerks became partners.","stem":"The writer's central concern about artificial intelligence in office work is that it","options":["will cost more office jobs than it creates, whatever the sellers say.","is turning trainees into proofreaders of drafts produced by a machine.","is cutting away the drudgery through which juniors learned their trade.","is weakening the way skills in general pass from older workers to younger ones."],"answer":"is cutting away the drudgery through which juniors learned their trade.","answerIndex":2,"tags":["wrong voice","detail as main idea","KEY","scope shift"],"optionTags":["rc-wrong-voice","rc-detail-as-main",null,"rc-scope-shift"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nExplanation: The writer sets aside both the newspapers' fear (lost jobs) and the sellers' promise (higher work). His own concern arrives in the last paragraph: a profession can survive losing its clerks, but perhaps not 'losing the road by which clerks became partners'.\nCorrect (c): 'The road by which clerks became partners' is the routine work of paragraph 2, the drudgery that 'was how they learned'. Paragraphs 2 and 3 show that this is exactly what the tools now absorb.\nLead distractor (d): Broader than the writer's claim. His concern is how juniors in the professions acquire judgement, and he ends on 'the road by which clerks became partners', not on skills in general.\nIncorrect (a): This is the job-count debate the writer says misses the point; he adds that the ledger 'may well balance'.\nIncorrect (b): True of paragraph 3, but it is the symptom, not the concern; the worry is what losing the drafting does to the way juniors learn.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC main idea; thesis P5S3; lead overgeneralises P5S2"},{"id":"IPMAT_VA_006","section":"VA","format":"RC","kind":"mcq","passage":"When an accounting firm in Nagpur installed a drafting assistant last spring, its partners braced for one of two outcomes. Either the juniors would be made redundant, as the newspapers kept warning, or they would be freed for 'higher-value work', as the software's sellers promised. Neither happened. The juniors stayed, and their work did not get higher; it got thinner.\n\nFor decades a first-year associate's time went mostly on drudgery: reconciling ledgers, or checking the same indemnity clause in forty contracts. Nobody valued that work, least of all the people doing it. But it was how they learned. A junior who had reconciled a few hundred accounts could tell at a glance when a number looked wrong, even if she could not always say why. That instinct was what the firm was really paying for, and it was built out of tedium.\n\nThe new tools are good at precisely the tedium. In most of the firms I spoke to, routine drafts now arrive finished, and the junior's task is to approve them. One partner put it bluntly: 'We have turned our trainees into proofreaders of work they could not have done themselves.' Approving is quicker than composing, so the billable hours shrink; because the hours shrink, the firm needs fewer trainees the following year; and fewer trainees now means fewer seniors, a decade on, who can catch the machine when it is confidently wrong.\n\nTo be sure, some of this anxiety is old. Every generation of professionals has complained that the young have it easy, and the calculator did not abolish arithmetic. In a few firms, partners have begun withholding the tools from first-year staff, who must draft by hand before they are allowed to check the machine's version. That may look like nostalgia. It is closer to maintenance.\n\nThe argument about artificial intelligence and office work is still conducted as a ledger of jobs lost against jobs created, and that ledger may well balance. What it cannot record is whether the people in those jobs will know what they are doing. A profession can survive losing its clerks; it is less clear that it can survive losing the road by which clerks became partners.","stem":"Which of the following is closest in meaning to 'maintenance' as used in para 4?","options":["the careful preservation of an old custom","upkeep of something still working","regular payments made for someone's support","the repair of something already broken"],"answer":"upkeep of something still working","answerIndex":1,"tags":["near-miss shade","KEY","context-blind sense","near-miss shade"],"optionTags":["vocab-shade",null,"vocab-context-blind","vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: In paragraph 4, partners make first-year staff draft by hand before checking the machine. The writer says this may look like nostalgia but 'is closer to maintenance': work done to keep something in working order.\nCorrect (b): Maintenance here is the upkeep of a system that still works: the route from trainee to senior has not broken yet, and the partners are keeping it running.\nLead distractor (a): A near shade that matches 'nostalgia', the reading the writer rejects; here maintenance is practical upkeep, not attachment to an old custom.\nIncorrect (c): The everyday legal sense (maintenance payments), which has nothing to do with the context.\nIncorrect (d): Repair implies the thing is already broken, but the passage places the damage a decade ahead; the partners are keeping the route working, not mending it.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC vocabulary in context, P4S5; contextual sense = upkeep"},{"id":"IPMAT_VA_007","section":"VA","format":"RC","kind":"mcq","passage":"It is the habit of the guidebooks to say that the great rivers gave birth to the great nations, as though a civilisation were a crop that sprang up wherever the water was sweet and the soil soft. I have stood on the banks of several such rivers, and I confess that the first thing to strike me was not their bounty but their temper.\n\nThe river I knew best as a boy rose each year with no regard for our convenience. In some seasons it arrived a fortnight early and took the standing grain; in others it barely wet the fields, and the village went hungry on a full river's promise. My father, who farmed beside it all his life, could never say in March whether to sow early or late, and guessed wrong as often as right. An old ferryman once told me that he had never trusted it, not for a single season, and that this was the whole of his wisdom.\n\nI do not deny the silt. Without it the plains would have stayed marsh and scrub, and no amount of discipline would have fed a city. But silt alone makes a farmer, not a state. What makes a state is the need, felt by a thousand farmers at once, to know when the water will come. Out of that need arose the watchers who marked the rising on a post; out of their marks, a reckoning of days; and out of the reckoning, men who were obeyed because they appeared to know the river's mind.\n\nThus the embankment and the calendar, and in time the magistrate, are in most of the old valleys the children of anxiety rather than of plenty. A river that gave without fail would have bred contented villages, each sufficient to itself. It was the river that might fail which taught men to count, and in the end to submit.\n\nWe praise the river as a mother. I am inclined to think she was nearer to a stern tutor, whose gifts were real enough, but whose lessons were the larger inheritance.","stem":"According to the writer, the men who came to be obeyed in the old river valleys were obeyed because they","options":["had grown out of a need that many farmers felt at once.","had probably built the embankments that kept the floods off the grain.","were the watchers who had marked the river's rise on a post.","seemed to know beforehand what the river would do."],"answer":"seemed to know beforehand what the river would do.","answerIndex":3,"tags":["true but not the answer","false link","word match","KEY"],"optionTags":["rc-true-not-answer","rc-false-link","rc-word-match",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nExplanation: Paragraph 3 traces a chain: farmers needed to know when the water would come; watchers marked the rising on a post; their marks became a reckoning of days; and out of the reckoning came 'men who were obeyed because they appeared to know the river's mind'.\nCorrect (d): 'Appeared to know the river's mind' = 'seemed to know beforehand what the river would do'. The stem's operative word is 'because', and the passage gives exactly this reason.\nLead distractor (a): True: these men did arise from a need a thousand farmers felt at once. But that is where they came from, not why they were obeyed, and the stem asks for the reason.\nIncorrect (b): The essay calls the embankment a child of anxiety but never says who built it, and never links building to being obeyed.\nIncorrect (c): Runs two stages of the chain together: the watchers marked the post, and the obeyed men came later, 'out of the reckoning'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC detail P3S5; lead = origin of the obeyed men (true, wrong question)"},{"id":"IPMAT_VA_008","section":"VA","format":"RC","kind":"mcq","passage":"It is the habit of the guidebooks to say that the great rivers gave birth to the great nations, as though a civilisation were a crop that sprang up wherever the water was sweet and the soil soft. I have stood on the banks of several such rivers, and I confess that the first thing to strike me was not their bounty but their temper.\n\nThe river I knew best as a boy rose each year with no regard for our convenience. In some seasons it arrived a fortnight early and took the standing grain; in others it barely wet the fields, and the village went hungry on a full river's promise. My father, who farmed beside it all his life, could never say in March whether to sow early or late, and guessed wrong as often as right. An old ferryman once told me that he had never trusted it, not for a single season, and that this was the whole of his wisdom.\n\nI do not deny the silt. Without it the plains would have stayed marsh and scrub, and no amount of discipline would have fed a city. But silt alone makes a farmer, not a state. What makes a state is the need, felt by a thousand farmers at once, to know when the water will come. Out of that need arose the watchers who marked the rising on a post; out of their marks, a reckoning of days; and out of the reckoning, men who were obeyed because they appeared to know the river's mind.\n\nThus the embankment and the calendar, and in time the magistrate, are in most of the old valleys the children of anxiety rather than of plenty. A river that gave without fail would have bred contented villages, each sufficient to itself. It was the river that might fail which taught men to count, and in the end to submit.\n\nWe praise the river as a mother. I am inclined to think she was nearer to a stern tutor, whose gifts were real enough, but whose lessons were the larger inheritance.","stem":"The writer suggests that a river which never failed to give would have","options":["forced its villages to combine for the sake of their common safety.","probably bred cities that were each content to govern themselves alone.","likely bred villages that each had all that they needed.","left its farmers too idle to tend their fields."],"answer":"likely bred villages that each had all that they needed.","answerIndex":2,"tags":["reversal","scope shift","KEY","out of scope"],"optionTags":["rc-reversal","rc-scope-shift",null,"rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nExplanation: Paragraph 4 contrasts two rivers. One that gave without fail 'would have bred contented villages, each sufficient to itself'; the one that might fail taught men to count and, in the end, to submit.\nCorrect (c): 'Contented villages, each sufficient to itself' = 'villages that each had all that they needed'. The hedge 'likely' matches the writer's own conditional, 'would have'.\nLead distractor (b): Keeps the core idea of self-contained units but shifts the unit from villages to cities; the writer's point is that such a river would never have produced cities or states at all.\nIncorrect (a): Reverses the passage: combining is what the unreliable river taught.\nIncorrect (d): Adds idleness and neglect, which the essay never suggests; it says only that the villages would be contented.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC detail P4S2; lead shifts villages to cities"},{"id":"IPMAT_VA_009","section":"VA","format":"RC","kind":"mcq","passage":"It is the habit of the guidebooks to say that the great rivers gave birth to the great nations, as though a civilisation were a crop that sprang up wherever the water was sweet and the soil soft. I have stood on the banks of several such rivers, and I confess that the first thing to strike me was not their bounty but their temper.\n\nThe river I knew best as a boy rose each year with no regard for our convenience. In some seasons it arrived a fortnight early and took the standing grain; in others it barely wet the fields, and the village went hungry on a full river's promise. My father, who farmed beside it all his life, could never say in March whether to sow early or late, and guessed wrong as often as right. An old ferryman once told me that he had never trusted it, not for a single season, and that this was the whole of his wisdom.\n\nI do not deny the silt. Without it the plains would have stayed marsh and scrub, and no amount of discipline would have fed a city. But silt alone makes a farmer, not a state. What makes a state is the need, felt by a thousand farmers at once, to know when the water will come. Out of that need arose the watchers who marked the rising on a post; out of their marks, a reckoning of days; and out of the reckoning, men who were obeyed because they appeared to know the river's mind.\n\nThus the embankment and the calendar, and in time the magistrate, are in most of the old valleys the children of anxiety rather than of plenty. A river that gave without fail would have bred contented villages, each sufficient to itself. It was the river that might fail which taught men to count, and in the end to submit.\n\nWe praise the river as a mother. I am inclined to think she was nearer to a stern tutor, whose gifts were real enough, but whose lessons were the larger inheritance.","stem":"What does the writer mean when he says the village 'went hungry on a full river's promise'?","options":["The river ran high that year, and still the harvest failed.","The hoped-for flood was too slight to water the crops.","The flood came early and carried off the grain still standing.","The village went on trusting the river even while it starved."],"answer":"The hoped-for flood was too slight to water the crops.","answerIndex":1,"tags":["literal reading","KEY","true but not the answer","word match"],"optionTags":["rc-literal",null,"rc-true-not-answer","rc-word-match"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nExplanation: Paragraph 2 describes two kinds of bad season: in some the flood came early and took the standing grain; in others it 'barely wet the fields, and the village went hungry on a full river's promise'.\nCorrect (b): The phrase belongs to the seasons when the river 'barely wet the fields': the village had counted on the full flood a river usually brings, and it did not come. 'Promise' marks the flood as expected, not delivered.\nLead distractor (a): Reads 'full river' literally, as if the river ran high; the same sentence says it 'barely wet the fields'.\nIncorrect (c): True of other seasons in the same sentence, but those are the early floods, not the hunger the phrase describes.\nIncorrect (d): Borrows 'promise' and 'hungry' but turns the phrase into a claim about the villagers' faith; the writer is describing a flood that failed to come.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC quoted line P2S2; lead = literal 'full river'"},{"id":"IPMAT_VA_010","section":"VA","format":"RC","kind":"mcq","passage":"It is the habit of the guidebooks to say that the great rivers gave birth to the great nations, as though a civilisation were a crop that sprang up wherever the water was sweet and the soil soft. I have stood on the banks of several such rivers, and I confess that the first thing to strike me was not their bounty but their temper.\n\nThe river I knew best as a boy rose each year with no regard for our convenience. In some seasons it arrived a fortnight early and took the standing grain; in others it barely wet the fields, and the village went hungry on a full river's promise. My father, who farmed beside it all his life, could never say in March whether to sow early or late, and guessed wrong as often as right. An old ferryman once told me that he had never trusted it, not for a single season, and that this was the whole of his wisdom.\n\nI do not deny the silt. Without it the plains would have stayed marsh and scrub, and no amount of discipline would have fed a city. But silt alone makes a farmer, not a state. What makes a state is the need, felt by a thousand farmers at once, to know when the water will come. Out of that need arose the watchers who marked the rising on a post; out of their marks, a reckoning of days; and out of the reckoning, men who were obeyed because they appeared to know the river's mind.\n\nThus the embankment and the calendar, and in time the magistrate, are in most of the old valleys the children of anxiety rather than of plenty. A river that gave without fail would have bred contented villages, each sufficient to itself. It was the river that might fail which taught men to count, and in the end to submit.\n\nWe praise the river as a mother. I am inclined to think she was nearer to a stern tutor, whose gifts were real enough, but whose lessons were the larger inheritance.","stem":"It can be inferred that the writer regards the old ferryman as someone who","options":["let his distrust blind him to what the river gave.","spoke for the villagers who had lost their harvests to the river.","perhaps grasped the river's nature better than those who praise it.","perhaps cared more for his safety on the water than for any farmer's harvest."],"answer":"perhaps grasped the river's nature better than those who praise it.","answerIndex":2,"tags":["reversal","scope shift","KEY","out of scope"],"optionTags":["rc-reversal","rc-scope-shift",null,"rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nExplanation: The ferryman 'had never trusted it, not for a single season' and called this 'the whole of his wisdom'. The essay goes on to argue that the river's unreliability, not its kindness, shaped civilisation, and ends by setting the popular image of the river as a mother against the writer's own image of a stern tutor.\nCorrect (c): The writer's view of the river (temperamental, never to be relied on) is the ferryman's, so he presents the ferryman as wiser than those who 'praise the river as a mother'. 'Perhaps' keeps the inference at the strength the essay allows.\nLead distractor (a): Reverses the writer's attitude: the essay endorses distrust of the river, and the writer calls it the ferryman's 'wisdom'.\nIncorrect (b): Gives one man's remark a role the essay never gives it; he speaks only of his own wisdom.\nIncorrect (d): No such priority is mentioned; his distrust is of the river itself, 'not for a single season', not a preference for safety over harvests.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC inference P2S3 + P5; lead reverses the writer's approval"},{"id":"IPMAT_VA_011","section":"VA","format":"RC","kind":"mcq","passage":"It is the habit of the guidebooks to say that the great rivers gave birth to the great nations, as though a civilisation were a crop that sprang up wherever the water was sweet and the soil soft. I have stood on the banks of several such rivers, and I confess that the first thing to strike me was not their bounty but their temper.\n\nThe river I knew best as a boy rose each year with no regard for our convenience. In some seasons it arrived a fortnight early and took the standing grain; in others it barely wet the fields, and the village went hungry on a full river's promise. My father, who farmed beside it all his life, could never say in March whether to sow early or late, and guessed wrong as often as right. An old ferryman once told me that he had never trusted it, not for a single season, and that this was the whole of his wisdom.\n\nI do not deny the silt. Without it the plains would have stayed marsh and scrub, and no amount of discipline would have fed a city. But silt alone makes a farmer, not a state. What makes a state is the need, felt by a thousand farmers at once, to know when the water will come. Out of that need arose the watchers who marked the rising on a post; out of their marks, a reckoning of days; and out of the reckoning, men who were obeyed because they appeared to know the river's mind.\n\nThus the embankment and the calendar, and in time the magistrate, are in most of the old valleys the children of anxiety rather than of plenty. A river that gave without fail would have bred contented villages, each sufficient to itself. It was the river that might fail which taught men to count, and in the end to submit.\n\nWe praise the river as a mother. I am inclined to think she was nearer to a stern tutor, whose gifts were real enough, but whose lessons were the larger inheritance.","stem":"The passage is chiefly concerned with the idea that","options":["the floods of early rivers ruined harvests far more often than is admitted.","the unreliability of rivers, more than their bounty, pushed people to form states.","trade along rivers, more than farming beside them, built the first states.","rivers shaped early states by forcing farmers to submit to strong rulers."],"answer":"the unreliability of rivers, more than their bounty, pushed people to form states.","answerIndex":1,"tags":["detail as main idea","KEY","out of scope","half right"],"optionTags":["rc-detail-as-main",null,"rc-out-of-scope","rc-half-right"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: The essay opens with the guidebooks' view that rivers gave birth to nations through their bounty, concedes that silt was necessary, and argues that the need to anticipate an unreliable river produced watchers, calendars and men who were obeyed. The thesis arrives at the end: the river was 'nearer to a stern tutor' than a mother.\nCorrect (b): 'The children of anxiety rather than of plenty' and 'the river that might fail ... taught men to count' = 'the unreliability of rivers, more than their bounty, pushed people to form states'.\nLead distractor (a): The early and failed floods of paragraph 2 are illustrations; the essay's claim is about what the river's unreliability produced, not how often harvests failed.\nIncorrect (c): Trade is never mentioned; the essay's contrast is between the river's bounty and its unreliability.\nIncorrect (d): Half right: the river did teach men 'to submit'. But they obeyed men who 'appeared to know the river's mind', not rulers who forced them by strength.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC main idea; thesis P4S1-3 and P5; lead = P2 detail; rival thesis (c) in the key's frame"},{"id":"IPMAT_VA_012","section":"VA","format":"RC","kind":"mcq","passage":"It is the habit of the guidebooks to say that the great rivers gave birth to the great nations, as though a civilisation were a crop that sprang up wherever the water was sweet and the soil soft. I have stood on the banks of several such rivers, and I confess that the first thing to strike me was not their bounty but their temper.\n\nThe river I knew best as a boy rose each year with no regard for our convenience. In some seasons it arrived a fortnight early and took the standing grain; in others it barely wet the fields, and the village went hungry on a full river's promise. My father, who farmed beside it all his life, could never say in March whether to sow early or late, and guessed wrong as often as right. An old ferryman once told me that he had never trusted it, not for a single season, and that this was the whole of his wisdom.\n\nI do not deny the silt. Without it the plains would have stayed marsh and scrub, and no amount of discipline would have fed a city. But silt alone makes a farmer, not a state. What makes a state is the need, felt by a thousand farmers at once, to know when the water will come. Out of that need arose the watchers who marked the rising on a post; out of their marks, a reckoning of days; and out of the reckoning, men who were obeyed because they appeared to know the river's mind.\n\nThus the embankment and the calendar, and in time the magistrate, are in most of the old valleys the children of anxiety rather than of plenty. A river that gave without fail would have bred contented villages, each sufficient to itself. It was the river that might fail which taught men to count, and in the end to submit.\n\nWe praise the river as a mother. I am inclined to think she was nearer to a stern tutor, whose gifts were real enough, but whose lessons were the larger inheritance.","stem":"Which of the following is most nearly OPPOSITE in meaning to 'temper' as used in para 1?","options":["fickleness","abundance","cheerfulness","reliability"],"answer":"reliability","answerIndex":3,"tags":["polarity flip","near-miss shade","context-blind sense","KEY"],"optionTags":["vocab-opposite","vocab-shade","vocab-context-blind",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: In paragraph 1 the writer says that what struck him about great rivers was 'not their bounty but their temper', and paragraph 2 shows what he means: the river 'rose each year with no regard for our convenience', early one year and barely at all the next.\nCorrect (d): 'Temper' here is the river's changeable, unpredictable nature, so its opposite is reliability: a river that rose on time, every year.\nLead distractor (b): Tempting because the sentence sets 'temper' against 'bounty'. But the two words name different things, the river's moods and its gifts; the opposite of a changeable temper is steadiness, not plenty.\nIncorrect (a): A synonym of 'temper' in this context, not an antonym: the river rose 'with no regard for our convenience'.\nIncorrect (c): The opposite of 'temper' in its everyday sense of anger, which is not the sense here.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC antonym in context, P1S2; option (a) is a synonym in context"},{"id":"IPMAT_VA_013","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nRavi had spent a month preparing to unveil the new delivery plan at Monday's meeting, but on Friday the regional head, who had seen his draft, described the same plan in a circular to every branch; by the time Ravi rose to speak, nobody in the room heard anything they had not already read, and he complained afterwards that she had managed to ____.","options":["steal the show","steal his lightning","steal the stage","steal his thunder"],"answer":"steal his thunder","answerIndex":3,"tags":["real expression, wrong meaning","corrupted fixed expression","corrupted fixed expression","KEY"],"optionTags":["vocab-wrong-idiom","gram-idiom","gram-idiom",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): To steal someone's thunder is to take the attention he expected by announcing his idea first. On Friday the regional head 'described the same plan in a circular to every branch', so by Monday Ravi had nothing new to unveil.\nIncorrect (a): A real expression with the wrong meaning: to steal the show is to outshine everyone at an event, but the regional head was not performing at the meeting; she 'described the same plan in a circular to every branch' days earlier.\nIncorrect (b): A corrupted form: the idiom is 'thunder', not 'lightning'.\nIncorrect (c): A corrupted form of 'steal the show', and wrong for the same reason: she 'described the same plan in a circular to every branch' before the meeting.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA idiom; pre-emption shown by the Friday circular (outside window)"},{"id":"IPMAT_VA_014","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nWhen a university laboratory announced that its new catalyst could split water using nothing but sunlight, the claim was ____ by science writers for weeks; within a year, however, three rival groups had tried to ____ it without success, and the journal ____ the paper a few weeks after the original team traced the effect to a contaminated sample.","options":["embargoed; replicate; pulled","celebrated; reproduce; retracted","trumpeted; patent; withdrew","lauded; confirm; reprinted"],"answer":"celebrated; reproduce; retracted","answerIndex":1,"tags":["collocation break","KEY","category/part-of-speech error","near-miss sense"],"optionTags":["sc-collocation",null,"vocab-category","vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): Blank 1: 'within a year, however' sets what followed against a warm first reception: celebrated. Blanks 2 and 3: the effect came from 'a contaminated sample', so the rival groups could not reproduce it and the journal retracted the paper.\nIncorrect (a): The killer is 'embargoed': an embargo is a journal's rule holding news back until a set time, not something writers do to a claim for weeks, and the 'within a year, however' that follows needs a warm first reception to turn against.\nIncorrect (c): The killer is 'patent': rival groups test someone else's result rather than patent it, and failing to patent it would not undercut the claim as 'however' requires; 'a contaminated sample' shows the result itself was false.\nIncorrect (d): The killer is 'reprinted': a journal does not reissue a paper whose effect came from 'a contaminated sample'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA cloze, 3 blanks; blanks 2 and 3 decided by the final clause"},{"id":"IPMAT_VA_015","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\nIn several fishing villages along India's western coast, the most listened-to programme on the local community radio station is not music or film songs but a ten-minute bulletin read out before dawn. It gives the day's wind and wave forecast, translated from the official marine warnings into the dialect the fishermen actually speak. ____ Boat owners say the bulletin has done more to keep their crews ashore on dangerous days than all the printed notices ever pinned up at the harbour office. The stations now plan to add a second bulletin in the evening, when the boats that did go out are expected back.","options":["Fish prices in the coastal markets have risen steadily as the catches brought in have grown smaller.","Most fishermen, however, still prefer to read the sea and the sky for themselves before they head out.","Before the bulletin, the same warnings had reached the boats in a language few crews could follow.","The volunteers who read out the bulletin each morning are mostly young people from the villages themselves."],"answer":"Before the bulletin, the same warnings had reached the boats in a language few crews could follow.","answerIndex":2,"tags":["off-topic insertion","stance contradiction","KEY","right topic, wrong focus"],"optionTags":["rc-out-of-scope","rc-reversal",null,"para-same-topic"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): 'The same warnings' picks up 'the official marine warnings' of the sentence before, and 'Before the bulletin' explains why translating them mattered: the crews could not follow them. That is what lets the next sentence say the bulletin did more than 'printed notices'.\nIncorrect (a): Off-topic insertion: fish prices and catches never come up, and the sentence gives the next one nothing to build on.\nIncorrect (b): Stance contradiction: if most fishermen still judged the sea for themselves, the bulletin could not have 'done more to keep their crews ashore'.\nIncorrect (d): Right topic, wrong focus: it is about who reads the bulletin, not why it works, so it cannot set up the comparison with printed notices that follows.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA paragraph completion, blank in the middle; key carries 'Before the bulletin' + 'the same warnings'"},{"id":"IPMAT_VA_016","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nThe engineers who surveyed the old iron bridge had gone out expecting to recommend its ____; what they found was rust that was ____ for the most part and rivets that were nearly all sound, and the municipality, which had already set aside money for a new crossing, was left with an awkward ____ when their report advised that the bridge be repaired and kept.","options":["replacement; cosmetic; deficit","dismantling; structural; windfall","renovation; skin-deep; excess","demolition; superficial; surplus"],"answer":"demolition; superficial; surplus","answerIndex":3,"tags":["polarity flip","polarity flip","near-miss sense","KEY"],"optionTags":["vocab-opposite","vocab-opposite","vocab-shade",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nCorrect (d): Blank 1: the municipality had 'set aside money for a new crossing', so the engineers expected to recommend demolition. Blank 2: with 'rivets that were nearly all sound' and a report advising that the bridge be 'repaired and kept', the rust was superficial. Blank 3: money for a crossing that will not be built is a surplus.\nIncorrect (a): The killer is 'deficit': repairing costs less than the 'new crossing' the money was meant for, so money is left over, not short.\nIncorrect (b): The killer is 'structural': rust that had weakened the structure would not end in a report advising that the bridge be 'repaired and kept'.\nIncorrect (c): The killer is 'renovation': the money set aside 'for a new crossing' shows that replacement was expected, and renovation is close to the repair the report did advise, which would leave no surprise and no money over.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA cloze, 3 blanks; blank 3 interlocks with blank 1"},{"id":"IPMAT_VA_017","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nThe temple's old elephant, carrying the brass howdah for the first time in a decade, ____ along the market street ahead of the drummers, who had to halt twice so that it could stand and rest, and the freshly laid tar kept the print of each foot for days afterwards.","options":["loped","lumbered","scampered","minced"],"answer":"lumbered","answerIndex":1,"tags":["near-miss sense","KEY","near-miss sense","collocation break"],"optionTags":["vocab-shade",null,"vocab-shade","sc-collocation"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): To lumber is to move slowly and heavily. The drummers 'had to halt twice so that it could stand and rest', and the tar 'kept the print of each foot', so the animal moved slowly and under great weight.\nIncorrect (a): Near-miss: to lope is to run with long, easy strides, but the drummers behind it 'had to halt twice so that it could stand and rest'.\nIncorrect (c): Near-miss: scampering is quick and light, while the tar 'kept the print of each foot for days afterwards'.\nIncorrect (d): Collocation break: to mince is to walk with small, dainty steps, which cannot describe an animal whose weight left 'the print of each foot' in the tar.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA collocation; manner implied by halts and footprints, never described"},{"id":"IPMAT_VA_018","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Marine biologists surveying a damaged reef noticed that young corals were settling far more thickly on one stretch of it than on any other.\n2. The finding has led the team to suggest that protecting such fish may do more for a recovering reef than planting corals by hand.\n3. At first they put this down to chance, since nothing in the water or the rock seemed to set that stretch apart.\n4. Only later did they realise that it lay beside a channel used by a school of grazing fish, which kept the rock clear of the algae that smother young corals.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"1342","answerIndex":null,"tags":[],"optionTags":[],"titaTraps":{"1324":"pj-topic-link","1432":"pj-time-order"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 1342\n1 opens: it introduces the biologists and the reef with full noun phrases.\n3 follows: 'this' is the thick settling in 1, and 'At first' starts the story of their explanation.\n4 follows: 'Only later' answers 'At first', and 'it' is 'that stretch' in 3.\n2 closes: 'The finding' and 'such fish' need the grazing fish of 4.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA parajumble, science news; order forced by this/At first/Only later/The finding"},{"id":"IPMAT_VA_019","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nThe founder's first two companies had folded within a year, and the investors who filed in to hear her third pitch looked distinctly ____ as the slides began; the list of hospitals already paying for her software, which she saved for the very end, had ____ the partner who had lost money on her second venture, and the round closed within a week.","options":["sceptical; worn down","euphoric; brought round","wary; won over","guarded; bought off"],"answer":"wary; won over","answerIndex":2,"tags":["near-miss sense","polarity flip","KEY","real expression, wrong meaning"],"optionTags":["vocab-shade","vocab-opposite",null,"vocab-wrong-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): Blank 1: the founder's 'first two companies had folded within a year', so the investors looked wary. Blank 2: the list was decisive, since 'the round closed within a week': it won over even the partner who had lost money on her.\nIncorrect (a): The killer is 'worn down': wearing someone down takes long, repeated pressure, but this was a single list 'which she saved for the very end'.\nIncorrect (b): The killer is 'euphoric': investors do not look elated at the third pitch of a founder whose 'first two companies had folded within a year', and a partner who still had to be won over shows the room began doubtful.\nIncorrect (d): The killer is 'bought off': to buy someone off is to bribe them, and 'the list of hospitals already paying for her software' bribes nobody.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA cloze, 2 blanks; blank 2 decided by the final clause"},{"id":"IPMAT_VA_020","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nOf the two proposals placed before the council, the second was clearly [[the best, since it would cost lesser and]] take less time to build.","options":["the better, since it would cost less and","the best, since it would cost lesser and","the better, since it would cost lesser and","the more better, since it would cost less and"],"answer":"the better, since it would cost less and","answerIndex":0,"tags":["KEY","original span (sounds right)","half-fix","new error introduced"],"optionTags":[null,"gram-sounds-right","gram-half-fix","gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (a)\nCorrect (a): With two proposals the comparative is needed: 'the better', not 'the best'. 'Less' is the adverb that goes with 'cost'; 'lesser' is an adjective used before a noun, as in 'a lesser sum'. Only (a) fixes both.\nIncorrect (b): The original: 'the best' of two, and 'cost lesser', are both wrong.\nIncorrect (c): Half-fix: corrects 'the better' but keeps 'cost lesser'.\nIncorrect (d): New error: 'more better' is a double comparative.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA comparative of two + less/lesser"},{"id":"IPMAT_VA_021","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Today she keeps a cash box mainly for the few who still prefer it, and says the printed code has outlasted three sets of scales.\n2. They had paid her in coins and notes for twenty years and saw no reason to stop.\n3. That changed the following monsoon, when a shortage of small change left her unable to return the right amount to anyone paying in cash.\n4. When a vegetable seller in a small market town first put up a printed payment code beside her scales, most of her customers ignored it.\n5. Within a few weeks, even her oldest customers had learned to scan the code, some of them coached over the phone by their grandchildren.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"42351","answerIndex":null,"tags":[],"optionTags":[],"titaTraps":{"14235":"pj-opener","42513":"pj-time-order"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 42351\n4 opens: 'a vegetable seller' is introduced with a full noun phrase.\n2 follows: 'They' are the customers who ignored the code in 4.\n3 follows: 'That changed' needs the habit described in 2, and 'the following monsoon' moves the story on.\n5 follows: 'Within a few weeks' counts from the shortage of change in 3.\n1 closes: 'Today' brings the story to the present, and 'she' needs the seller of 4.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA parajumble, technology; order forced by They/That changed/Within weeks/Today"},{"id":"IPMAT_VA_022","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\nA small but growing number of restaurants now leave the bill blank and ask diners to pay whatever they think the meal was worth. The idea sounds like a recipe for losses, and some owners admit they expected to close within a month. ____ Diners who know they are being trusted, it seems, are reluctant to be seen taking advantage, and a few regulars pay more than the menu price would have been. The owners say the harder problem is not cheating but uncertainty: with no fixed price, they cannot predict from one week to the next what the kitchen will earn.","options":["As they feared, most have found that diners pay well below what the meal cost to make.","Yet most of them report taking in roughly what they would have charged anyway.","Food delivery apps have meanwhile changed the way many people choose where to eat.","Some of these restaurants are run by charities that also train young people as cooks."],"answer":"Yet most of them report taking in roughly what they would have charged anyway.","answerIndex":1,"tags":["stance contradiction","KEY","off-topic insertion","right topic, wrong focus"],"optionTags":["rc-reversal",null,"rc-out-of-scope","para-same-topic"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): 'Yet' sets the result against the owners' fear of losses, and 'most of them' refers to the owners. The next sentence then explains the result: diners who are trusted do not take advantage.\nIncorrect (a): Stance contradiction: the next sentences say diners are reluctant to take advantage and that cheating is not the harder problem.\nIncorrect (c): Off-topic insertion: delivery apps play no part in the paragraph.\nIncorrect (d): Right topic, wrong focus: who runs the restaurants does not explain what diners pay, which the next sentence goes on to explain.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA paragraph completion, blank in the middle; key carries 'Yet' + 'most of them'"},{"id":"IPMAT_VA_023","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nWhen the export orders returned, the mill, which had let half its weavers go during the slump, ____ forty workers within a month; the foreman, who had to show every one of them how to thread a shuttle, said he had not been so busy since his own first year on the looms.","options":["took back","took up","took on","took over"],"answer":"took on","answerIndex":2,"tags":["real expression, wrong meaning","corrupted fixed expression","KEY","corrupted fixed expression"],"optionTags":["vocab-wrong-idiom","gram-idiom",null,"gram-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): To take on workers is to hire them. The foreman 'had to show every one of them how to thread a shuttle', so the forty were new to the loom, not the weavers let go in the slump.\nIncorrect (a): A real phrasal verb with the wrong meaning here: taking back would mean rehiring the weavers let go in the slump, and trained weavers would not need to be shown 'how to thread a shuttle'.\nIncorrect (b): Wrong particle: one takes up a hobby, a post or a cause, not workers; and the foreman who 'had to show every one of them' was training new hands.\nIncorrect (d): Wrong particle: to take over is to assume control of something, such as another firm, and those workers would already know their trade, but the foreman 'had to show every one of them how to thread a shuttle'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA phrasal verb; 'weavers go during the slump' in the window points to 'took back'; deciding clue after the window"},{"id":"IPMAT_VA_024","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nCommentators had written off the seventeen-year-old after her first two games; across the later rounds she ____ in game after game, and by the final morning the same commentators were working out whether a draw would be enough to give her the title; what struck her coach was the ____ she showed during her opponents' long silences, never once glancing at the clock.","options":["rallied; equanimity","relented; composure","revived; alacrity","surged; abandon"],"answer":"rallied; equanimity","answerIndex":0,"tags":["KEY","near-miss sense","near-miss sense","near-miss sense"],"optionTags":[null,"vocab-shade","vocab-shade","vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): Blank 1: by the final morning commentators were working out 'whether a draw would be enough to give her the title', so she recovered strongly: rallied. Blank 2: sitting through her opponents' thinking time, 'never once glancing at the clock', is calm composure: equanimity.\nIncorrect (b): The killer is 'relented': to relent is to give way or soften, which cannot leave commentators working out 'whether a draw would be enough to give her the title'.\nIncorrect (c): The killer is 'alacrity': alacrity is brisk eagerness to act, but she sat out 'her opponents' long silences', 'never once glancing at the clock'.\nIncorrect (d): The killer is 'abandon': abandon is a lack of restraint, the opposite of sitting still and 'never once glancing at the clock'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA cloze, 2 blanks; both decided after the blank"},{"id":"IPMAT_VA_025","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\nFor an hour every morning and afternoon, the lanes outside three government schools in one old neighbourhood of a large Indian city are now closed to motor traffic. Parents who used to drive their children to the gate walk the last few hundred metres instead, and the hawkers who crowded the pavement have been given fixed spots further down the road. Teachers report that pupils arrive calmer and that the first lesson starts on time more often. Shopkeepers on the lanes, who had fought the closure, now say that parents on foot stop to buy things that parents in cars never did. ____","options":["Many of the city's government schools still lack proper playgrounds and libraries.","The lanes were first laid out long before cars, when the neighbourhood was a cluster of weavers' homes.","The shopkeepers, however, continue to press the municipality to reopen the lanes.","That change of heart has persuaded the municipality to try the closures outside schools in two other wards."],"answer":"That change of heart has persuaded the municipality to try the closures outside schools in two other wards.","answerIndex":3,"tags":["off-topic insertion","right topic, wrong focus","stance contradiction","KEY"],"optionTags":["rc-out-of-scope","para-same-topic","rc-reversal",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): 'That change of heart' refers back to the shopkeepers who 'had fought the closure' and now welcome parents on foot. Turning their conversion into a decision to extend the closures closes the paragraph.\nIncorrect (a): Off-topic insertion: playgrounds and libraries are a different problem from traffic outside schools.\nIncorrect (b): Right topic, wrong focus: the history of the lanes says nothing about the closure's effects, which every earlier sentence reports.\nIncorrect (c): Stance contradiction: the sentence before says the shopkeepers now welcome parents on foot.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA paragraph completion, blank at the close; key carries 'That change of heart'"},{"id":"IPMAT_VA_026","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nArchivists had long assumed that the palm-leaf bundles in the temple storeroom were too ____ to be opened, and for a century nobody tried; it took a conservator, who ____ them slowly over a weekend in a cabinet of warm, damp air, to loosen the leaves enough to be turned by hand.","options":["brittle; conditioned","fragile; desiccated","mouldy; humidified","crumbly; lacquered"],"answer":"brittle; conditioned","answerIndex":0,"tags":["KEY","polarity flip","near-miss sense","collocation break"],"optionTags":[null,"vocab-opposite","vocab-shade","sc-collocation"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): Blank 1: the leaves had to be loosened enough to be turned ('loosen the leaves enough to be turned by hand'), so the fear was that they were stiff and would crack: brittle. Blank 2: a weekend in 'a cabinet of warm, damp air' is conditioning, which restores the leaves' moisture.\nIncorrect (b): The killer is 'desiccated' (dried out): nothing is dried in 'a cabinet of warm, damp air', and drying would not loosen the leaves.\nIncorrect (c): The killer is 'mouldy': damp air would feed mould, and the cure, to 'loosen the leaves enough to be turned by hand', shows the problem was stiffness.\nIncorrect (d): The killer is 'lacquered': lacquer is a coating, and coating the bundles would not 'loosen the leaves enough to be turned by hand'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA cloze, 2 blanks; blank 1 decided after it"},{"id":"IPMAT_VA_027","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\n[[Not once the minister did visit the flooded villages, although he has promised]] to do so in every speech he made that month.","options":["Not once the minister did visit the flooded villages, although he has promised","Not once did the minister visit the flooded villages, although he has promised","Not once did the minister visited the flooded villages, although he had promised","Not once did the minister visit the flooded villages, although he had promised"],"answer":"Not once did the minister visit the flooded villages, although he had promised","answerIndex":3,"tags":["original span (sounds right)","half-fix","new error introduced","KEY"],"optionTags":["gram-sounds-right","gram-half-fix","gram-tense-marker",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): A sentence that opens with a negative adverbial such as 'Not once' inverts subject and auxiliary: 'Not once did the minister visit'. The promises belong to a finished past period ('every speech he made that month'), so the verb is 'had promised', not 'has promised'.\nIncorrect (a): The original: no inversion after 'Not once', and 'has promised' clashes with 'he made that month'.\nIncorrect (b): Half-fix: inverts correctly but keeps 'has promised'.\nIncorrect (c): New error: after 'did' the verb must be the bare 'visit', not 'visited'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA negative inversion + tense"},{"id":"IPMAT_VA_028","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nThe herbal tonic that the old vaidya had handed out for forty years was ____ last spring, and his patients, who still come to his door, now leave with nothing more than advice; the state's laboratory had found lead in three batches.","options":["prescribed","ascribed","inscribed","proscribed"],"answer":"proscribed","answerIndex":3,"tags":["confusable/homophone sibling","confusable/homophone sibling","confusable/homophone sibling","KEY"],"optionTags":["vocab-sound-alike","vocab-sound-alike","vocab-sound-alike",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): Proscribed means officially banned. Tests 'found lead in three batches', and patients 'now leave with nothing more than advice', so the tonic can no longer be given.\nIncorrect (a): Sound-alike: to prescribe is to recommend a medicine, and a tonic handed out for forty years was not newly recommended; patients who 'now leave with nothing more than advice' can no longer get it.\nIncorrect (b): Sound-alike: to ascribe is to attribute something to a cause, and it needs 'to'; nothing in the sentence is being attributed to anything.\nIncorrect (c): Sound-alike: to inscribe is to write or carve words, which makes no sense for a tonic that 'the old vaidya had handed out'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA confusable proscribe/prescribe; medical surface pulls to 'prescribed'; agent moved out of the window"},{"id":"IPMAT_VA_029","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Our guest today is Dr Rukmini Sen, who has spent thirty years in laboratories and nearly as long on grant committees. Dr Sen, a lot of our listeners would say the answer is obvious: with so many problems pressing on us, public money should go to research that solves them, not to scientists following their curiosity.\nSEN: I hear that often, and I don't think it's foolish. But it rests on a picture of research I'd want to complicate. I find it useful to think of two kinds of work: compass research and map research.\nHOST: Go on.\nSEN: Compass research knows its destination. You want a cheaper vaccine or a hardier wheat, and you need a heading to get there. Map research doesn't know where it's going; it surveys ground nobody has asked about. Most of it leads nowhere you'd want to travel. But a compass is no use without a map, and the maps we rely on today were mostly drawn by people who had no idea who would use them.\nHOST: So the curiosity people are the real heroes.\nSEN: No, and that's the opposite mistake. Map-makers can be self-indulgent, and plenty of compass projects have stumbled onto coastlines nobody expected. In my own field, at least, some of the best maps came out of missions that failed. The two kinds bleed into each other.\nHOST: Then what's the problem? Fund both and let them bleed.\nSEN: The problem is the form. Almost every application I've reviewed asks what the work will achieve, and by when. A map-maker can't honestly answer that. So she learns to write a compass proposal for map work. She promises a destination, the committee funds the promise, and three years later she reports progress towards it, because that's what the next grant will ask about. Gradually she stops surveying and starts steering.\nHOST: That sounds like a small bureaucratic complaint.\nSEN: It sounds small. But repeat it across a generation and you get a science with excellent compasses and an ageing set of maps. Nobody decided that. It happened one application at a time.\nHOST: So what would you change?\nSEN: I'm wary of grand fixes. But a funder could keep back some share of its money for proposals that are allowed to say 'I don't know where this goes', and mean it.","stem":"In the conversation, the view that public money should go mainly to research that solves pressing problems is","options":["voiced by the host for his listeners, and thought too simple by Sen.","held by the host himself, and thought too simple by Sen.","voiced by the host for his listeners, and dismissed by Sen as foolish.","voiced by Sen at the outset of the talk, and then questioned by the host."],"answer":"voiced by the host for his listeners, and thought too simple by Sen.","answerIndex":0,"tags":["KEY","wrong voice","reversal","wrong voice"],"optionTags":[null,"rc-wrong-voice","rc-reversal","rc-wrong-voice"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nExplanation: The host opens by saying 'a lot of our listeners' would find the answer obvious: public money should go to research that solves problems. Sen replies that the view is not foolish but 'rests on a picture of research I'd want to complicate'.\nCorrect (a): The host puts the view in his listeners' mouths, and Sen neither accepts nor dismisses it; 'thought too simple' paraphrases 'a picture of research I'd want to complicate'.\nLead distractor (b): Gets Sen's response right but the host's position wrong: he attributes the view to 'a lot of our listeners' and never says it is his own.\nIncorrect (c): Contradicts Sen's own words: 'I don't think it's foolish'.\nIncorrect (d): Swaps the speakers: th

e host raises the view in his opening question, and Sen responds to it.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC speaker attribution; host H1 (listeners' view) vs Sen S1"},{"id":"IPMAT_VA_030","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Our guest today is Dr Rukmini Sen, who has spent thirty years in laboratories and nearly as long on grant committees. Dr Sen, a lot of our listeners would say the answer is obvious: with so many problems pressing on us, public money should go to research that solves them, not to scientists following their curiosity.\nSEN: I hear that often, and I don't think it's foolish. But it rests on a picture of research I'd want to complicate. I find it useful to think of two kinds of work: compass research and map research.\nHOST: Go on.\nSEN: Compass research knows its destination. You want a cheaper vaccine or a hardier wheat, and you need a heading to get there. Map research doesn't know where it's going; it surveys ground nobody has asked about. Most of it leads nowhere you'd want to travel. But a compass is no use without a map, and the maps we rely on today were mostly drawn by people who had no idea who would use them.\nHOST: So the curiosity people are the real heroes.\nSEN: No, and that's the opposite mistake. Map-makers can be self-indulgent, and plenty of compass projects have stumbled onto coastlines nobody expected. In my own field, at least, some of the best maps came out of missions that failed. The two kinds bleed into each other.\nHOST: Then what's the problem? Fund both and let them bleed.\nSEN: The problem is the form. Almost every application I've reviewed asks what the work will achieve, and by when. A map-maker can't honestly answer that. So she learns to write a compass proposal for map work. She promises a destination, the committee funds the promise, and three years later she reports progress towards it, because that's what the next grant will ask about. Gradually she stops surveying and starts steering.\nHOST: That sounds like a small bureaucratic complaint.\nSEN: It sounds small. But repeat it across a generation and you get a science with excellent compasses and an ageing set of maps. Nobody decided that. It happened one application at a time.\nHOST: So what would you change?\nSEN: I'm wary of grand fixes. But a funder could keep back some share of its money for proposals that are allowed to say 'I don't know where this goes', and mean it.","stem":"As Sen uses it, the term 'map research' refers to","options":["exploratory work whose eventual uses its makers seldom foresee.","work that charts in detail the ground a mission has already picked.","the new ground that failed missions will sometimes stumble on by accident.","the early planning stage of a project, before its heading is fixed."],"answer":"exploratory work whose eventual uses its makers seldom foresee.","answerIndex":0,"tags":["KEY","word match","true but not the answer","false link"],"optionTags":[null,"rc-word-match","rc-true-not-answer","rc-false-link"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nExplanation: Sen says map research 'doesn't know where it's going' and 'surveys ground nobody has asked about'. Most of it leads nowhere, but the maps we rely on were 'mostly drawn by people who had no idea who would use them'.\nCorrect (a): 'Mostly drawn by people who had no idea who would use them' = 'exploratory work whose eventual uses its makers seldom foresee'; 'seldom' carries Sen's 'mostly'.\nLead distractor (b): Borrows 'ground' and the map image but reverses Sen's point: map research surveys ground 'nobody has asked about', not ground a mission has chosen.\nIncorrect (c): True that failed missions sometimes produce maps, but that is one source of maps, not what the term means.\nIncorrect (d): Treats map research as a stage of compass work; Sen presents two kinds of research that 'bleed into each other', not two phases of one project.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC term, Sen S3; lead borrows the map image"},{"id":"IPMAT_VA_031","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Our guest today is Dr Rukmini Sen, who has spent thirty years in laboratories and nearly as long on grant committees. Dr Sen, a lot of our listeners would say the answer is obvious: with so many problems pressing on us, public money should go to research that solves them, not to scientists following their curiosity.\nSEN: I hear that often, and I don't think it's foolish. But it rests on a picture of research I'd want to complicate. I find it useful to think of two kinds of work: compass research and map research.\nHOST: Go on.\nSEN: Compass research knows its destination. You want a cheaper vaccine or a hardier wheat, and you need a heading to get there. Map research doesn't know where it's going; it surveys ground nobody has asked about. Most of it leads nowhere you'd want to travel. But a compass is no use without a map, and the maps we rely on today were mostly drawn by people who had no idea who would use them.\nHOST: So the curiosity people are the real heroes.\nSEN: No, and that's the opposite mistake. Map-makers can be self-indulgent, and plenty of compass projects have stumbled onto coastlines nobody expected. In my own field, at least, some of the best maps came out of missions that failed. The two kinds bleed into each other.\nHOST: Then what's the problem? Fund both and let them bleed.\nSEN: The problem is the form. Almost every application I've reviewed asks what the work will achieve, and by when. A map-maker can't honestly answer that. So she learns to write a compass proposal for map work. She promises a destination, the committee funds the promise, and three years later she reports progress towards it, because that's what the next grant will ask about. Gradually she stops surveying and starts steering.\nHOST: That sounds like a small bureaucratic complaint.\nSEN: It sounds small. But repeat it across a generation and you get a science with excellent compasses and an ageing set of maps. Nobody decided that. It happened one application at a time.\nHOST: So what would you change?\nSEN: I'm wary of grand fixes. But a funder could keep back some share of its money for proposals that are allowed to say 'I don't know where this goes', and mean it.","stem":"The claim that some of the best maps have come out of failed missions is made by","options":["the host, who suggests that curiosity may be the true source of discovery.","Sen, who offers it as holding at least in her own field.","Sen, who presents it as true of science in general.","Sen, to show that mission research deserves the larger share of money."],"answer":"Sen, who offers it as holding at least in her own field.","answerIndex":1,"tags":["wrong voice","KEY","scope shift","false link"],"optionTags":["rc-wrong-voice",null,"rc-scope-shift","rc-false-link"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: After the host calls curiosity researchers 'the real heroes', Sen calls that 'the opposite mistake' and adds: 'In my own field, at least, some of the best maps came out of missions that failed.'\nCorrect (b): The claim is Sen's, and 'at least' limits it to her own field.\nLead distractor (a): The host's line about 'the real heroes' comes just before, so the claim is easy to misattribute; but the host says nothing about failed missions, and Sen makes the claim to correct him.\nIncorrect (c): Drops Sen's limit, 'In my own field, at least', and extends the claim to science in general.\nIncorrect (d): Sen uses the example to show that the two kinds of research bleed into each other, not to argue for more money for mission research.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC speaker attribution and scope, Sen S4"},{"id":"IPMAT_VA_032","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Our guest today is Dr Rukmini Sen, who has spent thirty years in laboratories and nearly as long on grant committees. Dr Sen, a lot of our listeners would say the answer is obvious: with so many problems pressing on us, public money should go to research that solves them, not to scientists following their curiosity.\nSEN: I hear that often, and I don't think it's foolish. But it rests on a picture of research I'd want to complicate. I find it useful to think of two kinds of work: compass research and map research.\nHOST: Go on.\nSEN: Compass research knows its destination. You want a cheaper vaccine or a hardier wheat, and you need a heading to get there. Map research doesn't know where it's going; it surveys ground nobody has asked about. Most of it leads nowhere you'd want to travel. But a compass is no use without a map, and the maps we rely on today were mostly drawn by people who had no idea who would use them.\nHOST: So the curiosity people are the real heroes.\nSEN: No, and that's the opposite mistake. Map-makers can be self-indulgent, and plenty of compass projects have stumbled onto coastlines nobody expected. In my own field, at least, some of the best maps came out of missions that failed. The two kinds bleed into each other.\nHOST: Then what's the problem? Fund both and let them bleed.\nSEN: The problem is the form. Almost every application I've reviewed asks what the work will achieve, and by when. A map-maker can't honestly answer that. So she learns to write a compass proposal for map work. She promises a destination, the committee funds the promise, and three years later she reports progress towards it, because that's what the next grant will ask about. Gradually she stops surveying and starts steering.\nHOST: That sounds like a small bureaucratic complaint.\nSEN: It sounds small. But repeat it across a generation and you get a science with excellent compasses and an ageing set of maps. Nobody decided that. It happened one application at a time.\nHOST: So what would you change?\nSEN: I'm wary of grand fixes. But a funder could keep back some share of its money for proposals that are allowed to say 'I don't know where this goes', and mean it.","stem":"In Sen's account, a researcher who 'stops surveying and starts steering' is one who","options":["has begun heading for a fixed goal, as her committee told her to.","has moved from research to running the committee that funds it.","has begun aiming her work at the result her grant proposal promised.","has given up grant money altogether in order to return to curiosity-led work."],"answer":"has begun aiming her work at the result her grant proposal promised.","answerIndex":2,"tags":["half right","literal reading","KEY","reversal"],"optionTags":["rc-half-right","rc-literal",null,"rc-reversal"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nExplanation: Sen describes a map-maker who writes a compass proposal, promises a destination, gets funded and then reports progress towards that destination 'because that's what the next grant will ask about'. 'Gradually she stops surveying and starts steering.'\nCorrect (c): In Sen's metaphor, surveying is exploring open ground and steering is heading for a fixed destination; here the destination is the one her proposal promised.\nLead distractor (a): Half right: she is now heading for a fixed goal. But no committee tells her to; she promised the destination herself to win funding, because 'that's what the next grant will ask about'.\nIncorrect (b): Reads 'steering' as in a steering committee; Sen means heading for a fixed destination instead of exploring.\nIncorrect (d): Reverses the story: the researcher drifts into goal-driven work to keep the grants coming; she does not give up the grants.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC term, Sen S6; lead half right"},{"id":"IPMAT_VA_033","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Our guest today is Dr Rukmini Sen, who has spent thirty years in laboratories and nearly as long on grant committees. Dr Sen, a lot of our listeners would say the answer is obvious: with so many problems pressing on us, public money should go to research that solves them, not to scientists following their curiosity.\nSEN: I hear that often, and I don't think it's foolish. But it rests on a picture of research I'd want to complicate. I find it useful to think of two kinds of work: compass research and map research.\nHOST: Go on.\nSEN: Compass research knows its destination. You want a cheaper vaccine or a hardier wheat, and you need a heading to get there. Map research doesn't know where it's going; it surveys ground nobody has asked about. Most of it leads nowhere you'd want to travel. But a compass is no use without a map, and the maps we rely on today were mostly drawn by people who had no idea who would use them.\nHOST: So the curiosity people are the real heroes.\nSEN: No, and that's the opposite mistake. Map-makers can be self-indulgent, and plenty of compass projects have stumbled onto coastlines nobody expected. In my own field, at least, some of the best maps came out of missions that failed. The two kinds bleed into each other.\nHOST: Then what's the problem? Fund both and let them bleed.\nSEN: The problem is the form. Almost every application I've reviewed asks what the work will achieve, and by when. A map-maker can't honestly answer that. So she learns to write a compass proposal for map work. She promises a destination, the committee funds the promise, and three years later she reports progress towards it, because that's what the next grant will ask about. Gradually she stops surveying and starts steering.\nHOST: That sounds like a small bureaucratic complaint.\nSEN: It sounds small. But repeat it across a generation and you get a science with excellent compasses and an ageing set of maps. Nobody decided that. It happened one application at a time.\nHOST: So what would you change?\nSEN: I'm wary of grand fixes. But a funder could keep back some share of its money for proposals that are allowed to say 'I don't know where this goes', and mean it.","stem":"Which of the following is NOT a view that Sen expresses in the conversation?","options":["Most map research leads nowhere that anyone would actually want to go.","Researchers who follow their curiosity can sometimes be self-indulgent.","Grant forms lead researchers to promise destinations they cannot know.","Most public money should probably go to research with no set goal."],"answer":"Most public money should probably go to research with no set goal.","answerIndex":3,"tags":["scope shift","reversal","true but not the answer","KEY"],"optionTags":["rc-scope-shift","rc-reversal","rc-true-not-answer",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: The stem asks for the option Sen does NOT express. Three options paraphrase her: most map research leads nowhere; map-makers can be self-indulgent; application forms make map-makers promise destinations.\nCorrect (d): Sen's only proposal is that a funder could 'keep back some share of its money' for proposals that may not know where they lead, and she is 'wary of grand fixes'. 'Most public money' goes well beyond that.\nLead distractor (a): It sounds like an overstatement, but it is Sen's own claim: 'Most of it leads nowhere you'd want to travel.'\nIncorrect (b): Sen says 'Map-makers can be self-indulgent', so this is her view, even if it seems at odds with her defence of map research.\nIncorrect (c): Sen says almost every application asks what the work will achieve and by when, so map-makers learn to promise destinations.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC negative stem; key = one-notch distortion of S9 ('some share' -> 'most')"},{"id":"IPMAT_VA_034","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Our guest today is Dr Rukmini Sen, who has spent thirty years in laboratories and nearly as long on grant committees. Dr Sen, a lot of our listeners would say the answer is obvious: with so many problems pressing on us, public money should go to research that solves them, not to scientists following their curiosity.\nSEN: I hear that often, and I don't think it's foolish. But it rests on a picture of research I'd want to complicate. I find it useful to think of two kinds of work: compass research and map research.\nHOST: Go on.\nSEN: Compass research knows its destination. You want a cheaper vaccine or a hardier wheat, and you need a heading to get there. Map research doesn't know where it's going; it surveys ground nobody has asked about. Most of it leads nowhere you'd want to travel. But a compass is no use without a map, and the maps we rely on today were mostly drawn by people who had no idea who would use them.\nHOST: So the curiosity people are the real heroes.\nSEN: No, and that's the opposite mistake. Map-makers can be self-indulgent, and plenty of compass projects have stumbled onto coastlines nobody expected. In my own field, at least, some of the best maps came out of missions that failed. The two kinds bleed into each other.\nHOST: Then what's the problem? Fund both and let them bleed.\nSEN: The problem is the form. Almost every application I've reviewed asks what the work will achieve, and by when. A map-maker can't honestly answer that. So she learns to write a compass proposal for map work. She promises a destination, the committee funds the promise, and three years later she reports progress towards it, because that's what the next grant will ask about. Gradually she stops surveying and starts steering.\nHOST: That sounds like a small bureaucratic complaint.\nSEN: It sounds small. But repeat it across a generation and you get a science with excellent compasses and an ageing set of maps. Nobody decided that. It happened one application at a time.\nHOST: So what would you change?\nSEN: I'm wary of grand fixes. But a funder could keep back some share of its money for proposals that are allowed to say 'I don't know where this goes', and mean it.","stem":"Which of the following best states Sen's main point?","options":["Some of the most useful maps in science came from missions that failed.","Grant forms that demand a fixed destination are slowly turning exploration into goal-driven work.","Curiosity-driven research deserves a larger share of public money than it now gets.","Science advances fastest when researchers are left free of stated goals."],"answer":"Grant forms that demand a fixed destination are slowly turning exploration into goal-driven work.","answerIndex":1,"tags":["detail as main idea","KEY","wrong voice","scope shift"],"optionTags":["rc-detail-as-main",null,"rc-wrong-voice","rc-scope-shift"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: Sen introduces compasses and maps, rejects both the popular view and its opposite, and only late in the conversation names 'the problem': application forms. Researchers who cannot know where their work leads are pushed to promise destinations, and over a generation science ends up with 'excellent compasses and an ageing set of maps'.\nCorrect (b): Her main point is the slow effect of the form, not the merit of either kind of research; 'Gradually she stops surveying and starts steering' is the process the key describes.\nLead distractor (a): A detail Sen uses to show that the two kinds of research bleed into each other, and one she limits to her own field.\nIncorrect (c): Close to the host's 'real heroes' line, which Sen calls 'the opposite mistake'; she asks only that some money be kept back.\nIncorrect (d): Broader than anything Sen says; she concedes that map-makers can be self-indulgent and that compass projects find coastlines too.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC main idea; thesis S6-S7 (late)"},{"id":"IPMAT_VA_035","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Shopkeepers set their own clocks by it, and schoolchildren glanced up at it as they ran for the morning bell.\n2. For a long time, the large clock above a town's railway platform was the only timepiece many of its residents ever consulted.\n3. But the cheap wristwatch, and later the mobile phone, put the exact time in every pocket, and fewer people looked up at the platform at all.\n4. Some stations have since let their old clocks stop, and in a few towns residents have raised money to have them wound again, more for the sight than for the time.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"2134","answerIndex":null,"tags":[],"optionTags":[],"titaTraps":{"1234":"pj-opener","2143":"pj-time-order"},"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 2134\n2 opens: 'the large clock above a town's railway platform' is a full noun phrase and needs nothing before it.\n1 follows: 'it' is the platform clock of 2.\n3 follows: 'But' turns against the town's reliance on the clock, and cannot open.\n4 closes: 'since' counts from the change in 3, and 'their old clocks' needs the platform clocks already described.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA parajumble, free choice (station clocks); order forced by it/But/since"},{"id":"IPMAT_VA_036","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nEven as customers drift away, the company [[has refused to lower their prices, despite the fact that its rivals has]] already done so twice this year.","options":["has refused to lower their prices, despite the fact that its rivals has","has refused to lower its prices, despite the fact that its rivals have","has refused to lower its prices, despite the fact that its rivals has","has refused lowering its prices, despite the fact that its rivals have"],"answer":"has refused to lower its prices, despite the fact that its rivals have","answerIndex":1,"tags":["original span (sounds right)","KEY","half-fix","new error introduced"],"optionTags":["gram-sounds-right",null,"gram-half-fix","gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): 'The company' is singular, so its possessive is 'its prices', not 'their prices'. 'Rivals' is plural, so it takes 'have', not 'has'. Only (b) fixes both.\nIncorrect (a): The original: 'their prices' and 'its rivals has' are both wrong.\nIncorrect (c): Half-fix: corrects 'its prices' but keeps 'rivals has'.\nIncorrect (d): New error: 'refuse' takes a to-infinitive, so 'refused lowering' is wrong.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA its/their with a singular subject + agreement"},{"id":"IPMAT_VA_037","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nIn his first term the new warden let the senior boys choose their own lights-out and, on a single afternoon, granted two house captains' requests for opposite rules; the matron, who had seen him pacing the corridor at midnight after a junior called him strict, said she had never known a man so ____.","options":["complaisant","complacent","complicit","complimentary"],"answer":"complaisant","answerIndex":0,"tags":["KEY","confusable/homophone sibling","confusable/homophone sibling","confusable/homophone sibling"],"optionTags":[null,"vocab-sound-alike","vocab-sound-alike","vocab-sound-alike"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): Complaisant means eager to please and quick to give way. A warden who grants opposite requests in one afternoon and is seen 'pacing the corridor at midnight after a junior called him strict' wants above all to be liked.\nIncorrect (b): Sound-alike: complacent means smugly unconcerned, but a man seen 'pacing the corridor at midnight after a junior called him strict' is anything but unconcerned.\nIncorrect (c): Sound-alike: complicit means sharing in wrongdoing; letting the boys 'choose their own lights-out' is indulgence, not a crime he takes part in.\nIncorrect (d): Sound-alike: complimentary means full of praise; the sentence shows him giving way ('granted two house captains' requests for opposite rules'), not praising anyone.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA confusable complaisant/complacent; topic (lax warden) pulls to 'complacent'; anxiety clue outside window"},{"id":"IPMAT_VA_038","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nShe is widely [[regarded to be the finest sitar player of her generation, and her recordings sells]] in countries where few people have ever heard a raga performed live.","options":["regarded as the finest sitar player of her generation, and her recordings sell","regarded to be the finest sitar player of her generation, and her recordings sells","regarded as the finest sitar player of her generation, and her recordings sells","regarded as the most finest sitar player of her generation, and her recordings sell"],"answer":"regarded as the finest sitar player of her generation, and her recordings sell","answerIndex":0,"tags":["KEY","original span (sounds right)","half-fix","new error introduced"],"optionTags":[null,"gram-sounds-right","gram-half-fix","gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): 'Regard' takes 'as': she is 'regarded as' the finest player. 'Recordings' is plural, so the verb is 'sell'. Only (a) fixes both.\nIncorrect (b): The original: 'regarded to be' and 'recordings sells' are both wrong.\nIncorrect (c): Half-fix: corrects 'regarded as' but keeps 'recordings sells'.\nIncorrect (d): New error: fixes both points but adds the double superlative 'most finest'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA 'regarded as' + subject-verb agreement"},{"id":"IPMAT_VA_039","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Yet the system's speed depended entirely on the posts being staffed day and night, which made it ruinously expensive to keep up.\n2. Each runner covered only a short stage, perhaps a few miles, before handing the pouch to a fresh man waiting at the next post.\n3. When the treasuries of these kingdoms ran low, the waiting posts were usually the first expense to go, and the relays quietly broke down.\n4. Because no one ran far, the pouch itself never stopped moving, and a letter could cross a province faster than any single horseman.\n5. Long before the telegraph, several large kingdoms moved urgent messages across their territory by relays of runners.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"52413","answerIndex":null,"tags":[],"optionTags":[],"titaTraps":{"25413":"pj-opener","52143":"pj-pair-broken"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 52413\n5 opens: it introduces the kingdoms and the relays with full noun phrases and refers back to nothing.\n2 follows: 'Each runner' needs the relays of runners in 5.\n4 follows: 'Because no one ran far' builds on the short stages of 2.\n1 follows: 'Yet the system's speed' turns against the speed claimed in 4, and 'Yet' cannot open.\n3 closes: 'these kingdoms' and 'the waiting posts' need 5 and 1, and running out of money follows from 'ruinously expensive'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA parajumble, history; order forced by Each/Because/Yet/these"},{"id":"IPMAT_VA_040","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nWhen the judgment was finally read out, the residents of the colony had the builder's permit cancelled and their park handed back to them; but the case had dragged on for eleven years, the association had sold its community hall to pay the lawyers, and most of the families who signed the first petition had long since moved away, so that the secretary, looking around the half-empty meeting room, called it ____.","options":["a moral victory","a Pyrrhic victory","a moral triumph","a Pyrrhus victory"],"answer":"a Pyrrhic victory","answerIndex":1,"tags":["real expression, wrong meaning","KEY","corrupted fixed expression","corrupted fixed expression"],"optionTags":["vocab-wrong-idiom",null,"gram-idiom","gram-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): A Pyrrhic victory is one won at such cost that it is hardly worth winning. The residents 'had the builder's permit cancelled and their park handed back to them', so they won; the sold hall and the families who moved away are the cost.\nIncorrect (a): A real expression with the wrong meaning: a moral victory is a defeat in which you are proved right, but the residents 'had the builder's permit cancelled and their park handed back to them', so they won.\nIncorrect (c): A corrupted form of 'moral victory', and wrong for the same reason: they 'had the builder's permit cancelled and their park handed back to them'.\nIncorrect (d): A corrupted form: the expression takes the adjective 'Pyrrhic', not the king's name; and 'sold its community hall' shows the win was ruinous, which only the real expression conveys.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA idiom; win shown by 'permit cancelled ... park handed back' (outside window); lead 'moral victory' fits the half-empty room"},{"id":"IPMAT_VA_041","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\n____ Volunteers hang cages of young oysters from piers and private jetties, check on them every few weeks and, once the shellfish are large enough, carry them out to reef beds laid down by the city. Each adult oyster filters the water around it as it feeds, and a reef gives shelter to small fish and crabs. The work is slow: it takes years before a reef is large enough to make a measurable difference to a harbour. Organisers say the bigger change so far has been in the volunteers, many of whom had never looked closely at the water they live beside.","options":["In several port cities, residents are helping to bring back the oyster reefs their harbours once had.","Efforts to restore oyster reefs in city harbours have mostly been left to government agencies and paid divers.","Port cities have long depended on their fishing fleets for a large share of their income.","Many people who eat oysters have little idea of how the shellfish are actually grown."],"answer":"In several port cities, residents are helping to bring back the oyster reefs their harbours once had.","answerIndex":0,"tags":["KEY","stance contradiction","off-topic insertion","right topic, wrong focus"],"optionTags":[null,"rc-reversal","rc-out-of-scope","para-same-topic"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): The paragraph starts in the middle of the action ('Volunteers hang cages'), so the missing opener must introduce the volunteers and the reefs. The key names port-city residents and the reefs being brought back, which 'Volunteers' and 'reef beds laid down by the city' then pick up.\nIncorrect (b): Stance contradiction: the paragraph is about volunteers doing the work, not agencies and paid divers.\nIncorrect (c): Off-topic insertion: fishing-fleet income is never discussed, and it leaves 'Volunteers' and 'reef beds' with nothing to refer to.\nIncorrect (d): Right topic, wrong focus: it is about people who eat oysters, while the paragraph is about restoring reefs.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA paragraph completion, blank at the opening; key introduces both referents"},{"id":"IPMAT_VA_042","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nThe translator's first draft was so ____ that her editor, reading it aloud over the phone, kept stumbling over clauses the original poem had managed in a single breath; in the second draft, which she had ____ until it ran to half the length, every image of the poem survived, and the ____ that had made the first so hard to read was gone.","options":["tortuous; summarised; verbiage","ornate; trimmed; imagery","convoluted; pared; clutter","lyrical; condensed; flourish"],"answer":"convoluted; pared; clutter","answerIndex":2,"tags":["near-miss sense","near-miss sense","KEY","near-miss sense"],"optionTags":["vocab-shade","vocab-shade",null,"vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): Blank 1: the editor 'kept stumbling over clauses', so the draft was convoluted. Blank 2: the draft was cut to half the length yet 'every image of the poem survived', so it was pared, not summarised. Blank 3: what had made the first 'so hard to read' was its clutter, the convolution of blank 1.\nIncorrect (a): The killer is 'summarised': a summary drops content, but 'every image of the poem survived'.\nIncorrect (b): The killer is 'imagery': 'every image of the poem survived', so the imagery is not what was gone.\nIncorrect (d): The killer is 'lyrical': lyrical lines are easy to read aloud, but the editor 'kept stumbling over clauses'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA cloze, 3 blanks; blank 3 interlocks with blank 1"},{"id":"IPMAT_VA_043","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nThis year the clinic saw [[less patients than last year, and the number of complaints have also fallen]], according to its annual report.","options":["less patients than last year, and the number of complaints have also fallen","fewer patients than last year, and the number of complaints have also fallen","fewer patients than last year, and the number of complaints has also fallen","fewer patients then last year, and the number of complaints has also fallen"],"answer":"fewer patients than last year, and the number of complaints has also fallen","answerIndex":2,"tags":["original span (sounds right)","half-fix","KEY","new error introduced"],"optionTags":["gram-sounds-right","gram-half-fix",null,"gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (c)\nCorrect (c): 'Patients' is countable, so it takes 'fewer', not 'less'. The subject of the second clause is 'the number', which is singular, so it takes 'has'. Only (c) fixes both.\nIncorrect (a): The original: 'less patients' and 'the number ... have' are both wrong.\nIncorrect (b): Half-fix: corrects 'fewer' but keeps 'the number of complaints have'.\nIncorrect (d): New error: fixes both points but puts 'then', the time word, where the comparison needs 'than'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA fewer/less + 'the number ... has'"},{"id":"IPMAT_VA_044","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Volunteers in several such settlements have begun painting these roofs with a cheap white coating that reflects much of the sunlight back into the sky.\n2. That relief, however, fades within a couple of years as dust dulls the coating, which must be renewed if the effect is to last.\n3. In the hottest weeks of the year, a tin-roofed room in a crowded settlement can stay warmer at midnight than the street outside.\n4. Families in the painted homes report that their rooms cool noticeably faster after sunset and that their children sleep through the night more often.\n5. Organisers have therefore started training residents to repaint their own roofs, so that the programme does not depend on volunteers coming back.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"31425","answerIndex":null,"tags":[],"optionTags":[],"titaTraps":{"13425":"pj-opener","31245":"pj-topic-link"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 31425\n3 opens: it sets the scene with full noun phrases and no back-reference.\n1 follows: ' rief of any difficulty' for years.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA idiom; coasting shown after the window; lead 'rest her case' fits the legal surface"}];

var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,visits:visits,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 if(lockBlocks(s.batch))return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(Array.isArray(s.visits))visits=s.visits.filter(function(v){return v&&typeof v.q==="number"&&v.q>=0&&v.q<NQ});
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 if(lockBlocks(batch)){showLoginError(LOCK_MSG);return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";

 }

}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}

 if(eb)eb.style.display=last?"none":"inline-block";

}

}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){
  var d=Math.round((Date.now()-qShownTs)/1000);
  questionTimes[currentQ]+=d;
  if(d>=1&&qShownQ===currentQ){ /* v2.7: one visit = from showing a question to leaving it */
   var e=elapsedNow();
   visits.push({q:currentQ,s:Math.max(0,e-d),d:d,a:answers[currentQ]});
   if(visits.length>800)visits.shift();
  }
 }
 qShownTs=Date.now();
}
function elapsedNow(){ /* seconds into the test on the test clock (sections ended early are not counted) */
 if(RAPID)return 0;
 var left=deadline?(deadline-Date.now())/1000:secondsLeft;
 var base=SEC?elapsedPrior+SEC[secIdx].minutes*60:CFG.minutes*60;
 return Math.max(0,Math.round(base-left));
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulText(el,t){el.textContent="";String(t==null?"":t).split(/(\[\[[\s\S]*?\]\])/).forEach(function(p){if(!p)return;var m=p.match(/^\[\[([\s\S]*)\]\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 /* v2.7 fix: picking an option re-renders the same question; that must not restart its stopwatch */
 if(!qShownTs||qShownQ!==currentQ){qShownTs=Date.now();qShownQ=currentQ}
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section;
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulText(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 if(q.format==="Parajumble")return String(a).trim()===String(q.answer); /* stem rule: 3412 valid; 3412. and 3 4 1 2 invalid */
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

var LAST_A=null;
function trapInfo(tag){
 var t=TRAPS[tag];
 if(t)return {name:t[0],what:t[1],fix:t[2]};
 var n=String(tag).replace(/^[a-z]+-/,"").replace(/-/g," ");
 return {name:n.charAt(0).toUpperCase()+n.slice(1),what:"",fix:""};
}
function diffOf(q){
 var d=String(q.difficulty||"").trim().toLowerCase();
 if(!d)return null;
 if(d.indexOf("hard")!==-1)return "hard";
 if(d.charAt(0)==="e")return "easy";
 if(d.charAt(0)==="m")return "medium";
 return null;
}
function penOf(q){return isMCQ(q)?CFG.w:titaWFor(q)}
function trapOf(q,a){
 if(a===null||a===""||a===undefined||isCorrect(q,a))return null;
 if(isMCQ(q)){
  var t=Array.isArray(q.optionTags)?q.optionTags[a]:null;
  return (typeof t==="string"&&t.trim())?t.trim():null;
 }
 if(q.titaTraps&&typeof q.titaTraps==="object"){
  var na=String(a).replace(/[\s,]/g,"");
  for(var k in q.titaTraps){
   if(Object.prototype.hasOwnProperty.call(q.titaTraps,k)&&String(k).replace(/[\s,]/g,"")===na)return q.titaTraps[k];
  }
 }
 return null;
}
function secOfQ(i){if(!SEC)return null;for(var s=0;s<SEC.length;s++){if(i>=SEC[s].start&&i<=SEC[s].end)return s}return null}
function paceOf(i){
 if(RAPID)return QUESTIONS[i].td||30;
 var s=secOfQ(i);
 if(s!==null)return SEC[s].minutes*60/(SEC[s].end-SEC[s].start+1);
 return CFG.minutes*60/NQ;
}
function availSecs(){
 if(RAPID)return QUESTIONS.reduce(function(a,q){return a+(q.td||30)},0);
 if(SEC)return SEC.reduce(function(a,p){return a+p.minutes*60},0);
 return CFG.minutes*60;
}
function fmtMS(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function sgn(n){return n>0?"+"+n:(n<0?"−"+(-n):"0")}
function sgnA(n){return n>0?"+"+n:(n<0?"-"+(-n):"0")}
function blank(x){return x===null||x===""||x===undefined}

function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function capW(s){return s.charAt(0).toUpperCase()+s.slice(1)}

function computeAnalysis(score,totalSecs){
 var A={score:score,max:MAX_MARKS,used:totalSecs||0,avail:availSecs(),c:0,w:0,s:0,neg:0,tC:0,tW:0,tS:0,out:[],
  hasDiff:false,hasTags:false,emW:0,emS:0,emSq:[],traps:[],trapped:0,trapMarks:0,timedOut:0,bankN:0,

 var trapMap={};
 QUESTIONS.forEach(function(q,i){
  var a=answers[i],sk=blank(a),ok=!sk&&isCorrect(q,a),t=questionTimes[i]||0;
  var o=sk?"s":(ok?"c":"w");
  A.out.push(o);

   A.hasDiff=true;

   if(o==="c"){b.c++;b.net+=CFG.c}else if(o==="w"){b.w++;b.net+=penOf(q)}else b.s++;
   if(d!=="hard"){if(o==="w")A.emW++;else if(o==="s"){A.emS++;if(!(RAPID&&t>=(q.td||30)))A.emSq.push(i)}} /* rapid: a question whose clock ran out counts under the clock, not as a skip */
  }

 });
 A.traps.sort(function(x,y){return (y.qs.length-x.qs.length)||(y.marks-x.marks)});
 A.sinks.sort(function(x,y){return y.t-x.t});A.sinks=A.sinks.slice(0,3);

 });

function computeJourney(){
 var J={never:[],neverEM:0,changed:0,toRight:0,toWrong:0,gain:0,loss:0},byQ={};
 visits.forEach(function(v){(byQ[v.q]=byQ[v.q]||[]).push(v)});

   if(blank(a)&&!(questionTimes[i]>0)){J.never.push(i);if(d==="easy"||d==="medium")J.neverEM++}
   return;
  }
  var fn=null;
  for(var k=0;k<vs.length;k++){if(!blank(vs[k].a)){fn=vs[k].a;break}}
  if(fn!==null&&!blank(a)&&!sameAns(q,fn,a)){
   J.changed++;
   var was=isCorrect(q,fn),now=isCorrect(q,a),sw=CFG.c-penOf(q);

   else if(was&&!now){J.toWrong++;J.loss+=sw}

}

/* The verdict: the biggest single leak, ranked by marks, in plain words. */
function buildVerdict(A){

 function line(c){
  var n=c.n,m=c.m;
  if(c.k==="trap")return {h:(A.trapped===A.w?"All "+A.w+" of your wrong answers":A.trapped+" of your "+plural(A.w,"wrong answer","wrong answers"))+" fell for a set trap.",s:"Together they cost "+plural(A.trapMarks,"mark","marks")+". The one to fix first: “"+top.name+"”, "+plural(top.qs.length,"time","times")+"."};
  if(c.k==="blank")return {h:"You left "+plural(n,"Easy or Medium question","Easy or Medium questions")+" blank.",s:"That is up to "+m+" marks that needed no new concept."};
  if(c.k==="never")return {h:"You never opened "+plural(n,"question","questions")+(J.neverEM?", "+J.neverEM+" of them Easy or Medium":"")+".",s:spare>=60?"You still had "+fmtMS(spare)+" on the clock when you finished.":"The clock ran out before you reached them."};
  if(c.k==="hard")return {h:"Hard questions cost you "+plural(m,"mark","marks")+" net.",s:hb.c+" right, "+hb.w+" wrong: leaving them blank would have scored higher."};
  if(c.k==="second")return {h:"Changing answers cost you "+plural(m,"mark","marks")+".",s:plural(J.toWrong,"right answer","right answers")+" changed to wrong; "+J.toRight+" wrong changed to right."};

 var V={h:"",s:"",also:"",acts:[]};

  var L=line(C[0]);V.h=L.h;V.s=L.s;

 }else if(A.acc!==null&&A.acc>=80&&!A.emS){
  V.h="A clean attempt: "+A.acc+"% accuracy and nothing easy left blank.";
  V.s="Next step: take on more of the Hard questions.";
 }else{
  V.h="You scored "+A.score+" of "+A.max+(A.acc!==null?" at "+A.acc+"% accuracy":"")+".";
  V.s="No single leak stands out. Go through the review below, question by question.";
 }
 var seen={};
 function act(t,href){if(seen[t])return;seen[t]=1;V.acts.push({t:t,href:href||null})}
 C.forEach(function(c){
  if(c.m<CFG.c)return;
  if(c.k==="trap"&&top.fix)act("Beat “"+top.name+"”: "+top.fix);
  else if(c.k==="never"&&spare>=60)act("Use the whole clock: before you end a section or submit, open every question you have not seen.");
  else if(c.k==="blank"&&RAPID)act("Decide in time: if you can rule out one option, answer and move on.");
  else if(c.k==="blank"||c.k==="never")act("First pass: answer every Easy and Medium question before you give time to a Hard one.");
  else if(c.k==="hard")act("Attempt a Hard question only after you have ruled out two options.");
  else if(c.k==="second")act("Keep your first answer unless you can name what is wrong with it.");
  else if(c.k==="clock")act("Decide in time: if you can rule out one option, answer and move on.");
 });
 V.acts=V.acts.slice(0,2);
 if(A.bankN)act((A.bankN===A.w?"Your "+plural(A.bankN,"wrong answer is","wrong answers are"):A.bankN+" of your wrong answers are")+" now in your Mistake Bank. They come back for revision tomorrow.","mistake_bank.html");
 return V;
}

/* ---------- on-screen panels ---------- */

function cardTraps(A){

function cardLadder(A){
 if(!A.hasDiff)return "";
 var H="<div class=\"ana\"><div class=\"anaH\">EASY &middot; MEDIUM &middot; HARD</div>";
 ["easy","medium","hard"].forEach(function(k){
  var b=A.diff[k];if(!b.n)return;
  H+="<div class=\"rung\"><div class=\"rungTop\"><span>"+capW(k)+" <span class=\"dim\">&middot; "+plural(b.n,"question","questions")+"</span></span><b class=\""+(b.net<0?"no":(b.net>0?"ok":"dim"))+"\">net "+sgn(b.net)+"</b></div>";
  H+="<div class=\"mini\"><i class=\"c\" style=\"width:"+(100*b.c/b.n).toFixed(1)+"%\"></i><i class=\"w\" style=\"width:"+(100*b.w/b.n).toFixed(1)+"%\"></i><i class=\"s\" style=\"width:"+(100*b.s/b.n).toFixed(1)+"%\"></i></div>";
  H+="<div class=\"rungSub\">"+b.c+" right &middot; "+b.w+" wrong &middot; "+b.s+" blank"+(b.o?" &middot; avg "+fmtMS(b.t/b.o):"")+"</div></div>";
 });

function cardClock(A){
 var unused=Math.max(0,A.avail-A.used),tot=Math.max(1,A.tC+A.tW+A.tS+unused);
 function seg(cls,v){return v>0?"<i class=\""+cls+"\" style=\"width:"+(100*v/tot).toFixed(2)+"%\"></i>":""}

function cardSecond(A){
 var J=A.journey;if(!J||!J.changed)return "";

function cardSecs(A){
 if(!A.secs.length)return "";
 var H="<div class=\"ana\"><div class=\"anaH\">BY SECTION</div><table class=\"anaT\"><tr><th></th><th>Score</th><th>&#10003;</th><th>&#10007;</th><th>&mdash;</th><th>Acc</th><th>Time</th></tr>";
 A.secs.forEach(function(b){

function paletteHTML(A){
 var J=A.journey,never={},trapQ={};
 if(J)J.never.forEach(function(i){never[i]=1});
 A.traps.forEach(function(t){t.qs.forEach(function(i){trapQ[i]=1})});
 function tile(i){
  var o=A.out[i],t=questionTimes[i]||0,full=RAPID?(QUESTIONS[i].td||30):2*paceOf(i);
  var slow=!RAPID&&t>=Math.max(60,2*paceOf(i));
  var cls="pt "+(never[i]?"n":o)+(slow?" slow":"");
  var tip="Q"+(i+1)+" · "+(never[i]?"never opened":fmtMS(t)+" · "+outWord(o))+(trapQ[i]?" · trap":"");
  return "<div class=\""+cls+"\" data-q=\""+i+"\" title=\""+tip+"\"><span class=\"pn\">"+(i+1)+"</span><span class=\"ptm\">"+(never[i]?"&ndash;":fmtMS(t))+"</span>"+(trapQ[i]?"<span class=\"tdot\"></span>":"")+"<i style=\"width:"+Math.min(100,100*t/full).toFixed(1)+"%\"></i></div>";
 }
 var H="<div class=\"ana\"><div class=\"anaH\">YOUR PALETTE, REPLAYED <span class=\"dim\">tap a number to open that question</span></div>";
 if(SEC){SEC.forEach(function(p){H+="<div class=\"palSec\">"+escH(p.sec)+"</div><div class=\"pal2\">";for(var i=p.start;i<=p.end;i++)H+=tile(i);H+="</div>"})}
 else{H+="<div class=\"pal2\">";for(var j=0;j<NQ;j++)H+=tile(j);H+="</div>"}
 H+="<div class=\"palLeg\"><span class=\"sw c\"></span>right<span class=\"sw w\"></span>wrong<span class=\"sw s\"></span>blank"+(J&&J.never.length?"<span class=\"sw n\"></span>never opened":"")+(A.traps.length?"<span class=\"sw t\"></span>fell for a trap":"");
 H+="<br>The gold line under each number is the time spent: "+(RAPID?"a full line means that question's clock ran out.":"half a line is even pace, a full line is twice even pace or more.")+"</div>";

}
function renderAnalysis(A){

/* ---------- retry wrong questions (no clock) ---------- */
var RETRY={done:0,right:0,n:0};
function renderRetry(){
 var box=document.getElementById("retryBox");if(!box)return;
 box.innerHTML="";
 var idx=[];
 QUESTIONS.forEach(function(q,i){if(!blank(answers[i])&&!isCorrect(q,answers[i]))idx.push(i)});
 if(!idx.length)return;
 RETRY={done:0,right:0,n:idx.length};
 var h=document.createElement("h1");h.style.cssText="font-size:19px;margin:18px 0 6px";h.textContent="Retry Wrong Questions";box.appendChild(h);
 var n=document.createElement("div");n.className="note";n.style.marginBottom="10px";
 n.textContent="No clock this time. If you get it now, the first miss was a slip or the pressure. If you miss it again, that topic needs revision.";
 box.appendChild(n);
 var tl=document.createElement("div");tl.className="secErr";tl.id="retryTally";box.appendChild(tl);
 idx.forEach(function(i){box.appendChild(retryCard(i))});
 paintTally();
}
function paintTally(){
 var t=document.getElementById("retryTally");if(!t)return;
 t.innerHTML="<b>Retried "+RETRY.done+" of "+RETRY.n+"</b>"+(RETRY.done?" &middot; <span class=\"ok\">now right "+RETRY.right+"</span> &middot; <span class=\"no\">still wrong "+(RETRY.done-RETRY.right)+"</span>":"");
}
function retryCard(i){
 var q=QUESTIONS[i],letters=["A","B","C","D"];
 var w=document.createElement("div");w.className="rq";
 var hd=document.createElement("div");hd.className="rqHead";hd.textContent="Q"+(i+1)+" · "+q.section+(diffOf(q)?" · "+q.difficulty:"");w.appendChild(hd);
 if(q.passage){
  var det=document.createElement("details");var sm=document.createElement("summary");sm.className="mono";sm.textContent="Show passage";det.appendChild(sm);
  var pv=document.createElement("div");pv.className="rqStem";pv.style.marginTop="6px";pv.textContent=q.passage;det.appendChild(pv);w.appendChild(det);
 }
 var st=document.createElement("div");st.className="rqStem";ulText(st,q.stem);w.appendChild(st);
 var ex=document.createElement("div");renderExhibit(q,ex);if(ex.childNodes.length)w.appendChild(ex);
 var res=document.createElement("div");res.className="exp";res.style.display="none";
 function finish(ok,keyText){
  RETRY.done++;if(ok)RETRY.right++;paintTally();
  res.style.display="block";
  res.innerHTML="<b>"+(ok?"Got it this time.":"Not yet.")+"</b> Key: "+escH(keyText)+"<br>";
  res.appendChild(document.createTextNode(q.explanation||""));
 }
 if(isMCQ(q)){
  q.options.forEach(function(opt,k){
   var b=document.createElement("button");b.className="opt";b.textContent=letters[k]+". "+opt;
   b.onclick=function(){
    var bs=w.querySelectorAll("button.opt");for(var j=0;j<bs.length;j++)bs[j].disabled=true;
    var ok=(k===q.answerIndex);b.classList.add(ok?"rOk":"rNo");if(!ok&&bs[q.answerIndex])bs[q.answerIndex].classList.add("rOk");
    finish(ok,letters[q.answerIndex]);
   };
   w.appendChild(b);
  });
 }else{
  var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;margin-top:6px";
  var inp=document.createElement("input");inp.className="tita";inp.placeholder="Type your answer";
  var cb=document.createElement("button");cb.className="btn";cb.textContent="Check";
  cb.onclick=function(){
   if(!inp.value.trim())return;
   inp.disabled=true;cb.disabled=true;
   var ok=isCorrect(q,inp.value);inp.style.borderColor=ok?"var(--green)":"var(--red)";
   finish(ok,String(q.answer));
  };
  row.appendChild(inp);row.appendChild(cb);w.appendChild(row);
 }
 w.appendChild(res);
 return w;
}

/* ---------- PDF text (plain characters only: the PDF font has no minus sign or arrows) ---------- */
function analysisLines(A){
 var L=[],V=A.verdict,dot="   ·   ",J=A.journey;
 var v=[V.h+(V.s?" "+V.s:"")];
 if(V.also)v.push("Also: "+V.also);
 v.push((A.acc!==null?"Accuracy "+A.acc+"%"+dot:"")+"Guessing tax "+(A.neg?"-"+A.neg:"0")+dot+"Time "+fmtMS(A.used)+" of "+fmtMS(A.avail));
 L.push(["Your verdict",v]);
 if(V.acts.length)L.push(["Do this next",V.acts.map(function(a,k){return (k+1)+". "+a.t})]);
 if(A.traps.length)L.push(["Traps that caught you",A.traps.map(function(t){return t.name+" x"+t.qs.length+" ("+t.qs.map(function(i){return "Q"+(i+1)}).join(", ")+")"+(t.what?": "+t.what:"")+(t.fix?" Counter: "+t.fix:"")})]);
 if(A.hasDiff){
  var d=[];
  ["easy","medium","hard"].forEach(function(k){var b=A.diff[k];if(!b.n)return;d.push(capW(k)+": "+b.n+" Qs"+dot+b.c+" right"+dot+b.w+" wrong"+dot+b.s+" blank"+dot+"net "+sgnA(b.net)+(b.o?dot+"avg "+fmtMS(b.t/b.o):""))});
  L.push(["Easy / Medium / Hard",d]);
 }
 var unused=Math.max(0,A.avail-A.used);
 var t=["Right "+fmtMS(A.tC)+dot+"wrong "+fmtMS(A.tW)+(A.tS>=1?dot+"blank "+fmtMS(A.tS):"")+(unused>=1?dot+"not used "+fmtMS(unused):"")];
 if(A.sinks.length)t.push("Time sinks: "+A.sinks.map(function(x){return "Q"+(x.i+1)+" "+fmtMS(x.t)+" ("+outWord(A.out[x.i])+")"}).join(", "));
 if(RAPID&&A.timedOut)t.push("The clock ran out on "+plural(A.timedOut,"question","questions"));
 if(J&&J.never.length)t.push("Never opened: "+J.never.map(function(i){return "Q"+(i+1)}).join(", "));
 L.push(["Where the clock went",t]);
 if(J&&J.changed)L.push(["Second thoughts",["Changed "+plural(J.changed,"answer","answers")+": "+J.toRight+" wrong to right (+"+J.gain+"), "+J.toWrong+" right to wrong (-"+J.loss+")"]]);
 if(A.secs.length)L.push(["By section",A.secs.map(function(b){var att=b.c+b.w;return b.sec+": score "+b.score+dot+b.c+" right"+dot+b.w+" wrong"+dot+b.s+" blank"+dot+"accuracy "+(att?Math.round(100*b.c/att)+"%":"-")+dot+"time "+fmtMS(b.t)})]);
 return L;
}

  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

/* ==================== TEST LOCK ====================
   LOCKED=true: students who open this page see only LOCK_MSG and cannot start.
   Admin preview: open the page with ?admin=1 and pick the Admin batch.
   To open the test to students, set LOCKED=false. */
var LOCKED=true;
var LOCK_MSG="You are not authorized to view this test.";
var ADMIN_VIEW=/[?&]admin(=|&|$)/.test(location.search);
function lockBlocks(batch){return LOCKED&&!(ADMIN_VIEW&&batch==="Admin")}
function applyLock(){
 if(!LOCKED)return true;
 if(ADMIN_VIEW){var an=document.getElementById("adminNote");an.textContent="ADMIN PREVIEW \u00b7 locked for students \u00b7 select the Admin batch to start";an.style.display="block";return true}
 var card=document.querySelector(".loginCard");
 Array.prototype.forEach.call(card.children,function(el){if(el.tagName!=="H1"&&el.id!=="lgTitle"&&el.id!=="lockMsg")el.style.display="none"});
 var m=document.getElementById("lockMsg");m.textContent=LOCK_MSG;m.style.display="block";
 return false;
}

/* ==================== PAGE LOAD ==================== */
document.getElementById("lgTitle").textContent=TEST_NAME;
var lgTime=CFG.rapid?("per-question clock \u00b7 forward only \u00b7 auto-advance at 0s \u00b7 ~"+CFG.minutes+" min total"):SEC?(SEC.map(function(p){return p.sec+" "+p.minutes+"m"}).join(" \u2192 ")+" \u00b7 sectional lock \u00b7 no return"):(CFG.minutes+" minutes \u00b7 "+(CFG.navNote||"free navigation"));
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 TITA wrong "+(CFG.titaWSec?QUESTIONS.filter(function(q){return !isMCQ(q)}).map(function(q){return q.section}).filter(function(v,i,a){return a.indexOf(v)===i}).map(function(sec){return sec+" "+titaWFor({section:sec})}).join(", "):CFG.titaW):"")+" \u00b7 Max "+MAX_MARKS+"<br>"+lgTime+" \u00b7 auto-submit at 00:00";
document.getElementById("loginBtn").addEventListener("click",startTest);
snFlushQueue();
if(applyLock())snTryResume();

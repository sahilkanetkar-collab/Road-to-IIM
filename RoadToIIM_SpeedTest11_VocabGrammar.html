var CFG={"testName":"Rapid Fire Test 11","examName":"IPMAT Indore","maxMarks":140,"minutes":26,"c":4,"w":-1,"titaW":0,"hasTita":false,"navNote":"rapid · per-question clock · forward only","sectional":null,"fileName":"ipmat_indore_Rapid_Fire_Test_11.html","snKey":"riim_session_Rapid_Fire_Test_11","bankPrefix":"Rapid_Fire_Test_11","rapid":true};
var QUESTIONS=[{"id":"Q01","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"Rooftop solar has long been described as the sleeping giant of India's renewable energy programme. While vast solar parks in Rajasthan and Gujarat capture headlines, the potential sitting atop homes, schools and small factories remains largely untapped. Government surveys estimate that residential rooftops alone could host tens of gigawatts of capacity, yet installations have crawled along at a fraction of that figure. Analysts attribute the sluggish pace to three factors: the upfront cost of panels, the labyrinthine process of obtaining approvals from distribution companies, and a simple lack of awareness among householders. Recent subsidy schemes attempt to address the first barrier by covering a substantial share of installation costs for small systems. The second is being tackled through national portals that standardise applications, replacing paperwork that once shuttled between multiple offices. Awareness, however, is proving the most stubborn obstacle. Surveys in tier-two cities found that most respondents could not name a single rooftop subsidy, and many believed solar panels stop working entirely on cloudy days — a misconception installers spend much of their time correcting. Policymakers now argue that financing and portals mean little unless the household imagination is captured first.","stem":"According to the passage, which of the following is NOT one of the three factors analysts cite for the slow pace of rooftop installations?","options":["The upfront cost of panels","A shortage of trained installers","The process of obtaining approvals from distribution companies","Lack of awareness among householders"],"answer":"A shortage of trained installers","answerIndex":1,"difficulty":"easy","explanation":"The factor sentence lists exactly three items: upfront cost, the labyrinthine approvals process, and lack of awareness. Installer shortages are never mentioned. ot name a single rooftop subsidy","answerIndex":2,"difficulty":"medium","explanation":"The survey sentence states directly that most respondents could not name a single rooftop subsidy. The trap is option D — cost is a real barrier elsewhere in the passage, so students merge the two sentences; but the surveys are cited only as evidence of the awareness problem, not affordability. A and B invent findings the passage never reports.","verified":"ok","status":"approved"},{"id":"Q03","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"Rooftop solar has long been described as the sleeping giant of India's renewable energy programme. While vast solar parks in Rajasthan and Gujarat capture headlines, the potential sitting atop homes, schools and small factories remains largely untapped. Government surveys estimate that residential rooftops alone could host tens of gigawatts of capacity, yet installations have crawled along at a fraction of that figure. Analysts attribute the sluggish pace to three factors: the upfront cost of panels, the labyrinthine process of obtaining approvals from distribution companies, and a simple lack of awareness among householders. Recent subsidy schemes attempt to address the first barrier by covering a substantial share of installation costs for small systems. The second is being tackled through national portals that standardise applications, replacing paperwork that once shuttled between multiple offices. Awareness, however, is proving the most stubborn obstacle. Surveys in tier-two cities found that most respondents could not name a single rooftop subsidy, and many believed solar panels stop working entirely on cloudy days — a misconception installers spend much of their time correcting. Policymakers now argue that financing and portals mean little unless the household imagination is captured first.","stem":"The author mentions the belief that solar panels stop working on cloudy days in order to","options":["give an example orking entirely on cloudy days — a misconception installers spend much of their time correcting. Policymakers now argue that financing and portals mean little unless the household imagination is captured first.","stem":"The word 'labyrinthine', as used in the passage, is closest in meaning to","options":["deliberately corrupt","excessively expensive","physically exhausting","bewilderingly complex"],"answer":"bewilderingly complex","answerIndex":3,"difficulty":"medium","explanation":"A labyrinth is a maze, so labyrinthine means maze-like — confusingly complex. The next sentence confirms it: the fix is portals that 'standardise applications, replacing paperwork that once shuttled between multiple offices', i.e. simplification. The trap is 'excessively expensive' — cost is the neighbouring factor in the same sentence, and students borrow it. Nothing marks the process as corrupt or physically tiring.","verified":"ok","status":"approved"},{"id":"Q05","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"City governments love to announce tree-planting drives. A lakh saplings here, a crore there — the numbers make for fine photographs and finer press releases. What the numbers conceal is how few of these saplings survive their first three summers. Horticulture departments typically budget for planting but not for watering, staking or protection from grazing, and the saplings, left to fend for themselves on baking pavements, quietly die. The result is a ritual of annual planting that adds remarkably little canopy. This matters because mature trees, not saplings, are what cool a street. A full-grown neem or peepal can lower the air temperature beneath it by several degrees through shade and transpiration, a service no row of knee-high saplings can perform. Cities serious about heat should therefore invert their priorities: protect every mature tree first, and plant second. That means refusing to fell old trees for road-widening except as a genuine last resort, and it means auditing survival rates instead of counting saplings planted. Until municipal report cards track living canopy rather than planting ceremonies, the drives will remain what they currently are — theatre with a watering problem.","stem":"According to the passage, why do so few saplings survive their first three summers?","options":["Departments budget for planting but not for aftercare","Citizens uproot the saplings for firewood in winter","The species chosen are unsuited to Indian summers","Grazing animals are deliberately released near the plantations"],"answer":"Departments budget for planting but not for aftercare","answerIndex":0,"difficulty":"easy","explanation":"The passage states it in one sentence: departments 'budget for planting but not for watering, staking or protection from grazing', so saplings are left to fend for themselves and die. The trap is option D — grazing is mentioned, but as something saplings need protection from, not as a deliberate act. B and C are invented causes the passage never gives.","verified":"ok","status":"approved"},{"id":"Q06","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"City governments love to announce tree-planting drives. A lakh saplings here, a crore there — the numbers make for fine photographs and finer press releases. What the numbers conceal is how few of these saplings survive their first three summers. Horticulture departments typically budget for planting but not for watering, staking or protection from grazing, and the saplings, left to fend for themselves on baking pavements, quietly die. The result is a ritual of annual planting that adds remarkably little canopy. This matters because mature trees, not saplings, are what cool a street. A full-grown neem or peepal can lower the air temperature beneath it by several degrees through shade and transpiration, a service no row of knee-high saplings can perform. Cities serious about heat should therefore invert their priorities: protect every mature tree first, and plant second. That means refusing to fell old trees for road-widening except as a genuine last resort, and it means auditing survival rates instead of counting saplings planted. Until municipal report cards track living canopy rather than planting ceremonies, the drives will remain what they currently are — theatre with a watering problem.","stem":"The passage states that a full-grown neem or peepal lowers the air temperature beneath it through","options":["absorbing carbon dioxide from passing vehicles","shade and transpiration","blocking hot winds from open highways","releasing moisture stored inside its bark"],"answer":"shade and transpiration","answerIndex":1,"difficulty":"easy","explanation":"Direct retrieval: the passage says a full-grown tree cools the air 'by several degrees through shade and transpiration'. The trap is option D — it sounds like a paraphrase of transpiration, but transpiration is the release of water vapour through leaves, and more importantly the passage's own wording is option B verbatim. A and C are cooling mechanisms the passage never mentions.","verified":"ok","status":"approved"},{"id":"Q07","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"City governments love to announce tree-planting drives. A lakh saplings here, a crore there — the numbers make for fine photographs and finer press releases. What the numbers conceal is how few of these saplings survive their first three summers. Horticulture departments typically budget for planting but not for watering, staking or protection from grazing, and the saplings, left to fend for themselves on baking pavements, quietly die. The result is a ritual of annual planting that adds remarkably little canopy. This matters because mature trees, not saplings, are what cool a street. A full-grown neem or peepal can lower the air temperature beneath it by several degrees through shade and transpiration, a service no row of knee-high saplings can perform. Cities serious about heat should therefore invert their priorities: protect every mature tree first, and plant second. That means refusing to fell old trees for road-widening except as a genuine last resort, and it means auditing survival rates instead of counting saplings planted. Until municipal report cards track living canopy rather than planting ceremonies, the drives will remain what they currently are — theatre with a watering problem.","stem":"The author mentions municipal report cards in order to","options":["demand that officials whose saplings die be penalised","suggest that annual planting drives be discontinued altogether","identify what cities must track before the drives stop being theatre","praise the few municipalities that already audit their living canopy"],"answer":"identify what cities must track before the drives stop being theatre","answerIndex":2,"difficulty":"medium","explanation":"The function is stated in the final sentence: 'Until municipal report cards track living canopy rather than planting ceremonies, the drives will remain... theatre.' The report card is named as the measurement that must change. The trap is option B — the author's tone is scathing, so students over-read it as a call to scrap drives; but the fix offered is reordering priorities and auditing, not discontinuation. A and D describe actions the passage never takes.","verified":"ok","status":"approved"},{"id":"Q08","section":"VA","format":"RC Anchored","kind":"mcq","td":90,"passage":"City governments love to announce tree-planting drives. A lakh saplings here, a crore there — the numbers make for fine photographs and finer press releases. What the numbers conceal is how few of these saplings survive their first three summers. Horticulture departments typically budget for planting but not for watering, staking or protection from grazing, and the saplings, left to fend for themselves on baking pavements, quietly die. The result is a ritual of annual planting that adds remarkably little canopy. This matters because mature trees, not saplings, are what cool a street. A full-grown neem or peepal can lower the air temperature beneath it by several degrees through shade and transpiration, a service no row of knee-high saplings can perform. Cities serious about heat should therefore invert their priorities: protect every mature tree first, and plant second. That means refusing to fell old trees for road-widening except as a genuine last resort, and it means auditing survival rates instead of counting saplings planted. Until municipal report cards track living canopy rather than planting ceremonies, the drives will remain what they currently are — theatre with a watering problem.","stem":"The word 'invert', as used in the passage ('invert their priorities'), is closest in meaning to","options":["abandon","announce","defend","reverse"],"answer":"reverse","answerIndex":3,"difficulty":"medium","explanation":"The colon after 'invert their priorities' defines the word on the page: 'protect every mature tree first, and plant second' — the current order (plant first, protect never) turned upside down, i.e. reversed. The trap is 'abandon' — students who read the author as anti-drive assume priorities are being scrapped, but the passage keeps both actions and only swaps their order. 'Announce' and 'defend' fit neither the word nor the context.","verified":"ok","status":"approved"},{"id":"Q09","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"With the entrance exam only a month away, it would ___ you to revise your error log before attempting fresh mocks.","options":["behoove","beguile","bequeath","besiege"],"answer":"behoove","answerIndex":0,"difficulty":"medium","explanation":"'It would behoove you to X' is the fixed frame: behoove = to be advisable or fitting for someone. Beguile = to charm or deceive; bequeath = to leave by will; besiege = to surround or overwhelm. The trap is beguile — the be- sound and its vague positivity tempt students who half-know the target; but only behoove takes the impersonal 'it would ___ you to' construction.","verified":"ok","status":"approved"},{"id":"Q10","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Freed from licensing controls, the town's software services sector began to ___, adding a dozen new firms every quarter.","options":["burnish","buttress","burgeon","burrow"],"answer":"burgeon","answerIndex":2,"difficulty":"hard","explanation":"The clue 'adding a dozen new firms every quarter' demands rapid growth: burgeon = to grow or expand quickly. Burnish = to polish or enhance (a reputation); buttress = to prop up or support; burrow = to dig into. The trap is buttress — students read 'freed from controls' as the sector being strengthened; but buttress is transitive (you buttress something) and means support, not multiply.","verified":"ok","status":"approved"},{"id":"Q11","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"A strict vegan, Meera ___ not only meat but any product tested on animals.","options":["espouses","eschews","extols","exhumes"],"answer":"eschews","answerIndex":1,"difficulty":"medium","explanation":"A strict vegan avoids these things: eschew = to deliberately abstain from. Espouse = to adopt or support (a cause); extol = to praise highly; exhume = to dig up. The trap is espouses — it is the word students most often confuse with eschews, and it makes the sentence mean the exact opposite (a vegan supporting meat). Polarity from 'strict vegan' settles it.","verified":"ok","status":"approved"},{"id":"Q12","section":"VA","format":"Fill in the Blank","kind":"mcq","td":25,"stem":"Even with the results due any minute, Rohan kept up an ___ air, humming to himself as though nothing were at stake.","options":["insolent","insular","insidious","insouciant"],"answer":"insouciant","answerIndex":3,"difficulty":"hard","explanation":"'As though nothing were at stake' defines the blank: insouciant = casually unconcerned, carefree. Insolent = rude and disrespectful; insular = narrow-minded, inward-looking; insidious = spreading harm gradually and unnoticed. The trap is insolent — the sound overlap is strong and calm-under-pressure can be misread as cheek; but no one is being disrespected here, so only unconcern fits.","verified":"ok","status":"approved"},{"id":"Q13","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"In which sentence is the word 'fractious' used correctly?","options":["The inheritance was divided in fractious portions among the four heirs.","He wore a cast for six weeks after breaking his fractious arm.","The fractious coalition partners quarrelled over every cabinet seat.","Only a fractious percentage of the voters turned out in the by-election."],"answer":"The fractious coalition partners quarrelled over every cabinet seat.","answerIndex":2,"difficulty":"hard","explanation":"Fractious = irritable and quarrelsome — exactly what coalition partners fighting over every seat are. The wrong options each borrow a look-alike: A confuses it with 'fractional' portions, B with 'fractured', D with 'a fraction of'. The trap is D — 'fractious percentage' sounds most natural to a student who has met the word only in print; but fractious describes temperament, never quantity.","verified":"ok","status":"approved"},{"id":"Q14","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"In which sentence is the word 'catatonic' used correctly?","options":["The shock left the witness catatonic, rigid and unresponsive for hours.","The dam burst with catatonic force, flooding three villages downstream.","A single catatonic error in the ledger wiped out the year's profits.","Crying openly at the film's tragic end proved oddly catatonic for the audience."],"answer":"The shock left the witness catatonic, rigid and unresponsive for hours.","answerIndex":0,"difficulty":"medium","explanation":"Catatonic = in a state of immobility and unresponsiveness — matched by 'rigid and unresponsive'. B confuses it with 'cataclysmic' (violently destructive), C with 'catastrophic' (disastrous), D with 'cathartic' (emotionally cleansing). The trap is B — cata- words blur together and 'catatonic force' sounds dramatic; but catatonic describes a frozen human state, not the strength of an event.","verified":"ok","status":"approved"},{"id":"Q15","section":"VA","format":"Word Usage","kind":"mcq","td":25,"stem":"In which sentence is the word 'melange' used correctly?","options":["Police struggled to control the melange that erupted outside the stadium.","The census counted every melange in the village and the members in each.","The chef melanged the herbs into the butter before spreading it on toast.","The bazaar offered a melange of spices, textiles and street food."],"answer":"The bazaar offered a melange of spices, textiles and street food.","answerIndex":3,"difficulty":"hard","explanation":"Melange = a varied mixture — a bazaar of spices, textiles and food is the textbook case. A confuses it with 'melee' (a confused fight or scuffle), B with 'menage' (a household), and C forces it into a verb, which English does not allow — melange is a noun only. The trap is A: melee is the most common confusion, and a stadium scuffle reads fluently until the meaning is checked.","verified":"ok","status":"approved"},{"id":"Q16","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the word that can substitute for the given phrase: 'One who is hostile or indifferent to art and culture.'","options":["Iconoclast","Philistine","Dilettante","Connoisseur"],"answer":"Philistine","answerIndex":1,"difficulty":"easy","explanation":"Philistine = a person indifferent or hostile to art and refinement. Iconoclast = one who attacks cherished beliefs or institutions; dilettante = a dabbler with superficial interest in the arts; connoisseur = an expert judge of the arts. The trap is iconoclast — 'attacks' feels close to 'hostile'; but an iconoclast attacks orthodoxy, often from deep engagement, whereas the philistine simply does not care. Connoisseur is the over-correction: the exact opposite.","verified":"ok","status":"approved"},{"id":"Q17","section":"VA","format":"One Word Substitution","kind":"mcq","td":25,"stem":"Choose the word that can substitute for the given phrase: 'A mischievous, good-for-nothing person; a rascal.'","options":["Curmudgeon","Sycophant","Recluse","Rapscallion"],"answer":"Rapscallion","answerIndex":3,"difficulty":"medium","explanation":"Rapscallion = a mischievous rascal or scamp. Curmudgeon = a bad-tempered, grumpy (usually old) person; sycophant = a flatterer who fawns on the powerful; recluse = one who avoids society. The trap is curmudgeon — both are colourful insults for difficult people, and students who know neither word precisely pick the more familiar one; but the curmudgeon is sour, not playfully wicked.","verified":"ok","status":"approved"},{"id":"Q18","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the correct meaning of the idiom: 'to cut the Gordian knot'.","options":["to solve a tangled problem at one bold stroke","to tie a deal down with many strict conditions","to create a problem that no one is able to solve","to slip quietly out of a difficult situation"],"answer":"to solve a tangled problem at one bold stroke","answerIndex":0,"difficulty":"hard","explanation":"From the legend of Alexander slicing through the unsolvable knot: to cut the Gordian knot = to resolve a hopelessly complicated problem by direct, decisive action. B literalises the 'tying' image and reverses the act; C keeps the knot but drops the cutting — creating rather than solving; D keeps the escape flavour but loses the boldness. The trap is C: students remember the knot as the famous part and forget the idiom is about the cut.","verified":"ok","status":"approved"},{"id":"Q19","section":"VA","format":"Idioms","kind":"mcq","td":25,"stem":"Choose the correct meaning of the idiom: 'to gild the lily'.","options":["to flatter a powerful person to win favours","to try to improve what is already perfect","to hide a serious flaw behind fine decoration","to spend recklessly on showy luxuries"],"answer":"to try to improve what is already perfect","answerIndex":1,"difficulty":"hard","explanation":"To gild the lily = to add unnecessary ornament to something already beautiful — the lily needs no gold. The trap is C: it keeps the decoration frame but flips the object from something perfect to something flawed, which is concealment, not over-adornment. A drifts to flattery via 'gild = sweeten'; D reads the gold literally as extravagant spending. All three share the ornament skeleton; only B keeps 'already perfect'.","verified":"ok","status":"approved"},{"id":"Q20","section":"VA","format":"Roots","kind":"mcq","td":30,"stem":"The word 'edify' (to instruct and improve someone morally or intellectually) comes from the Latin 'aedificare', meaning 'to build'. Which of the following words is built on the same root?","options":["editor","edible","edifice","edict"],"answer":"edifice","answerIndex":2,"difficulty":"hard","explanation":"Edifice = a large building — the same aedificare root, so to edify is literally to 'build up' a person's mind or character. Editor comes from 'edere' (to give out or publish), edible from 'edere' (to eat), and edict from 'edicere' (to proclaim). The trap is edict — the ed- + formal Latin feel makes it look like family; but proclaiming and building are different roots. Surface spelling is exactly what this item punishes.","verified":"ok","status":"approved"},{"id":"Q21","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"Neither the director nor the actors ___ willing to comment on the film's delay.","options":["was","is","has been","were"],"answer":"were","answerIndex":3,"difficulty":"easy","explanation":"With 'neither... nor', the verb agrees with the nearer subject — here the plural 'actors' — so 'were' is correct. The trap is 'was': students apply the memorised rule 'neither takes singular' without checking proximity; that holds only when both subjects are singular. 'Is' and 'has been' repeat the same singular error in other tenses.","verified":"ok","status":"approved"},{"id":"Q22","section":"VA","format":"SVA","kind":"mcq","td":35,"stem":"The committee of ministers, along with its advisers, ___ expected to submit the report by March.","options":["is","are","were","have been"],"answer":"is","answerIndex":0,"difficulty":"medium","explanation":"The subject is 'the committee' — singular; 'of ministers' and 'along with its advisers' are attachments that never change the number of the head noun. So 'is expected' is correct. The trap is 'are': the plural nouns 'ministers' and 'advisers' sit right before the verb and pull the ear. 'Were' and 'have been' add a tense shift to the same agreement mistake.","verified":"ok","status":"approved"},{"id":"Q23","section":"VA","format":"Pronouns","kind":"mcq","td":35,"stem":"Each of the players must collect ___ kit from the manager before the bus leaves.","options":["their","his or her","its","theirs"],"answer":"his or her","answerIndex":1,"difficulty":"medium","explanation":"'Each' is grammatically singular, so exam convention requires a singular pronoun: 'his or her kit'. The trap is 'their' — natural in everyday speech and increasingly accepted in general writing, but the standard tested rule treats each/every/either/neither as singular, and 'their' is the option most candidates will tick. 'Its' cannot refer to people; 'theirs' is a possessive pronoun and cannot sit before the noun 'kit'.","verified":"ok","status":"approved"},{"id":"Q24","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"By the time the results ___ next month, most students will have joined their backup colleges.","options":["will arrive","will have arrived","arrive","arrived"],"answer":"arrive","answerIndex":2,"difficulty":"easy","explanation":"Time clauses ('by the time', 'when', 'as soon as') take the simple present even for future events; the future is carried by the main clause ('will have joined'). So 'arrive' is correct. The trap is 'will arrive' — 'next month' makes students reach for a future form inside the time clause, exactly what the rule forbids. 'Will have arrived' doubles that error; 'arrived' pushes a future event into the past.","verified":"ok","status":"approved"},{"id":"Q25","section":"VA","format":"Tenses","kind":"mcq","td":35,"stem":"By the time the train finally pulled in, we ___ on the platform for over an hour.","options":["have been waiting","are waiting","waited","had been waiting"],"answer":"had been waiting","answerIndex":3,"difficulty":"hard","explanation":"Two past events, one continuing up to the other: the waiting stretched over an hour until the past moment the train arrived, which demands the past perfect continuous — 'had been waiting'. The trap is 'have been waiting': students hear the duration ('for over an hour') and grab the present perfect continuous, but the anchor ('pulled in') is past, so the reference point cannot be now. 'Waited' loses the ongoing duration; 'are waiting' is present tense in a past narrative.","verified":"ok","status":"approved"},{"id":"Q26","section":"VA","format":"Modifiers","kind":"mcq","td":35,"stem":"Choose the sentence in which the modifier is correctly placed.","options":["Walking into the hall, Ravi noticed the trophies at once.","Walking into the hall, the trophies caught Ravi's eye at once.","Walking into the hall, Ravi's eye was caught by the trophies.","The trophies, walking into the hall, were at once noticed by Ravi."],"answer":"Walking into the hall, Ravi noticed the trophies at once.","answerIndex":0,"difficulty":"medium","explanation":"An opening participle must describe the subject that immediately follows: Ravi is the one walking, so 'Walking into the hall, Ravi noticed...' is correct. B makes the trophies walk; D makes them walk mid-sentence. The trap is C — it puts a Ravi-word next to the modifier, but the subject is 'Ravi's eye', and an eye cannot walk into a hall. The over-correction of adding the possessive is exactly the error tested.","verified":"ok","status":"approved"},{"id":"Q27","section":"VA","format":"Parallelism","kind":"mcq","td":35,"stem":"The new policy aims to reduce paperwork, speed up approvals, and ___.","options":["simplifying audits","simplify audits","the simplification of audits","audits being simplified"],"answer":"simplify audits","answerIndex":1,"difficulty":"medium","explanation":"The list runs on 'aims to' + bare verbs: reduce, speed up, and — to stay parallel — 'simplify'. The trap is 'simplifying audits': the -ing form sounds fluent in isolation and is the most common wrong pick, but it breaks the verb series. 'The simplification of audits' switches to a noun phrase; 'audits being simplified' switches to a passive participle clause. Only B matches the established pattern.","verified":"ok","status":"approved"},{"id":"Q28","section":"VA","format":"Prepositions","kind":"mcq","td":35,"stem":"The chairman was accused ___ ignoring the auditors' warnings for two years.","options":["for","with","of","about"],"answer":"of","answerIndex":2,"difficulty":"easy","explanation":"The fixed collocation is 'accused of' + noun/gerund. The trap is 'for' — students transfer it from 'blamed for' and 'punished for', which share the fault-finding frame; a secondary trap is 'with', borrowed from the legal phrase 'charged with'. 'About' collocates with none of these verbs. Accuse takes only 'of'.","verified":"ok","status":"approved"},{"id":"Q29","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"The number of applicants for the design course (have risen sharply since) the fee waiver was announced. Choose the option that best replaces the bracketed part.","options":["have risen sharply after","has rose sharply since","have been rising sharply since","has risen sharply since"],"answer":"has risen sharply since","answerIndex":3,"difficulty":"medium","explanation":"'The number of...' is singular (unlike 'a number of', which is plural), so the verb must be 'has risen'. Option A keeps the plural 'have' and merely swaps 'since' for 'after' — a half-fix; C keeps the same agreement error in a longer tense; B fixes the agreement but introduces a new error, the wrong participle 'rose'. The trap is B — it sounds decisive because 'has' is right, but 'has rose' is never correct.","verified":"ok","status":"approved"},{"id":"Q30","section":"VA","format":"Sentence Correction","kind":"mcq","td":35,"stem":"(Scarcely the match had begun than) rain forced the players off the field. Choose the option that best replaces the bracketed part.","options":["Scarcely had the match begun when","Scarcely had the match begun than","Scarcely the match had begun when","No sooner had the match begun when"],"answer":"Scarcely had the match begun when","answerIndex":0,"difficulty":"hard","explanation":"'Scarcely' at the start forces inversion ('had the match begun') and pairs with 'when', never 'than'. The original has both errors; only option A fixes both. B is a half-fix — inversion corrected, 'than' kept; C is the mirror half-fix — 'when' corrected, no inversion. D introduces a new error: 'no sooner' pairs with 'than', not 'when'. The trap is B, because inversion is the error students hear first, and they stop checking there.","verified":"ok","status":"approved"},{"id":"Q31","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"The minister gave a tepid endorsement of the bill, praising its aims while promising nothing. As used here, 'tepid' is closest in meaning to","options":["openly hostile","mildly unenthusiastic","warmly enthusiastic","deliberately delayed"],"answer":"mildly unenthusiastic","answerIndex":1,"difficulty":"easy","explanation":"Tepid literally means lukewarm, and figuratively an endorsement without real warmth — praise with nothing promised behind it. The trap is 'openly hostile': the negative context tempts students to over-darken the word, but the minister does still endorse the bill, so hostility is too strong. 'Warmly enthusiastic' is the polarity flip; 'deliberately delayed' invents a timing sense tepid does not have.","verified":"ok","status":"approved"},{"id":"Q32","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"Critics dismissed the memoir as prosaic — a plain march of dates, dinners and departures. As used here, 'prosaic' is closest in meaning to","options":["merely written in prose, not verse","factually unreliable throughout","dull and unimaginative","needlessly long and rambling"],"answer":"dull and unimaginative","answerIndex":2,"difficulty":"hard","explanation":"Prosaic has drifted from its root: it now means commonplace and dull, lacking poetic imagination — confirmed by 'a plain march of dates, dinners and departures'. The trap is option A, the etymological literalisation: prosaic does come from 'prose', but the critics are attacking flatness, not the absence of verse (memoirs are expected to be prose). B shifts to accuracy and D to length — neither is supported by 'plain'.","verified":"ok","status":"approved"},{"id":"Q33","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"The scandal galvanised a normally sleepy electorate into record turnout. As used here, 'galvanised' is closest in meaning to","options":["jolted into sudden action","coated with a protective metal","frightened into staying away","divided into hostile camps"],"answer":"jolted into sudden action","answerIndex":0,"difficulty":"easy","explanation":"Galvanise (from electric current) figuratively means to shock into activity — 'normally sleepy... into record turnout' is the sudden awakening. The trap is 'coated with a protective metal': it is the genuine technical sense (galvanised iron), and students who know only that meaning pick it despite the context. 'Frightened into staying away' reverses the outcome (turnout rose); 'divided into hostile camps' confuses galvanise with polarise.","verified":"ok","status":"approved"},{"id":"Q34","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"His answers were so oblique that the panel could not tell whether he supported the merger. As used here, 'oblique' is closest in meaning to","options":["slanting at a physical angle","openly hostile in tone","indirect and evasive","factually wrong in detail"],"answer":"indirect and evasive","answerIndex":2,"difficulty":"medium","explanation":"Oblique answers leave the listener unable to pin down a position — 'could not tell whether he supported' is the giveaway: indirect and evasive. The trap is option A, the geometric literalisation (an oblique line is a slanted one) that students carry over from maths class. 'Openly hostile' fails on 'openly' — obliqueness is the opposite of openness; 'factually wrong' concerns accuracy, and the panel's problem is direction, not truth.","verified":"ok","status":"approved"},{"id":"Q35","section":"VA","format":"Vocab in Context","kind":"mcq","td":30,"stem":"The startup's valuation proved ephemeral, collapsing within a quarter of its listing. As used here, 'ephemeral' is closest in meaning to","options":["exaggerated well beyond reality","lasting a very short time","obtained by fraudulent means","without any historical precedent"],"answer":"lasting a very short time","answerIndex":1,"difficulty":"hard","explanation":"Ephemeral = short-lived (from the Greek for 'lasting a day') — the valuation held only briefly before collapsing 'within a quarter'. The trap is 'exaggerated well beyond reality': the collapse makes an inflated valuation contextually plausible, so students who do not know the word choose what the sentence implies rather than what the word means. 'Fraudulent' adds intent the sentence never states; 'without precedent' confuses ephemeral with unprecedented.","verified":"ok","status":"approved"}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\d{10}$/;
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;

function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,secondsLeft:secondsLeft,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  tickInt=setInterval(function(){
   secondsLeft--;
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(secondsLeft%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
 }
 renderQuestion();
 snSaveSession();
}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(isMCQ(q)?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 document.getElementById("qText").textContent=q.stem;
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:CFG.titaW);
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

 QUESTIONS.forEach(function(q,i){

   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);

  var exh=document.createElement("div");renderExhibit(q,exh);if(exh.childNodes.length)wrap.appendChild(exh);
  if(isMCQ(q)){

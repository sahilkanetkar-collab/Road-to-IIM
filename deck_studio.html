<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Studio has moved to ProDecked</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://prodecked.com/studio">
<meta http-equiv="refresh" content="3; url=https://prodecked.com/studio">
<meta name="theme-color" content="#1f4a44">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1f4a44;color:#fbf6ec;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:460px}
h1{font-size:28px;line-height:1.2;margin:0 0 12px}
p{margin:0 0 22px;color:#c8d8d2;font-size:17px;line-height:1.5}
a{display:inline-block;background:#f0b54a;color:#1d2b27;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px}
a:focus-visible{outline:3px solid #fbf6ec;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Deck Studio has moved</h1>
<p>It's now <b>ProDecked Studio</b>, with every setting from before plus 17 single-purpose PowerPoint tools. Taking you there now…</p>
<a href="https://prodecked.com/studio">Open ProDecked Studio</a>
</main>
<script>
(function(){
  var go=function(){location.replace("https://prodecked.com/studio")};
  var jobs=[];
  try{
    if("serviceWorker" in navigator){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.filter(function(r){
          var w=r.active||r.waiting||r.installing;
          return w&&/deck-studio-sw\.js$/.test(w.scriptURL);
        }).map(function(r){return r.unregister()}));
      }));
    }
    if(window.caches){
      jobs.push(caches.keys().then(function(keys){
        return Promise.all(keys.filter(function(k){return k.indexOf("deck-studio-")===0}).map(function(k){return caches.delete(k)}));
      }));
    }
  }catch(e){}
  Promise.all(jobs).then(go,go);
  setTimeout(go,1500);
})();
</script>
</body>
</html>

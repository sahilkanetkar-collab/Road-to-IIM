var CFG={"testName":"UGAT Mock 006 — Verbal","examName":"UGAT IIM Bangalore","maxMarks":45,"minutes":30,"c":3,"w":-1,"titaW":-1,"hasTita":false,"navNote":"free navigation","sectional":null,"fileName":"ugat_iimb_UGAT_Mock_006_Verbal.html","snKey":"riim_session_UGAT_Mock_006_Verbal","bankPrefix":"UGAT_Mock_006_Verbal","rapid":false};
var QUESTIONS=[{"id":"UGAT_VA_001","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The digitisation of India's welfare architecture is routinely narrated as an unambiguous triumph of administrative modernisation. Direct benefit transfers, biometric authentication, and algorithmically maintained beneficiary databases are credited with excising the discretionary corruption that plagued the analogue state. Within this narrative, 'leakage' becomes the master metric: every rupee that reaches its intended recipient without passing through a human intermediary is counted as a victory for the poor.\n\nHowever, this accounting conceals a quieter form of exclusion. Biometric systems presuppose a legible, stable citizen — one whose fingerprints have not been worn smooth by decades of manual labour, whose name is spelt identically across every database, and who lives within reliable reach of connectivity. When authentication failed under the analogue state, there was a fallback: the discretion of a local official who knew the claimant. The digital state, having defined discretion itself as the disease, offers only the machine's refusal. Denial is thereby laundered into a technical event — a 'failed transaction' — for which no individual is answerable and against which no appeal feels possible.\n\nThe deeper transformation is epistemic. The welfare question shifts from 'who is in need?' to 'who can be verified?' — and the two populations are not the same. Those most likely to fail verification are precisely those most likely to be in need: the aged, the migratory, the manually employed. A system optimised to eliminate the inclusion of the undeserving will, by its very design, tolerate the exclusion of the deserving, because the first error is visible in an audit and the second is not. Efficiency, in other words, is not a neutral virtue; it encodes a choice about which mistakes a society is prepared to see.","stem":"Which of the following real-life situations best reflects the \"laundering\" of denial described in the passage?","options":["A government department dismisses a clerk who was caught demanding bribes to approve pension applications from elderly claimants.","A university publishes detailed written reasons for every rejected scholarship application and names the officer responsible for each decision.","An online visa portal automatically rejects applications over minor data mismatches, informing applicants only that the system could not process their file.","A telecom company compensates customers whose bill payments failed because of a documented server outage during peak evening hours."],"answer":"An online visa portal automatically rejects applications over minor data mismatches, informing applicants only that the system could not process their file.","answerIndex":2,"difficulty":"Hard","explanation":"The passage describes denial being recast as an unanswerable 'technical event'. The visa portal refuses claimants through the machine, giving no reasons and naming no accountable individual — exactly the laundering described. The other situations either restore accountability, acknowledge and remedy the technical failure, or depict the removal of corrupt discretion that the official narrative celebrates.","status":"approved","flags":[],"verified":"ok","verNote":"Application signature question. Length symmetry applied (~18 words each)."},{"id":"UGAT_VA_002","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The digitisation of India's welfare architecture is routinely narrated as an unambiguous triumph of administrative modernisation. Direct benefit transfers, biometric authentication, and algorithmically maintained beneficiary databases are credited with excising the discretionary corruption that plagued the analogue state. Within this narrative, 'leakage' becomes the master metric: every rupee that reaches its intended recipient without passing through a human intermediary is counted as a victory for the poor.\n\nHowever, this accounting conceals a quieter form of exclusion. Biometric systems presuppose a legible, stable citizen — one whose fingerprints have not been worn smooth by decades of manual labour, whose name is spelt identically across every database, and who lives within reliable reach of connectivity. When authentication failed under the analogue state, there was a fallback: the discretion of a local official who knew the claimant. The digital state, having defined discretion itself as the disease, offers only the machine's refusal. Denial is thereby laundered into a technical event — a 'failed transaction' — for which no individual is answerable and against which no appeal feels possible.\n\nThe deeper transformation is epistemic. The welfare question shifts from 'who is in need?' to 'who can be verified?' — and the two populations are not the same. Those most likely to fail verification are precisely those most likely to be in need: the aged, the migratory, the manually employed. A system optimised to eliminate the inclusion of the undeserving will, by its very design, tolerate the exclusion of the deserving, because the first error is visible in an audit and the second is not. Efficiency, in other words, is not a neutral virtue; it encodes a choice about which mistakes a society is prepared to see.","stem":"Which of the following, if true, would most significantly weaken the author's argument regarding exclusion under digital welfare systems?","options":["Audits of biometric welfare programmes routinely record every failed authentication and mandate doorstep delivery to affected claimants within a week.","Several state governments have expanded direct benefit transfers to cover a much wider range of subsidies and social pensions.","Studies confirm that discretionary corruption under the earlier analogue system disproportionately harmed the poorest and least connected claimants.","Fingerprint recognition technology has become significantly cheaper for governments to procure, deploy and maintain at national scale."],"answer":"Audits of biometric welfare programmes routinely record every failed authentication and mandate doorstep delivery to affected claimants within a week.","answerIndex":0,"difficulty":"Hard","explanation":"The author's core claim is that the exclusion of the deserving is invisible in audits and goes unremedied. If audits record every failed authentication and mandate doorstep delivery, the second error becomes both visible and corrected, directly breaking the causal claim. The other options expand the scheme, indict the old system, or address cost — none touches the visibility of exclusion.","status":"approved","flags":[],"verified":"ok","verNote":"Weaken signature question."},{"id":"UGAT_VA_003","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The digitisation of India's welfare architecture is routinely narrated as an unambiguous triumph of administrative modernisation. Direct benefit transfers, biometric authentication, and algorithmically maintained beneficiary databases are credited with excising the discretionary corruption that plagued the analogue state. Within this narrative, 'leakage' becomes the master metric: every rupee that reaches its intended recipient without passing through a human intermediary is counted as a victory for the poor.\n\nHowever, this accounting conceals a quieter form of exclusion. Biometric systems presuppose a legible, stable citizen — one whose fingerprints have not been worn smooth by decades of manual labour, whose name is spelt identically across every database, and who lives within reliable reach of connectivity. When authentication failed under the analogue state, there was a fallback: the discretion of a local official who knew the claimant. The digital state, having defined discretion itself as the disease, offers only the machine's refusal. Denial is thereby laundered into a technical event — mph of administrative modernisation. Direct benefit transfers, biometric authentication, and algorithmically maintained beneficiary databases are credited with excising the discretionary corruption that plagued the analogue state. Within this narrative, 'leakage' becomes the master metric: every rupee that reaches its intended recipient without passing through a human intermediary is counted as a victory for the poor.\n\nHowever, this accounting conceals a quieter form of exclusion. Biometric systems presuppose a legible, stable citizen — one whose fingerprints have not been worn smooth by decades of manual labour, whose name is spelt identically across every database, and who lives within reliable reach of connectivity. When authentication failed under the analogue state, there was a fallback: the discretion of a local official who knew the claimant. The digital state, having defined discretion itself as the disease, offers only the machine's refusal. Denial is thereby laundered into a technical event — a 'failed transaction' — for which no individual is answerable and against which no appeal feels possible.\n\nThe deeper transformation is epistemic. The welfare question shifts from 'who is in need?' to 'who can be verified?' — and the two populations are not the same. Those most likely to fail verification are precisely those most likely to be in need: the aged, the migratory, the manually employed. A system optimised to eliminate the inclusion of the undeserving will, by its very design, tolerate the exclusion of the deserving, because the first error is visible in an audit and the second is not. Efficiency, in other words, is not a neutral virtue; it encodes a choice about which mistakes a society is prepared to see.","stem":"The author refers to fingerprints \"worn smooth by decades of manual labour\" primarily in order to:","options":["argue that biometric technology should be replaced by less intrusive methods of identifying welfare claimants.","illustrate that the failures of biometric verification fall disproportionately on those the system exists to serve.","demonstrate that manual labour remains the dominant form of employment among registered welfare claimants.","evoke sympathy for elderly claimants who are unfamiliar with digital modes of authentication and payment."],"answer":"illustrate that the failures of biometric verification fall disproportionately on those the system exists to serve.","answerIndex":1,"difficulty":"Hard","explanation":"The worn fingerprints exemplify how verification fails precisely for the manually employed poor — the intended beneficiaries — anchoring the claim that those likely to fail verification are those most in need. The author makes no recommendation to replace biometrics, offers no employment statistics, and the failure described is physical wear, not unfamiliarity with technology.","status":"approved","flags":[],"verified":"ok","verNote":"Function/detail trap. Length symmetry applied (~16 words each)."},{"id":"UGAT_VA_005","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The rebranding of millets as 'superfoods' is celebrated as a rare policy success in which nutrition, ecology and farmer welfare appear to align. Urban demand for these hardy grains, long dismissed as coarse subsistence fare, has created premium markets, and cultivation is duly expanding. Yet the celebration obscures a familiar inversion. Millets survived in India's drylands precisely because they stood outside the market: grown on marginal plots, consumed within the household, and exchanged through local networks, they functioned as insurance against drought rather than as a commodity.\n\nPremiumisation dismantles this insurance function. Once millets command city prices, the rational smallholder sells the harvest and buys subsidised rice, exporting the grain's nutritional benefit to consumers who need it least. Contract farming arrangements, meanwhile, standardise varieties for their processing qualities, thinning the very genetic diversity that made the crop drought-proof. The paradox is that the market's embrace, offered as the crop's salvation, dissolves the two virtues — household nutrition and climatic resilience — that made millets worth saving in the first place.","stem":"Which of the following real-life situations best reflects the \"familiar inversion\" described in the passage?","options":["A craft brewery sources heritage barley from local farms and shares its profits with the growers through a cooperative arrangement.","Global demand for quinoa raises its price in Andean markets, and the farming communities that grew it shift to eating cheaper imported wheat.","A state government distributes free millet seeds to dryland farmers in order to expand cultivation across drought-prone districts.","An organic food chain markets imported chia seeds to urban customers at a substantial premium over comparable domestic grains."],"answer":"Global demand for quinoa raises its price in Andean markets, and the farming communities that grew it shift to eating cheaper imported wheat.","answerIndex":1,"difficulty":"Hard","explanation":"The inversion is a subsistence crop's market success stripping its benefit from the community that grew it. Quinoa's price rise pushing its own growers onto cheaper imported wheat replicates the sell-and-substitute mechanism exactly. The brewery scenario is a benign profit-sharing outcome, the seed scheme is state support without a market twist, and the chia scenario shows premium marketing with no dispossession of the source community.","status":"approved","flags":[],"verified":"ok","verNote":"Application signature question."},{"id":"UGAT_VA_006","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The rebranding of millets as 'superfoods' is celebrated as a rare policy success in which nutrition, ecology and farmer welfare appear to align. Urban demand for these hardy grains, long dismissed as coarse subsistence fare, has created premium markets, and cultivation is duly expanding. Yet the celebration obscures a familiar inversion. Millets survived in India's drylands precisely because they stood outside the market: grown on marginal plots, consumed within the household, and exchanged through local networks, they functioned as insurance against drought rather than as a commodity.\n\nPremiumisation dismantles this insurance function. Once millets command city prices, the rational smallholder sells the harvest and buys subsidised rice, exporting the grain's nutritional benefit to consumers who need it least. Contract farming arrangements, meanwhile, standardise varieties for their processing qualities, thinning the very genetic diversity that made the crop drought-proof. The paradox is that the market's embrace, offered as the crop's salvation, dissolves the two virtues — household nutrition and climatic resilience — that made millets worth saving in the first place.","stem":"Which of the following, if true, would most significantly weaken the author's claim that premiumisation dismantles the insurance function of millets?","options":["Millet-based packaged snacks now account for a rapidly growing share of urban grocery spending across metropolitan India.","Agronomists have repeatedly confirmed that traditional millet varieties tolerate drought far better than most commercial cereals.","Several food companies have begun sourcing millets directly from farmer producer organisations at collectively negotiated prices.","Household surveys show that millet-growing families retain a fixed share of every harvest for their own consumption regardless of the price offered."],"answer":"Household surveys show that millet-growing families retain a fixed share of every harvest for their own consumption regardless of the price offered.","answerIndex":3,"difficulty":"Hard","explanation":"The dismantling claim rests on the sell-and-substitute mechanism: smallholders sell the premium-priced harvest and eat subsidised rice instead. If families retain a fixed share for their own consumption regardless of price, the household-nutrition insurance survives premiumisation, breaking the core causal link. The other options confirm urban demand, restate the crop's hardiness, or describe procurement terms without touching household consumption.","status":"approved","flags":[],"verified":"ok","verNote":"Weaken signature question."},{"id":"UGAT_VA_007","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The rebranding of millets as 'superfoods' is celebrated as a rare policy success in which nutrition, ecology and farmer welfare appear to align. Urban demand for these hardy grains, long dismissed as coarse subsistence fare, has created premium markets, and cultivation is duly expanding. Yet the celebration obscures a familiar inversion. Millets survived in India's drylands precisely because they stood outside the market: grown on marginal plots, consumed within the household, and exchanged through local networks, they functioned as insurance against drought rather than as a commodity.\n\nPremiumisation dismantles this insurance function. Once millets command city prices, the rational smallholder sells the harvest and buys subsidised rice, exporting the grain's nutritional benefit to consumers who need it least. Contract farming arrangements, meanwhile, standardise varieties for their processing qualities, thinning the very genetic diversity that made the crop drought-proof. The paradox is that the market's embrace, offered as the crop's salvation, dissolves the two virtues — household nutrition and climatic resilience — that made millets worth saving in the first place.","stem":"It can be logically inferred from the passage that millets historically served dryland households primarily as:","options":["a buffer against climatic risk rather than a source of market income.","a prestigious grain whose consumption signalled social standing within the village.","a commodity whose surplus was regularly traded in distant urban markets.","a crop cultivated chiefly because governments subsidised its production."],"answer":"a buffer against climatic risk rather than a source of market income.","answerIndex":0,"difficulty":"Medium","explanation":"The passage states that millets 'functioned as insurance against drought rather than as a commodity' — grown outside the market, consumed within the household, and exchanged locally. That is a buffer against climatic risk, not income. The passage calls them dismissed 'coarse subsistence fare' (not prestigious), denies distant trade, and mentions no historical subsidy for their cultivation.","status":"approved","flags":[],"verified":"ok","verNote":"Zero-Echo inference trap."},{"id":"UGAT_VA_008","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"The rebranding of millets as 'superfoods' is celebrated as a rare policy success in which nutrition, ecology and farmer welfare appear to align. Urban demand for these hardy grains, long dismissed as coarse subsistence fare, has created premium markets, and cultivation is duly expanding. Yet the celebration obscures a familiar inversion. Millets survived in India's drylands precisely because they stood outside the market: grown on marginal plots, consumed within the household, and exchanged through local networks, they functioned as insurance against drought rather than as a commodity.\n\nPremiumisation dismantles this insurance function. Once millets command city prices, the rational smallholder sells the harvest and buys subsidised rice, exporting the grain's nutritional benefit to consumers who need it least. Contract farming arrangements, meanwhile, standardise varieties for their processing qualities, thinning the very genetic diversity that made the crop drought-proof. The paradox is that the market's embrace, offered as the crop's salvation, dissolves the two virtues — household nutrition and climatic resilience — that made millets worth saving in the first place.","stem":"The author mentions \"contract farming arrangements\" primarily in order to:","options":["argue that smallholders are routinely deceived by the terms of corporate purchase agreements.","contrast the efficiency of organised procurement with the informality of local exchange networks.","show that market integration erodes the genetic diversity underlying the crop's climatic resilience.","recommend stricter regulation of the relationship between food processors and millet growers."],"answer":"show that market integration erodes the genetic diversity underlying the crop's climatic resilience.","answerIndex":2,"difficulty":"Medium","explanation":"Contract farming is cited for standardising varieties and 'thinning the very genetic diversity that made the crop drought-proof' — evidence that market integration undermines climatic resilience, the second of the two virtues the market dissolves. The passage makes no claim of deception, draws no efficiency contrast in favour of procurement, and offers no regulatory recommendation.","status":"approved","flags":[],"verified":"ok","verNote":"Function/detail logic check."},{"id":"UGAT_VA_009","section":"VA","format":"Vocabulary","kind":"mcq","passage":null,"stem":"Fill in the blanks with the most appropriate pair of words:\nFar from being ________, the auditor's final report was a ________ indictment of the firm's accounting practices.","options":["anodyne ... scathing","trenchant ... tepid","verbose ... laudatory","candid ... equivocal"],"answer":"anodyne ... scathing","answerIndex":0,"difficulty":"Hard","explanation":"'Far from being' demands a contrast with what follows. 'Anodyne' (bland, deliberately inoffensive) contrasts with 'scathing' (severely critical), which fits 'indictment'. 'Trenchant ... tepid' reverses the required polarity, 'laudatory' cannot describe an indictment, and 'candid ... equivocal' sets up no coherent contrast.","status":"approved","flags":[],"verified":"ok","verNote":"Double-blank elevated register."},{"id":"UGAT_VA_010","section":"VA","format":"Vocabulary","kind":"mcq","passage":null,"stem":"In the context of corporate negotiations, what does it mean to \"move the goalposts\"?","options":["To set highly ambitious targets for a team","To abandon a project before its completion","To unfairly change the agreed criteria midway","To transfer responsibility to another department"],"answer":"To unfairly change the agreed criteria midway","answerIndex":2,"difficulty":"Easy","explanation":"To move the goalposts is to unfairly alter the agreed rules, targets or criteria after a process is already underway, making success harder to achieve.","status":"approved","flags":[],"verified":"ok","verNote":"Idiom pool."},{"id":"UGAT_VA_011","section":"VA","format":"Vocabulary","kind":"mcq","passage":null,"stem":"Which of the following words is closest in meaning to \"perfunctory\"?","options":["Meticulous","Peremptory","Obligatory","Cursory"],"answer":"Cursory","answerIndex":3,"difficulty":"Medium","explanation":"Perfunctory means done routinely and with minimal effort or genuine care; 'cursory' is the closest synonym. 'Meticulous' is a near-antonym, 'peremptory' is a sound-alike meaning imperious or brooking no refusal, and 'obligatory' concerns duty, not carelessness.","status":"approved","flags":[],"verified":"ok","verNote":"Synonym pool with sound-alike trap."},{"id":"UGAT_VA_012","section":"VA","format":"Grammar","kind":"mcq","passage":null,"stem":"Identify the part of speech of the underlined word in the following sentence:\nThe manager's **measured** response defused the growing tension in the boardroom.","options":["Verb","Adverb","Adjective","Noun"],"answer":"Adjective","answerIndex":2,"difficulty":"Easy","explanation":"'Measured' modifies the noun 'response', describing its quality (calm, deliberate). It therefore functions as an adjective — a participial adjective — not as a verb.","status":"approved","flags":[],"verified":"ok","verNote":"Parts of speech anchor."},{"id":"UGAT_VA_013","section":"VA","format":"Grammar","kind":"mcq","passage":null,"stem":"Fill in the blank with the grammatically correct option:\nScarcely ________ the quarterly review begun when the auditors raised their first objection.","options":["had","has","was","did"],"answer":"had","answerIndex":0,"difficulty":"Medium","explanation":"When a negative adverbial such as 'Scarcely' opens the sentence, subject–auxiliary inversion with the past perfect is required: 'Scarcely had the review begun when...'. 'Has' breaks the past-time frame, 'was' cannot pair with 'begun' here, and 'did' would require the base form 'begin'.","status":"approved","flags":[],"verified":"ok","verNote":"Negative inversion, secondary grammar pool."},{"id":"UGAT_VA_014","section":"VA","format":"Statement Odd-One-Out","kind":"mcq","passage":null,"stem":"Four terms are given below. Three are alike in a certain way, while one is different. Choose the odd one out.","options":["Monopoly","Subsidy","Oligopoly","Duopoly"],"answer":"Subsidy","answerIndex":1,"difficulty":"Easy","explanation":"Monopoly, Oligopoly and Duopoly are market structures defined by the number of sellers in a market. A subsidy is a form of government financial support, not a market structure.","status":"approved","flags":[],"verified":"ok","verNote":"LR-style odd-one-out."},{"id":"UGAT_VA_015","section":"VA","format":"Statement Odd-One-Out","kind":"mcq","passage":null,"stem":"Three of the following terms belong to the same category of economic policy. Identify the one that does not belong.","options":["Repo Rate","Cash Reserve Ratio","Statutory Liquidity Ratio","Fiscal Deficit"],"answer":"Fiscal Deficit","answerIndex":3,"difficulty":"Medium","explanation":"Repo Rate, Cash Reserve Ratio and Statutory Liquidity Ratio are monetary policy instruments administered by the central bank. Fiscal Deficit belongs to fiscal policy — the government's budgetary position — not to monetary policy.","status":"approved","flags":[],"verified":"ok","verNote":"LR-style odd-one-out."}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var SEC=(CFG.sectional&&CFG.sectional.length)?CFG.sectional:null;
var secIdx=0,elapsedPrior=0;
var secondsLeft=SEC?SEC[0].minutes*60:CFG.minutes*60;
var tickInt=null,qShownTs=0;
var RAPID=!!CFG.rapid; /* v2.4 rapid mode */
var qSecondsLeft=0,qStartTs=0,qInterval=null,pendingResumeStartTs=null;
function isMCQ(q){return !!(q.options&&q.options.length)}

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,secondsLeft:secondsLeft,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  tickInt=setInterval(function(){
   secondsLeft--;
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(secondsLeft%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
 }
 renderQuestion();
 snSaveSession();
}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(isMCQ(q)?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 document.getElementById("qText").textContent=q.stem;
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:CFG.titaW);
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+q.section+" \u00b7 "+q.format+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  var stem=document.createElement("div");stem.className="rqStem";stem.textContent=q.stem;wrap.appendChild(stem);
  var exh=document.createElement("div");renderExhibit(q,exh);if(exh.childNodes.length)wrap.appendChild(exh);
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== DOWNLOAD PDF ==================== */
function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  doc.text("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+"   ["+statusLabel+"]",margin,y);y+=12;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(q.stem,margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table!=null&&q.table!==""){
   var trows=Array.isArray(q.table)?q.table:(q.table&&Array.isArray(q.table.rows)?(Array.isArray(q.table.headers)?[q.table.headers].concat(q.table.rows):q.table.rows):null);
   doc.setTextColor(40,40,40);
   if(trows){trows.forEach(function(r){writeWrapped(Array.isArray(r)?r.map(String).join("  |  "):String(r),margin+12,pageW-2*margin-12,8.5,"normal")})}
   else{
    var ttxt=String(q.table);
    if(ttxt.trim().charAt(0)==="<")ttxt=ttxt.replace(new RegExp("</tr>","gi"),"\n").replace(new RegExp("</t[dh]>","gi"),"  |  ").replace(new RegExp("<[^>]+>","g")," ").replace(new RegExp("&amp;","g"),"&").replace(new RegExp("&nbsp;","g")," ");
    ttxt.split("\n").forEach(function(ln){ln=ln.replace(new RegExp("[ ]+","g")," ").trim();if(ln)writeWrapped(ln,margin+12,pageW-2*margin-12,8.5,"normal")});
   }
   doc.setTextColor(0,0,0);y+=2;
  }
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure \u2014 shown in the on-screen review]",margin+12,pageW-2*margin-12,8.5,"italic");doc.setTextColor(0,0,0)}
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="  \u2713 correct";
    else if(idx===a)marker="  \u2717 your choice";
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   writeWrapped("Your answer: "+(skippedQ?"-":a),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

/* ==================== PAGE LOAD ==================== */
document.getElementById("lgTitle").textContent=TEST_NAME;
var lgTime=CFG.rapid?("per-question clock \u00b7 forward only \u00b7 auto-advance at 0s \u00b7 ~"+CFG.minutes+" min total"):SEC?(SEC.map(function(p){return p.sec+" "+p.minutes+"m"}).join(" \u2192 ")+" \u00b7 sectional lock \u00b7 no return"):(CFG.minutes+" minutes \u00b7 "+(CFG.navNote||"free navigation"));
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 TITA wrong "+CFG.titaW:"")+" \u00b7 Max "+MAX_MARKS+"<br>"+lgTime+" \u00b7 auto-submit at 00:00";
document.getElementById("loginBtn").addEventListener("click",startTest);
snFlushQueue();
snTryResume();
</script>

nce 3 follows: 'That domestic dominance' can only refer to the transaction volumes in 4, and it states the thesis — payments as foreign policy.\nSentence 2 comes third: the agreements with Singapore, the UAE, France and Sri Lanka are the concrete evidence for the foreign-policy claim in 3.\nSentence 5 comes fourth: 'Each such link' needs the agreements of 2 as its antecedent, and it widens the point to standards.\nSentence 1 closes: 'in other words' marks a summarising restatement and cannot open; 'a new contestant' generalises everything before it.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: uniqueness verified — dominance(3) needs 4; 'Each such link'(5) needs 2; 'in other words'(1) is terminal by function"},{"id":"IPMAT_VARC_090","section":"VA","format":"Parajumble TITA","kind":"tita","passage":"1. At a wet-bulb reading of 35°C, sweat can no longer evaporate, and even a healthy person resting in the shade will die within hours.\n2. Parts of coastal India and the Persian Gulf have already brushed against readings once thought purely theoretical.\n3. Climate models suggest such episodes will lengthen from hours to days within a generation, turning a physiological curiosity into a planning emergency.\n4. Meteorologists measure survivable heat not by the thermometer alone but by the wet-bulb temperature, which combines heat and humidity.","stem":"The sentences given above, when arranged in the proper order, form a coherent paragraph. Type the correct sequence of sentence numbers as your answer (a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid).","options":[],"answer":"4123","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 4123\nSentence 4 opens: it introduces the wet-bulb temperature by full name with a definition, and nothing in it refers backward.\nSentence 1 follows: 'a wet-bulb reading of 35°C' presupposes the measure just defined in 4, and states the lethal threshold.\nSentence 2 comes third: 'readings once thought purely theoretical' refers to the threshold in 1, and moves from principle to real places.\nSentence 3 closes: 'such episodes' needs the near-threshold events of 2 as its antecedent, and the projection into the future is the paragraph's natural terminus.\nNo other order survives: 1 before 4 strands the wet-bulb reading without its definition, and 3 before 2 leaves 'such episodes' without a referent.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: uniqueness verified — definition(4)→threshold(1)→real readings(2)→'such episodes'(3) referent chain blocks every alternative order"}];

var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\d{10}$/;
function safeMarkup(h){if(!h)return "";return /<script|<iframe|javascript:|\son\w+\s*=/i.test(h)?"":h}
function stemHTML(s){if(!s)return "";var t=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return t.replace(/\[\[(.*?)\]\]/g,"<u>$1</u>")}
var BLOCK_MSG="This PIN isn't on the active student list. Message Sahil Sir if you think this is a mistake.";

/* ==================== AVAILABILITY WINDOW (IST) ==================== */
/* Live: Mon 7 Sep 2026 00:00 IST -> Thu 10 Sep 2026 00:00 IST (UTC+5:30) */
var WINDOW={openUTC:Date.UTC(2026,8,6,18,30,0),closeUTC:Date.UTC(2026,8,9,18,30,0)};
function windowState(){var n=Date.now();return n<WINDOW.openUTC?"before":(n>=WINDOW.closeUTC?"closed":"open")}
function fmtIST(utcMs){return new Date(utcMs).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true})}
function applyWindowGate(){
 var st=windowState();
 var bn=document.getElementById("winBanner");
 var btn=document.getElementById("loginBtn");
 if(!bn||!btn)return st;
 if(st==="before"){
  bn.style.display="block";bn.className="winBanner soon";
  bn.innerHTML="\u2605 FEATURED \u00b7 Goes live "+fmtIST(WINDOW.openUTC)+" IST \u00b7 open till "+fmtIST(WINDOW.closeUTC)+" IST";
  btn.disabled=true;btn.style.opacity=".45";btn.textContent="OPENS "+fmtIST(WINDOW.openUTC).toUpperCase();
 }else if(st==="closed"){
  bn.style.display="block";bn.className="winBanner over";
  bn.textContent="This test window has closed ("+fmtIST(WINDOW.openUTC)+" \u2192 "+fmtIST(WINDOW.closeUTC)+" IST).";
  btn.disabled=true;btn.style.opacity=".45";btn.textContent="WINDOW CLOSED";
 }else{
  bn.style.display="block";bn.className="winBanner live";
  bn.innerHTML="\u2605 FEATURED \u00b7 LIVE NOW \u00b7 window closes "+fmtIST(WINDOW.closeUTC)+" IST";
  btn.disabled=false;btn.style.opacity="";btn.textContent="Start Test";
 }
 return st;
}

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_OPEN_TEST=true; /* Go Getters open drop — no PIN gating. Set false to re-enable the gate. */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 if(WL_OPEN_TEST)return true;
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var marked=new Array(NQ).fill(false);
/* ==================== SECTIONAL TIMERS (Indore pattern) ==================== */
var SECTION_ORDER=["QA-SA","QA-MCQ","VA"];
var SECTION_LABEL={"QA-SA":"QA \u2014 Short Answer","QA-MCQ":"QA \u2014 MCQ","VA":"VARC"};
var SECTIONS=SECTION_ORDER.map(function(code){
 var idx=[];QUESTIONS.forEach(function(q,i){if(q.section===code)idx.push(i)});
 return {code:code,minutes:40,from:idx[0],to:idx[idx.length-1]};
});
var curSec=0;
var secLeft=SECTIONS.map(function(s){return s.minutes*60});
var elapsedTotal=0;
var tickInt=null,qShownTs=0;

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,marked:marked,questionTimes:questionTimes,curSec:curSec,secLeft:secLeft,elapsedTotal:elapsedTotal,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(s.marked&&s.marked.length===NQ)marked=s.marked.map(function(v){return !!v});
 if(typeof s.curSec==="number")curSec=Math.max(0,Math.min(SECTIONS.length-1,s.curSec));
 if(s.secLeft&&s.secLeft.length===SECTIONS.length)secLeft=s.secLeft.map(function(v){return Math.max(0,v)});
 secLeft[curSec]=Math.max(10,secLeft[curSec]);
 if(typeof s.elapsedTotal==="number")elapsedTotal=s.elapsedTotal;
 currentQ=Math.max(SECTIONS[curSec].from,Math.min(SECTIONS[curSec].to,currentQ));
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var wst=applyWindowGate();
 if(wst==="before"){showLoginError("This test goes live on "+fmtIST(WINDOW.openUTC)+" IST.");return}
 if(wst==="closed"){showLoginError("This test's window has closed.");return}
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 buildPalette();
 tickInt=setInterval(function(){
  secLeft[curSec]--;elapsedTotal++;
  var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secLeft[curSec]);
  if(elapsedTotal%10===0)snSaveSession();
  if(secLeft[curSec]<=0){
   if(curSec>=SECTIONS.length-1)submitTest();
   else advanceSection();
  }
 },1000);
 renderQuestion();
 snSaveSession();
}
function advanceSection(){
 markTime();
 secLeft[curSec]=0;
 curSec++;
 currentQ=SECTIONS[curSec].from;
 buildPalette();
 snSaveSession();
 renderQuestion();
}

/* ==================== PALETTE (current section only) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var s=SECTIONS[curSec];
 for(var i=s.from;i<=s.to;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 var s=SECTIONS[curSec];
 for(var i=s.from;i<=s.to;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("mk");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var s=SECTIONS[curSec];
 document.getElementById("qCounter").textContent=SECTION_LABEL[s.code]+" ("+(curSec+1)+"/"+SECTIONS.length+") \u00b7 Q "+(currentQ-s.from+1)+" / "+(s.to-s.from+1);
 document.getElementById("timer").textContent=fmtClock(secLeft[curSec]);
 var sb=document.getElementById("submitBtn");if(sb)sb.style.display=(curSec===SECTIONS.length-1)?"":"none";
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(q.options&&q.options.length?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 var fB=document.getElementById("figBox");fB.innerHTML=safeMarkup(q.fig)+safeMarkup(q.table);
 document.getElementById("qText").innerHTML=stemHTML(q.stem);
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(q.options&&q.options.length){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();renderQuestion()};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintMarkBtn();
 paintPalette();
}
function nav(d){markTime();var s=SECTIONS[curSec];currentQ=Math.max(s.from,Math.min(s.to,currentQ+d));snSaveSession();renderQuestion()}
function clearResponse(){answers[currentQ]=null;snSaveSession();renderQuestion()}
function toggleMark(){marked[currentQ]=!marked[currentQ];snSaveSession();paintMarkBtn();paintPalette()}
function paintMarkBtn(){var b=document.getElementById("markBtn");if(b)b.innerHTML=marked[currentQ]?"\u2691 Unmark":"\u2691 Mark for Review"}
function jumpTo(i){var s=SECTIONS[curSec];if(i<s.from||i>s.to)return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== SCORING HELPERS ==================== */
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(q.options&&q.options.length)return a===q.answerIndex;
 var norm=function(x){return String(x).toLowerCase().replace(/[,\s]/g,"")};
 var na=norm(a),nk=norm(q.answer);
 var NUM=/^-?\d+(\.\d+)?$/;
 if(NUM.test(na)&&NUM.test(nk))return Number(na)===Number(nk);
 return na===nk;
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!(q.options&&q.options.length))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=((q.options&&q.options.length)?CFG.w:(q.section==="VA"?CFG.w:CFG.titaW));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=elapsedTotal;
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+q.section+" \u00b7 "+q.format+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  var stem=document.createElement("div");stem.className="rqStem";stem.innerHTML=stemHTML(q.stem);wrap.appendChild(stem);
  if(q.fig||q.table){var ft=document.createElement("div");ft.className="figWrap";ft.innerHTML=safeMarkup(q.fig)+safeMarkup(q.table);wrap.appendChild(ft)}
  if(q.options&&q.options.length){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== DOWNLOAD PDF ==================== */
function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  doc.text("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+"   ["+statusLabel+"]",margin,y);y+=12;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(q.stem,margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table){var tt=q.table.replace(/<\/tr>/g,"\n").replace(/<\/t[hd]>/g,"  |  ").replace(/<[^>]+>/g,"").replace(/\n+/g,"\n").trim();doc.setTextColor(60,60,60);writeWrapped(tt,margin+12,pageW-2*margin-12,8,"normal");doc.setTextColor(0,0,0);}
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure - see on-screen review]",margin+12,pageW-2*margin-12,8,"italic");doc.setTextColor(0,0,0);}
  if(q.options&&q.options.length){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="  \u2713 correct";
    else if(idx===a)marker="  \u2717 your choice";
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   writeWrapped("Your answer: "+(skippedQ?"-":a),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

/* ==================== PAGE LOAD ==================== */
document.getElementById("lgTitle").textContent=TEST_NAME;
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 QA-SA TITA wrong "+CFG.titaW+", VARC TITA wrong "+CFG.w:"")+" \u00b7 Max "+MAX_MARKS+"<br>3 sections \u00d7 40 min, order locked (QA-SA \u2192 QA-MCQ \u2192 VARC) \u00b7 each section auto-advances at 00:00, no returning \u00b7 test auto-submits when VARC time ends";
document.getElementById("loginBtn").addEventListener("click",startTest);
applyWindowGate();
setInterval(function(){if(!started)applyWindowGate()},30000);
snFlushQueue();
snTryResume();
</script>

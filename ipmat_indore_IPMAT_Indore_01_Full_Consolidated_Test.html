<script>

var CFG={"testName":"IPMAT Indore 01 — Full Consolidated Test","examName":"IPMAT Indore","maxMarks":360,"minutes":120,"c":4,"w":-1,"titaW":0,"hasTita":true,"navNote":"sectional lock: QA-SA 40 \u2192 QA-MCQ 40 \u2192 VARC 40, auto-advance, no return","fileName":"ipmat_indore_IPMAT_Indore_01_Full_Consolidated_Test.html","snKey":"riim_session_IPMAT_Indore_01_Full_Consolidated_Test","bankPrefix":"IPMAT_Indore_01_Full_Consolidated_Test"};
var QUESTIONS=[{"id":"IPMAT_QASA_001","section":"QA-SA","format":"Sequences: AP with constrained first term and common difference","kind":"tita","passage":null,"stem":"Let a1, a2, a3, … be an arithmetic progression of positive integers in which the first term satisfies a1 ≤ 5 and the common difference d is an integer satisfying 4 \u003c d \u003c 9. If a7 = 41, then the sum of the first 10 terms of the progression is ___","options":[],"answer":"320","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: nth-term formula of an AP: an = a1 + (n − 1)d, so a7 = a1 + 6d = 41.\nStep 2: Scan every allowed d. Since 4 \u003c d \u003c 9 and d is an integer, d ∈ {5, 6, 7, 8}.\nd = 5 → a1 = 41 − 30 = 11, rejected because a1 ≤ 5.\nd = 6 → a1 = 41 − 36 = 5 ✓ (positive and ≤ 5).\nd = 7 → a1 = −1 and d = 8 → a1 = −7, rejected because the terms must be positive integers.\nSo a1 = 5, d = 6 is the only possibility.\nStep 3: Sum formula Sn = n/2 [2a1 + (n − 1)d]: S10 = 5(2·5 + 9·6) = 5 × 64 = 320.\nInteger check: 320 ✓, and the (a1, d) pair is unique, so the answer is unique.\nKey verified by brute-force scan over all (a1, d) pairs.","archetype":"AP with constrained first term / common difference","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force scan a1 ∈ {1..5}, d ∈ {5..8} → unique (5,6); S10 = 320"},{"id":"IPMAT_QASA_002","section":"QA-SA","format":"Number system: remainder of a power sum mod 9","kind":"tita","passage":null,"stem":"The remainder when 7^2026 + 7^2024 is divided by 9 is ___","options":[],"answer":"2","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Easy","explanation":"Step 1: Find the cycle of powers of 7 modulo 9. 7^1 ≡ 7, 7^2 = 49 ≡ 4, 7^3 = 343 ≡ 1 (mod 9). So the remainders repeat with period 3: 7, 4, 1, 7, 4, 1, …\nStep 2: Place each exponent in the cycle. 2026 = 3 × 675 + 1, so 2026 ≡ 1 (mod 3) and 7^2026 ≡ 7 (mod 9). 2024 = 3 × 674 + 2, so 2024 ≡ 2 (mod 3) and 7^2024 ≡ 4 (mod 9).\nStep 3: Add the remainders: 7 + 4 = 11, and 11 ≡ 2 (mod 9).\nInteger check: 2 ✓ (a remainder on division by 9 must be an integer from 0 to 8).\nKey verified by modular exponentiation in code: pow(7, 2026, 9) + pow(7, 2024, 9) ≡ 2 (mod 9).","archetype":"Remainder mod 9 of a power sum","status":"approved","flags":[],"verified":"ok","verNote":"G1: modular exponentiation pow(7,2026,9)=7, pow(7,2024,9)=4 → 11 mod 9 = 2"},{"id":"IPMAT_QASA_003","section":"QA-SA","format":"P&C: selections under a divisibility condition","kind":"tita","passage":null,"stem":"The number of ways of choosing three distinct integers from the set {1, 2, 3, …, 9} such that their sum is divisible by 3 is ___","options":[],"answer":"30","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: Sort the nine integers by their remainder on division by 3 (residue classes). Remainder 0: {3, 6, 9}; remainder 1: {1, 4, 7}; remainder 2: {2, 5, 8} — three numbers in each class.\nStep 2: A sum of three numbers is divisible by 3 in exactly two ways: all three from the same class, or one from each class.\nStep 3: Count each case.\nAll three from one class: C(3,3) = 1 per class, so 3 × 1 = 3 ways.\nOne from each class: 3 × 3 × 3 = 27 ways.\nStep 4: Total = 3 + 27 = 30.\nInteger check: 30 ✓.\nKey verified by brute-force enumeration of all C(9,3) = 84 triples in code; exactly 30 have a sum divisible by 3.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force enumeration over all 84 triples from {1..9} → 30 with sum ≡ 0 mod 3"},{"id":"IPMAT_QASA_004","section":"QA-SA","format":"Arithmetic: CI compounded half-yearly with mid-term repayment","kind":"tita","passage":null,"stem":"Savitri borrows 40000 rupees from a bank that charges interest at 10% per annum, compounded half-yearly. At the end of the first six months she repays 12000 rupees. The amount in rupees she must pay at the end of the year to clear the loan completely is ___","options":[],"answer":"31500","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: Convert the rate. Compounded half-yearly, 10% per annum means 5% per half-year.\nStep 2: Grow the loan for the first six months using the compound-interest formula A = P(1 + r): 40000 × 1.05 = 42000 rupees owed.\nStep 3: Subtract the repayment made at that moment: 42000 − 12000 = 30000 rupees remain outstanding.\nStep 4: Grow the balance for the second six months: 30000 × 1.05 = 31500 rupees.\nSo she must pay 31500 rupees at the end of the year.\nInteger check: 31500 ✓ (money answers may exceed 350).\nKey verified by exact fraction arithmetic in code: (40000 × 21/20 − 12000) × 21/20 = 31500 exactly, no rounding involved.","archetype":"CI half-yearly with mid-term repayment","status":"approved","flags":[],"verified":"ok","verNote":"G1: exact Fraction arithmetic (40000·1.05 − 12000)·1.05 = 31500"},{"id":"IPMAT_QASA_005","section":"QA-SA","format":"Geometry: cyclic quadrilateral (Ptolemy)","kind":"tita","passage":null,"stem":"Let ABCD be a cyclic quadrilateral with AB = 7, BC = 24, CD = 20 and diagonal AC = 25. Then the length of the diagonal BD equals ___","options":[],"answer":"20","answerIndex":null,"tags":[],"fig":"\u003csvg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg'>\u003ccircle cx='200' cy='150' r='125' fill='none' stroke='black' stroke-width='1.5'/>\u003cpolygon points='75,150 94.6,82.8 325,150 165,270' fill='none' stroke='black' stroke-width='1.5'/>\u003cline x1='75' y1='150' x2='325' y2='150' stroke='black' stroke-width='1'/>\u003cline x1='94.6' y1='82.8' x2='165' y2='270' stroke='black' stroke-width='1' stroke-dasharray='5,4'/>\u003ccircle cx='75' cy='150' r='2.5'/>\u003ccircle cx='94.6' cy='82.8' r='2.5'/>\u003ccircle cx='325' cy='150' r='2.5'/>\u003ccircle cx='165' cy='270' r='2.5'/>\u003ctext x='56' y='155' font-size='16'>A\u003c/text>\u003ctext x='84' y='72' font-size='16'>B\u003c/text>\u003ctext x='334' y='155' font-size='16'>C\u003c/text>\u003ctext x='158' y='290' font-size='16'>D\u003c/text>\u003ctext x='62' y='110' font-size='13'>7\u003c/text>\u003ctext x='202' y='104' font-size='13'>24\u003c/text>\u003ctext x='252' y='222' font-size='13'>20\u003c/text>\u003ctext x='230' y='143' font-size='13'>25\u003c/text>\u003ctext x='112' y='188' font-size='13'>BD = ?\u003c/text>\u003c/svg>","table":null,"difficulty":"Hard","explanation":"Step 1: Spot the right triangle. In triangle ABC, 7² + 24² = 49 + 576 = 625 = 25², so angle ABC = 90° (converse of Pythagoras). An inscribed right angle stands on a diameter (angle in a semicircle), so AC = 25 is a diameter of the circle.\nStep 2: Then angle ADC is also 90° (angle in a semicircle). In right triangle ADC: AD² = AC² − CD² = 625 − 400 = 225, so AD = 15.\nStep 3: Ptolemy's theorem for a cyclic quadrilateral: AC × BD = AB × CD + BC × AD.\n25 × BD = 7 × 20 + 24 × 15 = 140 + 360 = 500, so BD = 20.\nInteger check: 20 ✓.\nKey verified by coordinate geometry in code: placing the circle at the origin reproduces AB = 7, BC = 24, CD = 20, AD = 15 and gives BD = 20 exactly.","archetype":"Cyclic quadrilateral with given lengths (Ptolemy)","status":"approved","flags":[],"verified":"ok","verNote":"G1: coordinate reconstruction on circle r = 12.5 confirms all sides and BD = 20; Ptolemy cross-check 25·20 = 140 + 360"},{"id":"IPMAT_QASA_006","section":"QA-SA","format":"Algebra: two quadratics with a common root","kind":"tita","passage":null,"stem":"The quadratic equations x² − 5x + 6 = 0 and x² + kx − 12 = 0, where k is a real number, have exactly one root in common. The sum of all possible values of k is ___","options":[],"answer":"5","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Hard","explanation":"Step 1: Solve the first equation by factoring: x² − 5x + 6 = (x − 2)(x − 3) = 0, so its roots are 2 and 3. Any common root must be one of these.\nStep 2: Case r = 2. Substitute into the second equation: 4 + 2k − 12 = 0, so k = 4. Then x² + 4x − 12 = (x + 6)(x − 2) has roots 2 and −6 — exactly one root (2) is shared. Valid.\nStep 3: Case r = 3. Substitute: 9 + 3k − 12 = 0, so k = 1. Then x² + x − 12 = (x + 4)(x − 3) has roots 3 and −4 — exactly one root (3) is shared. Valid.\nStep 4: Both quadratics can never share both roots, since the constant terms 6 and −12 differ. So k ∈ {4, 1} and the sum is 4 + 1 = 5.\nInteger check: 5 ✓.\nKey verified by symbolic solving of both cases in code; each k gives exactly one shared root.","archetype":"Quadratics with a parameter (common root)","status":"approved","flags":[],"verified":"ok","verNote":"G1: sympy solve per case — k = 4 (root 2) and k = 1 (root 3), both valid; sum = 5"},{"id":"IPMAT_QASA_007","section":"QA-SA","format":"Sets: three-set Venn with percentages","kind":"tita","passage":null,"stem":"In a survey of 400 people, 60% like tea, 50% like coffee and 40% like juice. Further, 30% like both tea and coffee, 20% like both coffee and juice, 25% like both tea and juice, and 15% like all three drinks. The number of people who like exactly one of the three drinks is ___","options":[],"answer":"180","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: Use the exactly-one region formula for a three-set Venn diagram: (only A) = n(A) − n(A∩B) − n(A∩C) + n(A∩B∩C), working in percentages first.\nStep 2: Compute each region.\nOnly tea = 60 − 30 − 25 + 15 = 20%.\nOnly coffee = 50 − 30 − 20 + 15 = 15%.\nOnly juice = 40 − 25 − 20 + 15 = 10%.\nStep 3: Exactly one drink = 20 + 15 + 10 = 45%.\nStep 4: Convert to people: 45% of 400 = 180.\nConsistency check: by inclusion–exclusion the union is 60 + 50 + 40 − 30 − 20 − 25 + 15 = 90% ≤ 100%, so the data reconcile (10% like none).\nInteger check: 180 ✓.\nKey verified in code by computing all seven Venn regions from the given percentages; every region is non-negative and the exactly-one total is 180 people.","archetype":"Three-set Venn percentages","status":"approved","flags":[],"verified":"ok","verNote":"G1: region-by-region computation — 20% + 15% + 10% = 45% of 400 = 180; union 90% reconciles"},{"id":"IPMAT_QASA_008","section":"QA-SA","format":"Arithmetic: ratio changing after joinings and departures","kind":"tita","passage":null,"stem":"The ratio of the number of boys to the number of girls in a sports club is 4 : 3. After 10 boys join the club and 5 girls leave it, the ratio of boys to girls becomes 3 : 2. The total number of members the club had originally is ___","options":[],"answer":"245","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: Introduce the ratio multiplier. Let the original numbers be boys = 4x and girls = 3x for some positive number x.\nStep 2: Write the new ratio after the changes: (4x + 10) boys and (3x − 5) girls are in the ratio 3 : 2, so (4x + 10)/(3x − 5) = 3/2.\nStep 3: Cross-multiply and solve: 2(4x + 10) = 3(3x − 5) gives 8x + 20 = 9x − 15, so x = 35.\nStep 4: Original total = 4x + 3x = 7x = 7 × 35 = 245.\nVerification of the ratio: boys become 140 + 10 = 150 and girls become 105 − 5 = 100, and 150 : 100 = 3 : 2 ✓.\nInteger check: 245 ✓, and x = 35 is the unique solution of a linear equation.\nKey verified by symbolic solving in code.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: sympy solve 2(4x+10) = 3(3x−5) → x = 35, total 245; forward check 150:100 = 3:2"},{"id":"IPMAT_QASA_009","section":"QA-SA","format":"Caselet: LR set-membership 3Q (SA)","kind":"tita","passage":"Five friends — Aruna, Bharat, Geeta, Rekha and Vikram — were asked which of three activities they like: Trekking, Painting and Chess. The following facts are known.\n1. Each friend likes at least one of the three activities, and each activity is liked by exactly three of the five friends.\n2. Vikram likes all three activities, and he is the only friend who likes all three.\n3. Aruna and Geeta both like Trekking; Aruna does not like Chess.\n4. Bharat likes exactly one activity and Rekha likes exactly one activity, and the activity Bharat likes is not the activity Rekha likes.\n5. Rekha and Geeta do not like any activity in common.","stem":"The number of friends who like exactly two of the three activities is ___","options":[],"answer":"2","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: Count memberships. Each activity is liked by exactly 3 friends, so total (friend, activity) likings = 3 × 3 = 9.\nStep 2: Vikram accounts for 3, Bharat for 1, Rekha for 1 (facts 2 and 4). So Aruna and Geeta together account for 9 − 5 = 4. Neither can like all three (fact 2), so each likes exactly 2.\nStep 3: Aruna likes Trekking but not Chess, so Aruna likes Trekking and Painting. Trekking already has Aruna, Geeta, Vikram — full — so Bharat and Rekha do not trek.\nStep 4: If Rekha's one activity were Chess, fact 5 forces Geeta's second activity to be Painting, and Chess then needs Bharat — but then Bharat and Rekha share Chess, breaking fact 4. So Rekha likes Painting, Geeta's second activity is Chess, and Bharat likes Chess.\nStep 5: Exactly two activities: Aruna (Trekking, Painting) and Geeta (Trekking, Chess) — 2 friends.\nAnswer must be an integer — 2 ✓. Key verified by brute-force enumeration of all 2^15 membership assignments; exactly one arrangement satisfies all five facts.","archetype":"Five friends × three activities with set constraints (Indore 2026 SA)","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force over all 32768 membership assignments — unique solution A{T,P}, B{C}, G{T,C}, R{P}, V{T,P,C}; exactly-two count = 2"},{"id":"IPMAT_QASA_010","section":"QA-SA","format":"Caselet: LR set-membership 3Q (SA)","kind":"tita","passage":"Five friends — Aruna, Bharat, Geeta, Rekha and Vikram — were asked which of three activities they like: Trekking, Painting and Chess. The following facts are known.\n1. Each friend likes at least one of the three activities, and each activity is liked by exactly three of the five friends.\n2. Vikram likes all three activities, and he is the only friend who likes all three.\n3. Aruna and Geeta both like Trekking; Aruna does not like Chess.\n4. Bharat likes exactly one activity and Rekha likes exactly one activity, and the activity Bharat likes is not the activity Rekha likes.\n5. Rekha and Geeta do not like any activity in common.","stem":"The number of ways in which a pair of friends can be chosen so that both friends in the pair like Chess is ___","options":[],"answer":"3","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: From the unique arrangement (worked out in the previous question), the friends who like Chess are Bharat, Geeta and Vikram.\nStep 2: A pair means an unordered selection of 2 friends from these 3. By the combination formula, the number of pairs = C(3, 2) = 3.\nStep 3: Listing them confirms it: (Bharat, Geeta), (Bharat, Vikram), (Geeta, Vikram).\nAnswer must be an integer — 3 ✓. Key verified by brute-force enumeration: the caselet has exactly one consistent arrangement, in which the Chess set is {Bharat, Geeta, Vikram}, giving C(3,2) = 3 pairs.","archetype":"Five friends × three activities with set constraints (Indore 2026 SA)","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force enumeration — Chess likers {B, G, V}; itertools.combinations count = 3"},{"id":"IPMAT_QASA_011","section":"QA-SA","format":"Caselet: LR set-membership 3Q (SA)","kind":"tita","passage":"Five friends — Aruna, Bharat, Geeta, Rekha and Vikram — were asked which of three activities they like: Trekking, Painting and Chess. The following facts are known.\n1. Each friend likes at least one of the three activities, and each activity is liked by exactly three of the five friends.\n2. Vikram likes all three activities, and he is the only friend who likes all three.\n3. Aruna and Geeta both like Trekking; Aruna does not like Chess.\n4. Bharat likes exactly one activity and Rekha likes exactly one activity, and the activity Bharat likes is not the activity Rekha likes.\n5. Rekha and Geeta do not like any activity in common.","stem":"A club charges each friend 150 rupees for every activity that the friend likes. The total amount, in rupees, paid by the five friends together is ___","options":[],"answer":"1350","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: The total payment is 150 rupees times the total number of (friend, activity) likings, so first count the likings.\nStep 2: Fact 1 says each of the three activities is liked by exactly three friends, so the total number of likings = 3 × 3 = 9. (Check against the arrangement: Aruna 2 + Bharat 1 + Geeta 2 + Rekha 1 + Vikram 3 = 9 ✓.)\nStep 3: Total amount = 9 × 150 = 1350 rupees.\nAnswer must be an integer — 1350 ✓ (a money answer, so it may exceed the usual range). Key verified by brute-force enumeration: the unique arrangement has 9 likings, and 9 × 150 = 1350.","archetype":"Five friends × three activities with set constraints (Indore 2026 SA)","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force enumeration — total memberships 9 in the unique solution; 9 × 150 = 1350"},{"id":"IPMAT_QASA_012","section":"QA-SA","format":"Matrices: 3×3 determinant with a+b+c = 0","kind":"tita","passage":null,"stem":"Let a, b, c be real numbers with a + b + c = 0. If the determinant of the matrix M given below is 26, then abc equals ___","options":[],"answer":"24","answerIndex":null,"tags":[],"fig":null,"table":"\u003ctable border=\"1\" cellpadding=\"6\" style=\"border-collapse:collapse;text-align:center\">\u003ctr>\u003ctd colspan=\"3\">\u003cb>M =\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>b\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>c\u003c/td>\u003c/tr>\u003c/table>","difficulty":"Medium","explanation":"Step 1: Expand the determinant along the first row (cofactor expansion).\ndet M = a(bc − 1) − 1(c − 1) + 1(1 − b).\nStep 2: Simplify: det M = abc − a − c + 1 + 1 − b = abc − (a + b + c) + 2.\nStep 3: Apply the given condition a + b + c = 0, so det M = abc + 2.\nStep 4: Set abc + 2 = 26, giving abc = 24.\nAnswer must be an integer — 24 ✓. Key verified by symbolic expansion (the determinant simplifies exactly to abc − (a+b+c) + 2) and by a numerical check: a = 6, b = −3 + √5, c = −3 − √5 satisfy a + b + c = 0 and abc = 24, and the matrix determinant computes to 26.","archetype":"det condition with a + b + c = 0 (Indore matrices archetype)","status":"approved","flags":[],"verified":"ok","verNote":"G1: sympy symbolic det = abc − (a+b+c) + 2; numeric instance (6, −3±√5) gives det 26 and abc 24"},{"id":"IPMAT_QASA_013","section":"QA-SA","format":"Functions: functional equation, evaluate at an integer","kind":"tita","passage":null,"stem":"Let f be a function defined on the positive integers such that f(1) = 2 and f(m + n) = f(m) + f(n) + mn for all positive integers m and n. Then f(10) equals ___","options":[],"answer":"65","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Step 1: Put m = n − 1 and n = 1 in the relation: f(n) = f(n − 1) + f(1) + (n − 1) = f(n − 1) + 2 + (n − 1).\nStep 2: Build up from f(1) = 2: f(2) = 5, f(3) = 9, f(4) = 14, f(5) = 20, f(6) = 27, f(7) = 35, f(8) = 44, f(9) = 54, f(10) = 65.\nStep 3: Closed form (telescoping the recursion): f(n) = 2n + n(n − 1)/2. Check: f(10) = 20 + 45 = 65 ✓.\nStep 4: Consistency with the full relation: f(4) should equal f(2) + f(2) + 4 = 5 + 5 + 4 = 14 ✓.\nAnswer must be an integer — 65 ✓. Key verified by direct recursion, by the closed form 2n + n(n−1)/2, and by an independent split of the argument.","archetype":"Functional equation f(x + xy) = f(x) + f(xy) family (Indore algebra archetype)","status":"approved","flags":[],"verified":"ok","verNote":"G1: recursion table to n = 10, closed form 2n + n(n−1)/2, and cross-check f(4) = f(2)+f(2)+4 — all give 65"},{"id":"IPMAT_QASA_014","section":"QA-SA","format":"Arithmetic: time-speed-distance catch-up","kind":"tita","passage":null,"stem":"Ram leaves a point P at 8:00 a.m. on a bicycle at a constant speed of 12 km/hr along a straight road. Rekha leaves the same point P at 9:30 a.m. on a scooter at a constant speed of 30 km/hr along the same road in the same direction. The distance from P, in km, at which Rekha catches up with Ram is ___","options":[],"answer":"30","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Easy","explanation":"Step 1: Find Ram's head start. Between 8:00 a.m. and 9:30 a.m. Ram rides for 1.5 hours, so head start = speed × time = 12 × 1.5 = 18 km.\nStep 2: Find the relative speed. Both move in the same direction, so relative speed = 30 − 12 = 18 km/hr.\nStep 3: Time for Rekha to close the gap = 18 km ÷ 18 km/hr = 1 hour (so she catches Ram at 10:30 a.m.).\nStep 4: Distance from P = Rekha's speed × her travel time = 30 × 1 = 30 km. (Check with Ram: 12 × 2.5 hours = 30 km ✓.)\nAnswer must be an integer — 30 ✓. Key verified by step-wise simulation of both positions in code; the positions coincide exactly 1 hour after 9:30 a.m., 30 km from P.","archetype":"TSD: two starters from the same point at different times (Indore arithmetic archetype)","status":"approved","flags":[],"verified":"ok","verNote":"G1: numeric simulation — positions equal at t = 1.0 h after 9:30, distance 30 km; cross-checked via both travellers' distance equations"},{"id":"IPMAT_QASA_015","section":"QA-SA","format":"Number system: count with a gcd condition","kind":"tita","passage":null,"stem":"The number of integers n, with 1 ≤ n ≤ 10000, such that the greatest common divisor of n and 10000 is exactly 100 is ___","options":[],"answer":"40","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Hard","explanation":"Step 1: If gcd(n, 10000) = 100, then 100 must divide n. Write n = 100m, where 1 ≤ m ≤ 100.\nStep 2: Reduce the gcd. gcd(100m, 10000) = 100 · gcd(m, 100), so the condition becomes gcd(m, 100) = 1.\nStep 3: Count m in 1 to 100 coprime to 100 using Euler's totient function: φ(100) = 100 × (1 − 1/2) × (1 − 1/5) = 100 × 1/2 × 4/5 = 40.\nStep 4: Watch the common slip — dropping the factor for 5 gives 100 × 1/2 = 50, which is wrong: multiples of 5 (like m = 5, giving n = 500 with gcd 500) must be excluded too.\nAnswer must be an integer — 40 ✓. Key verified by brute-force enumeration of all n from 1 to 10000; exactly 40 values satisfy gcd(n, 10000) = 100.","archetype":"gcd(n, 10^N) = 10^M count (Indore 2026 MCQ Q20 family)","status":"approved","flags":[],"verified":"ok","verNote":"G1: full enumeration 1..10^4 with math.gcd — count 40; matches φ(100) via inclusion–exclusion"},{"id":"IPMAT_QAMCQ_016","section":"QA-MCQ","format":"Algebra: exponential vs polynomial, solution count","kind":"mcq","passage":null,"stem":"Consider the equation 2^x = x², where x is a real number. The equation has","options":["exactly two real solutions","exactly three real solutions","exactly four real solutions","exactly one real solution"],"answer":"exactly three real solutions","answerIndex":1,"tags":["case omission","KEY","over/under-counting","case omission"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: exactly three real solutions.\nStep 1: Test small positive integers. At x = 2: 2² = 4 = 2², and at x = 4: 2⁴ = 16 = 4². So x = 2 and x = 4 are solutions.\nStep 2: Check negative x. For x \u003c 0, 2^x is a small positive number while x² is positive, so define g(x) = 2^x − x². g(0) = 1 > 0 and g(−1) = 0.5 − 1 \u003c 0, so by the Intermediate Value Theorem there is one root between −1 and 0 (near x ≈ −0.77).\nStep 3: For x > 4, 2^x grows faster than x², so no further crossings. Total: 3 real solutions.\nKey verified by numeric sign-change scan over [−10, 10].\nexactly two real solutions = the negative root between −1 and 0 is missed.\nexactly one real solution = only the obvious x = 2 is found, x = 4 and the negative root are missed.\nexactly four real solutions = a symmetric negative pair is imagined at −2 and −4 to mirror x = 2 and 4; only one negative root exists (over-counting).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: numeric root scan of 2^x − x² over [−10,10] → exactly 3 sign changes; x = 2, 4 check exactly."},{"id":"IPMAT_QAMCQ_017","section":"QA-MCQ","format":"Coordinate geometry: circle through three points","kind":"mcq","passage":null,"stem":"A circle passes through the points O(0, 0), A(6, 0) and B(0, 8), as shown in the figure. Then the equation of the circle is","options":["x² + y² - 6x - 8y = 0","x² + y² + 6x + 8y = 0","x² + y² - 3x - 4y = 0","x² + y² - 6x - 8y = 25"],"answer":"x² + y² - 6x - 8y = 0","answerIndex":0,"tags":["KEY","sign/extraneous root","intermediate state","related-quantity swap"],"fig":"\u003csvg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\">\u003cline x1=\"20\" y1=\"260\" x2=\"385\" y2=\"260\" stroke=\"black\" stroke-width=\"1.5\"/>\u003cline x1=\"60\" y1=\"292\" x2=\"60\" y2=\"15\" stroke=\"black\" stroke-width=\"1.5\"/>\u003ctext x=\"378\" y=\"278\" font-size=\"14\">x\u003c/text>\u003ctext x=\"44\" y=\"24\" font-size=\"14\">y\u003c/text>\u003ccircle cx=\"135\" cy=\"160\" r=\"125\" fill=\"none\" stroke=\"black\" stroke-width=\"1.5\"/>\u003ccircle cx=\"60\" cy=\"260\" r=\"3.5\" fill=\"black\"/>\u003ccircle cx=\"210\" cy=\"260\" r=\"3.5\" fill=\"black\"/>\u003ccircle cx=\"60\" cy=\"60\" r=\"3.5\" fill=\"black\"/>\u003ctext x=\"36\" y=\"280\" font-size=\"13\">O(0, 0)\u003c/text>\u003ctext x=\"196\" y=\"280\" font-size=\"13\">A(6, 0)\u003c/text>\u003ctext x=\"6\" y=\"52\" font-size=\"13\">B(0, 8)\u003c/text>\u003c/svg>","table":null,"difficulty":"Easy","explanation":"Answer: x² + y² - 6x - 8y = 0.\nStep 1: Since angle AOB = 90° (OA lies along the x-axis and OB along the y-axis), the chord AB subtends a right angle at O. By the angle-in-a-semicircle property, AB must be a diameter.\nStep 2: The centre is the midpoint of AB, which is (3, 4), and the radius is half of AB = half of √(36 + 64) = 5.\nStep 3: The circle is (x - 3)² + (y - 4)² = 25. Expanding: x² - 6x + 9 + y² - 8y + 16 = 25, which gives x² + y² - 6x - 8y = 0.\nCheck: O, A and B all satisfy this equation. Key verified by substituting all three points.\nx² + y² + 6x + 8y = 0 = the centre's signs are flipped when expanding.\nx² + y² - 3x - 4y = 0 = the centre coordinates (3, 4) are copied directly as coefficients without doubling.\nx² + y² - 6x - 8y = 25 = the constant terms 9 + 16 from the expansion are never subtracted from 25.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: all three points substituted into the key equation give 0; centre (3,4) is equidistant (25) from all three."},{"id":"IPMAT_QAMCQ_018","section":"QA-MCQ","format":"Counting: lattice points in |x| + |y| \u003c 5","kind":"mcq","passage":null,"stem":"The number of integer solutions (x, y) of the inequality |x| + |y| \u003c 5 is","options":["61","15","41","40"],"answer":"41","answerIndex":2,"tags":["boundary/off-by-one","case omission","KEY","boundary/off-by-one"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 41.\nStep 1: Since |x| + |y| \u003c 5 with integers, we need |x| + |y| ≤ 4.\nStep 2: Count by the value of |x|. If |x| = 0 (1 choice for x), then |y| ≤ 4, giving 9 values of y. If |x| = k for k = 1, 2, 3, 4 (2 choices of x each), then |y| ≤ 4 - k, giving 2(4 - k) + 1 values of y.\nStep 3: Total = 9 + 2(7) + 2(5) + 2(3) + 2(1) = 9 + 14 + 10 + 6 + 2 = 41. (Equivalently, the formula for lattice points with |x| + |y| ≤ n is 2n² + 2n + 1; with n = 4 this is 32 + 8 + 1 = 41.)\nKey verified by brute-force enumeration over -10 ≤ x, y ≤ 10.\n61 = the boundary |x| + |y| = 5 is wrongly included (strict inequality read as ≤ 5).\n15 = only the quadrant x ≥ 0, y ≥ 0 is counted.\n40 = the origin (0, 0) is dropped from the correct count.","archetype":"lattice points inside a region (x² + y² ≤ 10 family)","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force enumeration over the integer grid → 41; boundary-included count 61 and quadrant count 15 confirmed as the distractor values."},{"id":"IPMAT_QAMCQ_019","section":"QA-MCQ","format":"Statistics: mean equals median, casework","kind":"mcq","passage":null,"stem":"Let x be a real number such that the mean of the five numbers 4, 6, 8, 10 and x is equal to their median. Then the possible value(s) of x is/are","options":["only 7","7 and 12","2 and 7","2, 7 and 12"],"answer":"2, 7 and 12","answerIndex":3,"tags":["wrong reference base","case omission","case omission","KEY"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 2, 7 and 12.\nStep 1: The mean is (28 + x)/5. The median of five numbers is the third value after sorting, so it depends on where x falls.\nStep 2: Case x ≤ 6: sorted order puts 6 in the middle, so the median is 6. Then (28 + x)/5 = 6 gives x = 2, which satisfies x ≤ 6. Valid.\nStep 3: Case 6 ≤ x ≤ 8: the median is x itself. Then (28 + x)/5 = x gives 28 = 4x, so x = 7, which lies in [6, 8]. Valid.\nStep 4: Case x ≥ 8: the median is 8. Then (28 + x)/5 = 8 gives x = 12, which satisfies x ≥ 8. Valid.\nAll three cases produce a consistent value, so x can be 2, 7 or 12. Key verified by an exhaustive scan of x over a fine grid.\nonly 7 = the median is fixed at 7 (the middle of the four given numbers) instead of doing casework.\n7 and 12 = the case x ≤ 6 is not checked.\n2 and 7 = the case x ≥ 8 is not checked.","archetype":"max/min/median/mean constraints","status":"approved","flags":[],"verified":"ok","verNote":"G1: exact scan of x in [-40, 80] in steps of 0.01 using fractions → mean = median only at x = 2, 7, 12."},{"id":"IPMAT_QAMCQ_020","section":"QA-MCQ","format":"Algebra: parameter count for integer factorisation","kind":"mcq","passage":null,"stem":"The number of integer values of a for which the polynomial x² + ax + 12 can be written as a product of two linear factors with integer coefficients is","options":["6","3","12","8"],"answer":"6","answerIndex":0,"tags":["KEY","case omission","over/under-counting","magnitude cluster"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 6.\nStep 1: If x² + ax + 12 = (x + p)(x + q) with integers p, q, then pq = 12 and p + q = a.\nStep 2: Since pq = 12 > 0, p and q have the same sign. The positive factor pairs of 12 are (1, 12), (2, 6), (3, 4), giving a = 13, 8, 7.\nStep 3: The negative pairs (-1, -12), (-2, -6), (-3, -4) give a = -13, -8, -7.\nStep 4: All six sums are distinct, so a takes 6 integer values: ±7, ±8, ±13.\nKey verified by brute-force: for every a from -200 to 200, checking whether a² - 48 is a perfect square yields exactly these six values.\n3 = only the positive factor pairs are counted; the negative pairs are forgotten.\n12 = each unordered pair is counted twice, as if (p, q) and (q, p) gave different values of a.\n8 = a round-number neighbour of the key with no valid solution path.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force over a ∈ [-200, 200] testing discriminant a² - 48 for perfect squares → {±7, ±8, ±13}, count 6."},{"id":"IPMAT_QAMCQ_021","section":"QA-MCQ","format":"Arithmetic TSD: circular track, meetings count","kind":"mcq","passage":null,"stem":"Ram and Shyam start simultaneously from diametrically opposite points of a circular track of length 900 m, as shown in the figure, and run in opposite directions at speeds of 5 m/s and 4 m/s respectively. The number of times they meet in the first 11 minutes is","options":["6","14","7","8"],"answer":"7","answerIndex":2,"tags":["wrong reference base","over/under-counting","KEY","boundary/off-by-one"],"fig":"\u003csvg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cmarker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0,0 L6,3 L0,6 z\" fill=\"black\"/>\u003c/marker>\u003c/defs>\u003ccircle cx=\"200\" cy=\"155\" r=\"110\" fill=\"none\" stroke=\"black\" stroke-width=\"1.5\"/>\u003ccircle cx=\"90\" cy=\"155\" r=\"4\" fill=\"black\"/>\u003ccircle cx=\"310\" cy=\"155\" r=\"4\" fill=\"black\"/>\u003cpath d=\"M 95 130 A 110 110 0 0 1 130 82\" fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/>\u003cpath d=\"M 305 180 A 110 110 0 0 1 270 228\" fill=\"none\" stroke=\"black\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/>\u003ctext x=\"14\" y=\"148\" font-size=\"13\">Ram\u003c/text>\u003ctext x=\"14\" y=\"166\" font-size=\"13\">(5 m/s)\u003c/text>\u003ctext x=\"320\" y=\"148\" font-size=\"13\">Shyam\u003c/text>\u003ctext x=\"320\" y=\"166\" font-size=\"13\">(4 m/s)\u003c/text>\u003ctext x=\"168\" y=\"150\" font-size=\"13\">900 m\u003c/text>\u003cline x1=\"90\" y1=\"155\" x2=\"310\" y2=\"155\" stroke=\"black\" stroke-width=\"1\" stroke-dasharray=\"5,4\"/>\u003c/svg>","table":null,"difficulty":"Medium","explanation":"Answer: 7.\nStep 1: Running in opposite directions, their relative speed is 5 + 4 = 9 m/s (relative speed for opposite motion is the sum of the speeds).\nStep 2: They start diametrically opposite, so the gap to close for the first meeting is 900/2 = 450 m. First meeting at 450/9 = 50 seconds.\nStep 3: After that, each meeting requires them to together cover one full lap of 900 m, so meetings occur every 900/9 = 100 seconds: at t = 50, 150, 250, ...\nStep 4: In 11 minutes = 660 seconds, meetings occur at 50, 150, 250, 350, 450, 550 and 650 seconds — that is 7 meetings.\nKey verified by direct simulation of the meeting times.\n6 = the runners are treated as starting from the same point, so the first meeting is placed at 100 s instead of 50 s.\n8 = one extra meeting is counted by treating t = 0 or t = 660 as a meeting.\n14 = each meeting is counted once from each runner's side.","archetype":"circular-track meets","status":"approved","flags":[],"verified":"ok","verNote":"G1: simulation of meeting times (first at 450/9 s, then every 900/9 s) up to 660 s → 7 meetings at 50, 150, ..., 650 s."},{"id":"IPMAT_QAMCQ_022","section":"QA-MCQ","format":"Probability: three dice, conditional on distinct faces","kind":"mcq","passage":null,"stem":"Three fair dice are rolled and it is found that the numbers shown on the three dice are all distinct. The probability that their sum equals 10 is","options":["1/8","3/20","1/40","1/5"],"answer":"3/20","answerIndex":1,"tags":["wrong reference base","KEY","over/under-counting","over/under-counting"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 3/20.\nStep 1: This is a conditional probability: P(sum = 10 | all distinct) = (favourable ordered outcomes)/(ordered outcomes with all faces distinct).\nStep 2: Ordered outcomes with three distinct faces = 6 × 5 × 4 = 120.\nStep 3: Sets of three distinct numbers from 1 to 6 adding to 10: {1, 3, 6}, {1, 4, 5} and {2, 3, 5}. Each set can appear in 3! = 6 orders, so favourable outcomes = 3 × 6 = 18.\nStep 4: Probability = 18/120 = 3/20.\nKey verified by brute-force enumeration of all 216 outcomes: 18 favourable out of 120 distinct-face outcomes.\n1/8 = the unconditional probability of sum 10 (27/216); the condition that all faces are distinct is ignored.\n1/40 = 3/120; the three sets are counted without their 6 orderings each.\n1/5 = 24/120; a fourth triple with a repeated face (such as {2, 4, 4}) is wrongly included and its orders counted.","archetype":"three-dice sum conditional probability","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force over all 6³ outcomes → 120 distinct-face outcomes, 18 with sum 10; probability 3/20. Unconditional 27/216 = 1/8 confirmed for the distractor."},{"id":"IPMAT_QAMCQ_023","section":"QA-MCQ","format":"Matrices: determinant of A + A² + A³","kind":"mcq","passage":null,"stem":"Let A be the 2×2 matrix whose first row is (2, 0) and whose second row is (1, 3). Then the determinant of the matrix A + A² + A³ equals","options":["91","273","169","546"],"answer":"546","answerIndex":3,"tags":["intermediate state","wrong reference base","magnitude cluster","KEY"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 546.\nStep 1: Factor the sum: A + A² + A³ = A(I + A + A²). By the product rule for determinants, det(A + A² + A³) = det(A) · det(I + A + A²).\nStep 2: det(A) = 2 × 3 - 0 × 1 = 6.\nStep 3: Since A is lower triangular with diagonal entries 2 and 3, I + A + A² is also lower triangular with diagonal entries 1 + 2 + 4 = 7 and 1 + 3 + 9 = 13. So det(I + A + A²) = 7 × 13 = 91.\nStep 4: det(A + A² + A³) = 6 × 91 = 546.\nKey verified by directly computing A² = (4, 0; 5, 9) and A³ = (8, 0; 19, 27), summing to (14, 0; 25, 39), whose determinant is 14 × 39 = 546.\n91 = det(I + A + A²) alone; the factor det(A) = 6 is dropped.\n273 = 3 × 91; det(A) is taken as 3 (one diagonal entry) instead of 6.\n169 = 13²; the diagonal factor 13 is squared instead of being multiplied by 7 and 6.","archetype":"det of matrix powers","status":"approved","flags":[],"verified":"ok","verNote":"G1: direct matrix computation — A + A² + A³ = (14, 0; 25, 39), det = 546; matches the factorisation 6 × 7 × 13."},{"id":"IPMAT_QAMCQ_024","section":"QA-MCQ","format":"Arithmetic: work on alternate days","kind":"mcq","passage":null,"stem":"Ashok can paint a wall in 12 days while Bharat can paint the same wall in 18 days. They paint on alternate days, with Ashok painting on the first day. Then the wall is completely painted in","options":["14 1/3 days","14 1/2 days","15 days","14 1/5 days"],"answer":"14 1/3 days","answerIndex":0,"tags":["KEY","related-quantity swap","boundary/off-by-one","wrong reference base"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 14 1/3 days.\nStep 1: Daily work rates: Ashok paints 1/12 of the wall per day, Bharat 1/18 per day.\nStep 2: One two-day cycle (Ashok's day + Bharat's day) completes 1/12 + 1/18 = 3/36 + 2/36 = 5/36 of the wall.\nStep 3: After 7 cycles, that is 14 days, the work done is 7 × 5/36 = 35/36. Remaining work = 1/36.\nStep 4: Day 15 is Ashok's day (odd days are his). At his rate of 1/12 = 3/36 per day, the remaining 1/36 takes (1/36)/(1/12) = 1/3 of a day.\nStep 5: Total time = 14 + 1/3 = 14 1/3 days.\nKey verified by day-by-day simulation with exact fractions.\n14 1/2 days = the final 1/36 is done at Bharat's rate of 1/18, though day 15 belongs to Ashok.\n15 days = the final part-day is rounded up to a full working day.\n14 1/5 days = the final 1/36 is done at the combined rate 5/36, as if both painted together on day 15.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: exact fraction simulation day by day → work reaches 1 exactly 1/3 of the way through day 15; total 43/3 = 14 1/3 days."},{"id":"IPMAT_QAMCQ_025","section":"QA-MCQ","format":"Number system: 6m + k never a perfect square","kind":"mcq","passage":null,"stem":"Let m denote a positive integer. Among k = 1, 2, 3, 4 and 5, the value(s) of k for which 6m + k is not a perfect square for any value of m is/are","options":["only 2","2, 3 and 5","2 and 5","only 5"],"answer":"2 and 5","answerIndex":2,"tags":["case omission","over/under-counting","KEY","case omission"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 2 and 5.\nStep 1: A perfect square can only leave certain remainders when divided by 6. Squaring each residue: 0² = 0, 1² = 1, 2² = 4, 3² = 9 ≡ 3, 4² = 16 ≡ 4, 5² = 25 ≡ 1 (mod 6). So every perfect square is ≡ 0, 1, 3 or 4 (mod 6).\nStep 2: A number of the form 6m + k leaves remainder k. Since no square is ≡ 2 or 5 (mod 6), 6m + 2 and 6m + 5 can never be perfect squares.\nStep 3: The remaining values all occur: 6(4) + 1 = 25, 6(1) + 3 = 9 and 6(2) + 4 = 16 are squares. So the answer is k = 2 and 5.\nKey verified by brute-force search over m up to 2,000,000 for each k: squares found for k = 1, 3, 4 and none for k = 2, 5.\nonly 2 = the case k = 5 is not checked against the square residues.\nonly 5 = the case k = 2 is not checked.\n2, 3 and 5 = k = 3 is wrongly included, forgetting that 9 = 6(1) + 3 is a square.","archetype":"possible values enumeration (greatest of mixed powers family)","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force over m ≤ 2×10⁶ for each k, plus residue check — squares mod 6 lie in {0, 1, 3, 4}; k = 2 and 5 never yield squares."},{"id":"IPMAT_QAMCQ_026","section":"QA-MCQ","format":"Geometry: circle through two vertices of a rectangle","kind":"mcq","passage":null,"stem":"Let ABCD be a rectangle with AB = 24 and BC = 18. A circle passing through the vertices A and B touches the side DC at the point P. Then the radius of the circle equals","options":["13","15","9","12"],"answer":"13","answerIndex":0,"tags":["KEY","wrong reference base","related-quantity swap","intermediate state"],"fig":"\u003csvg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg'>\u003crect x='104' y='86' width='192' height='144' fill='none' stroke='black' stroke-width='1.5'/>\u003ccircle cx='200' cy='190' r='104' fill='none' stroke='black' stroke-width='1.5'/>\u003ccircle cx='200' cy='190' r='2.5' fill='black'/>\u003ccircle cx='200' cy='86' r='2.5' fill='black'/>\u003ctext x='92' y='246' font-size='14'>A\u003c/text>\u003ctext x='300' y='246' font-size='14'>B\u003c/text>\u003ctext x='300' y='80' font-size='14'>C\u003c/text>\u003ctext x='86' y='80' font-size='14'>D\u003c/text>\u003ctext x='194' y='76' font-size='14'>P\u003c/text>\u003ctext x='208' y='196' font-size='14'>O\u003c/text>\u003ctext x='176' y='264' font-size='13'>AB = 24\u003c/text>\u003ctext x='302' y='162' font-size='13'>BC = 18\u003c/text>\u003c/svg>","table":null,"difficulty":"Medium","explanation":"Answer: 13\nStep 1 (perpendicular from the centre bisects a chord): AB is a chord of the circle, so the centre O lies on the perpendicular bisector of AB. Place A(0, 0) and B(24, 0); then O = (12, k) and r² = 12² + k² = 144 + k².\nStep 2 (tangency condition): the circle touches DC, the line y = 18, so the distance from O to DC equals r, i.e. k + r = 18.\nStep 3: substitute r = 18 − k into r² = 144 + k²: (18 − k)² = 144 + k² gives 324 − 36k = 144, so k = 5 and r = 13.\nKey verified by symbolic solution of the chord and tangency conditions (k = 5, r = 13).\n15 = distance from the rectangle's centre (12, 9) to A, assuming the circle is centred at the rectangle's centre (wrong reference base).\n9 = half of BC (related-quantity swap).\n12 = half of AB, the half-chord, taken as the radius (intermediate state).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: symbolic solve of chord + tangency conditions → k = 5, r = 13"},{"id":"IPMAT_QAMCQ_027","section":"QA-MCQ","format":"Direction sense: net displacement","kind":"mcq","passage":null,"stem":"Meera walks 8 km towards the East, then 6 km towards the North, then 4 km towards the West and finally 3 km towards the South. The distance, in km, between her final position and her starting point is","options":["7","21","25","5"],"answer":"5","answerIndex":3,"tags":["related-quantity swap","related-quantity swap","intermediate state","KEY"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 5\nStep 1 (resolve the walk into components): East–West: 8 East − 4 West = 4 km East. North–South: 6 North − 3 South = 3 km North.\nStep 2 (Pythagoras for displacement): distance = √(4² + 3²) = √25 = 5 km.\nKey verified by coordinate computation: final position (4, 3), distance √(16 + 9) = 5.\n7 = 4 + 3, the net components added instead of combined by Pythagoras — the taxicab distance in place of the straight-line distance (related-quantity swap).\n21 = 8 + 6 + 4 + 3, the total path walked instead of the displacement (related-quantity swap).\n25 = 4² + 3², the square of the distance with the square root never taken (intermediate state).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: coordinate computation → final position (4, 3), distance 5"},{"id":"IPMAT_QAMCQ_028","section":"QA-MCQ","format":"Sets: two-source survey percentages","kind":"mcq","passage":null,"stem":"In a survey conducted in a town, 58% of the residents get their news from television and 67% get their news from online portals. If every resident gets news from at least one of the two sources, the percentage of residents who get their news from exactly one source is","options":["25%","75%","42%","33%"],"answer":"75%","answerIndex":1,"tags":["related-quantity swap","KEY","case omission","case omission"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 75%\nStep 1 (two-set inclusion–exclusion): since every resident uses at least one source, n(T ∪ O) = 100%. So n(T ∩ O) = 58 + 67 − 100 = 25%.\nStep 2 (exactly one source): (58 − 25) + (67 − 25) = 33 + 42 = 75%.\nKey verified by direct set computation: both = 25, television only = 33, online only = 42, and 33 + 42 = 75.\n25% = the percentage using both sources, a neighbouring quantity to the one asked (related-quantity swap).\n42% = the online-only branch alone, 67 − 25 (case omission).\n33% = the television-only branch alone, 58 − 25 (case omission).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: direct set computation → both 25, exactly one 75"},{"id":"IPMAT_QAMCQ_029","section":"QA-MCQ","format":"P&C: coin partitions of an amount","kind":"mcq","passage":null,"stem":"The number of ways in which a bill of 15 rupees can be paid using coins of denominations 1 rupee, 2 rupees and 5 rupees, assuming an unlimited supply of coins of each denomination, is","options":["17","22","18","8"],"answer":"18","answerIndex":2,"tags":["case omission","boundary/off-by-one","KEY","intermediate state"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 18\nStep 1 (organise by the largest coin): let the number of 5-rupee coins be c = 0, 1, 2 or 3; the remainder 15 − 5c must be paid with 1s and 2s.\nStep 2 (count each branch): with an amount r left, the number of ways using 1s and 2s is ⌊r/2⌋ + 1. Branches: r = 15 → 8 ways; r = 10 → 6; r = 5 → 3; r = 0 → 1.\nStep 3: total = 8 + 6 + 3 + 1 = 18.\nKey verified by brute-force enumeration of all (a, b, c) with a + 2b + 5c = 15 → 18.\n17 = the single all-fives payment, the r = 0 branch, dropped (case omission).\n22 = each branch counted as ⌊r/2⌋ + 2, one extra way per branch (boundary/off-by-one).\n8 = the no-five branch alone (intermediate state).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force enumeration a + 2b + 5c = 15 → 18"},{"id":"IPMAT_QAMCQ_030","section":"QA-MCQ","format":"Number system: primes with abc = 3(a+b+c)","kind":"mcq","passage":null,"stem":"Let a, b and c be prime numbers, not necessarily distinct, such that abc = 3(a + b + c). Then the maximum possible value of a + b + c is","options":["10","9","12","8"],"answer":"10","answerIndex":0,"tags":["KEY","related-quantity swap","boundary/off-by-one","magnitude cluster"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 10\nStep 1 (divisibility forces a 3): abc = 3(a + b + c) means 3 divides abc; since a, b, c are prime, one of them, say a, must equal 3.\nStep 2 (Simon's factoring trick): 3bc = 3(3 + b + c) gives bc − b − c = 3, so (b − 1)(c − 1) = 4.\nStep 3 (factor pairs of 4): (b − 1, c − 1) = (1, 4) gives (2, 5), both prime; (2, 2) gives (3, 3), both prime. The solutions are {2, 3, 5} with sum 10 and {3, 3, 3} with sum 9.\nStep 4: the maximum of a + b + c is 10.\nKey verified by brute-force search over all prime triples up to 60 — only (2, 3, 5) and (3, 3, 3) satisfy the equation.\n9 = the minimum sum, from the triple (3, 3, 3), reported in place of the maximum (related-quantity swap).\n12 = 2 + 3 + 7, from mis-carrying the constant to (b − 1)(c − 1) = 6 (boundary/off-by-one).\n8 = 2 + 3 + 3, an unchecked triple that fails the equation (magnitude cluster).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force over prime triples ≤ 60 → sums {9, 10}, max 10"},{"id":"IPMAT_QAMCQ_031","section":"QA-MCQ","format":"Logarithms: change of base in terms of p","kind":"mcq","passage":null,"stem":"Let p = log₁₂ 27. Then log₆ 16, expressed in terms of p, equals","options":["4(3 + p)/(3 - p)","4(3 - p)/(3 + p)","(3 - p)/(3 + p)","2(3 - p)/(3 + p)"],"answer":"4(3 - p)/(3 + p)","answerIndex":1,"tags":["related-quantity swap","KEY","intermediate state","magnitude cluster"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 4(3 - p)/(3 + p)\nStep 1 (reduce to a single ratio): write t = log₂ 3. By change of base, p = log₁₂ 27 = 3 log 3 / (2 log 2 + log 3) = 3t/(2 + t).\nStep 2 (solve for t): p(2 + t) = 3t gives 2p = t(3 − p), so t = 2p/(3 − p).\nStep 3 (express the target): log₆ 16 = 4 log 2 / (log 2 + log 3) = 4/(1 + t) = 4/(1 + 2p/(3 − p)) = 4(3 − p)/(3 + p).\nKey verified numerically: p = 1.32634… and 4(3 − p)/(3 + p) = 1.54741… = log₆ 16.\n4(3 + p)/(3 − p) = the fraction inverted, the reciprocal of the key's core ratio (related-quantity swap).\n(3 - p)/(3 + p) = the factor 4 from 16 = 2⁴ dropped (intermediate state).\n2(3 - p)/(3 + p) = the exponent of 16 taken as 2 (magnitude cluster).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: numeric check p = 1.32634, 4(3−p)/(3+p) = 1.54741 = log₆ 16"},{"id":"IPMAT_QAMCQ_032","section":"QA-MCQ","format":"Sequences: AP word problem (charity drive)","kind":"mcq","passage":null,"stem":"Anjali starts a collection drive in her housing society. The first resident contributes 5 rupees and every subsequent resident contributes 3 rupees more than the resident before. If the total amount collected is 1025 rupees, the number of residents who contributed is","options":["26","24","30","25"],"answer":"25","answerIndex":3,"tags":["boundary/off-by-one","boundary/off-by-one","magnitude cluster","KEY"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 25\nStep 1 (AP sum formula): the contributions form an arithmetic progression with first term a = 5 and common difference d = 3, so Sₙ = n/2 [2a + (n − 1)d] = n(3n + 7)/2.\nStep 2 (solve): n(3n + 7)/2 = 1025 gives 3n² + 7n − 2050 = 0. The discriminant is 49 + 24600 = 24649 = 157², so n = (−7 + 157)/6 = 25.\nStep 3 (reject the other root): n = −82/3 is not a positive integer, so n = 25.\nKey verified by symbolic solution of the quadratic (roots 25 and −82/3) and direct summation: 25 × 82/2 = 1025.\n26 = one term too many (boundary/off-by-one).\n24 = one term too few (boundary/off-by-one).\n30 = a round-number neighbour of the key (magnitude cluster).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: quadratic 3n² + 7n − 2050 = 0 → n = 25; sum re-checked = 1025"},{"id":"IPMAT_QAMCQ_033","section":"QA-MCQ","format":"Arithmetic: TSD — laps of two boundaries","kind":"mcq","passage":null,"stem":"Vinita walks one full round of a square park of side 150 metres and then runs one full round of a rectangular field measuring 350 metres by 250 metres, taking exactly the same time for each round. If her running speed is 3 km/hr more than her walking speed, then her running speed, in km/hr, is","options":["3","9","6","12"],"answer":"6","answerIndex":2,"tags":["related-quantity swap","wrong reference base","KEY","magnitude cluster"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 6\nStep 1 (equal times): perimeter of the square = 4 × 150 = 600 m; perimeter of the rectangle = 2(350 + 250) = 1200 m. Equal time means 600/v = 1200/u, where v is the walking speed and u the running speed.\nStep 2 (speed relation): the running distance is exactly double, so u = 2v. With u − v = 3 km/hr, this gives v = 3 and u = 6 km/hr.\nKey verified by symbolic solution of 600/v = 1200/(v + 3) → v = 3, so the running speed is 6.\n3 = the walking speed, the neighbouring quantity to the one asked (related-quantity swap).\n9 = v + u, the two speeds added together (wrong reference base).\n12 = a round-number neighbour of the key (magnitude cluster).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: symbolic solve 600/v = 1200/(v+3) → v = 3, u = 6"},{"id":"IPMAT_QAMCQ_034","section":"QA-MCQ","format":"Sets: inclusion–exclusion on multiples of 4, 6, 9","kind":"mcq","passage":null,"stem":"The number of integers in the set {1, 2, 3, …, 180} that are divisible by none of 4, 6 and 9 is","options":["110","70","115","85"],"answer":"110","answerIndex":0,"tags":["KEY","related-quantity swap","over/under-counting","over/under-counting"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 110\nStep 1 (count the multiples): in {1, …, 180}: multiples of 4 → 45; of 6 → 30; of 9 → 20. Pairwise: lcm(4, 6) = 12 → 15; lcm(6, 9) = 18 → 10; lcm(4, 9) = 36 → 5. Triple: lcm(4, 6, 9) = 36 → 5.\nStep 2 (inclusion–exclusion): divisible by at least one = 45 + 30 + 20 − 15 − 10 − 5 + 5 = 70.\nStep 3 (complement): divisible by none = 180 − 70 = 110.\nKey verified by brute-force count over 1–180 → 110.\n70 = the count divisible by at least one of 4, 6, 9 — the complement of what was asked (related-quantity swap).\n115 = the triple overlap never added back, 180 − 65 (over/under-counting).\n85 = the overlaps never subtracted at all, 180 − 95 (over/under-counting).","archetype":"three-set Venn — multiples of 4, 6, 9 in {1..180}","status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force count 1–180 → 110 none, 70 at least one"},{"id":"IPMAT_QAMCQ_035","section":"QA-MCQ","format":"Probability: running die total reaching a threshold","kind":"mcq","passage":null,"stem":"A fair die is rolled three times and a running total of the outcomes is maintained. The probability that the running total becomes 10 or more for the first time on the third roll is","options":["5/8","11/24","1/2","5/12"],"answer":"11/24","answerIndex":1,"tags":["case omission","KEY","magnitude cluster","boundary/off-by-one"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 11/24\nStep 1 (translate 'first time on the third roll'): the total after two rolls must be 9 or less, and the total after three rolls must be 10 or more.\nStep 2 (count by the two-roll sum s): the third roll c needs c ≥ 10 − s, which is possible only for s ≥ 4, and the number of valid faces is s − 3. Pairs (a, b) with sum s: s = 4 → 3, s = 5 → 4, s = 6 → 5, s = 7 → 6, s = 8 → 5, s = 9 → 4.\nStep 3: favourable = 3·1 + 4·2 + 5·3 + 6·4 + 5·5 + 4·6 = 99 out of 216, so P = 99/216 = 11/24.\nKey verified by brute-force enumeration of all 216 triples → 99/216 = 11/24.\n5/8 = P(three-roll total ≥ 10) with 'first time' ignored, so totals already at 10 after two rolls are wrongly included (case omission).\n5/12 = the threshold misread as 'more than 10', i.e. ≥ 11 (boundary/off-by-one).\n1/2 = a round neighbour of the key (magnitude cluster).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force over 216 triples → 99/216 = 11/24"},{"id":"IPMAT_QAMCQ_036","section":"QA-MCQ","format":"Algebra: min of absolute values, number of solutions","kind":"mcq","passage":null,"stem":"The number of real values of x satisfying the equation min(|x - 2|, |x + 2|) = 3 is","options":["4","1","3","2"],"answer":"2","answerIndex":3,"tags":["sign/extraneous root","case omission","boundary/off-by-one","KEY"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 2\nStep 1 (resolve the min by cases): |x − 2| ≤ |x + 2| exactly when x ≥ 0, so min(|x − 2|, |x + 2|) equals |x − 2| for x ≥ 0 and |x + 2| for x \u003c 0.\nStep 2 (case x ≥ 0): |x − 2| = 3 gives x = 5 or x = −1; only x = 5 satisfies x ≥ 0.\nStep 3 (case x \u003c 0): |x + 2| = 3 gives x = 1 or x = −5; only x = −5 satisfies x \u003c 0.\nStep 4: exactly 2 real values, x = 5 and x = −5.\nKey verified by substituting all four candidates: the min at 5 and −5 equals 3, while at 1 and −1 it equals 1.\n4 = all four candidate roots ±1, ±5 kept without checking the case condition (sign/extraneous root).\n1 = only one branch of the min solved (case omission).\n3 = one extraneous root retained alongside the two true ones (boundary/off-by-one).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: all four candidates substituted → only ±5 satisfy"},{"id":"IPMAT_QAMCQ_037","section":"QA-MCQ","format":"Logarithms: number of digits of a large power","kind":"mcq","passage":null,"stem":"Given that log₁₀ 2 = 0.30103 approximately, the number of digits in 2^2026 is","options":["609","611","610","608"],"answer":"610","answerIndex":2,"tags":["boundary/off-by-one","boundary/off-by-one","KEY","magnitude cluster"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 610\nStep 1 (digit-count property): the number of digits of a positive integer N is ⌊log₁₀ N⌋ + 1.\nStep 2 (compute the logarithm): log₁₀ 2^2026 = 2026 × log₁₀ 2 = 2026 × 0.30103 = 609.88678.\nStep 3: number of digits = ⌊609.88678⌋ + 1 = 609 + 1 = 610.\nKey verified by exact computation of 2^2026 in code — it has exactly 610 digits.\n609 = the characteristic ⌊log₁₀ N⌋ reported as the digit count, with the '+1' forgotten (boundary/off-by-one).\n611 = 609.88… rounded up to 610 and then 1 added on top (boundary/off-by-one).\n608 = a neighbour sharing the key's magnitude and structure (magnitude cluster).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: exact len(str(2^2026)) = 610"},{"id":"IPMAT_QAMCQ_038","section":"QA-MCQ","format":"Coordinate geometry: angle between tangents from an external point","kind":"mcq","passage":null,"stem":"The angle between the two tangents drawn from the point (6, 8) to the circle x² + y² = 25 is","options":["60°","30°","120°","90°"],"answer":"60°","answerIndex":0,"tags":["KEY","intermediate state","related-quantity swap","magnitude cluster"],"fig":"\u003csvg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg'>\u003ccircle cx='160' cy='180' r='60' fill='none' stroke='black' stroke-width='1.5'/>\u003cline x1='232' y1='84' x2='107' y2='137' stroke='black' stroke-width='1.5'/>\u003cline x1='232' y1='84' x2='215' y2='219' stroke='black' stroke-width='1.5'/>\u003cline x1='160' y1='180' x2='232' y2='84' stroke='black' stroke-width='1' stroke-dasharray='5,4'/>\u003ccircle cx='160' cy='180' r='2.5' fill='black'/>\u003ccircle cx='232' cy='84' r='2.5' fill='black'/>\u003ctext x='144' y='198' font-size='14'>O\u003c/text>\u003ctext x='238' y='80' font-size='14'>P (6, 8)\u003c/text>\u003ctext x='96' y='268' font-size='13'>x² + y² = 25\u003c/text>\u003c/svg>","table":null,"difficulty":"Medium","explanation":"Answer: 60°\nStep 1 (distance to the external point): the circle has centre O(0, 0) and radius r = 5; OP = √(6² + 8²) = √100 = 10.\nStep 2 (half-angle formula for tangents): if θ is the angle between the two tangents, the radius to a point of contact is perpendicular to the tangent, so sin(θ/2) = r/OP = 5/10 = 1/2, giving θ/2 = 30°.\nStep 3: θ = 60°.\nKey verified numerically: 2 · arcsin(5/10) = 60.0°.\n30° = the half-angle θ/2 reported as the final answer (intermediate state).\n120° = the angle subtended at the centre by the two points of contact — the supplement of the key (related-quantity swap).\n90° = the angle produced by assuming OP = r√2 (magnitude cluster).","archetype":"tangents from an external point (angle between them)","status":"approved","flags":[],"verified":"ok","verNote":"G1: 2·arcsin(5/10) = 60.0°"},{"id":"IPMAT_QAMCQ_039","section":"QA-MCQ","format":"Algebra: modulus equation, number of real solutions","kind":"mcq","passage":null,"stem":"The number of real solutions of the equation x² - 7|x| + 12 = 0 is","options":["2","1","3","4"],"answer":"4","answerIndex":3,"tags":["case omission","magnitude cluster","boundary/off-by-one","KEY"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: 4\nStep 1 (substitute t = |x|): since x² = |x|², the equation becomes t² − 7t + 12 = 0 with t ≥ 0.\nStep 2 (solve for t): (t − 3)(t − 4) = 0, so |x| = 3 or |x| = 4; both values are positive, so both are admissible.\nStep 3 (return to x): |x| = 3 gives x = ±3 and |x| = 4 gives x = ±4, so there are 4 real solutions in all.\nKey verified by direct substitution: 3, −3, 4 and −4 all satisfy the equation.\n2 = only the positive values x = 3 and x = 4 counted, the negative branch of the modulus forgotten (case omission).\n1 = a single root reported (magnitude cluster).\n3 = one of the four solutions dropped (boundary/off-by-one).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: substitution of ±3, ±4 → all satisfy; count 4"},{"id":"IPMAT_QAMCQ_040","section":"QA-MCQ","format":"Arithmetic: mixtures — repeated replacement","kind":"mcq","passage":null,"stem":"A vessel contains 40 litres of pure juice. Ashok removes 8 litres of the contents and replaces them with water. He then removes 8 litres of the resulting mixture and again replaces them with water. The percentage of juice in the final mixture is","options":["60%","36%","64%","80%"],"answer":"64%","answerIndex":2,"tags":["wrong reference base","related-quantity swap","KEY","intermediate state"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 64%\nStep 1 (removal-and-replacement rule): each time 8 litres of the well-mixed contents are removed from 40 litres, the juice remaining is multiplied by (40 − 8)/40 = 4/5.\nStep 2 (two replacements): juice left = 40 × (4/5)² = 40 × 16/25 = 25.6 litres.\nStep 3 (concentration): 25.6/40 × 100 = 64%.\nKey verified by direct computation: 40 × 0.8² = 25.6 litres of juice in 40 litres, i.e. 64%.\n60% = 20% subtracted twice from 100%, the second removal wrongly referenced to the original pure juice instead of the mixture (wrong reference base).\n36% = the percentage of water in the final mixture, not of juice (related-quantity swap).\n80% = the concentration after the first replacement only (intermediate state).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: 40 × 0.8² = 25.6 L → 64%"},{"id":"IPMAT_QAMCQ_041","section":"QA-MCQ","format":"Caselet: DI table 5Q — nutrient/diet","kind":"mcq","passage":"The table gives the nutrient content of one serving of five food items — Almonds, Spinach, Oats, Paneer and Chickpeas — expressed as a percentage of the minimum daily requirement (MDR) of three nutrients: Protein, Iron and Calcium. The serving size of each item is indicated. Nutrient contributions add across servings and across items, and fractions of a serving are not allowed.","stem":"In one serving, which food items satisfy at least 15% of the MDR for at least two of the three nutrients?","options":["Only Spinach and Chickpeas","Only Paneer and Chickpeas","Only Paneer","Only Paneer, Spinach and Chickpeas"],"answer":"Only Paneer and Chickpeas","answerIndex":1,"tags":["surface read","KEY","case omission","boundary/off-by-one"],"fig":null,"table":"\u003ctable>\u003ctr>\u003cth>Food item\u003c/th>\u003cth>Serving size\u003c/th>\u003cth>Protein (% of MDR)\u003c/th>\u003cth>Iron (% of MDR)\u003c/th>\u003cth>Calcium (% of MDR)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Almonds\u003c/td>\u003ctd>30 g\u003c/td>\u003ctd>8\u003c/td>\u003ctd>12\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spinach\u003c/td>\u003ctd>100 g\u003c/td>\u003ctd>5\u003c/td>\u003ctd>20\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oats\u003c/td>\u003ctd>40 g\u003c/td>\u003ctd>10\u003c/td>\u003ctd>14\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paneer\u003c/td>\u003ctd>50 g\u003c/td>\u003ctd>18\u003c/td>\u003ctd>2\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chickpeas\u003c/td>\u003ctd>60 g\u003c/td>\u003ctd>16\u003c/td>\u003ctd>18\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>","difficulty":"Easy","explanation":"Answer: (b) Only Paneer and Chickpeas\nStep 1: Check each row against the threshold 15% of MDR, nutrient by nutrient.\nStep 2: Almonds 8, 12, 10 — none reaches 15. Spinach 5, 20, 12 — only Iron (20) does. Oats 10, 14, 5 — none. Paneer 18, 2, 25 — Protein (18) and Calcium (25) both do. Chickpeas 16, 18, 8 — Protein (16) and Iron (18) both do.\nStep 3: Only Paneer and Chickpeas clear the threshold in two nutrients.\nOnly Spinach and Chickpeas = picking the two rows with the biggest single Iron values instead of counting nutrients per row. Only Paneer = missing that Chickpeas' 16 and 18 also cross 15. Only Paneer, Spinach and Chickpeas = treating Spinach's Calcium 12 as if it met the 15 cutoff.\nKey verified by exhaustive check of all five rows in Python.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: brute-force row-wise threshold count over the table → {Paneer, Chickpeas}"},{"id":"IPMAT_QAMCQ_042","section":"QA-MCQ","format":"Caselet: DI table 5Q — nutrient/diet","kind":"mcq","passage":"The table gives the nutrient content of one serving of five food items — Almonds, Spinach, Oats, Paneer and Chickpeas — expressed as a percentage of the minimum daily requirement (MDR) of three nutrients: Protein, Iron and Calcium. The serving size of each item is indicated. Nutrient contributions add across servings and across items, and fractions of a serving are not allowed.","stem":"Which food item provides the highest percentage of the Iron MDR per 10 g of serving?","options":["Spinach","Chickpeas","Almonds","Oats"],"answer":"Almonds","answerIndex":2,"tags":["surface read","case omission","KEY","magnitude cluster"],"fig":null,"table":"\u003ctable>\u003ctr>\u003cth>Food item\u003c/th>\u003cth>Serving size\u003c/th>\u003cth>Protein (% of MDR)\u003c/th>\u003cth>Iron (% of MDR)\u003c/th>\u003cth>Calcium (% of MDR)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Almonds\u003c/td>\u003ctd>30 g\u003c/td>\u003ctd>8\u003c/td>\u003ctd>12\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spinach\u003c/td>\u003ctd>100 g\u003c/td>\u003ctd>5\u003c/td>\u003ctd>20\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oats\u003c/td>\u003ctd>40 g\u003c/td>\u003ctd>10\u003c/td>\u003ctd>14\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paneer\u003c/td>\u003ctd>50 g\u003c/td>\u003ctd>18\u003c/td>\u003ctd>2\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chickpeas\u003c/td>\u003ctd>60 g\u003c/td>\u003ctd>16\u003c/td>\u003ctd>18\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>","difficulty":"Medium","explanation":"Answer: (c) Almonds\nStep 1: The comparison must be per 10 g, so divide each Iron figure by the serving size and multiply by 10.\nStep 2: Almonds 12 ÷ 30 × 10 = 4.0; Spinach 20 ÷ 100 × 10 = 2.0; Oats 14 ÷ 40 × 10 = 3.5; Paneer 2 ÷ 50 × 10 = 0.4; Chickpeas 18 ÷ 60 × 10 = 3.0.\nStep 3: The largest per-10 g value is Almonds at 4.0% of the Iron MDR.\nSpinach = reading off the highest per-serving Iron figure (20) without adjusting for its 100 g serving. Chickpeas = the second-highest per-serving figure, the division by serving size again left undone (case omission).\nOats = the nearest per-10 g competitor (3.5), picked on a mis-division.\nKey verified by computing all five per-10 g ratios in Python.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: per-10g iron ratios computed for all rows → Almonds 4.0 > Oats 3.5 > Chickpeas 3.0 > Spinach 2.0 > Paneer 0.4"},{"id":"IPMAT_QAMCQ_043","section":"QA-MCQ","format":"Caselet: DI table 5Q — nutrient/diet","kind":"mcq","passage":"The table gives the nutrient content of one serving of five food items — Almonds, Spinach, Oats, Paneer and Chickpeas — expressed as a percentage of the minimum daily requirement (MDR) of three nutrients: Protein, Iron and Calcium. The serving size of each item is indicated. Nutrient contributions add across servings and across items, and fractions of a serving are not allowed.","stem":"A diet consists of exactly one serving of each of the five food items. The total Iron contribution of this diet exceeds its total Calcium contribution by what percentage?","options":["9.09%","6%","15.79%","10%"],"answer":"10%","answerIndex":3,"tags":["wrong reference base","intermediate state","related-quantity swap","KEY"],"fig":null,"table":"\u003ctable>\u003ctr>\u003cth>Food item\u003c/th>\u003cth>Serving size\u003c/th>\u003cth>Protein (% of MDR)\u003c/th>\u003cth>Iron (% of MDR)\u003c/th>\u003cth>Calcium (% of MDR)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Almonds\u003c/td>\u003ctd>30 g\u003c/td>\u003ctd>8\u003c/td>\u003ctd>12\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spinach\u003c/td>\u003ctd>100 g\u003c/td>\u003ctd>5\u003c/td>\u003ctd>20\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oats\u003c/td>\u003ctd>40 g\u003c/td>\u003ctd>10\u003c/td>\u003ctd>14\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paneer\u003c/td>\u003ctd>50 g\u003c/td>\u003ctd>18\u003c/td>\u003ctd>2\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chickpeas\u003c/td>\u003ctd>60 g\u003c/td>\u003ctd>16\u003c/td>\u003ctd>18\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>","difficulty":"Medium","explanation":"Answer: (d) 10%\nStep 1: Add each nutrient column for one serving of every item. Iron total = 12 + 20 + 14 + 2 + 18 = 66. Calcium total = 10 + 12 + 5 + 25 + 8 = 60.\nStep 2: 'Exceeds by what percentage' uses the smaller (Calcium) total as the base: percentage excess = (66 − 60) ÷ 60 × 100.\nStep 3: 6 ÷ 60 × 100 = 10%.\n9.09% = dividing the difference by the Iron total 66 instead of the Calcium base. 6% = stopping at the 6-percentage-point difference and reporting it as the answer. 15.79% = comparing Iron (66) with the Protein total (57) instead of Calcium.\nKey verified by summing all three columns in Python: 57, 66, 60, and (66 − 60)/60 = 10%.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: column totals P57 I66 Ca60 recomputed; (66-60)/60 = 10.0 exactly"},{"id":"IPMAT_QAMCQ_044","section":"QA-MCQ","format":"Caselet: DI table 5Q — nutrient/diet","kind":"mcq","passage":"The table gives the nutrient content of one serving of five food items — Almonds, Spinach, Oats, Paneer and Chickpeas — expressed as a percentage of the minimum daily requirement (MDR) of three nutrients: Protein, Iron and Calcium. The serving size of each item is indicated. Nutrient contributions add across servings and across items, and fractions of a serving are not allowed.","stem":"A diet contains one serving each of Spinach, Oats and Chickpeas. If two servings of Paneer are added to this diet, its total Calcium content becomes what percentage of the Calcium MDR?","options":["75%","50%","67%","60%"],"answer":"75%","answerIndex":0,"tags":["KEY","intermediate state","related-quantity swap","wrong reference base"],"fig":null,"table":"\u003ctable>\u003ctr>\u003cth>Food item\u003c/th>\u003cth>Serving size\u003c/th>\u003cth>Protein (% of MDR)\u003c/th>\u003cth>Iron (% of MDR)\u003c/th>\u003cth>Calcium (% of MDR)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Almonds\u003c/td>\u003ctd>30 g\u003c/td>\u003ctd>8\u003c/td>\u003ctd>12\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spinach\u003c/td>\u003ctd>100 g\u003c/td>\u003ctd>5\u003c/td>\u003ctd>20\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oats\u003c/td>\u003ctd>40 g\u003c/td>\u003ctd>10\u003c/td>\u003ctd>14\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paneer\u003c/td>\u003ctd>50 g\u003c/td>\u003ctd>18\u003c/td>\u003ctd>2\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chickpeas\u003c/td>\u003ctd>60 g\u003c/td>\u003ctd>16\u003c/td>\u003ctd>18\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>","difficulty":"Medium","explanation":"Answer: (a) 75%\nStep 1: Calcium from the base diet, one serving each: Spinach 12 + Oats 5 + Chickpeas 8 = 25% of MDR.\nStep 2: Two servings of Paneer add 2 × 25 = 50% of MDR, since contributions add across servings.\nStep 3: Total Calcium = 25 + 50 = 75% of the MDR.\n50% = counting only the two Paneer servings and forgetting the base diet's 25. 67% = running the same calculation on the Protein column (5 + 10 + 16 + 2 × 18) instead of Calcium. 60% = adding one serving of all five foods from the table (10 + 12 + 5 + 25 + 8), the wrong diet altogether.\nKey verified by direct recomputation of both the base-diet and two-Paneer totals in Python.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: 12+5+8+2×25 = 75 recomputed; protein swap 67 and five-food total 60 confirmed as distinct distractor values"},{"id":"IPMAT_QAMCQ_045","section":"QA-MCQ","format":"Caselet: DI table 5Q — nutrient/diet (optimisation)","kind":"mcq","passage":"The table gives the nutrient content of one serving of five food items — Almonds, Spinach, Oats, Paneer and Chickpeas — expressed as a percentage of the minimum daily requirement (MDR) of three nutrients: Protein, Iron and Calcium. The serving size of each item is indicated. Nutrient contributions add across servings and across items, and fractions of a serving are not allowed.","stem":"A meal plan includes x servings of Spinach and y servings of Chickpeas, where x and y are non-negative integers. If the plan must provide at least 100% of the Iron MDR, at least 50% of the Calcium MDR and at least 60% of the Protein MDR, then the minimum value of x + y is","options":["5","8","6","7"],"answer":"6","answerIndex":2,"tags":["case omission","magnitude cluster","KEY","boundary/off-by-one"],"fig":null,"table":"\u003ctable>\u003ctr>\u003cth>Food item\u003c/th>\u003cth>Serving size\u003c/th>\u003cth>Protein (% of MDR)\u003c/th>\u003cth>Iron (% of MDR)\u003c/th>\u003cth>Calcium (% of MDR)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Almonds\u003c/td>\u003ctd>30 g\u003c/td>\u003ctd>8\u003c/td>\u003ctd>12\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spinach\u003c/td>\u003ctd>100 g\u003c/td>\u003ctd>5\u003c/td>\u003ctd>20\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oats\u003c/td>\u003ctd>40 g\u003c/td>\u003ctd>10\u003c/td>\u003ctd>14\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paneer\u003c/td>\u003ctd>50 g\u003c/td>\u003ctd>18\u003c/td>\u003ctd>2\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chickpeas\u003c/td>\u003ctd>60 g\u003c/td>\u003ctd>16\u003c/td>\u003ctd>18\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>","difficulty":"Hard","explanation":"Answer: (c) 6\nStep 1: Write the constraints from the Spinach and Chickpeas rows: Iron 20x + 18y ≥ 100, Calcium 12x + 8y ≥ 50, Protein 5x + 16y ≥ 60.\nStep 2: Test x + y = 5. The Iron constraint forces x = 5, y = 0 (any y ≥ 1 leaves Iron below 100: for example x = 4, y = 1 gives 98). But x = 5, y = 0 gives Protein 25 \u003c 60, so no plan of 5 servings works.\nStep 3: Test x + y = 6. Take x = 3, y = 3: Iron 60 + 54 = 114 ≥ 100, Calcium 36 + 24 = 60 ≥ 50, Protein 15 + 48 = 63 ≥ 60. All three hold, so the minimum value of x + y is 6.\n5 = dropping the Protein constraint, under which x = 5, y = 0 would suffice. 7 = stopping one step past the true minimum after a failed trial at 6. 8 = a safe round over-count in the same range.\nKey verified by an exhaustive grid search over all (x, y) with x, y ≤ 20 in Python; the minimum feasible total is 6, attained at (3, 3), (2, 4) and (1, 5).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: full (x,y) enumeration 0–20 → feasible minimum x+y = 6 at (1,5),(2,4),(3,3); without protein constraint min = 5 at (5,0), confirming the case-omission distractor"},{"id":"IPMAT_VARC_046","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"The counterfeit was consumption's guilty secret. A fake watch was bought in a back alley and worn with a prayer that nobody would look too closely, because to be caught with one was to be unmasked as a pretender to a status one could not afford. The dupe, its successor in the vocabulary of younger shoppers, carries no such shame. Videos in which a creator holds a 600-rupee moisturiser beside its 6,000-rupee 'inspiration' and pronounces them indistinguishable routinely draw millions of views, and the comment sections are congratulatory. Finding a convincing dupe is advertised as evidence of savvy, not of scarcity.\n\nThe shift matters because it attacks the most profitable fiction in modern retail: the premium markup. A luxury brand does not primarily sell an object; it sells a licensed story about the sort of person who owns the object, and the markup is best understood as a tax on belief. So long as shoppers believed that meaning was inseparable from the branded article — that the story could only be rented from its owner, never copied — the tax was collected without protest. The dupe buyer's quiet heresy is the claim that function and story can be prised apart: the cream hydrates just as well without the parable of the Alpine laboratory attached to it. This is not, as some commentators insist, a revolt against consumerism. The dupe shopper consumes as enthusiastically as anyone; what she declines to buy is the brand's exclusive right to assign significance.\n\nYet the dupe economy is a parasite with a stake in its host's survival. A dupe is legible only because the original exists and retains its cachet; nobody films themselves comparing two obscure creams. Were prestige brands actually to collapse, the dupe would lose the reference point that lends it both meaning and its small glamour of transgression. The likelier outcome is discipline rather than destruction: markups may have to shrink toward what the story is genuinely worth to its audience, and brands may have to invest in things a copyist cannot cheaply replicate — service, provenance, verifiable craft. The dupe will not kill luxury. It may, however, force luxury to earn its tax.","stem":"According to the author, the dupe differs from the counterfeit in that it","options":["attacks the most profitable fiction in modern retail.","is displayed openly and read as proof of shrewd

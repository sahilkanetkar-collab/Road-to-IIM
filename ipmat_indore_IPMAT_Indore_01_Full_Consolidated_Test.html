ness rather than of hardship.","is always impossible to tell apart from the branded original.","is purchased furtively for fear of unmasking its owner as a pretender."],"answer":"is displayed openly and read as proof of shrewdness rather than of hardship.","answerIndex":1,"tags":["true-but-not-the-answer","KEY","overstatement","reversal/actor swap"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nThe opening paragraph contrasts two objects: the counterfeit, bought in secret and worn in fear of exposure, and the dupe, which is shown off in comparison videos and congratulated. The difference the author draws is one of shame versus pride.\nCorrect (b): 'advertised as evidence of savvy, not of scarcity' maps to 'proof of shrewdness rather than of hardship', and 'carries no such shame' maps to 'displayed openly'.\nIncorrect (a): true, but it answers a different question — attacking the premium markup is why the shift matters (Para 2), not how the dupe differs from the counterfeit.\nIncorrect (c): absolute claim — a creator 'pronounces them indistinguishable'; the passage never says every dupe always is.\nIncorrect (d): actor swap — furtive purchase and fear of exposure describe the counterfeit, not the dupe.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; key paraphrase confirmed against Para 1"},{"id":"IPMAT_VARC_047","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"The counterfeit was consumption's guilty secret. A fake watch was bought in a back alley and worn with a prayer that nobody would look too closely, because to be caught with one was to be unmasked as a pretender to a status one could not afford. The dupe, its successor in the vocabulary of younger shoppers, carries no such shame. Videos in which a creator holds a 600-rupee moisturiser beside its 6,000-rupee 'inspiration' and pronounces them indistinguishable routinely draw millions of views, and the comment sections are c which its appeal and meaning are defined.","answerIndex":0,"tags":["KEY","reversal/actor swap","true-but-not-the-answer","scope shift"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nParagraph 3 calls the dupe economy 'a parasite with a stake in its host's survival': a dupe is legible only because the original exists and keeps its standing. The collapse of prestige brands would therefore remove what makes the dupe meaningful.\nCorrect (a): 'lose the reference point that lends it both meaning and its small glamour' is paraphrased as 'forfeit the benchmark against which its appeal and meaning are defined' — a hedged conditional, fitting the stem's 'implies'.\nIncorrect (b): reversal — the passage argues the dupe depends on the original, not that it could inherit the original's place.\nIncorrect (c): the passage does predict shrinking markups, but in the survival ('discipline') scenario — true, but not what this stem asks.\nIncorrect (d): scope shift — the passage never claims the dupe would expand across product categories.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; inference anchored to Para 3 conditional"},{"id":"IPMAT_VARC_049","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"The counterfeit was consumption's guilty secret. A fake watch was bought in a back alley and worn with a prayer that nobody would look too closely, because to be caught with one was to be unmasked as a pretender to a status one could not afford. The dupe, its successor in the vocabulary of younger shoppers, carries no such shame. Videos in which a creator holds a 600-rupee moisturiser beside its 6,000-rupee 'inspiration' and pronounces them indistinguishable routinely draw millions of views, and the comment sections are congratulatory. Finding a convincing dupe is advertised as evidence of savvy, not of scarcity.\n\nThe shift matters because it attacks the most profitable fiction in modern retail: the premium markup. A luxury brand does not primarily sell an object; it sells a licensed story about the sort of person who owns the object, and the markup is best understood as a tax on belief. So long as shoppers believed that meaning was inseparable from the branded article — that the story could only be rented from its owner, never copied — the tax was collected without protest. The dupe buyer's quiet heresy is the claim that function and story can be prised apart: the cream hydrates just as well without the parable of the Alpine laboratory attached to it. This is not, as some commentators insist, a revolt against consumerism. The dupe shopper consumes as enthusiastically as anyone; what she declines to buy is the brand's exclusive right to assign significance.\n\nYet the dupe economy is a parasite with a stake in its host's survival. A dupe is legible only because the original exists and retains its cachet; nobody films themselves comparing two obscure creams. Were prestige brands actually to collapse, the dupe would lose the reference point that lends it both meaning and its small glamour of transgression. The likelier outcome is discipline rather than destruction: markups may have to shrink toward what the story is genuinely worth to its audience, and brands may have to invest in things a copyist cannot cheaply replicate — service, provenance, verifiable craft. The dupe will not kill luxury. It may, however, force luxury to earn its tax.","stem":"Which of the following best states the main point of the passage?","options":["Dupe culture has been driven chiefly by falling incomes and rising retail prices.","Dupe culture spells the inevitable end of the luxury industry.","Dupe culture contests brands' authority to assign meaning and may force them to justify their premiums.","Videos comparing dupes with their originals now attract audiences of millions."],"answer":"Dupe culture contests brands' authority to assign meaning and may force them to justify their premiums.","answerIndex":2,"tags":["plausible-in-world-absent-in-text","overstatement","KEY","specific-for-general"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nThe passage moves from the dupe's shamelessness, to what it undermines (the markup as a 'tax on belief' and the brand's exclusive right to assign significance), to a hedged forecast: discipline rather than destruction.\nCorrect (c): sits at the right altitude — the positive thesis, not a single detail — and keeps the author's hedge ('may force'), matching 'It may, however, force luxury to earn its tax'.\nIncorrect (a): plausible in the real world, but the passage never mentions incomes or price inflation as the driver; it frames the dupe as a rejection of the brand's story, not as economising.\nIncorrect (b): overstatement — the passage says the opposite: 'The dupe will not kill luxury.'\nIncorrect (d): a true detail from Paragraph 1 offered where the whole argument is asked — far too narrow for the main point.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; key mid-altitude and hedged per spec Section 5"},{"id":"IPMAT_VARC_050","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"The counterfeit was consumption's guilty secret. A fake watch was bought in a back alley and worn with a prayer that nobody would look too closely, because to be caught with one was to be unmasked as a pretender to a status one could not afford. The dupe, its successor in the vocabulary of younger shoppers, carries no such shame. Videos in which a creator holds a 600-rupee moisturiser beside its 6,000-rupee 'inspiration' and pronounces them indistinguishable routinely draw millions of views, and the comment sections are congratulatory. Finding a convincing dupe is advertised as evidence of savvy, not of scarcity.\n\nThe shift matters because it attacks the most profitable fiction in modern retail: the premium markup. A luxury brand does not primarily sell an object; it sells a licensed story about the sort of person who owns the object, and the markup is best understood as a tax on belief. So long as shoppers believed that meaning was inseparable from the branded article — that the story could only be rented from its owner, never copied — the tax was collected without protest. The dupe buyer's quiet heresy is the claim that function and story can be prised apart: the cream hydrates just as well without the parable of the Alpine laboratory attached to it. This is not, as some commentators insist, a revolt against consumerism. The dupe shopper consumes as enthusiastically as anyone; what she declines to buy is the brand's exclusive right to assign significance.\n\nYet the dupe economy is a parasite with a stake in its host's survival. A dupe is legible only because the original exists and retains its cachet; nobody films themselves comparing two obscure creams. Were prestige brands actually to collapse, the dupe would lose the reference point that lends it both meaning and its small glamour of transgression. The likelier outcome is discipline rather than destruction: markups may have to shrink toward what the story is genuinely worth to its audience, and brands may have to invest in things a copyist cannot cheaply replicate — service, provenance, verifiable craft. The dupe will not kill luxury. It may, however, force luxury to earn its tax.","stem":"By describing the premium markup as 'a tax on belief', the writer wants to convey that","options":["shoppers pay extra because they subscribe to the brand's story, not for added utility.","governments levy special duties on imported luxury goods.","luxury brands conceal the true cost of production from their customers.","every branded purchase is an act of irrational self-deception."],"answer":"shoppers pay extra because they subscribe to the brand's story, not for added utility.","answerIndex":0,"tags":["KEY","literal-for-figurative","plausible-in-world-absent-in-text","overstatement"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nIn Paragraph 2 the metaphor sits inside the claim that a luxury brand sells 'a licensed story' rather than an object: the extra price is what buyers pay for believing that story, and it is 'collected without protest' only while the belief holds.\nCorrect (a): reads the metaphor figuratively — the 'tax' is the surcharge, 'belief' is acceptance of the brand's story; 'not for added utility' matches the point that the cream 'hydrates just as well' without the story.\nIncorrect (b): literal reading of 'tax' — no government or duty appears anywhere in the passage.\nIncorrect (c): plausible in the real world, but the passage makes no claim about hidden production costs.\nIncorrect (d): overstatement — the author never calls branded buying irrational or self-deceiving; the tone is analytical, and the belief is presented as something buyers may withdraw, not a delusion.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; metaphor keyed to figurative contextual sense"},{"id":"IPMAT_VARC_051","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"The counterfeit was consumption's guilty secret. A fake watch was bought in a back alley and worn with a prayer that nobody would look too closely, because to be caught with one was to be unmasked as a pretender to a status one could not afford. The dupe, its successor in the vocabulary of younger shoppers, carries no such shame. Videos in which a creator holds a 600-rupee moisturiser beside its 6,000-rupee 'inspiration' and pronounces them indistinguishable routinely draw millions of views, and the comment sections are congratulatory. Finding a convincing dupe is advertised as evidence of savvy, not of scarcity.\n\nThe shift matters because it attacks the most profitable fiction in modern retail: the premium markup. A luxury brand does not primarily sell an object; it sells a licensed story about the sort of person who owns the object, and the markup is best understood as a tax on belief. So long as shoppers believed that meaning was inseparable from the branded article — that the story could only be rented from its owner, never copied — the tax was collected without protest. The dupe buyer's quiet heresy is the claim that function and story can be prised apart: the cream hydrates just as well without the parable of the Alpine laboratory attached to it. This is not, as some commentators insist, a revolt against consumerism. The dupe shopper consumes as enthusiastically as anyone; what she declines to buy is the brand's exclusive right to assign significance.\n\nYet the dupe economy is a parasite with a stake in its host's survival. A dupe is legible only because the original exists and retains its cachet; nobody films themselves comparing two obscure creams. Were prestige brands actually to collapse, the dupe would lose the reference point that lends it both meaning and its small glamour of transgression. The likelier outcome is discipline rather than destruction: markups may have to shrink toward what the story is genuinely worth to its audience, and brands may have to invest in things a copyist cannot cheaply replicate — service, provenance, verifiable craft. The dupe will not kill luxury. It may, however, force luxury to earn its tax.","stem":"'Cachet' (Para 3) means","options":["a hidden store or hoard.","an official seal or stamp.","a high resale price.","an aura of prestige and distinction."],"answer":"an aura of prestige and distinction.","answerIndex":3,"tags":["near-synonym drift","near-synonym drift","near-synonym drift","KEY"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (d)\nIn Paragraph 3, a dupe 'is legible only because the original exists and retains its cachet' — the sentence is about the original's continuing standing in shoppers' eyes, which is what makes copying it worthwhile.\nCorrect (d): the contextual sense of 'cachet' is prestige or an air of distinction; the original's standing is the 'reference point' the very next sentence says the dupe would lose.\nIncorrect (a): confusion with the near-homophone 'cache' — an everyday-sense misreading.\nIncorrect (b): the word's older dictionary sense (a seal), not the sense the context uses.\nIncorrect (c): same domain but wrong — the paragraph's point is about standing and desirability, not resale value; price is nowhere attached to 'cachet'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; vocab keyed to contextual sense with Para locator"},{"id":"IPMAT_VARC_052","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.","stem":"The writer observed that when one of the ants fell under its load, the others...","options":["stopped to tend the fallen carrier before going on their way.","summoned additional workers from the nest to share the burden.","took up the load themselves and continued along the road.","worked on without overseer or wages of any kind."],"answer":"took up the load themselves and continued along the road.","answerIndex":2,"tags":["reversal/actor swap","plausible-but-absent","KEY","true-but-not-the-answer"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nThe first paragraph closes with the incident the stem points to: a carrier stumbles, and the two ants behind her respond not with sympathy but by carrying the work forward.\nCorrect (c): The passage says the two that came behind \"did not stop to pity her\" and instead lifted the burden and moved on — the option paraphrases this as taking up the load and continuing.\nIncorrect (a): Reversal — the passage states the opposite: the ants did not stop to attend to the fallen carrier.\nIncorrect (b): Not mentioned anywhere in the passage — reinforcements from the nest are a reasonable guess about ants, but the writer never describes them.\nIncorrect (d): True, but it answers a different question — the absence of overseers and wages is described earlier in the paragraph, not as what happened when the ant fell.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; detail anchored to Para 1 incident"},{"id":"IPMAT_VARC_053","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.","stem":"The writer argues that the diligence of men...","options":["often depends on being observed and fades when the watcher is gone.","is always a pretence and never proceeds from genuine industry.","is rewarded with wages that the ant neither seeks nor receives.","has declined most sharply among those who work in offices."],"answer":"often depends on being observed and fades when the watcher is gone.","answerIndex":0,"tags":["KEY","overstatement/absolute","true-but-not-the-answer","scope shift"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nIn the second paragraph the writer contrasts human work with the ant's: much of what men call industry is a display put on for others.\nCorrect (a): \"The best part of our diligence is a performance: we are industrious where we are watched\" maps to depending on observation, and the office door closing on \"the day's virtue\" maps to diligence fading when the watcher is gone. The hedged \"often\" matches the writer's \"the best part\" and \"too often\" — he does not condemn all human work.\nIncorrect (b): An absolute the passage does not make — \"always\" and \"never\" push the writer's qualified claim to an extreme he avoids.\nIncorrect (c): True — the passage does say no wage is promised to the ant — but it answers a question about payment, not about what human diligence depends on.\nIncorrect (d): Scope shift — the office door is the writer's image, not a claim comparing office workers with anyone else.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; key hedged, distractor (b) carries the absolute"},{"id":"IPMAT_VARC_054","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.","stem":"The writer of the passage implies that the ant's labour differs from a man's chiefly in that...","options":["no human being is capable of working without an audience.","the ant can carry a moth's wing upright like a sail.","its labour continues from the first warmth of the sun until nightfall.","the ant makes no separation between its work and its life."],"answer":"the ant makes no separation between its work and its life.","answerIndex":3,"tags":["overstatement/absolute","specific-for-general","true-but-not-the-answer","KEY"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nThe heart of the second paragraph is a distinction of kind, not of degree: for men, work is instrumental and partly theatrical; for the ant it is not an instrument at all.\nCorrect (d): \"Her work is not a means to her life but the whole substance of it\" is paraphrased as making no separation between work and life — the chief difference the writer draws.\nIncorrect (a): An absolute the writer refutes — his closing hope that work be done \"the same whether the door is open or shut\" assumes men can work unwatched.\nIncorrect (b): The passage's illustrative instance offered where the stem asks for the principle — a picturesque detail, not the chief difference.\nIncorrect (c): True — the first paragraph says exactly this — but the duration of the ant's day is a description, not the distinction the writer builds his reflection on.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; inference pitched at the claim, not the example"},{"id":"IPMAT_VARC_055","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.","stem":"The main point the passage makes is that...","options":["ants labour ceaselessly without overseers, wages, or complaint.","work possesses its true dignity when it is carried on unwatched as readily as watched.","men should give up wages and applause altogether and labour as the ants do.","idleness, rightly used, is a necessary part of a working life."],"answer":"work possesses its true dignity when it is carried on unwatched as readily as watched.","answerIndex":1,"tags":["specific-for-general","KEY","overstatement/absolute","true-but-not-the-answer"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nThe passage moves from an observation of ants to a general claim about labour, stated in the final paragraph as the lesson the hill taught.\nCorrect (b): \"The dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut\" — the option paraphrases this positive thesis at mid-altitude: neither the narrow ant-fact nor a mere negation.\nIncorrect (a): The passage's example offered as its point — the ants are the illustration, not the thesis.\nIncorrect (c): An unwarranted strengthening the writer expressly rejects: \"I would not have men become ants.\"\nIncorrect (d): True — \"a man who cannot be idle cannot properly be said to work\" — but it is a supporting aside, not the point the whole passage is built to make.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; main-idea key at mid-altitude"},{"id":"IPMAT_VARC_056","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.","stem":"In referring to the old counsel \"Go to the ant, thou sluggard\", the writer wants to convey that...","options":["sluggards would profit from a close study of the habits of insects.","proverbs of this kind have lost their force with modern readers.","it is the ant, rather than the sluggard, that truly deserves the scolding.","the saying may be taken as a call to witness labour free of vanity rather than as a rebuke."],"answer":"the saying may be taken as a call to witness labour free of vanity rather than as a rebuke.","answerIndex":3,"tags":["literal-for-figurative","plausible-but-absent","reversal/actor swap","KEY"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nThe writer quotes the proverb only to reinterpret it: where tradition hears a reprimand for laziness, he hears something gentler and more instructive.\nCorrect (d): \"Commonly read as a scolding; I had rather read it as an invitation — to witness... labour with no vanity in it\" maps directly: 'invitation to witness' becomes 'a call to witness', 'scolding' becomes 'rebuke'. The hedged 'may be taken' fits the writer's tentative 'I had rather read it'.\nIncorrect (a): Reads the proverb literally — the writer is not recommending entomology to the lazy; the ant is a figure for a kind of labour.\nIncorrect (b): A reasonable claim about proverbs in the world, but the passage says nothing about their force with modern readers.\nIncorrect (c): Swaps the target of the scolding — the writer redirects the proverb's purpose, not its object; the ant is never blamed.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; allusion item carries the literal-for-figurative distractor"},{"id":"IPMAT_VARC_057","section":"VA","format":"RC set 6Q","kind":"mcq","passage":"On a June morning I went up the chalk down with no better purpose than to be idle among the harebells, and found instead a nation at work. A thread of ants ran from the gorse thicket to a crack beneath a grey stone, and along this road burdens travelled the whole day through: a straw, a grass seed, the wing of a moth carried upright like a sail. No overseer walked the line; no wage was promised or paid; yet the labour was unremitting from the first warmth of the sun until the dew put out the light. Once I saw a carrier stumble and fall beneath her load. The two that came behind did not stop to pity her; they took up the burden and went on, and presently she rose and followed empty-handed, as if nothing were owed to her and nothing lost.\n\nWe men, I could not help reflecting, work otherwise. The best part of our diligence is a performance: we are industrious where we are watched, and the shutting of the office door is too often the end of the day's virtue. The ant has no audience and wants none. Her work is not a means to her life but the whole substance of it, and she gives an unstinted service to a commonwealth whose completion she will never see. The old counsel, \"Go to the ant, thou sluggard,\" is commonly read as a scolding; I had rather read it as an invitation — to witness, once in a life, labour with no vanity in it.\n\nAnd yet I would not have men become ants, for a man who cannot be idle cannot properly be said to work. What the hill taught me was narrower and better: that the dignity of labour does not lie in its magnitude, nor in the wages it commands, nor in the notice it attracts, but in its being done the same whether the door is open or shut. The idle man mistakes motion for labour; the vain man mistakes applause for it. The ant, who knows neither, is deceived by neither.","stem":"The antonym for \"unstinted\" (Para 2) is","options":["Grudging","Lavish","Unremitting","Thankless"],"answer":"Grudging","answerIndex":0,"tags":["KEY","near-synonym drift","near-synonym drift","near-synonym drift"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nIn Para 2 the ant \"gives an unstinted service to a commonwealth whose completion she will never see\" — unstinted here means given freely and without holding anything back.\nCorrect (a): Grudging — given reluctantly, with something withheld — is the direct opposite of service given without stint.\nIncorrect (b): Lavish is a synonym of the target, not its antonym — the classic trap in antonym items.\nIncorrect (c): Unremitting belongs to the same paragraph's field of ceaseless effort and describes the labour's duration, not its generosity; it is neither synonym nor antonym of unstinted.\nIncorrect (d): Thankless is an everyday-sense misreading of the context — the ant's service is indeed unrewarded, but thankless describes how work is received, not whether it is given freely.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; antonym item with synonym-of-target distractor per spec"},{"id":"IPMAT_VARC_058","section":"VA","format":"RC set 6Q (transcript)","kind":"mcq","passage":"Host: My guest today is the economist Dr. Meera Krishnan, who believes we have been sorting companies into the wrong boxes. Dr. Krishnan, you say sectors are the wrong way to classify firms. What should replace them?\n\nDr. Krishnan: Tempo should. I divide firms into glaciers and monsoons. A glacier firm compounds its advantage slowly — a distribution network, a regulatory licence, a brand trusted across generations. Nothing about it is dramatic, but almost nothing about it is reversible either. A monsoon firm lives in bursts. It grows torrentially when conditions favour it and recedes just as quickly when they turn. Its advantage must be earned afresh in every cycle.\n\nHost: So a glacier is simply a big, old company?\n\nDr. Krishnan: That is the misreading I meet most often. Size and age are outcomes of being a glacier, not the test for it. A ten-year-old insurance firm is a glacier if its moat deepens with every policy it writes. A century-old fashion house is still a monsoon, because each season it must win its customers all over again.\n\nHost: How do you tell the two apart in actual data?\n\nDr. Krishnan: I use three yardsticks. First, revenue persistence: how much of this year's revenue is already locked in, by contract or by habit, for next year. Second, the decay rate of the core asset: a licence or a network loses value slowly, while a trend or a hit product loses value fast. Third, the cost of a one-year pause: a glacier that shuts for a year reopens largely intact, but a monsoon that misses a single season may never recover its position.\n\nHost: Then surely investors should prefer glaciers — the safer bet?\n\nDr. Krishnan: I would resist that conclusion. Monsoons are not inferior; they are differently timed, and a well-chosen basket of monsoons can outperform any glacier over the same period. The real error is not owning monsoons. It is pricing a monsoon as though it were a glacier — paying for a permanence that was never on offer.\n\nHost: And what does this mean for the people who run these firms?\n\nDr. Krishnan: A manager's first duty is to know which weather the firm works in. A glacier manager who chases quarterly velocity will erode the very moat that justifies the firm; a monsoon manager who drafts thirty-year plans will simply miss the season.","stem":"The main point the transcript makes is that","options":["large, long-established companies deserve higher valuations than firms that grow in bursts.","firms are bet  the season.","stem":"In the transcript, the term 'glacier firm' refers to a firm that","options":["is protected by a regulatory licence in a heavily supervised industry.","grows torrentially whenever market conditions turn in its favour.","can never lose its competitive advantage once that advantage is built.","builds its advantage slowly and loses it slowly, whatever its age or size."],"answer":"builds its advantage slowly and loses it slowly, whatever its age or size.","answerIndex":3,"tags":["specific-for-general swap","reversal / actor swap","overstatement / absolute","KEY"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nThe economist defines a glacier by tempo: it 'compounds its advantage slowly' and 'almost nothing about it is reversible', and she immediately corrects the host's assumption that this means big and old — a ten-year-old insurer can qualify.\nCorrect (d): paraphrases both halves of the definition — slow accumulation, slow erosion — and carries the explicit rider that size and age are outcomes, not the test.\nIncorrect (a): specific-for-general — a regulatory licence is one illustrative example of a glacier's asset, not the definition of the category.\nIncorrect (b): reversal — torrential growth in favourable conditions is the defining trait of the monsoon firm, the opposite category.\nIncorrect (c): overstatement — the passage says a glacier's position is 'almost' irreversible and erodible by bad management, not that its advantage can never be lost.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; rejected size/age misreading reserved for Q61 key to avoid double-key overlap."},{"id":"IPMAT_VARC_060","section":"VA","format":"RC set 6Q (transcript)","kind":"mcq","passage":"Host: My guest today is the economist Dr. Meera Krishnan, who believes we have been sorting companies into the wrong boxes. Dr. Krishnan, you say sectors are the wrong way to classify firms. What should e firm works in. A glacier manager who chases quarterly velocity will erode the very moat that justifies the firm; a monsoon manager who drafts thirty-year plans will simply miss the season.","stem":"When the host suggests that investors should prefer glacier firms, Dr. Krishnan responds that","options":["monsoon firms should never be included in a long-term portfolio.","a prudent investor must hold both kinds of firm in equal proportion.","glacier firms are routinely overpriced because their permanence is exaggerated.","the mistake is valuing a monsoon as if its strength were permanent."],"answer":"the mistake is valuing a monsoon as if its strength were permanent.","answerIndex":3,"tags":["overstatement / absolute","plausible-in-world, absent-in-text","reversal / actor swap","KEY"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nThe attribution matters here: preferring glaciers is the host's proposal, and the economist resists it. Her reply relocates the danger — monsoons are 'differently timed', not inferior, and the real error lies in how they are priced, not in whether they are owned.\nCorrect (d): paraphrases 'pricing a monsoon as though it were a glacier — paying for a permanence that was never on offer'; 'valuing as if its strength were permanent' maps onto paying for permanence.\nIncorrect (a): overstatement — she says the error is not owning monsoons is not the problem; excluding them outright pushes her hedged view to an absolute she never states.\nIncorrect (b): plausible in the world, absent in the text — sensible-sounding portfolio advice, but no proportion is ever prescribed.\nIncorrect (c): reversal — the mispricing she describes afflicts monsoons treated as glaciers, not glaciers themselves.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: RC checklist pass; speaker-attribution completion; key reworded to remove 5-word overlap with 'pricing a monsoon as though'."},{"id":"IPMAT_VARC_063","section d): 'Burn the midnight oil' means to work late into the night — what a team must do when a deadline is suddenly advanced.\nIncorrect (a): 'burn the midnight lamp' is a corrupted form; the idiom takes 'oil', a relic of oil lamps, not 'lamp'.\nIncorrect (b): a real idiom, but 'burn one's bridges' means to destroy any possibility of going back on a decision — irrelevant here.\nIncorrect (c): 'burn the evening oil' is a corrupted form with one word swapped; no such expression exists.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: idiom standardness checked; no second genuine expression completes the sentence."},{"id":"IPMAT_VARC_066","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"The product launch was meant to stay confidential, but Prakash ___ when he thanked the design team on a public forum.","options":["let the cat out of the bag","let the rat out of the bag","let sleeping dogs lie","let the cat off the bag"],"answer":"let the cat out of the bag","answerIndex":0,"tags":["KEY","corrupted fixed expression","real expression, wrong meaning","corrupted fixed expression"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (a)\nCorrect (a): 'Let the cat out of the bag' means to reveal a secret carelessly or by mistake — which is what Prakash's public thank-you note did.\nIncorrect (b): 'let the rat out of the bag' is a corrupted form with the animal swapped; the fixed expression takes 'cat'.\nIncorrect (c): a real idiom, but 'let sleeping dogs lie' means to avoid stirring up an old problem — the opposite of revealing something new.\nIncorrect (d): 'let the cat off the bag' corrupts the preposition; the idiom is 'out of the bag'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: idiom standardness checked; no second genuine expression completes the sentence."},{"id":"IPMAT_VARC_067","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"Rohan's constant interruptions annoy everyone, but the team has decided to ___ for the sake of the project.","options":["put him aside","put him down","put in with him","put up with him"],"answer":"put up with him","answerIndex":3,"tags":["corrupted fixed expression","real expression, wrong meaning","corrupted fixed expression","KEY"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): 'Put up with' means to tolerate someone or something unpleasant without complaining — the team tolerates Rohan for the project's sake.\nIncorrect (a): 'put him aside' corrupts the phrasal verb; things, not people, are 'put aside', and it means to save or postpone, not to tolerate.\nIncorrect (b): a real phrasal verb, but 'put someone down' means to criticise or humiliate them — the opposite of quiet tolerance.\nIncorrect (c): 'put in with him' is a corrupted form; 'put in with' is not a standard expression for tolerating a person.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: phrasal-verb forms checked against standard usage; only the key fits the tolerance sense."},{"id":"IPMAT_VARC_068","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"During cross-examination, the lawyer's patient questioning finally managed to ___ the full story from the hesitant witness.","options":["solicit","explicit","elicit","illicit"],"answer":"elicit","answerIndex":2,"tags":["confusable/homophone sibling","confusable/homophone sibling","KEY","confusable/homophone sibling"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): 'Elicit' means to draw out a response or information from someone, especially with effort — the standard collocation with questioning ('elicit an answer/the truth').\nIncorrect (a): 'solicit' is a real verb but means to ask for or request (business, votes, donations); one solicits opinions, one elicits the truth through questioning.\nIncorrect (b): 'explicit' is an adjective meaning clearly stated; it is a sound-alike sibling, not a verb.\nIncorrect (d): 'illicit' is an adjective meaning illegal or forbidden — the classic confusable of 'elicit', and cannot govern an object here.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: confusable set checked; only the key is grammatical and collocationally correct in the blank."},{"id":"IPMAT_VARC_069","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"Freshly recruited trainees are expected to ___ quickly to the bank's demanding work culture.","options":["adopt","adapt","apt","adept"],"answer":"adapt","answerIndex":1,"tags":["confusable/homophone sibling","KEY","confusable/homophone sibling","category/part-of-speech error"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): 'Adapt' means to adjust oneself to new conditions and takes the preposition 'to' — 'adapt to a culture' is the fixed pattern.\nIncorrect (a): 'adopt' means to take up a practice, method or child as one's own; it takes a direct object ('adopt a policy'), never 'adopt to'.\nIncorrect (c): 'apt' is an adjective meaning suitable or quick to learn; it cannot serve as the verb the blank needs.\nIncorrect (d): 'adept' is an adjective meaning skilled, used with 'at' ('adept at coding'); it is a sound-alike sibling, not a verb.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: confusable set checked; only the key is a verb taking 'to' with the required sense."},{"id":"IPMAT_VARC_070","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"Even a decade after their partnership was dissolved, Keshav continued to ___ a grudge against his former associate.","options":["harness","herald","harbour","hoard"],"answer":"harbour","answerIndex":2,"tags":["collocation break","collocation break","KEY","collocation break"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): 'Harbour' means to keep a thought or feeling, especially a negative one, in one's mind over time; 'harbour a grudge' is the standard collocation (as in 'harbour doubts, harbour resentment').\nIncorrect (a): 'harness' means to control and use a force or resource ('harness solar energy'); it does not co-occur with 'grudge'.\nIncorrect (b): 'herald' means to announce or signal the approach of something; 'herald a grudge' is not standard usage.\nIncorrect (d): 'hoard' means to accumulate and store objects or money; feelings are harboured or nursed, not hoarded.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: collocation checked; 'nurse a grudge' deliberately excluded from options to avoid a second key."},{"id":"IPMAT_VARC_071","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"The Harappan seals discovered at Dholavira [[is regarded to be]] among the finest examples of Bronze Age craftsmanship.","options":["are regarded as","is regarded as","are regarded to be","are regarded like"],"answer":"are regarded as","answerIndex":0,"tags":["KEY","half-fix","half-fix","new error"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): The subject is the plural 'seals', so the verb must be 'are'; and the fixed pattern is 'regarded as', never 'regarded to be'. Option (a) repairs both errors.\nIncorrect (b): half-fix — corrects the idiom to 'regarded as' but keeps the singular 'is' with the plural subject 'seals'.\nIncorrect (c): half-fix — corrects the agreement but keeps the non-standard 'regarded to be'.\nIncorrect (d): new error — fixes the agreement but introduces 'regarded like', which is not idiomatic; 'regard' takes 'as'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: key is the only zero-error replacement; each distractor re-read to confirm exactly one surviving or introduced fault."},{"id":"IPMAT_VARC_072","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"[[If she would win the state election, than]] her party will form the government with two smaller allies.","options":["If she would win the state election, then","Should she win the state election, than","Should she win the state election,","Should she wins the state election,"],"answer":"Should she win the state election,","answerIndex":2,"tags":["half-fix","half-fix","KEY","new error"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nThe span has two errors — 'would win' cannot sit in the if-clause of a future condition, and 'than' (comparison) is confused with 'then'. Conditional inversion with the bare verb, 'Should she win …,', fixes both and needs no connector: 'Should she win the state election, her party will form the government.'\nIncorrect (a): half-fix — corrects 'than' to 'then' but keeps the faulty 'would win' inside the if-clause.\nIncorrect (b): half-fix — adopts the correct inversion but keeps the comparative 'than'.\nIncorrect (d): new error — the inverted 'Should' must take the bare form 'win'; 'wins' breaks the construction.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: key is the only zero-error replacement; near-verbatim original retained as option (a)."},{"id":"IPMAT_VARC_073","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"Yesterday, before leaving for Pune, Meera [[has the electrician repairing]] the faulty inverter.","options":["had the electrician repairing","had the electrician who repaired","had the electrician to repair","had the electrician repair"],"answer":"had the electrician repair","answerIndex":3,"tags":["half-fix","meaning change","new error","KEY"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): Two repairs are needed. 'Yesterday' demands the past tense 'had', and the causative 'have' (getting someone to do something) takes the bare infinitive: 'had the electrician repair the inverter.'\nIncorrect (a): half-fix — corrects the tense to 'had' but keeps the '-ing' form, which the causative does not take here.\nIncorrect (b): meaning change — grammatical, but 'the electrician who repaired' turns the causative into a relative clause and leaves the sentence without a main action for Meera.\nIncorrect (c): new error — fixes the tense but introduces 'to repair'; causative 'have' never takes the to-infinitive.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: key is the only zero-error replacement; causative bare-infinitive rule checked."},{"id":"IPMAT_VARC_074","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"This year the engineering college admitted [[less students then]] it did in the previous academic session.","options":["fewer students than","less students than","lesser students than","fewer students then"],"answer":"fewer students than","answerIndex":0,"tags":["KEY","half-fix","new error","half-fix"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (a)\nCorrect (a): The span has two errors. 'Students' are countable, so the comparative must be 'fewer', not 'less'; and the comparison word is 'than', not the time word 'then'. Option (a) fixes both.\nIncorrect (b): half-fix — corrects 'then' to 'than' but keeps 'less' with a countable noun.\nIncorrect (c): new error — corrects 'then' but introduces 'lesser', which means lower in importance or degree ('the lesser evil') and is not used for counting.\nIncorrect (d): half-fix — corrects 'less' to 'fewer' but keeps the wrong word 'then'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: key is the only zero-error replacement; near-verbatim original retained as option (b)."},{"id":"IPMAT_VARC_075","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"The dean insisted that Ravi [[apologizes with the librarian]] for the damaged manuscripts.","options":["apologizes to the librarian","apologize to the librarian","apologized to the librarian","apologize with the librarian"],"answer":"apologize to the librarian","answerIndex":1,"tags":["half-fix","KEY","new error","half-fix"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): After 'insisted that', the verb takes the subjunctive — the bare form 'apologize', with no -s; and one apologizes 'to' a person, not 'with'. Option (b) repairs both faults.\nIncorrect (a): half-fix — corrects the preposition to 'to' but keeps the indicative 'apologizes', which the subjunctive after 'insisted that' does not allow.\nIncorrect (c): new error — corrects the preposition but shifts to the past 'apologized'; the demand clause needs the bare subjunctive, not a tensed verb.\nIncorrect (d): half-fix — adopts the correct subjunctive form but keeps the wrong preposition 'with'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: key is the only zero-error replacement; subjunctive-after-insist pattern matches the recurring Indore list."},{"id":"IPMAT_VARC_076","section":"VA","format":"Paragraph completion (blank middle)","kind":"mcq","passage":"In 2023 the United Nations declared the International Year of Millets, a campaign India had lobbied for and quickly branded 'Shree Anna'. Millets need far less water than rice or wheat and tolerate poor soils, which makes them attractive as the monsoon grows erratic. ___ Procurement remains skewed towards rice and wheat, whose assured prices give farmers little reason to switch. Until that incentive structure changes, the grain's revival will remain largely ceremonial.","stem":"From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.","options":["Meanwhile, India's dairy cooperatives have shown how farmer collectives can transform an entire sector.","Millets are also rich in fibre and micronutrients, which has made them fashionable among urban consumers.","Yet enthusiasm at summits has not translated into the mandis, where policy still works against the crop.","In most states, government procurement has in fact shifted decisively towards millets."],"answer":"Yet enthusiasm at summits has not translated into the mandis, where policy still works against the crop.","answerIndex":2,"tags":["off-topic insertion","wrong focus","KEY","stance contradiction"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nThe paragraph moves from international celebration of millets to the ground reality that farmers have no price incentive to grow them. The blank must carry that turn.\nCorrect (c): 'Yet' supplies the contrast the argument needs, and 'policy still works against the crop' is exactly what the next sentence elaborates — procurement skewed towards rice and wheat. The closing sentence's 'that incentive structure' also refers back to it.\nIncorrect (a): off-topic — dairy cooperatives are never raised in the paragraph.\nIncorrect (b): right topic, wrong focus — nutrition is true of millets but the paragraph's pivot is policy and prices, not consumer appeal.\nIncorrect (d): contradicts the stance — the very next sentence says procurement remains skewed away from millets.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: connector-referent fit checked against both neighbours; single-fault audit per distractor"},{"id":"IPMAT_VARC_077","section":"VA","format":"Paragraph completion (blank opening)","kind":"mcq","passage":"___ Nearly all intercontinental internet traffic travels not through satellites but through roughly 600 fibre-optic cables lying on the ocean floor. A single ship dragging its anchor can sever one, as happened repeatedly in the Baltic Sea and the Red Sea last year. Repairs require specialised vessels, of which fewer than sixty exist worldwide, and can take weeks. Governments that treat data as critical infrastructure have begun to ask why its physical backbone remains so exposed.","stem":"From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.","options":["The internet feels ethereal, but it depends on hardware that is surprisingly easy to break.","Decades of redundancy planning have made the world's data networks virtually impossible to disrupt.","Cybersecurity breaches now cost the global economy trillions of dollars every year.","Laying a new undersea cable is an engineering feat that can cost several hundred million dollars."],"answer":"The internet feels ethereal, but it depends on hardware that is surprisingly easy to break.","answerIndex":0,"tags":["KEY","stance contradiction","off-topic insertion","wrong focus"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nThe paragraph's arc is: physical cables carry the internet; they are easily damaged; repairs are slow; governments are worried about exposure. The opening sentence must introduce that fragility thesis with a full noun phrase.\nCorrect (a): it names the subject (the internet's physical hardware) and states the claim — 'surprisingly easy to break' — that every following sentence supports, from anchor damage to scarce repair ships.\nIncorrect (b): contradicts the stance — the whole paragraph demonstrates that the networks can be and are disrupted.\nIncorrect (c): off-topic — hacking and its costs are never mentioned; the paragraph is about physical damage.\nIncorrect (d): right topic, wrong focus — construction cost is true of cables but sets up nothing about vulnerability or repair delays.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: opener licenses every subsequent sentence; single-fault audit per distractor"},{"id":"IPMAT_VARC_078","section":"VA","format":"Paragraph completion (blank closing)","kind":"mcq","passage":"Fewer than 150 Great Indian Bustards survive, most of them in Rajasthan's Thar desert, where overhead power lines from solar farms have become their leading killer. Conservationists have responded with a captive-breeding centre at Sudasari, which has hatched more than forty chicks in three years. Breeding, however, is the easier half of the task. Birds raised in enclosures must eventually be released into the same landscape of wires that decimated their parents. ___","stem":"From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.","options":["The bustard was once a serious contender to be named India's national bird.","Unless the lines are moved underground, the programme risks restocking a habitat that remains a trap.","India's tiger reserves, by contrast, have doubled their populations through community-managed tourism.","Fortunately, transmission wires pose little danger to large birds once they learn to avoid them."],"answer":"Unless the lines are moved underground, the programme risks restocking a habitat that remains a trap.","answerIndex":1,"tags":["wrong focus","KEY","off-topic insertion","stance contradiction"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nThe paragraph builds a tension: breeding succeeds, but released birds face the same lethal wires. The closing sentence must draw the conclusion that tension licenses.\nCorrect (b): 'the lines' and 'the programme' pick up the paragraph's two threads — power lines and captive breeding — and state the only conclusion the previous sentence permits: release into an unchanged habitat undoes the breeding gains.\nIncorrect (a): right topic, wrong focus — a true fact about the bustard, but it answers nothing about the release problem the paragraph has just posed.\nIncorrect (c): off-topic — tigers and tourism are never raised.\nIncorrect (d): contradicts the stance — the opening sentence establishes the wires as the species' leading killer.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: conclusion licensed by preceding sentence pair; single-fault audit per distractor"},{"id":"IPMAT_VARC_079","section":"VA","format":"Paragraph completion (blank middle)","kind":"mcq","passage":"From January 2026 the European Union's carbon border levy began taxing imports of steel, cement and aluminium according to the emissions produced in making them. Indian steelmakers, whose coal-fired plants emit more per tonne than European mills, ship almost a fifth of their exports to the EU. ___ Smaller producers, who lack the capital for such upgrades, may simply abandon the European market. Either way, the levy is doing what a decade of climate summits could not: putting a price on Indian carbon.","stem":"From the choices given below, choose the sentence that is most logically appropriate to complete the paragraph.","options":["Indian exporters, however, are exempt from the levy under a bilateral trade agreement.","The EU has also tightened its data-privacy rules, which affect Indian IT firms.","Steel remains one of the hardest industries in the world to decarbonise fully.","The largest of them have therefore announced green-hydrogen and scrap-based projects to bring their footprints below the taxable threshold."],"answer":"The largest of them have therefore announced green-hydrogen and scrap-based projects to bring their footprints below the taxable threshold.","answerIndex":3,"tags":["stance contradiction","off-topic insertion","wrong focus","KEY"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nThe paragraph contrasts how large and small Indian steelmakers respond to the EU levy. The blank must supply the large-producer half of that contrast.\nCorrect (d): 'the largest of them' picks up 'Indian steelmakers' from the previous sentence, and the next sentence's 'such upgrades' refers directly to the green-hydrogen and scrap projects — without (d), that referent dangles.\nIncorrect (a): contradicts the stance — the closing sentence says the levy is pricing Indian carbon, which an exemption would make impossible.\nIncorrect (b): off-topic — data privacy and IT firms are never part of this paragraph.\nIncorrect (c): right topic, wrong focus — true about steel, but it neither continues the exporters' story nor gives 'such upgrades' anything to refer to.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: forward referent 'such upgrades' resolves only via key; single-fault audit per distractor"},{"id":"IPMAT_VARC_080","section":"VA","format":"Cloze 3-blank","kind":"mcq","passage":null,"stem":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nMicroplastics are now so ___(i) in the food chain that they have been detected in human blood; researchers warn that these particles may ___(ii) cellular function and, over decades, ___(iii) chronic inflammatory conditions.","options":["pervasive; enhance; trigger","ubiquitous; disrupt; precipitate","sporadic; impair; aggravate","ubiquitous; compromise; dissolve"],"answer":"ubiquitous; disrupt; precipitate","answerIndex":1,"tags":["polarity flip","KEY","polarity flip","collocation break"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): 'ubiquitous' matches 'so ___ that they have been detected in human blood' (everywhere); 'disrupt cellular function' and 'precipitate chronic conditions' are standard scientific collocations, and both carry the negative sense the warning demands.\nIncorrect (a): 'pervasive' and 'trigger' fit, but 'enhance cellular function' is a positive effect where harm is meant — polarity flip.\nIncorrect (c): 'impair' and 'aggravate' fit, but 'sporadic' contradicts the everywhere-in-the-food-chain claim — polarity flip.\nIncorrect (d): 'ubiquitous' and 'compromise' fit, but 'dissolve chronic inflammatory conditions' does not collocate — conditions are caused or worsened, not dissolved — collocation break.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: one killer per set (positions ii, i, iii); plausible words in each distractor cross-checked as genuine near-synonyms of the key"},{"id":"IPMAT_VARC_081","section":"VA","format":"Cloze 2-blank","kind":"mcq","passage":null,"stem":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nProlonged courses of antibiotics can ___(i) the gut's microbial diversity, and a growing body of research suggests, worryingly, that this loss may ___(ii) susceptibility to allergies in early childhood.","options":["enrich; heighten","curtail; manufacture","deplete; heighten","diminish; blunt"],"answer":"deplete; heighten","answerIndex":2,"tags":["polarity flip","collocation break","KEY","polarity flip"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): antibiotics reduce microbial diversity, so 'deplete' fits blank (i), and 'this loss' — flagged as worrying — must 'heighten' susceptibility to allergies.\nIncorrect (a): 'heighten' fits, but 'enrich' says antibiotics improve diversity, the opposite of what 'this loss' then refers to — polarity flip.\nIncorrect (b): 'curtail' fits, but 'manufacture susceptibility' does not collocate; susceptibility is raised or increased, not manufactured — collocation break.\nIncorrect (d): 'diminish' fits, but 'blunt susceptibility' means reduce it, which contradicts 'worryingly' — polarity flip.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: one killer per set (positions i, ii, ii); 'worryingly' added to make polarity of blank (ii) uniquely determinable"},{"id":"IPMAT_VARC_082","section":"VA","format":"Cloze 3-blank","kind":"mcq","passage":null,"stem":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nMarine biologists describe the latest bleaching event as ___(i): reefs that took millennia to accrete have been ___(ii) within a single decade, and even the most ___(iii) restoration projects can replant only a few hectares a year.","options":["unprecedented; degraded; assiduous","negligible; ravaged; painstaking","unparalleled; embellished; meticulous","calamitous; degraded; arboreal"],"answer":"unprecedented; degraded; assiduous","answerIndex":0,"tags":["KEY","polarity flip","polarity flip","category error"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): 'unprecedented' fits the scale the colon then justifies; ancient reefs 'degraded' within a decade carries the required sense of damage; 'assiduous' (diligent, unremitting) is exactly the quality of restoration projects that still manage only a few hectares.\nIncorrect (b): 'ravaged' and 'painstaking' fit, but 'negligible' calls the event trivial while the sentence describes catastrophe — polarity flip.\nIncorrect (c): 'unparalleled' and 'meticulous' fit, but 'embellished' means adorned or improved, the opposite of what bleaching does to reefs — polarity flip.\nIncorrect (d): 'calamitous' and 'degraded' fit, but 'arboreal' means tree-dwelling — the wrong category entirely for marine restoration — category error.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: one killer per set (positions i, ii, iii — all three positions covered)"},{"id":"IPMAT_VARC_083","section":"VA","format":"Cloze 2-blank","kind":"mcq","passage":null,"stem":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nIndia's new labour codes ___(i) platform companies to contribute towards gig workers' social security, though critics argue the provisions are too ___(ii) worded to be enforceable.","options":["exempt; vaguely","compel; rigorously","require; ornately","oblige; loosely"],"answer":"oblige; loosely","answerIndex":3,"tags":["polarity flip","polarity flip","collocation break","KEY"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): the codes 'oblige' companies to contribute — the standard legal collocation — and provisions 'too loosely worded to be enforceable' is the precise idiom for the critics' complaint.\nIncorrect (a): 'vaguely' fits blank (ii), but 'exempt... to contribute' reverses the law's effect and breaks the construction — polarity flip.\nIncorrect (b): 'compel' fits, but 'too rigorously worded to be enforceable' is self-contradictory; rigorous wording is what makes provisions enforceable — polarity flip.\nIncorrect (c): 'require' fits, but 'ornately worded' belongs to decorative prose, not statutes; the collocation fails in this register — collocation break.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: one killer per set (positions i, ii, ii)"},{"id":"IPMAT_VARC_084","section":"VA","format":"Cloze 3-blank","kind":"mcq","passage":null,"stem":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nNeurologists now regard sleep not as a ___(i) state but as a period of intense housekeeping, during which the brain ___(ii) metabolic waste and ___(iii) the day's memories into long-term storage.","options":["dormant; accumulates; consolidates","quiescent; flushes; consolidates","torpid; clears; fragments","vigilant; expels; transcribes"],"answer":"quiescent; flushes; consolidates","answerIndex":1,"tags":["polarity flip","KEY","polarity flip","polarity flip"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): the contrast 'not as a ___ state but as intense housekeeping' needs a word for inactivity — 'quiescent'; the brain 'flushes' metabolic waste and 'consolidates' memories into long-term storage, both standard neuroscience collocations.\nIncorrect (a): 'dormant' and 'consolidates' fit, but 'accumulates metabolic waste' is what happens while awake — the housekeeping image requires removal — polarity flip.\nIncorrect (c): 'torpid' and 'clears' fit, but 'fragments the day's memories into long-term storage' says sleep breaks memories apart rather than fixing them — polarity flip.\nIncorrect (d): 'expels' and 'transcribes' pass, but 'vigilant' is an alert state — it destroys the sentence's contrast with activity — polarity flip.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: one killer per set (positions ii, iii, i — all three positions covered)"},{"id":"IPMAT_VARC_085","section":"VA","format":"Cloze 2-blank","kind":"mcq","passage":null,"stem":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.\nThe jury praised the translator for her ___(i) ear, noting that she had managed to ___(ii) the novel's colloquial cadences without flattening them into standard English.","options":["discriminating; obliterate","tin; retain","discerning; preserve","perceptive; conserving"],"answer":"discerning; preserve","answerIndex":2,"tags":["polarity flip","polarity flip","KEY","category error"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): a 'discerning ear' is the fixed phrase for fine linguistic judgement, and 'preserve the cadences without flattening them' completes the praise coherently.\nIncorrect (a): 'discriminating ear' is a genuine expression, but a jury praising her would not say she managed to 'obliterate' the cadences she was protecting — polarity flip.\nIncorrect (b): 'retain' fits, but a 'tin ear' is a real idiom meaning a bad ear for language — the opposite of the compliment intended — polarity flip.\nIncorrect (d): 'perceptive' fits, but 'managed to conserving' puts the -ing form where the infinitive requires the base verb — a part-of-speech error, not a meaning choice.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: one killer per set (positions ii, i, ii); 'tin ear' distractor is a real expression with the wrong polarity, per spec"},{"id":"IPMAT_VARC_086","section":"VA","format":"Parajumble TITA","kind":"tita","passage":"1. Investors, seduced by that vision, poured billions into start-ups promising lettuce grown metres from the consumer.\n2. That mismatch has driven several of the industry's best-funded firms into bankruptcy since 2023.\n3. Vertical farms, which stack crops in climate-controlled towers, were promoted a decade ago as the future of urban food.\n4. But the arithmetic behind those bets has proved stubborn: the electricity needed to replace sunlight costs more than the land it saves.","stem":"The sentences given above, when arranged in the proper order, form a coherent paragraph. Type the correct sequence of sentence numbers as your answer (a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid).","options":[],"answer":"3142","answerIndex":null,"tags":[],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 3142\nSentence 3 opens: it introduces vertical farms with a full noun phrase and a definition, and contains no back-reference.\nSentence 1 follows: 'that vision' can only refer to the future-of-urban-food promotion in 3.\nSentence 4 comes third: 'But' cannot open a paragraph, and 'those bets' needs the billions invested in 1 as its antecedent.\nSentence 2 closes: 'That mismatch' refers to the cost arithmetic stated in 4, and the bankruptcies are the paragraph's final outcome.\nNo other order survives: 4 before 1 leaves 'those bets' without a referent, and 1 before 3 leaves 'that vision' without one.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"G1: uniqueness verified — referent chain vision(3)→bets(1)→arithmetic(4)→mismatch(2) blocks every alternative order"},{"id":"IPMAT_VARC_087","section":"VA","format":"Parajumble TITA","kind":"tita","passage":"1. Yet within decades it had vanished so completely that even historians forgot it existed.\n2. The Great Hedge of India was a living barrier of thorn trees that the British grew across the subcontinent in the nineteenth century.\n3. A British researcher rediscovered its traces only in the 1990s, after a chance mention in an old memoir sent him hunting through survey maps.\n4. Its purpose was fiscal, not military: to stop smugglers evading the colonial tax on salt.\n5. That enforcement effort grew until, at its peak, the barrier ran for more than 2,500 kilometres and was patrolled by some 12,000 men.","stem":"The sentences given above, when arranged in the proper order, form a coherent paragraph. Type the correct sequence of sentence numbers as your answer (a response such as 34125 is valid; 34125. or 3 4 1 2 5 are invalid).","options":[],"answer":"24513","answ

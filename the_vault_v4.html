<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault · Camp Verbal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1220;--panel:#101C30;--panel2:#152438;
  --gold:#C9A227;--gold-hi:#E8C55B;--crimson:#8E2A35;--crimson-deep:#5E1B23;
  --parchment:#F2EAD8;--muted:#8FA0B8;--good:#4EA082;--bad:#C05252;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{background:#0A1220}
body{background:radial-gradient(1200px 800px at 50% -10%,#142440 0%,var(--ink) 55%);background-color:var(--ink);color:var(--parchment);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;padding:20px 16px 48px}
.screen.on{display:flex}
.topbar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.back{color:var(--muted);text-decoration:none;font-size:.85rem;padding:6px 0}
.back:hover{color:var(--gold-hi)}
.brand{font-family:'Fraunces',serif;font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);opacity:.85}
h1,h2{font-family:'Fraunces',serif;font-weight:600}
.previewbar{display:none;width:100%;max-width:560px;background:rgba(142,42,53,.25);border:1px dashed #d98a94;color:#f0c4ca;border-radius:10px;padding:8px 12px;font-size:.8rem;text-align:center;margin-bottom:8px}
body.preview .previewbar{display:block}

/* streak */
.streakbar{display:flex;align-items:center;gap:10px;margin-top:10px;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.25);border-radius:999px;padding:8px 18px}
.streakbar b{color:var(--gold-hi);font-size:1.05rem}
.streakbar span{color:var(--muted);font-size:.85rem}

/* vault */
#vaultScreen{text-align:center;gap:8px}
.daylabel{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;margin-top:22px}
.daytitle{font-size:clamp(1.9rem,6vw,2.6rem);margin:4px 0 26px}
.daytitle em{color:var(--gold-hi);font-style:normal}
.vault{--size:min(64vw,280px);width:var(--size);height:var(--size);border-radius:50%;position:relative;cursor:pointer;border:none;
  background:radial-gradient(circle at 38% 32%,#22344f 0%,#0e1a2c 62%,#08101d 100%);
  box-shadow:0 0 0 6px #0c1626,0 0 0 8px rgba(201,162,39,.55),0 24px 60px rgba(0,0,0,.6),inset 0 2px 14px rgba(232,197,91,.12);transition:transform .25s ease}
.vault:hover{transform:scale(1.02)}
.vault:focus-visible{outline:3px solid var(--gold-hi);outline-offset:6px}
.vault::before{content:"";position:absolute;inset:11%;border-radius:50%;border:2px solid rgba(201,162,39,.7);box-shadow:inset 0 0 24px rgba(0,0,0,.55)}
.rivet{position:absolute;width:9px;height:9px;border-radius:50%;background:linear-gradient(145deg,var(--gold-hi),#8a6d14);top:50%;left:50%;transform:rotate(var(--a)) translateY(calc(var(--size)/-2 + 15px))}
.handle{position:absolute;inset:31%;border-radius:50%;border:5px solid var(--gold);background:radial-gradient(circle at 40% 35%,#1b2c46,#0a1424 70%);transition:transform 1.1s cubic-bezier(.6,.05,.2,1);box-shadow:0 4px 18px rgba(0,0,0,.5)}
.spoke{position:absolute;top:50%;left:50%;width:8px;height:calc(50% + 14px);background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-radius:4px;transform-origin:top center;transform:translate(-50%,0) rotate(var(--a))}
.hub{position:absolute;top:50%;left:50%;width:26%;height:26%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 38% 32%,var(--gold-hi),#8a6d14 75%)}
.vault.opening .handle{transform:rotate(540deg)}
.vault.opening{animation:doorOpen .9s ease .95s forwards}
@keyframes doorOpen{to{transform:perspective(900px) rotateY(-84deg) translateX(-16%);opacity:0}}
.hint{color:var(--muted);font-size:.9rem;margin-top:24px;max-width:340px;line-height:1.5}
.hint b{color:var(--gold-hi);font-weight:500}
.glow{position:absolute;inset:-14%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(232,197,91,.14),transparent 60%);animation:pulse 3s ease infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* deck */
#deckScreen{gap:10px}
.deckhead{text-align:center;margin-top:4px}
.deckhead h2{font-size:1.6rem}
.deckhead p{color:var(--muted);font-size:.9rem;margin-top:4px}
.progress{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap;justify-content:center}
.pip{width:24px;height:6px;border-radius:3px;background:rgba(143,160,184,.25)}
.pip.ok{background:var(--good)}.pip.no{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:540px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;border-radius:14px;padding:20px 10px 16px;cursor:pointer;text-align:center;
  background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid rgba(201,162,39,.28);color:var(--parchment);font-family:'DM Sans',sans-serif;
  transition:transform .22s ease,box-shadow .22s ease;animation:dealIn .5s ease backwards}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.45)}
.card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
@keyframes dealIn{from{transform:translateY(26px) scale(.9);opacity:0}}
.card .icon{font-size:1.6rem;display:block;margin-bottom:6px}
.card .label{font-family:'Fraunces',serif;font-size:1rem}
.card .kind{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.card.idiom{border-color:rgba(142,42,53,.85);background:linear-gradient(165deg,#2a1520,#170c12)}
.card.idiom .kind{color:#d98a94}
.card.review{border-style:dashed;border-color:rgba(78,160,130,.7)}
.card.review .kind{color:#8fd3b8}
.card.played{opacity:.55;cursor:default;transform:none}
.card .mark{position:absolute;top:8px;right:10px;font-size:1rem}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}

/* play overlay */
#play{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,10,18,.86);backdrop-filter:blur(6px);z-index:50;padding:14px}
#play.on{display:flex}
.stage{position:relative;width:100%;max-width:560px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid rgba(201,162,39,.35);animation:stageIn .35s ease;max-height:92vh;overflow-y:auto}
@keyframes stageIn{from{transform:scale(.94);opacity:0}}
.stage.idiomStage{border-color:rgba(142,42,53,.7)}
.curtain{position:absolute;top:0;height:100%;min-height:100%;width:52%;z-index:6;background:repeating-linear-gradient(90deg,var(--crimson) 0 26px,var(--crimson-deep) 26px 44px);box-shadow:inset 0 -30px 50px rgba(0,0,0,.5);transition:transform 1.1s cubic-bezier(.65,.02,.25,1);pointer-events:none}
.curtain.L{left:0;border-right:6px solid var(--gold)}
.curtain.R{right:0;border-left:6px solid var(--gold)}
.idiomStage.open .curtain.L{transform:translateX(-103%)}
.idiomStage.open .curtain.R{transform:translateX(103%)}
.pediment{height:10px;background:linear-gradient(90deg,var(--gold),var(--gold-hi),var(--gold));position:relative;z-index:7}
.inner{padding:22px 20px 24px}
.qkind{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.qkind .rv{color:#8fd3b8}
.idiomStage .qkind{color:#d98a94}
.bigword{font-family:'Fraunces',serif;font-size:clamp(1.5rem,5.4vw,2.1rem);margin-bottom:2px}
.pos{color:var(--muted);font-style:italic;font-size:.85rem;margin-bottom:14px}
.qtext{font-size:1.02rem;line-height:1.55;margin:4px 0 16px}
.qtext b{color:var(--gold-hi);font-weight:600}
.blank{display:inline-block;min-width:74px;border-bottom:2px solid var(--gold);margin:0 3px;transform:translateY(-3px)}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:12px 14px;border-radius:11px;font-size:.95rem;line-height:1.4;cursor:pointer;background:rgba(255,255,255,.045);border:1px solid rgba(143,160,184,.28);color:var(--parchment);font-family:'DM Sans',sans-serif;transition:border-color .15s,background .15s,transform .15s;display:flex;gap:10px}
.opt .l{color:var(--muted);font-weight:700;flex:none}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.opt:focus-visible{outline:2px solid var(--gold-hi)}
.opt.right{background:rgba(78,160,130,.18);border-color:var(--good)}
.opt.wrong{background:rgba(192,82,82,.16);border-color:var(--bad);animation:wob .35s ease}
@keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt:disabled{cursor:default}
.opts.locked .opt{pointer-events:none}

/* reveal */
.reveal{display:none;margin-top:18px;border-top:1px dashed rgba(201,162,39,.4);padding-top:16px;animation:rise .45s ease}
.reveal.on{display:block}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.verdict{font-family:'Fraunces',serif;font-size:1.15rem;margin-bottom:10px}
.verdict.g{color:var(--good)}.verdict.b{color:var(--bad)}
.reveal p{font-size:.92rem;line-height:1.55;color:#D8DEE9;margin-bottom:10px}
.reveal p b{color:var(--gold-hi)}
.tag{display:inline-block;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,162,39,.4);border-radius:999px;padding:3px 10px;margin-bottom:7px}
.backnote{font-size:.8rem!important;color:#8fd3b8!important}
.scene{height:110px;border-radius:12px;margin:6px 0 8px;position:relative;overflow:hidden;background:radial-gradient(300px 120px at 50% 110%,#23384f,#0b1526 80%);border:1px solid rgba(201,162,39,.2);display:flex;align-items:center;justify-content:center;gap:14px}
.scene .floor{position:absolute;bottom:0;left:0;right:0;height:14px;background:linear-gradient(180deg,rgba(201,162,39,.25),rgba(201,162,39,.05))}
.si{font-size:1.9rem;display:inline-block;animation-duration:1.6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.si.fall{animation-name:fall;animation-timing-function:linear}
@keyframes fall{0%{transform:translateY(-90px);opacity:0}15%{opacity:1}100%{transform:translateY(70px);opacity:0}}
.si.pop{animation-name:pop}@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.si.shake{animation-name:shk}@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.si.flicker{animation-name:flk;animation-duration:1s}@keyframes flk{0%,100%{opacity:1}50%{opacity:.35}}
.si.floaty{animation-name:flo;animation-duration:2.4s}@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.si.spin{animation-name:spn;animation-duration:2.6s;animation-timing-function:linear}@keyframes spn{to{transform:rotate(360deg)}}
.scenecap{font-size:.8rem;color:var(--muted);text-align:center;margin:0 0 14px;font-style:italic}
.nextbtn{margin-top:14px;width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;background:linear-gradient(120deg,var(--gold),var(--gold-hi));color:#231a04;font-weight:700;font-size:.95rem;font-family:'DM Sans',sans-serif;text-decoration:none;display:block;text-align:center}
.nextbtn:hover{filter:brightness(1.07)}
.ghostbtn{margin-top:10px;width:100%;padding:12px;border-radius:11px;cursor:pointer;background:transparent;border:1px solid rgba(201,162,39,.45);color:var(--gold-hi);font-size:.9rem;font-family:'DM Sans',sans-serif;text-decoration:none;display:block;text-align:center}

/* done */
#doneScreen{text-align:center}
.scorering{width:150px;height:150px;border-radius:50%;margin:22px auto 10px;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(143,160,184,.18) 0)}
.scorering .inner2{width:122px;height:122px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}
.scorering b{font-family:'Fraunces',serif;font-size:2rem;color:var(--gold-hi)}
.scorering span{font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.chain{font-size:1.5rem;margin:10px 0 4px;letter-spacing:4px}
.donemsg{color:var(--muted);max-width:340px;margin:8px auto 18px;font-size:.92rem;line-height:1.5}
.recap{width:100%;max-width:420px;text-align:left;margin:0 auto 8px;display:grid;gap:6px}
.recap div{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(143,160,184,.18);border-radius:9px;padding:9px 12px;font-size:.9rem}
.recap .r{color:#8fd3b8;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.recap .ok{color:var(--good)}.recap .no{color:var(--bad)}
.donebtns{width:100%;max-width:320px;margin:10px auto 0}
.confetti{position:fixed;top:-14px;font-size:1rem;z-index:99;animation:cfall linear forwards;pointer-events:none}
@keyframes cfall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="vaultScreen" class="screen on">
  <div class="topbar"><a class="back" href="index.html">← Road to IIM</a><span class="brand">Camp Verbal</span></div>
  <div class="previewbar" id="pvbar"></div>
  <div class="streakbar"><span>🔥</span><b id="streakN">0</b><span>day streak</span></div>
  <div class="daylabel" id="dateLine">Loading today's drop…</div>
  <h1 class="daytitle">The <em>Vault</em></h1>
  <button class="vault" id="vaultBtn" aria-label="Unlock today's vault">
    <div class="glow"></div>
    <span class="rivet" style="--a:0deg"></span><span class="rivet" style="--a:45deg"></span>
    <span class="rivet" style="--a:90deg"></span><span class="rivet" style="--a:135deg"></span>
    <span class="rivet" style="--a:180deg"></span><span class="rivet" style="--a:225deg"></span>
    <span class="rivet" style="--a:270deg"></span><span class="rivet" style="--a:315deg"></span>
    <div class="handle">
      <span class="spoke" style="--a:0deg"></span><span class="spoke" style="--a:90deg"></span>
      <span class="spoke" style="--a:180deg"></span><span class="spoke" style="--a:270deg"></span>
      <div class="hub"></div>
    </div>
  </button>
  <div class="hint" id="hint">Tap the vault to unlock today's drop.</div>
</section>

<section id="deckScreen" class="screen">
  <div class="topbar"><a class="back" href="index.html">← Road to IIM</a><span class="brand">The Vault</span></div>
  <div class="previewbar" id="pvbar2"></div>
  <div class="deckhead">
    <h2>Today's Drop</h2>
    <p id="deckSub">Clear every card to bank your streak.</p>
  </div>
  <div class="progress" id="pips"></div>
  <div class="grid" id="grid"></div>
</section>

<div id="play" role="dialog" aria-modal="true"><div class="stage" id="stage"></div></div>

<section id="doneScreen" class="screen">
  <div class="topbar"><a class="back" href="index.html">← Road to IIM</a><span class="brand">The Vault</span></div>
  <h2 style="margin-top:22px">Vault Cleared</h2>
  <div class="scorering" id="ring"><div class="inner2"><b id="scoreTxt">0/7</b><span>today</span></div></div>
  <div class="chain" id="chainTxt"></div>
  <p class="donemsg" id="doneMsg"></p>
  <div class="recap" id="recap"></div>
  <div class="donebtns" id="doneBtns"></div>
</section>

<script>
/* ===== The Vault v4 (pilot) · engine. Content: vault_v4_content.json =====
   - Drop number counts from content.launch (a fixed date), so adding days never reshuffles the cycle.
   - Each item has 2 cards: card 0 is shown on its day; a missed item returns the next day as a review card in the OTHER format.
   - Progress for the day is saved, so refresh resumes and a cleared day stays cleared.
   - ?day=N previews drop N without touching streak, progress or review data. */
const CONTENT_URL="vault_v4_content.json", KEY="cv_vault4", MAX_REVIEW=2;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FMT={usage:"Right usage",confusable:"Look-alikes",context:"Fill the gap",reverse:"Name the word","idiom-context":"Idiom in context","idiom-pick":"Pick the idiom"};

const params=new URLSearchParams(location.search);
const PREVIEW=params.has("day");
if(PREVIEW)document.body.classList.add("preview");

/* ---- storage (falls back to memory when blocked) ---- */
const mem={};
function load(){ if(PREVIEW)return mem.s||(mem.s=blank());
  try{const v=JSON.parse(localStorage.getItem(KEY)||"null");return v&&v.v===4?v:blank()}catch(e){return mem.s||(mem.s=blank())} }
function save(){ if(PREVIEW){mem.s=S;return} try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem.s=S} }
function blank(){return{v:4,streak:0,last:null,review:{},today:null}}

/* ---- dates (device-local, i.e. IST for students in India) ---- */
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const NOW=new Date(), TODAY=dkey(NOW), YESTERDAY=dkey(addDays(NOW,-1)), TOMORROW=dkey(addDays(NOW,1));

let S=load(), DATA=null, ITEMS={}, T=null, current=-1;

function shownStreak(){return (S.last===TODAY||S.last===YESTERDAY)?S.streak:0}
$("streakN").textContent=shownStreak();

fetch(CONTENT_URL,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init).catch(()=>{
  $("dateLine").textContent="Couldn't load today's drop.";
  $("hint").textContent="Check your connection and refresh. (The vault loads its content only when hosted, not from a double-clicked file.)";
});

function init(data){
  DATA=data;
  data.days.forEach((d,di)=>[...d.words.map(x=>({...x,t:"w"})),...d.idioms.map(x=>({...x,t:"i"}))].forEach(x=>{x.day=di;ITEMS[x.id]=x}));
  const n=data.days.length;
  let idx;
  if(PREVIEW){idx=Math.min(Math.max(parseInt(params.get("day"),10)||1,1),n)-1}
  else{const [y,m,d]=data.launch.split("-").map(Number);
    const diff=Math.round((new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate())-new Date(y,m-1,d))/864e5);
    idx=((Math.max(diff,0)%n)+n)%n}
  if(PREVIEW){const t="Preview · Drop "+(idx+1)+" of "+n+" · nothing is saved";$("pvbar").textContent=t;$("pvbar2").textContent=t}
  if(!S.today||S.today.key!==TODAY||S.today.drop!==idx+1||PREVIEW&&S.today.preview!==idx){S.today=buildDeck(idx);if(PREVIEW)S.today.preview=idx;save()}
  T=S.today;
  $("dateLine").textContent=NOW.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})+" · Drop "+(idx+1)+" of "+n;
  const nr=T.cards.filter(c=>c.review).length;
  $("hint").innerHTML=T.done?"You've cleared today's vault. Tap to see your results."
    :"Tap the vault to unlock today's drop: <b>5 words · 2 idioms</b>"+(nr?" · <b>"+nr+" review</b>":"")+".<br>No definitions to spot. Every card makes you use the word.";
  if(!PREVIEW)pingOpen();
}

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}

function buildDeck(idx){
  const day=DATA.days[idx];
  const ids=[day.words[0],day.words[1],day.words[2],day.idioms[0],day.words[3],day.words[4],day.idioms[1]].map(x=>x.id);
  const cards=ids.map(id=>({id,ci:0,review:false}));
  const todaysIds=new Set(ids);
  const due=Object.entries(PREVIEW?{}:S.review).filter(([id,r])=>ITEMS[id]&&r.due<=TODAY&&!todaysIds.has(id))
    .sort((a,b)=>a[1].due<b[1].due?-1:1).slice(0,MAX_REVIEW)
    .map(([id,r])=>({id,ci:r.next%ITEMS[id].cards.length,review:true}));
  if(due[0])cards.splice(2,0,due[0]);
  if(due[1])cards.splice(6,0,due[1]);
  cards.forEach(c=>c.perm=shuffle([0,1,2,3]));
  return{key:TODAY,drop:idx+1,cards,results:cards.map(()=>null),done:false};
}

$("vaultBtn").addEventListener("click",function(){
  if(!T||this.classList.contains("opening"))return;
  if(T.done){showDone(false);return}
  this.classList.add("opening");
  setTimeout(()=>{show("deckScreen");renderDeck()},1900);
});

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
const itemName=it=>it.t==="i"?it.idiom:it.word;

function renderDeck(){
  $("pips").innerHTML=T.results.map(r=>`<div class="pip ${r===true?"ok":r===false?"no":""}"></div>`).join("");
  $("deckSub").textContent="Clear all "+T.cards.length+" cards to bank your streak.";
  const g=$("grid");g.innerHTML="";let nw=0,ni=0;
  T.cards.forEach((c,i)=>{
    const it=ITEMS[c.id],played=T.results[i]!==null;
    const b=document.createElement("button");
    b.className="card"+(it.t==="i"?" idiom":"")+(c.review?" review":"")+(played?" played":"");
    b.style.animationDelay=(i*0.06)+"s";
    const lab=c.review?"Review":(it.t==="i"?"Idiom "+(++ni):"Word "+(++nw));
    b.innerHTML=`<span class="icon">${c.review?"🔁":it.t==="i"?"🎭":"🗝️"}</span>
      <span class="label">${played?esc(itemName(it)):lab}</span>
      <span class="kind">${FMT[it.cards[c.ci].fmt]}</span>
      ${played?`<span class="mark ${T.results[i]?"ok":"no"}">${T.results[i]?"✓":"✗"}</span>`:""}`;
    if(!played)b.addEventListener("click",()=>openCard(i));
    g.appendChild(b);
  });
}

function qHTML(card,it){
  if(card.fmt==="usage")return `Which sentence uses <b>${esc(it.word)}</b> correctly?`;
  return esc(card.q).replace(/_{3,}/g,'<span class="blank"></span>');
}

function openCard(i){
  current=i;const c=T.cards[i],it=ITEMS[c.id],card=it.cards[c.ci],st=$("stage");
  const opts=c.perm.map((oi,j)=>`<button class="opt" data-oi="${oi}"><span class="l">${"ABCD"[j]}</span><span>${esc(card.o[oi])}</span></button>`).join("");
  const rv=c.review?`<span class="rv">🔁 Review</span>`:"";
  const head=(card.fmt==="usage")?`<div class="bigword">${esc(it.word)}</div><div class="pos">${esc(it.pos)}</div>`:"";
  if(it.t==="w"){
    st.className="stage";
    st.innerHTML=`<div class="pediment"></div><div class="inner">
      <div class="qkind"><span>🗝️ ${FMT[card.fmt]}</span>${rv}</div>${head}
      <p class="qtext">${qHTML(card,it)}</p>
      <div class="opts" id="opts">${opts}</div><div class="reveal" id="rev"></div></div>`;
  }else{
    st.className="stage idiomStage";
    st.innerHTML=`<div class="pediment"></div><div class="curtain L"></div><div class="curtain R"></div>
      <div class="inner"><div class="qkind"><span>🎭 ${FMT[card.fmt]}</span>${rv}</div>
      <p class="qtext">${qHTML(card,it)}</p>
      <div class="opts locked" id="opts">${opts}</div><div class="reveal" id="rev"></div></div>`;
    setTimeout(()=>st.classList.add("open"),300);
    setTimeout(()=>{const o=$("opts");if(o)o.classList.remove("locked")},1300);
  }
  st.scrollTop=0;
  st.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(b,+b.dataset.oi)));
  $("play").classList.add("on");
}

function answer(btn,oi){
  const c=T.cards[current];if(T.results[current]!==null)return;
  const it=ITEMS[c.id],card=it.cards[c.ci],ok=oi===card.a;
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.oi===card.a)o.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  T.results[current]=ok;
  /* review queue: a miss comes back tomorrow in the other format; a correct review clears it */
  if(!PREVIEW){
    if(!ok)S.review[c.id]={due:TOMORROW,next:(c.ci+1)%it.cards.length};
    else if(c.review)delete S.review[c.id];
  }
  save();
  const back=!ok?`<p class="backnote">🔁 This one comes back tomorrow in a different form.</p>`:(c.review?`<p class="backnote">🔁 Cleared from your review pile.</p>`:"");
  const verdict=`<div class="verdict ${ok?"g":"b"}">${ok?(it.t==="i"?"Standing ovation. 👏":"Cracked it."):(it.t==="i"?"The curtain falls, but now you know.":"Not quite. Locked in now.")}</div>`;
  const r=$("rev");
  if(it.t==="w"){
    r.innerHTML=verdict+`<span class="tag">The word</span><p><b>${esc(it.word)}</b> <i>(${esc(it.pos)})</i>: ${esc(it.meaning)}</p>
      <span class="tag">Why</span><p>${esc(card.why)}</p>
      <span class="tag">Synonyms</span><p>${esc(it.synonyms.join(" · "))}</p>
      <span class="tag">Root</span><p>${esc(it.note)}</p>${back}
      <button class="nextbtn" id="nxt">Return to the vault</button>`;
  }else{
    const items=it.scene.map(s=>`<span class="si ${esc(s[1])}" style="animation-delay:${+s[2]||0}s">${esc(s[0])}</span>`).join("");
    r.innerHTML=verdict+`<span class="tag">Picture it</span><div class="scene"><div class="floor"></div>${items}</div>
      <div class="scenecap">${esc(it.caption)}</div>
      <span class="tag">Meaning</span><p><b>${esc(it.idiom)}</b>: ${esc(it.meaning)}</p>
      <span class="tag">Why</span><p>${esc(card.why)}</p>
      <span class="tag">Origin</span><p>${esc(it.origin)}</p>${back}
      <button class="nextbtn" id="nxt">Return to the vault</button>`;
  }
  r.classList.add("on");
  $("nxt").addEventListener("click",closeCard);
  setTimeout(()=>r.scrollIntoView({behavior:"smooth",block:"start"}),120);
}

function closeCard(){
  $("play").classList.remove("on");
  if(T.results.every(r=>r!==null))finishDay();else{renderDeck();show("deckScreen")}
}

function finishDay(){
  if(!T.done&&!PREVIEW){
    if(S.last!==TODAY){S.streak=(S.last===YESTERDAY)?S.streak+1:1;S.last=TODAY}
  }
  T.done=true;save();
  showDone(true);
}

function showDone(fresh){
  const score=T.results.filter(Boolean).length,total=T.cards.length;
  const streak=PREVIEW?0:shownStreak();
  $("scoreTxt").textContent=score+"/"+total;
  $("ring").style.setProperty("--p",Math.round(score/total*100));
  $("chainTxt").textContent=streak?"🔥".repeat(Math.min(streak,10))+(streak>10?" +"+(streak-10):""):"";
  const missed=total-score;
  $("doneMsg").textContent=(score===total?"Perfect clear. ":score+" of "+total+" cracked. ")
    +(PREVIEW?"Preview mode: nothing was saved.":streak+"-day streak banked. "+(missed?"The "+(missed===1?"one you missed returns":missed+" you missed return")+" tomorrow in a new form. ":"")+"Next drop at midnight.");
  $("recap").innerHTML=T.cards.map((c,i)=>{const it=ITEMS[c.id];return `<div><span>${esc(itemName(it))}${c.review?' <span class="r">review</span>':""}</span><span class="${T.results[i]?"ok":"no"}">${T.results[i]?"✓":"✗"}</span></div>`}).join("");
  const nextPrev=PREVIEW&&T.drop<DATA.days.length?`<a class="ghostbtn" href="?day=${T.drop+1}">Preview drop ${T.drop+1} →</a>`:"";
  $("doneBtns").innerHTML=`<a class="nextbtn" href="index.html">Back to Road to IIM</a>${nextPrev}`;
  show("doneScreen");
  if(fresh)confetti(score===total?60:25);
}

function confetti(n){
  const glyphs=["✦","●","▮","✧"],cols=["#C9A227","#E8C55B","#F2EAD8","#8E2A35"];
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="confetti";d.textContent=glyphs[i%4];d.style.color=cols[i%4];
    d.style.left=Math.random()*100+"vw";d.style.animationDuration=(2.2+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*0.9)+"s";
    d.style.fontSize=(0.6+Math.random()*0.9)+"rem";document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
}

function pingOpen(){
  if(!/github\.io$/.test(location.hostname))return;
  /* RIIM usage ping v1 */try{fetch("https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec?action=ping&type=open&page="+encodeURIComponent(document.title||location.pathname),{mode:"no-cors"});}catch(_){}
}

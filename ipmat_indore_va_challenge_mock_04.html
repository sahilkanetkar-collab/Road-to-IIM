d the work arrives only if they were schooled and fed well enough to be worth hiring. Where the first condition holds and the others fail, the result is not a dividend but a queue: young men and women waiting, certificates in hand, for jobs that nobody created.\n\nThe alarmists are not entirely wrong. In the most crowded districts, schools still run in shifts, and a handful of clerical posts can draw applications by the sackful. But the cure they prescribed, fewer children, has been arriving on its own across much of the country, and in some states it has arrived early enough to raise the opposite fear: that the population will grow old before it grows prosperous.\n\nThat is what both camps miss. A young population is less an asset than a loan taken out against the future, and loans fall due. The workers of today are the pensioners of a few decades hence. If they spend their working years idle or underpaid, they will reach old age with little saved and fewer children to lean on, and the country will have paid interest on money it never spent. The question was never whether India has too many people or just enough. It is what the country does with the decades in which its workers outnumber its dependants by a wider margin than they ever will again.","stem":"When the writer says that both camps 'mistake a timetable for a verdict', the point is that they","options":["treat a passing phase as if it had settled the question for good.","act as though a deadline had already passed when it has not.","confuse the order in which things happen with a judgement of their worth.","judge too early, before all of the evidence has come in."],"answer":"treat a passing phase as if it had settled the question for good.","answerIndex":0,"tags":["KEY","word match","literal reading","half right"],"optionTags":[null,"rc-word-match","rc-literal","rc-half-right"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nExplanation: A timetable says when something happens; a verdict settles a question once and for all.\nCorrect (a): The writer later says the advantage lasts only for certain decades. Both camps turn that phase into a permanent judgement, burden or asset.\nLead distractor (d): A fair reading of 'verdict' on its own, but the complaint is not haste; it is that both sides ignore the clock.\nIncorrect (b): A timetable suggests deadlines, but the writer never says either camp thinks time has run out.\nIncorrect (c): It reads 'timetable' as a sequence of events; the writer's point is about how long the advantage lasts, not about order.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_005","section":"VA","format":"RC","kind":"mcq","passage":"For most of the last century, India argued about its population in the language of fear. Textbooks warned of an explosion; planners counted mouths to feed. Somewhere along the way the vocabulary flipped. The same young people are now called a dividend, and speeches that once treated them as a drain on the budget now present them as the country's richest asset. Both descriptions are offered with equal confidence, and both, I think, mistake a timetable for a verdict.\n\nDemographers say a country is in line for a dividend when the share of its people of working age grows faster than the share who depend on them: more hands to produce, fewer mouths competing for what is produced. But that arithmetic only opens a door. The gain arrives if those hands find work, and the work arrives only if they were schooled and fed well enough to be worth hiring. Where the first condition holds and the others fail, the result is not a dividend but a queue: young men and women waiting, certificates in hand, for jobs that nobody created.\n\nThe alarmists are not entirely wrong. In the most crowded districts, schools still run in shifts, and a handful of clerical posts can draw applications by the sackful. But the cure they prescribed, fewer children, has been arriving on its own across much of the country, and in some states it has arrived early enough to raise the opposite fear: that the population will grow old before it grows prosperous.\n\nThat is what both camps miss. A young population is less an asset than a loan taken out against the future, and loans fall due. The workers of today are the pensioners of a few decades hence. If they spend their working years idle or underpaid, they will reach old age with little saved and fewer children to lean on, and the country will have paid interest on money it never spent. The question was never whether India has too many people or just enough. It is what the country does with the decades in which its workers outnumber its dependants by a wider margin than they ever will again.","stem":"As used in paragraph 3, 'shifts' most nearly means","options":["transfers from one place to another","changes in policy or opinion","periods of paid work","sessions held one after another"],"answer":"sessions held one after another","answerIndex":3,"tags":["dictionary sense","dictionary sense","wrong shade","KEY"],"optionTags":["vocab-context-blind","vocab-context-blind","vocab-shade",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nExplanation: 'Schools still run in shifts' describes crowded districts where one building serves more pupils than it can seat at once.\nCorrect (d): One batch of pupils is taught, then another, in the same building.\nLead distractor (c): The working-day sense is close, but it describes workers' hours, not how a school divides its pupils.\nIncorrect (a): Another everyday sense; the schools are not moving anywhere.\nIncorrect (b): The commonest sense of shift; nothing in the sentence is changing.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_006","section":"VA","format":"RC","kind":"mcq","passage":"For most of the last century, India argued about its population in the language of fear. Textbooks warned of an explosion; planners counted mouths to feed. Somewhere along the way the vocabulary flipped. The same young people are now called a dividend, and speeches that once treated them as a drain on the budget now present them as the country's richest asset. Both descriptions are offered with equal confidence, and both, I think, mistake a timetable for a verdict.\n\nDemographers say a country is in line for a dividend when the share of its people of working age grows faster than the share who depend on them: more hands to produce, fewer mouths competing for what is produced. But that arithmetic only opens a door. The gain arrives if those hands find work, and the work arrives only if they were schooled and fed well enough to be worth hiring. Where the first condition holds and the others fail, the result is not a dividend but a queue: young men and women waiting, certificates in hand, for jobs that nobody created.\n\nThe alarmists are not entirely wrong. In the most crowded districts, schools still run in shifts, and a handful of clerical posts can draw applications by the sackful. But the cure they prescribed, fewer children, has been arriving on its own across much of the country, and in some states it has arrived early enough to raise the opposite fear: that the population will grow old before it grows prosperous.\n\nThat is what both camps miss. A young population is less an asset than a loan taken out against the future, and loans fall due. The workers of today are the pensioners of a few decades hence. If they spend their working years idle or underpaid, they will reach old age with little saved and fewer children to lean on, and the country will have paid interest on money it never spent. The question was never whether India has too many people or just enough. It is what the country does with the decades in which its workers outnumber its dependants by a wider margin than they ever will again.","stem":"Which of the following does the writer NOT present as a consequence of failing to employ the young?","options":["The country paying a price for something it never used.","Schools having to run in shifts to fit everyone in.","Workers reaching old age with little put aside.","Qualified young people waiting for jobs that do not exist."],"answer":"Schools having to run in shifts to fit everyone in.","answerIndex":1,"tags":["looks out of scope","KEY","true but not the answer","word match"],"optionTags":["rc-out-of-scope",null,"rc-true-not-answer","rc-word-match"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: The writer traces three results of the young going without work: a queue of qualified people waiting (paragraph 2), little saved for old age, and the country paying interest on money it never spent (paragraph 4).\nCorrect (b): Shifts appear in paragraph 3 as the alarmists' evidence of crowding, not as a result of unemployment. It is in the passage, but not as a consequence.\nLead distractor (a): It looks unfamiliar only because it is paraphrased: the country 'will have paid interest on money it never spent'.\nIncorrect (c): Stated in paragraph 4: they 'will reach old age with little saved'.\nIncorrect (d): Stated in paragraph 2: young people waiting, certificates in hand, for jobs nobody created.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_007","section":"VA","format":"RC","kind":"mcq","passage":"It is commonly said, by those who have never watched a naturalist at work, that great discoveries arrive in a flash: the apple drops, the bath overflows, and the man of genius runs shouting into the street. I do not doubt that such moments occur. But I have spent the better part of forty summers among men who study beetles and lichens, and I have seen the flash perhaps twice; the waiting I have seen a thousand times.\n\nMy old friend the curate kept a notebook on the spiders of his garden wall. Every morning for eleven years he set down where each web hung, how wide it was, and what it had caught, and for nine of those years the notebook told him nothing whatever. In the tenth he noticed that the webs on the eastern face were spun earlier than those on the western, and that the spiders which spun late went hungrier. It was a small thing, and he would have been the first to call it small; yet no cleverer man could have found it in a single summer, for it was not in any single summer to be found.\n\nThe patience I mean is not the dull patience of the clerk who waits for the clock to release him. It is an active thing, a refusal to let the mind snap shut, like a trap upon the first mouse that offers, before the facts have finished arriving. The quick mind is quick to be satisfied; it takes the first likely explanation and goes home with it.\n\nI would not have the young despise cleverness on that account. A dull man may watch a wall for eleven years and see nothing but a wall. What the curate possessed was not a slower mind than his neighbours' but a more reluctant one, and it was his reluctance, more than his notebook, that made the notebook worth keeping.","stem":"The writer mentions having seen 'the flash perhaps twice' in order to","options":["concede that flashes happen, but only to those who have done the waiting.","suggest that sudden insight is real but far rarer than people suppose.","suggest that sudden insight is mostly a tale told by storytellers.","explain why the naturalists he knew had so little regard for genius."],"answer":"suggest that sudden insight is real but far rarer than people suppose.","answerIndex":1,"tags":["false link","KEY","extreme","out of scope"],"optionTags":["rc-false-link",null,"rc-extreme","rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nExplanation: Paragraph 1 grants that flashes happen, then sets 'perhaps twice' against waiting seen 'a thousand times'.\nCorrect (b): He admits such moments occur but shows how rare they are next to the waiting; the popular account he opens with overstates them.\nLead distractor (c): One notch too strong: he says 'I do not doubt that such moments occur', and he has seen two.\nIncorrect (a): Nothing ties the rare flashes to earlier waiting; he only contrasts how often he saw each.\nIncorrect (d): Nothing says the naturalists distrusted genius; the contrast is between the popular story and what he saw.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_008","section":"VA","format":"RC","kind":"mcq","passage":"It is commonly said, by those who have never watched a naturalist at work, that great discoveries arrive in a flash: the apple drops, the bath overflows, and the man of genius runs shouting into the street. I do not doubt that such moments occur. But I have spent the better part of forty summers among men who study beetles and lichens, and I have seen the flash perhaps twice; the waiting I have seen a thousand times.\n\nMy old friend the curate kept a notebook on the spiders of his garden wall. Every morning for eleven years he set down where each web hung, how wide it was, and what it had caught, and for nine of those years the notebook told him nothing whatever. In the tenth he noticed that the webs on the eastern face were spun earlier than those on the western, and that the spiders which spun late went hungrier. It was a small thing, and he would have been the first to call it small; yet no cleverer man could have found it in a single summer, for it was not in any single summer to be found.\n\nThe patience I mean is not the dull patience of the clerk who waits for the clock to release him. It is an active thing, a refusal to let the mind snap shut, like a trap upon the first mouse that offers, before the facts have finished arriving. The quick mind is quick to be satisfied; it takes the first likely explanation and goes home with it.\n\nI would not have the young despise cleverness on that account. A dull man may watch a wall for eleven years and see nothing but a wall. What the curate possessed was not a slower mind than his neighbours' but a more reluctant one, and it was his reluctance, more than his notebook, that made the notebook worth keeping.","stem":"According to the writer, no cleverer man could have made the curate's discovery in a single summer because","options":["cleverness tempts an observer to dismiss whatever seems small.","it took the curate nine years to learn how to observe a web.","a single summer's webs were too few in number to be measured.","the pattern appeared only when many years were laid side by side."],"answer":"the pattern appeared only when many years were laid side by side.","answerIndex":3,"tags":["false link","word match","out of scope","KEY"],"optionTags":["rc-false-link","rc-word-match","rc-out-of-scope",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: 'It was not in any single summer to be found': the difference between the eastern and western webs showed only in records kept over many years.\nCorrect (d): Paraphrases 'it was not in any single summer to be found'. The cause is in the data, not in the man.\nLead distractor (a): It echoes the writer's view of quick minds, but the reason he gives here is about the facts: the pattern did not exist in one summer's records.\nIncorrect (b): The notebook told him nothing for nine years because the pattern had not yet emerged, not because he was learning to observe.\nIncorrect (c): The passage never says one summer's webs are too few to measure.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_009","section":"VA","format":"RC","kind":"mcq","passage":"It is commonly said, by those who have never watched a naturalist at work, that great discoveries arrive in a flash: the apple drops, the bath overflows, and the man of genius runs shouting into the street. I do not doubt that such moments occur. But I have spent the better part of forty summers among men who study beetles and lichens, and I have seen the flash perhaps twice; the waiting I have seen a thousand times.\n\nMy old friend the curate kept a notebook on the spiders of his garden wall. Every morning for eleven years he set down where each web hung, how wide it was, and what it had caught, and for nine of those years the notebook told him nothing whatever. In the tenth he noticed that the webs on the eastern face were spun earlier than those on the western, and that the spiders which spun late went hungrier. It was a small thing, and he would have been the first to call it small; yet no cleverer man could have found it in a single summer, for it was not in any single summer to be found.\n\nThe patience I mean is not the dull patience of the clerk who waits for the clock to release him. It is an active thing, a refusal to let the mind snap shut, like a trap upon the first mouse that offers, before the facts have finished arriving. The quick mind is quick to be satisfied; it takes the first likely explanation and goes home with it.\n\nI would not have the young despise cleverness on that account. A dull man may watch a wall for eleven years and see nothing but a wall. What the curate possessed was not a slower mind than his neighbours' but a more reluctant one, and it was his reluctance, more than his notebook, that made the notebook worth keeping.","stem":"The writer implies that the clerk's patience differs from the kind he admires in that the clerk","options":["waits for something that will come whatever he does.","is content to wait, while the naturalist waits impatiently.","gains nothing of value at the end of his wait.","waits for shorter spells and with less discomfort."],"answer":"waits for something that will come whatever he does.","answerIndex":0,"tags":["KEY","reversal","true but not the answer","out of scope"],"optionTags":[null,"rc-reversal","rc-true-not-answer","rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nExplanation: The clerk 'waits for the clock to release him'; the writer's patience is 'an active thing', a refusal to let the mind close too soon.\nCorrect (a): The clock arrives whatever the clerk does, so his waiting is passive; the naturalist's waiting is an effort to keep the question open.\nLead distractor (c): Tempting because the clerk discovers nothing, but the writer's contrast is passive against active waiting, not reward against no reward.\nIncorrect (b): The naturalist's patience is 'an active thing', not impatience; the contrast is active against passive waiting, not calm against restless.\nIncorrect (d): The passage says nothing about how long or how hard either wait is.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_010","section":"VA","format":"RC","kind":"mcq","passage":"It is commonly said, by those who have never watched a naturalist at work, that great discoveries arrive in a flash: the apple drops, the bath overflows, and the man of genius runs shouting into the street. I do not doubt that such moments occur. But I have spent the better part of forty summers among men who study beetles and lichens, and I have seen the flash perhaps twice; the waiting I have seen a thousand times.\n\nMy old friend the curate kept a notebook on the spiders of his garden wall. Every morning for eleven years he set down where each web hung, how wide it was, and what it had caught, and for nine of those years the notebook told him nothing whatever. In the tenth he noticed that the webs on the eastern face were spun earlier than those on the western, and that the spiders which spun late went hungrier. It was a small thing, and he would have been the first to call it small; yet no cleverer man could have found it in a single summer, for it was not in any single summer to be found.\n\nThe patience I mean is not the dull patience of the clerk who waits for the clock to release him. It is an active thing, a refusal to let the mind snap shut, like a trap upon the first mouse that offers, before the facts have finished arriving. The quick mind is quick to be satisfied; it takes the first likely explanation and goes home with it.\n\nI would not have the young despise cleverness on that account. A dull man may watch a wall for eleven years and see nothing but a wall. What the curate possessed was not a slower mind than his neighbours' but a more reluctant one, and it was his reluctance, more than his notebook, that made the notebook worth keeping.","stem":"The central claim of the passage is that discovery","options":["comes to anyone who records the same facts for long enough.","owes more to careful notebooks than it does to clever minds.","depends less on brilliance than on refusing an early answer.","belongs to genius, though genius too must learn how to wait."],"answer":"depends less on brilliance than on refusing an early answer.","answerIndex":2,"tags":["scope shift","detail as main point","KEY","reversal"],"optionTags":["rc-scope-shift","rc-detail-as-main",null,"rc-reversal"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nExplanation: The last paragraph carries the thesis: the curate had 'not a slower mind... but a more reluctant one', and that reluctance mattered more than the notebook.\nCorrect (c): The final sentence ranks reluctance above both cleverness and the notebook.\nLead distractor (b): The notebook is the vivid example, but the last sentence says reluctance, 'more than his notebook', made it worth keeping.\nIncorrect (a): The concession rules this out: a dull man may watch a wall for eleven years 'and see nothing but a wall'.\nIncorrect (d): The passage is written against the story of the genius's flash.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_011","section":"VA","format":"RC","kind":"mcq","passage":"It is commonly said, by those who have never watched a naturalist at work, that great discoveries arrive in a flash: the apple drops, the bath overflows, and the man of genius runs shouting into the street. I do not doubt that such moments occur. But I have spent the better part of forty summers among men who study beetles and lichens, and I have seen the flash perhaps twice; the waiting I have seen a thousand times.\n\nMy old friend the curate kept a notebook on the spiders of his garden wall. Every morning for eleven years he set down where each web hung, how wide it was, and what it had caught, and for nine of those years the notebook told him nothing whatever. In the tenth he noticed that the webs on the eastern face were spun earlier than those on the western, and that the spiders which spun late went hungrier. It was a small thing, and he would have been the first to call it small; yet no cleverer man could have found it in a single summer, for it was not in any single summer to be found.\n\nThe patience I mean is not the dull patience of the clerk who waits for the clock to release him. It is an active thing, a refusal to let the mind snap shut, like a trap upon the first mouse that offers, before the facts have finished arriving. The quick mind is quick to be satisfied; it takes the first likely explanation and goes home with it.\n\nI would not have the young despise cleverness on that account. A dull man may watch a wall for eleven years and see nothing but a wall. What the curate possessed was not a slower mind than his neighbours' but a more reluctant one, and it was his reluctance, more than his notebook, that made the notebook worth keeping.","stem":"The image of the mind snapping shut 'like a trap upon the first mouse that offers' suggests that a hasty mind","options":["does harm to the very ideas that it means to capture.","is easily lured by whatever happens to be offered to it first.","settles on the earliest explanation within reach and stops looking.","values the first thing it caught above anything it might catch later."],"answer":"settles on the earliest explanation within reach and stops looking.","answerIndex":2,"tags":["literal reading","word match","KEY","half right"],"optionTags":["rc-literal","rc-word-match",null,"rc-half-right"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nExplanation: The quick mind 'takes the first likely explanation and goes home with it'; the trap image describes that habit.\nCorrect (c): A trap springs on whatever comes first and is then shut; the hasty mind 'takes the first likely explanation and goes home with it'.\nLead distractor (d): The mind does hold on to its first catch, but the passage's point is that it stops looking, not that it ranks what it catches.\nIncorrect (a): A trap harms the mouse, but the image is about the mind closing, not about damage to ideas.\nIncorrect (b): In the passage the mouse 'offers' itself; nothing says the mind is lured or tempted by an offer.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_012","section":"VA","format":"RC","kind":"mcq","passage":"It is commonly said, by those who have never watched a naturalist at work, that great discoveries arrive in a flash: the apple drops, the bath overflows, and the man of genius runs shouting into the street. I do not doubt that such moments occur. But I have spent the better part of forty summers among men who study beetles and lichens, and I have seen the flash perhaps twice; the waiting I have seen a thousand times.\n\nMy old friend the curate kept a notebook on the spiders of his garden wall. Every morning for eleven years he set down where each web hung, how wide it was, and what it had caught, and for nine of those years the notebook told him nothing whatever. In the tenth he noticed that the webs on the eastern face were spun earlier than those on the western, and that the spiders which spun late went hungrier. It was a small thing, and he would have been the first to call it small; yet no cleverer man could have found it in a single summer, for it was not in any single summer to be found.\n\nThe patience I mean is not the dull patience of the clerk who waits for the clock to release him. It is an active thing, a refusal to let the mind snap shut, like a trap upon the first mouse that offers, before the facts have finished arriving. The quick mind is quick to be satisfied; it takes the first likely explanation and goes home with it.\n\nI would not have the young despise cleverness on that account. A dull man may watch a wall for eleven years and see nothing but a wall. What the curate possessed was not a slower mind than his neighbours' but a more reluctant one, and it was his reluctance, more than his notebook, that made the notebook worth keeping.","stem":"Which of the following is most nearly OPPOSITE in meaning to 'reluctant' as it is used in the last paragraph?","options":["forthcoming","credulous","sceptical","inattentive"],"answer":"credulous","answerIndex":1,"tags":["dictionary sense","KEY","synonym, not opposite","wrong shade"],"optionTags":["vocab-context-blind",null,"vocab-opposite","vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: In the last paragraph 'reluctant' means slow to accept a conclusion: the curate's mind would not settle on an answer before the facts were in.\nCorrect (b): Credulous means too ready to believe or accept, the opposite of the curate's unwillingness to settle.\nLead distractor (c): Sceptical is close to the curate's quality; in context it is a synonym of reluctant, not its opposite.\nIncorrect (a): Forthcoming is an opposite of reluctant in the sense 'unwilling to say much', which is not its meaning here.\nIncorrect (d): It opposes 'observant', not 'reluctant'; nobody in the passage is accused of carelessness.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_013","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"Some words are missing from the text below. Choose the set of words that best completes it.\n\nThe hoard turned up under a farmer's plough, and for a week the coins were passed around the village as a ___ curiosity, handled at tea-stalls and weddings; it took a visiting numismatist, who noticed that several bore the mark of a mint no surviving record mentions, for the find to be recognised as ___ and for the field to be closed to ___ while the excavation began.","options":["minor; perennial; grazing","trivial; historic; excavation","mere; momentous; cultivation","solemn; significant; ploughing"],"answer":"mere; momentous; cultivation","answerIndex":2,"tags":["category error","near-miss sense","KEY","register clash"],"optionTags":["vocab-category","vocab-shade",null,"sc-register"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): Blank 1: the coins were handled 'at tea-stalls and weddings' and it took a specialist to see their worth, so they were a mere curiosity. Blank 2: a mint 'no surviving record mentions' makes the find momentous. Blank 3: the field is closed to farming 'while the excavation began'.\nIncorrect (a): Category error. Minor and grazing fit, but perennial (lasting year after year, as a plant does) says nothing about how important a find is.\nIncorrect (b): Near-miss sense. Trivial and historic fit, but the field cannot be closed to excavation 'while the excavation began'; the clue comes after the blank.\nIncorrect (d): Register clash. Significant and ploughing fit, but nothing about coins 'handled at tea-stalls and weddings' is solemn.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: blank 1 pinned by 'handled at tea-stalls and weddings' and 'it took a visiting numismatist'; blank 2 by 'a mint no surviving record mentions'; blank 3 by 'while the excavation began' (look-ahead)."},{"id":"IPMAT_VA_014","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the sentence by choosing the most appropriate word or phrase from the options given below.\n\nThe retired judge's memoir names no colleague who ever erred and quotes no verdict she disagreed with, and the reviewers who had hoped for scandal wrote instead about how ___ she had been in deciding what to leave out.","options":["judgemental","judicious","juridical","judicial"],"answer":"judicious","answerIndex":1,"tags":["polarity flip","KEY","confusable sibling","confusable sibling"],"optionTags":["vocab-opposite",null,"vocab-sound-alike","vocab-sound-alike"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): Judicious means showing good judgement. The memoir 'names no colleague who ever erred' and disappoints reviewers 'who had hoped for scandal': her choices about what to leave out were wise.\nIncorrect (a): Polarity flip. Means quick to criticise others, the opposite of a memoir that names no one who erred.\nIncorrect (c): Confusable sibling. Means relating to the law; it describes legal matters, not a person's discretion.\nIncorrect (d): Confusable sibling. Means relating to courts or judges. The author is a judge, which is why it tempts, but the sentence praises her good sense as an editor, not anything about the courts.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by 'names no colleague who ever erred' and reviewers 'who had hoped for scandal' admiring her choices; 'judge' is the decoy for 'judicial'."},{"id":"IPMAT_VA_015","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Yet the railways could not run on such a patchwork.\n2. Each kept its own noon, fixed by the moment the sun stood highest over its own square.\n3. Their answer was a single time, kept by every station on the line, whatever the sun said.\n4. For centuries, towns only a short ride apart told different times without anyone minding.\n5. Within a generation, the townspeople had set their own clocks by the station's.","stem":"The sentences below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order and type in the sequence of numbers as your answer, for example 2143, with no spaces or punctuation.","options":[],"answer":"42135","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"24135":"pj-opener","41235":"pj-pair-broken"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 42135\n4 opens: a full noun phrase ('towns') with no back-reference.\n2 follows: 'Each' needs a plural antecedent, the towns.\n1 next: 'Yet' cannot open, and 'such a patchwork' sums up the many noons in 2.\n3 then: 'Their answer' needs 'the railways' from 1.\n5 closes: 'Within a generation' comes after the railways' answer.\nTempting wrong orders: 41235 (a claim and the sentence that answers it are split apart); 24135 (a sentence that depends on an earlier one is put first).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order forced by 4 opens; 2 follows; 1 next."},{"id":"IPMAT_VA_016","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the sentence by choosing the most appropriate word or phrase from the options given below.\n\nThe airline's statement called the incident 'a minor technical irregularity', noted that not one passenger had asked for a refund, and gave its longest paragraph to the safety awards the airline had won; read as a whole, it was meant to ___ what had happened on the runway.","options":["play up","play off","play out","play down"],"answer":"play down","answerIndex":3,"tags":["polarity flip","real phrasal verb, wrong meaning","real phrasal verb, wrong meaning","KEY"],"optionTags":["vocab-opposite","vocab-wrong-idiom","vocab-wrong-idiom",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): To play down something is to make it seem less important. Calling the incident 'a minor technical irregularity' and spending the longest paragraph on awards both shrink the event.\nIncorrect (a): Polarity flip. Means to exaggerate, the opposite of what the statement does.\nIncorrect (b): Real phrasal verb, wrong meaning. Means to set one party against another; nobody is being set against anyone.\nIncorrect (c): Real phrasal verb, wrong meaning. Means to unfold or be acted out; a statement cannot try to make an incident unfold.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by 'a minor technical irregularity' and the longest paragraph spent on safety awards (minimising)."},{"id":"IPMAT_VA_017","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"Some words are missing from the text below. Choose the set of words that best completes it.\n\nEvery monsoon the city's engineers ___ the flooding to rainfall of unusual intensity, and every monsoon the same twelve streets go under. It took a junior surveyor with a set of old maps to show that the drains beneath those streets had not been overwhelmed at all; they had been ___, one compound wall at a time, by the buildings above them.","options":["commend; buried","attribute; entombed","ascribe; inundated","relegate; swallowed"],"answer":"attribute; entombed","answerIndex":1,"tags":["collocation break","KEY","near-miss sense","collocation break"],"optionTags":["sc-collocation",null,"vocab-shade","sc-collocation"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): Blank 1: the engineers blame the rain, and you attribute a bad outcome to a cause. Blank 2: the drains were 'not … overwhelmed at all' but buried 'one compound wall at a time, by the buildings above them': entombed.\nIncorrect (a): Collocation break. Buried fits, but commend means to praise or to entrust; the engineers neither praise the flooding nor hand it over to the rain.\nIncorrect (c): Near-miss sense. Ascribe fits, but inundated means flooded, which repeats 'overwhelmed', the very thing the sentence says did not happen.\nIncorrect (d): Collocation break. Swallowed fits, but relegate means to move down to a lower rank; the engineers are explaining the flooding, not demoting it.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: blank 1 is blame (register: attribute, not credit); blank 2 pinned by 'not been overwhelmed at all' and 'one compound wall at a time, by the buildings above them'."},{"id":"IPMAT_VA_018","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Yet in many towns the white coat has turned grey within two summers, and most of the benefit has gone with it.\n2. Painting a roof white is about the cheapest way there is to keep the rooms beneath it cool.\n3. The reason is that a white surface sends much of the sunlight back towards the sky instead of soaking it up as heat.\n4. That is why the more careful programmes now budget for repainting, and not just for the first coat.","stem":"The sentences below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order and type in the sequence of numbers as your answer, for example 2143, with no spaces or punctuation.","options":[],"answer":"2314","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"2134":"pj-pair-broken","2341":"pj-topic-link"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 2314\n2 opens: the claim, with a full noun phrase and no back-reference.\n3 follows: 'The reason is' explains the claim in 2.\n1 next: 'Yet' cannot open; it turns from the benefit to its fading.\n4 closes: 'That is why' draws the lesson from 1.\nTempting wrong orders: 2134 (a claim and the sentence that answers it are split apart); 2341 (sentences joined by topic instead of by their linking words).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order forced by 2 opens; 3 follows; 1 next."},{"id":"IPMAT_VA_019","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"Some words are missing from the text below. Choose the set of words that best completes it.\n\nRead line by line by the company's lawyers before its release, the apology was a ___ document by any standard: not one sentence in it could later be quoted back at the firm in court. It was also so ___ that within the hour customers were passing it around as a model of how not to say sorry.","options":["circumspect; anodyne","guarded; contrite","effusive; bland","cautious; litigious"],"answer":"circumspect; anodyne","answerIndex":0,"tags":["KEY","near-miss sense","polarity flip","category error"],"optionTags":[null,"vocab-shade","vocab-opposite","vocab-category"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): Blank 1: nothing in it could be used 'in court', so it was cautious: circumspect. Blank 2: customers shared it as 'a model of how not to say sorry', so it said nothing that felt like an apology: anodyne, bland to the point of meaning nothing.\nIncorrect (b): Near-miss sense. Guarded fits, but a contrite apology would be a model of how to say sorry, not how not to.\nIncorrect (c): Polarity flip. Bland fits, but effusive (gushing) cannot describe a text in which 'not one sentence' could be quoted against the firm.\nIncorrect (d): Category error. Cautious fits, but litigious describes people or firms quick to sue, not a piece of writing; the lawyers make it tempting.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: blank 1 pinned by 'not one sentence … could later be quoted back at the firm in court'; blank 2 by 'a model of how not to say sorry'."},{"id":"IPMAT_VA_020","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the sentence below, the underlined part is incorrect. Choose the alternative that renders the sentence correct.\n\n[[Had the inspectors had known about the cracks, they would close]] the bridge long before the monsoon arrived.","options":["Had the inspectors known about the cracks, they would have closed","If the inspectors would have known about the cracks, they would have closed","Had the inspectors had known about the cracks, they would close","Had the inspectors known about the cracks, they would close"],"answer":"Had the inspectors known about the cracks, they would have closed","answerIndex":0,"tags":["KEY","new error","original span","half-fix"],"optionTags":[null,"gram-mood","gram-sounds-right","gram-half-fix"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): An inverted third conditional: 'Had the inspectors known' replaces 'If the inspectors had known' and takes only one 'had'; the main clause needs 'would have closed' for a past that did not happen.\nIncorrect (b): New error. Fixes the main clause but puts 'would have' inside the if-clause.\nIncorrect (c): Original span. The span as written: a doubled 'had' and 'would close'.\nIncorrect (d): Half-fix. Fixes the inversion but keeps 'would close', which cannot describe an unreal past.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: inverted third conditional needs one 'had' and 'would have closed'."},{"id":"IPMAT_VA_021","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph below has a sentence missing, indicated by a blank. Choose the option that most logically completes the paragraph.\n\nFor a tomato grower with two acres and no storage, the price is set by the hour at which the truck reaches the mandi. If the market is flooded that morning, she takes whatever is offered, because by evening her crop will have begun to rot. Small solar-powered cold rooms, shared by a cluster of villages, are beginning to change that arithmetic. A grower who can hold her crop back for even a week can wait for the glut to pass. ___","options":["Solar panels now also run the pumps that water many of the same fields.","Her price still depends almost entirely on when the truck gets to market.","Tomatoes are among the most perishable crops grown in the region.","What the cold room sells her, in the end, is not cold but time."],"answer":"What the cold room sells her, in the end, is not cold but time.","answerIndex":3,"tags":["off-topic insertion","stance contradiction","right topic, wrong focus","KEY"],"optionTags":["rc-out-of-scope","rc-reversal","para-same-topic",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): Every sentence builds to one point: a grower who can wait a week escapes the morning's glut. The key sums it up: what she gains is time.\nIncorrect (a): Off-topic insertion. Irrigation pumps are never raised; the paragraph is about storage and price.\nIncorrect (b): Stance contradiction. The paragraph says the cold rooms are 'beginning to change that arithmetic'.\nIncorrect (c): Right topic, wrong focus. True to the topic, but it adds a fact instead of drawing the conclusion the paragraph has been building.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: closing key sums up 'can wait for the glut to pass' (time, not cold)."},{"id":"IPMAT_VA_022","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Human heart cells do the same thing for a day or two, and then stop.\n2. Blocking that signal in mice allowed some regrowth, though nobody yet knows whether the same would be safe in people.\n3. In the fish, cells at the edge of a wound briefly return to a younger state and begin to divide.\n4. The researchers traced that halt to a single signal which, in mammals, switches the process off.\n5. A team studying zebrafish has found a clue to why their hearts can regrow after injury while ours cannot.","stem":"The sentences below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order and type in the sequence of numbers as your answer, for example 2143, with no spaces or punctuation.","options":[],"answer":"53142","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"35142":"pj-opener","54231":"pj-topic-link"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 53142\n5 opens: 'A team studying zebrafish' introduces the finding.\n3 follows: 'In the fish' needs the zebrafish of 5.\n1 next: 'the same thing' needs the process described in 3.\n4 then: 'that halt' needs 'and then stop' in 1.\n2 closes: 'that signal' needs 4.\nTempting wrong orders: 54231 (sentences joined by topic instead of by their linking words); 35142 (a sentence that depends on an earlier one is put first).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order forced by 5 opens; 3 follows; 1 next."},{"id":"IPMAT_VA_023","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the sentence below, the underlined part is incorrect. Choose the alternative that renders the sentence correct.\n\nAfter the exhibition, the principal [[had the students to repaint the wall theirselves]] instead of hiring painters.","options":["had the students repaint the wall theirselves","had the students to repaint the wall theirselves","had the students repaint the wall themselves","made the students to repaint the wall themselves"],"answer":"had the students repaint the wall themselves","answerIndex":2,"tags":["half-fix","original span","KEY","new error"],"optionTags":["gram-half-fix","gram-sounds-right",null,"gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): Causative 'have' takes the bare infinitive ('had the students repaint'), and the standard reflexive is 'themselves'.\nIncorrect (a): Half-fix. Fixes the causative but keeps the non-standard 'theirselves'.\nIncorrect (b): Original span. The span as written: 'had ... to repaint' and 'theirselves'.\nIncorrect (d): New error. Fixes the pronoun, but active 'make' also takes the bare infinitive: 'made the students repaint'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: causative 'have' takes the bare infinitive; standard reflexive is 'themselves'."},{"id":"IPMAT_VA_024","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph below has a sentence missing, indicated by a blank. Choose the option that most logically completes the paragraph.\n\nMining companies argue that the metal-rich nodules scattered across the deep ocean floor are the cleanest source of the materials that batteries will need, since collecting them clears no forest and moves no village. The argument has a certain logic, and it has won over several governments. ___ Biologists who have sampled the plains where the nodules lie routinely bring up animals that no one has ever described. It is hard to weigh the cost of destroying a habitat when nobody yet knows what lives in it.","options":["Scientists broadly agree that the seabed is too barren for mining to matter.","Demand for electric cars has grown faster than most carmakers expected.","Lifting nodules from such depths remains slow, difficult and expensive.","Its weakness is that it counts only the damage already in view."],"answer":"Its weakness is that it counts only the damage already in view.","answerIndex":3,"tags":["stance contradiction","off-topic insertion","right topic, wrong focus","KEY"],"optionTags":["rc-reversal","rc-out-of-scope","para-same-topic",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nCorrect (d): 'Its weakness' picks up 'the argument' just before, and the next sentences explain the unseen damage: animals 'no one has ever described' in a habitat nobody yet understands.\nIncorrect (a): Stance contradiction. Biologists 'routinely bring up animals that no one has ever described'.\nIncorrect (b): Off-topic insertion. Car sales are never raised; the paragraph turns to biology.\nIncorrect (c): Right topic, wrong focus. On topic, but about engineering cost; the next sentence turns to biology, which this does not prepare for.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'Its weakness' picks up 'The argument' and is explained by the biologists' unknown animals."},{"id":"IPMAT_VA_025","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the sentence by choosing the most appropriate word or phrase from the options given below.\n\nThe home side had been four goals down since half-time, and by the final whistle the stands held more pigeons than people; the supporters who had stayed to the end ___ out of the gates without a word, collars turned up against the drizzle.","options":["stampeded","trudged","strutted","ambled"],"answer":"trudged","answerIndex":1,"tags":["near-miss sense","KEY","polarity flip","near-miss sense"],"optionTags":["vocab-shade",null,"vocab-opposite","vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): To trudge is to walk slowly and heavily, as people do when beaten and tired. The side was 'four goals down since half-time', the fans left 'without a word', 'collars turned up against the drizzle'.\nIncorrect (a): Near-miss sense. Means to rush in a large, panicked mass; the stands held 'more pigeons than people'.\nIncorrect (c): Polarity flip. Means to walk proudly, the opposite of supporters whose side has just been beaten.\nIncorrect (d): Near-miss sense. Means to walk slowly in a relaxed, contented way; slow is right, but nothing about a heavy defeat in the drizzle is relaxed.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by the defeat, the silence and the drizzle (dejection) and by 'more pigeons than people' (no crowd), all outside the blank's window."},{"id":"IPMAT_VA_026","section":"VA","format":"Parajumble","kind":"tita","passage":"1. When the city library began lending hammers, drills and ladders alongside its books, the local paper treated it as a joke.\n2. The librarians admitted that they had not foreseen the queue, though perhaps they should have.\n3. Seen that way, a library has always been less a building full of books than a way of sharing what nobody needs to own.\n4. Within a year, the tool shelf had a longer waiting list than the newest bestseller.\n5. The average drill, after all, is used for a few minutes in its whole life, while the average novel is read for hours.","stem":"The sentences below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order and type in the sequence of numbers as your answer, for example 2143, with no spaces or punctuation.","options":[],"answer":"14253","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"12453":"pj-topic-link","14523":"pj-pair-broken"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 14253\n1 opens: the scheme and the paper's reaction, with no back-reference.\n4 follows: 'Within a year' measures time from the launch in 1.\n2 next: 'the queue' needs the waiting list in 4.\n5 then: 'after all' explains why the librarians 'should have' foreseen it.\n3 closes: 'Seen that way' draws the conclusion from 5.\nTempting wrong orders: 14523 (a claim and the sentence that answers it are split apart); 12453 (sentences joined by topic instead of by their linking words).","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order forced by 1 opens; 4 follows; 2 next."},{"id":"IPMAT_VA_027","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the sentence by choosing the most appropriate word or phrase from the options given below.\n\nAsked whether the coastal highway should go ahead, the minister spoke movingly about the fishing families whose boats it would displace and then, with equal feeling, about the jobs it would bring to the district; the reporters left with two pages of notes and no idea how he meant to vote, and the next morning's editorial accused him of having ___.","options":["sat pretty","sat on the fence","sat on his hands","sat on his thumbs"],"answer":"sat on the fence","answerIndex":1,"tags":["real expression, wrong meaning","KEY","real expression, wrong meaning","corrupted fixed expression"],"optionTags":["vocab-wrong-idiom",null,"vocab-wrong-idiom","gram-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): To sit on the fence is to avoid taking either side. He spoke 'with equal feeling' for the fishing families and for the jobs, and reporters had 'no idea how he meant to vote'.\nIncorrect (a): Real expression, wrong meaning. A real idiom meaning to be in a comfortable position; an editorial would not accuse a minister of that for a non-answer.\nIncorrect (c): Real expression, wrong meaning. A real idiom meaning to do nothing when action is needed. It suits a complaint about a minister, but he said a great deal; the charge is that he chose no side.\nIncorrect (d): Corrupted fixed expression. A corrupted form of a different idiom, sit on one's hands; it is not an English expression.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by 'with equal feeling' for both sides and 'no idea how he meant to vote'; 'sat on his hands' fits a criticism but not a man who talked at length."},{"id":"IPMAT_VA_028","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph below has a sentence missing, indicated by a blank. Choose the option that most logically completes the paragraph.\n\nAcross western India, stepwells that once carried a town's water through the dry months are being restored, often with generous grants and even more generous photographs. The stone is scrubbed, the steps are relaid and the carvings are lit at night. ___ Cut off from the channels that once fed them from the surrounding catchment, most fill only when rain falls on the well itself, and by midwinter the water at the bottom is green and still. A stepwell that holds no water is a monument; it has stopped being a well.","options":["What is rarely touched is anything beyond the well's own walls.","Many of the carvings show river goddesses linked with water and plenty.","In most towns the restored wells have come back into everyday use.","Tourism boards now list the restored wells beside the forts and palaces."],"answer":"What is rarely touched is anything beyond the well's own walls.","answerIndex":0,"tags":["KEY","right topic, wrong focus","stance contradiction","off-topic insertion"],"optionTags":[null,"para-same-topic","rc-reversal","rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): The blank follows a list of repairs to the stone and precedes 'Cut off from the channels that once fed them'. The key names the gap the next sentence explains: everything outside the walls.\nIncorrect (b): Right topic, wrong focus. On topic, but the paragraph is about water supply, not what the carvings depict.\nIncorrect (c): Stance contradiction. The paragraph says they fill only with rain and are 'green and still' by midwinter.\nIncorrect (d): Off-topic insertion. Tourism is never raised again, and 'Cut off from the channels' would have nothing to follow from.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by the next sentence, 'Cut off from the channels that once fed them', which needs a sentence naming what lay outside the restored well."},{"id":"IPMAT_VA_029","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the sentence below, the underlined part is incorrect. Choose the alternative that renders the sentence correct.\n\nThe officer [[whom the residents said had ignored their complaints were]] transferred last week.","options":["who the residents said has ignored their complaints was","whom the residents said had ignored their complaints were","who the residents said had ignored their complaints was","who the residents said had ignored their complaints were"],"answer":"who the residents said had ignored their complaints was","answerIndex":2,"tags":["new error","original span","KEY","half-fix"],"optionTags":["gram-tense-marker","gram-hypercorrection",null,"gram-half-fix"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): 'Who' is the subject of 'had ignored'; 'the residents said' is only an inserted clause. The main verb 'was' agrees with 'the officer'.\nIncorrect (a): New error. 'has ignored' clashes with 'was transferred last week'.\nIncorrect (b): Original span. The span as written: 'whom' treated as the object of 'said', and 'were' agreeing with 'complaints'.\nIncorrect (d): Half-fix. Fixes 'who' but keeps 'were', which agrees with the nearest plural noun instead of 'the officer'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'who' is the subject of 'had ignored' ('the residents said' is inserted); 'was' agrees with 'the officer'."},{"id":"IPMAT_VA_030","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"Some words are missing from the text below. Choose the set of words that best completes it.\n\nDoctors had hoped the new antibiotic would ___ the resistant strain for a decade at least; within three years the bacteria had ___ it, and the drug that was meant to be held in reserve for the gravest cases was being handed out for sore throats.","options":["contain; potentiated","check; succumbed to","suppress; circumvented","quarantine; outmanoeuvred"],"answer":"suppress; circumvented","answerIndex":2,"tags":["near-miss sense","polarity flip","KEY","category error"],"optionTags":["vocab-shade","vocab-opposite",null,"vocab-category"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): Blank 1: doctors hoped the drug would hold the strain down. Blank 2: 'within three years', against hopes of 'a decade at least', the bacteria had found a way round it, helped by a reserve drug being 'handed out for sore throats'.\nIncorrect (a): Near-miss sense. Contain fits, but potentiate means to strengthen a drug's effect; the sentence describes the drug failing.\nIncorrect (b): Polarity flip. Check fits, but if the bacteria had succumbed to the drug the hope would have come true; 'within three years' against 'a decade at least' says it did not.\nIncorrect (d): Category error. Outmanoeuvred fits, but an antibiotic acts on bacteria inside the body; it cannot quarantine (isolate) a strain.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'had hoped … for a decade at least' set against 'within three years' marks the hope failing; overuse 'for sore throats' explains how."},{"id":"IPMAT_VA_031","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the sentence by choosing the most appropriate word or phrase from the options given below.\n\nAt the reunion lunch, when a cousin began asking who had signed the papers for the sale of the family shop, their aunt, who had watched two brothers stop speaking over that sale, began talking loudly about the weather; she had always believed it wiser to ___.","options":["let sleeping dogs lie","let off steam","let the cat out of the box","let the cat out of the bag"],"answer":"let sleeping dogs lie","answerIndex":0,"tags":["KEY","real expression, wrong meaning","corrupted fixed expression","real expression, wrong meaning"],"optionTags":[null,"vocab-wrong-idiom","gram-idiom","vocab-wrong-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): To let sleeping dogs lie is to leave an old trouble alone rather than stir it up. The aunt, who had seen the brothers 'stop speaking over that sale', answers the question by 'talking loudly about the weather': she steers everyone away from the quarrel.\nIncorrect (b): Real expression, wrong meaning. A real idiom meaning to release pent-up anger; the aunt does the opposite, steering everyone towards the weather.\nIncorrect (c): Corrupted fixed expression. A corrupted form of a different idiom, let the cat out of the bag; it is not an English expression.\nIncorrect (d): Real expression, wrong meaning. A real idiom meaning to reveal a secret. The question about who signed the papers makes it tempting, but the aunt does the opposite: she changes the subject.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by the aunt 'talking loudly about the weather' after watching the brothers 'stop speaking over that sale'; the question about the papers is the decoy for 'cat out of the bag'."},{"id":"IPMAT_VA_032","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the sentence below, the underlined part is incorrect. Choose the alternative that renders the sentence correct.\n\nWorried by the latest test results, the doctor insisted [[that her father takes his tablets regular]], even on the days when he felt well.","options":["that her father takes his tablets regular","that her father take their tablets regularly","that her father take his tablets regularly","that her father take his tablets regular"],"answer":"that her father take his tablets regularly","answerIndex":2,"tags":["original span","new error","KEY","half-fix"],"optionTags":["gram-mood","gram-pronoun",null,"gram-half-fix"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): After 'insisted' in the sense of a demand, the verb is the subjunctive 'take' (no -s), and the adverb 'regularly' is needed to modify it.\nIncorrect (a): Original span. The span as written: 'takes' instead of the subjunctive, and 'regular' instead of 'regularly'.\nIncorrect (b): New error. Fixes both errors, but 'their' no longer agrees with 'her father'.\nIncorrect (d): Half-fix. Fixes the subjunctive but keeps the adjective 'regular' where an adverb is needed.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'insisted' as a demand takes the subjunctive 'take'; the adverb 'regularly' modifies the verb."},{"id":"IPMAT_VA_033","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the sentence by choosing the most appropriate word or phrase from the options given below.\n\nWhen a rival app copied their last remaining feature over a single weekend, the founders gathered their twelve employees in the café downstairs and ___; by the end of the month the office had been cleared and the domain was up for sale.","options":["threw their weight around","threw down the glove","threw down the gauntlet","threw in the towel"],"answer":"threw in the towel","answerIndex":3,"tags":["real expression, wrong meaning","corrupted fixed expression","real expression, wrong meaning","KEY"],"optionTags":["vocab-wrong-idiom","gram-idiom","vocab-wrong-idiom",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nCorrect (d): To throw in the towel is to give up. The deciding detail comes after the blank: within a month 'the office had been cleared and the domain was up for sale', so the meeting announced that they were quitting.\nIncorrect (a): Real expression, wrong meaning. A real idiom meaning to bully or boss people; nothing in the sentence shows the founders doing that, and it would not explain the office being cleared.\nIncorrect (b): Corrupted fixed expression. A corrupted form of a different idiom, throw down the gauntlet; it is not an English expression.\nIncorrect (c): Real expression, wrong meaning. A real idiom meaning to issue a challenge. The rival's copying makes it tempting, but a challenge does not end with the office cleared and the domain sold.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: key pinned by 'the office had been cleared and the domain was up for sale' (they gave up); the rival's copying is the decoy for 'gauntlet'."},{"id":"IPMAT_VA_034","section":"VA","format":"RC","kind":"mcq","passage":"HOST: My guest today spent twenty years designing roller coasters before she started writing about why people ride them. She has just come back from Afterland, the new park built to look like a city after some unnamed collapse: ration queues, cracked fountains, a carousel ringed with surveillance cameras. A lot of our listeners would say that is misery sold as entertainment. Is that unfair?\n\nGUEST: It's about half fair. I went in expecting a joke at the visitor's expense and came out less sure who the joke was on. You have to understand that every amusement park is one of two machines. Most are lifeboats. They lift you out of your week, and the measure of a good one is how completely you forget where you came from. Afterland is a lens. It takes something you already half-see, the queue, the camera, the form you fill in twice, and holds it close enough that you can't look away.\n\nHOST: But people do go there to have fun. I'm told the queue for the ration-card ride runs to two hours.\n\nGUEST: Some of them certainly treat it as a lifeboat with a darker coat of paint. I watched a family pose, grinning, in front of the detention carousel, and nothing in the design can stop that. But the queues are part of the exhibit. Once you've stood for two hours under a sign telling you that your patience is being monitored, the joke has stopped being about a city in the future.\n\nHOST: So it's a protest, then. A warning about where we're headed.\n\nGUEST: I'd resist that. A warning points forward; a lens points at what is already in the room. The designers I spoke to didn't think they were predicting anything. They thought they were describing a Tuesday afternoon.\n\nHOST: Isn't there a risk that it simply gets people used to all of this? The cameras, the queues, the forms?\n\nGUEST: That's the real danger, much more than the misery. A lens you look through too often stops being a lens; your eye adjusts to it. If people start coming back every summer, Afterland may end up a lifeboat after all, just one that carries you somewhere that looks a lot like home.","stem":"Which of the following best captures the guest's view of Afterland?","options":["It shows visitors what they already live with, at least for now.","It turns hardship into a show that visitors enjoy without thinking.","It works only for visitors who refuse to treat it as entertainment.","It warns visitors about the kind of society they are drifting towards."],"answer":"It shows visitors what they already live with, at least for now.","answerIndex":0,"tags":["KEY","half right","scope shift","wrong voice"],"optionTags":[null,"rc-half-right","rc-scope-shift","rc-wrong-voice"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nExplanation: The guest calls Afterland 'a lens' that points 'at what is already in the room', and ends by warning that repeat visits may turn it into a lifeboat.\nCorrect (a): Her lens points at the present, and her last answer warns that repeat visits may blunt it: hence 'at least for now'.\nLead distractor (d): This is the host's reading ('a warning about where we're headed'); the guest replies, 'I'd resist that.'\nIncorrect (b): She calls the listeners' charge only 'about half fair'; her own view is that the park shows visitors their present.\nIncorrect (c): She never limits its effect to such visitors; she says the two-hour queue works on people whatever they came for.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_035","section":"VA","format":"RC","kind":"mcq","passage":"HOST: My guest today spent twenty years designing roller coasters before she started writing about why people ride them. She has just come back from Afterland, the new park built to look like a city after some unnamed collapse: ration queues, cracked fountains, a carousel ringed with surveillance cameras. A lot of our listeners would say that is misery sold as entertainment. Is that unfair?\n\nGUEST: It's about half fair. I went in expecting a joke at the visitor's expense and came out less sure who the joke was on. You have to understand that every amusement park is one of two machines. Most are lifeboats. They lift you out of your week, and the measure of a good one is how completely you forget where you came from. Afterland is a lens. It takes something you already half-see, the queue, the camera, the form you fill in twice, and holds it close enough that you can't look away.\n\nHOST: But people do go there to have fun. I'm told the queue for the ration-card ride runs to two hours.\n\nGUEST: Some of them certainly treat it as a lifeboat with a darker coat of paint. I watched a family pose, grinning, in front of the detention carousel, and nothing in the design can stop that. But the queues are part of the exhibit. Once you've stood for two hours under a sign telling you that your patience is being monitored, the joke has stopped being about a city in the future.\n\nHOST: So it's a protest, then. A warning about where we're headed.\n\nGUEST: I'd resist that. A warning points forward; a lens points at what is already in the room. The designers I spoke to didn't think they were predicting anything. They thought they were describing a Tuesday afternoon.\n\nHOST: Isn't there a risk that it simply gets people used to all of this? The cameras, the queues, the forms?\n\nGUEST: That's the real danger, much more than the misery. A lens you look through too often stops being a lens; your eye adjusts to it. If people start coming back every summer, Afterland may end up a lifeboat after all, just one that carries you somewhere that looks a lot like home.","stem":"The term 'lifeboat', as the guest uses it, refers to a park that","options":["carries visitors towards a future they would rather avoid.","is judged by how fully visitors forget their everyday lives.","rescues visitors from danger by keeping them safe inside it.","keeps visitors cheerful by hiding all that is unpleasant."],"answer":"is judged by how fully visitors forget their everyday lives.","answerIndex":1,"tags":["reversal","KEY","literal reading","half right"],"optionTags":["rc-reversal",null,"rc-literal","rc-half-right"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nExplanation: Lifeboats 'lift you out of your week', and a good one is measured by 'how completely you forget where you came from'.\nCorrect (b): Paraphrases her own definition of a good lifeboat.\nLead distractor (d): A lifeboat does offer escape, but she never says it hides everything unpleasant; she defines it by how fully you forget your week.\nIncorrect (a): A lifeboat carries you away from your ordinary life, not towards a feared future.\nIncorrect (c): The metaphor has nothing to do with physical danger or safety.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_036","section":"VA","format":"RC","kind":"mcq","passage":"HOST: My guest today spent twenty years designing roller coasters before she started writing about why people ride them. She has just come back from Afterland, the new park built to look like a city after some unnamed collapse: ration queues, cracked fountains, a carousel ringed with surveillance cameras. A lot of our listeners would say that is misery sold as entertainment. Is that unfair?\n\nGUEST: It's about half fair. I went in expecting a joke at the visitor's expense and came out less sure who the joke was on. You have to understand that every amusement park is one of two machines. Most are lifeboats. They lift you out of your week, and the measure of a good one is how completely you forget where you came from. Afterland is a lens. It takes something you already half-see, the queue, the camera, the form you fill in twice, and holds it close enough that you can't look away.\n\nHOST: But people do go there to have fun. I'm told the queue for the ration-card ride runs to two hours.\n\nGUEST: Some of them certainly treat it as a lifeboat with a darker coat of paint. I watched a family pose, grinning, in front of the detention carousel, and nothing in the design can stop that. But the queues are part of the exhibit. Once you've stood for two hours under a sign telling you that your patience is being monitored, the joke has stopped being about a city in the future.\n\nHOST: So it's a protest, then. A warning about where we're headed.\n\nGUEST: I'd resist that. A warning points forward; a lens points at what is already in the room. The designers I spoke to didn't think they were predicting anything. They thought they were describing a Tuesday afternoon.\n\nHOST: Isn't there a risk that it simply gets people used to all of this? The cameras, the queues, the forms?\n\nGUEST: That's the real danger, much more than the misery. A lens you look through too often stops being a lens; your eye adjusts to it. If people start coming back every summer, Afterland may end up a lifeboat after all, just one that carries you somewhere that looks a lot like home.","stem":"By calling Afterland 'a lens', the guest means that the park","options":["gives visitors a sharper picture of a future that is still far off.","enlarges everyday troubles until they look worse than they are.","watches its visitors as closely as they are watching it.","holds the ordinary so close to visitors that it cannot be ignored."],"answer":"holds the ordinary so close to visitors that it cannot be ignored.","answerIndex":3,"tags":["wrong voice","literal reading","word match","KEY"],"optionTags":["rc-wrong-voice","rc-literal","rc-word-match",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nExplanation: A lens 'takes something you already half-see' and 'holds it close enough that you can't look away'.\nCorrect (d): Paraphrases her definition: it takes what you 'already half-see' (the queue, the camera, the form) and holds it 'close enough that you can't look away'.\nLead distractor (a): The future is the host's frame; the guest says a lens points at what is already in the room.\nIncorrect (b): Lenses magnify, but she never says the park exaggerates anything.\nIncorrect (c): The park does have cameras, but she uses 'lens' for what visitors see, not for being watched.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_037","section":"VA","format":"RC","kind":"mcq","passage":"HOST: My guest today spent twenty years designing roller coasters before she started writing about why people ride them. She has just come back from Afterland, the new park built to look like a city after some unnamed collapse: ration queues, cracked fountains, a carousel ringed with surveillance cameras. A lot of our listeners would say that is misery sold as entertainment. Is that unfair?\n\nGUEST: It's about half fair. I went in expecting a joke at the visitor's expense and came out less sure who the joke was on. You have to understand that every amusement park is one of two machines. Most are lifeboats. They lift you out of your week, and the measure of a good one is how completely you forget where you came from. Afterland is a lens. It takes something you already half-see, the queue, the camera, the form you fill in twice, and holds it close enough that you can't look away.\n\nHOST: But people do go there to have fun. I'm told the queue for the ration-card ride runs to two hours.\n\nGUEST: Some of them certainly treat it as a lifeboat with a darker coat of paint. I watched a family pose, grinning, in front of the detention carousel, and nothing in the design can stop that. But the queues are part of the exhibit. Once you've stood for two hours under a sign telling you that your patience is being monitored, the joke has stopped being about a city in the future.\n\nHOST: So it's a protest, then. A warning about where we're headed.\n\nGUEST: I'd resist that. A warning points forward; a lens points at what is already in the room. The designers I spoke to didn't think they were predicting anything. They thought they were describing a Tuesday afternoon.\n\nHOST: Isn't there a risk that it simply gets people used to all of this? The cameras, the queues, the forms?\n\nGUEST: That's the real danger, much more than the misery. A lens you look through too often stops being a lens; your eye adjusts to it. If people start coming back every summer, Afterland may end up a lifeboat after all, just one that carries you somewhere that looks a lot like home.","stem":"Which of the following does the guest NOT say or suggest about Afterland?","options":["Its designers set out to predict where society is heading.","The waiting it imposes is part of what it shows.","Some of its visitors treat it as ordinary fun.","Visiting it too often could blunt the effect it has."],"answer":"Its designers set out to predict where society is heading.","answerIndex":0,"tags":["KEY","word match","true but not the answer","looks out of scope"],"optionTags":[null,"rc-word-match","rc-true-not-answer","rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nExplanation: Three options restate the guest; one reverses her remark that the designers 'didn't think they were predicting anything'.\nCorrect (a): She says the opposite: they thought they were 'describing a Tuesday afternoon'.\nLead distractor (d): A paraphrase of 'a lens you look through too often stops being a lens'.\nIncorrect (b): Stated: 'the queues are part of the exhibit'.\nIncorrect (c): Stated: some treat it 'as a lifeboat with a darker coat of paint'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: gates 1–4 pending (audit, blind solve, strong solve, human read)"},{"id":"IPMAT_VA_038","section":"VA","format":"RC","kind":"mcq","passage":"HOST: My guest today spent twenty years designing roller coasters before she started writing about why people ride them. She has just come back from Afterland, the new park built to look like a city after some unnamed collapse: ration queues, cracked fountains, a carousel ringed with surveillance cameras. A lot of our listeners would say that is misery sold as entertainment. Is that unfair?\n\nGUEST: It's about half fair. I went in expecting a joke at the visitor's expense and came out less sure who the joke was on. You have to understand that every amusement park is one of

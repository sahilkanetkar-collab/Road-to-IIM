var QUESTIONS=[{"id":"IPMAT_VA_001","section":"VA","format":"RC","kind":"mcq","passage":"For most of the last century, India argued about its population in the language of fear. Textbooks warned of an explosion; planners counted mouths to feed. Somewhere along the way the vocabulary flipped. The same young people are now called a dividend, and speeches that once treated them as a drain on the budget now present them as the country's richest asset. Both descriptions are offered with equal confidence, and both, I think, mistake a timetable for a verdict.\n\nDemographers say a country is in line for a dividend when the share of its people of working age grows faster than the share who depend on them: more hands to produce, fewer mouths competing for what is produced. But that arithmetic only opens a door. The gain arrives if those hands find work, and the work arrives only if they were schooled and fed well enough to be worth hiring. Where the first condition holds and the others fail, the result is not a dividend but a queue: young men and women waiting, certificates in hand, for jobs that nobody created.\n\nThe alarmists are not entirely wrong. In the most crowded districts, schools still run in shifts, and a handful of clerical posts can draw applications by the sackful. But the cure they prescribed, fewer children, has been arriving on its own across much of the country, and in some states it has arrived early enough to raise the opposite fear: that the population will grow old before it grows prosperous.\n\nThat is what both camps miss. A young population is less an asset than a loan taken out against the future, and loans fall due. The workers of today are the pensioners of a few decades hence. If they spend their working years idle or underpaid, they will reach old age with little saved and fewer children to lean on, and the country will have paid interest on money it never spent. The question was never whether India has too many people or just enough. It is wha

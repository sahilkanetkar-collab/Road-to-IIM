s grave or stern; the objection is made through irony.","archetype":"RC tone/attitude","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_055","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"There is no virtue so loudly commended in our time, nor any so little examined, as punctuality. The moralists have agreed upon it; the schoolmasters enforce it with a bell; and my aunt, who has read nothing since the Jubilee, holds that a man who is late for breakfast will very probably be late for the Day of Judgment. I have listened to her for thirty years, and I confess I have never discovered what she supposes the two appointments to have in common.\n\nI do not deny that a train must leave at its hour. A railway is a machine for moving a great many strangers at once, and strangers can be reconciled to one another only by a timetable. Nor would I defend the guest who arrives when the soup is cold. But it is one thing to keep an appointment and another to make of the clock a conscience. It was the railway, I think, that first taught the towns to set their watches by a single standard; the factory borrowed the lesson and rang it on a bell; and the schoolroom, borrowing in its turn from the factory, taught the child that it is the hour, and not the task, by which merit is reckoned. A boy who has finished his sum early is told to wait; a boy who has not finished it is told to stop. Neither, you will observe, is asked whether the sum was worth doing.\n\nIn the country, at least, the older reckoning lingers. A labourer I once walked with measured his day by the length of the shadows and the temper of his horse, and he was the least hurried man of my acquaintance and by no means the least industrious. He could not have told you the time within an hour. He could have told you, to the furrow, how much remained to be done.\n\nI would not have the whole nation adopt his method; the trains, at least, would suffer. I would only observe that the clock was brought into the house as a servant, to wake us and to tell us when the joint was done, and that it has since, without anyone quite noticing, taken the chair at the head of the table. We no longer ask whether a thing is finished. We ask whether it is time.","stem":"When the writer says the clock has 'taken the chair at the head of the table', he means that it","options":["now presides over meals that were once taken without any ceremony","has been given a place of honour it has not earned","now decides when the family may sit down","now sets the terms by which the whole household lives"],"answer":"now sets the terms by which the whole household lives","answerIndex":3,"tags":["rc-word-match","rc-out-of-scope","rc-literal","KEY"],"optionTags":["rc-word-match","rc-out-of-scope","rc-literal",null],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: The sentence contrasts two roles: the clock 'was brought into the house as a servant' and has since taken the master's seat. The closing lines give the result: 'We no longer ask whether a thing is finished. We ask whether it is time.'\nCorrect (d): The head of the table is where the master sits; 'sets the terms by which the household lives' is the master's role that the former servant now holds, shown in the closing lines where every task is judged by the clock.\nLead distractor (a): Borrows the table and chair and turns them into mealtimes. The image is about who is in charge, not about how formal meals have become.\nIncorrect (b): A reasonable reading of the quote alone, but the writer's point is that the clock has taken control, not merely honour, and he never argues about whether it deserves it.\nIncorrect (c): Reads the image literally, as the clock setting times for sitting down to eat.","archetype":"RC slot D: quoted line","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_056","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"There is no virtue so loudly commended in our time, nor any so little examined, as punctuality. The moralists have agreed upon it; the schoolmasters enforce it with a bell; and my aunt, who has read nothing since the Jubilee, holds that a man who is late for breakfast will very probably be late for the Day of Judgment. I have listened to her for thirty years, and I confess I have never discovered what she supposes the two appointments to have in common.\n\nI do not deny that a train must leave at its hour. A railway is a machine for moving a great many strangers at once, and strangers can be reconciled to one another only by a timetable. Nor would I defend the guest who arrives when the soup is cold. But it is one thing to keep an appointment and another to make of the clock a conscience. It was the railway, I think, that first taught the towns to set their watches by a single standard; the factory borrowed the lesson and rang it on a bell; and the schoolroom, borrowing in its turn from the factory, taught the child that it is the hour, and not the task, by which merit is reckoned. A boy who has finished his sum early is told to wait; a boy who has not finished it is told to stop. Neither, you will observe, is asked whether the sum was worth doing.\n\nIn the country, at least, the older reckoning lingers. A labourer I once walked with measured his day by the length of the shadows and the temper of his horse, and he was the least hurried man of my acquaintance and by no means the least industrious. He could not have told you the time within an hour. He could have told you, to the furrow, how much remained to be done.\n\nI would not have the whole nation adopt his method; the trains, at least, would suffer. I would only observe that the clock was brought into the house as a servant, to wake us and to tell us when the joint was done, and that it has since, without anyone quite noticing, taken the chair at the head of the table. We no longer ask whether a thing is finished. We ask whether it is time.","stem":"The passage is chiefly concerned with","options":["how keeping time has replaced finishing work as our test","how the railway made punctuality necessary and therefore admirable","why the older rhythms of country life ought to replace the timetable","how the servants of modern life became its masters"],"answer":"how keeping time has replaced finishing work as our test","answerIndex":0,"tags":["KEY","rc-half-right","rc-reversal","rc-scope-shift"],"optionTags":[null,"rc-half-right","rc-reversal","rc-scope-shift"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nExplanation: The essay moves from the unexamined praise of punctuality, through the chain by which the hour became the measure of merit, to its late thesis: the clock came in as a servant and 'has since … taken the chair at the head of the table'.\nCorrect (a): The essay's last two sentences state it: 'We no longer ask whether a thing is finished. We ask whether it is time.' The schoolroom example (the boy told to wait or stop, never asked whether the sum was worth doing) makes the same point.\nLead distractor (b): Half right. The writer agrees the railway made timekeeping necessary ('a train must leave at its hour'), but his point is that necessity was wrongly turned into a virtue; he never calls it admirable.\nIncorrect (c): The writer explicitly refuses this: 'I would not have the whole nation adopt his method; the trains, at least, would suffer.'\nIncorrect (d): Borrows the servant-turned-master image from the final paragraph but applies it to 'the servants of modern life' in general. The essay makes that claim about one servant, the clock.","archetype":"RC slot C: main idea","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_057","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"There is no virtue so loudly commended in our time, nor any so little examined, as punctuality. The moralists have agreed upon it; the schoolmasters enforce it with a bell; and my aunt, who has read nothing since the Jubilee, holds that a man who is late for breakfast will very probably be late for the Day of Judgment. I have listened to her for thirty years, and I confess I have never discovered what she supposes the two appointments to have in common.\n\nI do not deny that a train must leave at its hour. A railway is a machine for moving a great many strangers at once, and strangers can be reconciled to one another only by a timetable. Nor would I defend the guest who arrives when the soup is cold. But it is one thing to keep an appointment and another to make of the clock a conscience. It was the railway, I think, that first taught the towns to set their watches by a single standard; the factory borrowed the lesson and rang it on a bell; and the schoolroom, borrowing in its turn from the factory, taught the child that it is the hour, and not the task, by which merit is reckoned. A boy who has finished his sum early is told to wait; a boy who has not finished it is told to stop. Neither, you will observe, is asked whether the sum was worth doing.\n\nIn the country, at least, the older reckoning lingers. A labourer I once walked with measured his day by the length of the shadows and the temper of his horse, and he was the least hurried man of my acquaintance and by no means the least industrious. He could not have told you the time within an hour. He could have told you, to the furrow, how much remained to be done.\n\nI would not have the whole nation adopt his method; the trains, at least, would suffer. I would only observe that the clock was brought into the house as a servant, to wake us and to tell us when the joint was done, and that it has since, without anyone quite noticing, taken the chair at the head of the table. We no longer ask whether a thing is finished. We ask whether it is time.","stem":"As used in paragraph 2, 'reckoned' most nearly means","options":["measured","supposed","settled","expected"],"answer":"measured","answerIndex":0,"tags":["KEY","vocab-context-blind","vocab-shade","vocab-shade"],"optionTags":[null,"vocab-context-blind","vocab-shade","vocab-shade"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nExplanation: The schoolroom taught 'that it is the hour, and not the task, by which merit is reckoned', meaning the unit by which merit is judged or counted.\nCorrect (a): 'Measured' fits: merit is assessed in hours rather than by work done.\nLead distractor (b): The everyday sense ('I reckon so'), which fits casual speech but not 'by which merit is reckoned'.\nIncorrect (c): Close to 'reckoning' as settling an account, but merit is not being paid off or concluded.\nIncorrect (d): 'Reckon on' can mean expect, but merit is not being anticipated here; it is being assessed.","archetype":"RC slot F: vocabulary in context","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_058","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"When the rival firm halved its prices overnight, it was effectively ___, daring the market leader to respond in kind.","options":["throwing in the towel","throwing down the mantle","throwing up the gauntlet","throwing down the gauntlet"],"answer":"throwing down the gauntlet","answerIndex":3,"tags":["real-expression-wrong-meaning","corrupted-expression","corrupted-expression","KEY"],"optionTags":["va-real-expression-wrong-meaning","va-corrupted-expression","va-corrupted-expression",null],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): To 'throw down the gauntlet' is to issue a challenge. The medieval knight threw his glove at an opponent's feet. 'Daring the market leader to respond' demands exactly this sense.\nIncorrect (a): A real idiom, but 'throw in the towel' means to give up, the opposite of an aggressive price cut.\nIncorrect (b): A blend with 'take up the mantle' (assume someone's role); 'throw down the mantle' is not an expression.\nIncorrect (c): The right noun with the wrong particle. 'Throw up' does not form this idiom.","archetype":"Idiom: fixed expression","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_059","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"The committee's report was ___: brilliant in places, careless in others, and impossible either to accept or to reject as a whole.","options":["a curate's egg","a mare's nest","a parson's egg","a curate's nest"],"answer":"a curate's egg","answerIndex":0,"tags":["KEY","real-expression-wrong-meaning","corrupted-expression","corrupted-expression"],"optionTags":[null,"va-real-expression-wrong-meaning","va-corrupted-expression","va-corrupted-expression"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): 'A curate's egg' is something that is good in parts and bad in others. It comes from a cartoon in which a nervous curate, served a bad egg by his bishop, insists that 'parts of it are excellent'. 'Brilliant in places, careless in others' is its definition.\nIncorrect (b): A real idiom, but a 'mare's nest' is an illusory discovery or a hopeless muddle; it cannot be 'brilliant in places'.\nIncorrect (c): Swaps curate for parson; not a recognised expression.\nIncorrect (d): Grafts 'nest' from 'mare's nest' onto 'curate's'; a corrupted blend.","archetype":"Idiom: fixed expression","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_060","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"By filing its patent application a week before the trade fair, the start-up managed to ___ its far larger competitors.","options":["steal a glance at","steal a march on","steal a stride on","steal the march from"],"answer":"steal a march on","answerIndex":1,"tags":["real-expression-wrong-meaning","KEY","corrupted-expression","corrupted-expression"],"optionTags":["va-real-expression-wrong-meaning",null,"va-corrupted-expression","va-corrupted-expression"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): To 'steal a march on' someone is to gain an advantage by acting before them, originally by moving an army while the enemy rested. Filing a week early to get ahead of larger rivals is the standard use.\nIncorrect (a): A real expression, but 'steal a glance at' means to look at someone quickly and secretly, which makes no sense with a patent filing.\nIncorrect (c): Replaces 'march' with 'stride'; not an idiom.\nIncorrect (d): Keeps 'march' but changes the article and preposition; the fixed form is 'a march on'.","archetype":"Idiom: fixed expression","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_061","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"When the export orders dried up, the weavers had to ___ the small savings they had put aside in the good years.","options":["fall in with","fall back with","fall back on","fall through on"],"answer":"fall back on","answerIndex":2,"tags":["real-expression-wrong-meaning","corrupted-expression","KEY","corrupted-expression"],"optionTags":["va-real-expression-wrong-meaning","va-corrupted-expression",null,"va-corrupted-expression"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): To 'fall back on' something is to rely on it when other resources fail. Savings put aside in good years are exactly what one falls back on when orders dry up.\nIncorrect (a): A real phrasal verb, but 'fall in with' means to agree with or to join company with someone; one does not fall in with savings.\nIncorrect (b): The right verb and particle with the wrong preposition. 'Fall back with' is not idiomatic.\nIncorrect (d): 'Fall through' (fail to happen) exists, but 'fall through on' savings is not an expression.","archetype":"Phrasal verb","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_062","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"The senior partner's ___ tone left no room for discussion; it was the voice of a man issuing orders, not inviting views.","options":["peremptory","perfunctory","pre-emptive","perennial"],"answer":"peremptory","answerIndex":0,"tags":["KEY","confusable-sibling","confusable-sibling","confusable-sibling"],"optionTags":[null,"va-confusable-sibling","va-confusable-sibling","va-confusable-sibling"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): 'Peremptory' means insisting on immediate obedience and allowing no discussion, which is exactly 'issuing orders, not inviting views'.\nIncorrect (b): 'Perfunctory' means carried out with minimal effort or interest. A perfunctory tone is careless, not commanding.\nIncorrect (c): 'Pre-emptive' means acting in advance to prevent something (a pre-emptive strike). It describes an action taken early, not a commanding tone.\nIncorrect (d): 'Perennial' means lasting or recurring year after year; a sound-alike with no bearing on tone.","archetype":"Confusable words","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_063","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"The inquiry concluded that the clerk's lapse was ___, a careless slip rather than an act of corruption, and let him off with a warning.","options":["venal","venial","vernal","menial"],"answer":"venial","answerIndex":1,"tags":["confusable-sibling","KEY","confusable-sibling","confusable-sibling"],"optionTags":["va-confusable-sibling",null,"va-confusable-sibling","va-confusable-sibling"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): 'Venial' means minor and pardonable (a venial sin). A careless slip that earns only a warning is venial.\nIncorrect (a): 'Venal' means open to bribery or corrupt, the exact opposite of 'rather than an act of corruption'. This is the trap for students who know only one of the pair.\nIncorrect (c): 'Vernal' means relating to spring; a look-alike with no fit.\nIncorrect (d): 'Menial' describes lowly, unskilled work (menial tasks); it cannot describe a lapse.","archetype":"Confusable words","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_064","section":"VA","format":"Complete the following sentences by choosing the most appropriate word/phrase from the options given below.","kind":"mcq","passage":null,"stem":"Exhausted after the climb, the porters ___ the last kilometre to camp, heads bowed, barely lifting their feet.","options":["trudged","strode","sauntered","scampered"],"answer":"trudged","answerIndex":0,"tags":["KEY","polarity-flip","polarity-flip","polarity-flip"],"optionTags":[null,"va-polarity-flip","va-polarity-flip","va-polarity-flip"],"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (a)\nCorrect (a): To 'trudge' is to walk slowly and heavily because of exhaustion; 'heads bowed, barely lifting their feet' describes it exactly.\nIncorrect (b): To 'stride' is to walk with long, decisive steps, the opposite of barely lifting one's feet.\nIncorrect (c): To 'saunter' is to stroll in a relaxed, leisurely way; exhaustion rules it out.\nIncorrect (d): To 'scamper' is to run with quick, light steps, like a child or a squirrel; the wrong speed and energy.","archetype":"Precise verb of motion","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked as the only standard expression/word that fits the context clause; each distractor carries one fault."},{"id":"IPMAT_VARC_065","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"[[Hardly the monsoon had arrived than]] the river burst its banks, cutting off three villages.","options":["Hardly had the monsoon arrived than","Hardly the monsoon had arrived when","Hardly had the monsoon arrived when","No sooner had the monsoon arrived when"],"answer":"Hardly had the monsoon arrived when","answerIndex":2,"tags":["half-fix","half-fix","KEY","new-error"],"optionTags":["va-half-fix","va-half-fix",null,"va-new-error"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): The span has two errors. A negative adverb like 'hardly' at the start of a clause requires inversion ('had the monsoon arrived'), and 'hardly' pairs with 'when', not 'than'. Only (c) fixes both.\nIncorrect (a): Fixes the inversion but keeps 'than'. 'Than' belongs with 'no sooner', not 'hardly'.\nIncorrect (b): Fixes the connector ('when') but leaves the verb uninverted.\nIncorrect (d): Swaps in 'no sooner', which must be followed by 'than', so pairing it with 'when' creates a new error.","archetype":"Negative inversion","status":"approved","flags":[],"verified":"ok","verNote":"G1: key confirmed as the only zero-error replacement; each distractor re-read to confirm exactly one fault retained or introduced."},{"id":"IPMAT_VARC_066","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"The committee, along with its chairman, [[were of the view that neither of the proposals were]] viable.","options":["was of the view that neither of the proposals were","were of the view that neither of the proposals was","was of the view that neither proposals was","was of the view that neither of the proposals was"],"answer":"was of the view that neither of the proposals was","answerIndex":3,"tags":["half-fix","half-fix","new-error","KEY"],"optionTags":["va-half-fix","va-half-fix","va-new-error",null],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nCorrect (d): Two agreement errors. The subject is 'the committee'; a phrase introduced by 'along with' does not make it plural, so the verb is 'was'. 'Neither of the proposals' is singular ('neither one'), so it too takes 'was'.\nIncorrect (a): Corrects the first verb but leaves 'neither … were'.\nIncorrect (b): Corrects 'neither … was' but leaves 'the committee … were'.\nIncorrect (c): Both verbs are right, but 'neither' used directly before a noun takes a singular noun ('neither proposal'); 'neither proposals' is a new error.","archetype":"Subject-verb agreement","status":"approved","flags":[],"verified":"ok","verNote":"G1: key confirmed as the only zero-error replacement; each distractor re-read to confirm exactly one fault retained or introduced."},{"id":"IPMAT_VARC_067","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"It is high time the ministry [[revises its guidelines, which has]] not been updated since they were first issued.","options":["revised its guidelines, which has","revises its guidelines, which have","revise its guidelines, which have","revised its guidelines, which have"],"answer":"revised its guidelines, which have","answerIndex":3,"tags":["half-fix","half-fix","new-error","KEY"],"optionTags":["va-half-fix","va-half-fix","va-new-error",null],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nCorrect (d): 'It is high time' is followed by the past tense with present meaning ('it is high time we left'), so 'revised'. The relative pronoun 'which' refers to 'guidelines', a plural, so 'which have'. Only (d) fixes both.\nIncorrect (a): Fixes the tense but keeps 'which has'.\nIncorrect (b): Fixes the agreement but keeps the present tense 'revises'.\nIncorrect (c): Uses the bare form 'revise', a subjunctive that belongs after verbs like 'insist' or 'demand' ('insist that it revise'), not after 'it is high time'.","archetype":"Unreal past after 'it is high time'","status":"approved","flags":[],"verified":"ok","verNote":"G1: key confirmed as the only zero-error replacement; each distractor re-read to confirm exactly one fault retained or introduced."},{"id":"IPMAT_VARC_068","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"The new policy [[not only aims at reducing emissions but also at]] creating jobs in the districts that depend on coal.","options":["not only aims to reduce emissions but also at","aims not only at reducing emissions but also at","aims not only at reducing emissions but also","aims at not only reducing emissions but also at"],"answer":"aims not only at reducing emissions but also at","answerIndex":1,"tags":["new-error","KEY","half-fix","new-error"],"optionTags":["va-new-error",null,"va-half-fix","va-new-error"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): With 'not only … but also', the words after each half must match. In (b) both halves begin with 'at' + gerund: 'not only at reducing … but also at creating'.\nIncorrect (a): Mixes 'to reduce' with 'at creating', which introduces a new mismatch.\nIncorrect (c): Moves 'not only' correctly but drops the second 'at', leaving 'at reducing' against a bare 'creating'.\nIncorrect (d): 'Aims at not only reducing … but also creating' would be correct, but the extra 'at' after 'but also' breaks the balance again.","archetype":"Parallelism: not only…but also","status":"approved","flags":[],"verified":"ok","verNote":"G1: key confirmed as the only zero-error replacement; each distractor re-read to confirm exactly one fault retained or introduced."},{"id":"IPMAT_VARC_069","section":"VA","format":"In each of the following sentences, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.","kind":"mcq","passage":null,"stem":"The candidate [[who the panel believed were]] best suited for the post declined the offer.","options":["who the panel believed was","whom the panel believed was","who, the panel believed, were","who the panel believed to be"],"answer":"who the panel believed was","answerIndex":0,"tags":["KEY","new-error","half-fix","new-error"],"optionTags":[null,"va-new-error","va-half-fix","va-new-error"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): 'The panel believed' is inserted into the clause 'who was best suited'. 'Who' is the subject of 'was', and it refers to 'the candidate', a singular, so the verb is 'was'.\nIncorrect (b): Fixes the verb but changes 'who' to 'whom'. The pronoun is the subject of 'was', so the object form is wrong; this is the classic hypercorrection.\nIncorrect (c): Adds commas around the inserted clause but leaves the plural 'were'.\nIncorrect (d): With the infinitive 'to be', the pronoun becomes the object of 'believed' and must be 'whom'; 'who … to be' is a new error.","archetype":"who/whom with inserted clause","status":"approved","flags":[],"verified":"ok","verNote":"G1: key confirmed as the only zero-error replacement; each distractor re-read to confirm exactly one fault retained or introduced."},{"id":"IPMAT_VARC_070","section":"VA","format":"Each of the paragraphs given below has a sentence missing which is indicated by a blank. From the choices given below each paragraph, choose the sentence that is most logically appropriate to complete the paragraph.","kind":"mcq","passage":null,"stem":"Surat cuts and polishes the great majority of the world's diamonds, and for decades the city's fortunes rose and fell with the mined stones that reached it from Antwerp and Dubai. ___ Laboratory-grown stones, chemically identical to mined ones, now make up a rising share of what passes through its workshops, and their prices have fallen steeply as production has scaled up. A polished stone that once anchored a trader's margin can now be matched, to the naked eye, by one that costs a fraction as much. The city's anxiety, in other words, is not only about how many stones it polishes but about what any of them are worth.","options":["Several of Gujarat's textile clusters have faced similar pressure from cheap synthetic imports.","Mined stones, however, have steadily tightened their hold on the city's workshops.","Antwerp's traders have long set the prices at which rough stones change hands.","That dependence is now being loosened from an unexpected direction."],"answer":"That dependence is now being loosened from an unexpected direction.","answerIndex":3,"tags":["off-topic-insertion","stance-contradiction","scope-shift","KEY"],"optionTags":["va-off-topic-insertion","va-stance-contradiction","va-scope-shift",null],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (d)\nCorrect (d): The blank must bridge 'fortunes rose and fell with the mined stones' and the arrival of laboratory stones. 'That dependence' points back to the reliance on mined stones, and 'an unexpected direction' is then named by the next sentence.\nIncorrect (a): Textile clusters are a different industry; the paragraph never leaves diamonds.\nIncorrect (b): Contradicts the next sentence, which says laboratory stones 'now make up a rising share' of the workshops' trade; mined stones are losing their hold, not tightening it.\nIncorrect (c): On topic but the wrong focus. It extends the Antwerp detail, and the next sentence's shift to laboratory stones would then arrive without any link.","archetype":"Paragraph completion: middle bridge","status":"approved","flags":["mock-plausible: Surat share of world diamond polishing and lab-grown price fall stated qualitatively; job-loss claim removed (real-world reports of Surat layoffs 2023-25 contradicted the old wording)"],"verified":"ok","verNote":"G1: key checked for referent/connector fit with both neighbours; each distractor fails on logic or focus."},{"id":"IPMAT_VARC_071","section":"VA","format":"Each of the paragraphs given below has a sentence missing which is indicated by a blank. From the choices given below each paragraph, choose the sentence that is most logically appropriate to complete the paragraph.","kind":"mcq","passage":null,"stem":"___ In Indian cities, concrete and asphalt soak up heat through the day and release it slowly after dark, so that night-time temperatures in dense neighbourhoods can stay several degrees above those of the surrounding countryside. For people without air-conditioning, this means there is no recovery: the body, which relies on cool nights to shed the day's heat load, begins the next morning already under strain. Many public-health researchers now suspect that this, as much as the afternoon peak, explains the rise in heat-related deaths.","options":["The most dangerous hours of a heatwave may be the ones after sunset.","This is why officials watch the afternoon maximum more closely than any other figure.","Air-conditioner sales in Indian homes have risen sharply over the past decade.","Rising sea levels pose a separate threat to several of India's coastal cities."],"answer":"The most dangerous hours of a heatwave may be the ones after sunset.","answerIndex":0,"tags":["KEY","stance-contradiction","scope-shift","off-topic-insertion"],"optionTags":[null,"va-stance-contradiction","va-scope-shift","va-off-topic-insertion"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (a)\nCorrect (a): An opening sentence needs a full claim with no back-reference, and it should announce what the paragraph proves. Every later sentence develops the danger of hot nights, and the last one explicitly weighs nights against 'the afternoon peak'.\nIncorrect (b): 'This is why' needs an earlier sentence to point to, so it cannot open; it also puts the focus on the afternoon peak, which the paragraph plays down.\nIncorrect (c): Related to heat but the wrong focus. The paragraph is about people without air-conditioning and the body's night-time recovery.\nIncorrect (d): Sea levels are a different climate threat, never raised.","archetype":"Paragraph completion: opener","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked for referent/connector fit with both neighbours; each distractor fails on logic or focus."},{"id":"IPMAT_VARC_072","section":"VA","format":"Each of the paragraphs given below has a sentence missing which is indicated by a blank. From the choices given below each paragraph, choose the sentence that is most logically appropriate to complete the paragraph.","kind":"mcq","passage":null,"stem":"Gene banks hold hundreds of thousands of crop varieties in cold rooms, sealed against time. But a seed stored at minus eighteen degrees stops evolving the moment it is frozen, while the pests and weather it will one day have to face go on changing. Farmers who replant their own varieties year after year keep those varieties adapting, season by season, to conditions that no laboratory can reproduce. ___","options":["Cold storage therefore remains the surest way of keeping a variety suited to changing conditions.","Every country should therefore build a national gene bank of its own.","A frozen collection, then, is an insurance policy, not a substitute for seeds that are still being grown.","High-yielding hybrids, meanwhile, have transformed harvests across much of Asia."],"answer":"A frozen collection, then, is an insurance policy, not a substitute for seeds that are still being grown.","answerIndex":2,"tags":["stance-contradiction","scope-shift","KEY","off-topic-insertion"],"optionTags":["va-stance-contradiction","va-scope-shift",null,"va-off-topic-insertion"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): The closing sentence must draw the conclusion the contrast supports: frozen seeds are preserved but stop adapting, while seeds in farmers' fields keep adapting. So the bank backs up living seed stock but cannot replace it. 'Then' marks the conclusion.\nIncorrect (a): Contradicts the paragraph, which says a frozen seed 'stops evolving' and so cannot stay suited to changing conditions.\nIncorrect (b): Jumps to policy advice for every country, a recommendation the paragraph never builds towards; if anything, it argues for farmers' fields.\nIncorrect (d): Hybrids and yields are a different topic, introduced from nowhere.","archetype":"Paragraph completion: closing conclusion","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked for referent/connector fit with both neighbours; each distractor fails on logic or focus."},{"id":"IPMAT_VARC_073","section":"VA","format":"Each of the paragraphs given below has a sentence missing which is indicated by a blank. From the choices given below each paragraph, choose the sentence that is most logically appropriate to complete the paragraph.","kind":"mcq","passage":null,"stem":"Until recently, a Malayalam film that did well at home was, at best, remade in Hindi a few years later with a different cast. Streaming platforms have changed that arithmetic. ___ A thriller shot on a modest budget in Kochi can now find more viewers in Bihar, or in Brazil, than in Kerala, and producers have begun to write with that audience in mind. Some critics worry that the local texture which made such films distinctive will be the first thing to be sacrificed.","options":["Single-screen cinemas in smaller towns, meanwhile, have been closing at a steady rate.","Remakes, however, still reach far larger audiences than dubbed or subtitled originals do.","Because a platform can dub or subtitle a film into a dozen languages at once, the original itself now travels.","Malayalam cinema has long been admired by critics for its realism and tightly written scripts."],"answer":"Because a platform can dub or subtitle a film into a dozen languages at once, the original itself now travels.","answerIndex":2,"tags":["off-topic-insertion","stance-contradiction","KEY","scope-shift"],"optionTags":["va-off-topic-insertion","va-stance-contradiction",null,"va-scope-shift"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nCorrect (c): 'Changed that arithmetic' needs explaining: how do platforms change a film's reach? The key gives the mechanism (dubbing and subtitling) and its result (the original travels instead of being remade), which the next sentence illustrates with Bihar and Brazil.\nIncorrect (a): Cinema closures are a separate story about theatres, not about how films travel.\nIncorrect (b): Contradicts the paragraph's claim that the original now finds more viewers far from home.\nIncorrect (d): True-sounding and on topic, but it praises the films instead of explaining the change the previous sentence announced.","archetype":"Paragraph completion: middle mechanism","status":"approved","flags":[],"verified":"ok","verNote":"G1: key checked for referent/connector fit with both neighbours; each distractor fails on logic or focus."},{"id":"IPMAT_VARC_074","section":"VA","format":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.","kind":"mcq","passage":null,"stem":"Critics argue that the new data-protection law, far from ___ citizens' privacy, merely ___ the surveillance powers the state already enjoys and ___ them in a veneer of legality.","options":["shielding; curtails; drapes","safeguarding; entrenches; cloaks","undermining; consolidates; wraps","securing; enshrines; strips"],"answer":"safeguarding; entrenches; cloaks","answerIndex":1,"tags":["polarity-flip","KEY","polarity-flip","collocation-break"],"optionTags":["va-polarity-flip",null,"va-polarity-flip","va-collocation-break"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nCorrect (b): 'Far from safeguarding privacy' sets up the critics' complaint; the law 'entrenches' (makes permanent) existing powers and 'cloaks them in a veneer of legality' (gives them a false look of lawfulness). All three fit meaning and collocation.\nIncorrect (a): 'Curtails' means restricts, the opposite of what the critics allege (killer in blank 2).\nIncorrect (c): 'Far from undermining privacy' is illogical, since consolidating surveillance does undermine privacy (killer in blank 1).\nIncorrect (d): One strips something away; one cannot 'strip them in a veneer' (killer in blank 3).","archetype":"Cloze 3-blank","status":"approved","flags":[],"verified":"ok","verNote":"G1: every key word checked for meaning, collocation and register; each distractor set has exactly one killer."},{"id":"IPMAT_VARC_075","section":"VA","format":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.","kind":"mcq","passage":null,"stem":"The historian's ___ prose, dense with footnotes and nested clauses, has kept her work ___ to the general reader, though specialists regard it as ___.","options":["limpid; impenetrable; seminal","convoluted; congenial; authoritative","labyrinthine; inaccessible; indispensable","tortuous; opaque; dispensable"],"answer":"labyrinthine; inaccessible; indispensable","answerIndex":2,"tags":["polarity-flip","polarity-flip","KEY","polarity-flip"],"optionTags":["va-polarity-flip","va-polarity-flip",null,"va-polarity-flip"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): 'Labyrinthine' (intricate, maze-like) matches 'dense with footnotes and nested clauses'; such prose keeps a book 'inaccessible' to lay readers; 'though' signals that specialists value it, so 'indispensable'.\nIncorrect (a): 'Limpid' means clear and easy to read, contradicting 'dense' (killer in blank 1).\nIncorrect (b): 'Congenial' (pleasant, agreeable) is the opposite of what dense prose does to a general reader (killer in blank 2).\nIncorrect (d): 'Dispensable' destroys the contrast that 'though' requires (killer in blank 3).","archetype":"Cloze 3-blank","status":"approved","flags":[],"verified":"ok","verNote":"G1: every key word checked for meaning, collocation and register; each distractor set has exactly one killer."},{"id":"IPMAT_VARC_076","section":"VA","format":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.","kind":"mcq","passage":null,"stem":"Chronic sleep deprivation does more than leave us ___; over time it can ___ the body's ability to regulate blood sugar and ___ the risk of heart disease.","options":["drowsy; enhance; elevate","groggy; impair; heighten","lethargic; disrupt; mitigate","alert; compromise; raise"],"answer":"groggy; impair; heighten","answerIndex":1,"tags":["polarity-flip","KEY","polarity-flip","polarity-flip"],"optionTags":["va-polarity-flip",null,"va-polarity-flip","va-polarity-flip"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): Lack of sleep leaves us 'groggy' (dazed, sluggish); over time it can 'impair' (weaken) blood-sugar regulation and 'heighten' heart-disease risk. Every word points the harmful way the sentence requires.\nIncorrect (a): 'Enhance' would mean sleep loss improves blood-sugar control (killer in blank 2).\nIncorrect (c): 'Mitigate' means reduce, so the risk would fall (killer in blank 3).\nIncorrect (d): 'Alert' is the opposite of what sleep deprivation leaves us (killer in blank 1).","archetype":"Cloze 3-blank","status":"approved","flags":[],"verified":"ok","verNote":"G1: every key word checked for meaning, collocation and register; each distractor set has exactly one killer."},{"id":"IPMAT_VARC_077","section":"VA","format":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.","kind":"mcq","passage":null,"stem":"The treaty was hailed as a breakthrough, but its provisions were so ___ that each signatory could ___ them to suit its own interests, rendering the agreement largely ___.","options":["elastic; construe; toothless","pliable; interpret; binding","rigid; bend; ineffectual","vague; ratify; hollow"],"answer":"elastic; construe; toothless","answerIndex":0,"tags":["KEY","polarity-flip","polarity-flip","category-error"],"optionTags":[null,"va-polarity-flip","va-polarity-flip","va-category-error"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nCorrect (a): 'Elastic' provisions can be stretched; each state could 'construe' (interpret) them as it liked; so the treaty became 'toothless', unable to bind anyone. The 'but' after 'hailed as a breakthrough' demands this deflating sense.\nIncorrect (b): 'Binding' says the treaty ends up enforceable, contradicting the whole sentence (killer in blank 3).\nIncorrect (c): 'Rigid' provisions cannot be bent to suit anyone (killer in blank 1).\nIncorrect (d): To 'ratify' is to approve formally; states do not ratify provisions to suit their interests, so the verb is the wrong kind of act (killer in blank 2).","archetype":"Cloze 3-blank","status":"approved","flags":[],"verified":"ok","verNote":"G1: every key word checked for meaning, collocation and register; each distractor set has exactly one killer."},{"id":"IPMAT_VARC_078","section":"VA","format":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.","kind":"mcq","passage":null,"stem":"Far from being ___ figures content to follow orders, the mid-level bureaucrats in the study proved remarkably ___, bending rules and ___ superiors to push projects past the approval stage.","options":["docile; enterprising; obeying","assertive; inventive; coaxing","passive; resourceful; cajoling","inert; hidebound; persuading"],"answer":"passive; resourceful; cajoling","answerIndex":2,"tags":["polarity-flip","polarity-flip","KEY","polarity-flip"],"optionTags":["va-polarity-flip","va-polarity-flip",null,"va-polarity-flip"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nCorrect (c): 'Far from being passive figures content to follow orders' sets up a contrast. The bureaucrats were 'resourceful', bending rules and 'cajoling' (coaxing by flattery) superiors.\nIncorrect (a): 'Obeying superiors' clashes with 'bending rules' and with the contrast the sentence sets up (killer in blank 3).\nIncorrect (b): 'Assertive' cannot describe figures 'content to follow orders' (killer in blank 1).\nIncorrect (d): 'Hidebound' (rigidly conventional) contradicts 'bending rules' (killer in blank 2).","archetype":"Cloze 3-blank","status":"approved","flags":[],"verified":"ok","verNote":"G1: every key word checked for meaning, collocation and register; each distractor set has exactly one killer."},{"id":"IPMAT_VARC_079","section":"VA","format":"Some of the sentences below have words that are missing. Choose the best option from those given below to complete them.","kind":"mcq","passage":null,"stem":"The monsoon's increasingly ___ behaviour, with long dry spells ___ by sudden deluges, has left farmers unable to plan their sowing and crop insurers ___ to price the risk.","options":["capricious; interrupted; eager","erratic; punctuated; struggling","predictable; broken; scrambling","fitful; prolonged; hard-pressed"],"answer":"erratic; punctuated; struggling","answerIndex":1,"tags":["polarity-flip","KEY","polarity-flip","polarity-flip"],"optionTags":["va-polarity-flip",null,"va-polarity-flip","va-polarity-flip"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nCorrect (b): 'Erratic' behaviour fits dry spells and deluges; the dry spells are 'punctuated' (interrupted at intervals) by sudden rain; insurers are 'struggling' to price such risk.\nIncorrect (a): 'Eager to price the risk' contradicts the difficulty the sentence describes (killer in blank 3).\nIncorrect (c): A 'predictable' monsoon would not leave farmers unable to plan (killer in blank 1).\nIncorrect (d): Deluges interrupt dry spells; they cannot 'prolong' them, so the second word reverses the sense (killer in blank 2).","archetype":"Cloze 3-blank","status":"approved","flags":[],"verified":"ok","verNote":"G1: every key word checked for meaning, collocation and register; each distractor set has exactly one killer."},{"id":"IPMAT_VARC_080","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Interviewer: Farm ponds have become the showpiece of drought policy. Districts announce targets, and the numbers dug each year are read out like cricket scores. Is it a success story?\n\nHydrologist: For the farmer who digs one, very often it is. A pond lets him water a crop through a dry fortnight that would otherwise have finished it, and I would not want to take that from him. My difficulty is with the scoreboard. A pond doesn't make water. It catches water that was already on its way somewhere.\n\nInterviewer: On its way where?\n\nHydrologist: Downhill: to a stream, to a village tank, into the ground further down the slope. In most hard-rock regions of the Deccan the soil is thin and the aquifers are shallow, so runoff is not a surplus that nobody was using. When enough ponds go in upstream, less water reaches the stream; the tank below fills later and emptier; and the farmers who depend on that tank start pumping their wells harder, which drains the aquifer they all share. None of them was consulted when the ponds were dug. Each pond, if you like, is a small loan taken from a neighbour who was never asked.\n\nInterviewer: But officials would say the ponds also recharge groundwater.\n\nHydrologist: Some do, where they are left unlined. But a great many are now lined with plastic sheet precisely so that they won't leak, which is to say, so that they won't recharge anything. And the water in them is often topped up from borewells, so the pond ends up as a storage tank for groundwater that has been pumped out and left to evaporate in the sun.\n\nInterviewer: So you would stop building them?\n\nHydrologist: No. I'd stop counting them. The number of ponds tells you how much digging happened. It tells you nothing about how much water there is. Draw a line round a whole watershed, add up what comes in as rain and what leaves as crops, evaporation and flow, and you often find that a district which has built ten thousand ponds has not gained a litre. It has moved water from the lower farms to the upper ones, and from the ground to the air. Whether that is a good trade is a real question. But it is a question about who gets the water, and we have been answering it as though it were a question about how much there is.","stem":"According to the hydrologist, farmers who rely on the village tank end up pumping their wells harder because","options":["ponds upstream are topped up from the same aquifer","lined ponds upstream no longer let runoff recharge their wells","their tank tends to fill later and emptier as ponds multiply upstream","the stream feeding their tank now dries up before the rains"],"answer":"their tank tends to fill later and emptier as ponds multiply upstream","answerIndex":2,"tags":["rc-false-link","rc-false-link","KEY","rc-extreme"],"optionTags":["rc-false-link","rc-false-link",null,"rc-extreme"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nExplanation: The hydrologist gives a chain: when enough ponds go in upstream, less water reaches the stream, 'the tank below fills later and emptier', and the farmers who depend on that tank 'start pumping their wells harder'.\nCorrect (c): The shortfall in the tank is the link that sends them to their wells.\nLead distractor (a): Both halves appear in the interview (ponds are 'often topped up from borewells'; the downstream farmers share an aquifer), but the hydrologist never connects pond top-ups to why the tank farmers pump more. Right facts, wrong link.\nIncorrect (b): Lined ponds do stop recharge, but the hydrologist makes that point about the ponds themselves, in answer to the officials. The downstream farmers pump harder because their tank is short, not because lining starves their wells.\nIncorrect (d): One notch too strong. The hydrologist says 'less water reaches the stream', not that it dries up.","archetype":"RC slot A: detail completion","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_081","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Interviewer: Farm ponds have become the showpiece of drought policy. Districts announce targets, and the numbers dug each year are read out like cricket scores. Is it a success story?\n\nHydrologist: For the farmer who digs one, very often it is. A pond lets him water a crop through a dry fortnight that would otherwise have finished it, and I would not want to take that from him. My difficulty is with the scoreboard. A pond doesn't make water. It catches water that was already on its way somewhere.\n\nInterviewer: On its way where?\n\nHydrologist: Downhill: to a stream, to a village tank, into the ground further down the slope. In most hard-rock regions of the Deccan the soil is thin and the aquifers are shallow, so runoff is not a surplus that nobody was using. When enough ponds go in upstream, less water reaches the stream; the tank below fills later and emptier; and the farmers who depend on that tank start pumping their wells harder, which drains the aquifer they all share. None of them was consulted when the ponds were dug. Each pond, if you like, is a small loan taken from a neighbour who was never asked.\n\nInterviewer: But officials would say the ponds also recharge groundwater.\n\nHydrologist: Some do, where they are left unlined. But a great many are now lined with plastic sheet precisely so that they won't leak, which is to say, so that they won't recharge anything. And the water in them is often topped up from borewells, so the pond ends up as a storage tank for groundwater that has been pumped out and left to evaporate in the sun.\n\nInterviewer: So you would stop building them?\n\nHydrologist: No. I'd stop counting them. The number of ponds tells you how much digging happened. It tells you nothing about how much water there is. Draw a line round a whole watershed, add up what comes in as rain and what leaves as crops, evaporation and flow, and you often find that a district which has built ten thousand ponds has not gained a litre. It has moved water from the lower farms to the upper ones, and from the ground to the air. Whether that is a good trade is a real question. But it is a question about who gets the water, and we have been answering it as though it were a question about how much there is.","stem":"It can be inferred from the interview that a lined pond topped up from a borewell","options":["would probably serve its owner better than an unlined pond","returns to the aquifer through seepage the water its owner pumped out","stores water that would otherwise have been lost to the watershed","may leave the watershed with less water than it had before"],"answer":"may leave the watershed with less water than it had before","answerIndex":3,"tags":["rc-false-link","rc-reversal","rc-out-of-scope","KEY"],"optionTags":["rc-false-link","rc-reversal","rc-reversal",null],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: A lined pond cannot recharge anything, and when it is filled from a borewell it becomes 'a storage tank for groundwater that has been pumped out and left to evaporate in the sun'. Water moves 'from the ground to the air'.\nCorrect (d): Pumped groundwater lost to evaporation is water the watershed no longer has; 'may' keeps the inference at the strength the interview supports.\nLead distractor (a): Plausible because lining stops the pond losing water, but the interview links lining only to the end of recharge ('so that they won't recharge anything'), never to a better return for the owner.\nIncorrect (b): Reverses the interview. Lined ponds are built 'so that they won't leak', so no water seeps back; the pumped water is 'left to evaporate in the sun'.\nIncorrect (c): Reverses the interview. The water was not on its way out; it was groundwater the watershed already held, and the pond sends it 'from the ground to the air'.","archetype":"RC slot B: inference completion","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_082","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Interviewer: Farm ponds have become the showpiece of drought policy. Districts announce targets, and the numbers dug each year are read out like cricket scores. Is it a success story?\n\nHydrologist: For the farmer who digs one,

ut how much there is.","stem":"The hydrologist's description of each pond as 'a small loan taken from a neighbour who was never asked' suggests that","options":["ponds are often dug with money borrowed from nearby farmers","the water a pond holds may one day have to be repaid","downstream farmers would object to the ponds if consulted","a pond's benefit is probably paid for by people further downstream"],"answer":"a pond's benefit is probably paid for by people further downstream","answerIndex":3,"tags":["rc-literal","rc-literal","rc-word-match","KEY"],"optionTags":["rc-literal","rc-literal","rc-word-match",null],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: The line comes straight after the chain of upstream ponds, emptier tanks and harder-pumped wells, and after 'None of them was consulted'. The loan is water taken from downstream users who had no say.\nCorrect (d): The 'loan' is the water the pond keeps; the lender is the downstream user whose tank and wells get less. 'Paid for by people further downstream' names who bears the cost; 'probably' matches the hydrologist's hedged 'if you like'.\nLead distractor (a): Reads 'loan' literally, as money. The interview is about water, not how ponds are financed.\nIncorrect (b): A fair reading of 'loan' on its own (loans are repaid), but the hydrologist says nothing about the water being returned; his point is who loses it.\nIncorrect (c): Borrows 'never asked' and guesses at what the neighbours would say. The hydrologist says they were not consulted; he never says they would object.","archetype":"RC slot D: quoted line","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_083","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Interviewer: Farm ponds have become the showpiece of drought policy. Districts announce targets, and the numbers dug each year are read out like cricket scores. Is it a success story?\n\nHydrologist: For the farmer who digs one, very often it is. A pond lets him water a crop through a dry fortnight that would otherwise have finished it, and I would not want to take that from him. My difficulty is with the scoreboard. A pond doesn't make water. It catches water that was already on its way somewhere.\n\nInterviewer: On its way where?\n\nHydrologist: Downhill: to a stream, to a village tank, into the ground further down the slope. In most hard-rock regions of the Deccan the soil is thin and the aquifers are shallow, so runoff is not a surplus that nobody was using. When enough ponds go in upstream, less water reaches the stream; the tank below fills later and emptier; and the farmers who depend on that tank start pumping their wells harder, which drains the aquifer they all share. None of them was consulted when the ponds were dug. Each pond, if you like, is a small loan taken from a neighbour who was never asked.\n\nInterviewer: But officials would say the ponds also recharge groundwater.\n\nHydrologist: Some do, where they are left unlined. But a great many are now lined with plastic sheet precisely so that they won't leak, which is to say, so that they won't recharge anything. And the water in them is often topped up from borewells, so the pond ends up as a storage tank for groundwater that has been pumped out and left to evaporate in the sun.\n\nInterviewer: So you would stop building them?\n\nHydrologist: No. I'd stop counting them. The number of ponds tells you how much digging happened. It tells you nothing about how much water there is. Draw a line round a whole watershed, add up what comes in as rain and what leaves as crops, evaporation and flow, and you often find that a district which has built ten thousand ponds has not gained a litre. It has moved water from the lower farms to the upper ones, and from the ground to the air. Whether that is a good trade is a real question. But it is a question about who gets the water, and we have been answering it as though it were a question about how much there is.","stem":"Which of the following is NOT a claim made by the hydrologist?","options":["Most farm ponds today are lined with plastic to stop leaks.","In most hard-rock Deccan regions, runoff is not a surplus nobody uses.","A pond can see a crop through a dry fortnight.","A count of ponds measures digging done, not the water that exists."],"answer":"Most farm ponds today are lined with plastic to stop leaks.","answerIndex":0,"tags":["KEY","rc-scope-shift","rc-true-not-answer","rc-true-not-answer"],"optionTags":[null,"rc-scope-shift","rc-true-not-answer","rc-true-not-answer"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nExplanation: Three options paraphrase the interview; one pushes a scoped claim one notch too far.\nCorrect (a): The hydrologist says 'a great many are now lined with plastic sheet'. 'A great many' is not 'most', so the statement claims more than he did, which makes it the one he did NOT make.\nLead distractor (b): It looks like a scope shift because of 'most', but the hydrologist himself says 'In most hard-rock regions of the Deccan … runoff is not a surplus that nobody was using'. This claim is made.\nIncorrect (c): Made in his first answer: a pond lets the farmer 'water a crop through a dry fortnight that would otherwise have finished it'.\nIncorrect (d): Made in his last answer: 'The number of ponds tells you how much digging happened. It tells you nothing about how much water there is.'","archetype":"RC slot E: negative stem","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_084","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Interviewer: Farm ponds have become the showpiece of drought policy. Districts announce targets, and the numbers dug each year are read out like cricket scores. Is it a success story?\n\nHydrologist: For the farmer who digs one, very often it is. A pond lets him water a crop through a dry fortnight that would otherwise have finished it, and I would not want to take that from him. My difficulty is with the scoreboard. A pond doesn't make water. It catches water that was already on its way somewhere.\n\nInterviewer: On its way where?\n\nHydrologist: Downhill: to a stream, to a village tank, into the ground further down the slope. In most hard-rock regions of the Deccan the soil is thin and the aquifers are shallow, so runoff is not a surplus that nobody was using. When enough ponds go in upstream, less water reaches the stream; the tank below fills later and emptier; and the farmers who depend on that tank start pumping their wells harder, which drains the aquifer they all share. None of them was consulted when the ponds were dug. Each pond, if you like, is a small loan taken from a neighbour who was never asked.\n\nInterviewer: But officials would say the ponds also recharge groundwater.\n\nHydrologist: Some do, where they are left unlined. But a great many are now lined with plastic sheet precisely so that they won't leak, which is to say, so that they won't recharge anything. And the water in them is often topped up from borewells, so the pond ends up as a storage tank for groundwater that has been pumped out and left to evaporate in the sun.\n\nInterviewer: So you would stop building them?\n\nHydrologist: No. I'd stop counting them. The number of ponds tells you how much digging happened. It tells you nothing about how much water there is. Draw a line round a whole watershed, add up what comes in as rain and what leaves as crops, evaporation and flow, and you often find that a district which has built ten thousand ponds has not gained a litre. It has moved water from the lower farms to the upper ones, and from the ground to the air. Whether that is a good trade is a real question. But it is a question about who gets the water, and we have been answering it as though it were a question about how much there is.","stem":"The hydrologist's central argument is that farm ponds","options":["do more harm than good wherever they are lined with plastic","should be built only where they can recharge the aquifer","move water between users without adding to the total","show that drought policy counts effort, not results"],"answer":"move water between users without adding to the total","answerIndex":2,"tags":["rc-scope-shift","rc-out-of-scope","KEY","rc-scope-shift"],"optionTags":["rc-scope-shift","rc-out-of-scope",null,"rc-scope-shift"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nExplanation: The thesis comes at the end: a district with ten thousand ponds 'has not gained a litre'; it has 'moved water from the lower farms to the upper ones'. The real question is 'who gets the water', not 'how much there is'.\nCorrect (c): 'move water between users' = lower farms to upper; 'without adding to the total' = not a litre gained.\nLead distractor (a): Narrows the thesis to lined ponds. Lining is one detail (in reply to the officials); the argument covers every pond, lined or not: a pond 'doesn't make water', it catches water already on its way somewhere.\nIncorrect (b): A rule the hydrologist never proposes. He grants that unlined ponds recharge, but his conclusion is to 'stop counting them', and he treats who gets the water as the real question.\nIncorrect (d): Broader than his argument. The scoreboard criticism supports the thesis, but his claim is about how water is distributed, not about drought policy in general.","archetype":"RC slot C: main idea","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_085","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Interviewer: Farm ponds have become the showpiece of drought policy. Districts announce targets, and the numbers dug each year are read out like cricket scores. Is it a success story?\n\nHydrologist: For the farmer who digs one, very often it is. A pond lets him water a crop through a dry fortnight that would otherwise have finished it, and I would not want to take that from him. My difficulty is with the scoreboard. A pond doesn't make water. It catches water that was already on its way somewhere.\n\nInterviewer: On its way where?\n\nHydrologist: Downhill: to a stream, to a village tank, into the ground further down the slope. In most hard-rock regions of the Deccan the soil is thin and the aquifers are shallow, so runoff is not a surplus that nobody was using. When enough ponds go in upstream, less water reaches the stream; the tank below fills later and emptier; and the farmers who depend on that tank start pumping their wells harder, which drains the aquifer they all share. None of them was consulted when the ponds were dug. Each pond, if you like, is a small loan taken from a neighbour who was never asked.\n\nInterviewer: But officials would say the ponds also recharge groundwater.\n\nHydrologist: Some do, where they are left unlined. But a great many are now lined with plastic sheet precisely so that they won't leak, which is to say, so that they won't recharge anything. And the water in them is often topped up from borewells, so the pond ends up as a storage tank for groundwater that has been pumped out and left to evaporate in the sun.\n\nInterviewer: So you would stop building them?\n\nHydrologist: No. I'd stop counting them. The number of ponds tells you how much digging happened. It tells you nothing about how much water there is. Draw a line round a whole watershed, add up what comes in as rain and what leaves as crops, evaporation and flow, and you often find that a district which has built ten thousand ponds has not gained a litre. It has moved water from the lower farms to the upper ones, and from the ground to the air. Whether that is a good trade is a real question. But it is a question about who gets the water, and we have been answering it as though it were a question about how much there is.","stem":"As used in the hydrologist's final answer, 'trade' most nearly means","options":["a line of business","an exchange of one thing for another","a bargain agreed between parties","a commercial deal made for profit"],"answer":"an exchange of one thing for another","answerIndex":1,"tags":["vocab-context-blind","KEY","vocab-shade","vocab-shade"],"optionTags":["vocab-context-blind",null,"vocab-shade","vocab-shade"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nExplanation: 'Whether that is a good trade' refers to what the district has done: water moved from lower farms to upper ones and from the ground to the air, a gain for some bought with losses elsewhere.\nCorrect (b): 'An exchange of one thing for another' is the sense of trade-off meant here.\nLead distractor (a): The common noun sense ('the textile trade'), which ignores the context.\nIncorrect (c): Keeps the idea of exchange but adds agreement. The downstream farmers were 'never asked', so nothing was agreed.\nIncorrect (d): Keeps the idea of exchange but adds commerce and profit; no one is buying or selling water in the passage.","archetype":"RC slot F: vocabulary in context","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_086","section":"VA","format":"The sentences given in each of the following questions, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order of the sentences and key in this sequence of numbers as your answer. (For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.)","kind":"tita","passage":"1. Under colonial rule, however, piped water and hand pumps were promoted as more hygienic, and many stepwells were filled in or left to silt up.\n2. Dug deep into the ground, they reached down to the water table, and their long flights of steps let villagers follow the water as it fell through the dry season.\n3. Only now, as groundwater levels fall, are planners returning to them, not as monuments but as recharge structures.\n4. Stepwells were once the lifeline of villages across the semi-arid plains of western India.\n5. Their shaded galleries also stayed markedly cooler than the land above, which made them places of gathering as much as of drawing water.","stem":"Enter the correct sequence of the sentences.","options":[],"answer":"42513","answerIndex":null,"tags":[],"titaTraps":{"42153":"pj-connector","45213":"pj-connector"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 42513\n4 opens: it names the subject ('Stepwells') with a full noun phrase and needs nothing before it.\n2 follows: 'they' needs the antecedent 'stepwells', and it describes how they worked.\n5 comes next: 'also' adds a second function to the one in 2.\n1 turns the story: 'however' marks the decline after the positive account.\n3 closes: 'Only now … returning to them' presupposes the abandonment described in 1.","archetype":"Parajumble TITA","status":"approved","flags":[],"verified":"ok","verNote":"G1: uniqueness checked sentence by sentence: opener has a full noun phrase and no back-reference; every other sentence carries a referent or connector that fixes its predecessor; the two nearest alternative orders are listed in titaTraps with the reference each breaks.","titaTrapNotes":{"42153":"Places the decline (1) before 5, stranding 'also' after the story has turned.","45213":"Puts 5 before 2; 'also' then has no earlier function to add to."}},{"id":"IPMAT_VARC_087","section":"VA","format":"The sentences given in each of the following questions, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order of the sentences and key in this sequence of numbers as your answer. (For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.)","kind":"tita","passage":"1. Many of these patients, with conditions such as irritable bowel syndrome, still reported substantial relief.\n2. If so, the placebo is less a trick to be controlled for than a treatment to be understood.\n3. For decades, the placebo effect was treated as a nuisance, a statistical noise that drug trials had to subtract.\n4. The finding suggests that what heals may be not deception but ritual: the act of taking a pill, from a doctor, with care.\n5. That assumption began to crack when researchers tried something that seemed absurd: telling patients openly that the pills they were taking contained nothing at all.","stem":"Enter the correct sequence of the sentences.","options":[],"answer":"35142","answerIndex":null,"tags":[],"titaTraps":{"31542":"pj-antecedent","35124":"pj-connector"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 35142\n3 opens: a general claim about how placebos were long viewed, with no back-reference.\n5 follows: 'That assumption' refers to treating the placebo as noise.\n1 comes next: 'these patients' needs the patients introduced in 5.\n4 interprets: 'The finding' is the relief reported in 1.\n2 closes: 'If so' conditions on the suggestion in 4 and draws the broad conclusion.","archetype":"Parajumble TITA","status":"approved","flags":["fact check: open-label placebo relief in IBS patients"],"verified":"ok","verNote":"G1: uniqueness checked sentence by sentence: opener has a full noun phrase and no back-reference; every other sentence carries a referent or connector that fixes its predecessor; the two nearest alternative orders are listed in titaTraps with the reference each breaks.","titaTrapNotes":{"31542":"Uses 'these patients' (1) before any patients are introduced.","35124":"Closes on 4, leaving 'If so' in 2 with nothing to condition on."}},{"id":"IPMAT_VARC_088","section":"VA","format":"The sentences given in each of the following questions, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order of the sentences and key in this sequence of numbers as your answer. (For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.)","kind":"tita","passage":"1. Their power lies in accumulation, since a user who meets dozens of them a day gradually stops noticing that choices are being made for her.\n2. 'Dark patterns' is the name designers give to interface tricks that steer users into choices they did not intend to make.\n3. It is this quiet erosion of attention, rather than any single deception, that regulators are now trying to address.\n4. A cancel button rendered in faint grey, a pre-ticked box that signs you up for newsletters, a countdown timer that resets whenever the page is reloaded: each of these tricks is small enough to seem harmless.","stem":"Enter the correct sequence of the sentences.","options":[],"answer":"2413","answerIndex":null,"tags":[],"titaTraps":{"2143":"pj-conclusion-early","4213":"pj-antecedent"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 2413\n2 opens: it names and defines 'dark patterns' and needs nothing before it.\n4 follows: 'each of these tricks' needs the 'interface tricks' introduced in 2, so the list cannot open.\n1 comes next: 'Their power lies in accumulation' answers 4's 'small enough to seem harmless'. Each trick is minor, but together they wear the user down.\n3 closes: 'this quiet erosion of attention' refers to the gradual not-noticing in 1.","archetype":"Parajumble TITA","status":"approved","flags":[],"verified":"ok","verNote":"G1: uniqueness checked sentence by sentence: opener has a full noun phrase and no back-reference; every other sentence carries a referent or connector that fixes its predecessor; the two nearest alternative orders are listed in titaTraps with the reference each breaks.","titaTrapNotes":{"2143":"Puts the accumulation point before the examples, so 'small enough to seem harmless' comes after it has already been answered.","4213":"Opens with the list, but 'these tricks' has no antecedent until 2 introduces them."}},{"id":"IPMAT_VARC_089","section":"VA","format":"The sentences given in each of the following questions, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order of the sentences and key in this sequence of numbers as your answer. (For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.)","kind":"tita","passage":"1. For all such triumphs, the survey's purpose was never merely scientific; a map precise to the metre was also an instrument of administration and revenue.\n2. Each new triangle then became the base for the next, so that a chain of them could be carried across hundreds of kilometres of plain and forest.\n3. In 1802 the British began what would become the Great Trigonometrical Survey, an attempt to measure the Indian subcontinent with mathematical precision.\n4. Its method was triangulation: from a carefully measured baseline, surveyors calculated the positions of distant points by measuring angles alone.\n5. The work took decades, and it was in the course of it that a peak in the Himalayas, known to the survey only as Peak XV, was found to be the highest in the world.","stem":"Enter the correct sequence of the sentences.","options":[],"answer":"34251","answerIndex":null,"tags":[],"titaTraps":{"32451":"pj-antecedent","34215":"pj-antecedent"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 34251\n3 opens: a dated introduction of the survey with a full noun phrase.\n4 follows: 'Its method' refers to the survey and introduces triangulation.\n2 comes next: 'Each new triangle then' extends the method just described.\n5 follows: 'The work took decades' sums up the chain of triangles and brings in Peak XV.\n1 closes: 'such triumphs' needs the discovery in 5, and it turns to the survey's non-scientific purpose.","archetype":"Parajumble TITA","status":"approved","flags":["fact check: GTS start year 1802; Peak XV"],"verified":"ok","verNote":"G1: uniqueness checked sentence by sentence: opener has a full noun phrase and no back-reference; every other sentence carries a referent or connector that fixes its predecessor; the two nearest alternative orders are listed in titaTraps with the reference each breaks.","titaTrapNotes":{"32451":"'Each new triangle' comes before triangulation is explained.","34215":"Places the purpose sentence before Peak XV, so 'such triumphs' has no triumph to refer to."}},{"id":"IPMAT_VARC_090","section":"VA","format":"The sentences given in each of the following questions, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order of the sentences and key in this sequence of numbers as your answer. (For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.)","kind":"tita","passage":"1. This has led some researchers to suggest that the octopus experiences its body less as a single self than as a loose federation.\n2. The octopus has around five hundred million neurons, a number closer to that of a dog than to that of any other invertebrate.\n3. Whether such a federation can be said to have one mind or several is a question our vocabulary, built around vertebrate brains, is poorly equipped to answer.\n4. Each arm can therefore taste, touch and even make simple decisions without instruction from the centre.\n5. Yet two-thirds of those neurons are not in its brain at all but distributed along its eight arms.","stem":"Enter the correct sequence of the sentences.","options":[],"answer":"25413","answerIndex":null,"tags":[],"titaTraps":{"24513":"pj-connector","25431":"pj-antecedent"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 25413\n2 opens: it introduces the octopus and its neuron count, with no back-reference.\n5 follows: 'Yet … those neurons' needs the count in 2 and qualifies it.\n4 comes next: 'therefore' draws the consequence of neurons sitting in the arms.\n1 follows: 'This' is the arms' independent decision-making, and it introduces the word 'federation'.\n3 closes: 'such a federation' needs 1, and it ends on the open question.","archetype":"Parajumble TITA","status":"approved","flags":["fact check: ~500 million neurons, two-thirds in the arms"],"verified":"ok","verNote":"G1: uniqueness checked sentence by sentence: opener has a full noun phrase and no back-reference; every other sentence carries a referent or connector that fixes its predecessor; the two nearest alternative orders are listed in titaTraps with the reference each breaks.","titaTrapNotes":{"24513":"'therefore' in 4 comes before the fact (5) that justifies it.","25431":"Puts 3 before 1, so 'such a federation' comes before any federation is mentioned."}}];

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
  var mb=document.getElementById("mrkBtn");if(mb)mb.style.display="none";
 }
 renderQuestion();
 snSaveSession();
}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";

function showSecBanner(){

function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();

 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;

  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulHTML(el,t){el.textContent="";String(t).split(/(\[\[.*?\]\])/).forEach(function(p){var m=p.match(/^\[\[(.*)\]\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else if(p)el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(isMCQ(q)?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulHTML(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function topicOf(q){var f=String(q.format||"");
 if(/^Read the following passage/.test(f))return "RC";
 if(/^Complete the following sentences/.test(f))return "Sentence Completion";
 if(/incorrect part of the sentence is underlined/.test(f))return "Sentence Correction";
 if(/sentence missing which is indicated by a blank/.test(f))return "Paragraph Completion";
 if(/words that are missing/.test(f))return "Cloze";
 if(/properly sequenced/.test(f))return "Parajumble";
 return f.slice(0,40)}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   var tk=topicOf(q);topicErrorMap[tk]=(topicErrorMap[tk]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   writeWrapped("Your answer: "+(skippedQ?"-":a),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

/* ==================== PAGE LOAD ==================== */
document.getElementById("lgTitle").textContent=TEST_NAME;
var lgTime=CFG.rapid?("per-question clock \u00b7 forward only \u00b7 auto-advance at 0s \u00b7 ~"+CFG.minutes+" min total"):SEC?(SEC.map(function(p){return p.sec+" "+p.minutes+"m"}).join(" \u2192 ")+" \u00b7 sectional lock \u00b7 no return"):(CFG.minutes+" minutes \u00b7 "+(CFG.navNote||"free navigation"));
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 TITA wrong "+(CFG.titaWSec?QUESTIONS.filter(function(q){return !isMCQ(q)}).map(function(q){return q.section}).filter(function(v,i,a){return a.indexOf(v)===i}).map(function(sec){return sec+" "+titaWFor({section:sec})}).join(", "):CFG.titaW):"")+" \u00b7 Max "+MAX_MARKS+"<br>"+lgTime+" \u00b7 auto-submit at 00:00";
/* ==================== AVAILABILITY WINDOW (IST) ==================== */
var WINDOW={opensAt:Date.UTC(2026,8,27,18,30,0),  /* Mon 28 Sep 2026, 00:00 IST */
            closesAt:Date.UTC(2026,8,30,18,30,0) /* Thu 1 Oct 2026, 00:00 IST */};
function windowState(){var n=Date.now();if(n<WINDOW.opensAt)return "before";if(n>=WINDOW.closesAt)return "after";return "open"}
function enforceWindow(){
 var st=windowState();
 var b=document.getElementById("winBanner"),btn=document.getElementById("loginBtn");
 if(st==="open"){if(b)b.style.display="none";if(btn){btn.disabled=false;btn.style.opacity="1";btn.textContent="Start Test"}return true}
 var msg=st==="before"
  ?"This challenge opens Monday 28 September, 12:00 AM IST and closes Thursday 1 October, 12:00 AM IST."
  :"This challenge window has closed (it ran 28\u201330 September). Scores are no longer accepted.";
 if(b){b.style.display="block";b.textContent=msg}
 if(btn){btn.disabled=true;btn.style.opacity=".45";btn.textContent=st==="before"?"Opens Soon":"Window Closed"}
 return false;
}
document.getElementById("loginBtn").addEventListener("click",function(){if(enforceWindow())startTest()});
enforceWindow();
setInterval(enforceWindow,30000);
snFlushQueue();
snTryResume();

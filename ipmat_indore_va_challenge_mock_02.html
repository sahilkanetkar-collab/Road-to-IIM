var QUESTIONS=[{"id":"IPMAT_VARC_046","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Every few months another Indian city cuts the ribbon on a metro line, and every few months, a year or so later, a small embarrassed story appears on an inside page: ridership is a fraction of what the project report promised. The explanations offered by the operators have hardened into a liturgy. Fares are too high, they say; people are attached to their two-wheelers; commuting habits take a generation to change.\n\nSome of this is true. Fares do matter, and for the poorest riders a single journey can cost more than a kilo of tomatoes. But the liturgy has one convenient feature: every item on it locates the failure in the passenger. None of it asks what the passenger meets on the way to the train.\n\nWhat she meets, in most of the newer systems, is a highway. Stations have been placed where land was cheapest to acquire and alignments easiest to approve, which usually means the median of an arterial road. The footpath leading to them, where it exists, ends abruptly at a flyover ramp. So the rider who would walk must instead hire an autorickshaw for the last kilometre, and once that fare is paid at both ends, the metro trip costs more than the bus it was meant to replace and saves her barely ten minutes. She goes back to the bus, and the operator records her as a person with old habits.\n\nIn two cities the pattern has been broken, and not by cutting fares. Their stations were built with covered walkways, feeder buses timed to the trains and bicycle stands that are actually guarded. Ridership there climbed within a year, a speed that sits oddly with the claim that habits take a generation.\n\nPlanners like to describe a metro as the spine of a city. A spine, though, is useless without the nerves that run out from it, and we have been building spines and calling the job done. The stations stand along the highways like lighthouses on a coast no boat can reach. A metro line is not judged by its trains, which are usually excellent, but by the five hundred metres around each station: the least glamorous stretch of any project, and the only one the passenger cannot avoid.","stem":"According to the writer, stations in most of the newer systems stand on road medians because","options":["every city chose the alignment that was easiest to approve","that was where land came cheapest and approvals came most easily","flyover ramps made roadside footpaths too costly to build there","planners wanted the stations visible from far along the road"],"answer":"that was where land came cheapest and approvals came most easily","answerIndex":1,"tags":["rc-scope-shift","KEY","rc-false-link","rc-out-of-scope"],"optionTags":["rc-scope-shift",null,"rc-false-link","rc-out-of-scope"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nExplanation: Paragraph 3 says the stations in most newer systems were put where land was cheapest to acquire and alignments easiest to approve, 'which usually means the median of an arterial road'.\nCorrect (b): 'land came cheapest and approvals came most easily' restates both reasons the writer gives.\nLead distractor (a): It keeps one of the two reasons but widens 'most of the newer systems' to 'every city', and drops the land cost. The writer is careful to say 'most', and in paragraph 4 two cities did things differently.\nIncorrect (c): Flyover ramps and footpaths are in paragraph 3, but as what riders meet on the way to a station, not as the reason stations were put on medians. Right details, wrong link.\nIncorrect (d): Visibility is never mentioned as a planning goal. It borrows the lighthouse image from the last paragraph and turns it into a motive.","archetype":"RC slot A: detail completion","status":"approved","flags":["mock-plausible: metro ridership pattern and 'two cities' are unnamed comp ddly with the claim that habits take a generation.\n\nPlanners like to describe a metro as the spine of a city. A spine, though, is useless without the nerves that run out from it, and we have been building spines and calling the job done. The stations stand along the highways like lighthouses on a coast no boat can reach. A metro line is not judged by its trains, which are usually excellent, but by the five hundred metres around each station: the least glamorous stretch of any project, and the only one the passenger cannot avoid.","stem":"The writer implies that the operators' explanations for low ridership","options":["are right that habits change slowly, but wrong about fares","are mostly accurate, since fares weigh heavily on the poorest","were invented to hide the errors made in the original project reports","tend to overlook what riders go through to reach a station"],"answer":"tend to overlook what riders go through to reach a station","answerIndex":3,"tags":["rc-wrong-voice","rc-extreme","rc-out-of-scope","KEY"],"optionTags":["rc-wrong-voice","rc-extreme","rc-out-of-scope",null],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (d)\nExplanation: The writer grants 'Some of this is true' (fares do matter), then says the liturgy's 'convenient feature' is that 'every item on it locates the failure in the passenger' and never asks what the passenger meets on the way, which is to say, never looks at how the stations were planned.\nCorrect (d): The liturgy 'locates the failure in the passenger' and 'None of it asks what the passenger meets on the way to the train'. 'Tend to overlook what riders go through to reach a station' is that omission; 'tend to' matches the writer's partial concession ('Some of this is true').\nLead distractor (a): It hands the writer the operators' view. The writer does not accept that habits change slowly; paragraph 4 says ridership 'climbed within a year', which 'sits oddly with the claim'. And he concedes that fares do matter.\nIncorrect (b): The writer concedes 'some', not 'most', and only about fares; this pushes the concession one notch too far.\nIncorrect (c): 'Convenient' is not 'invented to hide'. The writer implies an evasion, not a deliberate cover-up of errors in the reports.","archetype":"RC slot B: inference completion","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_049","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Every few months another Indian city cuts the ribbon on a metro line, and every few months, a year or so later, a small embarrassed story appears on an inside page: ridership is a fraction of what the project report promised. The explanations offered by the operators have hardened into a liturgy. Fares are too high, they say; people are attached to their two-wheelers; commuting habits take a generation to change.\n\nSome of this is true. Fares do matter, and for the poorest riders a single journey can cost more than a kilo of tomatoes. But the liturgy has one convenient feature: every item on it locates the failure in the passenger. None of it asks what the passenger meets on the way to the train.\n\nWhat she meets, in most of the newer systems, is a highway. Stations have been placed where land was cheapest to acquire and alignments easiest to approve, which usually means the median of an arterial road. The footpath leading to them, where it exists, ends abruptly at a flyover ramp. So the rider who would walk must instead hire an autorickshaw for the last kilometre, and once that fare is paid at both ends, the metro trip costs more than the bus it was meant to replace and saves her barely ten minutes. She goes back to the bus, and the operator records her as a person with old habits.\n\nIn two cities the pattern has been broken, and not by cutting fares. Their stations were built with covered walkways, feeder buses timed to the trains and bicycle stands that are actually guarded. Ridership there climbed within a year, a speed that sits oddly with the claim that habits take a generation.\n\nPlanners like to describe a metro as the spine of a city. A spine, though, is useless without the nerves that run out from it, and we have been building spines and calling the job done. The stations stand along the highways like lighthouses on a coast no boat can reach. A metro line is not judged by its trains, which are usually excellent, but by the five hundred metres around each station: the least glamorous stretch of any project, and the only one the passenger cannot avoid.","stem":"By comparing the stations to 'lighthouses on a coast no boat can reach', the writer suggests that they","options":["are fine in themselves but cut off from those they serve","stand out clearly but far from where people live","send out signals that most passengers have learnt to ignore","guide travellers only in conditions that seldom arise"],"answer":"are fine in themselves but cut off from those they serve","answerIndex":0,"tags":["KEY","rc-literal","rc-wrong-voice","rc-out-of-scope"],"optionTags":[null,"rc-literal","rc-wrong-voice","rc-out-of-scope"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (a)\nExplanation: The image closes the writer's case that stations were built without the walkways and feeders that let people reach them. A lighthouse is conspicuous and well built; the trouble is the coast, not the light.\nCorrect (a): 'fine in themselves' = the well-built lighthouse (and trains 'usually excellent'); 'cut off from those they serve' = 'no boat can reach', which the passage explains as the broken footpaths and last-kilometre links.\nLead distractor (b): A fair reading of the words alone (a lighthouse is visible but remote), but the passage places stations on arterial roads within the city. What cuts riders off is the footpath that 'ends abruptly at a flyover ramp', not distance from their homes.\nIncorrect (c): Blaming riders for ignoring the service is the operators' 'old habits' story, which the writer rejects.\nIncorrect (d): Another possible reading of a lighthouse, but nothing in the passage says the metro is useful only in rare conditions.","archetype":"RC slot D: quoted line","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_050","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Every few months another Indian city cuts the ribbon on a metro line, and every few months, a year or so later, a small embarrassed story appears on an inside page: ridership is a fraction of what the project report promised. The explanations offered by the operators have hardened into a liturgy. Fares are too high, they say; people are attached to their two-wheelers; commuting habits take a generation to change.\n\nSome of this is true. Fares do matter, and for the poorest riders a single journey can cost more than a kilo of tomatoes. But the liturgy has one convenient feature: every item on it locates the failure in the passenger. None of it asks what the passenger meets on the way to the train.\n\nWhat she meets, in most of the newer systems, is a highway. Stations have been placed where land was cheapest to acquire and alignments easiest to approve, which usually means the median of an arterial road. The footpath leading to them, where it exists, ends abruptly at a flyover ramp. So the rider who would walk must instead hire an autorickshaw for the last kilometre, and once that fare is paid at both ends, the metro trip costs more than the bus it was meant to replace and saves her barely ten minutes. She goes back to the bus, and the operator records her as a person with old habits.\n\nIn two cities the pattern has been broken, and not by cutting fares. Their stations were built with covered walkways, feeder buses timed to the trains and bicycle stands that are actually guarded. Ridership there climbed within a year, a speed that sits oddly with the claim that habits take a generation.\n\nPlanners like to describe a metro as the spine of a city. A spine, though, is useless without the nerves that run out from it, and we have been building spines and calling the job done. The stations stand along the highways like lighthouses on a coast no boat can reach. A metro line is not judged by its trains, which are usually excellent, but by the five hundred metres around each station: the least glamorous stretch of any project, and the only one the passenger cannot avoid.","stem":"The main point the passage makes is that a metro's success","options":["turns chiefly on treating it as part of a wider transport network","depends on covered walkways, timed feeder buses and guarded bicycle stands","depends largely on how easily riders can reach its stations","depends more on its fares than on the quality of its trains"],"answer":"depends largely on how easily riders can reach its stations","answerIndex":2,"tags":["rc-scope-shift","rc-detail-as-main","KEY","rc-wrong-voice"],"optionTags":["rc-scope-shift","rc-detail-as-main",null,"rc-wrong-voice"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (c)\nExplanation: The thesis arrives at the very end: a metro line is judged 'by the five hundred metres around each station', the stretch 'the passenger cannot avoid'. Everything before it (the median stations, the broken footpaths, the two cities that fixed access) builds to that claim.\nCorrect (c): 'how easily riders can reach its stations' is the five hundred metres around each station.\nLead distractor (b): These are the specific measures the two successful cities took (paragraph 4). They illustrate the point; they are not the point.\nIncorrect (a): Broader than the writer's claim. The spine-and-nerves image gestures at networks, but the conclusion is pinned to station access, not to overall transport integration.\nIncorrect (d): Putting fares first is the operators' liturgy. The writer concedes fares matter but says the two cities succeeded 'not by cutting fares'.","archetype":"RC slot C: main idea","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_051","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"Every few months another Indian city cuts the ribbon on a metro line, and every few months, a year or so later, a small embarrassed story appears on an inside page: ridership is a fraction of what the project report promised. The explanations offered by the operators have hardened into a liturgy. Fares are too high, they say; people are attached to their two-wheelers; commuting habits take a generation to change.\n\nSome of this is true. Fares do matter, and for the poorest riders a single journey can cost more than a kilo of tomatoes. But the liturgy has one convenient feature: every item on it locates the failure in the passenger. None of it asks what the passenger meets on the way to the train.\n\nWhat she meets, in most of the newer systems, is a highway. Stations have been placed where land was cheapest to acquire and alignments easiest to approve, which usually means the median of an arterial road. The footpath leading to them, where it exists, ends abruptly at a flyover ramp. So the rider who would walk must instead hire an autorickshaw for the last kilometre, and once that fare is paid at both ends, the metro trip costs more than the bus it was meant to replace and saves her barely ten minutes. She goes back to the bus, and the operator records her as a person with old habits.\n\nIn two cities the pattern has been broken, and not by cutting fares. Their stations were built with covered walkways, feeder buses timed to the trains and bicycle stands that are actually guarded. Ridership there climbed within a year, a speed that sits oddly with the claim that habits take a generation.\n\nPlanners like to describe a metro as the spine of a city. A spine, though, is useless without the nerves that run out from it, and we have been building spines and calling the job done. The stations stand along the highways like lighthouses on a coast no boat can reach. A metro line is not judged by its trains, which are usually excellent, but by the five hundred metres around each station: the least glamorous stretch of any project, and the only one the passenger cannot avoid.","stem":"As used in paragraph 1, 'liturgy' most nearly means","options":["a form of public worship","a set formula repeated by rote","an official statement of policy","a detailed written defence"],"answer":"a set formula repeated by rote","answerIndex":1,"tags":["vocab-context-blind","KEY","vocab-shade","vocab-shade"],"optionTags":["vocab-context-blind",null,"vocab-shade","vocab-shade"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (b)\nExplanation: The operators' explanations 'have hardened into a liturgy': the same three excuses (fares, two-wheelers, habits) are recited every time ridership disappoints.\nCorrect (b): The writer uses the word figuratively for a fixed set of words repeated out of habit rather than thought.\nLead distractor (c): Close in shade, because the explanations come from officials, but 'liturgy' stresses ritual repetition, not the fact that something is formally announced as policy.\nIncorrect (a): The dictionary's first sense of the word, which does not fit explanations for low ridership.\nIncorrect (d): A liturgy is recited, not argued; nothing suggests the explanations are detailed or reasoned.","archetype":"RC slot F: vocabulary in context","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_052","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"There is no virtue so loudly commended in our time, nor any so little examined, as punctuality. The moralists have agreed upon it; the schoolmasters enforce it with a bell; and my aunt, who has read nothing since the Jubilee, holds that a man who is late for breakfast will very probably be late for the Day of Judgment. I have listened to her for thirty years, and I confess I have never discovered what she supposes the two appointments to have in common.\n\nI do not deny that a train must leave at its hour. A railway is a machine for moving a great many strangers at once, and strangers can be reconciled to one another only by a timetable. Nor would I defend the guest who arrives when the soup is cold. But it is one thing to keep an appointment and another to make of the clock a conscience. It was the railway, I think, that first taught the towns to set their watches by a single standard; the factory borrowed the lesson and rang it on a bell; and the schoolroom, borrowing in its turn from the factory, taught the child that it is the hour, and not the task, by which merit is reckoned. A boy who has finished his sum early is told to wait; a boy who has not finished it is told to stop. Neither, you will observe, is asked whether the sum was worth doing.\n\nIn the country, at least, the older reckoning lingers. A labourer I once walked with measured his day by the length of the shadows and the temper of his horse, and he was the least hurried man of my acquaintance and by no means the least industrious. He could not have told you the time within an hour. He could have told you, to the furrow, how much remained to be done.\n\nI would not have the whole nation adopt his method; the trains, at least, would suffer. I would only observe that the clock was brought into the house as a servant, to wake us and to tell us when the joint was done, and that it has since, without anyone quite noticing, taken the chair at the head of the table. We no longer ask whether a thing is finished. We ask whether it is time.","stem":"According to the writer, the habit of governing life by the clock passed","options":["from the moralists to the schoolmasters and then into homes","from the schoolroom to the factory and then to the railway","from the railway to the factory, and from there to the schoolroom","from the towns to the countryside by way of the railway"],"answer":"from the railway to the factory, and from there to the schoolroom","answerIndex":2,"tags":["rc-wrong-voice","rc-reversal","KEY","rc-reversal"],"optionTags":["rc-wrong-voice","rc-reversal",null,"rc-reversal"],"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (c)\nExplanation: Paragraph 2 traces a chain: the railway 'first taught the towns' a single standard; 'the factory borrowed the lesson'; the schoolroom, 'borrowing in its turn from the factory', taught the child that the hour decides merit.\nCorrect (c): railway → factory → schoolroom, in that order.\nLead distractor (a): Moralists, schoolmasters and the aunt are the people who praise punctuality in paragraph 1. They commend the habit; the writer never says the habit travelled through them.\nIncorrect (b): The right three stations in the wrong order: this runs the chain backwards.\nIncorrect (d): Reverses what paragraph 3 says. The country is where 'the older reckoning lingers'; the clock's habit has not reached it.","archetype":"RC slot A: detail completion","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_053","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"There is no virtue so loudly commended in our time, nor any so little examined, as punctuality. The moralists have agreed upon it; the schoolmasters enforce it with a bell; and my aunt, who has read nothing since the Jubilee, holds that a man who is late for breakfast will very probably be late for the Day of Judgment. I have listened to her for thirty years, and I confess I have never discovered what she supposes the two appointments to have in common.\n\nI do not deny that a train must leave at its hour. A railway is a machine for moving a great many strangers at once, and strangers can be reconciled to one another only by a timetable. Nor would I defend the guest who arrives when the soup is cold. But it is one thing to keep an appointment and another to make of the clock a conscience. It was the railway, I think, that first taught the towns to set their watches by a single standard; the factory borrowed the lesson and rang it on a bell; and the schoolroom, borrowing in its turn from the factory, taught the child that it is the hour, and not the task, by which merit is reckoned. A boy who has finished his sum early is told to wait; a boy who has not finished it is told to stop. Neither, you will observe, is asked whether the sum was worth doing.\n\nIn the country, at least, the older reckoning lingers. A labourer I once walked with measured his day by the length of the shadows and the temper of his horse, and he was the least hurried man of my acquaintance and by no means the least industrious. He could not have told you the time within an hour. He could have told you, to the furrow, how much remained to be done.\n\nI would not have the whole nation adopt his method; the trains, at least, would suffer. I would only observe that the clock was brought into the house as a servant, to wake us and to tell us when the joint was done, and that it has since, without anyone quite noticing, taken the chair at the head of the table. We no longer ask whether a thing is finished. We ask whether it is time.","stem":"The writer's account of the labourer suggests that","options":["he may have worked harder for never having to watch a clock","ignorance of the hour need not mean idleness","labourers in the country rarely needed to know the hour","country work may suffer less from hurry than town work"],"answer":"ignorance of the hour need not mean idleness","answerIndex":1,"tags":["rc-false-link","KEY","rc-scope-shift","rc-out-of-scope"],"optionTags":["rc-false-link",null,"rc-scope-shift","rc-out-of-scope"],"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (b)\nExplanation: The labourer 'could not have told you the time within an hour' yet was 'by no means the least industrious' and knew 'to the furrow' how much work remained. The writer uses him to separate knowing the time from getting work done.\nCorrect (b): 'need not mean idleness' is the hedged claim the example supports: not knowing the hour did not make him lazy.\nLead distractor (a): Both facts are in the passage (he was industrious; he did not watch a clock), but the writer never says the second produced the first, even tentatively. It invents the link.\nIncorrect (c): Turns one man into 'labourers in the country' in general. The writer describes a single acquaintance, and says only that the older reckoning 'lingers' in the country.\nIncorrect (d): Sounds in keeping with the essay, but the writer never compares the quality of country and town work; the labourer shows only that not knowing the hour did not make him idle.","archetype":"RC slot B: inference completion","status":"approved","flags":[],"verified":"ok","verNote":"G1: RC Spec v2 blueprint row applied (key letter, length rank, strength, lead family); lead-distractor sentence named in explanation. Gates 1-4 (RC Option Audit, blind solve, strong solve, human read) still to run."},{"id":"IPMAT_VARC_054","section":"VA","format":"Read the following passage and choose the answer that is closest to each of the questions that are based on the passage.","kind":"mcq","passage":"There is no virtue so loudly commended in our time, nor any so little examined, as punctuality. The moralists have agreed upon it; the schoolmasters enforce it with a bell; and my aunt, who has read nothing since the Jubilee, holds that a man who is late for breakfast will very probably be late for the Day of Judgment. I have listened to her for thirty years, and I confess I have never discovered what she supposes the two appointments to have in common.\n\nI do not deny that a train must leave at its hour. A railway is a machine for moving a great many strangers at once, and strangers can be reconciled to one another only by a timetable. Nor would I defend the guest who arrives when the soup is cold. But it is one thing to keep an appointment and another to make of the clock a conscience. It was the railway, I think, that first taught the towns to set their watches by a single standard; the factory borrowed the lesson and rang it on a bell; and the schoolroom, borrowing in its turn from the factory, taught the child that it is the hour, and not the task, by which merit is reckoned. A boy who has

isteners' belief; the psychologist accepts only half of it.\nIncorrect (C): Right speaker, wrong stance: the host reports it as 'what most of our listeners believe' and asks 'Fair?'. He puts it up for testing; he does not defend it.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_030","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Welcome back. My guest today is a psychologist who has spent her career studying why people keep going at long, dull tasks: learning an instrument, preparing for an exam, rebuilding a business after it fails. Let me start with what most of our listeners believe. If you're struggling to keep going, you simply haven't found something you're passionate about. Find the passion, and the effort takes care of itself. Fair?\n\nPSYCHOLOGIST: Half fair. Passion is real, and I'd never tell anyone to do without it. But I've started dividing motivation into two kinds, and I call them sail and keel. Sail is the feeling: excitement, curiosity, the rush of a new start. When the wind is up, sail moves you faster than anything else. Keel is everything below the waterline: routines, promises to other people, a sense of who you are. You don't feel the keel. You only notice it when it's missing.\n\nHOST: Missing how?\n\nPSYCHOLOGIST: A boat with all sail and no keel goes wherever the wind goes. Think of the student who works furiously for the first three weeks of a course. Then the excitement fades and, this is the important part, she reads the fade as a verdict. She decides she was never meant for the subject, and she quits. The quitting isn't caused by the fading. It's caused by what she concludes from it.\n\nHOST: So you're saying passion doesn't matter.\n\nPSYCHOLOGIST: No, and that's the bit people mishear. A keel on its own doesn't take you anywhere; it only stops you drifting. Among the exam candidates I've worked with, the ones who lasted almost always had some sail. They liked something about the subject. But the ones who lasted longest were not the ones who liked it most. They were the ones who had built a routine that didn't ask them each morning how they felt.\n\nHOST: Can you build a keel on purpose?\n\nPSYCHOLOGIST: Slowly. You can't feel your way into one. You build it by doing the thing on days when you'd rather not, until doing it stops being a decision. Most people try the opposite. They wait for the wind, and they call the waiting 'getting ready'.\n\nHOST: That sounds a little harsh.\n\nPSYCHOLOGIST: Perhaps it is. But the wind always drops at some point. The only question is what's holding you steady when it does.","stem":"When the host says her point 'sounds a little harsh', the psychologist responds by","options":["toning down what she said about people who wait for the wind.","denying that it is harsh and calling it merely realistic.","repeating her earlier claim that a keel is built only slowly.","granting that it may sound harsh while holding to her point."],"answer":"granting that it may sound harsh while holding to her point.","answerIndex":3,"tags":["rc-tone","rc-reversal","rc-true-not-answer","KEY"],"optionTags":["rc-tone","rc-reversal","rc-true-not-answer",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (D)\nThe host's 'That sounds a little harsh' follows her remark that people wait for the wind and call the waiting 'getting ready'. She replies: 'Perhaps it is. But the wind always drops at some point.'\nCorrect (D): 'Perhaps it is' grants that the remark may sound harsh; the 'But' that follows keeps her argument standing. She concedes the tone, not the point.\nLead distractor (A): Tempting because she does meet the host halfway. But she takes nothing back: her reply ends by asking what holds you steady when the wind drops.\nIncorrect (B): Reverses 'Perhaps it is': she does not deny that the remark is harsh.\nIncorrect (C): True, she said a keel is built 'slowly', but that was her answer to an earlier question, not her reply to 'a little harsh'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: replaced after the 6 Oct 2026 audit (old Q30 repeated Q29's speaker-attribution design); tone item keyed by 'Perhaps it is. But ...'; blind-solved in a fresh subagent"},{"id":"IPMAT_VA_031","section":"VA","format":"Parajumble","kind":"tita","passage":"1. When a city renames a street, the new name usually appears on the signboards within weeks.\n2. Shopkeepers, rickshaw drivers and grandmothers go on giving directions by the old name, and theirs are the directions that work.\n3. It takes far longer to appear in the mouths of the people who live there.\n4. Every newcomer who asks the way therefore learns the old name first, and in some cities a street is still known by a name that was officially dropped before most of its residents were born.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"1324","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"1234":"pj-topic-link","1342":"pj-pair-broken"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 1324\nSentence 1: opens: 'When a city renames a street' needs nothing before it.\nSentence 3: 'It' is the new name, and 'far longer' contrasts with 'within weeks'.\nSentence 2: shows who keeps the old name alive and why their directions count.\nSentence 4: 'therefore' draws on the directions of the sentence before and closes with the general point.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order fixed by 'It' (the new name), 'far longer' vs 'within weeks', 'asks the way therefore'"},{"id":"IPMAT_VA_032","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\nTraffic police in several Indian cities have tried, at one time or another, to persuade drivers to honk less. Posters, fines and 'no-honking days' have each produced a brief lull, followed by a return to the old noise. Researchers who study driver behaviour say the campaigns misread why people honk: on crowded roads, the horn is less an expression of anger than a way of announcing one's presence to vehicles that cannot see each other. A driver who stops honking, in other words, may feel not calmer but less safe. ____","options":["Exhaust fumes from idling vehicles are an even greater danger to city dwellers.","This suggests that most drivers honk simply because they are frustrated.","Some drivers, it seems, honk out of sheer habit even on empty roads.","If so, quieter streets will need clearer sight lines more than better manners."],"answer":"If so, quieter streets will need clearer sight lines more than better manners.","answerIndex":3,"tags":["off-topic insertion","stance contradiction","right topic, wrong focus","KEY"],"optionTags":["rc-out-of-scope","rc-reversal","para-same-topic",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (D)\nCorrect (D): 'If so' takes up the researchers' explanation. If drivers honk to be seen, appeals to manners will fail and what helps is letting vehicles see one another. The sentence closes the paragraph with the conclusion its argument licenses.\nIncorrect (A): Turns to air pollution, which the paragraph never mentions.\nIncorrect (B): Contradicts the researchers, who say the horn is 'less an expression of anger' than a signal.\nIncorrect (C): On topic, but it introduces a new cause (habit) instead of drawing the conclusion the paragraph has built towards.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'If so' closes the argument that honking signals presence on crowded roads"},{"id":"IPMAT_VA_033","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nThe brochure promised that the course would double our scores within a month, but my cousin, who had sat through three such courses, told me to ___.","options":["take it to heart","take it with a pinch of salt","take it with a pinch of spice","take it with a dash of salt"],"answer":"take it with a pinch of salt","answerIndex":1,"tags":["real expression, wrong meaning","KEY","corrupted fixed expression","corrupted fixed expression"],"optionTags":["vocab-wrong-idiom",null,"gram-idiom","gram-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (B)\nCorrect (B): 'Take something with a pinch of salt' means to treat a claim with doubt. The cousin has sat through three such courses, so he is warning against believing the brochure's promise.\nIncorrect (A): A real idiom, but it means to be deeply affected by something, the opposite of the doubt the context calls for.\nIncorrect (C): A corrupted form: swapping 'salt' for 'spice' breaks the idiom.\nIncorrect (D): A corrupted form: the fixed expression is 'a pinch of salt', not 'a dash'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: idiom 'take with a pinch of salt' fixed by the cousin's experience of three such courses"},{"id":"IPMAT_VA_034","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\n____ Volunteers with screwdrivers and soldering irons sit at long tables, and residents bring in toasters, lamps and torn jackets that would otherwise be thrown away. Nothing is charged, though a jar for donations usually sits by the door. Organisers insist that the point is not only to save money: watching a repair, they say, teaches people that broken things can often be understood. That lesson, more than any single mended toaster, is what they hope visitors take home.","options":["In a growing number of towns, a church hall or library becomes a repair café for one afternoon a month.","Repair cafés exist mainly to save their visitors money on new appliances.","Such cafés began as a way for retired engineers to keep their skills in use.","Shoppers today are more willing than ever to buy second-hand clothes online."],"answer":"In a growing number of towns, a church hall or library becomes a repair café for one afternoon a month.","answerIndex":0,"tags":["KEY","stance contradiction","right topic, wrong focus","off-topic insertion"],"optionTags":[null,"rc-reversal","para-same-topic","rc-out-of-scope"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (A)\nCorrect (A): The paragraph needs an opener that sets the scene: 'Volunteers ... sit at long tables' needs a place and an occasion. This sentence introduces the repair café with a full noun phrase and no back-reference.\nIncorrect (B): Introduces the topic but contradicts the end of the paragraph, where the lesson matters 'more than any single mended toaster'.\nIncorrect (C): 'Such cafés' has nothing to refer back to at the opening, and the origin of the cafés is not what the paragraph goes on to describe.\nIncorrect (D): Introduces online second-hand shopping, which the paragraph never raises, and gives the volunteers no setting.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: opener with full noun phrase sets the scene for 'Volunteers ... at long tables'"},{"id":"IPMAT_VA_035","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nThe candidate [[whom the panel believed was the strongest have]] withdrawn her application.","options":["who the panel believed were the strongest has","who the panel believed was the strongest has","whom the panel believed was the strongest have","whom the panel believed was the strongest has"],"answer":"who the panel believed was the strongest has","answerIndex":1,"tags":["new error introduced","KEY","original span (both errors kept)","half-fix"],"optionTags":["gram-new-error",null,"gram-sounds-right","gram-half-fix"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (B)\nCorrect (B): 'The panel believed' is an inserted clause; the relative pronoun is the subject of 'was', so it must be 'who', not 'whom'. The main verb belongs to 'the candidate' and must be singular: 'has withdrawn'.\nIncorrect (A): Fixes 'who' and 'has' but adds 'were', which does not agree with 'who' standing for one candidate.\nIncorrect (C): The original: it keeps both errors.\nIncorrect (D): Fixes 'has' but keeps 'whom', the object form, where a subject is needed.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: who as subject of 'was' across inserted 'the panel believed'; singular 'has'"},{"id":"IPMAT_VA_036","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nRather than ___ the derelict mill, the council chose to ___ it as a museum, arguing that the town's history was too ___ to be bulldozed.","options":["level; desert; precious","demolish; restore; precious","raze; preserve; trivial","preserve; reopen; valuable"],"answer":"demolish; restore; precious","answerIndex":1,"tags":["polarity flip","KEY","polarity flip","polarity flip"],"optionTags":["vocab-opposite",null,"vocab-opposite","vocab-opposite"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (B)\nCorrect (B): 'Rather than demolish ... chose to restore' is the contrast, and 'too precious to be bulldozed' gives the council's reason.\nIncorrect (A): One does not 'desert' a building as a museum; the second blank needs a verb of saving.\nIncorrect (C): History that is 'too trivial to be bulldozed' makes no sense; the reason must favour saving the mill.\nIncorrect (D): 'Rather than preserve' sets up no contrast with reopening it as a museum.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: killers at positions 3, 1, 2 (trivial, preserve, desert)"},{"id":"IPMAT_VA_037","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nThe much-advertised film festival turned out to be ___: half the screenings were cancelled, and the rest played to empty halls.","options":["a wet squib","a dark horse","a damp squid","a damp squib"],"answer":"a damp squib","answerIndex":3,"tags":["corrupted fixed expression","real expression, wrong meaning","corrupted fixed expression","KEY"],"optionTags":["gram-idiom","vocab-wrong-idiom","gram-idiom",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (D)\nCorrect (D): 'A damp squib' is an event that fails to live up to its billing, like a firework that fizzles instead of going off. Heavy advertising followed by cancelled screenings and empty halls fits exactly.\nIncorrect (A): A corrupted form: the idiom is 'damp', not 'wet'.\nIncorrect (B): A real idiom, but it means a little-known competitor who unexpectedly does well.\nIncorrect (C): A corrupted form: a squid is a sea creature; the idiom uses 'squib', a small firework.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'damp squib' fixed by 'much-advertised' against cancelled screenings and empty halls"},{"id":"IPMAT_VA_038","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Yet the same code brought a worry of its own.\n2. The printed payment code, taped to a cart or a crate of onions, changed that almost overnight.\n3. A vendor who once counted cash in the evening now checks, between customers, whether each payment has really arrived.\n4. Customers no longer had to hunt for exact change, and vendors no longer had to turn away a sale for want of it.\n5. For years, a street vendor's biggest worry at the end of the day was the tin box of loose change and torn notes.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"52413","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"25413":"pj-opener","52134":"pj-pair-broken"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 52413\nSentence 5: opens the paragraph: it sets the scene with a full noun phrase and needs nothing before it.\nSentence 2: 'changed that' points back to the vendor's worry in the opener.\nSentence 4: spells out what the change meant for customers and vendors.\nSentence 1: 'Yet' cannot open; it turns from the benefits to 'a worry of its own', and 'the same code' needs the code introduced earlier.\nSentence 3: closes by describing the new worry.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order fixed by 'changed that', 'Yet the same code' and 'a worry of its own'"},{"id":"IPMAT_VA_039","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nAfter failing the driving test four times, Kavya was ready to ___, but her instructor persuaded her to book one more attempt.","options":["throw in the towel","throw down the towel","throw in the napkin","throw her weight around"],"answer":"throw in the towel","answerIndex":0,"tags":["KEY","corrupted fixed expression","corrupted fixed expression","real expression, wrong meaning"],"optionTags":[null,"gram-idiom","gram-idiom","vocab-wrong-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (A)\nCorrect (A): 'Throw in the towel' means to give up, from a boxer's corner conceding a fight. Four failures and an instructor who has to persuade her to try again show she was about to quit.\nIncorrect (B): A corrupted form that mixes 'throw in the towel' with 'throw down the gauntlet', which means to issue a challenge.\nIncorrect (C): A corrupted form: the idiom uses 'towel'.\nIncorrect (D): A real idiom, but it means to use one's power in a bullying way.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'throw in the towel' fixed by 'but her instructor persuaded her' (she was about to give up)"},{"id":"IPMAT_VA_040","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nLast week I [[had the mechanic to check the brakes, which were making a noise since]] Monday.","options":["had the mechanic check the brakes, which were making a noise since","had the mechanic to check the brakes, which were making a noise since","had the mechanic check the brakes, which had been making a noise since","got the mechanic check the brakes, which had been making a noise since"],"answer":"had the mechanic check the brakes, which had been making a noise since","answerIndex":2,"tags":["half-fix","original span (both errors kept)","KEY","new error introduced"],"optionTags":["gram-half-fix","gram-sounds-right",null,"gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (C)\nCorrect (C): The causative 'have someone do something' takes the bare infinitive: 'had the mechanic check'. An action that ran from an earlier past point up to another past time needs the past perfect continuous: 'had been making a noise since Monday'.\nIncorrect (A): Fixes the causative but keeps 'were making ... since', which needs 'had been making'.\nIncorrect (B): The original: it keeps both errors.\nIncorrect (D): Fixes the tense, but 'got' needs 'to' before the verb: 'got the mechanic to check'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: causative have + bare infinitive; past perfect continuous with 'since'"},{"id":"IPMAT_VA_041","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nFar from being a ___ fad, the habit of reading on phones has proved remarkably ___, outlasting several predictions of its decline.","options":["passing; durable","transience; resilient","fleeting; fragile","ephemeral; endurance"],"answer":"passing; durable","answerIndex":0,"tags":["KEY","category/part-of-speech error","polarity flip","category/part-of-speech error"],"optionTags":[null,"vocab-category","vocab-opposite","vocab-category"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (A)\nCorrect (A): 'Far from being a passing fad' sets up the contrast, and 'remarkably durable' matches 'outlasting several predictions of its decline'.\nIncorrect (B): 'Transience' is a noun; the blank before 'fad' needs an adjective.\nIncorrect (C): 'Fragile' contradicts 'outlasting several predictions of its decline'.\nIncorrect (D): 'Endurance' is a noun; 'proved remarkably ___' needs an adjective.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: killers at positions 2, 1, 2 (fragile, transience, endurance)"},{"id":"IPMAT_VA_042","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nWe had booked the hall and printed the invitations, so it came as a blow when the sponsorship deal ___ two days before the event.","options":["fell over","fell off","fell through","fell out"],"answer":"fell through","answerIndex":2,"tags":["corrupted fixed expression","corrupted fixed expression","KEY","real expression, wrong meaning"],"optionTags":["gram-idiom","gram-idiom",null,"vocab-wrong-idiom"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (C)\nCorrect (C): 'Fall through' means to fail to happen. A deal that collapses two days before the event is what turns the booking and the invitations into wasted effort.\nIncorrect (A): Wrong particle: 'fall over' means to topple physically and is not used of deals or plans.\nIncorrect (B): Wrong particle: 'fall off' is used of amounts that decline ('sales fell off'), not of plans that collapse.\nIncorrect (D): A real phrasal verb, but it means to quarrel; a deal cannot quarrel.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: phrasal verb 'fall through' (fail to happen) fixed by 'came as a blow' after the bookings"},{"id":"IPMAT_VA_043","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\n[[Had the manager knew about the leak earlier, she will have]] called the plumber at once.","options":["Had the manager known about the leak earlier, she will have","If the manager knew about the leak earlier, she would have","Had the manager knew about the leak earlier, she will have","Had the manager known about the leak earlier, she would have"],"answer":"Had the manager known about the leak earlier, she would have","answerIndex":3,"tags":["half-fix","new error introduced","original span (both errors kept)","KEY"],"optionTags":["gram-half-fix","gram-tense-marker","gram-sounds-right",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (D)\nCorrect (D): An inverted third conditional takes 'Had + past participle' ('Had the manager known') and a main clause with 'would have'. The underlined part has the wrong verb form ('knew') and the wrong modal ('will have'); only this option fixes both.\nIncorrect (A): Fixes 'known' but keeps 'will have', which cannot follow an unreal past condition.\nIncorrect (B): Fixes 'would have', but 'If the manager knew ... earlier' does not describe an unreal past; it needs 'had known'.\nIncorrect (C): The original: it keeps both errors.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: inverted third conditional (Had + known ... would have); both errors fixed only in key"},{"id":"IPMAT_VA_044","section":"VA","format":"Parajumble","kind":"tita","passage":"1. Goods that had taken a week to float downstream could now reach the coast in a day.\n2. Today only the ferries remain, and few of their passengers know that the steps they climb were built for sacks of grain.\n3. In the old river port, the ghats were once so crowded with boats that a trader could cross the water by stepping from deck to deck.\n4. Then, within a single generation, the railway reached the town and the boats began to disappear.\n5. The boatmen, finding no cargo, sold their vessels for timber or turned them into ferries for pilgrims.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"34152","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"34512":"pj-time-order","43152":"pj-opener"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 34152\nSentence 3: opens: it pictures the port at its busiest, with no back-reference.\nSentence 4: 'Then' cannot open; it marks the change that ended that busy scene.\nSentence 1: explains why the railway emptied the river: goods now moved faster by rail.\nSentence 5: 'finding no cargo' is the boatmen's response to the loss described just before.\nSentence 2: 'Today' and 'only the ferries' close the sequence, picking up the ferries of the sentence before.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order fixed by 'Then', the cause-effect of rail and cargo, and 'Today only the ferries'"},{"id":"IPMAT_VA_045","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nThe ___ of cheap flights has made distant cities feel near, yet residents of popular destinations increasingly ___ the crowds, complaining that their streets have been turned into ___ for visitors.","options":["adventure; resent; theme parks","advent; dislike; nurseries","arrival; welcome; playgrounds","advent; resent; playgrounds"],"answer":"advent; resent; playgrounds","answerIndex":3,"tags":["near-miss sense","near-miss sense","polarity flip","KEY"],"optionTags":["vocab-shade","vocab-shade","vocab-opposite",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (D)\nCorrect (D): 'The advent of' means the arrival of; 'yet ... resent the crowds' supplies the contrast; streets 'turned into playgrounds for visitors' fits the complaint.\nIncorrect (A): 'The adventure of cheap flights' is the wrong word; the sentence needs 'advent', their arrival.\nIncorrect (B): A nursery is a place for small children or young plants; it does not describe streets overrun by tourists.\nIncorrect (C): Residents who complain do not 'welcome' the crowds; it breaks the 'yet' contrast.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: killers at positions 2, 3, 1 (welcome, nurseries, adventure)"}];

/* ==================== WHITELIST RUNTIME BLOCK (v5 §17) ==================== */
var WL_PROMISE=fetch("whitelist.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
function normalizePin(pin){return String(pin).replace(/\D/g,"").replace(/^0+/,"")}
async function isWhitelisted(pin,batch){
 var WL;try{WL=await WL_PROMISE}catch(e){WL=null}
 if(!WL)return true; /* FAIL-OPEN */
 try{
  var bypass=WL.bypass_batches||[];
  if(bypass.indexOf(batch)!==-1)return true;
  var norm=normalizePin(pin);
  var admins=(WL.admin_pins||[]).map(String);
  if(admins.indexOf(norm)!==-1)return true;
  if(Array.isArray(WL.pins)){if(WL.pins.map(String).indexOf(norm)!==-1)return true}
  else if(WL.pins&&typeof WL.pins==="object"){if(Object.prototype.hasOwnProperty.call(WL.pins,norm))return true}
  return false;
 }catch(e){return true}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,marked:marked,secondsLeft:secondsLeft,deadline:deadline,secIdx:secIdx,elapsedPrior:elapsedPrior,qStartTs:qStartTs,visits:visits,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 if(lockBlocks(s.batch))return false;
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 if(SEC){
  secIdx=Math.min(typeof s.secIdx==="number"?s.secIdx:0,SEC.length-1);
  elapsedPrior=typeof s.elapsedPrior==="number"?s.elapsedPrior:0;
  currentQ=Math.max(SEC[secIdx].start,Math.min(SEC[secIdx].end,currentQ));
 }
 if(s.marked&&s.marked.length===NQ)marked=s.marked;
 if(Array.isArray(s.visits))visits=s.visits.filter(function(v){return v&&typeof v.q==="number"&&v.q>=0&&v.q<NQ});
 if(!RAPID&&typeof s.deadline==="number"&&s.deadline>0)deadline=s.deadline; /* v2.5: the clock kept running while away */
 if(RAPID&&typeof s.qStartTs==="number"&&s.qStartTs>0)pendingResumeStartTs=s.qStartTs;
 enterTest();
 return true;
}

function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 if(lockBlocks(batch)){showLoginError(LOCK_MSG);return}
 var allowed=await isWhitelisted(pin,batch);
 if(!allowed){showLoginError(BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 if(!RAPID){
  if(!deadline)deadline=Date.now()+secondsLeft*1000;
  catchUp();
 }
 buildPalette();
 updateSecButtons();
 if(SEC)showSecBanner();
 if(!RAPID){
  if(secondsLeft<=0){renderQuestion();submitTest();return} /* whole test ran out while away */
  tickInt=setInterval(function(){
   syncLeft();
   var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
   if(++tickCount%10===0)snSaveSession();
   if(secondsLeft<=0){if(SEC&&secIdx<SEC.length-1)advanceSection();else submitTest()}
  },1000);
 }else{
  var pb=document.getElementById("prevBtn");if(pb)pb.style.display="none";
  var rw=document.getElementById("rfTimerWrap");if(rw)rw.style.display="block";
  var mb=document.getElementById("mrkBtn");if(mb)mb.style.display="none";
 }
 renderQuestion();
 snSaveSession();
}
function syncLeft(){secondsLeft=Math.round((deadline-Date.now())/1000)}
function catchUp(){ /* v2.5: sections that expired while the student was away are closed, in order */
 syncLeft();
 while(SEC&&secondsLeft<=0&&secIdx<SEC.length-1){
  elapsedPrior+=SEC[secIdx].minutes*60;
  secIdx++;
  deadline+=SEC[secIdx].minutes*60*1000;
  currentQ=SEC[secIdx].start;
  syncLeft();
 }
}
function clearResp(){if(testOver)return;answers[currentQ]=null;snSaveSession();if(RAPID){var bs=document.querySelectorAll("#optBox .opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.remove("sel");var ti=document.querySelector("#optBox input.tita");if(ti)ti.value="";paintPalette()}else renderQuestion()}
function toggleMark(){if(testOver||RAPID)return;marked[currentQ]=!marked[currentQ];snSaveSession();paintPalette();paintMarkBtn()}
function paintMarkBtn(){var b=document.getElementById("mrkBtn");if(b)b.textContent=marked[currentQ]?"Unmark review":"Mark for review"}
function updateSecButtons(){
 var eb=document.getElementById("endSecBtn"),sb=document.getElementById("submitBtn");
 if(!SEC){if(eb)eb.style.display="none";return}
 var last=secIdx===SEC.length-1;
 if(eb)eb.style.display=last?"none":"inline-block";
 if(sb)sb.style.display=last?"inline-block":"none";
}
function showSecBanner(){
 var b=document.getElementById("secBanner");if(!b||!SEC)return;
 document.getElementById("sbTitle").textContent="SECTION "+(secIdx+1)+" of "+SEC.length+" \u00b7 "+SEC[secIdx].sec;
 document.getElementById("sbSub").textContent=SEC[secIdx].minutes+" minutes \u00b7 "+(SEC[secIdx].end-SEC[secIdx].start+1)+" questions \u00b7 no return once this section ends";
 b.style.display="flex";
 setTimeout(function(){b.style.display="none"},2600);
}
function advanceSection(){
 if(!SEC||secIdx>=SEC.length-1)return;
 markTime();
 elapsedPrior+=SEC[secIdx].minutes*60-Math.max(0,secondsLeft);
 secIdx++;
 secondsLeft=SEC[secIdx].minutes*60;
 deadline=Date.now()+secondsLeft*1000;
 currentQ=SEC[secIdx].start;
 buildPalette();updateSecButtons();showSecBanner();
 renderQuestion();snSaveSession();
}
function endSectionEarly(){advanceSection()}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;
 for(var i=lo;i<=hi;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(marked[i])c.classList.add("rev");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(RAPID)return; /* v2.4: rapid records td-qSecondsLeft in rapidAdvance */
 if(qShownTs){
  var d=Math.round((Date.now()-qShownTs)/1000);
  questionTimes[currentQ]+=d;
  if(d>=1&&qShownQ===currentQ){ /* v2.7: one visit = from showing a question to leaving it */
   var e=elapsedNow();
   visits.push({q:currentQ,s:Math.max(0,e-d),d:d,a:answers[currentQ]});
   if(visits.length>800)visits.shift();
  }
 }
 qShownTs=Date.now();
}
function elapsedNow(){ /* seconds into the test on the test clock (sections ended early are not counted) */
 if(RAPID)return 0;
 var left=deadline?(deadline-Date.now())/1000:secondsLeft;
 var base=SEC?elapsedPrior+SEC[secIdx].minutes*60:CFG.minutes*60;
 return Math.max(0,Math.round(base-left));
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ulText(el,t){el.textContent="";String(t==null?"":t).split(/(\[\[[\s\S]*?\]\])/).forEach(function(p){if(!p)return;var m=p.match(/^\[\[([\s\S]*)\]\]$/);if(m){var u=document.createElement("u");u.textContent=m[1];el.appendChild(u)}else el.appendChild(document.createTextNode(p))})}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 /* v2.7 fix: picking an option re-renders the same question; that must not restart its stopwatch */
 if(!qShownTs||qShownQ!==currentQ){qShownTs=Date.now();qShownQ=currentQ}
 document.getElementById("tbName").textContent=TEST_NAME;
 var qc=document.getElementById("qCounter");
 if(SEC){var sp=SEC[secIdx];qc.textContent=sp.sec+" \u00b7 Q "+(currentQ-sp.start+1)+" / "+(sp.end-sp.start+1)}
 else qc.textContent="Q "+(currentQ+1)+" / "+NQ;
 if(!RAPID)document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section;
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 ulText(document.getElementById("qText"),q.stem);
 renderExhibit(q,document.getElementById("exBox"));
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(isMCQ(q)){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();if(RAPID){var bs=box.querySelectorAll(".opt");for(var bi=0;bi<bs.length;bi++)bs[bi].classList.toggle("sel",bi===idx);paintPalette()}else{renderQuestion()}};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();paintMarkBtn();
 if(RAPID)rapidStartQuestion();
}
function nav(d){if(RAPID){if(d>0)rapidAdvance();return}markTime();var lo=SEC?SEC[secIdx].start:0,hi=SEC?SEC[secIdx].end:NQ-1;currentQ=Math.max(lo,Math.min(hi,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){if(RAPID)return;if(SEC&&(i<SEC[secIdx].start||i>SEC[secIdx].end))return;markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== RAPID MODE ENGINE (v2.4) ==================== */
function rapidStartQuestion(){
 if(!RAPID||testOver)return;
 var q=QUESTIONS[currentQ],dur=q.td||30;
 if(pendingResumeStartTs){
  qStartTs=pendingResumeStartTs;pendingResumeStartTs=null;
  var elapsed=Math.floor((Date.now()-qStartTs)/1000);
  qSecondsLeft=Math.max(0,dur-elapsed);
 }else{qStartTs=Date.now();qSecondsLeft=dur}
 var bar=document.getElementById("rfTimerBar");
 bar.style.transition="none";bar.style.width=((qSecondsLeft/dur)*100)+"%";
 bar.classList.remove("warn","danger");
 var fr=qSecondsLeft/dur;
 if(fr<=0.25)bar.classList.add("danger");else if(fr<=0.5)bar.classList.add("warn");
 void bar.offsetWidth; /* force reflow so the linear transition restarts */
 bar.style.transition="width "+qSecondsLeft+"s linear";bar.style.width="0%";
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 if(qInterval)clearInterval(qInterval);
 snSaveSession(); /* persist fresh qStartTs so refresh-before-interaction still tracks */
 if(qSecondsLeft<=0){setTimeout(rapidAdvance,50);return}
 qInterval=setInterval(rapidTick,1000);
}
function rapidTick(){
 qSecondsLeft--;if(qSecondsLeft<0)qSecondsLeft=0;
 document.getElementById("timer").textContent=qSecondsLeft+"s";
 var dur=QUESTIONS[currentQ].td||30;
 var bar=document.getElementById("rfTimerBar"),fr=qSecondsLeft/dur;
 if(fr<=0.25){bar.classList.remove("warn");bar.classList.add("danger")}
 else if(fr<=0.5){bar.classList.add("warn")}
 if(qSecondsLeft<=0)rapidAdvance();
}
function rapidAdvance(){
 if(testOver)return;
 clearInterval(qInterval);
 questionTimes[currentQ]=(QUESTIONS[currentQ].td||30)-qSecondsLeft;
 if(currentQ>=NQ-1){submitTest();return}
 currentQ++;
 snSaveSession();
 renderQuestion();
}

/* ==================== FIG / TABLE EXHIBITS ==================== */
function renderExhibit(q,host){
 if(!host)return;host.innerHTML="";
 if(q.fig){
  var f=String(q.fig).trim();
  if(f.slice(0,4).toLowerCase()==="<svg"){var w0=document.createElement("div");w0.className="qFig";w0.innerHTML=f;host.appendChild(w0)}
  else if(/^(data:image|https?:)/.test(f)){var w=document.createElement("div");w.className="qFig";var im=document.createElement("img");im.src=f;im.alt="figure";w.appendChild(im);host.appendChild(w)}
 }
 if(q.table!=null&&q.table!==""){
  var t=q.table,rows=null,heads=null;
  if(Array.isArray(t))rows=t;
  else if(t&&typeof t==="object"&&Array.isArray(t.rows)){rows=t.rows;heads=Array.isArray(t.headers)?t.headers:null}
  if(rows&&rows.length&&Array.isArray(rows[0])){
   var tb=document.createElement("table");tb.className="qTable";
   if(heads){var tr0=document.createElement("tr");heads.forEach(function(hh){var th=document.createElement("th");th.textContent=String(hh);tr0.appendChild(th)});tb.appendChild(tr0)}
   rows.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(c){var td=document.createElement("td");td.textContent=String(c);tr.appendChild(td)});tb.appendChild(tr)});
   host.appendChild(tb);
  }else if(typeof t==="string"&&t.trim().charAt(0)==="<"){
   var wt=document.createElement("div");wt.className="qTableWrap";wt.innerHTML=t;host.appendChild(wt);
  }else{
   var pre=document.createElement("pre");pre.className="qTable";pre.textContent=(typeof t==="string")?t:JSON.stringify(t,null,1);host.appendChild(pre);
  }
 }
}
/* ==================== SCORING HELPERS ==================== */
function titaNorm(v){
 var s=String(v==null?"":v).trim();
 var t=s.replace(/[\s,]/g,"");
 if(t!==""&&isFinite(t))return String(Number(t));
 return s.toLowerCase();
}
function titaWFor(q){if(CFG.titaWSec&&CFG.titaWSec[q.section]!=null)return CFG.titaWSec[q.section];return CFG.titaW}
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(isMCQ(q))return a===q.answerIndex;
 if(q.format==="Parajumble")return String(a).trim()===String(q.answer); /* stem rule: 3412 valid; 3412. and 3 4 1 2 invalid */
 return titaNorm(a)===titaNorm(q.answer);
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!isMCQ(q))return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 if(qInterval)clearInterval(qInterval);
 if(RAPID&&qStartTs&&!questionTimes[currentQ]){questionTimes[currentQ]=Math.min(QUESTIONS[currentQ].td||30,Math.round((Date.now()-qStartTs)/1000))}
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(isMCQ(q)?CFG.w:titaWFor(q));
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=RAPID?questionTimes.reduce(function(a,b){return a+(b||0)},0):(SEC?(elapsedPrior+SEC[secIdx].minutes*60-Math.max(0,secondsLeft)):(CFG.minutes*60-Math.max(0,secondsLeft)));
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors,totalSecs);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors,totalSecs){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 document.getElementById("stAcc").textContent=(correct+wrong)?Math.round(100*correct/(correct+wrong))+"%":"\u2014";
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");
 /* v2.7: analysis + retry. Wrapped so a fault here can never blank the results screen. */
 try{LAST_A=computeAnalysis(score,totalSecs);renderAnalysis(LAST_A)}catch(e){LAST_A=null;var ab=document.getElementById("anaBox");if(ab)ab.innerHTML=""}
 try{renderRetry()}catch(e){var rb=document.getElementById("retryBox");if(rb)rb.innerHTML=""}

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";wrap.id="rq"+i;
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+escH(q.section)+" \u00b7 "+escH(q.format)+(diffOf(q)?" \u00b7 "+escH(q.difficulty):"")+" \u00b7 time "+fmtMS(questionTimes[i])+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  var stem=document.createElement("div");stem.className="rqStem";ulText(stem,q.stem);wrap.appendChild(stem);
  var exh=document.createElement("div");renderExhibit(q,exh);if(exh.childNodes.length)wrap.appendChild(exh);
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    if(idx===a&&idx!==q.answerIndex){var tg=trapOf(q,a);if(tg){var tn=document.createElement("div");tn.className="trapNote";tn.textContent="trap: "+trapInfo(tg).name;r.appendChild(tn)}}
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   var ttg=trapOf(q,a);if(ttg){var ttn=document.createElement("div");ttn.className="trapNote";ttn.textContent="trap: "+trapInfo(ttg).name;yr.appendChild(ttn)}
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== POST-TEST ANALYSIS (v2.8) ====================
   Computed on this device from answers, questionTimes and the visit log.
   Nothing here is sent anywhere: the 16-field payload is unchanged.
   TRAPS: for each optionTags / titaTraps tag, the student-facing name,
   what the trap is, and the counter-move. Edit freely; an unknown tag
   falls back to a readable version of the tag itself. */
var TRAPS={
 "rc-detail-as-main":["Detail as main idea","A true detail offered as the main point.","Ask whether the writer would use it as the title. A detail can be true and still be too small to be the point."],
 "rc-extreme":["Overstated","It says more, or says it more strongly, than the passage does.","Circle strong words (always, only, entirely, never) and pick the option exactly as strong as the text."],
 "rc-false-link":["False link","It joins two things from the passage with a reason the writer never gives.","Find the line that links the two ideas. If the passage never connects them, neither should you."],
 "rc-half-right":["Half right","One half matches the passage; the other half doesn't.","Read every option to its last word. One wrong half sinks the whole option."],
 "rc-literal":["Too literal","A figurative line read at face value.","For an image or metaphor, ask what it does in the argument, not what it describes."],
 "rc-out-of-scope":["Out of scope","It brings in something the passage never discusses.","If you cannot point to the line that supports it, rule it out."],
 "rc-reversal":["Reversal","It flips the passage: the order, the direction or the cause.","Trace before/after and cause/effect back in the text before you commit."],
 "rc-scope-shift":["Scope shift","Right topic, but wider or narrower than the text's claim.","Match the scope words: most vs all, some vs every, one city vs every city."],
 "va-scope-shift":["Scope shift","Right topic, but wider or narrower than the paragraph's claim.","Match the scope words: most vs all, some vs every, one case vs every case."],
 "rc-tone":["Tone miss","Right direction, wrong strength or flavour of attitude.","Fix the direction first (for or against), then the strength (mild or harsh)."],
 "rc-true-not-answer":["True, but not the answer","Supported by the passage, but it doesn't answer this question.","Reread the question before confirming. True is not enough; it has to answer what was asked."],
 "rc-word-match":["Word match","It borrows the passage's words, not its meaning.","Familiar words are bait. Put the line in your own words, then match the meaning."],
 "rc-wrong-voice":["Wrong voice","A view the passage reports or argues against, not the writer's own.","Ask whose view it is: the writer's, or someone the writer quotes or rejects?"],
 "va-category-error":["Wrong kind of word","The word doesn't fit the kind of idea the blank needs.","Decide what the blank must do (describe, judge, act) before you read the options."],
 "va-collocation-break":["Doesn't go together","The word doesn't sit naturally with its neighbours.","Say the phrase in full. English pairs certain words by habit; trust the natural pairing."],
 "va-confusable-sibling":["Look-alike word","Looks or sounds like the right word but means something else.","Slow down on look-alikes and pin each word's exact meaning before choosing."],
 "va-corrupted-expression":["Twisted idiom","A familiar expression with one word changed.","Idioms are fixed. If one word differs from the original, the whole option is wrong."],
 "va-half-fix":["Half fix","It corrects one error but leaves another standing.","List every error in the underlined part first. The answer must fix all of them."],
 "va-new-error":["New error","It fixes the original error but brings in a new one.","Read your chosen option as a fresh sentence and check it end to end."],
 "va-off-topic-insertion":["Off-topic sentence","Same subject, but it breaks the paragraph's line of thought.","The missing line must carry the argument forward, not just stay on the subject."],
 "va-polarity-flip":["Wrong direction","The word pulls the opposite way from the sentence's clues.","Mark the clue words around the blank and decide positive or negative before you look at the options."],
 "va-real-expression-wrong-meaning":["Real idiom, wrong meaning","A genuine expression that means something else here.","Check what the idiom means, not just whether it exists."],
 "va-stance-contradiction":["Contradicts the paragraph","It argues against the position the paragraph takes.","Name the paragraph's stance first; reject anything that pulls the other way."],

 "pj-connector":["Missed connector","The order ignores a linking word that ties two sentences.","Find the connectors (however, thus, also) and fix which sentence each one must follow."],
 "pj-antecedent":["Missed reference","A 'this', 'they' or 'such' points to something not yet introduced.","Every pointer word needs its noun earlier. Place that sentence before it."],

var LAST_A=null;
function trapInfo(tag){
 var t=TRAPS[tag];
 if(t)return {name:t[0],what:t[1],fix:t[2]};
 var n=String(tag).replace(/^[a-z]+-/,"").replace(/-/g," ");
 return {name:n.charAt(0).toUpperCase()+n.slice(1),what:"",fix:""};
}
function diffOf(q){
 var d=String(q.difficulty||"").trim().toLowerCase();
 if(!d)return null;
 if(d.indexOf("hard")!==-1)return "hard";
 if(d.charAt(0)==="e")return "easy";
 if(d.charAt(0)==="m")return "medium";
 return null;
}
function penOf(q){return isMCQ(q)?CFG.w:titaWFor(q)}
function trapOf(q,a){
 if(a===null||a===""||a===undefined||isCorrect(q,a))return null;
 if(isMCQ(q)){
  var t=Array.isArray(q.optionTags)?q.optionTags[a]:null;
  return (typeof t==="string"&&t.trim())?t.trim():null;
 }
 if(q.titaTraps&&typeof q.titaTraps==="object"){
  var na=String(a).replace(/[\s,]/g,"");
  for(var k in q.titaTraps){
   if(Object.prototype.hasOwnProperty.call(q.titaTraps,k)&&String(k).replace(/[\s,]/g,"")===na)return q.titaTraps[k];
  }
 }
 return null;
}
function secOfQ(i){if(!SEC)return null;for(var s=0;s<SEC.length;s++){if(i>=SEC[s].start&&i<=SEC[s].end)return s}return null}
function paceOf(i){
 if(RAPID)return QUESTIONS[i].td||30;
 var s=secOfQ(i);
 if(s!==null)return SEC[s].minutes*60/(SEC[s].end-SEC[s].start+1);
 return CFG.minutes*60/NQ;
}
function availSecs(){
 if(RAPID)return QUESTIONS.reduce(function(a,q){return a+(q.td||30)},0);
 if(SEC)return SEC.reduce(function(a,p){return a+p.minutes*60},0);
 return CFG.minutes*60;
}
function fmtMS(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function sgn(n){return n>0?"+"+n:(n<0?"−"+(-n):"0")}
function sgnA(n){return n>0?"+"+n:(n<0?"-"+(-n):"0")}
function blank(x){return x===null||x===""||x===undefined}

function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function capW(s){return s.charAt(0).toUpperCase()+s.slice(1)}

function computeAnalysis(score,totalSecs){
 var A={score:score,max:MAX_MARKS,used:totalSecs||0,avail:availSecs(),c:0,w:0,s:0,neg:0,tC:0,tW:0,tS:0,out:[],
  hasDiff:false,hasTags:false,emW:0,emS:0,emSq:[],traps:[],trapped:0,trapMarks:0,timedOut:0,bankN:0,
  sinks:[],secs:[],journey:null,acc:null,verdict:null,
  diff:{easy:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},medium:{n:0,o:0,c:0,w:0,s:0,net:0,t:0},hard:{n:0,o:0,c:0,w:0,s:0,net:0,t:0}}};
 var trapMap={};
 QUESTIONS.forEach(function(q,i){
  var a=answers[i],sk=blank(a),ok=!sk&&isCorrect(q,a),t=questionTimes[i]||0;
  var o=sk?"s":(ok?"c":"w");
  A.out.push(o);
  if(o==="c"){A.c++;A.tC+=t}
  else if(o==="w"){A.w++;A.tW+=t;A.neg+=-penOf(q);if(isMCQ(q))A.bankN++}
  else{A.s++;A.tS+=t}
  if(RAPID&&sk&&t>=(q.td||30))A.timedOut++;
  var d=diffOf(q);
  if(d){
   A.hasDiff=true;
   var b=A.diff[d];b.n++;b.t+=t;if(t>0)b.o++;
   if(o==="c"){b.c++;b.net+=CFG.c}else if(o==="w"){b.w++;b.net+=penOf(q)}else b.s++;
   if(d!=="hard"){if(o==="w")A.emW++;else if(o==="s"){A.emS++;if(!(RAPID&&t>=(q.td||30)))A.emSq.push(i)}} /* rapid: a question whose clock ran out counts under the clock, not as a skip */
  }
  if(Array.isArray(q.optionTags)||(q.titaTraps&&typeof q.titaTraps==="object"))A.hasTags=true;
  var tg=trapOf(q,a);
  if(tg){
   var inf=trapInfo(tg),sw=CFG.c-penOf(q);
   if(!trapMap[inf.name]){trapMap[inf.name]={name:inf.name,what:inf.what,fix:inf.fix,qs:[],marks:0};A.traps.push(trapMap[inf.name])}
   trapMap[inf.name].qs.push(i);trapMap[inf.name].marks+=sw;A.trapped++;A.trapMarks+=sw;
  }
  if(!RAPID&&t>=Math.max(90,2*paceOf(i)))A.sinks.push({i:i,t:t});
 });
 A.traps.sort(function(x,y){return (y.qs.length-x.qs.length)||(y.marks-x.marks)});
 A.sinks.sort(function(x,y){return y.t-x.t});A.sinks=A.sinks.slice(0,3);

 var order=[],bySec={};

  var k=q.section||"-";
  if(!bySec[k]){bySec[k]={sec:k,n:0,c:0,w:0,s:0,score:0,t:0};order.push(k)}
  var b=bySec[k],o=A.out[i];b.n++;b.t+=questionTimes[i]||0;
  if(o==="c"){b.c++;b.score+=CFG.c}else if(o==="w"){b.w++;b.score+=penOf(q)}else b.s++;
 });
 if(order.length>1)A.secs=order.map(function(k){return bySec[k]});
 if(!RAPID&&visits.length)A.journey=computeJourney();

function computeJourney(){
 var J={never:[],neverEM:0,changed:0,toRight:0,toWrong:0,gain:0,loss:0},byQ={};
 visits.forEach(function(v){(byQ[v.q]=byQ[v.q]||[]).push(v)});
 QUESTIONS.forEach(function(q,i){
  var vs=byQ[i],a=answers[i],d=diffOf(q);
  if(!vs||!vs.length){
   if(blank(a)&&!(questionTimes[i]>0)){J.never.push(i);if(d==="easy"||d==="medium")J.neverEM++}
   return;
  }
  var fn=null;
  for(var k=0;k<vs.length;k++){if(!blank(vs[k].a)){fn=vs[k].a;break}}
  if(fn!==null&&!blank(a)&&!sameAns(q,fn,a)){
   J.changed++;
   var was=isCorrect(q,fn),now=isCorrect(q,a),sw=CFG.c-penOf(q);
   if(!was&&now){J.toRight++;J.gain+=sw}
   else if(was&&!now){J.toWrong++;J.loss+=sw}
  }
 });
 return J;
}

/* The verdict: the biggest single leak, ranked by marks, in plain words. */
function buildVerdict(A){
 var C=[],J=A.journey,hb=A.diff.hard,never=J?J.never:[],top=A.traps[0],spare=Math.max(0,A.avail-A.used);
 if(A.trapped>=2&&top)C.push({k:"trap",m:A.trapMarks});
 var bl=A.emSq.filter(function(i){return never.indexOf(i)===-1}).length;
 if(bl)C.push({k:"blank",m:bl*CFG.c,n:bl});
 if(never.length>=3)C.push({k:"never",m:Math.max(1,J.neverEM)*CFG.c,n:never.length});
 if(A.hasDiff&&hb.c+hb.w>=2&&hb.net<0)C.push({k:"hard",m:-hb.net});
 if(J&&J.loss>J.gain)C.push({k:"second",m:J.loss-J.gain});
 if(RAPID&&A.timedOut>=3)C.push({k:"clock",m:A.timedOut*CFG.c/2});
 C.sort(function(x,y){return y.m-x.m});
 function line(c){
  var n=c.n,m=c.m;
  if(c.k==="trap")return {h:(A.trapped===A.w?"All "+A.w+" of your wrong answers":A.trapped+" of your "+plural(A.w,"wrong answer","wrong answers"))+" fell for a set trap.",s:"Together they cost "+plural(A.trapMarks,"mark","marks")+". The one to fix first: “"+top.name+"”, "+plural(top.qs.length,"time","times")+"."};
  if(c.k==="blank")return {h:"You left "+plural(n,"Easy or Medium question","Easy or Medium questions")+" blank.",s:"That is up to "+m+" marks that needed no new concept."};
  if(c.k==="never")return {h:"You never opened "+plural(n,"question","questions")+(J.neverEM?", "+J.neverEM+" of them Easy or Medium":"")+".",s:spare>=60?"You still had "+fmtMS(spare)+" on the clock when you finished.":"The clock ran out before you reached them."};
  if(c.k==="hard")return {h:"Hard questions cost you "+plural(m,"mark","marks")+" net.",s:hb.c+" right, "+hb.w+" wrong: leaving them blank would have scored higher."};
  if(c.k==="second")return {h:"Changing answers cost you "+plural(m,"mark","marks")+".",s:plural(J.toWrong,"right answer","right answers")+" changed to wrong; "+J.toRight+" wrong changed to right."};
  return {h:"The clock ran out on "+plural(A.timedOut,"question","questions")+".",s:"Each of those scored zero without an attempt."};
 }
 var V={h:"",s:"",also:"",acts:[]};
 if(C.length&&C[0].m>=CFG.c){
  var L=line(C[0]);V.h=L.h;V.s=L.s;
  if(C[1]&&C[1].m>=CFG.c)V.also=line(C[1]).h;
 }else if(A.acc!==null&&A.acc>=80&&!A.emS){
  V.h="A clean attempt: "+A.acc+"% accuracy and nothing easy left blank.";
  V.s="Next step: take on more of the Hard questions.";
 }else{
  V.h="You scored "+A.score+" of "+A.max+(A.acc!==null?" at "+A.acc+"% accuracy":"")+".";
  V.s="No single leak stands out. Go through the review below, question by question.";
 }
 var seen={};
 function act(t,href){if(seen[t])return;seen[t]=1;V.acts.push({t:t,href:href||null})}
 C.forEach(function(c){
  if(c.m<CFG.c)return;
  if(c.k==="trap"&&top.fix)act("Beat “"+top.name+"”: "+top.fix);
  else if(c.k==="never"&&spare>=60)act("Use the whole clock: before you end a section or submit, open every question you have not seen.");
  else if(c.k==="blank"&&RAPID)act("Decide in time: if you can rule out one option, answer and move on.");
  else if(c.k==="blank"||c.k==="never")act("First pass: answer every Easy and Medium question before you give time to a Hard one.");
  else if(c.k==="hard")act("Attempt a Hard question only after you have ruled out two options.");
  else if(c.k==="second")act("Keep your first answer unless you can name what is wrong with it.");
  else if(c.k==="clock")act("Decide in time: if you can rule out one option, answer and move on.");
 });
 V.acts=V.acts.slice(0,2);
 if(A.bankN)act((A.bankN===A.w?"Your "+plural(A.bankN,"wrong answer is","wrong answers are"):A.bankN+" of your wrong answers are")+" now in your Mistake Bank. They come back for revision tomorrow.","mistake_bank.html");
 return V;
}

 var idx=[];
 QUESTIONS.forEach(function(q,i){if(!blank(answers[i])&&!isCorrect(q,answers[i]))idx.push(i)});
 if(!idx.length)return;
 RETRY={done:0,right:0,n:idx.length};
 var h=document.createElement("h1");h.style.cssText="font-size:19px;margin:18px 0 6px";h.textContent="Retry Wrong Questions";box.appendChild(h);
 var n=document.createElement("div");n.className="note";n.style.marginBottom="10px";
 n.textContent="No clock this time. If you get it now, the first miss was a slip or the pressure. If you miss it again, that topic needs revision.";
 box.appendChild(n);
 var tl=document.createElement("div");tl.className="secErr";tl.id="retryTally";box.appendChild(tl);
 idx.forEach(function(i){box.appendChild(retryCard(i))});
 paintTally();
}
function paintTally(){
 var t=document.getElementById("retryTally");if(!t)return;
 t.innerHTML="<b>Retried "+RETRY.done+" of "+RETRY.n+"</b>"+(RETRY.done?" &middot; <span class=\"ok\">now right "+RETRY.right+"</span> &middot; <span class=\"no\">still wrong "+(RETRY.done-RETRY.right)+"</span>":"");
}
function retryCard(i){
 var q=QUESTIONS[i],letters=["A","B","C","D"];
 var w=document.createElement("div");w.className="rq";
 var hd=document.createElement("div");hd.className="rqHead";hd.textContent="Q"+(i+1)+" · "+q.section+(diffOf(q)?" · "+q.difficulty:"");w.appendChild(hd);
 if(q.passage){
  var det=document.createElement("details");var sm=document.createElement("summary");sm.className="mono";sm.textContent="Show passage";det.appendChild(sm);
  var pv=document.createElement("div");pv.className="rqStem";pv.style.marginTop="6px";pv.textContent=q.passage;det.appendChild(pv);w.appendChild(det);
 }
 var st=document.createElement("div");st.className="rqStem";ulText(st,q.stem);w.appendChild(st);
 var ex=document.createElement("div");renderExhibit(q,ex);if(ex.childNodes.length)w.appendChild(ex);
 var res=document.createElement("div");res.className="exp";res.style.display="none";
 function finish(ok,keyText){
  RETRY.done++;if(ok)RETRY.right++;paintTally();
  res.style.display="block";
  res.innerHTML="<b>"+(ok?"Got it this time.":"Not yet.")+"</b> Key: "+escH(keyText)+"<br>";
  res.appendChild(document.createTextNode(q.explanation||""));
 }
 if(isMCQ(q)){
  q.options.forEach(function(opt,k){
   var b=document.createElement("button");b.className="opt";b.textContent=letters[k]+". "+opt;
   b.onclick=function(){
    var bs=w.querySelectorAll("button.opt");for(var j=0;j<bs.length;j++)bs[j].disabled=true;
    var ok=(k===q.answerIndex);b.classList.add(ok?"rOk":"rNo");if(!ok&&bs[q.answerIndex])bs[q.answerIndex].classList.add("rOk");
    finish(ok,letters[q.answerIndex]);
   };
   w.appendChild(b);
  });
 }else{
  var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;margin-top:6px";
  var inp=document.createElement("input");inp.className="tita";inp.placeholder="Type your answer";
  var cb=document.createElement("button");cb.className="btn";cb.textContent="Check";
  cb.onclick=function(){
   if(!inp.value.trim())return;
   inp.disabled=true;cb.disabled=true;
   var ok=isCorrect(q,inp.value);inp.style.borderColor=ok?"var(--green)":"var(--red)";
   finish(ok,String(q.answer));
  };
  row.appendChild(inp);row.appendChild(cb);w.appendChild(row);
 }
 w.appendChild(res);
 return w;
}

/* ---------- PDF text (plain characters only: the PDF font has no minus sign or arrows) ---------- */
function analysisLines(A){
 var L=[],V=A.verdict,dot="   ·   ",J=A.journey;
 var v=[V.h+(V.s?" "+V.s:"")];
 if(V.also)v.push("Also: "+V.also);
 v.push((A.acc!==null?"Accuracy "+A.acc+"%"+dot:"")+"Guessing tax "+(A.neg?"-"+A.neg:"0")+dot+"Time "+fmtMS(A.used)+" of "+fmtMS(A.avail));
 L.push(["Your verdict",v]);
 if(V.acts.length)L.push(["Do this next",V.acts.map(function(a,k){return (k+1)+". "+a.t})]);
 if(A.traps.length)L.push(["Traps that caught you",A.traps.map(function(t){return t.name+" x"+t.qs.length+" ("+t.qs.map(function(i){return "Q"+(i+1)}).join(", ")+")"+(t.what?": "+t.what:"")+(t.fix?" Counter: "+t.fix:"")})]);
 if(A.hasDiff){
  var d=[];
  ["easy","medium","hard"].forEach(function(k){var b=A.diff[k];if(!b.n)return;d.push(capW(k)+": "+b.n+" Qs"+dot+b.c+" right"+dot+b.w+" wrong"+dot+b.s+" blank"+dot+"net "+sgnA(b.net)+(b.o?dot+"avg "+fmtMS(b.t/b.o):""))});
  L.push(["Easy / Medium / Hard",d]);
 }
 var unused=Math.max(0,A.avail-A.used);
 var t=["Right "+fmtMS(A.tC)+dot+"wrong "+fmtMS(A.tW)+(A.tS>=1?dot+"blank "+fmtMS(A.tS):"")+(unused>=1?dot+"not used "+fmtMS(unused):"")];
 if(A.sinks.length)t.push("Time sinks: "+A.sinks.map(function(x){return "Q"+(x.i+1)+" "+fmtMS(x.t)+" ("+outWord(A.out[x.i])+")"}).join(", "));
 if(RAPID&&A.timedOut)t.push("The clock ran out on "+plural(A.timedOut,"question","questions"));
 if(J&&J.never.length)t.push("Never opened: "+J.never.map(function(i){return "Q"+(i+1)}).join(", "));
 L.push(["Where the clock went",t]);
 if(J&&J.changed)L.push(["Second thoughts",["Changed "+plural(J.changed,"answer","answers")+": "+J.toRight+" wrong to right (+"+J.gain+"), "+J.toWrong+" right to wrong (-"+J.loss+")"]]);
 if(A.secs.length)L.push(["By section",A.secs.map(function(b){var att=b.c+b.w;return b.sec+": score "+b.score+dot+b.c+" right"+dot+b.w+" wrong"+dot+b.s+" blank"+dot+"accuracy "+(att?Math.round(100*b.c/att)+"%":"-")+dot+"time "+fmtMS(b.t)})]);
 return L;
}

/* ==================== DOWNLOAD PDF ==================== */
function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Accuracy: "+document.getElementById("stAcc").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 try{ /* v2.7 analysis */
  if(LAST_A){
   doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
   doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
   newPageIfNeeded(20);doc.text("Analysis",margin,y);y+=14;
   analysisLines(LAST_A).forEach(function(sec){
    newPageIfNeeded(30);
    doc.setTextColor(150,115,40);writeWrapped(sec[0],margin,pageW-2*margin,10,"bold");y+=1;
    doc.setTextColor(30,30,30);
    sec[1].forEach(function(ln){writeWrapped(ln,margin+10,pageW-2*margin-10,9.5,"normal")});
    y+=5;
   });
   doc.setTextColor(0,0,0);
  }
 }catch(e){}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  writeWrapped("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+(diffOf(q)?" \u00b7 "+q.difficulty:"")+" \u00b7 time "+fmtMS(questionTimes[i])+"   ["+statusLabel+"]",margin,pageW-2*margin,10,"bold");y+=1;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(String(q.stem).replace(/\[\[|\]\]/g,'"'),margin,pageW-2*margin,10,"normal");y+=2;
  if(q.table!=null&&q.table!==""){
   var trows=Array.isArray(q.table)?q.table:(q.table&&Array.isArray(q.table.rows)?(Array.isArray(q.table.headers)?[q.table.headers].concat(q.table.rows):q.table.rows):null);
   doc.setTextColor(40,40,40);
   if(trows){trows.forEach(function(r){writeWrapped(Array.isArray(r)?r.map(String).join("  |  "):String(r),margin+12,pageW-2*margin-12,8.5,"normal")})}
   else{
    var ttxt=String(q.table);
    if(ttxt.trim().charAt(0)==="<")ttxt=ttxt.replace(new RegExp("</tr>","gi"),"\n").replace(new RegExp("</t[dh]>","gi"),"  |  ").replace(new RegExp("<[^>]+>","g")," ").replace(new RegExp("&amp;","g"),"&").replace(new RegExp("&nbsp;","g")," ");
    ttxt.split("\n").forEach(function(ln){ln=ln.replace(new RegExp("[ ]+","g")," ").trim();if(ln)writeWrapped(ln,margin+12,pageW-2*margin-12,8.5,"normal")});
   }
   doc.setTextColor(0,0,0);y+=2;
  }
  if(q.fig){doc.setTextColor(120,120,120);writeWrapped("[Figure \u2014 shown in the on-screen review]",margin+12,pageW-2*margin-12,8.5,"italic");doc.setTextColor(0,0,0)}
  if(isMCQ(q)){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="   [correct]";
    else if(idx===a){marker="   [your choice]";var ptg=trapOf(q,a);if(ptg)marker+="  trap: "+trapInfo(ptg).name}
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   var pttg=trapOf(q,a);
   writeWrapped("Your answer: "+(skippedQ?"-":a)+(pttg?"   trap: "+trapInfo(pttg).name:""),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

   LOCKED=true: students who open this page see only LOCK_MSG and cannot start.
   Admin preview: open the page with ?admin=1 and pick the Admin batch.
   To open the test to students, set LOCKED=false. */
var LOCKED=true;
var LOCK_MSG="You are not authorized to view this test.";
var ADMIN_VIEW=/[?&]admin(=|&|$)/.test(location.search);
function lockBlocks(batch){return LOCKED&&!(ADMIN_VIEW&&batch==="Admin")}

 if(!LOCKED)return true;
 if(ADMIN_VIEW){var an=document.getElementById("adminNote");an.textContent="ADMIN PREVIEW \u00b7 locked for students \u00b7 select the Admin batch to start";an.style.display="block";return true}
 var card=document.querySelector(".loginCard");
 Array.prototype.forEach.call(card.children,function(el){if(el.tagName!=="H1"&&el.id!=="lgTitle"&&el.id!=="lockMsg")el.style.display="none"});

}

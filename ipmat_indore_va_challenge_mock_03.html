var QUESTIONS=[{"id":"IPMAT_VA_001","section":"VA","format":"RC","kind":"mcq","passage":"Every few months, a survey announces that the public cannot read a graph, and the remedy offered is always the same: more statistics in schools. Teachers' associations call for it, editorial writers repeat it, and the experts who complain loudest are often those whose own findings were mangled in the press the week before. The diagnosis is tidy. It is also, for the most part, wrong.\n\nConsider how a medical finding reaches a reader. A trial finds that a new tablet cuts the risk of a certain kind of stroke 'by half'. The figure is accurate. What it leaves out is that the risk was two in ten thousand to begin with and is now one in ten thousand. A reader who hurries to the chemist has not failed at arithmetic; she has done exactly what the sentence invited her to do. A percentage without its base is a headline wearing a lab coat: it borrows the authority of science while hiding the one number that would let anyone judge it.\n\nPut the same finding as a count, one person fewer in every ten thousand, and most readers weigh it sensibly, including many who could not define a percentage if asked. The trouble, then, starts upstream. A press office wants coverage; a halved risk gets coverage; a reporter on a deadline passes the figure along; the reader acts on it; and when the excitement fades, the reader is blamed for having believed it.\n\nNone of this means that numeracy does not matter. A citizen who cannot tell a rise in a rate from a rise in a total will be fooled by honest numbers as well as dishonest ones, and schools should go on teaching the difference. But training readers to distrust every figure is a poor substitute for asking those who publish figures to print the base alongside the change. A lesson in scepticism, offered on its own, mostly teaches people to ignore the evidence that does not suit them.\n\nThe public's errors with numbers are real enough. They are also, to a large degree, made to order: readers tend to misjudge figures in much the way the figures were built to be misjudged.","stem":"In the stroke-tablet example, the writer treats the reader's decision to buy the tablet as","options":["a sign that schools should still teach rates and totals.","a natural reaction to a reporter's careless choice of words.","a costly mistake that better arithmetic would likely have prevented.","a largely predictable result of the way the finding was put."],"answer":"a largely predictable result of the way the finding was put.","answerIndex":3,"tags":["rc-true-not-answer","rc-false-link","rc-wrong-voice","KEY"],"optionTags":["rc-true-not-answer","rc-false-link","rc-wrong-voice",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (D)\nIn paragraph 2 the reader who hurries to the chemist 'has not failed at arithmetic'. The figure was accurate; what misled her was the missing base risk.\nCorrect (D): The writer says she 'has done exactly what the sentence invited her to do'. 'A largely predictable result of the way the finding was put' restates that. The stem's operative word is 'treats': it asks how the writer judges her decision, not what else the passage says.\nLead distractor (A): Tempting because paragraph 4 does say schools should go on teaching the difference between a rate and a total. But that point is about citizens in general and is never drawn from the tablet example.\nIncorrect (B): Puts the blame on the reporter, who only 'passes the figure along'. The 'by half' wording came with the finding itself, and the figure is accurate; nothing suggests carelessness.\nIncorrect (C): This is the diagnosis of the surveys and experts in paragraph 1, which the writer rejects: she 'has not failed at arithmetic'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in f  suit them.\n\nThe public's errors with numbers are real enough. They are also, to a large degree, made to order: readers tend to misjudge figures in much the way the figures were built to be misjudged.","stem":"What is the writer's view of the call for more statistics teaching in schools?","options":["It is useful but misses where the trouble starts.","It is too narrow and should give way to lessons in doubt.","It is well meant but mostly teaches people to ignore evidence.","It is overdue and would fix most of what the surveys find."],"answer":"It is useful but misses where the trouble starts.","answerIndex":0,"tags":["KEY","rc-reversal","rc-word-match","rc-wrong-voice"],"optionTags":[null,"rc-reversal","rc-word-match","rc-wrong-voice"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (A)\nParagraph 1 reports the standard remedy and calls the diagnosis behind it 'for the most part, wrong'. Paragraph 4 still says numeracy matters.\nCorrect (A): The writer keeps a place for numeracy ('schools should go on teaching the difference') but says 'the trouble, then, starts upstream', in how figures are packaged before they reach readers. 'Useful but misses where the trouble starts' holds both halves.\nLead distractor (D): This is what the teachers' associations and editorial writers believe. The writer reports their view and then calls it mostly wrong.\nIncorrect (B): Reverses paragraph 4, where training readers to distrust every figure is called 'a poor substitute'.\nIncorrect (C): Borrows the passage's words, but in paragraph 4 they describe 'a lesson in scepticism', not the statistics teaching the writer supports.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_003","section":"V isjudge figures in much the way the figures were built to be misjudged.","stem":"In paragraph 2 the writer calls a certain kind of figure 'a headline wearing a lab coat'. This suggests that such a figure","options":["borrows the authority of science to hide a flawed trial.","is a scientific result that reporters have dressed up as news.","trades on the authority of science while hiding the number that matters.","is written by scientists who now think like reporters."],"answer":"trades on the authority of science while hiding the number that matters.","answerIndex":2,"tags":["rc-half-right","rc-reversal","KEY","rc-literal"],"optionTags":["rc-half-right","rc-reversal",null,"rc-literal"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (C)\nThe writer explains the image in the same sentence: such a figure borrows science's authority while leaving out the base.\nCorrect (C): 'Trades on the authority of science' = 'borrows the authority of science'; 'hiding the number that matters' = 'hiding the one number that would let anyone judge it'. The headline is the substance and the lab coat is the costume.\nLead distractor (D): Takes the lab coat as a real scientist. The passage says nothing about scientists changing their habits; the coat is a disguise the headline wears.\nIncorrect (A): Starts right but goes wrong: nothing suggests the trial was flawed. 'The figure is accurate'; what is hidden is the base risk.\nIncorrect (B): Turns the image round: it is the headline that wears the clothes of science, not science that wears the clothes of news.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_004","section":"VA","format":"RC","kind":"mcq","passage":"Every few months, a survey announ stem":"Why, according to the writer's reasoning, is it unfair to blame readers for believing a halved risk?","options":["Reporters alter the figures to meet their deadlines.","Schools now teach them to doubt figures rather than read them.","The misleading form was chosen by others, not by readers.","Scientists hide the base risk to make their trials look better."],"answer":"The misleading form was chosen by others, not by readers.","answerIndex":2,"tags":["rc-false-link","rc-out-of-scope","KEY","rc-false-link"],"optionTags":["rc-false-link","rc-out-of-scope",null,"rc-false-link"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (C)\nParagraph 3 traces a chain: a press office wants coverage, a halved risk gets it, a reporter passes it along, the reader acts, and the reader is blamed. 'The trouble, then, starts upstream.'\nCorrect (C): The blame is unfair because the misleading shape of the number was chosen by the press office and passed along by the reporter; the passage calls the errors 'made to order'. 'Chosen by others, not by readers' paraphrases 'the trouble, then, starts upstream'.\nLead distractor (A): Tempting because the reporter is 'on a deadline'. But he 'passes the figure along', and the passage insists the figure is accurate, so nothing is altered.\nIncorrect (B): The passage never says what schools now teach; it argues against relying on lessons in doubt.\nIncorrect (D): Blames the wrong people for a motive the passage never gives. The figure 'is accurate', and the push comes from a press office that 'wants coverage', not from scientists dressing up their trials.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_005","section":"VA","format":"RC","kind":"mcq","pass  figures were built to be misjudged.","stem":"The main point the passage makes is that the public's misreading of statistics","options":["comes mostly from reporters who word figures badly in a hurry.","is largely shaped by how figures are presented to it.","reflects a wider failure to think clearly about evidence.","shows that schools should teach far more statistics."],"answer":"is largely shaped by how figures are presented to it.","answerIndex":1,"tags":["rc-false-link","KEY","rc-scope-shift","rc-wrong-voice"],"optionTags":["rc-false-link",null,"rc-scope-shift","rc-wrong-voice"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (B)\nThe writer rejects the view that the public simply cannot read numbers, shows how a halved risk misleads, and ends with readers misjudging figures 'in much the way the figures were built to be misjudged'.\nCorrect (B): 'Largely shaped by how figures are presented' restates 'to a large degree, made to order'. The hedge matches the writer's own: the errors are 'real enough'.\nLead distractor (A): The deadline is one link in the paragraph 3 chain. Making it the cause leaves out the press office and the choice of format, which the writer stresses.\nIncorrect (C): Broader than anything the passage argues. The piece is about how statistics are packaged, not about reasoning in general.\nIncorrect (D): This is the remedy the writer reports in paragraph 1 and rejects as a mostly wrong diagnosis.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_006","section":"VA","format":"RC","kind":"mcq","passage":"Every few months, a survey announces that the public cannot read a graph, and the remedy offered is always the same: more statistics in schools. Teachers' associations call for it, editorial writers repeat it, and the experts who complain loudest are often those whose own findings were mangled in the press the week before. The diagnosis is tidy. It is also, for the most part, wrong.\n\nConsider how a medical finding reaches a reader. A trial finds that a new tablet cuts the risk of a certain kind of stroke 'by half'. The figure is accurate. What it leaves out is that the risk was two in ten thousand to begin with and is now one in ten thousand. A reader who hurries to the chemist has not failed at arithmetic; she has done exactly what the sentence invited her to do. A percentage without its base is a headline wearing a lab coat: it borrows the authority of science while hiding the one number that would let anyone judge it.\n\nPut the same finding as a count, one person fewer in every ten thousand, and most readers weigh it sensibly, including many who could not define a percentage if asked. The trouble, then, starts upstream. A press office wants coverage; a halved risk gets coverage; a reporter on a deadline passes the figure along; the reader acts on it; and when the excitement fades, the reader is blamed for having believed it.\n\nNone of this means that numeracy does not matter. A citizen who cannot tell a rise in a rate from a rise in a total will be fooled by honest numbers as well as dishonest ones, and schools should go on teaching the difference. But training readers to distrust every figure is a poor substitute for asking those who publish figures to print the base alongside the change. A lesson in scepticism, offered on its own, mostly teaches people to ignore the evidence that does not suit them.\n\nThe public's errors with numbers are real enough. They are also, to a large degree, made to order: readers tend to misjudge figures in much the way the figures were built to be misjudged.","stem":"'Upstream' (para 3), as used in the passage, most nearly means","options":["out of sight","earlier on","against the flow","higher up"],"answer":"earlier on","answerIndex":1,"tags":["vocab-shade","KEY","vocab-context-blind","vocab-shade"],"optionTags":["vocab-shade",null,"vocab-context-blind","vocab-shade"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (B)\nAfter showing that readers judge a count sensibly, the writer says 'The trouble, then, starts upstream' and lists the steps that come before the reader acts.\nCorrect (B): 'Upstream' here means at an earlier point in the chain, before the figure reaches the reader.\nLead distractor (D): Tempting because a press office sounds senior. But the list that follows is a sequence of stages, not a ladder of rank.\nIncorrect (A): Some steps may be unseen by readers, but the point is when the trouble begins, not whether it is visible.\nIncorrect (C): The everyday sense, moving against a river's current, which does not fit a chain of events.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_007","section":"VA","format":"RC","kind":"mcq","passage":"My friends, who are kind people and much in company, have long held that a man who reads alone is a man in retreat. They speak of the habit as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner. I have never quarrelled with them, partly from idleness and partly because, in my younger years, I half believed them myself.\n\nIt is true that the solitary reader shuts a door. For an hour he hears no voice but the one upon the page, and he answers no one. But I have noticed that the door opens inward. A book read in a crowded room is skimmed for whatever will make good conversation; read alone, it is followed into the places where it is dull, or difficult, or plainly wrong, and it is there, in my experience, that a book earns its keep. In company I have agreed with a dozen books I never finished; alone, I have been made to quarrel with nearly every one I did. The solitary reader is not spared the labour of argument. He merely conducts it with an opponent who cannot be interrupted, and who must therefore be heard to the end.\n\nI grant that the habit can go sour. I have known two or three men in whom reading became a fortress, and who came out of it only to complain that the world had grown noisy. But their trouble, I think, was not that they read alone. It was that they read only what agreed with them, and a man may do that as easily at his club as in his study.\n\nWhat I have come to believe, slowly and against the advice of my friends, is that solitude is not the opposite of company but a rehearsal for it. I do not say that every reader who sits alone comes out improved. But a man who has listened to a whole argument, patiently and in silence, comes down to dinner better able to listen to his neighbour.","stem":"How, according to the passage, do the writer's friends regard his habit of reading alone?","options":["As a quiet rehearsal for the company they enjoy.","As a serious illness that may well keep him from dinner.","As a passing weakness he will probably grow out of.","As a sign that he has quarrelled with them."],"answer":"As a passing weakness he will probably grow out of.","answerIndex":2,"tags":["rc-wrong-voice","rc-extreme","KEY","rc-reversal"],"optionTags":["rc-wrong-voice","rc-extreme",null,"rc-reversal"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Easy","explanation":"Answer: (C)\nParagraph 1: the friends speak of solitary reading 'as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner'.\nCorrect (C): An illness one waits out until the patient is well enough is a passing condition the patient is expected to recover from; 'will probably grow out of' matches 'until the patient is well enough to come down to dinner'.\nLead distractor (A): 'Rehearsal' is the writer's word in the last paragraph, a view he reached 'against the advice of my friends'. It is his view, not theirs.\nIncorrect (B): The friends call it a 'mild' illness that will pass; 'serious' overstates it.\nIncorrect (D): The writer says 'I have never quarrelled with them'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_008","section":"VA","format":"RC","kind":"mcq","passage":"My friends, who are kind people and much in company, have long held that a man who reads alone is a man in retreat. They speak of the habit as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner. I have never quarrelled with them, partly from idleness and partly because, in my younger years, I half believed them myself.\n\nIt is true that the solitary reader shuts a door. For an hour he hears no voice but the one upon the page, and he answers no one. But I have noticed that the door opens inward. A book read in a crowded room is skimmed for whatever will make good conversation; read alone, it is followed into the places where it is dull, or difficult, or plainly wrong, and it is there, in my experience, that a book earns its keep. In company I have agreed with a dozen books I never finished; alone, I have been made to quarrel with nearly every one I did. The solitary reader is not spared the labour of argument. He merely conducts it with an opponent who cannot be interrupted, and who must therefore be heard to the end.\n\nI grant that the habit can go sour. I have known two or three men in whom reading became a fortress, and who came out of ","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_009","section":"VA","format":"RC","kind":"mcq","passage":"My friends, who are kind people and much in company, have long held that a man who reads alone is a man in retreat. They speak of the habit as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner. I have never quarrelled with them, partly from idleness and partly because, in my younger years, I half believed them myself.\n\nIt is true that the solitary reader shuts a door. For an hour he hears no voice but the one upon the page, and he answers no one. But I have noticed that the door opens inward. A book read in a crowded room is skimmed for whatever will make good conversation; read alone, it is followed into the places where it is dull, or difficult, or plainly wrong, and it is there, in my experience, that a book earns its keep. In company I have agreed with a dozen books I never finished; alone, I have been made to quarrel with nearly every one I did. The solitary reader is not spared the labour of argument. He merely conducts it with an opponent who cannot be interrupted, and who must therefore be heard to the end.\n\nI grant that the habit can go sour. I have known two or three men in whom reading became a fortress, and who came out of it only to complain that the world had grown noisy. But their trouble, I think, was not that they read alone. It was that they read only what agreed with them, and a man may do that as easily at his club as in his study.\n\nWhat I have come to believe, slowly and against the advice of my friends, is that solitude is not the opposite of company but a rehearsal for it. I do not say that every reader who sits alone comes out improved. But a man who has listened to a whole argument, patiently and in silence, comes down to dinner better able to listen to his neighbour.","stem":"The writer implies that when one argues with a person face to face, unlike in solitary reading, that person's argument","options":["carries more weight because it is spoken aloud.","is judged more fairly because others are listening.","is skimmed only for the points that make good talk.","is easily cut short before it reaches its end."],"answer":"is easily cut short before it reaches its end.","answerIndex":3,"tags":["rc-out-of-scope","rc-false-link","rc-word-match","KEY"],"optionTags":["rc-out-of-scope","rc-false-link","rc-word-match",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (D)\nParagraph 2: alone, the reader argues 'with an opponent who cannot be interrupted, and who must therefore be heard to the end'.\nCorrect (D): The 'therefore' carries the inference: in live talk an opponent can be interrupted, so the other person's argument is easily cut short before its end.\nLead distractor (B): Joins two things in the passage, company and argument, with a cause it never states. If anything, the passage suggests the solitary reader gives the fuller hearing.\nIncorrect (A): Sounds sensible, but the passage says nothing about spoken arguments carrying more weight.\nIncorrect (C): Paragraph 2 says a book read in company is skimmed. A spoken argument cannot be skimmed; what the passage sets against solitary reading is interruption.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_010","section":"VA","format":"RC","kind":"mcq","passage":"My friends, who are kind people and much in company, have long held that a man who reads alone is a man in retreat. They speak of the habit as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner. I have never quarrelled with them, partly from idleness and partly because, in my younger years, I half believed them myself.\n\nIt is true that the solitary reader shuts a door. For an hour he hears no voice but the one upon the page, and he answers no one. But I have noticed that the door opens inward. A book read in a crowded room is skimmed for whatever will make good conversation; read alone, it is followed into the places where it is dull, or difficult, or plainly wrong, and it is there, in my experience, that a book earns its keep. In company I have agreed with a dozen books I never finished; alone, I have been made to quarrel with nearly every one I did. The solitary reader is not spared the labour of argument. He merely conducts it with an opponent who cannot be interrupted, and who must therefore be heard to the end.\n\nI grant that the habit can go sour. I have known two or three men in whom reading became a fortress, and who came out of it only to complain that the world had grown noisy. But their trouble, I think, was not that they read alone. It was that they read only what agreed with them, and a man may do that as easily at his club as in his study.\n\nWhat I have come to believe, slowly and against the advice of my friends, is that solitude is not the opposite of company but a rehearsal for it. I do not say that every reader who sits alone comes out improved. But a man who has listened to a whole argument, patiently and in silence, comes down to dinner better able to listen to his neighbour.","stem":"According to the writer, the men for whom reading 'became a fortress' went wrong because they","options":["complained that the world around them had grown noisy.","read alone, away from the company of their friends.","read only the books that agreed with what they already thought.","read at the club rather than in a quiet study."],"answer":"read only the books that agreed with what they already thought.","answerIndex":2,"tags":["rc-true-not-answer","rc-reversal","KEY","rc-word-match"],"optionTags":["rc-true-not-answer","rc-reversal",null,"rc-word-match"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (C)\nParagraph 3 concedes that the habit 'can go sour' in a few men, then gives the writer's diagnosis.\nCorrect (C): 'It was that they read only what agreed with them' = 'read only the books that agreed with what they already thought'. The stem asks for the cause, which is this.\nLead distractor (A): True, they did complain. But the complaint is what came out of the fortress, not the reason it was built; the stem asks why they went wrong.\nIncorrect (B): The writer says their trouble 'was not that they read alone'.\nIncorrect (D): Misuses the closing words: a man 'may do that as easily at his club as in his study'. The place does not matter.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_011","section":"VA","format":"RC","kind":"mcq","passage":"My friends, who are kind people and much in company, have long held that a man who reads alone is a man in retreat. They speak of the habit as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner. I have never quarrelled with them, partly from idleness and partly because, in my younger years, I half believed them myself.\n\nIt is true that the solitary reader shuts a door. For an hour he hears no voice but the one upon the page, and he answers no one. But I have noticed that the door opens inward. A book read in a crowded room is skimmed for whatever will make good conversation; read alone, it is followed into the places where it is dull, or difficult, or plainly wrong, and it is there, in my experience, that a book earns its keep. In company I have agreed with a dozen books I never finished; alone, I have been made to quarrel with nearly every one I did. The solitary reader is not spared the labour of argument. He merely conducts it with an opponent who cannot be interrupted, and who must therefore be heard to the end.\n\nI grant that the habit can go sour. I have known two or three men in whom reading became a fortress, and who came out of it only to complain that the world had grown noisy. But their trouble, I think, was not that they read alone. It was that they read only what agreed with them, and a man may do that as easily at his club as in his study.\n\nWhat I have come to believe, slowly and against the advice of my friends, is that solitude is not the opposite of company but a rehearsal for it. I do not say that every reader who sits alone comes out improved. But a man who has listened to a whole argument, patiently and in silence, comes down to dinner better able to listen to his neighbour.","stem":"The passage is chiefly concerned with showing that reading alone","options":["may improve a person's character in almost every way.","may leave a person better able to listen in company.","forces a reader to follow a book to its hard parts.","is a pleasant retreat that needs no excuse."],"answer":"may leave a person better able to listen in company.","answerIndex":1,"tags":["rc-scope-shift","KEY","rc-detail-as-main","rc-wrong-voice"],"optionTags":["rc-scope-shift",null,"rc-detail-as-main","rc-wrong-voice"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (B)\nThe essay moves from the friends' view (reading alone as retreat) through the image of the inward-opening door to its late thesis: solitude is 'a rehearsal' for company.\nCorrect (B): The last paragraph says a man who has listened to a whole argument in silence 'comes down to dinner better able to listen to his neighbour'. 'Better able to listen in company' states this.\nLead distractor (C): A true detail from paragraph 2, but it is a step in the argument, not where the argument ends up.\nIncorrect (A): Broader than the passage, which claims one benefit: better listening.\nIncorrect (D): Accepts the friends' word 'retreat', which the writer spends the essay correcting.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_012","section":"VA","format":"RC","kind":"mcq","passage":"My friends, who are kind people and much in company, have long held that a man who reads alone is a man in retreat. They speak of the habit as one speaks of a mild illness, to be borne with patience until the patient is well enough to come down to dinner. I have never quarrelled with them, partly from idleness and partly because, in my younger years, I half believed them myself.\n\nIt is true that the solitary reader shuts a door. For an hour he hears no voice but the one upon the page, and he answers no one. But I have noticed that the door opens inward. A book read in a crowded room is skimmed for whatever will make good conversation; read alone, it is followed into the places where it is dull, or difficult, or plainly wrong, and it is there, in my experience, that a book earns its keep. In company I have agreed with a dozen books I never finished; alone, I have been made to quarrel with nearly every one I did. The solitary reader is not spared the labour of argument. He merely conducts it with an opponent who cannot be interrupted, and who must therefore be heard to the end.\n\nI grant that the habit can go sour. I have known two or three men in whom reading became a fortress, and who came out of it only to complain that the world had grown noisy. But their trouble, I think, was not that they read alone. It was that they read only what agreed with them, and a man may do that as easily at his club as in his study.\n\nWhat I have come to believe, slowly and against the advice of my friends, is that solitude is not the opposite of company but a rehearsal for it. I do not say that every reader who sits alone comes out improved. But a man who has listened to a whole argument, patiently and in silence, comes down to dinner better able to listen to his neighbour.","stem":"Which of the following is most nearly OPPOSITE in meaning to 'plainly' as used in paragraph 2?","options":["debatably","clearly","partly","ornately"],"answer":"debatably","answerIndex":0,"tags":["KEY","vocab-shade","vocab-shade","vocab-context-blind"],"optionTags":[null,"vocab-shade","vocab-shade","vocab-context-blind"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (A)\nParagraph 2 lists the places a solitary reader follows a book into: where it is 'dull, or difficult, or plainly wrong'.\nCorrect (A): In 'dull, or difficult, or plainly wrong', 'plainly' means obviously or beyond doubt. Its opposite in this sense is 'debatably': wrong only in a way one could argue about.\nLead distractor (C): Tempting because 'plainly wrong' sounds like 'wholly wrong'. But 'plainly' is about how obvious the error is, not how much of the book is wrong.\nIncorrect (B): A synonym of 'plainly' in this sense, not an opposite.\nIncorrect (D): The opposite of 'plainly' in its other sense, 'simply, without decoration' (plainly dressed), which does not fit 'plainly wrong'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_013","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nDrivers who ___ the new helmet rule will be fined on the spot, the traffic commissioner warned.","options":["flout","flaunt","float","flounce"],"answer":"flout","answerIndex":0,"tags":["KEY","confusable/homophone sibling","confusable/homophone sibling","confusable/homophone sibling"],"optionTags":[null,"vocab-sound-alike","vocab-sound-alike","vocab-sound-alike"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (A)\nCorrect (A): To flout a rule is to break it openly. Only drivers who break the rule would be fined.\nIncorrect (B): The sound-alike sibling: to flaunt is to show something off ('flaunt one's wealth'), not to break a rule.\nIncorrect (C): A sound-alike meaning to stay on the surface of water or to put forward an idea; it makes no sense with 'rule' here.\nIncorrect (D): A sound-alike meaning to move in an angry, showy way; it takes no object.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: confusable flout/flaunt; 'will be fined' requires breaking the rule"},{"id":"IPMAT_VA_014","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\nWhen fuel prices rose sharply, many shipping companies made a simple discovery: a cargo ship that sails a little slower burns a great deal less fuel. Engineers explained that the resistance of water climbs steeply with speed, so a modest cut in speed brings a much larger cut in fuel. ____ Retailers had to order goods earlier, and some warehouses had to hold larger stocks to cover the gap. Even so, many firms kept the slower speeds after fuel became cheaper again, having found that customers rarely noticed the extra days.","options":["Many ports have also begun charging ships for the pollution they cause.","The saving came at a price, since every voyage now took several days longer.","Slower ships, it turned out, burned almost as much fuel as faster ones.","Some companies also fitted their ships with newer, more efficient propellers."],"answer":"The saving came at a price, since every voyage now took several days longer.","answerIndex":1,"tags":["off-topic insertion","KEY","stance contradiction","right topic, wrong focus"],"optionTags":["rc-out-of-scope",null,"rc-reversal","para-same-topic"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (B)\nCorrect (B): 'The saving' refers back to the fuel cut just explained, and 'several days longer' is what makes retailers order earlier and warehouses hold larger stocks. It is also what 'the extra days' in the last sentence refers to.\nIncorrect (A): Brings in port charges, which have nothing to do with ordering goods earlier.\nIncorrect (C): Contradicts the opening, where a slower ship burns 'a great deal less fuel'.\nIncorrect (D): On the topic of saving fuel, but it gives no reason why retailers would have to order earlier.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'The saving' refers back; 'days longer' sets up ordering earlier and 'the extra days'"},{"id":"IPMAT_VA_015","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nThe new curriculum is ___ on the idea that children learn best by doing, but critics fear that, without ___ guidance from teachers, such freedom may simply ___ the gap between strong and weak students.","options":["based; careless; widen","premised; careful; widen","premeditated; close; widen","founded; careful; narrow"],"answer":"premised; careful; widen","answerIndex":1,"tags":["polarity flip","KEY","near-miss sense","polarity flip"],"optionTags":["vocab-opposite",null,"vocab-shade","vocab-opposite"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (B)\nCorrect (B): 'Premised on' means based on; 'careful guidance' is what the critics fear will be missing; 'widen the gap' is the harm they fear. Every word fits its blank.\nIncorrect (A): Critics would not worry about the absence of 'careless' guidance.\nIncorrect (C): 'Premeditated' means planned in advance, usually of a crime; a curriculum is 'premised', not 'premeditated', on an idea.\nIncorrect (D): 'Narrow the gap' would be a good outcome, not something critics fear.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: killers at positions 3, 2, 1 (narrow, careless, premeditated)"},{"id":"IPMAT_VA_016","section":"VA","format":"Paragraph Completion","kind":"mcq","passage":null,"stem":"The paragraph given below has a sentence missing, which is indicated by a blank. From the choices given below the paragraph, choose the sentence that is most logically appropriate to complete the paragraph.\nIn many smaller towns, the public library had become a quiet room of yellowing newspapers that few people visited. Over the last few years, a new kind of reader has filled its benches: young people preparing for competitive exams, who arrive when the doors open and leave when the lights go off. ____ Some libraries have responded by extending their hours, adding power points for laptops and setting aside rooms where silence is strictly kept. Librarians say the change has also brought back older readers, who come for the newspapers and stay because the place feels alive again.","options":["Coaching centres in these towns have meanwhile been raising their fees every year.","Few of them, however, stay for more than an hour at a stretch.","Most of them come not for the books but for a desk, a fan and hours without interruption.","Many of these aspirants have left jobs or college courses to prepare full-time."],"answer":"Most of them come not for the books but for a desk, a fan and hours without interruption.","answerIndex":2,"tags":["off-topic insertion","stance contradiction","KEY","right topic, wrong focus"],"optionTags":["rc-out-of-scope","rc-reversal",null,"para-same-topic"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (C)\nCorrect (C): 'Most of them' picks up the young aspirants of the sentence before, and the needs it names (a desk, a fan, quiet hours) are what the libraries then supply: longer hours, power points, silent rooms. 'Responded' in the next sentence needs exactly these needs to respond to.\nIncorrect (A): Brings in coaching fees, which the paragraph never discusses, and gives the libraries nothing to respond to.\nIncorrect (B): Contradicts the sentence before it: these readers stay from opening time until the lights go off.\nIncorrect (D): On topic, but it is about the aspirants' lives, not what they need from a library. It cannot explain the power points and silent rooms that follow.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: 'Most of them' links to the aspirants; named needs are answered by 'responded by extending ... power points ... silence'"},{"id":"IPMAT_VA_017","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nThe cyclone ___ havoc on the coastal villages, flattening huts and uprooting coconut palms for miles.","options":["reeked","wreaked","wrecked","raked"],"answer":"wreaked","answerIndex":1,"tags":["confusable/homophone sibling","KEY","confusable/homophone sibling","collocation break"],"optionTags":["vocab-sound-alike",null,"vocab-sound-alike","sc-collocation"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (B)\nCorrect (B): 'Wreak havoc' is the fixed collocation for causing great damage; 'wreaked' is its past tense.\nIncorrect (A): A sound-alike meaning 'smelled strongly'.\nIncorrect (C): A sound-alike: one can wreck a boat, but the verb that goes with 'havoc' is 'wreak'.\nIncorrect (D): Does not collocate with 'havoc'.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: collocation 'wreak havoc'"},{"id":"IPMAT_VA_018","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nThe scheme aims [[to train teachers, improving school buildings and to reducing]] the number of students who drop out.","options":["to train teachers, improve school buildings and reduce","to train teachers, improving school buildings and to reducing","to train teachers, improve school buildings and to reducing","training teachers, improving school buildings and reducing"],"answer":"to train teachers, improve school buildings and reduce","answerIndex":0,"tags":["KEY","original span (both errors kept)","half-fix","new error introduced"],"optionTags":[null,"gram-sounds-right","gram-half-fix","gram-new-error"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (A)\nCorrect (A): After 'aims to', the three actions must be parallel: 'to train ..., improve ... and reduce'. The underlined part breaks the series twice, with 'improving' and 'to reducing'.\nIncorrect (B): The original: it keeps both breaks in the series.\nIncorrect (C): Fixes 'improve' but leaves 'to reducing'.\nIncorrect (D): The list is now parallel, but 'aims training' is wrong: 'aim' takes 'to' + verb or 'at' + -ing.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: parallelism after 'aims to'; key is the only fully parallel infinitive series"},{"id":"IPMAT_VA_019","section":"VA","format":"Sentence Completion","kind":"mcq","passage":null,"stem":"Complete the following sentence by choosing the most appropriate word/phrase from the options given below.\nThe new code of conduct ___ the use of phones in the examination hall; anyone found with one will be disqualified.","options":["prescribes","inscribes","proscribes","describes"],"answer":"proscribes","answerIndex":2,"tags":["confusable/homophone sibling","confusable/homophone sibling","KEY","confusable/homophone sibling"],"optionTags":["vocab-sound-alike","vocab-sound-alike",null,"vocab-sound-alike"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (C)\nCorrect (C): To proscribe is to forbid. The second half of the sentence, disqualification for anyone found with a phone, shows that phones are banned.\nIncorrect (A): The confusable sibling: to prescribe is to lay down as required, nearly the opposite of a ban.\nIncorrect (B): Means to write or carve words on a surface.\nIncorrect (D): Fits the grammar but not the sense: the penalty shows a ban, not a description.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: confusable proscribe/prescribe; disqualification clause requires 'forbids'"},{"id":"IPMAT_VA_020","section":"VA","format":"Parajumble","kind":"tita","passage":"1. The photographs from such drives are easy to take: rows of volunteers, freshly dug pits, a sapling in every hole.\n2. For this reason, foresters have long argued that a drive should be judged not by how many trees go into the ground but by how many are still standing five years later.\n3. What the photographs do not show is the second summer, when many of those saplings quietly die for want of water or care.\n4. Planting drives have become a favourite way for companies and cities to show that they take the climate seriously.\n5. By that measure, a village that waters two hundred saplings for three years may do more than a city that plants twenty thousand in a day.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"41325","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"41352":"pj-pair-broken","42513":"pj-topic-link"},"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: 41325\nSentence 4: opens with the general claim about planting drives.\nSentence 1: 'such drives' needs the opener before it.\nSentence 3: 'What the photographs do not show' answers the photographs of the sentence before.\nSentence 2: 'For this reason' follows the dying saplings.\nSentence 5: 'By that measure' applies the foresters' test from the sentence before.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order fixed by 'such drives', 'What the photographs do not show', 'For this reason', 'By that measure'"},{"id":"IPMAT_VA_021","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nThe lecture was so ___ in its detail that most students left the hall more ___ than when they had come in.","options":["convolution; puzzled","intricate; enlightened","convoluted; perplexed","tangled; bemusement"],"answer":"convoluted; perplexed","answerIndex":2,"tags":["category/part-of-speech error","polarity flip","KEY","category/part-of-speech error"],"optionTags":["vocab-category","vocab-opposite",null,"vocab-category"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (C)\nCorrect (C): 'Convoluted' (twisted and hard to follow) explains why students left 'more perplexed' than before.\nIncorrect (A): 'Convolution' is a noun; 'so ___ in its detail' needs an adjective.\nIncorrect (B): 'Enlightened' reverses the result: a lecture too complex to follow does not leave students clearer.\nIncorrect (D): 'Bemusement' is a noun; 'more ___ than' needs an adjective.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: killers at positions 2, 1, 2 (enlightened, convolution, bemusement)"},{"id":"IPMAT_VA_022","section":"VA","format":"Sentence Correction","kind":"mcq","passage":null,"stem":"In the following sentence, the incorrect part of the sentence is underlined. Choose an alternative from the four given options so that the sentence is rendered correct.\nThe coach insisted that each player [[attends the session, regardless if]] it rained.","options":["attends the session, regardless if","attend the session, regardless if","attend the session, irregardless of whether","attend the session, regardless of whether"],"answer":"attend the session, regardless of whether","answerIndex":3,"tags":["original span (both errors kept)","half-fix","new error introduced","KEY"],"optionTags":["gram-sounds-right","gram-half-fix","gram-new-error",null],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (D)\nCorrect (D): After 'insisted that' a demand takes the bare subjunctive: 'each player attend'. 'Regardless if' is non-standard; the standard phrase is 'regardless of whether'.\nIncorrect (A): The original: it keeps both errors.\nIncorrect (B): Fixes the subjunctive but keeps 'regardless if'.\nIncorrect (C): Fixes the subjunctive, but 'irregardless' is not standard English, so a new error replaces the old one.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: subjunctive after 'insisted that'; 'regardless of whether'"},{"id":"IPMAT_VA_023","section":"VA","format":"Cloze","kind":"mcq","passage":null,"stem":"The sentence below has words that are missing. Choose the best option from those given below to complete it.\nArchivists warn that digital records, often assumed to be ___, can in fact ___ within a few years if the software needed to read them is not ___.","options":["permanent; vanish; maintained","indelible; flourish; kept up","ephemeral; vanish; updated","lasting; deteriorate; abandoned"],"answer":"permanent; vanish; maintained","answerIndex":0,"tags":["KEY","polarity flip","polarity flip","polarity flip"],"optionTags":[null,"vocab-opposite","vocab-opposite","vocab-opposite"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (A)\nCorrect (A): 'Often assumed to be permanent ... can in fact vanish' sets up the warning, and the condition is that the software is 'not maintained'.\nIncorrect (B): Records do not 'flourish' because software is neglected; the warning needs a loss.\nIncorrect (C): 'In fact' needs a contrast: records assumed 'ephemeral' vanishing would be no surprise.\nIncorrect (D): The danger arises if software is not maintained; 'not abandoned' reverses the condition.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: killers at positions 3, 1, 2 (abandoned, ephemeral, flourish)"},{"id":"IPMAT_VA_024","section":"VA","format":"Parajumble","kind":"tita","passage":"1. If this is right, the night before an exam may be the worst time to give up sleep for one more hour of revision.\n2. Psychologists have long noticed that students who sleep after studying remember more than those who stay up.\n3. The usual explanation was simply that a rested mind works better.\n4. More recent work suggests a busier picture: during deep sleep, the brain appears to replay the day's learning, strengthening some connections and letting others fade.","stem":"The sentences given below, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Decide on the proper order for the sentences and key in this sequence of numbers as your answer. For example, a response such as 3412 is valid; 3412. or 3 4 1 2 are invalid.","options":[],"answer":"2341","answerIndex":null,"tags":[],"optionTags":null,"titaTraps":{"2314":"pj-pair-broken","2431":"pj-topic-link"},"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: 2341\nSentence 2: opens with the observation that needs explaining.\nSentence 3: 'The usual explanation' explains that observation.\nSentence 4: 'More recent work' revises the usual explanation.\nSentence 1: 'If this is right' draws a conclusion from the replay idea.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"VA: order fixed by 'The usual explanation', 'More recent work', 'If this is right'"},{"id":"IPMAT_VA_025","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Welcome back. My guest today is a psychologist who has spent her career studying why people keep going at long, dull tasks: learning an instrument, preparing for an exam, rebuilding a business after it fails. Let me start with what most of our listeners believe. If you're struggling to keep going, you simply haven't found something you're passionate about. Find the passion, and the effort takes care of itself. Fair?\n\nPSYCHOLOGIST: Half fair. Passion is real, and I'd never tell anyone to do without it. But I've started dividing motivation into two kinds, and I call them sail and keel. Sail is the feeling: excitement, curiosity, the rush of a new start. When the wind is up, sail moves you faster than anything else. Keel is everything below the waterline: routines, promises to other people, a sense of who you are. You don't feel the keel. You only notice it when it's missing.\n\nHOST: Missing how?\n\nPSYCHOLOGIST: A boat with all sail and no keel goes wherever the wind goes. Think of the student who works furiously for the first three weeks of a course. Then the excitement fades and, this is the important part, she reads the fade as a verdict. She decides she was never meant for the subject, and she quits. The quitting isn't caused by the fading. It's caused by what she concludes from it.\n\nHOST: So you're saying passion doesn't matter.\n\nPSYCHOLOGIST: No, and that's the bit people mishear. A keel on its own doesn't take you anywhere; it only stops you drifting. Among the exam candidates I've worked with, the ones who lasted almost always had some sail. They liked something about the subject. But the ones who lasted longest were not the ones who liked it most. They were the ones who had built a routine that didn't ask them each morning how they felt.\n\nHOST: Can you build a keel on purpose?\n\nPSYCHOLOGIST: Slowly. You can't feel your way into one. You build it by doing the thing on days when you'd rather not, until doing it stops being a decision. Most people try the opposite. They wait for the wind, and they call the waiting 'getting ready'.\n\nHOST: That sounds a little harsh.\n\nPSYCHOLOGIST: Perhaps it is. But the wind always drops at some point. The only question is what's holding you steady when it does.","stem":"Which of the following best expresses the psychologist's main point?","options":["Staying power comes from habits that outlast the first excitement.","Students quit because their excitement fades over time.","Passion is of little use to anyone doing long, dull work.","Habits usually count for more than passion, whatever the goal is."],"answer":"Staying power comes from habits that outlast the first excitement.","answerIndex":0,"tags":["KEY","rc-false-link","rc-wrong-voice","rc-scope-shift"],"optionTags":[null,"rc-false-link","rc-wrong-voice","rc-scope-shift"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Medium","explanation":"Answer: (A)\nThe psychologist calls the host's passion view 'half fair': sail matters, but what keeps people going over a long task is the keel.\nCorrect (A): The ones who lasted longest 'had built a routine that didn't ask them each morning how they felt', and the closing lines ask what holds you steady when the wind drops. 'Habits that outlast the first excitement' is the keel.\n  new start) but ends wrong: sail does not carry anyone through, because the wind drops.\nIncorrect (A): Borrows 'other people' from her description of the keel ('promises to other people') and attaches it to the sail, which she defines as a feeling.\nIncorrect (C): A sensible reading of 'sail' as setting a course, but she defines sail as a feeling, not a goal.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_027","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Welcome back. My guest today is a psychologist who has spent her career studying why people keep going at long, dull tasks: learning an instrument, preparing for an exam, rebuilding a business after it fails. Let me start with what most of our listeners believe. If you're struggling to keep going, you simply haven't found something you're passionate about. Find the passion, and the effort takes care of itself. Fair?\n\nPSYCHOLOGIST: Half fair. Passion is real, and I'd never tell anyone to do without it. But I've started dividing motivation into two kinds, and I call them sail and keel. Sail is the feeling: excitement, curiosity, the rush of a new start. When the wind is up, sail moves you faster than anything else. Keel is everything below the waterline: routines, promises to other people, a sense of who you are. You don't feel the keel. You only notice it when it's missing.\n\nHOST: Missing how?\n\nPSYCHOLOGIST: A boat with all sail and no keel goes wherever the wind goes. Think of the student who works furiously for the first three weeks of a course. Then the excitement fades and, this is the important part, she reads the fade as a verdict. She decides she was never meant for the subject, and she quits. The quitting isn't caused by the fading r not', not after passion is found.\nIncorrect (B): Starts right but goes too far: she says passion is real and she would 'never tell anyone to do without it'. The keel steadies; it does not replace the sail.\nIncorrect (D): Takes 'below the waterline' to mean something hidden and dark. Her list is routines, promises and a sense of self, not fears.","archetype":null,"status":"approved","flags":[],"verified":"ok","verNote":"RC: key letter, length rank and strength from seeded blueprint script (seed 20261006); blind and strong solves run in fresh subagents (results in auditNote); gate 1 (RC Option Audit) and gate 4 (human read) pending"},{"id":"IPMAT_VA_028","section":"VA","format":"RC","kind":"mcq","passage":"HOST: Welcome back. My guest today is a psychologist who has spent her career studying why people keep going at long, dull tasks: learning an instrument, preparing for an exam, rebuilding a business after it fails. Let me start with what most of our listeners believe. If you're struggling to keep going, you simply haven't found something you're passionate about. Find the passion, and the effort takes care of itself. Fair?\n\nPSYCHOLOGIST: Half fair. Passion is real, and I'd never tell anyone to do without it. But I've started dividing motivation into two kinds, and I call them sail and keel. Sail is the feeling: excitement, curiosity, the rush of a new start. When the wind is up, sail moves you faster than anything else. Keel is everything below the waterline: routines, promises to other people, a sense of who you are. You don't feel the keel. You only notice it when it's missing.\n\nHOST: Missing how?\n\nPSYCHOLOGIST: A boat with all sail and no keel goes wherever the wind goes. Think of the student who works furiously for the first three weeks of a course. Then the excitement fades and, this is the important part, she reads the fade as a verdict. She decides she was never meant for the subject, and she quits. The quitting isn't caused by the fading. It's caused by what she concludes from it.\n\nHOST: So you're saying passion doesn't matter.\n\nPSYCHOLOGIST: No, and that's the bit people mishear. A keel on its own doesn't take you anywhere; it only stops you drifting. Among the exam candidates I've worked with, the ones who lasted almost always had some sail. They liked something about the subject. But the ones who lasted longest were not the ones who liked it most. They were the ones who had built a routine that didn't ask them each morning how they felt.\n\nHOST: Can you build a keel on purpose?\n\nPSYCHOLOGIST: Slowly. You can't feel your way into one. You build it by doing the thing on days when you'd rather not, until doing it stops being a decision. Most people try the opposite. They wait for the wind, and they call the waiting 'getting ready'.\n\nHOST: That sounds a little harsh.\n\nPSYCHOLOGIST: Perhaps it is. But the wind always drops at some point. The only question is what's holding you steady when it does.","stem":"Which of the following does NOT reflect the psychologist's view?","options":["Most of those who lasted had no liking for the subject.","Many people mistake waiting for the right mood for actually getting ready.","No one can simply feel their way into a keel.","A person notices the keel only when it is missing."],"answer":"Most of those who lasted had no liking for the subject.","answerIndex":0,"tags":["KEY","rc-true-not-answer","rc-extreme","rc-extreme"],"optionTags":[null,"rc-true-not-answer","rc-extreme","rc-extreme"],"titaTraps":null,"fig":null,"table":null,"difficulty":"Hard","explanation":"Answer: (A)\nThree options restate things she says, two of them in words that sound too strong to be hers. One reverses what she says about the candidates who lasted.\nCorrect (A): She says 'the ones who lasted almost always had some sail. They liked something about the subject.' Saying most of them had no liking for it turns this round, so this is the option that does NOT reflect her view.\nLead distractor (

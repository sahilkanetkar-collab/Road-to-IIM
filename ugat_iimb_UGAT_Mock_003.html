<html lang="en">
<head>

<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono&display=swap");
:root{--navy:#0B1220;--panel:#101A2D;--panel2:#152136;--gold:#D4A94E;--text:#E8E4D8;--mut:#8B94A8;--green:rgba(78,160,130,1);--red:#C05555;--line:rgba(212,169,78,.22)}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:var(--text);font-family:"DM Sans",sans-serif}
h1{font-family:Fraunces,serif;color:var(--gold)}
.mono{font-family:"DM Mono",monospace;font-size:12px;color:var(--mut)}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:420px;width:100%}
.loginCard h1{font-size:24px;margin-bottom:2px}
.loginCard h2{font-family:Fraunces,serif;font-size:15px;color:var(--text);font-weight:600;margin-bottom:18px}
.loginCard label{display:block;font-family:"DM Mono";font-size:10.5px;color:var(--mut);letter-spacing:.1em;margin:12px 0 5px}
.loginCard input,.loginCard select{width:100%;background:var(--panel2);color:var(--text);border:1px solid rgba(232,228,216,.25);border-radius:7px;padding:10px 12px;font-size:14px;font-family:"DM Sans"}
#loginErr{display:none;color:var(--red);font-size:12.5px;margin-top:10px}
#winNote{display:none;margin-top:12px;padding:10px 12px;border-radius:7px;font-size:12.5px;line-height:1.6;border:1px solid var(--line);background:var(--panel2)}
#winNote b{font-family:"DM Mono";letter-spacing:.06em;font-size:10.5px;display:block;margin-bottom:3px}
#winNote.shut{border-color:rgba(192,85,85,.5);color:var(--red)}
#winNote.soon{border-color:rgba(212,169,78,.5);color:var(--gold)}
#loginBtn:disabled{opacity:.45;cursor:not-allowed}
#loginBtn{width:100%;margin-top:16px;background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer}
.testMeta{font-family:"DM Mono";font-size:10.5px;color:var(--mut);margin-top:14px;line-height:1.7}
#testScreen,#resultsScreen{display:none;max-width:1020px;margin:0 auto;padding:18px}
#topBar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 16px;margin-bottom:14px}
#topBar .tName{font-family:Fraunces,serif;color:var(--gold);font-weight:700}
#timer{font-family:"DM Mono";color:var(--gold);font-size:20px;margin-left:auto}
#layout{display:grid;grid-template-columns:1fr 210px;gap:14px}
@media(max-width:760px){#layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:12px}
.secBadge{font-family:"DM Mono";font-size:10.5px;color:var(--gold);letter-spacing:.08em}
#passageBox{display:none;background:var(--panel2);border-left:3px solid var(--gold);border-radius:6px;padding:12px;margin:10px 0;font-size:14px;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto}
#qText{font-size:16px;line-height:1.6;margin:12px 0;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid rgba(232,228,216,.15);color:var(--text);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:14.5px;font-family:"DM Sans"}
.opt.sel{border-color:var(--gold);background:rgba(212,169,78,.14)}
input.tita{background:var(--panel2);border:1px solid rgba(212,169,78,.4);color:var(--text);border-radius:8px;padding:12px;font-size:16px;width:100%;font-family:"DM Mono"}
.btn{background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:14px;font-family:"DM Sans"}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid rgba(232,228,216,.3)}
.btn.green{background:var(--green)}
#sidePanel h3{font-family:"DM Mono";font-size:10.5px;color:var(--mut);letter-spacing:.1em;margin-bottom:8px}
#palette{display:flex;flex-wrap:wrap;gap:6px}
#palette button{width:34px;height:34px;border-radius:6px;border:1px solid rgba(232,228,216,.2);background:var(--panel2);color:var(--text);cursor:pointer;font-family:"DM Mono";font-size:12px}
#palette .done{background:rgba(78,160,130,.25);border-color:rgba(78,160,130,.7)}
#palette .cur{border-color:var(--gold)}
.legend{font-size:11px;color:var(--mut);margin-top:10px;line-height:2}
.legend span{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat .v{font-family:"DM Mono";font-size:22px;color:var(--gold)}
.stat .l{font-family:"DM Mono";font-size:9.5px;color:var(--mut);letter-spacing:.08em;margin-top:4px}
.secErr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:14px}
.secErr b{color:var(--gold)}
#pdfBtn{margin:10px 0}
.rq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.rqHead{font-family:"DM Mono";font-size:11px;color:var(--mut);margin-bottom:8px}
.status{font-weight:700;margin-left:8px}
.status.ok{color:var(--green)}.status.no{color:var(--red)}.status.sk{color:var(--mut)}
.rqStem{font-size:14.5px;line-height:1.55;margin-bottom:8px;white-space:pre-wrap}
.ropt{display:flex;gap:10px;padding:7px 10px;border-radius:6px;font-size:13.5px;margin:3px 0}
.ropt.correct{background:rgba(78,160,130,.15);color:var(--green)}
.ropt.wrong{background:rgba(192,85,85,.13);color:var(--red)}
.exp{font-size:12.5px;color:var(--mut);margin-top:8px;border-top:1px solid rgba(232,228,216,.08);padding-top:8px}
.exp b{color:var(--gold)}
</style>
</head>

var CFG={"testName":"UGAT Mock 003","examName":"UGAT IIM Bangalore","maxMarks":180,"minutes":120,"c":3,"w":-1,"titaW":-1,"hasTita":false,"navNote":"free navigation","fileName":"ugat_iimb_UGAT_Mock_003.html","snKey":"riim_session_UGAT_Mock_003","bankPrefix":"UGAT_Mock_003"};
var QUESTIONS=[{"id":"M003-Q01","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"The number of distinct real solutions of the equation |x² − 4x + 3| = 1 is:","options":["4","2","3","1"],"answer":"3","answerIndex":2,"difficulty":"Hard","explanation":"x²−4x+2=0 gives two roots (disc 8); x²−4x+4=0 gives one (x=2): total 3.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q02","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"The number of points at which the function f(x) = ||x| − 2| is NOT differentiable is:","options":["1","2","3","4"],"answer":"3","answerIndex":2,"difficulty":"Hard","explanation":"Corners occur at x = −2, 0 and 2, so f is non-differentiable at 3 points.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q03","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"The minimum value of f(x) = |x − 1| + |x − 2| + |x − 4| over all real x is:","options":["3","4","2","5"],"answer":"3","answerIndex":0,"difficulty":"Hard","explanation":"For an odd number of points the minimum is at the median x = 2: f(2) = 1+0+2 = 3.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q04","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"∫₀^π x·sin x dx equals:","options":["π/2","π","2π","π²/2"],"answer":"π","answerIndex":1,"difficulty":"Hard","explanation":"By parts: [−x cos x]₀^π + ∫₀^π cos x dx = π + 0 = π.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q05","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"At how many points on the curve y = x³ − 3x + 2 is the tangent parallel to the x-axis?","options":["0","1","3","2"],"answer":"2","answerIndex":3,"difficulty":"Medium","explanation":"y′ = 3x² − 3 = 0 at x = ±1: two points.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q06","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"The number of integer values of x satisfying |2x − 3| ≤ 7 is:","options":["8","7","9","6"],"answer":"8","answerIndex":0,"difficulty":"Medium","explanation":"−7 ≤ 2x−3 ≤ 7 ⟹ −2 ≤ x ≤ 5: the 8 integers −2,…,5.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q07","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"The roots of x² − px + 12 = 0 differ by 1, with p > 0. The value of p is:","options":["7","6","5","8"],"answer":"7","answerIndex":0,"difficulty":"Medium","explanation":"(α−β)² = p² − 48 = 1 ⟹ p = 7 (roots 3 and 4).","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q08","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"If log₂x + log₄x + log₁₆x = 7, then x equals:","options":["8","64","16","32"],"answer":"16","answerIndex":2,"difficulty":"Hard","explanation":"log₂x·(1 + ½ + ¼) = 7 ⟹ log₂x = 4 ⟹ x = 16.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q09","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"In how many distinct arrangements of the letters of the word SUCCESS do the vowels appear together?","options":["360","60","240","120"],"answer":"120","answerIndex":3,"difficulty":"Hard","explanation":"Treat UE as one unit with S,S,S,C,C: 6!/(3!·2!) × 2! = 60 × 2 = 120.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q10","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"A biased coin shows heads with probability 1/3. It is tossed 5 times. The probability of getting exactly 2 heads is:","options":["40/243","80/243","10/243","16/81"],"answer":"80/243","answerIndex":1,"difficulty":"Hard","explanation":"C(5,2)·(1/3)²·(2/3)³ = 10 × 8/243 × 1/... = 80/243.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q11","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"A bag contains 4 red and 3 blue balls. Two balls are drawn one after the other without replacement. Given that the second ball is red, the probability that the first ball was also red is:","options":["4/7","3/7","2/7","1/2"],"answer":"1/2","answerIndex":3,"difficulty":"Hard","explanation":"P(RR)/P(2nd R) = (2/7)/(4/7) = 1/2.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q12","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"Two fair dice are rolled. Given that the larger of the two numbers is 5, the probability that the sum is 8 is:","options":["1/9","1/6","2/9","1/3"],"answer":"2/9","answerIndex":2,"difficulty":"Hard","explanation":"Max = 5 in 9 outcomes; sum 8 among them only for (3,5),(5,3): 2/9.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q13","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"Plants X, Y and Z supply 50%, 30% and 20% of a firm's switches; 1%, 2% and 3% of their outputs respectively are defective. A randomly chosen switch is found defective. The probability that it came from plant X is:","options":["5/17","6/17","1/3","5/11"],"answer":"5/17","answerIndex":0,"difficulty":"Hard","explanation":"Bayes: 0.005/(0.005+0.006+0.006) = 5/17.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q14","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"A random variable X takes values −2, −1, 0, 1, 2 with probabilities 0.1, 0.2, 0.4, 0.2, 0.1 respectively. The variance of (3X − 5) is:","options":["1.2","3.6","10.8","5.8"],"answer":"10.8","answerIndex":2,"difficulty":"Hard","explanation":"E(X)=0, Var(X)=1.2; Var(3X−5) = 9 × 1.2 = 10.8.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q15","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"If A is a 3 × 3 matrix with |A| = 4, then |adj A| equals:","options":["4","16","8","64"],"answer":"16","answerIndex":1,"difficulty":"Medium","explanation":"|adj A| = |A|^(n−1) = 4² = 16 for n = 3.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q16","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"If A is a 3 × 3 skew-symmetric matrix, which of the following is necessarily true?","options":["A = Aᵀ","|A| = 0","A is invertible","|A| = 1"],"answer":"|A| = 0","answerIndex":1,"difficulty":"Medium","explanation":"For odd order, |A| = |−Aᵀ| = (−1)³|A| ⟹ |A| = 0.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q17","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"In a survey, 70% of respondents use UPI, 75% use debit cards and 80% use net banking. The minimum possible percentage using all three is:","options":["35%","20%","30%","25%"],"answer":"25%","answerIndex":3,"difficulty":"Hard","explanation":"Minimum of triple overlap = 70+75+80 − 2×100 = 25%.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q18","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"A trader marks his goods 40% above cost and then allows a discount of 15% on the marked price. His profit percentage is:","options":["15%","25%","21%","19%"],"answer":"19%","answerIndex":3,"difficulty":"Medium","explanation":"SP = 1.40 × 0.85 = 1.19 × CP ⟹ 19% profit.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q19","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"A can finish a job in 12 days and B in 18 days. Working together with C, they finish it in 4 days. C alone can finish the job in:","options":["9 days","8 days","6 days","12 days"],"answer":"9 days","answerIndex":0,"difficulty":"Medium","explanation":"C's rate = 1/4 − 1/12 − 1/18 = 1/9 ⟹ 9 days.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q20","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"A vessel contains milk and water in the ratio 5 : 3. When 16 litres of the mixture are removed and replaced with 16 litres of water, the ratio becomes 3 : 5. The initial quantity of mixture in the vessel was:","options":["32 litres","56 litres","40 litres","48 litres"],"answer":"40 litres","answerIndex":2,"difficulty":"Hard","explanation":"With total 8x: (5x−10)/(3x+10) = 3/5 ⟹ x = 5 ⟹ 40 litres.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q21","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"Two runners start together from the same point on a 400 m circular track, running in the same direction at 6 m/s and 4 m/s. After how much time do they meet for the first time?","options":["200 s","160 s","100 s","400 s"],"answer":"200 s","answerIndex":0,"difficulty":"Medium","explanation":"Relative speed 2 m/s must cover one full lap: 400/2 = 200 s.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q22","section":"QADI","format":"QA mixed (JEE-lite)","kind":"mcq","passage":null,"stem":"The sum of an infinite geometric series is 27 and the sum of the squares of its terms is 243. The common ratio is:","options":["1/3","1/2","2/3","3/4"],"answer":"1/2","answerIndex":1,"difficulty":"Hard","explanation":"a/(1−r)=27 and a²/(1−r²)=243 ⟹ 27a/(1+r)=243 ⟹ a=9(1+r)=27(1−r) ⟹ r=1/2.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q23","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the table and answer the questions that follow.\n\nDaily production at five textile units:\n\nUnit | Looms | Output per loom per day (metres) | Defective output | Selling price (₹ per metre)\nSurat | 40 | 60 | 5% | 80\nTiruppur | 25 | 80 | 4% | 90\nLudhiana | 30 | 50 | 6% | 120\nPanipat | 20 | 90 | 8% | 75\nBhiwandi | 35 | 70 | 2% | 60\n\nOnly non-defective cloth is sold, at the prices shown.","stem":"Which unit has the highest daily saleable (non-defective) output in metres?","options":["Bhiwandi","Tiruppur","Surat","Panipat"],"answer":"Bhiwandi","answerIndex":0,"difficulty":"Medium","explanation":"Saleable: Surat 2280, Tiruppur 1920, Ludhiana 1410, Panipat 1656, Bhiwandi 2401 — Bhiwandi highest.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q24","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the table and answer the questions that follow.\n\nDaily production at five textile units:\n\nUnit | Looms | Output per loom per day (metres) | Defective output | Selling price (₹ per metre)\nSurat | 40 | 60 | 5% | 80\nTiruppur | 25 | 80 | 4% | 90\nLudhiana | 30 | 50 | 6% | 120\nPanipat | 20 | 90 | 8% | 75\nBhiwandi | 35 | 70 | 2% | 60\n\nOnly non-defective cloth is sold, at the prices shown.","stem":"The total defective output per day across all five units is:","options":["463 metres","483 metres","493 metres","473 metres"],"answer":"483 metres","answerIndex":1,"difficulty":"Medium","explanation":"120 + 80 + 90 + 144 + 49 = 483 metres.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q25","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the table and answer the questions that follow.\n\nDaily production at five textile units:\n\nUnit | Looms | Output per loom per day (metres) | Defective output | Selling price (₹ per metre)\nSurat | 40 | 60 | 5% | 80\nTiruppur | 25 | 80 | 4% | 90\nLudhiana | 30 | 50 | 6% | 120\nPanipat | 20 | 90 | 8% | 75\nBhiwandi | 35 | 70 | 2% | 60\n\nOnly non-defective cloth is sold, at the prices shown.","stem":"The daily revenue of Surat is approximately what percentage more than that of Tiruppur?","options":["3.6%","4.8%","5.6%","7.2%"],"answer":"5.6%","answerIndex":2,"difficulty":"Hard","explanation":"Surat ₹1,82,400 vs Tiruppur ₹1,72,800: 9600/172800 ≈ 5.56% ≈ 5.6%.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q26","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the table and answer the questions that follow.\n\nDaily production at five textile units:\n\nUnit | Looms | Output per loom per day (metres) | Defective output | Selling price (₹ per metre)\nSurat | 40 | 60 | 5% | 80\nTiruppur | 25 | 80 | 4% | 90\nLudhiana | 30 | 50 | 6% | 120\nPanipat | 20 | 90 | 8% | 75\nBhiwandi | 35 | 70 | 2% | 60\n\nOnly non-defective cloth is sold, at the prices shown.","stem":"If Panipat reduces its defect rate from 8% to 3% with the same total output, its daily revenue would increase by:","options":["₹6,750","₹5,400","₹7,200","₹8,100"],"answer":"₹6,750","answerIndex":0,"difficulty":"Hard","explanation":"Extra saleable = 1800 × 5% = 90 m; 90 × ₹75 = ₹6,750.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q27","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the information and answer the questions that follow.\n\nThe line graph shows the annual revenue (₹ crore) of Meghdoot Logistics from 2019 to 2024:\n2019: 120 · 2020: 150 · 2021: 180 · 2022: 160 · 2023: 200 · 2024: 240\n\nThe table shows total expenditure as a percentage of revenue for each year:\n2019: 75% · 2020: 80% · 2021: 70% · 2022: 85% · 2023: 72% · 2024: 75%\n\nProfit = Revenue − Expenditure.","stem":"In which year was the profit of Meghdoot Logistics the highest?","options":["2021","2022","2023","2024"],"answer":"2024","answerIndex":3,"difficulty":"Medium","explanation":"Profits: 30, 30, 54, 24, 56, 60 (₹ crore) — highest in 2024.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q28","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the information and answer the questions that follow.\n\nThe line graph shows the annual revenue (₹ crore) of Meghdoot Logistics from 2019 to 2024:\n2019: 120 · 2020: 150 · 2021: 180 · 2022: 160 · 2023: 200 · 2024: 240\n\nThe table shows total expenditure as a percentage of revenue for each year:\n2019: 75% · 2020: 80% · 2021: 70% · 2022: 85% · 2023: 72% · 2024: 75%\n\nProfit = Revenue − Expenditure.","stem":"The profit in 2021 was what percentage of the revenue in 2021?","options":["25%","30%","32%","28%"],"answer":"30%","answerIndex":1,"difficulty":"Medium","explanation":"Profit 54 on revenue 180: 30%.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q29","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the information and answer the questions that follow.\n\nThe line graph shows the annual revenue (₹ crore) of Meghdoot Logistics from 2019 to 2024:\n2019: 120 · 2020: 150 · 2021: 180 · 2022: 160 · 2023: 200 · 2024: 240\n\nThe table shows total expenditure as a percentage of revenue for each year:\n2019: 75% · 2020: 80% · 2021: 70% · 2022: 85% · 2023: 72% · 2024: 75%\n\nProfit = Revenue − Expenditure.","stem":"The ratio of the total profit earned during 2019–2021 to that earned during 2022–2024 is:","options":["54 : 67","57 : 70","61 : 70","57 : 73"],"answer":"57 : 70","answerIndex":1,"difficulty":"Hard","explanation":"114 : 140 = 57 : 70.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q30","section":"QADI","format":"DI set (1 set × 4)","kind":"mcq","passage":"Study the information and answer the questions that follow.\n\nThe line graph shows the annual revenue (₹ crore) of Meghdoot Logistics from 2019 to 2024:\n2019: 120 · 2020: 150 · 2021: 180 · 2022: 160 · 2023: 200 · 2024: 240\n\nThe table shows total expenditure as a percentage of revenue for each year:\n2019: 75% · 2020: 80% · 2021: 70% · 2022: 85% · 2023: 72% · 2024: 75%\n\nProfit = Revenue − Expenditure.","stem":"The percentage increase in profit from 2022 to 2023 was approximately:","options":["113%","143%","123%","133%"],"answer":"133%","answerIndex":3,"difficulty":"Hard","explanation":"(56 − 24)/24 = 133.3%.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q31","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight friends — Anaya, Bhavesh, Charvi, Danish, Esha, Farhan, Gauri and Harsh — sit in two parallel rows of four, with equal distance between adjacent persons. Members of Row 1 face South and members of Row 2 face North, so that each person in one row faces exactly one person in the other row. All references to left and right are from the seated person's own point of view.\n• Harsh sits at an extreme end of the row facing South.\n• Only two persons sit between Harsh and Charvi.\n• Gauri faces Charvi.\n• Esha sits second to the left of Gauri.\n• Bhavesh faces Esha.\n• Anaya sits immediately to the left of Bhavesh.\n• Danish does not face Harsh.","stem":"Who faces Danish?","options":["Anaya","Bhavesh","Charvi","Harsh"],"answer":"Anaya","answerIndex":0,"difficulty":"Hard","explanation":"Unique arrangement — Row facing South (W→E): Harsh, Bhavesh, Anaya, Charvi; Row facing North (W→E): Farhan, Esha, Danish, Gauri. Anaya faces Danish.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q32","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight friends — Anaya, Bhavesh, Charvi, Danish, Esha, Farhan, Gauri and Harsh — sit in two parallel rows of four, with equal distance between adjacent persons. Members of Row 1 face South and members of Row 2 face North, so that each person in one row faces exactly one person in the other row. All references to left and right are from the seated person's own point of view.\n• Harsh sits at an extreme end of the row facing South.\n• Only two persons sit between Harsh and Charvi.\n• Gauri faces Charvi.\n• Esha sits second to the left of Gauri.\n• Bhavesh faces Esha.\n• Anaya sits immediately to the left of Bhavesh.\n• Danish does not face Harsh.","stem":"Who sits second to the right of Farhan?","options":["Esha","Danish","Gauri","Anaya"],"answer":"Danish","answerIndex":1,"difficulty":"Hard","explanation":"Farhan is at the western end of the row facing North; his right is East — second to his right is Danish.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q33","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight friends — Anaya, Bhavesh, Charvi, Danish, Esha, Farhan, Gauri and Harsh — sit in two parallel rows of four, with equal distance between adjacent persons. Members of Row 1 face South and members of Row 2 face North, so that each person in one row faces exactly one person in the other row. All references to left and right are from the seated person's own point of view.\n• Harsh sits at an extreme end of the row facing South.\n• Only two persons sit between Harsh and Charvi.\n• Gauri faces Charvi.\n• Esha sits second to the left of Gauri.\n• Bhavesh faces Esha.\n• Anaya sits immediately to the left of Bhavesh.\n• Danish does not face Harsh.","stem":"Three of the following four pairs are alike in a certain way based on the arrangement. Which pair is different?","options":["Bhavesh–Anaya","Harsh–Bhavesh","Farhan–Gauri","Esha–Danish"],"answer":"Farhan–Gauri","answerIndex":2,"difficulty":"Hard","explanation":"The first three pairs are immediate neighbours; Farhan and Gauri sit at the two ends of their row.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q34","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight friends — Anaya, Bhavesh, Charvi, Danish, Esha, Farhan, Gauri and Harsh — sit in two parallel rows of four, with equal distance between adjacent persons. Members of Row 1 face South and members of Row 2 face North, so that each person in one row faces exactly one person in the other row. All references to left and right are from the seated person's own point of view.\n• Harsh sits at an extreme end of the row facing South.\n• Only two persons sit between Harsh and Charvi.\n• Gauri faces Charvi.\n• Esha sits second to the left of Gauri.\n• Bhavesh faces Esha.\n• Anaya sits immediately to the left of Bhavesh.\n• Danish does not face Harsh.","stem":"How many persons sit between Esha and Gauri?","options":["One","Three","Two","None"],"answer":"One","answerIndex":0,"difficulty":"Medium","explanation":"Esha and Gauri are in the same row with only Danish between them.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q35","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight colleagues — Ishan, Juhi, Karan, Leela, Madhav, Nitya, Oorja and Prakash — sit around a circular table. Some face the centre and some face outside. All references to left and right are from the seated person's own point of view.\n• Exactly three of the eight face outside, and no two persons facing outside are immediate neighbours.\n• Ishan faces the centre. Prakash sits immediately to the right of Ishan.\n• Karan sits second to the left of Ishan.\n• Juhi is an immediate neighbour of both Ishan and Karan, and Karan is Juhi's immediate right-hand neighbour.\n• Madhav sits third to the right of Juhi.\n• Leela is an immediate neighbour of both Karan and Madhav, and Leela sits immediately to the left of Madhav.\n• Oorja sits immediately to the left of Nitya, and Prakash sits immediately to the right of Oorja.","stem":"Who sits third to the left of Madhav?","options":["Leela","Karan","Ishan","Juhi"],"answer":"Juhi","answerIndex":3,"difficulty":"Hard","explanation":"Madhav faces outside, so his left runs anticlockwise: Leela, Karan, Juhi — Juhi is third.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q36","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight colleagues — Ishan, Juhi, Karan, Leela, Madhav, Nitya, Oorja and Prakash — sit around a circular table. Some face the centre and some face outside. All references to left and right are from the seated person's own point of view.\n• Exactly three of the eight face outside, and no two persons facing outside are immediate neighbours.\n• Ishan faces the centre. Prakash sits immediately to the right of Ishan.\n• Karan sits second to the left of Ishan.\n• Juhi is an immediate neighbour of both Ishan and Karan, and Karan is Juhi's immediate right-hand neighbour.\n• Madhav sits third to the right of Juhi.\n• Leela is an immediate neighbour of both Karan and Madhav, and Leela sits immediately to the left of Madhav.\n• Oorja sits immediately to the left of Nitya, and Prakash sits immediately to the right of Oorja.","stem":"How many persons sit between Prakash and Leela when counted clockwise from Prakash?","options":["Three","Two","Four","Five"],"answer":"Three","answerIndex":0,"difficulty":"Hard","explanation":"Clockwise from Prakash: Ishan, Juhi, Karan, then Leela — three persons between.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q37","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight colleagues — Ishan, Juhi, Karan, Leela, Madhav, Nitya, Oorja and Prakash — sit around a circular table. Some face the centre and some face outside. All references to left and right are from the seated person's own point of view.\n• Exactly three of the eight face outside, and no two persons facing outside are immediate neighbours.\n• Ishan faces the centre. Prakash sits immediately to the right of Ishan.\n• Karan sits second to the left of Ishan.\n• Juhi is an immediate neighbour of both Ishan and Karan, and Karan is Juhi's immediate right-hand neighbour.\n• Madhav sits third to the right of Juhi.\n• Leela is an immediate neighbour of both Karan and Madhav, and Leela sits immediately to the left of Madhav.\n• Oorja sits immediately to the left of Nitya, and Prakash sits immediately to the right of Oorja.","stem":"Which of the following groups contains exactly the three persons who face outside?","options":["Karan, Madhav, Oorja","Juhi, Madhav, Oorja","Juhi, Nitya, Oorja","Juhi, Madhav, Prakash"],"answer":"Juhi, Madhav, Oorja","answerIndex":1,"difficulty":"Hard","explanation":"The facing constraints force Juhi, Madhav and Oorja to face outside; the rest face the centre.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q38","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":"Read the information and answer the questions that follow.\n\nEight colleagues — Ishan, Juhi, Karan, Leela, Madhav, Nitya, Oorja and Prakash — sit around a circular table. Some face the centre and some face outside. All references to left and right are from the seated person's own point of view.\n• Exactly three of the eight face outside, and no two persons facing outside are immediate neighbours.\n• Ishan faces the centre. Prakash sits immediately to the right of Ishan.\n• Karan sits second to the left of Ishan.\n• Juhi is an immediate neighbour of both Ishan and Karan, and Karan is Juhi's immediate right-hand neighbour.\n• Madhav sits third to the right of Juhi.\n• Leela is an immediate neighbour of both Karan and Madhav, and Leela sits immediately to the left of Madhav.\n• Oorja sits immediately to the left of Nitya, and Prakash sits immediately to the right of Oorja.","stem":"Who sits second to the right of Nitya?","options":["Leela","Prakash","Oorja","Madhav"],"answer":"Leela","answerIndex":0,"difficulty":"Hard","explanation":"Nitya faces the centre; her right runs anticlockwise: Madhav, then Leela.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q39","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"'P × Q' means P is the wife of Q; 'P + Q' means P is the father of Q; 'P − Q' means P is the sister of Q. In the expression A × B + C − D, how is D related to A?","options":["Nephew","Daughter","Son","Son or daughter — cannot be determined"],"answer":"Son or daughter — cannot be determined","answerIndex":3,"difficulty":"Hard","explanation":"A is B's wife; B is father of C; C is D's sister — D is A's child, but D's gender is not given.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q40","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"In a certain code, 'α' means divide by 4, 'β' means add 7, 'γ' means multiply by 3 and 'δ' means subtract 5, with operations applied strictly left to right. The value of 16 α β γ δ is:","options":["23","28","26","33"],"answer":"28","answerIndex":1,"difficulty":"Medium","explanation":"((16 ÷ 4) + 7) × 3 − 5 = 33 − 5 = 28.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q41","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"Riya walks 21 m towards North from her office, turns right and walks 28 m, then turns right again and walks 42 m, and stops. How far and in which direction is she from her office?","options":["21 m South-East","35 m North-East","49 m South-West","35 m South-East"],"answer":"35 m South-East","answerIndex":3,"difficulty":"Hard","explanation":"Net: 21 m South and 28 m East ⟹ √(21² + 28²) = 35 m, towards South-East.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q42","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"Find the next term of the series: 4, 9, 25, 49, 121, ?","options":["169","149","196","144"],"answer":"169","answerIndex":0,"difficulty":"Hard","explanation":"Squares of consecutive primes: 2², 3², 5², 7², 11², 13² = 169.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q43","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"What is the two-digit number N?\nI. The sum of the digits of N is 9.\nII. The number obtained by reversing the digits of N is 27 less than N.","options":["Statement I alone is sufficient","Statement II alone is sufficient","Both statements together are sufficient","Both statements together are not sufficient"],"answer":"Both statements together are sufficient","answerIndex":2,"difficulty":"Hard","explanation":"I alone: many numbers; II alone: digit difference 3 — many numbers; together: digits sum 9, differ by 3 ⟹ 63 uniquely.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q44","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"Statements: All ledgers are registers. Some registers are files. No file is a folder.\nConclusions:\nI. Some registers are not folders.\nII. Some ledgers are files.","options":["Both I and II follow","Only conclusion II follows","Only conclusion I follows","Neither I nor II follows"],"answer":"Only conclusion I follows","answerIndex":2,"difficulty":"Hard","explanation":"The registers that are files cannot be folders, so I follows; nothing links ledgers to files, so II does not.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q45","section":"LR","format":"LR mixed (banking register)","kind":"mcq","passage":null,"stem":"Three of the following four numbers are alike in a certain way. Choose the one that is different: 17, 27, 37, 47","options":["17","27","37","47"],"answer":"27","answerIndex":1,"difficulty":"Medium","explanation":"17, 37 and 47 are prime; 27 = 3³ is composite.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q46","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nThe footpath, that most maligned of Indian public spaces, is routinely described in the language of pathology — encroached, congested, lawless. Yet to walk it attentively is to read a ledger of unrecorded enterprise. The vendor who unfurls her tarpaulin of vegetables at dawn is not an interruption of the city's order but a clause in its unwritten constitution. She extends the market to those whom the supermarket's air-conditioned threshold quietly excludes; she keeps watch over the street long after the shops have shuttered; her credit, dispensed in whispers and remembered without ledgers, is a banking system for those the banks have never courted. Planners who dream of boulevards swept clean of such commerce mistake tidiness for order. Order, properly understood, is not the absence of clutter but the presence of cooperation — dense, improvised, self-correcting. When municipal drives evict vendors in the name of beautification, they do not restore order; they dismantle it, replacing a living arrangement with an empty geometry. A city that cannot distinguish between its blemishes and its capillaries will, in scrubbing its skin, drain its blood.","stem":"The author's principal contention in the passage is that:","options":["informal street commerce constitutes a functioning order that formal planning misreads as disorder","beautification drives are motivated primarily by corruption among municipal officials","supermarkets deliberately conspire to exclude the urban poor from retail markets","street vending should be legalised through a system of municipal licences"],"answer":"informal street commerce constitutes a functioning order that formal planning misreads as disorder","answerIndex":0,"difficulty":"Hard","explanation":"The passage argues vendors form a living, cooperative order that planners mistake for clutter; licensing, conspiracy and corruption are never proposed.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q47","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nThe footpath, that most maligned of Indian public spaces, is routinely described in the language of pathology — encroached, congested, lawless. Yet to walk it attentively is to read a ledger of unrecorded enterprise. The vendor who unfurls her tarpaulin of vegetables at dawn is not an interruption of the city's order but a clause in its unwritten constitution. She extends the market to those whom the supermarket's air-conditioned threshold quietly excludes; she keeps watch over the street long after the shops have shuttered; her credit, dispensed in whispers and remembered without ledgers, is a banking system for those the banks have never courted. Planners who dream of boulevards swept clean of such commerce mistake tidiness for order. Order, properly understood, is not the absence of clutter but the presence of cooperation — dense, improvised, self-correcting. When municipal drives evict vendors in the name of beautification, they do not restore order; they dismantle it, replacing a living arrangement with an empty geometry. A city that cannot distinguish between its blemishes and its capillaries will, in scrubbing its skin, drain its blood.","stem":"In the passage, the phrase 'empty geometry' most nearly refers to:","options":["the poor architectural design of Indian streets","the mathematical models used by urban planners","streets that retain physical form but have been stripped of their living social function","footpaths that remain unused because they are badly paved"],"answer":"streets that retain physical form but have been stripped of their living social function","answerIndex":2,"difficulty":"Hard","explanation":"The phrase contrasts a 'living arrangement' with what remains after eviction — form without function.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q48","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nThe footpath, that most maligned of Indian public spaces, is routinely described in the language of pathology — encroached, congested, lawless. Yet to walk it attentively is to read a ledger of unrecorded enterprise. The vendor who unfurls her tarpaulin of vegetables at dawn is not an interruption of the city's order but a clause in its unwritten constitution. She extends the market to those whom the supermarket's air-conditioned threshold quietly excludes; she keeps watch over the street long after the shops have shuttered; her credit, dispensed in whispers and remembered without ledgers, is a banking system for those the banks have never courted. Planners who dream of boulevards swept clean of such commerce mistake tidiness for order. Order, properly understood, is not the absence of clutter but the presence of cooperation — dense, improvised, self-correcting. When municipal drives evict vendors in the name of beautification, they do not restore order; they dismantle it, replacing a living arrangement with an empty geometry. A city that cannot distinguish between its blemishes and its capillaries will, in scrubbing its skin, drain its blood.","stem":"Which of the following situations most closely parallels the author's reasoning?","options":["A school punishes latecomers strictly, and punctuality improves within a month","A housing society replaces its long-standing informal water-sharing rota with an automated pump schedule, and residents soon stop resolving supply disputes among themselves","A bank digitises its passbooks, and customers gradually learn to use the mobile application","A factory installs safety railings, and workplace accidents decline sharply"],"answer":"A housing society replaces its long-standing informal water-sharing rota with an automated pump schedule, and residents soon stop resolving supply disputes among themselves","answerIndex":1,"difficulty":"Hard","explanation":"Only (a) shows a formal intervention dismantling an invisible, self-correcting cooperative arrangement — the passage's core logic.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q49","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nThe footpath, that most maligned of Indian public spaces, is routinely described in the language of pathology — encroached, congested, lawless. Yet to walk it attentively is to read a ledger of unrecorded enterprise. The vendor who unfurls her tarpaulin of vegetables at dawn is not an interruption of the city's order but a clause in its unwritten constitution. She extends the market to those whom the supermarket's air-conditioned threshold quietly excludes; she keeps watch over the street long after the shops have shuttered; her credit, dispensed in whispers and remembered without ledgers, is a banking system for those the banks have never courted. Planners who dream of boulevards swept clean of such commerce mistake tidiness for order. Order, properly understood, is not the absence of clutter but the presence of cooperation — dense, improvised, self-correcting. When municipal drives evict vendors in the name of beautification, they do not restore order; they dismantle it, replacing a living arrangement with an empty geometry. A city that cannot distinguish between its blemishes and its capillaries will, in scrubbing its skin, drain its blood.","stem":"Which of the following, if shown to be true, would most damage the author's position?","options":["Supermarket chains in India have grown faster than street vending over the past decade","Some vendors occasionally relocate voluntarily to covered markets during the monsoon","A few municipal beautification drives were later found to have exceeded their budgets","In cities that moved vendors into planned markets, vendor incomes, neighbourhood retail activity and street safety all improved, and most vendors chose not to return"],"answer":"In cities that moved vendors into planned markets, vendor incomes, neighbourhood retail activity and street safety all improved, and most vendors chose not to return","answerIndex":3,"difficulty":"Hard","explanation":"If formal relocation improves every outcome the author credits to informal order — and vendors prefer it — the 'living arrangement' claim collapses; the other options are peripheral.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q50","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nEvery stepwell that is fenced, ticketed and floodlit tells a double story: one of rescue, and one of quiet estrangement. The conservationist arrives when the water has receded from memory, and his instruments — the plaque, the railing, the entry register — perform a curious alchemy: they transmute a place of use into an object of regard. What was once descended into is now merely looked at. We congratulate ourselves on having saved the structure, and we have; but we have saved it the way a taxidermist saves a tiger. Memory, unlike masonry, does not endure by being sealed against touch. It endures by circulation — by the woman who draws water, the children who count the steps, the festival that annually muddies the carvings. A monument withdrawn from use is withdrawn, by degrees, from meaning; the town walks past it as one walks past a stranger's photograph. This is the conservator's paradox: that protection, pursued as embalming, completes the very forgetting it set out to arrest. The truer preservation may be shabbier — worn steps, imperfect walls — but it keeps the one thing no scaffolding can hold up: the habit of belonging.","stem":"The central paradox identified by the author is that:","options":["conservation pursued as strict enclosure hastens the very forgetting it is meant to prevent","tourists value monuments more than the local residents do","governments spend on monuments while neglecting living communities","stepwells cannot be restored once their water sources have dried up"],"answer":"conservation pursued as strict enclosure hastens the very forgetting it is meant to prevent","answerIndex":0,"difficulty":"Hard","explanation":"The 'conservator's paradox' is stated explicitly: protection as embalming completes the forgetting it set out to arrest.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q51","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nEvery stepwell that is fenced, ticketed and floodlit tells a double story: one of rescue, and one of quiet estrangement. The conservationist arrives when the water has receded from memory, and his instruments — the plaque, the railing, the entry register — perform a curious alchemy: they transmute a place of use into an object of regard. What was once descended into is now merely looked at. We congratulate ourselves on having saved the structure, and we have; but we have saved it the way a taxidermist saves a tiger. Memory, unlike masonry, does not endure by being sealed against touch. It endures by circulation — by the woman who draws water, the children who count the steps, the festival that annually muddies the carvings. A monument withdrawn from use is withdrawn, by degrees, from meaning; the town walks past it as one walks past a stranger's photograph. This is the conservator's paradox: that protection, pursued as embalming, completes the very forgetting it set out to arrest. The truer preservation may be shabbier — worn steps, imperfect walls — but it keeps the one thing no scaffolding can hold up: the habit of belonging.","stem":"The comparison with a taxidermist's tiger serves to suggest that fenced monuments:","options":["are dangerous to the communities that live around them","are more valuable dead than a iers","A heritage law that bans all construction within a monument's precincts","A digital archive containing high-resolution scans of a ruined fort","A temple tank, its steps worn smooth, still used daily for ritual bathing by the neighbourhood"],"answer":"A temple tank, its steps worn smooth, still used daily for ritual bathing by the neighbourhood","answerIndex":3,"difficulty":"Hard","explanation":"'Truer preservation may be shabbier' but keeps the habit of belonging — the worn but living temple tank embodies this; the others enclose, archive or fence.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q53","section":"VA","format":"Reading Comprehension (2×4)","kind":"mcq","passage":"Read the passage and answer the questions that follow.\n\nEvery stepwell that is fenced, ticketed and floodlit tells a double story: one of rescue, and one of quiet estrangement. The conservationist arrives when the water has receded from memory, and his instruments — the plaque, the railing, the entry register — perform a curious alchemy: they transmute a place of use into an object of regard. What was once descended into is now merely looked at. We congratulate ourselves on having saved the structure, and we have; but we have saved it the way a taxidermist saves a tiger. Memory, unlike masonry, does not endure by being sealed against touch. It endures by circulation — by the woman who draws water, the children who count the steps, the festival that annually muddies the carvings. A monument withdrawn from use is withdrawn, by degrees, from meaning; the town walks past it as one walks past a stranger's photograph. This is the conservator's paradox: that protection, pursued as embalming, completes the very forgetting it set out to arrest. The truer preservation may be shabbier — worn steps, imperfect walls — but it keeps the one thing no scaffolding can hold up: the habit of belonging.","stem":"Which of the following observations, if accurate, would most weaken the author's case?","options":["At heritage sites left open to unrestricted daily use, most structures collapsed within decades and were then entirely forgotten, while ticketed sites retained both their fabric and strong festival participation by locals","Some ticketed monuments waive entry fees for local residents on festival days","A few conservationists privately agree that railings are unsightly","Stepwells in some districts were never used for drawing water even historically"],"answer":"At heritage sites left open to unrestricted daily use, most structures collapsed within decades and were then entirely forgotten, while ticketed sites retained both their fabric and strong festival participation by locals","answerIndex":0,"difficulty":"Hard","explanation":"If open use destroys structures and enclosure sustains both fabric and living participation, the claim that use preserves memory better than enclosure fails; the rest are marginal.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q54","section":"VA","format":"Vocabulary","kind":"mcq","passage":null,"stem":"Choose the word that best completes the sentence:\nThe negotiations collapsed because the minister remained ______, refusing every compromise the delegation proposed.","options":["gregarious","amenable","obdurate","vacillating"],"answer":"obdurate","answerIndex":2,"difficulty":"Hard","explanation":"'Obdurate' means stubbornly unyielding — consistent with refusing every compromise; the others contradict or mismatch the context.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q55","section":"VA","format":"Vocabulary","kind":"mcq","passage":null,"stem":"Choose the pair that best completes the sentence:\nHer ______ prose stood in deliberate contrast to the ______ style of her rivals.","options":["austere … florid","verbose … ornate","limpid … lucid","turgid … bombastic"],"answer":"austere … florid","answerIndex":0,"difficulty":"Hard","explanation":"'Austere' (plain, unadorned) genuinely contrasts with 'florid' (flowery); the other pairs are near-synonyms and provide no contrast.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q56","section":"VA","format":"Vocabulary","kind":"mcq","passage":null,"stem":"Choose the word closest in meaning to the underlined word:\nThe critic's mordant review of the debut novel spared neither the author nor the publisher.","options":["laudatory","caustic","tepid","equivocal"],"answer":"caustic","answerIndex":1,"difficulty":"Hard","explanation":"'Mordant' means biting or sharply critical — closest to 'caustic'.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q57","section":"VA","format":"Grammar","kind":"mcq","passage":null,"stem":"Identify the part of speech of the word in capitals:\nThe committee's swift RULING surprised everyone in the courtroom.","options":["Adverb","Verb","Adjective","Noun"],"answer":"Noun","answerIndex":3,"difficulty":"Medium","explanation":"'Ruling' here names the decision itself and is modified by 'swift' — it functions as a noun.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q58","section":"VA","format":"Grammar","kind":"mcq","passage":null,"stem":"Choose the option that best completes the sentence:\n______ the audit report earlier, the board would have averted the loss.","options":["If the auditors submit","Should the auditors submit","Had the auditors submitted","Have the auditors submitted"],"answer":"Had the auditors submitted","answerIndex":2,"difficulty":"Medium","explanation":"Third conditional with inversion: 'Had + subject + past participle' pairs with 'would have + past participle'.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q59","section":"VA","format":"Statement Odd-One-Out","kind":"mcq","passage":null,"stem":"Three of the following four words are alike in a certain way. Choose the one that is different:","options":["Ephemeral","Perennial","Transient","Fleeting"],"answer":"Perennial","answerIndex":1,"difficulty":"Medium","explanation":"Ephemeral, transient and fleeting all mean short-lived; perennial means enduring.","status":"approved","flags":[],"verified":"ok","verNote":""},{"id":"M003-Q60","section":"VA","format":"Statement Odd-One-Out","kind":"mcq","passage":null,"stem":"Three of the following four are alike in a certain way. Choose the one that is different:","options":["Repo Rate","Excise Duty","Open Market Operations","Cash Reserve Ratio"],"answer":"Excise Duty","answerIndex":1,"difficulty":"Hard","explanation":"Repo rate, CRR and OMOs are monetary policy instruments of the RBI; excise duty is a fiscal (tax) instrument of the government.","status":"approved","flags":[],"verified":"ok","verNote":""}];
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbx5Ojm_zp4LfsMeelx5e06KNjVH1wfsXdV0keS4407m4FO1HU4EpVb7GKj-ibAsxnspeA/exec";
var TEST_NAME=CFG.testName, MAX_MARKS=CFG.maxMarks, FILE_NAME=CFG.fileName, SN_KEY=CFG.snKey;
var NQ=QUESTIONS.length;
var PIN_REGEX=/^(STU|IMS)\d{10}$/;
var BLOCK_MSG="This is a Go Getters test \u2014 access is invite-only. Message Sahil Sir if you think you should be on the list.";
var NET_MSG="Couldn't verify access \u2014 check your internet connection and try again.";

/* ==================== AVAILABILITY WINDOW ====================
   UTC epochs. IST = UTC+5:30, so 00:00 IST = 18:30 UTC the previous day.
   Opens : Thu 20 Aug 2026, 00:00 IST
   Closes: Sun 23 Aug 2026, 00:00 IST (end of Saturday)
   Entry is blocked outside this window; an attempt already in progress
   when the window closes is allowed to finish and submit. */
var WIN_OPEN  = Date.UTC(2026,7,19,18,30,0);
var WIN_CLOSE = Date.UTC(2026,7,22,18,30,0);
var SHUT_MSG  = "This mock closed on Saturday at midnight. Your attempt window has ended.";

function winState(){
 var now=Date.now();
 if(now<WIN_OPEN)return "soon";
 if(now>=WIN_CLOSE)return "shut";
 return "open";
}
function fmtRemain(ms){
 var s=Math.max(0,Math.floor(ms/1000));
 var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
 if(d>0)return d+"d "+h+"h "+m+"m";
 if(h>0)return h+"h "+m+"m "+String(sec).padStart(2,"0")+"s";
 return m+"m "+String(sec).padStart(2,"0")+"s";
}
function paintWindow(){
 var note=document.getElementById("winNote"),btn=document.getElementById("loginBtn"),st=winState();
 if(!note||!btn)return st;
 note.className="";
 if(st==="soon"){
  note.className="soon";note.style.display="block";
  note.innerHTML="<b>OPENS SOON</b>Unlocks Thursday 20 August, 00:00 IST \u00b7 in "+fmtRemain(WIN_OPEN-Date.now());
  btn.disabled=true;btn.textContent="Locked";
 }else if(st==="shut"){
  note.className="shut";note.style.display="block";
  note.innerHTML="<b>CLOSED</b>"+SHUT_MSG;
  btn.disabled=true;btn.textContent="Closed";
 }else{
  note.style.display="block";
  note.innerHTML="<b>OPEN NOW</b>Closes Saturday midnight \u00b7 "+fmtRemain(WIN_CLOSE-Date.now())+" left";
  btn.disabled=false;btn.textContent="Start Test";
 }
 return st;
}

/* ==================== GO GETTERS ACCESS GATE (server-side, Apps Script v10.5) ====================
   Replaces the old client-side whitelist.json block (v5 §17), which FAILED OPEN
   and exposed the list in the public repo. This gate asks the Apps Script
   (?mode=gogetter) to check the private GoGetters_Whitelist sheet tab.
   Returns "allowed" | "denied" | "error". Anything but "allowed" blocks entry. */
async function checkGoGetterAccess(pin,batch){
 try{
  var res=await fetch(SCRIPT_URL+"?mode=gogetter&pin="+encodeURIComponent(pin)+"&batch="+encodeURIComponent(batch));
  var data=await res.json();
  if(data&&data.status==="success"&&data.allowed===true)return "allowed";
  if(data&&data.status==="error")return "error";
  return "denied";
 }catch(e){return "error"}
}

/* ==================== SAFETY NET — retry queue ==================== */
function snReadJSON(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function snWriteJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function snUnqueue(id){var p=snReadJSON("riim_pending",[]);p=p.filter(function(x){return x.id!==id});snWriteJSON("riim_pending",p)}
function snSendWithQueue(opts){
 var p=snReadJSON("riim_pending",[]);
 var id=Date.now()+"-"+Math.random().toString(36).slice(2);
 p.push({id:id,opts:{method:opts.method,mode:opts.mode,headers:opts.headers,body:opts.body}});
 snWriteJSON("riim_pending",p);
 return fetch(SCRIPT_URL,opts).then(function(r){snUnqueue(id);return r});
}
function snFlushQueue(){
 var p=snReadJSON("riim_pending",[]);
 p.forEach(function(item){fetch(SCRIPT_URL,item.opts).then(function(){snUnqueue(item.id)}).catch(function(){})});
}

/* ==================== STATE ==================== */
var studentName="",studentPin="",studentBatch="";
var currentQ=0,testOver=false,started=false;
var answers=new Array(NQ).fill(null);
var questionTimes=new Array(NQ).fill(0);
var secondsLeft=CFG.minutes*60;
var tickInt=null,qShownTs=0;

/* ==================== SESSION AUTOSAVE / RESUME ==================== */
function snSaveSession(){
 if(testOver||!started)return;
 snWriteJSON(SN_KEY,{file:FILE_NAME,testName:TEST_NAME,name:studentName,pin:studentPin,batch:studentBatch,currentQ:currentQ,answers:answers,questionTimes:questionTimes,secondsLeft:secondsLeft,ts:Date.now()});
}
function snClearSession(){try{localStorage.removeItem(SN_KEY)}catch(e){}}
async function snTryResume(){
 var s=snReadJSON(SN_KEY,null);
 if(!s||s.testName!==TEST_NAME)return false;
 if(winState()!=="open"){return false}
 var answered=(s.answers||[]).filter(function(a){return a!==null&&a!==""}).length;
 var ok=confirm("You have an unfinished attempt of "+TEST_NAME+" ("+answered+" question(s) answered). Resume where you left off?");
 if(!ok){snClearSession();return false}
 /* Go Getters: re-verify access on resume too, so a revoked PIN can't re-enter via a saved session */
 var verdict=await checkGoGetterAccess(s.pin,s.batch);
 if(verdict!=="allowed"){alert(verdict==="error"?NET_MSG:BLOCK_MSG);return false}
 studentName=s.name;studentPin=s.pin;studentBatch=s.batch;
 currentQ=Math.min(s.currentQ||0,NQ-1);
 if(s.answers&&s.answers.length===NQ)answers=s.answers;
 if(s.questionTimes&&s.questionTimes.length===NQ)questionTimes=s.questionTimes;
 if(typeof s.secondsLeft==="number")secondsLeft=Math.max(10,s.secondsLeft);
 enterTest();
 return true;
}

/* ==================== LOGIN ==================== */
function showLoginError(msg){var el=document.getElementById("loginErr");el.textContent=msg;el.style.display="block"}
async function startTest(){
 var name=document.getElementById("stuName").value.trim();
 var pinEl=document.getElementById("stuPin");
 var pin=pinEl.value.trim().toUpperCase();pinEl.value=pin;
 var batch=document.getElementById("stuBatch").value;
 var st=paintWindow();
 if(st==="soon"){showLoginError("This mock is not open yet. It unlocks Thursday 20 August at 00:00 IST.");return}
 if(st==="shut"){showLoginError(SHUT_MSG);return}
 if(!name){showLoginError("Please enter your full name.");return}
 if(!PIN_REGEX.test(pin)){showLoginError("Invalid PIN. Format: STU########## or IMS##########.");return}
 if(!batch){showLoginError("Please select your batch.");return}
 var btn=document.getElementById("loginBtn");
 btn.disabled=true;var prevTxt=btn.textContent;btn.textContent="Checking access\u2026";
 var verdict=await checkGoGetterAccess(pin,batch);
 btn.disabled=false;btn.textContent=prevTxt;
 if(verdict!=="allowed"){showLoginError(verdict==="error"?NET_MSG:BLOCK_MSG);return}
 studentName=name;studentPin=pin;studentBatch=batch;
 document.getElementById("loginErr").style.display="none";
 enterTest();
}
function enterTest(){
 started=true;
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("testScreen").style.display="block";
 buildPalette();
 tickInt=setInterval(function(){
  secondsLeft--;
  var t=document.getElementById("timer");if(t)t.textContent=fmtClock(secondsLeft);
  if(secondsLeft%10===0)snSaveSession();
  if(secondsLeft<=0)submitTest();
 },1000);
 renderQuestion();
 snSaveSession();
}

/* ==================== PALETTE (free navigation) ==================== */
function buildPalette(){
 var pal=document.getElementById("palette");pal.innerHTML="";
 for(var i=0;i<NQ;i++){
  (function(i){
   var b=document.createElement("button");b.id="pcell"+i;b.textContent=i+1;
   b.onclick=function(){jumpTo(i)};
   pal.appendChild(b);
  })(i);
 }
}
function paintPalette(){
 for(var i=0;i<NQ;i++){
  var c=document.getElementById("pcell"+i);if(!c)continue;
  c.className="";
  if(answers[i]!==null&&answers[i]!=="")c.classList.add("done");
  if(i===currentQ)c.classList.add("cur");
 }
}

/* ==================== RENDER + PER-QUESTION TIME ==================== */
function markTime(){
 if(qShownTs){questionTimes[currentQ]+=Math.round((Date.now()-qShownTs)/1000)}
 qShownTs=Date.now();
}
function fmtClock(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderQuestion(){
 var q=QUESTIONS[currentQ];
 qShownTs=Date.now();
 document.getElementById("tbName").textContent=TEST_NAME;
 document.getElementById("qCounter").textContent="Q "+(currentQ+1)+" / "+NQ;
 document.getElementById("timer").textContent=fmtClock(secondsLeft);
 document.getElementById("secBadge").textContent=q.section+" \u00b7 "+q.format+" \u00b7 "+q.difficulty+(q.options?"":" \u00b7 TITA");
 var pB=document.getElementById("passageBox");
 if(q.passage){pB.style.display="block";pB.textContent=q.passage}else{pB.style.display="none"}
 document.getElementById("qText").textContent=q.stem;
 var box=document.getElementById("optBox");box.innerHTML="";
 var letters=["A","B","C","D"];
 if(q.options){
  q.options.forEach(function(opt,idx){
   var d=document.createElement("button");
   d.className="opt"+(answers[currentQ]===idx?" sel":"");
   d.textContent=letters[idx]+". "+opt;
   d.onclick=function(){answers[currentQ]=idx;snSaveSession();renderQuestion()};
   box.appendChild(d);
  });
 }else{
  var inp=document.createElement("input");
  inp.className="tita";inp.placeholder="Type your answer";
  inp.value=answers[currentQ]||"";
  inp.oninput=function(){answers[currentQ]=this.value;snSaveSession();paintPalette()};
  box.appendChild(inp);
 }
 paintPalette();
}
function nav(d){markTime();currentQ=Math.max(0,Math.min(NQ-1,currentQ+d));snSaveSession();renderQuestion()}
function jumpTo(i){markTime();currentQ=i;snSaveSession();renderQuestion()}

/* ==================== SCORING HELPERS ==================== */
function isCorrect(q,a){
 if(a===null||a==="")return false;
 if(q.options)return a===q.answerIndex;
 return String(a).trim().toLowerCase()===String(q.answer).trim().toLowerCase();
}

/* ==================== MISTAKE BANK (spaced repetition) ==================== */
function bankMistakes(){
 try{
  var bank=snReadJSON("riim_mistakes",[]);
  var now=Date.now(),DAY=86400000;
  QUESTIONS.forEach(function(q,i){
   if(!q.options)return;
   var chosen=answers[i];
   if(chosen===null||chosen===q.answerIndex)return;
   var k=CFG.bankPrefix+"-Q"+(i+1);
   var existing=null;
   for(var j=0;j<bank.length;j++){if(bank[j].k===k){existing=bank[j];break}}
   if(existing){existing.box=1;existing.due=now+DAY;existing.chosen=chosen}
   else{bank.push({k:k,stem:(q.passage?q.passage+"\n\n"+q.stem:q.stem),opts:q.options,ans:q.answerIndex,chosen:chosen,exp:q.explanation,sub:q.format,src:TEST_NAME,box:1,due:now+DAY})}
  });
  if(bank.length>300)bank=bank.slice(bank.length-300);
  snWriteJSON("riim_mistakes",bank);
 }catch(e){}
}

/* ==================== SUBMIT — 16-field payload ==================== */
function fmtTime(totalSecs){var m=Math.floor(totalSecs/60);var s=totalSecs%60;return m+":"+(s<10?"0":"")+s}
function submitTest(){
 if(testOver)return;
 testOver=true;
 clearInterval(tickInt);
 markTime();

 var correctCount=0,wrongCount=0,skippedCount=0;
 var sectionErrors={},topicErrorMap={},wrongQuestions=[];
 var score=0;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  if(a===null||a===""){skippedCount++;return}
  if(isCorrect(q,a)){correctCount++;score+=CFG.c}
  else{
   wrongCount++;
   score+=(q.options?CFG.w:CFG.titaW);
   wrongQuestions.push(i+1);
   sectionErrors[q.section]=(sectionErrors[q.section]||0)+1;
   topicErrorMap[q.format]=(topicErrorMap[q.format]||0)+1;
  }
 });
 var totalSecs=CFG.minutes*60-Math.max(0,secondsLeft);
 var timeTakenStr=fmtTime(totalSecs);

 /* 16-field payload — explicit key:value, topicErrors is field 16 */
 var payload={
  testName:TEST_NAME,
  name:studentName,
  pin:studentPin,
  batch:studentBatch,
  score:score,
  correct:correctCount,
  wrong:wrongCount,
  skipped:skippedCount,
  maxMarks:MAX_MARKS,
  timeTaken:timeTakenStr,
  timestamp:new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"}),
  sectionErrors:JSON.stringify(sectionErrors),
  wrongQuestions:JSON.stringify(wrongQuestions),
  studentAnswers:JSON.stringify(answers),
  questionTimes:JSON.stringify(questionTimes),
  topicErrors:JSON.stringify(topicErrorMap)
 };

 snSendWithQueue({method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).catch(function(){});

 bankMistakes();

 try{
  var res=snReadJSON("riim_results",[]);
  res.push({testName:TEST_NAME,score:score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,maxMarks:MAX_MARKS,timeTaken:timeTakenStr,ts:Date.now()});
  if(res.length>200)res=res.slice(res.length-200);
  snWriteJSON("riim_results",res);
 }catch(e){}

 snClearSession();
 showResults(score,correctCount,wrongCount,skippedCount,timeTakenStr,sectionErrors);
}

/* ==================== RESULTS ==================== */
function showResults(score,correct,wrong,skipped,timeStr,sectionErrors){
 document.getElementById("testScreen").style.display="none";
 document.getElementById("resultsScreen").style.display="block";
 document.getElementById("resTitle").textContent=TEST_NAME+" \u2014 Results";
 document.getElementById("resSub").textContent=studentName+" \u00b7 "+studentBatch+" \u00b7 "+new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 document.getElementById("stScore").textContent=score;
 document.getElementById("stMaxL").textContent="SCORE / "+MAX_MARKS;
 document.getElementById("stCorrect").textContent=correct;
 document.getElementById("stWrong").textContent=wrong;
 document.getElementById("stSkipped").textContent=skipped;
 document.getElementById("stTime").textContent=timeStr;
 var secParts=[];
 for(var sk in sectionErrors){if(sectionErrors.hasOwnProperty(sk))secParts.push(sk+": "+sectionErrors[sk])}
 document.getElementById("secErrBox").innerHTML="<b>Section errors</b> \u2014 "+(secParts.length?secParts.join(" \u00b7 "):"None");

 var letters=["A","B","C","D"];
 var box=document.getElementById("reviewBox");box.innerHTML="";
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var wrap=document.createElement("div");wrap.className="rq";
  var head=document.createElement("div");head.className="rqHead";
  var status=skippedQ?"<span class='status sk'>SKIPPED</span>":ok?"<span class='status ok'>CORRECT</span>":"<span class='status no'>WRONG</span>";
  head.innerHTML="Q"+(i+1)+" \u00b7 "+q.section+" \u00b7 "+q.format+status;
  wrap.appendChild(head);
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   var pv=document.createElement("div");pv.className="rqStem";
   pv.style.fontStyle="italic";pv.style.opacity=".85";
   pv.textContent="Passage: "+q.passage;
   wrap.appendChild(pv);
  }
  var stem=document.createElement("div");stem.className="rqStem";stem.textContent=q.stem;wrap.appendChild(stem);
  if(q.options){
   q.options.forEach(function(opt,idx){
    var r=document.createElement("div");r.className="ropt";
    if(idx===q.answerIndex)r.classList.add("correct");
    else if(idx===a)r.classList.add("wrong");
    var l=document.createElement("div");l.textContent=letters[idx];
    var t=document.createElement("div");t.textContent=opt;
    r.appendChild(l);r.appendChild(t);
    wrap.appendChild(r);
   });
  }else{
   var yr=document.createElement("div");yr.className="ropt"+(skippedQ?"":(ok?" correct":" wrong"));
   yr.textContent="Your answer: "+(skippedQ?"\u2014":a);
   wrap.appendChild(yr);
   var kr=document.createElement("div");kr.className="ropt correct";
   kr.textContent="Key: "+q.answer;
   wrap.appendChild(kr);
  }
  var exp=document.createElement("div");exp.className="exp";
  exp.innerHTML="<b>Explanation:</b> ";
  exp.appendChild(document.createTextNode(q.explanation||""));
  wrap.appendChild(exp);
  box.appendChild(wrap);
 });
 window.scrollTo(0,0);
}

/* ==================== DOWNLOAD PDF ==================== */
function downloadPDF(){
 var jsPDFctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
 if(!jsPDFctor){alert("PDF library failed to load. Please check your connection and try again.");return}
 var doc=new jsPDFctor({unit:"pt",format:"a4"});
 var pageW=doc.internal.pageSize.getWidth();
 var pageH=doc.internal.pageSize.getHeight();
 var margin=40,y=margin;
 var letters=["A","B","C","D"];
 function newPageIfNeeded(h){if(y+h>pageH-margin){doc.addPage();y=margin}}
 function writeWrapped(text,x,maxW,size,style){
  doc.setFont("helvetica",style||"normal");doc.setFontSize(size);
  var lines=doc.splitTextToSize(text,maxW);
  for(var i=0;i<lines.length;i++){newPageIfNeeded(size+4);doc.text(lines[i],x,y);y+=size+4}
 }
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(13,27,42);
 doc.text("ROAD TO IIM",margin,y);y+=20;
 doc.setFontSize(13);doc.setTextColor(201,168,76);
 doc.text(TEST_NAME,margin,y);y+=18;
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(60,60,60);
 var dateStr=new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
 doc.text(studentName+" \u00b7 "+studentBatch+" \u00b7 "+dateStr,margin,y);y+=16;
 doc.setDrawColor(201,168,76);doc.line(margin,y,pageW-margin,y);y+=16;
 doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(11);
 doc.text("Summary",margin,y);y+=14;
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 var summary="Score: "+document.getElementById("stScore").textContent+" / "+MAX_MARKS+"   \u00b7   Correct: "+document.getElementById("stCorrect").textContent+"   \u00b7   Wrong: "+document.getElementById("stWrong").textContent+"   \u00b7   Skipped: "+document.getElementById("stSkipped").textContent+"   \u00b7   Time: "+document.getElementById("stTime").textContent;
 writeWrapped(summary,margin,pageW-2*margin,10);y+=4;
 var secErrText=(document.getElementById("secErrBox").textContent||"").replace(/\s+/g," ").trim();
 if(secErrText){writeWrapped(secErrText,margin,pageW-2*margin,10);y+=6}
 doc.setDrawColor(200,200,200);doc.line(margin,y,pageW-margin,y);y+=14;
 doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(13,27,42);
 doc.text("Question Review",margin,y);y+=16;
 QUESTIONS.forEach(function(q,i){
  var a=answers[i];
  var skippedQ=(a===null||a==="");
  var ok=isCorrect(q,a);
  var statusLabel=skippedQ?"SKIPPED":(ok?"CORRECT":"WRONG");
  newPageIfNeeded(60);
  doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);
  doc.text("Q"+(i+1)+"  \u00b7  "+q.section+" \u00b7 "+q.format+"   ["+statusLabel+"]",margin,y);y+=12;
  if(q.passage&&(i===0||QUESTIONS[i-1].passage!==q.passage)){
   doc.setTextColor(90,90,90);
   writeWrapped("Passage: "+q.passage,margin,pageW-2*margin,8,"italic");y+=2;
  }
  doc.setTextColor(0,0,0);
  writeWrapped(q.stem,margin,pageW-2*margin,10,"normal");y+=2;
  if(q.options){
   q.options.forEach(function(opt,idx){
    var marker="";
    if(idx===q.answerIndex)marker="  \u2713 correct";
    else if(idx===a)marker="  \u2717 your choice";
    if(idx===q.answerIndex)doc.setTextColor(30,120,60);
    else if(idx===a)doc.setTextColor(180,50,50);
    else doc.setTextColor(60,60,60);
    writeWrapped(letters[idx]+")  "+opt+marker,margin+12,pageW-2*margin-12,10,"normal");
   });
  }else{
   doc.setTextColor(skippedQ?120:(ok?30:180),skippedQ?120:(ok?120:50),skippedQ?120:(ok?60:50));
   writeWrapped("Your answer: "+(skippedQ?"-":a),margin+12,pageW-2*margin-12,10,"normal");
   doc.setTextColor(30,120,60);
   writeWrapped("Key: "+q.answer,margin+12,pageW-2*margin-12,10,"normal");
  }
  doc.setTextColor(0,0,0);y+=2;
  doc.setFont("helvetica","bold");doc.setFontSize(9);
  newPageIfNeeded(14);
  doc.text("Explanation:",margin,y);y+=11;
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  writeWrapped(q.explanation||"",margin,pageW-2*margin,9,"normal");
  y+=10;
  doc.setDrawColor(230,230,230);
  newPageIfNeeded(6);
  doc.line(margin,y,pageW-margin,y);y+=12;
 });
 var safeName=(studentName||"student").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
 var d=new Date();
 var dateTag=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 doc.save(CFG.bankPrefix+"_"+safeName+"_"+dateTag+".pdf");
}

document.getElementById("lgTitle").textContent=TEST_NAME;
document.getElementById("lgMeta").innerHTML=NQ+" questions \u00b7 +"+CFG.c+" / "+CFG.w+(CFG.hasTita?" \u00b7 TITA wrong "+CFG.titaW:"")+" \u00b7 Max "+MAX_MARKS+"<br>"+CFG.minutes+" minutes \u00b7 "+(CFG.navNote||"free navigation")+" \u00b7 auto-submit at 00:00";
document.getElementById("loginBtn").addEventListener("click",startTest);
paintWindow();
setInterval(function(){ if(!started)paintWindow(); },1000);
snFlushQueue();
snTryResume();
</script>
